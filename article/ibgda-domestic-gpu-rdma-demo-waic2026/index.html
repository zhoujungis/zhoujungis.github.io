<hr>
<h2>三、IBGDA DEMO：国产 GPU 与 RDMA 网卡的深度协同</h2>
<h3>3.1 技术背景：为什么 MoE 需要 IBGDA？</h3>

在 <strong>MoE（Mixture of Experts）</strong> 模型典型训练或推理中，<strong>专家并行（Expert Parallelism）</strong>通信包含两个核心阶段：
<ul>
<li><strong>Dispatch（分发）</strong>：把 token 路由到对应专家</li>
<li><strong>Combine（聚合）</strong>：把专家输出汇总回原 token</li>
</ul>

这两个阶段涉及<strong>海量小粒度数据交换</strong>——这是 AI 集群通信的"老大难"。

在传统跨节点通信中，GPU 必须经由 CPU 中转指令，产生<strong>额外延迟</strong>与 <strong>CPU 开销</strong>。而 <strong>IBGDA（InfiniBand GPU Direct Async）</strong> 技术正是为解决这个问题而生：通过<strong>绕过 CPU 处理环节</strong>，显著降低指令中转等待时间，在 <strong>All-to-All 通信</strong>场景中实现<strong>吞吐提升</strong>与<strong>延迟压降</strong>。
<h3>3.2 国际对标与国产缺口</h3>
<table>
<thead>
<tr>
<th>阵营</th>
<th>现状</th>
</tr>
</thead>
<tbody>
<tr>
<td>🟢 英伟达</td>
<td>凭借 <strong>GPU + ConnectX 系列网卡</strong> 深度协同，率先实现 IBGDA 方案</td>
</tr>
<tr>

</tr>

<td>🟡 国产 RDMA 网卡</td>
<td>与国产 GPU 在软硬件层面完成适配，方能实现 GPU 直通网卡高效通信</td>
</tr>

奇异摩尔的 IBGDA Demo 正是为了填补这块空白。
<h3>3.3 奇异摩尔 IBGDA 方案规格</h3>

<strong>产品规格一览：</strong>
<ul>
<li>✅ <strong>单通道 400G RDMA ASIC 引擎</strong></li>
<li>✅ 基于 <strong>Kiwi SNIC 800G</strong> 平台架构设计</li>
<li>✅ 完成<strong>软硬件协同开发</strong></li>
<li>✅ 兼容专为 MoE 模型优化的<strong>集合通信库</strong>（对标 DeepEP）</li>
<li>✅ <strong>原生支持 IBGDA</strong>（GPU 直接发起通信）机制</li>
</ul>

<img alt="Kiwi SNIC 800G 平台架构" src="https://zhoujungis.github.io/photos/kiwi-snic-arch.svg">
<blockquote>

上图为 <strong>Kiwi SNIC 800G</strong> 平台架构：左端为搭载类 NVSHMEM / DeepEP 通信库的国产 GPU，中间是单通道 400G RDMA ASIC 引擎（含 PCIe Gen5 主机接口、IBGDA 核心、可靠传输 / QP 调度、400G MAC + 112G SerDes），右端为开放以太网侧的国产 ToR / Spine 交换机。整套方案基于<strong>开放以太网</strong>生态构建，为国产算力集群提供兼具高性能与自主性的 Scale-Out 网络选择。
</blockquote>
<h3>3.4 核心测试结果</h3>

该 IBGDA Demo 测试平台对标英伟达 IBGDA 测试数据，实测结果达到相应水平：

<img alt="IBGDA vs 传统 IBRC 性能对比" src="https://zhoujungis.github.io/photos/ibgda-perf-chart.svg">
<blockquote>

上图为 <strong>IBGDA vs 传统 IBRC</strong> 方案在 All-to-All 场景下的实测对比：左半部分为四组吞吐量对比（单次小消息带宽、原始小包吞吐、合并发送吞吐、All-to-All 带宽），蓝色为 IBGDA 直通方案，灰色为传统 IBRC 方案；下方为延迟对比（18 μs → 10 μs，缩短约 44%）；右半部分为核心指标提升小结。
</blockquote>
<table>
<thead>
<tr>
<th>指标</th>
<th>提升效果</th>
</tr>
</thead>
<tbody>
<tr>
<td>单次小消息带宽</td>
<td><strong>显著跃升</strong>（15 → 52 GB/s，提升约 247%）</td>
</tr>
<tr>
<td>原始小包吞吐量</td>
<td><strong>实现质的跨越</strong>（22 → 75 GB/s，提升约 240%）</td>
</tr>
<tr>
<td>合并发送吞吐量</td>
<td><strong>实现质的跨越</strong>（28 → 82 GB/s，提升约 193%）</td>
</tr>
<tr>
<td><strong>All-to-All 通信延迟</strong></td>
<td><strong>大幅缩短，接近翻倍提升</strong>（18 → 10 μs，压降 44%）</td>
</tr>
<tr>
<td>小包惩罚</td>
<td><strong>被彻底消除</strong></td>
</tr>
</tbody>
</table>
<blockquote>

💡 <strong>关键洞察</strong>：延迟压降 44%、吞吐量翻倍，最直接的收益是 MoE 训练 / 推理的"专家通信墙"被打破；同时 CPU 算力被释放回前台任务，<strong>整体集群吞吐</strong>与<strong>单节点算力利用率</strong>同时得到改善。
</blockquote>
<hr>
<h2>四、布局 OSU 超节点互联芯粒，锚定下一代光互联</h2>
<h3>4.1 《共封装光学（CPO）技术白皮书》正式发布</h3>

<img alt="共封装光学（CPO）技术白皮书发布" src="https://zhoujungis.github.io/photos/cpo-whitepaper.svg">
<blockquote>

上图为《共封装光学（CPO）技术白皮书》发布示意：中央为本届正式发布的白皮书封面，两侧列出<strong>发起方</strong>与<strong>参与编写单位</strong>，右下角归纳白皮书的五大发布意义。
</blockquote>

<strong>发起与参与单位：</strong>
<ul>
<li><strong>发起方</strong>：香港科技大学（广州）</li>
<li><strong>参与编写</strong>：奇异摩尔、曦望 Sunrise、壁仞科技、图灵量子、奇点光子</li>
</ul>
<h3>4.2 光互联演进路径：越近越强</h3>

白皮书清晰勾勒了光互联从"插拔"到"内生"的五阶段路径：

<img alt="光互联演进路径" src="https://zhoujungis.github.io/photos/optics-evolution.svg">
<blockquote>

上图展示了光互联技术的五阶段演进：<strong>可插拔光模块 → NPO → CPO → OIO → 光内生（集成于计算芯片内部）</strong>。越靠近计算单元，互联距离越短，可省去 DSP，从而<strong>降低延迟、简化系统设计、降低功耗与成本</strong>。奇异摩尔重点布局 CPO 阶段，与生态伙伴共同推进下一阶段。
</blockquote>
<h3>4.3 奇异摩尔的芯粒布局</h3>

奇异摩尔已前瞻性布局 <strong>OSU（Optical Scale-Up）IO 芯粒产品</strong>与未来 CPO 迭代方案的<strong>融合路径</strong>。

<img alt="OSU IO 芯粒与 CPO 融合架构" src="https://zhoujungis.github.io/photos/osu-osio-arch.svg">
<blockquote>

上图为 <strong>OSU IO 芯粒 + CPO 融合架构</strong>：在先进封装基板上，xPU 芯粒（国产 GPU/NPU）、OSU IO 芯粒（电信号 → 光信号调制）、CPO 共封装光学模块（激光器 / 调制器 / 光波导 / 探测器）三者协同，通过光纤向外输出。与传统可插拔方案相比，<strong>延迟更低、功耗更低、带宽密度更高</strong>。
</blockquote>
<h3>4.4 生态合作成果</h3>
<ul>

<li><strong>Agent 应用带来的调用量爆发</strong> —— Agent 范式推动推理调用频次陡升</li>
</ol>
