<td><code>NORMAL</code></td>
<td><strong>不同步</strong></td>
<td>同步</td>
</tr>
<tr>
<td><code>FULL</code></td>
<td>同步</td>
<td>同步</td>
</tr>
</tbody>
</table></div>

<code>NORMAL</code> 为什么敢不在提交时同步？因为 WAL 模式下提交只往日志<strong>追加</strong>字节，不改数据文件；崩溃最多丢日志尾部——而日志尾部本来就允许丢（遇坏即停），数据文件则由 checkpoint 的同步兜底。<code>wal.c</code> 里那段著名注释把好处点破了：
<div class="codehilite"><pre><span></span><code><span class="o">**</span><span class="w"> </span><span class="n">All</span><span class="w"> </span><span class="n">I</span><span class="o">/</span><span class="n">O</span><span class="w"> </span><span class="n">barrier</span><span class="w"> </span><span class="n">operations</span><span class="w"> </span><span class="p">(</span><span class="n">a</span><span class="p">.</span><span class="n">k</span><span class="p">.</span><span class="n">a</span><span class="w"> </span><span class="n">fsyncs</span><span class="p">)</span><span class="w"> </span><span class="n">occur</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="n">this</span><span class="w"> </span><span class="n">routine</span><span class="w"> </span><span class="n">when</span>
<span class="o">**</span><span class="w"> </span><span class="n">SQLite</span><span class="w"> </span><span class="n">is</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="n">WAL</span><span class="o">-</span><span class="n">mode</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="n">synchronous</span><span class="o">=</span><span class="n">NORMAL</span><span class="p">.</span><span class="w">  </span><span class="n">That</span><span class="w"> </span><span class="n">means</span><span class="w"> </span><span class="n">that</span><span class="w"> </span><span class="k">if</span>
<span class="o">**</span><span class="w"> </span><span class="n">checkpoints</span><span class="w"> </span><span class="n">are</span><span class="w"> </span><span class="k">always</span><span class="w"> </span><span class="n">run</span><span class="w"> </span><span class="n">by</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="n">background</span><span class="w"> </span><span class="n">thread</span><span class="w"> </span><span class="k">or</span><span class="w"> </span><span class="n">background</span>
<span class="o">**</span><span class="w"> </span><span class="n">process</span><span class="p">,</span><span class="w"> </span><span class="n">foreground</span><span class="w"> </span><span class="n">threads</span><span class="w"> </span><span class="n">will</span><span class="w"> </span><span class="n">never</span><span class="w"> </span><span class="n">block</span><span class="w"> </span><span class="n">on</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="n">lengthy</span><span class="w"> </span><span class="n">fsync</span><span class="w"> </span><span class="n">call</span><span class="p">.</span>
</code></pre></div>


<strong>同步从提交路径挪到了 checkpoint 路径</strong>，前台线程不再被 fsync 卡住，代价是进程崩溃可能丢掉最后几笔提交（但数据库永远是一致的）。<code>FULL</code> 则每笔提交都过一道 I/O 屏障——丢的只是未提交数据，一行都不会少。三档的本质不是「安全级别」，而是<strong>「你愿意在哪个环节赌多大的丢失窗口」</strong>。
<h2>checkpoint：日志不能无限长</h2>

WAL 只追加，数据文件原地不动——总得有人把日志内容搬回数据文件，这就是 checkpoint。搬完之后日志何去何从，构成了四种模式。先看枚举定义（<code>sqlite.h.in</code>，注意不在 <code>wal.h</code>）：
<div class="codehilite"><pre><span></span><code><span class="cp">#define SQLITE_CHECKPOINT_NOOP    -1  </span><span class="cm">/* Do no work at all */</span>
<span class="cp">#define SQLITE_CHECKPOINT_PASSIVE  0  </span><span class="cm">/* Do as much as possible w/o blocking */</span>
<span class="cp">#define SQLITE_CHECKPOINT_FULL     1  </span><span class="cm">/* Wait for writers, then checkpoint */</span>
<span class="cp">#define SQLITE_CHECKPOINT_RESTART  2  </span><span class="cm">/* Like FULL but wait for readers */</span>
<span class="cp">#define SQLITE_CHECKPOINT_TRUNCATE 3  </span><span class="cm">/* Like RESTART but also truncate WAL */</span>
</code></pre></div>


四档是严格递进的：<code>PASSIVE</code> 不等任何人、能回填多少算多少；<code>FULL</code> 抢写锁、等写入者让路，回填不完返回 BUSY；<code>RESTART</code> 再等读者退出，好让日志<strong>从头复用</strong>（配合换盐）；<code>TRUNCATE</code> 在此基础上把日志文件截成 0 字节。模式差异的代码在 <code>walCheckpoint</code>：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">eMode</span><span class="o">!=</span><span class="n">SQLITE_CHECKPOINT_PASSIVE</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">writeLock</span><span class="w"> </span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pInfo</span><span class="o">-&gt;</span><span class="n">nBackfill</span><span class="o">&lt;</span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">hdr</span><span class="p">.</span><span class="n">mxFrame</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">SQLITE_BUSY</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">eMode</span><span class="o">&gt;=</span><span class="n">SQLITE_CHECKPOINT_RESTART</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="n">u32</span><span class="w"> </span><span class="n">salt1</span><span class="p">;</span>
<span class="w">      </span><span class="n">sqlite3_randomness</span><span class="p">(</span><span class="mi">4</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">salt1</span><span class="p">);</span>
<span class="w">      </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">pInfo</span><span class="o">-&gt;</span><span class="n">nBackfill</span><span class="o">==</span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">hdr</span><span class="p">.</span><span class="n">mxFrame</span><span class="w"> </span><span class="p">);</span>
<span class="w">      </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">walBusyLock</span><span class="p">(</span><span class="n">pWal</span><span class="p">,</span><span class="w"> </span><span class="n">xBusy</span><span class="p">,</span><span class="w"> </span><span class="n">pBusyArg</span><span class="p">,</span><span class="w"> </span><span class="n">WAL_READ_LOCK</span><span class="p">(</span><span class="mi">1</span><span class="p">),</span><span class="w"> </span><span class="n">WAL_NREADER</span><span class="mi">-1</span><span class="p">);</span>
<span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">        </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">eMode</span><span class="o">==</span><span class="n">SQLITE_CHECKPOINT_TRUNCATE</span><span class="w"> </span><span class="p">){</span>
</code></pre></div>


<code>TRUNCATE</code> 分支的尾部把两件事一起做了——换盐 + 截断：
<div class="codehilite"><pre><span></span><code><span class="w">          </span><span class="n">walRestartHdr</span><span class="p">(</span><span class="n">pWal</span><span class="p">,</span><span class="w"> </span><span class="n">salt1</span><span class="p">);</span>
<span class="w">          </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">sqlite3OsTruncate</span><span class="p">(</span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">pWalFd</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">);</span>
</code></pre></div>


还有一层降级语义藏在 <code>sqlite3WalCheckpoint</code>：非 <code>PASSIVE</code> 模式要抢写锁，抢不到不报错，而是<strong>降级成 <code>PASSIVE</code></strong> 继续干：
<div class="codehilite"><pre><span></span><code><span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">eMode</span><span class="o">!=</span><span class="n">SQLITE_CHECKPOINT_PASSIVE</span><span class="w"> </span><span class="p">){</span>
<span class="w">        </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">walBusyLock</span><span class="p">(</span><span class="n">pWal</span><span class="p">,</span><span class="w"> </span><span class="n">xBusy2</span><span class="p">,</span><span class="w"> </span><span class="n">pBusyArg</span><span class="p">,</span><span class="w"> </span><span class="n">WAL_WRITE_LOCK</span><span class="p">,</span><span class="w"> </span><span class="mi">1</span><span class="p">);</span>
<span class="w">        </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">          </span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">writeLock</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_BUSY</span><span class="w"> </span><span class="p">){</span>
<span class="w">          </span><span class="n">eMode2</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">SQLITE_CHECKPOINT_PASSIVE</span><span class="p">;</span>
<span class="w">          </span><span class="n">xBusy2</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">          </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">SQLITE_OK</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">      </span><span class="p">}</span>
</code></pre></div>


checkpoint 本质上是后台维护，做一半总比完全不做强——<strong>「尽力而为 + 明确报告」比「要么全做要么不做」在实践里更有用</strong>。

和上一节的 fsync 表格连起来看，完整的持久化分工是：<code>NORMAL</code> 下日志尾部可能丢，但 checkpoint 把已回填的部分 fsync 进数据文件；日志再从 checkpoint 点继续。<strong>数据文件的每一次变更都先于它自己的同步屏障</strong>，这个不变式就是「崩溃后打开永远一致」的全部内容。
<h2>恢复模式：损坏发生时你要哪种世界线</h2>

恢复程序读到坏字节之后该干什么？LevelDB 一路沿用「容忍尾巴损坏」；RocksDB 把这个决策做成了显式的四选一。<code>include/rocksdb/options.h</code> 的枚举与注释逐字如下：
<div class="codehilite"><pre><span></span><code><span class="k">enum</span><span class="w"> </span><span class="k">class</span><span class="w"> </span><span class="nc">WALRecoveryMode</span><span class="w"> </span><span class="o">:</span><span class="w"> </span><span class="kt">char</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="c1">// Original levelDB recovery</span>
<span class="w">  </span><span class="c1">//</span>
<span class="w">  </span><span class="c1">// We tolerate the last record in any log to be incomplete due to a crash</span>
<span class="w">  </span><span class="c1">// while writing it. Zeroed bytes from preallocation are also tolerated in the</span>
<span class="w">  </span><span class="c1">// trailing data of any log.</span>
<span class="w">  </span><span class="c1">//</span>
<span class="w">  </span><span class="c1">// Use case: Applications for which updates, once applied, must not be rolled</span>
<span class="w">  </span><span class="c1">// back even after a crash-recovery. In this recovery mode, RocksDB guarantees</span>
<span class="w">  </span><span class="c1">// this as long as `WritableFile::Append()` writes are durable. In case the</span>
<span class="w">  </span><span class="c1">// user needs the guarantee in more situations (e.g., when</span>
<span class="w">  </span><span class="c1">// `WritableFile::Append()` writes to page cache, but the user desires this</span>
<span class="w">  </span><span class="c1">// guarantee in face of power-loss crash-recovery), RocksDB offers various</span>
<span class="w">  </span><span class="c1">// mechanisms to additionally invoke `WritableFile::Sync()` in order to</span>
<span class="w">  </span><span class="c1">// strengthen the guarantee.</span>
<span class="w">  </span><span class="c1">//</span>
<span class="w">  </span><span class="c1">// This differs from `kPointInTimeRecovery` in that, in case a corruption is</span>
<span class="w">  </span><span class="c1">// detected during recovery, this mode will refuse to open the DB. Whereas,</span>
<span class="w">  </span><span class="c1">// `kPointInTimeRecovery` will stop recovery just before the corruption since</span>
<span class="w">  </span><span class="c1">// that is a valid point-in-time to which to recover.</span>
<span class="w">  </span><span class="n">kTolerateCorruptedTailRecords</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mh">0x00</span><span class="p">,</span>
<span class="w">  </span><span class="c1">// Recover from clean shutdown</span>
<span class="w">  </span><span class="c1">// We don&#39;t expect to find any corruption in the WAL</span>
<span class="w">  </span><span class="c1">// Use case : This is ideal for unit tests and rare applications that</span>
<span class="w">  </span><span class="c1">// can require high consistency guarantee</span>
<span class="w">  </span><span class="n">kAbsoluteConsistency</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mh">0x01</span><span class="p">,</span>
<span class="w">  </span><span class="c1">// Recover to point-in-time consistency (default)</span>
<span class="w">  </span><span class="c1">// We stop the WAL playback on discovering WAL inconsistency</span>
<span class="w">  </span><span class="c1">// Use case : Ideal for systems that have disk controller cache like</span>
<span class="w">  </span><span class="c1">// hard disk, SSD without super capacitor that store related data</span>
<span class="w">  </span><span class="n">kPointInTimeRecovery</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mh">0x02</span><span class="p">,</span>
<span class="w">  </span><span class="c1">// Recovery after a disaster</span>
<span class="w">  </span><span class="c1">// We ignore any corruption in the WAL and try to salvage as much data as</span>
<span class="w">  </span><span class="c1">// possible</span>
<span class="w">  </span><span class="c1">// Use case : Ideal for last ditch effort to recover data or systems that</span>
<span class="w">  </span><span class="c1">// operate with low grade unrelated data</span>
<span class="w">  </span><span class="n">kSkipAnyCorruptedRecords</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mh">0x03</span><span class="p">,</span>
<span class="p">};</span>
</code></pre></div>


四档从「宁可不启动」到「宁可丢数据也要开」排列，默认值是 <code>kPointInTimeRecovery</code>。注释里那句 <strong>"that is a valid point-in-time to which to recover"</strong> 是整个 WAL 恢复哲学的浓缩：<strong>坏点之前的日志是一个合法的时间断面，恢复到那里不算丢数据，算守住承诺</strong>。

分叉的执行点在 <code>db_impl_open.cc</code> 的 <code>HandleNonOkStatusOrOldLogRecord</code>：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">immutable_db_options_</span><span class="p">.</span><span class="n">wal_recovery_mode</span><span class="w"> </span><span class="o">==</span>
<span class="w">      </span><span class="n">WALRecoveryMode</span><span class="o">::</span><span class="n">kSkipAnyCorruptedRecords</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// We should ignore all errors unconditionally</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">Status</span><span class="o">::</span><span class="n">OK</span><span class="p">();</span>
<span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">immutable_db_options_</span><span class="p">.</span><span class="n">wal_recovery_mode</span><span class="w"> </span><span class="o">==</span>
<span class="w">             </span><span class="n">WALRecoveryMode</span><span class="o">::</span><span class="n">kPointInTimeRecovery</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="n">immutable_db_options_</span><span class="p">.</span><span class="n">wal_recovery_mode</span><span class="w"> </span><span class="o">==</span>
<span class="w">               </span><span class="n">WALRecoveryMode</span><span class="o">::</span><span class="n">kTolerateCorruptedTailRecords</span><span class="w"> </span><span class="o">||</span>
<span class="w">           </span><span class="n">immutable_db_options_</span><span class="p">.</span><span class="n">wal_recovery_mode</span><span class="w"> </span><span class="o">==</span>
<span class="w">           </span><span class="n">WALRecoveryMode</span><span class="o">::</span><span class="n">kAbsoluteConsistency</span><span class="p">);</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">status</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


而恢复主循环拿到损坏的方式是把模式直接传给读端：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="kt">bool</span><span class="w"> </span><span class="n">read_record</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">reader</span><span class="o">-&gt;</span><span class="n">ReadRecord</span><span class="p">(</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">record</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">scratch</span><span class="p">,</span><span class="w"> </span><span class="n">immutable_db_options_</span><span class="p">.</span><span class="n">wal_recovery_mode</span><span class="p">,</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">record_checksum</span><span class="p">);</span>

<span class="w">    </span><span class="c1">// `reader-&gt;ReadRecord` will change `status` through reporter in `reader`</span>
<span class="w">    </span><span class="c1">// when a corruption is encountered</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!</span><span class="n">read_record</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="o">!</span><span class="n">status</span><span class="p">.</span><span class="n">ok</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
</code></pre></div>


<strong>「遇坏即停」是不变的底层事实，四个模式改变的只是停完之后的处置</strong>：拒绝启动（<code>kAbsoluteConsistency</code>）、停在坏点前（<code>kPointInTimeRecovery</code>）、把尾巴当正常结束（<code>kTolerateCorruptedTailRecords</code>）、跳过坏记录继续挖（<code>kSkipAnyCorruptedRecords</code>）。底层机制与策略被干净地分成了两层——这是 LevelDB 时代没有的工程成熟度。
<h2>读端可见性：快照上界是怎么来的</h2>

恢复回答「日志里有多少帧是合法的」，读端还要回答「我这个快照该看到哪一帧」。SQLite 把答案存成一个数：<code>mxFrame</code>。<code>walFindFrame</code> 的开头就是快照的两个边界：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">u32</span><span class="w"> </span><span class="n">iRead</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span><span class="w">                  </span><span class="cm">/* If !=0, WAL frame to return data from */</span>
<span class="w">  </span><span class="n">u32</span><span class="w"> </span><span class="n">iLast</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">hdr</span><span class="p">.</span><span class="n">mxFrame</span><span class="p">;</span><span class="w">  </span><span class="cm">/* Last page in WAL for this reader */</span>
<span class="w">  </span><span class="p">...</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">iLast</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="p">(</span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">readLock</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">bShmUnreliable</span><span class="o">==</span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="o">*</span><span class="n">piRead</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">SQLITE_OK</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


<code>iLast</code> 是开读事务那一刻从 wal-index 头快照下来的合法帧上界；哈希查找时，候选帧必须同时落在上下界之内才被采纳：
<div class="codehilite"><pre><span></span><code><span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">iFrame</span><span class="o">&lt;=</span><span class="n">iLast</span>
<span class="w">       </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">iFrame</span><span class="o">&gt;=</span><span class="n">pWal</span><span class="o">-&gt;</span><span class="n">minFrame</span>
<span class="w">       </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">sLoc</span><span class="p">.</span><span class="n">aPgno</span><span class="p">[(</span><span class="n">iH</span><span class="mi">-1</span><span class="p">)</span><span class="o">&amp;</span><span class="p">(</span><span class="n">HASHTABLE_NPAGE</span><span class="mi">-1</span><span class="p">)]</span><span class="o">==</span><span class="n">pgno</span>
<span class="w">      </span><span class="p">){</span>
<span class="w">        </span><span class="n">iRead</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">iFrame</span><span class="p">;</span>
<span class="w">      </span><span class="p">}</span>
</code></pre></div>


对同一页号取<strong>最大的合法帧号</strong>——同页多版本，快照边界决定取哪版。<code>iLast</code> 的来源正是恢复与校验那一整套机制（盐 + 链式校验和 + 提交帧推进），<strong>读端不需要自己再验一遍完整性，它消费的是恢复端已经证明过的结论</strong>。写端、恢复端、读端三层各司其职，中间只传递一个 <code>mxFrame</code>。
<h2>WAL 是门通用手艺：MANIFEST 与 NanoDB 的 JSON Lines</h2>

WAL 不属于「数据库」，它属于「任何不能承受就地改写事故的追加式系统」。两个旁证：

<strong>LevelDB 的 MANIFEST 就是同一个 log 格式再就业。</strong> 元数据版本（哪些文件属于当前 SST 集合）的变更日志，用的正是 WAL 那套 <code>log::Writer</code>。<code>version_set.cc</code> 的 <code>LogAndApply</code>：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="c1">// Write new record to MANIFEST log</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">s</span><span class="p">.</span><span class="n">ok</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="n">std</span><span class="o">::</span><span class="n">string</span><span class="w"> </span><span class="n">record</span><span class="p">;</span>
<span class="w">      </span><span class="n">edit</span><span class="o">-&gt;</span><span class="n">EncodeTo</span><span class="p">(</span><span class="o">&amp;</span><span class="n">record</span><span class="p">);</span>
<span class="w">      </span><span class="n">s</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">descriptor_log_</span><span class="o">-&gt;</span><span class="n">AddRecord</span><span class="p">(</span><span class="n">record</span><span class="p">);</span>
<span class="w">      </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">s</span><span class="p">.</span><span class="n">ok</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">s</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">descriptor_file_</span><span class="o">-&gt;</span><span class="n">Sync</span><span class="p">();</span>
<span class="w">      </span><span class="p">}</span>
</code></pre></div>


恢复时对称地用 <code>log::Reader</code> 逐条解出来再应用：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="n">log</span><span class="o">::</span><span class="n">Reader</span><span class="w"> </span><span class="nf">reader</span><span class="p">(</span><span class="n">file</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">reporter</span><span class="p">,</span><span class="w"> </span><span class="nb">true</span><span class="w"> </span><span class="cm">/*checksum*/</span><span class="p">,</span>
<span class="w">                       </span><span class="mi">0</span><span class="w"> </span><span class="cm">/*initial_offset*/</span><span class="p">);</span>
<span class="w">    </span><span class="n">Slice</span><span class="w"> </span><span class="n">record</span><span class="p">;</span>
<span class="w">    </span><span class="n">std</span><span class="o">::</span><span class="n">string</span><span class="w"> </span><span class="n">scratch</span><span class="p">;</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="p">(</span><span class="n">reader</span><span class="p">.</span><span class="n">ReadRecord</span><span class="p">(</span><span class="o">&amp;</span><span class="n">record</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">scratch</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">ok</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="n">VersionEdit</span><span class="w"> </span><span class="n">edit</span><span class="p">;</span>
<span class="w">      </span><span class="n">s</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">edit</span><span class="p">.</span><span class="n">DecodeFrom</span><span class="p">(</span><span class="n">record</span><span class="p">);</span>
</code></pre></div>


<strong>「崩溃后元数据不许自相矛盾」和「崩溃后数据不许丢」是同一个问题</strong>，所以 LevelDB 直接复用了同一套格式、校验和恢复代码——一个 log 层服务两类文件，这是最省事也最不会出 bug 的做法。

<strong>SQLite 的 WAL 记录页镜像，LevelDB 记录操作，NanoDB 记录 JSON Lines。</strong> 上一篇《<a href="/article/nanodb/">NanoDB：Go 嵌入式文档数据库</a>》里，<code>wal.log</code> 每行是一条 JSON 记录，恢复时逐行解析、遇到解析不了的行就停。格式从二进制换成了文本，但从 <code>walDecodeFrame</code> 到 <code>ReadRecord</code> 的那条铁律一字未改：<strong>连续通过校验的前缀才作数</strong>。三套实现，同一条契约——这就是为什么读格式之前要先立契约。
<h2>自研 WAL 设计清单</h2>

把全文的源码证据折叠成一份可执行的清单。动手写之前逐项过一遍，每项后面是它对应的「事故」：
<div class="table-scroll"><table>
<thead>
<tr>
<th>#</th>
<th>设计决策</th>
<th>事故</th>
<th>源码里的榜样</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>文件头带 magic + 版本 + 自校验</td>
<td>拿错文件 / 头被写坏当有效</td>
<td>SQLite 32 字节头，坏头 <code>goto finished</code></td>
</tr>
<tr>
<td>2</td>
<td>记录头带长度与校验和，覆盖 type</td>
<td>撕裂、位翻转被当数据</td>
<td>LevelDB 7 字节头，CRC 覆盖 type + payload</td>
</tr>
<tr>
<td>3</td>
<td>校验和链式（前一条作初值）</td>
<td>中段被改而前后各自自洽</td>
<td><code>walChecksumBytes(native, ..., aCksum, aCksum)</code></td>
</tr>
<tr>
<td>4</td>
<td>恢复遇坏即停，不重新同步找下一帧</td>
<td>垃圾字节被回放</td>
<td><code>if( !isValid ) break;</code> / <code>buffer_.clear()</code></td>
</tr>
<tr>
<td>5</td>
<td>半条逻辑记录整条丢弃</td>
<td>半个事务进入内存</td>
<td><code>kEof</code> 时 <code>scratch-&gt;clear()</code></td>
</tr>
<tr>
<td>6</td>
<td>专用提交标记（或批次完整性）</td>
<td>中途崩溃留下半个事务</td>
<td><code>nTruncate != 0</code> / <code>count</code> 校验</td>
</tr>
<tr>
<td>7</td>
<td>先写日志，同步成功才改内存与数据文件</td>
<td>「已提交」断电蒸发</td>
<td><code>AddRecord</code> → <code>Sync</code> → <code>InsertInto</code></td>
</tr>
<tr>
<td>8</td>
<td>日志回卷必须换代身份</td>
<td>新旧帧混合冒充有效</td>
<td><code>walRestartHdr</code>：salt1 自增 + salt2 随机</td>
</tr>
<tr>
<td>9</td>
<td>同步点显式化并可分档</td>
<td>每笔提交都付全价，或从不付账</td>
<td><code>WAL_SYNC_FLAGS</code> / <code>CKPT_SYNC_FLAGS</code> 分工</td>
</tr>
<tr>
<td>10</td>
<td>checkpoint 尽力而为 + 模式化收尾</td>
<td>日志无限长，或收尾卡死业务</td>
<td><code>PASSIVE</code> 抢不到锁就降级</td>
</tr>
<tr>
<td>11</td>
<td>损坏处置做成策略而非硬编码</td>
<td>无法按业务风险调平衡</td>
<td><code>WALRecoveryMode</code> 四模式</td>
</tr>
<tr>
<td>12</td>
<td>读端只消费恢复端的结论（单个上界值）</td>
<td>读端各自验帧，口径漂移</td>
<td><code>mxFrame</code> 快照 + <code>walFindFrame</code> 双边界</td>
</tr>
</tbody>
</table></div>

其中 1~5 是<strong>格式层</strong>（字节怎么摆），6~8 是<strong>语义层</strong>（事务与代际），9~12 是<strong>策略层</strong>（同步、收尾、损坏、读写协作）。常见错误是把 9~11 当成「高级功能」延后处理——恰恰相反，这三行策略决定了你的 WAL 在事故里是「丢几笔」还是「起不来」，必须在第一版就有明确答案，哪怕答案是硬编码的默认值。
<h2>结语</h2>

这篇文章从头到尾没有一行「我写的」代码，但你已经把两套工业级 WAL 的骨架拆开了：SQLite 的 32 + 24 字节页帧和链式滚动校验，LevelDB 的 7 字节头 + 32 KB 块 + CRC32C 分片重组——两套格式天差地别，四条约定却一条不差：
<ol>
<li><strong>只追加</strong>，回卷就换盐；</li>
<li><strong>逐条校验</strong>，覆盖范围明确到字节；</li>
<li><strong>遇坏即停</strong>，只承认连续合法的前缀；</li>
<li><strong>先记账再动数据</strong>，同步点显式可查。</li>
</ol>

值得反复咀嚼的是这些设计共同的气质：<strong>不猜</strong>。恢复程序不猜坏字节后面还有什么，读端不猜帧是否有效（它只读 <code>mxFrame</code>），checkpoint 不猜锁能不能抢到（抢不到就降级）。所有需要「猜」的地方，都被一个可计算的谓词（校验和、盐、上界）替代了——而一个可计算的谓词，就是所谓「一致性」在源码里的全部形态。

下次再听到「数据库崩溃后不丢数据」，你可以直接报出这些名字：<code>walIndexRecover</code>、<code>walDecodeFrame</code>、<code>walRestartHdr</code>、<code>WAL_SYNC_FLAGS</code>、<code>AddRecord → InsertInto</code>、<code>kPointInTimeRecovery</code>。承诺不神秘，它就是这些 if 语句的总和。</div></div></noscript>
