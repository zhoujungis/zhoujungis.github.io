    <noscript><div class="ns-article"><h1>【腾讯面经】相邻和为 10 消除：栈模拟与唯一性证明</h1><div class="ns-meta">2026/10/13 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>
<blockquote>

来源：<strong>腾讯面经高频</strong> —— 2025.11–2026.4 至少 4 篇面经出现，属于"一看就会、一问就漏"的那类题。
</blockquote>

给一个只由 <code>1~9</code> 组成的数字串，<strong>相邻两个数字之和为 10 就可以消除</strong>，消除后两边接在一起继续检查。问最后剩下的串是什么？（变体：求最后剩余的<strong>最短长度</strong>。）

示例：<code>5512</code> —— <code>5 + 5 = 10</code> 消除，两边接在一起得 <code>12</code>，<code>1 + 2 = 3</code> 不能再消，答案 <code>12</code>。

一句话答案谁都会说：<strong>栈模拟</strong>。但这题有三个地方能拉开差距：
<ol>
<li>为什么"消除后两边接在一起"用栈就自动成立？</li>
<li>消除顺序会不会影响结果？（面试官十有八九要追问）</li>
<li>

"最后剩下的串"和"最短剩余长度"是同一个问题吗？
</li>
<li>

<a href="#section-1">一、核心洞察：补数配对，把「当前串」压成一个栈</a>
</li>
<li><a href="#section-2">二、为什么栈是对的：结果唯一，所以顺序无关</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、两问其实是同一问：最短长度 = 唯一约化形</a></li>
<li><a href="#section-6">六、实测：栈 O(n) vs 朴素重扫 O(n²)</a></li>
<li><a href="#section-7">七、同族题与变体</a></li>
<li><a href="#section-8">八、Java 版</a></li>
<li><a href="#section-9">九、边界与常见坑</a></li>
<li><a href="#section-10">十、复杂度</a></li>
<li><a href="#section-11">十一、面试怎么答</a></li>
</ol>
<h2>一、核心洞察：补数配对，把「当前串」压成一个栈</h2>

在 <code>1~9</code> 里，每个数字 <code>d</code> 的补数 <code>10 - d</code> 是唯一的：
<div class="table-scroll"><table>
<thead>
<tr>
<th>数字</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>5</th>
<th>6</th>
<th>7</th>
<th>8</th>
<th>9</th>
</tr>
</thead>
<tbody>
<tr>
<td>补数</td>
<td>9</td>
<td>8</td>
<td>7</td>
<td>6</td>
<td>5</td>
<td>4</td>
<td>3</td>
<td>2</td>
<td>1</td>
</tr>
</tbody>
</table></div>

两个关键事实：
<ul>
<li><strong>配对是唯一的</strong>：<code>d</code> 只能和 <code>10 - d</code> 消，没有第二种选择 —— 这是后面"结果唯一"的伏笔；</li>
<li><strong><code>5</code> 的补数是它自己</strong>：<code>5 + 5 = 10</code>，两个 <code>5</code> 相遇一起消失（最容易被漏掉的一格）。</li>
</ul>

题面说"消除后两边接在一起继续检查"，很多人第一反应是"删完再从头扫一遍"。<strong>栈的视角把这件事变成一行</strong>：栈里存的就是<strong>当前串约化后的形态</strong>，新数字进来时只看栈顶 —— 栈顶是"左边最后一个还没被消掉的数字"，它俩加起来是 10 就一起消失（栈顶弹出、新数字也不进去），否则新数字入栈。
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">eliminate</span><span class="p">(</span><span class="n">s</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="n">st</span> <span class="o">=</span> <span class="p">[]</span>
    <span class="k">for</span> <span class="n">ch</span> <span class="ow">in</span> <span class="n">s</span><span class="p">:</span>
        <span class="k">if</span> <span class="n">st</span> <span class="ow">and</span> <span class="nb">int</span><span class="p">(</span><span class="n">st</span><span class="p">[</span><span class="o">-</span><span class="mi">1</span><span class="p">])</span> <span class="o">+</span> <span class="nb">int</span><span class="p">(</span><span class="n">ch</span><span class="p">)</span> <span class="o">==</span> <span class="mi">10</span><span class="p">:</span>
            <span class="n">st</span><span class="o">.</span><span class="n">pop</span><span class="p">()</span>          <span class="c1"># 栈顶和新数字一起消失</span>
        <span class="k">else</span><span class="p">:</span>
            <span class="n">st</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">ch</span><span class="p">)</span>     <span class="c1"># 新数字留下，成为新的栈顶</span>
    <span class="k">return</span> <span class="s2">&quot;&quot;</span><span class="o">.</span><span class="n">join</span><span class="p">(</span><span class="n">st</span><span class="p">)</span>
</code></pre></div>


六行，<code>O(n)</code>。两个容易写错的细节：
<ul>
<li>栈从底到顶<strong>就是答案的顺序</strong>，<code>"".join(st)</code> 直接给结果，<strong>不需要反转</strong>；</li>
<li>这里用 <code>if</code> 就够了，<strong>不需要 <code>while</code></strong>。因为一个数字最多消掉一个栈顶 —— 消掉之后它自己也消失了，不可能再跟新栈顶配对。</li>
</ul>
<h2>二、为什么栈是对的：结果唯一，所以顺序无关</h2>

栈模拟给出了<strong>一个</strong>结果。但如果面试官问"换个消除顺序，结果会不会变"，光说"我用栈"是答不上的 —— 得证明<strong>结果本来就是唯一的</strong>。

<strong>引理 1（终止）</strong>：每一步恰好删掉 2 个字符，串长严格递减，最多 <code>⌊n / 2⌋</code> 步必然停下。

<strong>引理 2（局部合流 / 临界对）</strong>：能互相重叠的两对，只可能长成 <code>a b a</code>，且 <code>a + b = 10</code>（<code>b</code> 同时是 <code>a</code> 的左邻和右邻）。此时"先消左边那对"和"先消右边那对"都合法，但两种消法<strong>剩下的都是 <code>a</code></strong>：
<div class="table-scroll"><table>
<thead>
<tr>
<th>消法</th>
<th>第一步</th>
<th>剩下的串</th>
</tr>
</thead>
<tbody>
<tr>
<td>先消左边 <code>a b</code></td>
<td><code>a b a</code> → <code>a</code></td>
<td><code>a</code></td>
</tr>
<tr>
<td>先消右边 <code>b a</code></td>
<td><code>a b a</code> → <code>a</code></td>
<td><code>a</code></td>
</tr>
</tbody>
</table></div>

不相邻（不重叠）的两对互不干扰，谁先谁后都一样 —— 所以任何局部都是合流的。

<strong>引理 3（Newman）</strong>：一个<strong>终止</strong>的重写系统，只要<strong>局部合流</strong>，就<strong>全局合流</strong> —— 从同一个串出发，不管按什么顺序消，最后都停在<strong>同一个不可约形</strong>上。这也解释了题面为什么能放心地问"最后剩下的串"。

于是：<strong>"最后的串"没有歧义，"最短剩余长度"就是它。</strong> 栈模拟不是"一种可行解"，它就是那个唯一结果。
<h3>实测（tools/eliminate_sum10_bench.py）</h3>

三件事都跑过，不是空口证明：
<ul>
<li><strong>穷举</strong> <code>1~9</code> 上长度 ≤ 5 的全部 <strong>66430</strong> 个串：栈模拟、逐轮重扫、最左优先重扫、最右优先重扫，四种实现<strong>结果完全一致</strong>；</li>
<li><strong>合流性实证</strong>：<strong>2000</strong> 个随机串（长度 ≤ 40）上，最左、最右、随机顺序三种消法<strong>同果</strong>；</li>
<li><strong>不变量</strong>：栈模拟<strong>每一步的栈内容</strong>都等于"该前缀独立约化"的结果（200 个随机串逐字符核对）；结果内部一定<strong>不含相邻互补对</strong>（不可再约）。</li>
</ul>

<strong>反面教材（值得在面试里主动说）</strong>：合流性是<strong>题目规则的功劳</strong>，不是随便什么消除规则都成立。一旦某个数字能配第二个补数，顺序就开始影响结果：
<div class="table-scroll"><table>
<thead>
<tr>
<th>规则</th>
<th>串</th>
<th>最左优先</th>
<th>最右优先</th>
</tr>
</thead>
<tbody>
<tr>
<td>和是 <strong>9 或 10</strong> 都能消</td>
<td><code>918</code></td>
<td><code>8</code></td>
<td><code>9</code></td>
</tr>
<tr>
<td>和是 <strong>10 或 18</strong> 都能消</td>
<td><code>991</code></td>
<td><code>1</code></td>
<td><code>9</code></td>
</tr>
</tbody>
</table></div>

同一个串、两种消法、<strong>两个结果</strong> —— 这时栈模拟给出的只是某个解，不保证最优。规则一变，就得换成搜索或区间 DP。
<h2>三、动画怎么看</h2>
<div class="algo-viz algo-viz--txelim"></div>

<div class="algo-viz algo-viz--txorder"></div>


<strong>动画一</strong>（<code>algo-viz--txelim</code>）：<strong>栈模拟</strong>。上面是输入串，下面是栈（底 → 顶向上画）。盯三件事：<strong>扫到哪一位</strong>（金框）、<strong>栈顶和新数字之和是不是 10</strong>（是就一起消失，被消的栈顶留一个虚线幽灵格）、<strong>"接在一起"的那一刻</strong>。默认输入 <code>55128921</code> 里，<code>2 + 8</code> 消掉之后 <code>1</code> 和 <code>9</code> 紧接着消掉 —— 第二步之所以能"接上"，是因为 <code>1</code> 一直躺在栈里等着。

<strong>动画二</strong>（<code>algo-viz--txorder</code>）：<strong>顺序无关</strong>。同一个串 <code>191191</code> 上并排跑两条路线 —— A 每次消<strong>最左边</strong>那一对，B 每次消<strong>最右边</strong>那一对。中途形态确实不一样（A 走到 <code>1191</code>，B 走到 <code>1911</code>），但<strong>最后都停在同一个串 <code>11</code></strong> 上。更细一层：两条路线的终点虽然字符串相同，<strong>幸存下来的是原串里不同的位置</strong> —— A 留下下标 <code>2</code> 和 <code>5</code>，B 留下下标 <code>0</code> 和 <code>3</code>。这就是第二节那张证明表的逐帧版本。
<h2>四、完整推演表</h2>

动画一的默认输入 <code>55128921</code>（<code>n = 8</code>）逐帧：
<div class="table-scroll"><table>
<thead>
<tr>
<th>下标</th>
<th>字符</th>
<th>栈顶 + 该字符</th>
<th>动作</th>
<th>栈（底 → 顶）</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>

<h2>五、两问其实是同一问：最短长度 = 唯一约化形</h2>

"求最后剩余的<strong>最短长度</strong>"听起来像个最优化问题，但有了第二节的引理，它就是<strong>一个数</strong>：
<ul>
<li>每一步恰好删 2 个字符，所以<strong>消除次数 = (n - 结果长度) / 2</strong> —— 次数也被结果唯一确定；</li>
<li>任何消除序列都停在同一个不可约形上（全局合流），所以<strong>不存在"更短"</strong>：那个长度就是下界，而且可达。</li>
</ul>

实测把这句也钉住了：500 个随机串、每条 6 个随机消法，<strong>没有一条比栈结果更短</strong>。

所以被问到"最短长度"时，正确回答是"这题不存在更短，答案就是唯一约化形的长度"，而不是"我用 BFS 搜一下"。
<h2>六、实测：栈 O(n) vs 朴素重扫 O(n²)</h2>

朴素写法长这样：<strong>每一轮从左到右删掉所有不相交的互补对，删到某一轮没有删除为止</strong>（"消除后接在一起继续检查"最直白的翻译）。

它的死穴在<strong>对抗输入</strong>：<code>"1" * N + "9" * N</code>（前半段全是 <code>1</code>、后半段全是 <code>9</code>）。整个串里<strong>只有交界处那一对</strong>能消，消掉之后新交界又只有一对能消……于是每一轮都要<strong>从串首扫到交界处</strong>，<code>N</code> 轮下来就是 <code>O(n²)</code>。栈一遍扫完。

<h2>七、同族题与变体</h2>

同一台机器换个判据，就是另一道题 —— 栈不变，<strong>"栈里存什么、怎么比"</strong>变：

</tr>
<tr>

判据越来越绕，骨架永远是那一句：<strong>栈 = 当前串约化后的形态，新元素只跟栈顶发生关系</strong>。（<code>LC 1047</code> 在博客另一篇 <a href="/article/lc-20-valid-parentheses/">有效的括号</a> 里也提过 —— 那道题是"配对即弹"的另一个极端。）

<strong>追问清单</strong>（面试官常用）：
<ol>
<li><strong>问"一共消了多少对"</strong>：<code>(n - 结果长度) / 2</code>，不用统计（见第五节）。</li>
<li><strong>问"输出所有可能的最终串"</strong>：本题只有唯一解（引理 3），答案就是一个；规则一旦不合流（第二节的 <code>918</code>、<code>991</code>），就退化成 BFS 枚举问题。</li>
<li><strong>问"能不能不用栈"</strong>：可以 —— 递归、或者"删一对再从头扫"都对，只是 <code>O(n²)</code>（实测差 2000 倍）；也可以用一个数组当栈、原地写回（把结果写回原串，只用一个游标，额外空间 <code>O(1)</code>）。</li>
<li><strong>问"配对表有什么讲究"</strong>：<code>d ↔ 10 - d</code> 是<strong>无重复的二对合</strong>（<code>5</code> 是不动点），所以每个数字只有一条出路 —— 这正是合流性的来源。把规则改成"和是 10 或 18"，<code>9</code> 就同时能配 <code>1</code> 和 <code>9</code>，唯一的临界对消失了，合流性跟着塌。</li>
<li><strong>问"游戏里的消消乐 / 祖玛呢"</strong>：那是<strong>网格 + 重力 + 连锁</strong>，"相邻"是多方向的，本质仍是"消除后邻居相接"，只是"栈"变成了"扫描 + 队列"。</li>
</ol>

两个 Java 坑：<code>ArrayDeque</code> 的 <code>push</code> / <code>pop</code> 都在<strong>栈顶</strong>，而答案要从<strong>栈底</strong>开始，所以取值用 <code>pollLast()</code>，顺着 <code>pop()</code> 输出会得到反串；另外别用 <code>String</code> 拼接来做入栈出栈 —— 那是 <code>O(n²)</code>，和朴素重扫一个量级。
<h2>九、边界与常见坑</h2>
<ol>
<li><strong>栈空时取栈顶</strong>：<code>st[-1]</code> / <code>st.peek()</code> 必须先判空 —— 串的第一个字符就撞在这上面。</li>
<li><strong>只数相邻对、漏掉"接上来的"</strong>：<code>1289</code> 应该全消（<code>2+8</code> 消掉后 <code>1</code> 和 <code>9</code> 接上再消），直接数相邻对只会消掉一对。</li>
<li><strong>用 <code>while</code> 反复弹栈</strong>：不必要（一个数字最多消一个栈顶），但要能<strong>解释为什么</strong>，别背写法。</li>
<li><strong>每轮重扫</strong>：<code>O(n²)</code>，<code>n = 8000</code> 实测慢 2000 倍。</li>
<li><strong>漏掉 <code>5 + 5 = 10</code></strong>：<code>5</code> 的补数是自己；把配对表记成"1↔9、2↔8、3↔7、4↔6"就漏了 <code>5</code>。</li>
<li><strong>只答"栈模拟"不证唯一性</strong>：被追问"消的顺序会不会影响结果"时答"应该不会吧"就掉档 —— 见第二节的临界对。</li>
<li><strong>输入边界</strong>：空串、全无可消对（<code>12345678</code>）、全 <code>5</code>、含 <code>0</code> 或其他字符。含 <code>0</code> 时它的补数是 <code>10</code>（不在 <code>1~9</code>），<strong>永远消不掉</strong>；这类输入要先跟面试官确认字符集，别自己假设。</li>
<li><strong>输出顺序</strong>：答案是"栈底 → 栈顶"，Python 里 <code>"".join(st)</code> 正好，Java 里要 <code>pollLast()</code>。</li>
<li><strong>把"和 10"记成"差 10"</strong>：<code>1</code> 和 <code>9</code> 差 8 但和为 10 —— 判据是<strong>和</strong>。</li>
</ol>

<h2>十一、面试怎么答</h2>

<strong>第一段 · 思路</strong>：<code>1~9</code> 里每个数字的补数唯一（<code>d ↔ 10-d</code>，<code>5</code> 配自己），所以每个数字只有一条消法；用栈维护"当前串约化后的形态"，新数字只看栈顶 —— 互补就弹出（两者一起消失），否则入栈。"两边接在一起"是栈弹出的自然结果，不必真的去接字符串。<code>O(n)</code> 时间、<code>O(n)</code> 空间。

<strong>第二段 · 唯一性</strong>（<strong>这段是区分度所在</strong>）：栈给出的不是"一种解"，而是唯一解。终止性（每步删 2 个）＋ 局部合流（唯一的临界对是 <code>a b a</code>，<code>a + b = 10</code>，两种消法都剩 <code>a</code>）＋ Newman 引理 ⇒ 全局合流 ⇒ 最后的串唯一，因此"最短剩余长度"就是这个长度。顺手报个反例：规则放宽成"和是 9 或 10"，<code>918</code> 会给出 <code>8</code> 和 <code>9</code> 两个结果 —— 说明合流性来自题目规则，不是普遍真理。

<strong>第三段 · 复杂度与变体</strong>：朴素"每轮重扫"是 <code>O(n²)</code>（对抗输入下 <code>n = 8000</code> 实测慢 2000 倍）；改成"相邻相同消除"是 LC 1047（LC 1209 要在栈里存 <code>(字符, 计数)</code>），"消 <code>AB</code> / <code>CD</code>"是 LC 2696，"行星碰撞"是 LC 735 —— 骨架都是"栈 = 当前串的约化形"。

一句话收尾：「<strong>栈存的是约化后的当前串，新数字只跟栈顶发生关系</strong>；这题能放心贪心，是因为它<strong>合流</strong> —— 顺序无关、结果唯一。」
<h2>结语</h2>

<code>5512</code> 这种四位串，谁都能手推出 <code>12</code>。真正把这题答满的是三句话：<strong>栈 = 当前串约化后的形态</strong>（所以"两边接在一起"不用真的去接）、<strong>两个数字能消当且仅当互补</strong>（<code>5</code> 配自己别漏）、<strong>系统合流所以结果唯一</strong>（终止 + 临界对 <code>a b a</code> + Newman）。第一条让你写出线性的 <code>O(n)</code> 代码，第二条让你不漏判据，第三条让"最短长度"这个变体不必搜索 —— 也让你在被追问"顺序会不会影响结果"时，能给出不是"应该不会"的答案。实测那一栏只是把第三条钉在数据上：<code>n = 8000</code> 时朴素写法 3.5 秒，栈 1.7 毫秒，差约 2000 倍。
