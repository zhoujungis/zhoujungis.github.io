    <div id="app"></div>
    <noscript><div class="ns-article"><h1>为什么我敢渲染用户的 Markdown：一条 XSS 防线</h1><div class="ns-meta">2026/9/9 · Zhou Jun</div><div class="markdown-body"><h1>为什么我敢在 Django 博客里渲染用户的 Markdown：一条完整的 XSS 防线</h1>
<blockquote>

这篇博客的后端是 Django + DRF，前端是 Vue 3。文章以 Markdown 存储在数据库里，读接口返回渲染好的 <code>html_content</code> 让前端直接展示。也就是说——<strong>用户的 Markdown 会被我执行成 HTML</strong>。
</blockquote>

如果你以前只写过后台管理系统、或者只是把 Markdown 渲染当作"读个库、拼个串"的琐事，那你可能没意识到这句话意味着什么：
<blockquote>

渲染用户输入，就是在执行用户代码。
</blockquote>

这篇文章不讲虚的。我会带你走一遍我的博客从"敢渲染"到"真的安全"的完整防线，包括两段真实的攻防迭代故事——它们都写在我博客后端 <code>articles/models.py</code> 的注释里，每一个都是踩过坑换来的。
<hr>
<h2>01 问题：渲染用户输入，为什么危险</h2>

先建立一个直觉。

你在数据库里存了一段文本：
<div class="codehilite"><pre><span></span><code>### 你好，世界
</code></pre></div>


前端拿到它，扔给一个 Markdown 渲染器，变成：
<div class="codehilite"><pre><span></span><code><span class="p">&lt;</span><span class="nt">h3</span><span class="p">&gt;</span>你好，世界<span class="p">&lt;/</span><span class="nt">h3</span><span class="p">&gt;</span>
</code></pre></div>


看起来人畜无害。但如果这段文本来自<strong>任何不可信的输入源</strong>——比如：用户评论、用户提交的笔记、甚至"管理员粘贴进来的外部文章"——那么"渲染"这个动作，本质上就是<strong>把你执行的权限交给了输入</strong>。

因为 Markdown 可以写出这些东西：
<div class="codehilite"><pre><span></span><code>&lt;img src=x
</code></pre></div>

<div class="codehilite"><pre><span></span><code>[<span class="nt">点我</span>](<span class="na">javascript:alert(1</span>))
</code></pre></div>

<div class="codehilite"><pre><span></span><code>&lt;a href=&quot;data:text/html,&lt;script&gt;alert(1)&lt;/script&gt;&quot;&gt;点我&lt;/a&gt;
</code></pre></div>

<div class="codehilite"><pre><span></span><code>&lt;svg&gt;&lt;a xlink:href=&quot;javascript:alert(1)&quot;&gt;&lt;text&gt;点击我&lt;/text&gt;&lt;/a&gt;&lt;/svg&gt;
</code></pre></div>


在浏览器里，<code>&lt;img onerror&gt;</code> 只要图片加载失败就会执行；<code>javascript:</code> 协议点击即触发；<code>data:</code> 协议在部分浏览器里能直接携带可执行 HTML；<code>&lt;svg&gt;</code> 里能藏 <code>xlink:href</code> 的脚本跳转。这还只是冰山一角——<code>&lt;iframe&gt;</code>、<code>&lt;style&gt;</code>、<code>&lt;object&gt;</code>、<code>&lt;video poster&gt;</code>、<code>&lt;math&gt;</code>、表单伪造……攻击面多到你根本列不完。
<blockquote>

<strong>关键认知：XSS 不是一个"过滤脏东西"的问题，而是一个"明确信任边界"的问题。</strong>
</blockquote>

你不能靠"我过滤了几个危险标签"来保证安全，因为黑名单永远是追着攻击者跑的。正确的做法是反着来：<strong>我只允许我知道是安全的这一小撮东西，其他一律不要。</strong> 这就是"白名单"思想。
<hr>
<h2>02 第一层：Markdown → HTML 的受控渲染</h2>

我的博客文章模型长这样（<code>articles/models.py</code>，节选）：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">Article</span><span class="p">(</span><span class="n">models</span><span class="o">.</span><span class="n">Model</span><span class="p">):</span>
    <span class="n">content</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">TextField</span><span class="p">(</span><span class="n">verbose_name</span><span class="o">=</span><span class="s2">&quot;内容 (Markdown)&quot;</span><span class="p">)</span>
    <span class="n">html_content</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">TextField</span><span class="p">(</span><span class="n">blank</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">editable</span><span class="o">=</span><span class="kc">False</span><span class="p">,</span> <span class="n">verbose_name</span><span class="o">=</span><span class="s2">&quot;HTML 内容&quot;</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">save</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="o">*</span><span class="n">args</span><span class="p">,</span> <span class="o">**</span><span class="n">kwargs</span><span class="p">):</span>
        <span class="c1"># 渲染 Markdown 为 HTML</span>
        <span class="n">md</span> <span class="o">=</span> <span class="n">markdown</span><span class="o">.</span><span class="n">Markdown</span><span class="p">(</span>
            <span class="n">extensions</span><span class="o">=</span><span class="p">[</span>
                <span class="s2">&quot;fenced_code&quot;</span><span class="p">,</span>
                <span class="s2">&quot;codehilite&quot;</span><span class="p">,</span>
                <span class="s2">&quot;tables&quot;</span><span class="p">,</span>
                <span class="s2">&quot;extra&quot;</span><span class="p">,</span>
                <span class="s2">&quot;toc&quot;</span><span class="p">,</span>
            <span class="p">]</span>
        <span class="p">)</span>
        <span class="n">raw_html</span> <span class="o">=</span> <span class="n">md</span><span class="o">.</span><span class="n">convert</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">content</span><span class="p">)</span>
        <span class="o">...</span>
</code></pre></div>


注意几个细节：
<ol>
<li><strong>扩展是显式列出的</strong>。<code>fenced_code</code>（围栏代码块）、<code>toc</code>（目录）、<code>codehilite</code>（代码高亮）、<code>tables</code>、<code>extra</code>（Markdown 扩展集）。没有用"加载所有扩展"，而是精确控制渲染器会产生哪些 HTML 结构——<strong>渲染器不产出的标签，攻击者就无法借它的手产生</strong>。</li>
<li><strong>这里产出的是 <code>raw_html</code></strong>。它现在还是"脏"的——<code>markdown</code> 库只负责把 Markdown 语法转成 HTML，<strong>它完全不关心安全性</strong>。<code>javascript:</code> 链接它会原样保留，<code>&lt;img onerror&gt;</code> 也会原样保留（因为 Markdown 允许原生 HTML 透传）。</li>
<li><strong><code>html_content</code> 是 <code>editable=False</code></strong>。这个字段只能由 <code>save()</code> 自动生成，不能手动填——从入口上保证"数据库里存的 HTML 永远是我们渲染消毒过的，而不是谁手动塞进去的"。</li>
</ol>

所以渲染这步本身不是防线，它是<strong>给下一层白名单消毒提供输入</strong>。真正的安全逻辑在下面。
<hr>
<h2>03 第二层：bleach 白名单消毒</h2>

核心防线在这（<code>articles/models.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="c1"># 消毒：去掉 &lt;script&gt;、事件属性、javascript: URI 等</span>
<span class="c1"># 白名单对齐 markdown + codehilite + toc 实际会产出的结构。</span>
<span class="bp">self</span><span class="o">.</span><span class="n">html_content</span> <span class="o">=</span> <span class="n">bleach</span><span class="o">.</span><span class="n">clean</span><span class="p">(</span>
    <span class="n">raw_html</span><span class="p">,</span>
    <span class="n">tags</span><span class="o">=</span><span class="n">bleach</span><span class="o">.</span><span class="n">sanitizer</span><span class="o">.</span><span class="n">ALLOWED_TAGS</span>
    <span class="o">|</span> <span class="p">{</span>
        <span class="s2">&quot;h1&quot;</span><span class="p">,</span> <span class="s2">&quot;h2&quot;</span><span class="p">,</span> <span class="s2">&quot;h3&quot;</span><span class="p">,</span> <span class="s2">&quot;h4&quot;</span><span class="p">,</span> <span class="s2">&quot;h5&quot;</span><span class="p">,</span> <span class="s2">&quot;h6&quot;</span><span class="p">,</span>
        <span class="s2">&quot;img&quot;</span><span class="p">,</span> <span class="s2">&quot;pre&quot;</span><span class="p">,</span> <span class="s2">&quot;code&quot;</span><span class="p">,</span> <span class="s2">&quot;span&quot;</span><span class="p">,</span> <span class="s2">&quot;div&quot;</span><span class="p">,</span>
        <span class="s2">&quot;table&quot;</span><span class="p">,</span> <span class="s2">&quot;thead&quot;</span><span class="p">,</span> <span class="s2">&quot;tbody&quot;</span><span class="p">,</span> <span class="s2">&quot;tr&quot;</span><span class="p">,</span> <span class="s2">&quot;th&quot;</span><span class="p">,</span> <span class="s2">&quot;td&quot;</span><span class="p">,</span>
        <span class="s2">&quot;hr&quot;</span><span class="p">,</span> <span class="s2">&quot;br&quot;</span><span class="p">,</span> <span class="s2">&quot;sup&quot;</span><span class="p">,</span> <span class="s2">&quot;sub&quot;</span><span class="p">,</span>
        <span class="s2">&quot;figure&quot;</span><span class="p">,</span> <span class="s2">&quot;figcaption&quot;</span><span class="p">,</span>
    <span class="p">},</span>
    <span class="n">attributes</span><span class="o">=</span><span class="p">{</span>
        <span class="o">**</span><span class="n">bleach</span><span class="o">.</span><span class="n">sanitizer</span><span class="o">.</span><span class="n">ALLOWED_ATTRIBUTES</span><span class="p">,</span>
        <span class="s2">&quot;img&quot;</span><span class="p">:</span> <span class="nb">list</span><span class="p">(</span><span class="nb">set</span><span class="p">([</span><span class="s2">&quot;src&quot;</span><span class="p">,</span> <span class="s2">&quot;alt&quot;</span><span class="p">,</span> <span class="s2">&quot;title&quot;</span><span class="p">,</span> <span class="s2">&quot;loading&quot;</span><span class="p">,</span> <span class="s2">&quot;decoding&quot;</span><span class="p">])</span>
                     <span class="o">|</span> <span class="nb">set</span><span class="p">(</span><span class="n">bleach</span><span class="o">.</span><span class="n">sanitizer</span><span class="o">.</span><span class="n">ALLOWED_ATTRIBUTES</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="s2">&quot;img&quot;</span><span class="p">,</span> <span class="p">[]))),</span>
        <span class="s2">&quot;a&quot;</span><span class="p">:</span> <span class="nb">list</span><span class="p">(</span><span class="nb">set</span><span class="p">([</span><span class="s2">&quot;href&quot;</span><span class="p">,</span> <span class="s2">&quot;title&quot;</span><span class="p">,</span> <span class="s2">&quot;rel&quot;</span><span class="p">,</span> <span class="s2">&quot;target&quot;</span><span class="p">])</span>
                  <span class="o">|</span> <span class="nb">set</span><span class="p">(</span><span class="n">bleach</span><span class="o">.</span><span class="n">sanitizer</span><span class="o">.</span><span class="n">ALLOWED_ATTRIBUTES</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="s2">&quot;a&quot;</span><span class="p">,</span> <span class="p">[]))),</span>
        <span class="s2">&quot;code&quot;</span><span class="p">:</span> <span class="nb">list</span><span class="p">(</span><span class="nb">set</span><span class="p">([</span><span class="s2">&quot;class&quot;</span><span class="p">])</span>
                     <span class="o">|</span> <span class="nb">set</span><span class="p">(</span><span class="n">bleach</span><span class="o">.</span><span class="n">sanitizer</span><span class="o">.</span><span class="n">ALLOWED_ATTRIBUTES</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="s2">&quot;code&quot;</span><span class="p">,</span> <span class="p">[]))),</span>
        <span class="o">...</span>
    <span class="p">},</span>
    <span class="n">protocols</span><span class="o">=</span><span class="p">[</span><span class="s2">&quot;http&quot;</span><span class="p">,</span> <span class="s2">&quot;https&quot;</span><span class="p">,</span> <span class="s2">&quot;mailto&quot;</span><span class="p">],</span>
    <span class="n">strip</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span>
<span class="p">)</span>
</code></pre></div>


<code>bleach</code> 是 Mozilla 出品的 HTML 消毒库，OWASP 推荐的 Python 方案。这短短一个调用，做了<strong>三层白名单</strong>：

<strong>① 标签白名单</strong>

<code>bleach.sanitizer.ALLOWED_TAGS</code> 已经包含了 <code>a, abbr, acronym, b, blockquote, code, em, i, li, ol, strong, ul</code> 这些基础标签。我用 <code>|</code> 并集扩展出文章渲染需要的：<code>h1~h6</code>、<code>img</code>、<code>pre</code>、<code>table</code> 系、<code>figure</code>、<code>div</code> 等。

不在白名单里的标签——<code>&lt;script&gt;</code>、<code>&lt;iframe&gt;</code>、<code>&lt;object&gt;</code>、<code>&lt;embed&gt;</code>、<code>&lt;style&gt;</code>、<code>&lt;svg&gt;</code>、<code>&lt;math&gt;</code>、<code>&lt;form&gt;</code>、<code>&lt;input&gt;</code>……——<strong>全部被干掉</strong>。<code>strip=True</code> 的意思是：不光去掉标签本身，连标签里的内容也一起拿掉（而不是保留文本）。比如：
<div class="codehilite"><pre><span></span><code>&lt;img src=x
</code></pre></div>


会被直接整段删除，而不是变成文本 <code>alert(1)</code> 残留在页面上。

<strong>② 属性白名单</strong>

标签允许了，但标签上的<strong>属性</strong>也要白名单。<code>&lt;img&gt;</code> 只允许 <code>src alt title loading decoding</code>；<code>&lt;a&gt;</code> 只允许 <code>href title rel target</code>；<code>&lt;code&gt;/&lt;pre&gt;/&lt;span&gt;/&lt;div&gt;</code> 只允许 <code>class</code>（高亮样式用）。<strong>所有事件属性 <code>on*</code> 都不在白名单里</strong>，所以：
<div class="codehilite"><pre><span></span><code><span class="p">&lt;</span><span class="nt">img</span> <span class="na">src</span><span class="o">=</span><span class="s">&quot;https://example.com/a.png&quot;</span> <span class="na">onerror</span><span class="o">=</span><span class="s">&quot;alert(1)&quot;</span><span class="p">&gt;</span>
</code></pre></div>


会被洗成：
<div class="codehilite"><pre><span></span><code><span class="p">&lt;</span><span class="nt">img</span> <span class="na">src</span><span class="o">=</span><span class="s">&quot;https://example.com/a.png&quot;</span><span class="p">&gt;</span>
</code></pre></div>


注意这里有个<strong>很容易踩的坑</strong>：如果直接写 <code>attributes={"img": ["src", "alt"]}</code>，会<strong>覆盖掉 <code>bleach</code> 的默认属性</strong>，导致 <code>colspan</code>/<code>rowspan</code> 这类表格属性被误杀。所以代码里用了 <code>list(set([...]) | set(bleach.sanitizer.ALLOWED_ATTRIBUTES.get("img", [])))</code>——<strong>先并集再赋值，合并而不是覆盖</strong>。这是把默认白名单当"基础包"、把自己的需求当"增量"的正确姿势。

<strong>③ 协议白名单</strong>

<code>protocols=["http", "https", "mailto"]</code> 是第三道闸。就算 <code>&lt;a href&gt;</code> 通过了标签和属性检查，<code>href</code> 里的 <strong>协议</strong> 还要过审：
<div class="codehilite"><pre><span></span><code>[<span class="nt">点我</span>](<span class="na">javascript:alert(1</span>))
</code></pre></div>


渲染成 <code>&lt;a href="#"&gt;</code> 后，<code>bleach</code> 发现 <code>javascript:</code> 不在协议白名单里，<strong>直接把这个链接的 <code>href</code> 抹掉</strong>（留下无 href 的 <code>&lt;a&gt;</code> 文本）。

到这里，三层白名单已经把"能出现在 HTML 里的东西"锁死在已知安全的集合里了。
<hr>
<h2>04 真实漏洞 ①：<code>data:</code> 协议绕过</h2>

你以为这就够了吗？不够。这就是我们博客踩过的第一个真实坑。

最开始的版本里，<code>protocols</code> 是这样写的：
<div class="codehilite"><pre><span></span><code><span class="n">protocols</span><span class="o">=</span><span class="p">[</span><span class="s2">&quot;http&quot;</span><span class="p">,</span> <span class="s2">&quot;https&quot;</span><span class="p">,</span> <span class="s2">&quot;mailto&quot;</span><span class="p">,</span> <span class="s2">&quot;data&quot;</span><span class="p">]</span>
</code></pre></div>


我当时觉得 <code>data:</code> 协议有点用——比如"内联小图片"（<code>data:image/png;base64,...</code>）。于是白名单里放了 <code>data</code>。

<strong>结果是一个真实的攻击路径：</strong>
<div class="codehilite"><pre><span></span><code><span class="p">&lt;</span><span class="nt">a</span> <span class="na">href</span><span class="o">=</span><span class="s">&quot;data:text/html,&lt;script&gt;alert(document.cookie)&lt;/script&gt;&quot;</span><span class="p">&gt;</span>点我<span class="p">&lt;/</span><span class="nt">a</span><span class="p">&gt;</span>
</code></pre></div>


<code>bleach</code> 检查协议时发现 <code>data:</code> 在白名单里，放行。<code>href</code> 是合法的、<code>&lt;a&gt;</code> 是合法的、属性是合法的——<strong>三层全过</strong>。但用户在浏览器里点这个链接，部分浏览器（尤其 Safari 和 WebView）会<strong>直接把它当 HTML 页面渲染</strong>，里面的 <code>&lt;script&gt;</code> 照常执行。攻击者只需要骗用户点一下。

这就是白名单思路的软肋：<strong>你每多放开一个"看起来有用"的协议/标签/属性，就多一个被绕过的面</strong>。而 XSS 的可怕之处在于——<strong>只需要一个口子，就能执行任意脚本</strong>。

后来我们删掉了 <code>data</code>。代码注释里留着这段复盘（<code>models.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="c1"># C-S2: protocols drop &#39;data&#39; globally — it was letting</span>
<span class="c1">#   &lt;a href=&quot;data:text/html,&lt;script&gt;...&lt;/script&gt;&quot;&gt; through, which Safari /</span>
<span class="c1">#   WebViews still execute. Inline base64 images aren&#39;t used here</span>
<span class="c1">#   (covers are URLField elsewhere), so the loss is acceptable.</span>
</code></pre></div>


这里有个工程取舍的学问：<strong>放弃 <code>data:</code> 意味着失去"内联 base64 图片"的能力</strong>。但因为博客封面的 URL 本来就走 <code>URLField</code>、走 <code>http(s)</code>，<code>data:</code> 方案根本用不上——<strong>用不上的功能，就是纯风险，没有任何收益</strong>。安全领域有个原则：<strong>攻击面越小越好，凡是没在用的能力，默认就是漏洞</strong>。
<blockquote>

这一条教训值得单独记住：<strong>白名单里每多一个条目，都要问自己——"这个真的需要吗？"</strong>
</blockquote>
<hr>
<h2>05 第三层：外部链接加固</h2>

XSS 不只是脚本执行。还有一种被低估的攻击面叫 <strong><code>window.opener</code> 钓鱼</strong>。

当页面用 <code>target="_blank"</code> 打开一个新标签页时，新页面通过 <code>window.opener</code> 能拿到<strong>旧页面的 window 对象引用</strong>。如果新页面是攻击者控制的，它可以：
<div class="codehilite"><pre><span></span><code><span class="c1">// 在新页面里偷偷做</span>
<span class="nb">window</span><span class="p">.</span><span class="nx">opener</span><span class="p">.</span><span class="nx">location</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;https://evil.com/phishing&quot;</span><span class="p">;</span>
</code></pre></div>


把你博客的页面<strong>静默跳转到钓鱼站</strong>。这是老浏览器默认行为，很多人不知道。

所以消毒之后，我们对所有<strong>外部链接</strong>做了最后一道加固（<code>models.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="c1"># 强制外部链接安全打开</span>
<span class="bp">self</span><span class="o">.</span><span class="n">html_content</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span>
    <span class="sa">r</span><span class="s1">&#39;&lt;a ([^&gt;]*?)href=&quot;(https?://[^&quot;]+)&quot;&#39;</span><span class="p">,</span>
    <span class="sa">r</span><span class="s1">&#39;&lt;a \1href=&quot;\2&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&#39;</span><span class="p">,</span>
    <span class="bp">self</span><span class="o">.</span><span class="n">html_content</span><span class="p">,</span>
<span class="p">)</span>
</code></pre></div>


用正则给每一个 <code>http(s)</code> 外链强制加上 <code>rel="noopener noreferrer" target="_blank"</code>：
<ul>
<li><code>noopener</code> —— 新页面拿不到 <code>window.opener</code>，<strong>断掉反向钓鱼</strong>；</li>
<li><code>noreferrer</code> —— 不泄露来源 Referrer；</li>
<li><code>target="_blank"</code> —— 外链新窗口打开，用户不丢当前页面。</li>
</ul>

注意这个正则只匹配 <code>http(s)</code> 外链，<strong>站内相对链接（<code>/article/...</code>）不会被加 <code>target="_blank"</code></strong>——因为站内链接不需要新窗口。
<hr>
<h2>06 真实漏洞 ②：摘要里的 HTML 泄漏</h2>

第二个坑，出在<strong>文章列表页的摘要</strong>上。

博客首页的卡片会显示每篇文章的摘要（<code>excerpt</code>）。老代码是这样生成摘要的：
<div class="codehilite"><pre><span></span><code><span class="c1"># 老方案：从原始 Markdown 里剥语法</span>
<span class="n">text</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span><span class="sa">r</span><span class="s1">&#39;[#&gt;*`-]&#39;</span><span class="p">,</span> <span class="s1">&#39;&#39;</span><span class="p">,</span> <span class="n">content</span><span class="p">)</span>  <span class="c1"># 大概这种思路</span>
</code></pre></div>


这个思路的问题是：<strong>你在用正则"猜"Markdown 的结构，而 Markdown 允许内联 HTML</strong>。于是两个漏洞来了：

<strong>漏洞 A：内联 <code>&lt;svg&gt;</code> 漏进摘要</strong>

一篇文章的正文里如果有：
<div class="codehilite"><pre><span></span><code>&lt;svg
</code></pre></div>


老摘要代码剥掉 Markdown 语法符号后，<strong><code>&lt;svg> 作为"文本"原样保留</strong>，然后被拼进卡片渲染。卡片区域照样执行了 XSS。

<strong>漏洞 B：<code>&lt;https://...&gt;</code> 自动链接泄漏</strong>

Markdown 有个特性：裸 URL 会自动变成链接。老摘要用正则剥语法时，<strong><code>&lt;https://...&gt;</code> 的尖括号和内容一起被当成"文本"留着</strong>，显示成 <code>&lt;https://example.com&gt;</code> 这种带括号的乱码，甚至可能被浏览器解析成标签。

修复后的方案（<code>models.py</code> 的 <code>make_excerpt</code>）<strong>换了思路——不再从 Markdown 源剥，而是从"已经消毒过的 HTML"里提取纯文本</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">make_excerpt</span><span class="p">(</span><span class="n">html_content</span><span class="p">,</span> <span class="n">fallback_text</span><span class="o">=</span><span class="s2">&quot;&quot;</span><span class="p">,</span> <span class="n">word_limit</span><span class="o">=</span><span class="mi">50</span><span class="p">):</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">html_content</span> <span class="ow">or</span> <span class="s2">&quot;&quot;</span>
    <span class="c1"># 先去掉代码块——源码对摘要来说是噪音</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span><span class="sa">r</span><span class="s2">&quot;&lt;pre\b[^&gt;]*&gt;.*?&lt;/pre&gt;&quot;</span><span class="p">,</span> <span class="s2">&quot; &quot;</span><span class="p">,</span> <span class="n">text</span><span class="p">,</span> <span class="n">flags</span><span class="o">=</span><span class="n">re</span><span class="o">.</span><span class="n">DOTALL</span><span class="p">)</span>
    <span class="c1"># 再去掉 style/script 内容（连同标签一起）</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span><span class="sa">r</span><span class="s2">&quot;&lt;(style|script)\b[^&gt;]*&gt;.*?&lt;/\1&gt;&quot;</span><span class="p">,</span> <span class="s2">&quot; &quot;</span><span class="p">,</span> <span class="n">text</span><span class="p">,</span> <span class="n">flags</span><span class="o">=</span><span class="n">re</span><span class="o">.</span><span class="n">DOTALL</span><span class="p">)</span>
    <span class="c1"># 剥掉所有剩余标签，只留人类可读文本</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span><span class="sa">r</span><span class="s2">&quot;&lt;[^&gt;]+&gt;&quot;</span><span class="p">,</span> <span class="s2">&quot; &quot;</span><span class="p">,</span> <span class="n">text</span><span class="p">)</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">unescape</span><span class="p">(</span><span class="n">text</span><span class="p">)</span>
    <span class="n">text</span> <span class="o">=</span> <span class="n">re</span><span class="o">.</span><span class="n">sub</span><span class="p">(</span><span class="sa">r</span><span class="s2">&quot;\s+&quot;</span><span class="p">,</span> <span class="s2">&quot; &quot;</span><span class="p">,</span> <span class="n">text</span><span class="p">)</span><span class="o">.</span><span class="n">strip</span><span class="p">()</span>
    <span class="o">...</span>
</code></pre></div>


关键洞察在这里：
<blockquote>

<strong>摘要不再从"不可信的 Markdown"生成，而是从"已经过 bleach 消毒的 <code>html_content</code>"生成。</strong>
</blockquote>

因为 <code>html_content</code> 是防线①的产物——所有 <code>&lt;svg&gt;</code>、<code>&lt;script&gt;</code>、事件属性已经<strong>在这一层被彻底清干净</strong>。摘要提取时"剥标签"操作的是<strong>已知安全的 HTML</strong>，就算正则不完美，漏出来的也最多是无害的文本，<strong>不会重新引入可执行的代码</strong>。

这其实就是纵深防御的体现：<strong>同一份数据，在流水线的不同环节被反复清洗，每一层都假设上一层有漏洞。</strong>
<hr>
<h2>07 纵深防御总结</h2>

把整条链路串起来看：
<div class="codehilite"><pre><span></span><code>用户 Markdown
   │
   ▼  ① 受控渲染（固定扩展，不产出额外标签）
markdown.Markdown
   │
   ▼  ② 三层白名单（标签 / 属性 / 协议）
bleach.clean(...)  ──► 删除 &lt;script&gt;/&lt;svg&gt;/事件属性/javascript:/data:
   │
   ▼  ③ 外链加固（rel=noopener noreferrer target=_blank）
re.sub(...)
   │
   ▼  ④ 摘要从消毒后的 HTML 提取
make_excerpt(html_content)
   │
   ▼
html_content + excerpt   →  存储 / 接口 / 前端渲染
</code></pre></div>


每一层各挡什么：
<table>
<thead>
<tr>
<th>层</th>
<th>手段</th>
<th>挡住的攻击</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>显式 Markdown 扩展</td>
<td>从源头减少 HTML 结构的"野生产物"</td>
</tr>
<tr>
<td>②</td>
<td>bleach 标签/属性/协议三层白名单</td>
<td><code>&lt;script&gt;</code>、事件属性、<code>javascript:</code>、<code>data:</code>、<code>&lt;svg&gt;</code> 等</td>
</tr>
<tr>
<td>③</td>
<td>外链 <code>noopener noreferrer</code></td>
<td><code>window.opener</code> 反向钓鱼、Referrer 泄露</td>
</tr>
<tr>
<td>④</td>
<td>摘要从消毒后 HTML 提取</td>
<td>摘要区域二次 XSS、Markdown 语法泄漏</td>
</tr>
</tbody>
</table>

<strong>为什么不能只依赖一层？</strong>

因为每一层都有各自的盲区：
<ul>
<li><strong>只靠渲染器</strong>：Markdown 库不负责安全，<code>javascript:</code> 原样放行；</li>
<li><strong>只靠 bleach</strong>：白名单再严，也管不住"新页面通过 <code>window.opener</code> 操控旧页面"这种浏览器机制层面的问题；</li>
<li><strong>只靠正则</strong>：正则剥 HTML 永远有边缘情况，<code>&lt;https://...&gt;</code> 就是活例子。</li>
</ul>

纵深防御的核心信念是：<strong>"我一定会有漏洞"这个前提来设计，而不是"我很安全"这个假设来安心。</strong> 每一层都当上一层已经失守，把攻击面一层层收窄。
<hr>
<h2>延伸：如果你用的不是 Django</h2>

<code>bleach</code> 是 OWASP 认可的白名单消毒方案，但它不是唯一的选择。顺着同样的"白名单"思路，其他语言也有对应物：
<table>
<thead>
<tr>
<th>语言</th>
<th>推荐库</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>Python</td>
<td><code>bleach</code></td>
<td>本文主角，Mozilla 出品</td>
</tr>
<tr>
<td>Python</td>
<td><code>nh3</code>（绑定 Rust ammonia）</td>
<td>更快，同样白名单思路</td>
</tr>
<tr>
<td>Java</td>
<td><code>OWASP Java HTML Sanitizer</code></td>
<td>OWASP 官方</td>
</tr>
<tr>
<td>Node.js</td>
<td><code>sanitize-html</code> / <code>DOMPurify</code>(前端)</td>
<td>生态成熟</td>
</tr>
<tr>
<td>Go</td>
<td><code>bluemonday</code></td>
<td>标准白名单库</td>
</tr>
<tr>
<td>Ruby</td>
<td><code>rails-html-sanitizer</code></td>
<td>Rails 内置</td>
</tr>
</tbody>
</table>

<strong>核心心法</strong>（不管什么语言都一样）：
<ol>
<li><strong>永远白名单，永远别黑名单</strong>。黑名单 = 追着攻击者跑；白名单 = 你定义安全边界。</li>
<li><strong>三层都要管</strong>：标签、属性、协议。只过滤标签是不够的，<code>&lt;img onerror&gt;</code> 需要属性层，<code>javascript:</code> 需要协议层。</li>
<li><strong>渲染和消毒是两回事</strong>。渲染器（markdown → HTML）别管安全，消毒器（bleach）别管渲染，各司其职，在管线里串起来。</li>
<li><strong>内容输出前再做一次摘要清洗</strong>。同一个数据源，多清洗一次不亏。</li>
<li><strong>用不上的能力就是风险</strong>。<code>data:</code> 协议、内联 base64、<code>target=_blank</code> 裸奔……不用就删。</li>
<li><strong>写清注释</strong>。你的防御逻辑、你踩过的坑、你为什么放弃某个能力——这些是留给未来的自己（和团队）最值钱的文档。</li>
</ol>
<hr>
<h2>结语</h2>

回到开头那句话：<strong>渲染用户输入，就是在执行用户代码。</strong>

"敢渲染"不是胆子大，而是<strong>把每一道防线都设计到位之后的底气</strong>。我的博客后端 <code>articles/models.py</code> 里那段 <code>save()</code> 方法，从受控渲染、bleach 三层白名单、外链加固、到从消毒 HTML 提取摘要——这条链路不是一天写成的，是两个真实漏洞（<code>data:</code> 绕过、摘要泄漏）换来的。

写这篇的目的，不是让你照抄代码，而是希望你带走一个判断框架：
<blockquote>

<strong>下次你遇到"要不要渲染用户输入"的问题，先问自己三个问题：</strong>
1. 我信任这个输入吗？（信任边界）
2. 如果我错了，最坏会发生什么？（纵深防御）
3. 我允许的东西，真的都需要吗？（攻击面最小化）
</blockquote>

想清楚这三个问题，你就离"敢渲染"不远了。</div></div></noscript>
