    <noscript><div class="ns-article"><h1>【LC 146】LRU 缓存：手写哈希表与双向链表</h1><div class="ns-meta">2026/10/12 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>
<blockquote>

来源：<strong>腾讯 123 次（断层第一）、字节 72 次</strong> —— 手写设计题里出现频率最高的缓存题。
</blockquote>

<strong>LC 146 LRU 缓存</strong>：请你设计并实现一个满足 <strong>LRU（最近最少使用）</strong> 缓存约束的数据结构。
<ul>
<li><code>LRUCache(int capacity)</code>：以正整数 <code>capacity</code> 初始化；</li>
<li><code>int get(int key)</code>：如果 key 存在，返回其值，否则返回 <code>-1</code>；</li>
<li><code>void put(int key, int value)</code>：key 存在则改值；不存在则插入；<strong>容量满时淘汰最久未使用的那一个</strong>；</li>
<li><strong><code>get</code> 和 <code>put</code> 必须都是 O(1)</strong>。</li>
</ul>

要求<strong>手写双向链表 + 哈希表</strong>（禁用 <code>LinkedHashMap</code> / <code>OrderedDict</code> 这类现成结构）。追问两个：
<blockquote>

<strong>追问一</strong>：怎么改成线程安全版？
<strong>追问二</strong>：和 LFU（LC 460）有什么区别？
</blockquote>

标准用例（本文动画的默认脚本）：
<div class="codehilite"><pre><span></span><code>LRUCache(2)
put(1,1); put(2,2)        → 链表: [1] → [2,1]
get(1)                    → 返回 1,  链表重排: [1,2]
put(3,3)                  → 淘汰 2,  链表: [3,1]
get(2)                    → -1
put(4,4)                  → 淘汰 1,  链表: [4,3]
get(1) → -1; get(3) → 3; get(4) → 4
</code></pre></div>

<h2>一、核心洞察：O(1) 的两条腿 —— 哈希表定位 + 双向链表排队</h2>

先说清楚「为什么必须是这两样组合」：
<ul>
<li><strong>只用哈希表</strong>：<code>get</code> 是 O(1)，但「谁是最久未使用的」这件事没有结构承载 —— 每次淘汰都得扫描全部 key（O(n)），而且「使用」的顺序无法维护；</li>
<li><strong>只用链表</strong>：保持顺序没问题，但 <code>get(key)</code> 要先找到节点 —— 链表查找是 O(n)；</li>
<li><strong>组合起来</strong>：哈希表 <code>key → 节点</code> 负责「一步找到」，双向链表负责「按使用顺序排队」，两个操作各司其职：</li>
</ul>
<div class="codehilite"><pre><span></span><code>队首（head 侧）= 最近使用（MRU）
队尾（tail 侧）= 最久未使用（LRU）  ← 淘汰永远从这里摘
</code></pre></div>


两个「为什么」也是面试官爱问的：
<ol>
<li><strong>为什么双向、不单向？</strong> <code>get</code> 命中后要把节点从链表<strong>中间摘下来</strong>、移到队首。单向链表摘任意节点需要它的前驱 —— 找不到前驱就得从头扫（O(n)）。双向链表有 <code>prev</code>，摘除本身是 O(1)。</li>
<li><strong>为什么要哨兵（dummy head / tail）？</strong> 有了两个哨兵，任何节点的 <code>prev</code> / <code>next</code> 都非空 —— 插入和摘除<strong>永远不需要判空</strong>，代码少一半 <code>if</code>，也就不容易在边界（容量 1、只剩一个节点）上写错。</li>
</ol>
<h2>二、手写结构：三个固定动作</h2>

整份实现只有三个「零件动作」，把它们的指针顺序背下来，就再也不会写错：
<ul>
<li><code>addToFront(node)</code>：把节点接到哨兵 head 后面（队首）；</li>
<li><code>unlink(node)</code>：把节点从链表中摘掉（前后邻居直接牵手）；</li>
<li><code>moveToFront(node)</code> = <code>unlink</code> + <code>addToFront</code>。</li>
</ul>

Python 版（<strong>不用 <code>OrderedDict</code></strong>，纯手写）：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">Node</span><span class="p">:</span>
    <span class="vm">__slots__</span> <span class="o">=</span> <span class="p">(</span><span class="s2">&quot;key&quot;</span><span class="p">,</span> <span class="s2">&quot;value&quot;</span><span class="p">,</span> <span class="s2">&quot;prev&quot;</span><span class="p">,</span> <span class="s2">&quot;next&quot;</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">key</span><span class="o">=</span><span class="mi">0</span><span class="p">,</span> <span class="n">value</span><span class="o">=</span><span class="mi">0</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">key</span> <span class="o">=</span> <span class="n">key</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">value</span> <span class="o">=</span> <span class="n">value</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">prev</span> <span class="o">=</span> <span class="kc">None</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="kc">None</span>


<span class="k">class</span><span class="w"> </span><span class="nc">LRUCache</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">capacity</span><span class="p">:</span> <span class="nb">int</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cap</span> <span class="o">=</span> <span class="n">capacity</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cache</span> <span class="o">=</span> <span class="p">{}</span>                    <span class="c1"># key -&gt; Node</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">head</span> <span class="o">=</span> <span class="n">Node</span><span class="p">()</span>                 <span class="c1"># 哨兵：head.next 才是第一个真节点</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">tail</span> <span class="o">=</span> <span class="n">Node</span><span class="p">()</span>                 <span class="c1"># 哨兵：tail.prev 才是最后一个真节点</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">head</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">tail</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">tail</span><span class="o">.</span><span class="n">prev</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">head</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">_add_to_front</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">node</span><span class="p">):</span>
        <span class="n">node</span><span class="o">.</span><span class="n">prev</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">head</span>
        <span class="n">node</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">head</span><span class="o">.</span><span class="n">next</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">head</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">prev</span> <span class="o">=</span> <span class="n">node</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">head</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">node</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">_unlink</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">node</span><span class="p">):</span>
        <span class="n">node</span><span class="o">.</span><span class="n">prev</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">node</span><span class="o">.</span><span class="n">next</span>
        <span class="n">node</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">prev</span> <span class="o">=</span> <span class="n">node</span><span class="o">.</span><span class="n">prev</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">_move_to_front</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">node</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_unlink</span><span class="p">(</span><span class="n">node</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_add_to_front</span><span class="p">(</span><span class="n">node</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">get</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">key</span><span class="p">:</span> <span class="nb">int</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>
        <span class="n">node</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">cache</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="n">key</span><span class="p">)</span>
        <span class="k">if</span> <span class="n">node</span> <span class="ow">is</span> <span class="kc">None</span><span class="p">:</span>
            <span class="k">return</span> <span class="o">-</span><span class="mi">1</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_move_to_front</span><span class="p">(</span><span class="n">node</span><span class="p">)</span>          <span class="c1"># 命中 = 使用</span>
        <span class="k">return</span> <span class="n">node</span><span class="o">.</span><span class="n">value</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">put</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">key</span><span class="p">:</span> <span class="nb">int</span><span class="p">,</span> <span class="n">value</span><span class="p">:</span> <span class="nb">int</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="kc">None</span><span class="p">:</span>
        <span class="n">node</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">cache</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="n">key</span><span class="p">)</span>
        <span class="k">if</span> <span class="n">node</span> <span class="ow">is</span> <span class="ow">not</span> <span class="kc">None</span><span class="p">:</span>
            <span class="n">node</span><span class="o">.</span><span class="n">value</span> <span class="o">=</span> <span class="n">value</span>
            <span class="bp">self</span><span class="o">.</span><span class="n">_move_to_front</span><span class="p">(</span><span class="n">node</span><span class="p">)</span>      <span class="c1"># 改值也算使用！</span>
            <span class="k">return</span>
        <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">cache</span><span class="p">)</span> <span class="o">==</span> <span class="bp">self</span><span class="o">.</span><span class="n">cap</span><span class="p">:</span>    <span class="c1"># 容量满：先淘汰队尾</span>
            <span class="n">victim</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">tail</span><span class="o">.</span><span class="n">prev</span>
            <span class="bp">self</span><span class="o">.</span><span class="n">_unlink</span><span class="p">(</span><span class="n">victim</span><span class="p">)</span>
            <span class="k">del</span> <span class="bp">self</span><span class="o">.</span><span class="n">cache</span><span class="p">[</span><span class="n">victim</span><span class="o">.</span><span class="n">key</span><span class="p">]</span>     <span class="c1"># 两处都要删，漏一个就是幽灵节点</span>
        <span class="n">node</span> <span class="o">=</span> <span class="n">Node</span><span class="p">(</span><span class="n">key</span><span class="p">,</span> <span class="n">value</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cache</span><span class="p">[</span><span class="n">key</span><span class="p">]</span> <span class="o">=</span> <span class="n">node</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_add_to_front</span><span class="p">(</span><span class="n">node</span><span class="p">)</span>
</code></pre></div>


注意 <code>put</code> 的三种情形：<strong>key 已存在</strong>（改值 + 移到队首）、<strong>容量未满</strong>（直接插队首）、<strong>容量已满</strong>（先摘队尾双删，再插队首）—— 面试时把这三条逐个说清楚，比一句「就是 LRU 嘛」强十倍。
<h2>三、动画怎么看</h2>
<div class="algo-viz algo-viz--lc146"></div>

<div class="algo-viz algo-viz--lc146lfu"></div>


<strong>动画一</strong>（<code>algo-viz--lc146</code>）：<strong>双向链表 + 哈希表</strong>。上方是链表：<code>H</code> / <code>T</code> 是哨兵，<strong>队首（最左）= 最近使用，队尾（最右）= 淘汰对象</strong>；每个节点显示 <code>key:value</code> 和它的节点号 <code>#n</code>。中部是<strong>哈希表</strong>，条目形如 <code>key → #n</code> —— 盯住它们<strong>同步变化</strong>：插入时两处都加、淘汰时两处都删。淘汰帧里队尾会出现一个<strong>虚线幽灵节点</strong>（就是被摘掉的那一个）。下方两行是「本步操作」和「get 返回值」。

<strong>动画二</strong>（<code>algo-viz--lc146lfu</code>）：<strong>LFU 对照</strong>。同一套操作脚本喂给 LFU：节点按 <strong>freq 升序</strong>从左到右排（<strong>最左 = 下一个淘汰对象</strong>，左侧有「淘汰优先 →」指示），每个节点带 freq 角标，get / put 命中都会让 freq +1。看两个关键帧就够了：<code>put(3,3)</code> 时的淘汰 —— <strong>LRU 淘汰 <code>(2,2)</code>，LFU 淘汰 <code>(1,1)</code></strong>。

<h2>五、追问二：LFU（460）的区别</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>维度</th>
<th>LRU（146）</th>
<th>LFU（460）</th>
</tr>
</thead>
<tbody>
<tr>
<td>记住的维度</td>
<td><strong>时间</strong>：最近有没有用</td>
<td><strong>频率</strong>：一共用了多少次</td>
</tr>
<tr>
<td>get 命中做什么</td>
<td>把节点移到队首（改顺序）</td>
<td>freq +1（<strong>改淘汰优先级</strong>）</td>
</tr>
<tr>
<td>淘汰谁</td>
<td>链表<strong>队尾</strong>（最久未使用）</td>
<td><strong>freq 最小</strong>的节点；并列时淘汰其中最久未使用的</td>
</tr>
<tr>
<td>结构</td>
<td>哈希表 + 一条双向链表</td>
<td>哈希表 + <strong>频率桶</strong>（freq → 双向链表）+ <code>minFreq</code> 指针</td>
</tr>
<tr>
<td>O(1) 实现难度</td>
<td>低（本文三个动作）</td>
<td>高（桶的增删 + minFreq 维护）</td>
</tr>
<tr>
<td>典型弱点</td>
<td>一次大扫描会冲掉热点（缓存污染）</td>
<td>历史热点短期「赖着不走」；新 key 极易被秒杀</td>
</tr>
</tbody>
</table></div>

LFU 要做到 O(1)，靠的是「<strong>频率桶</strong>」：每个 <code>freq</code> 值挂一条双向链表，同桶内按使用先后排；再维护一个 <code>minFreq</code> 指针指向最小频率的桶。命中时节点从 freq 桶搬到 freq+1 桶；淘汰时从 <code>minFreq</code> 桶的<strong>桶尾</strong>（同频最久未用）取。<strong>LC 460 的难点从来不是 LRU 那套链表，而是桶和 minFreq 的维护。</strong>

工程现场还有第四种答案：真实缓存（如 Caffeine）用的是 <strong>W-TinyLFU</strong> ——「准入窗口 + 频率素描」的组合，既抗扫描污染又不用精确维护频率桶。面试里能提一句，档次直接不一样。
<h2>六、追问一：线程安全版怎么做</h2>

先戳破一个错觉：<strong>LRU 的 <code>get</code> 不是只读操作</strong> —— 它要 <code>moveToFront</code>，会改链表。所以「读多写少用读写锁」在这里是伪命题：每一次读都可能写结构。三条路线：
<ul>
<li><strong>全局锁（朴素正确版）</strong>：Java 用 <code>synchronized</code> 包住 <code>get</code> / <code>put</code>，Python 用 <code>threading.Lock</code>。正确、简单，但所有操作串行 —— 面试里先说这个，再谈优化；</li>
<li><strong>分段锁（工程常用）</strong>：按 key 哈希成 N 段，每段一条独立 LRU + 一把锁。并发度上来了，代价是<strong>容量不再精确</strong>（每段各自淘汰，可能整体超卖/早退）。这也是 Redis 单线程模型之外、本地缓存库的常见折衷；</li>
<li><strong>近似算法（生产现实）</strong>：与其精确维护链表，不如用 CLOCK / W-TinyLFU 这类「近似 LRU/LFU」，把每次访问的结构修改降到常数位操作 —— 换来高并发下的可扩展性。</li>
</ul>

面试句式：「正确性上，最简单的方案是一把锁把所有操作串行化；瓶颈在于 get 也会写链表。生产里通常退一步：分段或近似算法，用淘汰精度换并发度。」

<span class="w">        </span><span class="n">node</span><span class="p">.</span><span class="na">next</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">head</span><span class="p">.</span><span class="na">next</span><span class="p">;</span>
<span class="w">        </span><span class="n">head</span><span class="p">.</span><span class="na">next</span><span class="p">.</span><span class="na">prev</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">node</span><span class="p">;</span>
<span class="w">        </span><span class="n">head</span><span class="p">.</span><span class="na">next</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">node</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">private</span><span class="w"> </span><span class="kt">void</span><span class="w"> </span><span class="nf">remove</span><span class="p">(</span><span class="n">Node</span><span class="w"> </span><span class="n">node</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">node</span><span class="p">.</span><span class="na">prev</span><span class="p">.</span><span class="na">next</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">node</span><span class="p">.</span><span class="na">next</span><span class="p">;</span>
<span class="w">        </span><span class="n">node</span><span class="p">.</span><span class="na">next</span><span class="p">.</span><span class="na">prev</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">node</span><span class="p">.</span><span class="na">prev</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">private</span><span class="w"> </span><span class="kt">void</span><span class="w"> </span><span class="nf">moveToFront</span><span class="p">(</span><span class="n">Node</span><span class="w"> </span><span class="n">node</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">remove</span><span class="p">(</span><span class="n">node</span><span class="p">);</span>
<span class="w">        </span><span class="n">addToFront</span><span class="p">(</span><span class="n">node</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


一个 Java 细节：<code>head</code> / <code>tail</code> 哨兵自己不在 <code>map</code> 里，也不会被 <code>put</code> 覆盖；<code>remove</code> 之后<strong>必须</strong> <code>map.remove</code>，否则淘汰的 key 还留在哈希表里，下一次 <code>get</code> 会摸到一个已经脱链的「幽灵节点」。

（如果哪天笔试允许用库：Java <code>new LinkedHashMap&lt;&gt;(cap, 0.75f, true)</code> + 重写 <code>removeEldestEntry</code>、Python <code>OrderedDict</code> + <code>move_to_end</code> 都是一行版 —— 但<strong>这道题考的就是不让用</strong>。）
<h2>八、同族题：460 / 432 / 707 / 2296 / 面试 16.25</h2>

146 是「设计题 + 链表 + 哈希」这一族的原点：
<ul>
<li><strong>LC 460 LFU 缓存</strong>：本文第五节的对照 —— 频率桶 + minFreq，<strong>146 的进阶连招</strong>；</li>
<li><strong>LC 432 全 O(1) 的数据结构</strong>：inc / dec / getMax / getMin 全 O(1) —— 同样用「值 → 双向链表」的桶思想；</li>
<li><strong>LC 707 设计链表</strong>：不考缓存，只考双向链表裸操作（插入 / 删除 / 按索引找）—— 146 的手感训练；</li>
<li><strong>LC 2296 设计文本编辑器</strong>：双向链表 + 光标，链表的另一条经典考法；</li>
<li><strong>面试题 16.25 LRU 缓存</strong>：就是本题的「面试版」编号，考频同样极高；</li>
<li><strong>LC 588 / 1166</strong>（文件系统系列）：用「路径 → 节点」的哈希 + 树/链表的组合，思想同源。</li>
</ul>
<h2>九、边界与常见坑</h2>
<ul>
<li><strong><code>put</code> 已存在的 key 必须移到队首</strong>（且改值）—— 漏掉「算一次使用」是本题第一大坑，面试官一问就是它；</li>
<li><strong>get 未命中不能占位</strong>：返回 -1，结构一动不动；</li>
<li><strong>淘汰要双删</strong>：链表摘尾的<strong>同时</strong> <code>del cache[key]</code>；只摘链表 → 幽灵节点；只删表 → 链表泄漏；</li>
<li><strong>值相同也算使用</strong>：<code>put(1, 5)</code> 遇到已经 <code>1:5</code>，仍要移到队首；</li>
<li><strong><code>capacity = 1</code></strong>：哨兵方案下不需要任何特判（这正是哨兵的价值）；</li>
<li><strong>指针顺序</strong>：<code>addToFront</code> 四行、<code>remove</code> 两行，顺序写反在「只有一个节点」时会把自己指成自环；</li>
<li><strong>不要用库</strong>：题目明确禁用 <code>LinkedHashMap</code> / <code>OrderedDict</code>，写了能过编译但面试大概率被判「没答到」；</li>
<li><strong>Python 的 <code>__slots__</code></strong>：可选优化，面试里提一句显得熟练；不提也不扣分。</li>
</ul>
<h2>十、复杂度</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>操作</th>
<th>时间</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>get</code></td>
<td><code>O(1)</code> 均摊</td>
<td>哈希表查找 O(1) + 链表摘除/插入各常数次指针</td>
</tr>
<tr>
<td><code>put</code></td>
<td><code>O(1)</code> 均摊</td>
<td>查找 + 至多一次淘汰（摘尾双删）+ 一次头插</td>
</tr>
<tr>
<td>空间</td>
<td><code>O(capacity)</code></td>
<td>哈希表与链表各存 capacity 个节点</td>
</tr>
</tbody>
</table></div>

没有一次遍历、没有一次扫描 —— 这就是「LRU 的 O(1)」的全部含义。对照 LFU：维护得当时（频率桶 + minFreq）也是 O(1)，但要维护的结构多得多。
<h2>十一、面试怎么答</h2>

<strong>第一段 · 结构选型</strong>：先讲「两条腿」——哈希表 <code>key → 节点</code> 保证 O(1) 找到，双向链表按使用顺序排队保证 O(1) 移动与淘汰；<strong>为什么双向</strong>（摘中间节点要前驱）、<strong>为什么哨兵</strong>（免判空）。这段是绝大多数人答得含糊的地方，说清楚就赢一半。

<strong>第二段 · 手写要点</strong>：三个固定动作 <code>addToFront</code> / <code>unlink</code> / <code>moveToFront</code>；<code>put</code> 的三种情形（改值+移到队首 / 直接插 / 先淘汰再插）；淘汰时<strong>链表哈希表双删</strong>。

<strong>第三段 · 追问连跳</strong>：线程安全 —— 点出「get 也会写链表」，给全局锁 / 分段 / 近似三层答案；LFU 区别 —— 时间维度 vs 频率维度，<strong>同一串操作可能淘汰不同的 key</strong>（<code>put(3,3)</code>：LRU 淘汰 2、LFU 淘汰 1），LFU 的 O(1) 靠频率桶 + minFreq。

一句话收尾：「LRU 的全部考点就是一句话 —— <strong>哈希表负责找到，双向链表负责排队</strong>；手写时盯住哨兵、双删和『put 命中也要移到队首』这三个细节。」
<h2>结语</h2>

146 是一道「没有算法、全是工程」的题：没有推导、没有边界数学，考的是你<strong>对两个基础结构组合的掌控力</strong> —— 哈希表给你 O(1) 的访问，双向链表给你 O(1) 的秩序。把它写对的人，再去看 LFU 的频率桶、432 的桶套桶、线程安全的分段与近似，都是在同一张图上往前走。手写一遍，比读十遍管用。
