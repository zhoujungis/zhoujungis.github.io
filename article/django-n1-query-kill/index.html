    <noscript><div class="ns-article"><h1>从 21 条 SQL 到 2 条：三次 N+1 查询围剿实录</h1><div class="ns-meta">2026/9/9 · Zhou Jun</div><div class="markdown-body"><h1>从 21 条 SQL 到 2 条：三次 N+1 查询围剿实录</h1>
<blockquote>

博客的文章列表页一次查 10 篇文章。你猜后端执行了多少条 SQL？实测答案：<strong>14 条（8 篇文章时），满页 10 篇就是 21 条</strong>。其中只有 1 条是真正必要的。
</blockquote>

N+1 是 Django 项目里最常见、最隐蔽的性能杀手：代码看着没问题，数据量小的时候飞快，上线后随数据量线性变慢。它不报错、不抛异常，只是让你的首页越来越慢，而你盯着代码怎么都看不出慢在哪。

这篇文章记录我在这个博客里围剿 N+1 的三次实战，全部有实测数字。最后还有一个诚实章节：<strong>一个至今没修的 N+1</strong>，以及修复方案。
<hr>
<h2>01 算账：N+1 是什么</h2>

先看文章列表的序列化器（<code>articles/serializers.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">ArticleListSerializer</span><span class="p">(</span><span class="n">serializers</span><span class="o">.</span><span class="n">ModelSerializer</span><span class="p">):</span>
    <span class="n">category</span> <span class="o">=</span> <span class="n">CategoryNestedField</span><span class="p">(</span><span class="n">read_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">tags</span> <span class="o">=</span> <span class="n">TagNestedField</span><span class="p">(</span><span class="n">many</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">read_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>


每篇文章要展示分类名和标签名。ORM 的执行过程是：
<ol>
<li><code>SELECT * FROM articles WHERE status='published' LIMIT 10</code> —— 1 条，查出 10 篇文章；</li>
<li>对每篇文章：<code>SELECT * FROM categories WHERE id=?</code> —— 10 条；</li>
<li>对每篇文章：<code>SELECT * FROM tags ...</code> —— 10 条。</li>
</ol>

<strong>1 + 10 + 10 = 21 条。</strong> N 是 10，查询数是 2N+1，这就是"N+1"这个名字的由来。

我在本地 SQLite 上实测（8 篇已发布文章）：
<table>
<thead>
<tr>
<th>写法</th>
<th>SQL 条数</th>
</tr>
</thead>
<tbody>
<tr>
<td>直接循环取 <code>a.category</code> / <code>a.tags.all()</code></td>
<td><strong>14 条</strong>（1 + 8 + 5，标签有复用）</td>
</tr>
<tr>
<td><code>select_related("category").prefetch_related("tags")</code></td>
<td><strong>2 条</strong></td>
</tr>
</tbody>
</table>

数据量小的时候，14 条 SQL 只要几毫秒，没人察觉。但查询数随文章数线性增长：分页是 10 条一页，评论、RSS、搜索页各自再来一套——<strong>慢不是突然发生的，是每加一篇文章就慢一点，慢到你终于忍不了的那天</strong>。
<blockquote>

<strong>关键认知：N+1 不是"慢查询"问题，而是"查询次数"问题。单条 SQL 再快，也架不住数量随数据线性涨。</strong>
</blockquote>
<hr>
<h2>02 第一杀：分类文章数（5 条 → 1 条）</h2>

分类列表页要显示每个分类下有多少篇文章。直觉写法：
<div class="codehilite"><pre><span></span><code><span class="n">data</span> <span class="o">=</span> <span class="p">[(</span><span class="n">c</span><span class="o">.</span><span class="n">name</span><span class="p">,</span> <span class="n">c</span><span class="o">.</span><span class="n">article_set</span><span class="o">.</span><span class="n">filter</span><span class="p">(</span><span class="n">status</span><span class="o">=</span><span class="s2">&quot;published&quot;</span><span class="p">)</span><span class="o">.</span><span class="n">count</span><span class="p">())</span>
        <span class="k">for</span> <span class="n">c</span> <span class="ow">in</span> <span class="n">Category</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">all</span><span class="p">()]</span>
</code></pre></div>


4 个分类 = 1 条查分类 + 4 条 <code>COUNT</code> = <strong>5 条 SQL</strong>。分类、标签越多，线性越狠。

修复（<code>articles/views.py</code>，注释原话"in a single query instead of N+1"）：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">get_queryset</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
    <span class="c1"># Annotate published article count in a single query instead of N+1</span>
    <span class="k">return</span> <span class="n">Category</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">annotate</span><span class="p">(</span>
        <span class="n">article_count</span><span class="o">=</span><span class="n">Count</span><span class="p">(</span>
            <span class="s2">&quot;article&quot;</span><span class="p">,</span>
            <span class="nb">filter</span><span class="o">=</span><span class="n">Q</span><span class="p">(</span><span class="n">article__status</span><span class="o">=</span><span class="n">Article</span><span class="o">.</span><span class="n">Status</span><span class="o">.</span><span class="n">PUBLISHED</span><span class="p">),</span>
        <span class="p">)</span>
    <span class="p">)</span>
</code></pre></div>


<code>annotate + Count + filter</code> 把计数翻译成一条带 <code>COUNT ... FILTER (WHERE ...)</code> 的 SQL：<strong>分类和计数一次查出，永远 1 条</strong>。Tag 列表同理。实测：5 条 → 1 条。

注意 <code>filter=Q(...)</code> 这个细节：<strong>只统计已发布的</strong>。草稿、定时、归档的文章不能算进去——计数逻辑必须和列表页的可见性规则一致，否则分类上写着"12 篇"，点进去只有 8 篇。这种"数字对不上"是最伤信任的 bug。

序列化器侧还有一处配合（<code>serializers.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">CategorySerializer</span><span class="p">(</span><span class="n">serializers</span><span class="o">.</span><span class="n">ModelSerializer</span><span class="p">):</span>
    <span class="c1"># Use the queryset annotation when present (CategoryViewSet/TagViewSet</span>
    <span class="c1"># annotate it). Fall back to a live count for direct ModelSerializer</span>
    <span class="c1"># usage (admin etc.) so the field never silently returns 0.</span>
    <span class="n">article_count</span> <span class="o">=</span> <span class="n">serializers</span><span class="o">.</span><span class="n">IntegerField</span><span class="p">(</span><span class="n">read_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>


字段声明为只读的普通整数字段，<strong>数据由 queryset 的注解提供，而不是序列化器自己再查一次</strong>。权责分清：查几次、怎么查，是 queryset 的事；序列化器只负责"呈现已经查好的东西"。这是后面所有优化的总原则。
<hr>
<h2>03 第二杀：评论列表（serializer 访问什么，就预取什么）</h2>

评论接口的序列化器访问了三个关联（<code>comments/serializers.py</code> + <code>views.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">get_replies</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">obj</span><span class="p">):</span>
    <span class="n">replies</span> <span class="o">=</span> <span class="p">[</span><span class="n">r</span> <span class="k">for</span> <span class="n">r</span> <span class="ow">in</span> <span class="n">obj</span><span class="o">.</span><span class="n">replies</span><span class="o">.</span><span class="n">all</span><span class="p">()</span> <span class="k">if</span> <span class="n">r</span><span class="o">.</span><span class="n">is_approved</span><span class="p">]</span>  <span class="c1"># 反向关联</span>
    <span class="o">...</span>

<span class="k">def</span><span class="w"> </span><span class="nf">get_article_slug</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">obj</span><span class="p">):</span>
    <span class="k">return</span> <span class="n">obj</span><span class="o">.</span><span class="n">article</span><span class="o">.</span><span class="n">slug</span> <span class="o">...</span>   <span class="c1"># 外键</span>
<span class="k">def</span><span class="w"> </span><span class="nf">get_article_title</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">obj</span><span class="p">):</span>
    <span class="k">return</span> <span class="n">obj</span><span class="o">.</span><span class="n">article</span><span class="o">.</span><span class="n">title</span> <span class="o">...</span>  <span class="c1"># 外键</span>
</code></pre></div>


每条评论触发：1 次 <code>article</code> 查询 + 1 次 <code>replies</code> 查询。20 条评论一页，就是 40 多条 SQL。

修复（<code>comments/views.py</code>）：
<div class="codehilite"><pre><span></span><code><span class="k">return</span> <span class="n">Comment</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">filter</span><span class="p">(</span>
    <span class="n">article</span><span class="o">=</span><span class="n">article</span><span class="p">,</span> <span class="n">is_approved</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">parent</span><span class="o">=</span><span class="kc">None</span>
<span class="p">)</span><span class="o">.</span><span class="n">select_related</span><span class="p">(</span><span class="s2">&quot;article&quot;</span><span class="p">)</span><span class="o">.</span><span class="n">prefetch_related</span><span class="p">(</span><span class="s2">&quot;replies__article&quot;</span><span class="p">)</span>
</code></pre></div>

<ul>
<li><code>select_related("article")</code>：外键正向关联，用 <code>JOIN</code> 一次带出，不再每条查；</li>
<li><code>prefetch_related("replies__article")</code>：反向关联 + 回复的文章，用 2 条额外 SQL 一次性装好（注意 <code>replies__article</code> 这个双下划线——<strong>回复的 <code>article</code> 也要预取</strong>，否则每条回复又查一次文章，N+1 换个地方复活）。</li>
</ul>
<blockquote>

<strong>心法：优化 N+1 不用猜。打开序列化器，逐行列出它访问了哪些关联（<code>obj.xxx</code>），然后在 queryset 里把这些关联全部预取。serializer 访问什么，queryset 就预取什么。</strong>
</blockquote>

还有一个连带埋点：<code>get_replies</code> 是递归的（回复的回复），注释里写明调用方必须预取，且用 <code>depth</code> 上限截断：
<div class="codehilite"><pre><span></span><code><span class="n">depth</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">context</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="s1">&#39;depth&#39;</span><span class="p">,</span> <span class="mi">0</span><span class="p">)</span> <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">context</span> <span class="k">else</span> <span class="mi">0</span>
<span class="k">if</span> <span class="n">depth</span> <span class="o">&gt;=</span> <span class="mi">2</span><span class="p">:</span>
    <span class="k">return</span> <span class="p">[]</span>
</code></pre></div>


这防的是另一类灾难：恶意构造父子循环（A 是 B 的父亲，B 又是 A 的父亲）导致无限递归，或者超长串烧出巨大 payload。<strong>N+1 管的是"查询太多"，depth 管的是"递归太深"</strong>——序列化嵌套关联时，两个都要管。
<hr>
<h2>04 第三杀：RSS 订阅（最容易漏的一处）</h2>

RSS（<code>articles/feeds.py</code>）是最容易漏掉 N+1 的地方——它不在 DRF 视图里，没有序列化器，是 Django 自带的 feed 框架：
<div class="codehilite"><pre><span></span><code><span class="c1"># L8: prefetch category + tags so item_categories() doesn&#39;t trigger</span>
<span class="o">...</span>
<span class="o">.</span><span class="n">select_related</span><span class="p">(</span><span class="s2">&quot;category&quot;</span><span class="p">)</span>
<span class="o">.</span><span class="n">prefetch_related</span><span class="p">(</span><span class="s2">&quot;tags&quot;</span><span class="p">)</span>
</code></pre></div>


feed 的每一项都要输出分类和标签，不预取的话，订阅器每半小时来抓一次，每次几十条 SQL。RSS 平时没人看，但<strong>爬虫和订阅器是最高频的"用户"</strong>，漏掉这里等于把最热的路径留在最慢的状态。
<blockquote>

<strong>教训：N+1 排查要覆盖所有出口——REST 接口、RSS、管理后台、定时任务。只修了 API 不修 feed，等于锁了前门没锁后门。</strong>
</blockquote>
<hr>
<h2>05 诚实章节：一个还没修的 N+1</h2>

排查时发现：<strong>文章列表端点（最热的首页）自己还没加预取</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">ArticleViewSet</span><span class="p">(</span><span class="n">viewsets</span><span class="o">.</span><span class="n">ReadOnlyModelViewSet</span><span class="p">):</span>
    <span class="n">queryset</span> <span class="o">=</span> <span class="n">Article</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">filter</span><span class="p">(</span><span class="n">status</span><span class="o">=</span><span class="n">Article</span><span class="o">.</span><span class="n">Status</span><span class="o">.</span><span class="n">PUBLISHED</span><span class="p">)</span>
    <span class="c1"># ← 没有 select_related / prefetch_related</span>
</code></pre></div>


而 <code>ArticleListSerializer</code> 恰恰访问了 <code>category</code> 和 <code>tags</code>（01 节算的就是这笔账）：实测 8 篇文章 14 条 SQL，满页 10 篇就是 21 条。分类页、标签页修了，最热的首页反而漏了——典型的"灯下黑"。

修复方案就两行：
<div class="codehilite"><pre><span></span><code><span class="n">queryset</span> <span class="o">=</span> <span class="n">Article</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">filter</span><span class="p">(</span>
    <span class="n">status</span><span class="o">=</span><span class="n">Article</span><span class="o">.</span><span class="n">Status</span><span class="o">.</span><span class="n">PUBLISHED</span>
<span class="p">)</span><span class="o">.</span><span class="n">select_related</span><span class="p">(</span><span class="s2">&quot;category&quot;</span><span class="p">)</span><span class="o">.</span><span class="n">prefetch_related</span><span class="p">(</span><span class="s2">&quot;tags&quot;</span><span class="p">)</span>
</code></pre></div>


实测：14 条 → <strong>2 条</strong>（1 条文章 + 1 条标签预取，分类被 JOIN 带出），且与 N 无关，加多少文章都是 2 条。

为什么写出来而不是偷偷修掉？因为这就是 N+1 的真实形态：<strong>它不是修一次就绝迹的 bug，而是每次加字段、加接口都会回来的慢性病</strong>。<code>related_articles</code>（按标签找相关文章）这种 <code>SerializerMethodField</code>，里面又藏着 <code>obj.tags.all()</code> + 几次查询——今天修完，明天加个字段又回来。所以需要的不是"修完"，而是"每次都能发现"。
<hr>
<h2>06 方法论：四步发现 N+1</h2>
<table>
<thead>
<tr>
<th>步骤</th>
<th>做法</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>列出 serializer 访问的关联</td>
<td>逐行找 <code>obj.xxx</code> / <code>xxx.all()</code> / <code>MethodField</code> 里藏的查询</td>
</tr>
<tr>
<td>②</td>
<td>本地数 SQL</td>
<td><code>CaptureQueriesContext</code> 或 <code>assertNumQueries</code>，改前改后各跑一次，数字说话</td>
</tr>
<tr>
<td>③</td>
<td>正向用 <code>select_related</code>，反向/多对多用 <code>prefetch</code></td>
<td>前者 JOIN，后者另查两次；双下划线追踪到底（如 <code>replies__article</code>）</td>
</tr>
<tr>
<td>④</td>
<td>覆盖所有出口</td>
<td>API、RSS、管理后台、定时任务，一个一个过</td>
</tr>
</tbody>
</table>

第②步是我最想强调的：<strong>性能优化先有数字，再动手</strong>。本文所有的"5→1""14→2"都是本地实测，不是估算。没有改之前的数字，你根本不知道改完是变快了还是心理作用。
<hr>
<h2>结语</h2>

N+1 的可怕之处不在于难修——修复往往就是一两行 <code>select_related</code> / <code>annotate</code>。可怕之处在于<strong>隐蔽</strong>：功能全对、测试全过，只是随数据量慢慢变慢，慢到用户先流失，你还不知道问题在哪。

三条检查清单，送给下次写 DRF 接口的自己：
<blockquote>
<ol>
<li>我的 serializer 逐行访问了哪些关联？（逐行列出来）</li>
<li>改前后各跑一次 SQL 计数，数字降了吗？（用数字说话）</li>
<li>除了这个接口，RSS、后台、定时任务里还有同类写法吗？（覆盖所有出口）</li>
</ol>
</blockquote>

以及最诚实的一条：修完记得回头看——<strong>最热的那个接口，往往就是灯下黑的那个</strong>。</div></div></noscript>
