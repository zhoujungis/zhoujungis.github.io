    <noscript><div class="ns-article"><h1>【LC 704/69】二分查找 &amp; x 的平方根：一个命中就返回，一个成立还向右</h1><div class="ns-meta">2026/9/29 · Zhou Jun</div><div class="markdown-body"><h2>题目</h2>

<strong>LC 704 二分查找</strong>：给定一个 <code>n</code> 个元素<strong>有序（升序）</strong>的整型数组 <code>nums</code> 和一个目标值 <code>target</code>，在数组中查找 target，若存在返回其下标，否则返回 <code>-1</code>。要求时间复杂度 <code>O(log n)</code>。
<div class="codehilite"><pre><span></span><code>输入: nums = [-1,0,3,5,9,12], target = 9
输出: 4

输入: nums = [-1,0,3,5,9,12], target = 2
输出: -1
</code></pre></div>


<strong>LC 69 x 的平方根</strong>：给定一个非负整数 <code>x</code>，计算并返回 <code>x</code> 的<strong>算术平方根</strong>，结果<strong>只保留整数部分</strong>（即向下取整，<code>⌊√x⌋</code>）。可用二分或牛顿法。
<div class="codehilite"><pre><span></span><code>输入: x = 8
输出: 2   （√8 ≈ 2.828，小数部分舍去）

输入: x = 16
输出: 4
</code></pre></div>


两道题是二分查找的"课内与课外"：704 是<strong>标准形态</strong> —— 在真实数组里找特定值；69 是<strong>毕业形态</strong> —— 数组根本不存在，"有序数组"是你自己构造的整数区间，要找的也不是某个值，而是一条<strong>谓词边界</strong>。把 69 写对，说明二分真的学会了。

<li><a href="#section-1">一、LC 704 核心洞察：二分是维持区间不变量的艺术</a></li>
<li><a href="#section-2">二、LC 69 核心洞察：答案不在数组里，在谓词的边界上</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、变体与同族题</a></li>
<li><a href="#section-6">六、Java 版</a></li>

<li><a href="#section-8">八、复杂度</a></li>

<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、LC 704 核心洞察：二分是维持区间不变量的艺术</h2>

大多数人对二分的记忆是"取中间比较一下"——这是表象。二分的本质是一条<strong>不变量</strong>：
<blockquote>

<strong>若 target 在数组里，它的下标永远落在闭区间 <code>[left, right]</code> 内。</strong>
</blockquote>

开局区间是整段 <code>[0, n-1]</code>。每一轮探中点 <code>mid</code>，三种结局：
<ul>
<li><code>nums[mid] == target</code>：结案，返回 <code>mid</code>；</li>
<li><code>nums[mid] &lt; target</code>：升序数组里 <code>mid</code> <strong>左边（含 mid）</strong>全部比 target 小 —— 整段排除，<code>left = mid + 1</code>；</li>
<li><code>nums[mid] &gt; target</code>：<code>mid</code> <strong>右边（含 mid）</strong>全部比 target 大 —— 整段排除，<code>right = mid - 1</code>。</li>
</ul>

每轮排除一半，而不变量<strong>一次都不被违反</strong>（被排除的那一半里绝不可能有答案）。当区间空了（<code>left &gt; right</code>），不变量的逆否命题直接给出结论：target 不在数组里，返回 <code>-1</code>。

所以整个算法只有三条铁律，且它们<strong>都源自"闭区间 <code>[left, right]</code>"这一个约定</strong> —— 换约定就得整套换（左闭右开的 <code>[left, right)</code> 版本是 <code>while (left &lt; right)</code> + <code>right = mid</code>，两派混用正是二分出错的根源）：
<ol>
<li><code>while (left &lt;= right)</code> —— 闭区间为空的条件恰好是 <code>left === right + 1</code>；</li>
<li><code>mid = left + ((right - left) &gt;&gt; 1)</code> —— 在 Java/C++ 里 <code>(left + right)</code> 会爆 <code>int</code>；</li>
<li><code>left = mid + 1</code> / <code>right = mid - 1</code> —— <code>mid</code> <strong>已经检查过</strong>，不能带着它继续。</li>
</ol>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">search</span><span class="p">(</span><span class="n">nums</span><span class="p">,</span> <span class="n">target</span><span class="p">):</span>
    <span class="n">left</span><span class="p">,</span> <span class="n">right</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">while</span> <span class="n">left</span> <span class="o">&lt;=</span> <span class="n">right</span><span class="p">:</span>                      <span class="c1"># 闭区间非空</span>
        <span class="n">mid</span> <span class="o">=</span> <span class="n">left</span> <span class="o">+</span> <span class="p">((</span><span class="n">right</span> <span class="o">-</span> <span class="n">left</span><span class="p">)</span> <span class="o">&gt;&gt;</span> <span class="mi">1</span><span class="p">)</span>    <span class="c1"># 防爆 int</span>
        <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]</span> <span class="o">==</span> <span class="n">target</span><span class="p">:</span>
            <span class="k">return</span> <span class="n">mid</span>
        <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]</span> <span class="o">&lt;</span> <span class="n">target</span><span class="p">:</span>
            <span class="n">left</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span>                    <span class="c1"># mid 检查过，跳过</span>
        <span class="k">else</span><span class="p">:</span>
            <span class="n">right</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="o">-</span><span class="mi">1</span>
</code></pre></div>


八行代码，三个细节全是考点。记住：<strong>你不是在"折半查找"，你是在"每轮扔掉一半嫌疑、且绝不误伤嫌疑人"</strong>。
<h2>二、LC 69 核心洞察：答案不在数组里，在谓词的边界上</h2>

69 没有数组。但定义一个谓词：
<blockquote>

<code>P(k) := (k * k &lt;= x)</code>，<code>k</code> 在整数区间 <code>[0, x]</code> 上。
</blockquote>

<code>k</code> 越大 <code>k²</code> 越大，所以 <code>P</code> 在整条区间上<strong>必然"前真后假"</strong>：
<div class="codehilite"><pre><span></span><code>k:      0    1    2    3    4   ...   x
P(k):   T    T    T    F    F   ...   F     （x=8 时：T T T F F ... F）
</code></pre></div>


"算术平方根的整数部分"是什么？就是<strong>最后一个 <code>true</code> 的下标</strong>。于是 704 的模板一步不改地搬过来 —— 把 <code>nums[mid]</code> 换成 <code>P(mid)</code>：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">mySqrt</span><span class="p">(</span><span class="n">x</span><span class="p">):</span>
    <span class="n">lo</span><span class="p">,</span> <span class="n">hi</span><span class="p">,</span> <span class="n">ans</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="n">x</span><span class="p">,</span> <span class="mi">0</span>
    <span class="k">while</span> <span class="n">lo</span> <span class="o">&lt;=</span> <span class="n">hi</span><span class="p">:</span>
        <span class="n">mid</span> <span class="o">=</span> <span class="n">lo</span> <span class="o">+</span> <span class="p">((</span><span class="n">hi</span> <span class="o">-</span> <span class="n">lo</span><span class="p">)</span> <span class="o">&gt;&gt;</span> <span class="mi">1</span><span class="p">)</span>
        <span class="k">if</span> <span class="n">mid</span> <span class="o">*</span> <span class="n">mid</span> <span class="o">&lt;=</span> <span class="n">x</span><span class="p">:</span>      <span class="c1"># 谓词成立</span>
            <span class="n">ans</span> <span class="o">=</span> <span class="n">mid</span>           <span class="c1"># 记下候选</span>
            <span class="n">lo</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span>        <span class="c1"># 但不停手，继续向右找更大的真</span>
        <span class="k">else</span><span class="p">:</span>
            <span class="n">hi</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="n">ans</span>
</code></pre></div>


和 704 的<strong>唯一动作之差</strong>，正是"找特定值"与"找边界"的分岔口：
<table>
<thead>
<tr>
<th></th>
<th>704 命中二分</th>
<th>69 边界二分</th>
</tr>
</thead>
<tbody>
<tr>
<td>比较成立时</td>
<td><code>return mid</code> <strong>当场收工</strong></td>
<td><code>ans = mid; lo = mid + 1</code> <strong>记候选再向右</strong></td>
</tr>
<tr>
<td>结束时机</td>
<td>命中即结束</td>
<td>区间<strong>空了</strong>才结束</td>
</tr>
<tr>
<td>答案</td>
<td>命中的 <code>mid</code></td>
<td>最后一个记下的 <code>ans</code></td>
</tr>
</tbody>
</table>

区间空时还有一条免费的性质：<code>ans === hi === lo - 1</code> —— <strong><code>hi</code> 恰好停在最后一个真上</strong>（单测把这条逐帧钉死）。这正是"红蓝边界"视角：二分结束时，<code>lo</code> 是第一个假、<code>hi</code> 是最后一个真，答案就在两指针的裂缝里。

这套"<strong>答案二分</strong>"（对答案空间做二分）是 69 真正的考点：答案不必在某个现成数组里，只要你能构造一个<strong>单调谓词</strong>，<code>[最小可能值, 最大可能值]</code> 就是你的数组。LC 875（珂珂吃香蕉）、LC 1011（包裹运力）、LC 278（第一个错误版本）全是这一句话的换皮。

<strong>另一条路：牛顿法</strong>。求 <code>k² = x</code> 的切线迭代 <code>k ← (k + x/k) / 2</code>，整数版：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">mySqrt_newton</span><span class="p">(</span><span class="n">x</span><span class="p">):</span>
    <span class="k">if</span> <span class="n">x</span> <span class="o">&lt;</span> <span class="mi">2</span><span class="p">:</span>
        <span class="k">return</span> <span class="n">x</span>
    <span class="n">k</span> <span class="o">=</span> <span class="n">x</span>
    <span class="k">while</span> <span class="n">k</span> <span class="o">*</span> <span class="n">k</span> <span class="o">&gt;</span> <span class="n">x</span><span class="p">:</span>
        <span class="n">k</span> <span class="o">=</span> <span class="p">(</span><span class="n">k</span> <span class="o">+</span> <span class="n">x</span> <span class="o">//</span> <span class="n">k</span><span class="p">)</span> <span class="o">//</span> <span class="mi">2</span>   <span class="c1"># 向 √x 二次收敛</span>
    <span class="k">return</span> <span class="n">k</span>
</code></pre></div>


<code>x = 8</code>：<code>8 → 4 → 3 → 2</code>，三步到位。牛顿法是<strong>二次收敛</strong> —— 每迭代一次有效位数翻倍，从 <code>x ≈ 2³¹</code> 出发五六步就到底，理论更快；但面试写它的人不到一成，且"为什么整除版收敛到的是 <code>⌊√x⌋</code> 而不是 <code>⌈√x⌉</code>"需要额外论证。二分版胜在每一步都走在第一节的模板上，<strong>写不错</strong>。
<h2>三、动画怎么看</h2>

<h2>七、边界情况</h2>

<strong>704</strong>：
<ul>
<li>空数组：<code>left = 0, right = -1</code>，循环一次不进，返回 -1 —— 闭区间写法天然免疫；</li>
<li>单元素命中 / 未命中：<code>[-1]</code> 找 <code>-1</code> 返回 0；找 <code>0</code> 则一探后 <code>right = -1</code> 交叉返回 -1；</li>
<li>target 比所有元素都小 / 都大：全程单边收缩，<code>log₂n + 1</code> 探封顶；</li>
<li><strong>有重复元素</strong>：704 保证无重复；若有重复，本模板返回的是"碰巧命中的那个"，不保证最左最右 —— 那是 LC 34 的事。</li>
</ul>

<strong>69</strong>：
<ul>
<li><code>x = 0</code>：<code>mid = 0</code> 成立记 <code>ans = 0</code>，返回 0；<code>x = 1</code> 同理返回 1；</li>
<li><code>x = 2³¹-1</code>：<code>mid²</code> 最大在 <code>46340² = 2147395600</code> —— 恰好越过 <code>int</code> 上限 1 个单位，是溢出陷阱的"标准雷区"（<code>2147395599</code> 的答案是 46339，差一个数答案就变）；</li>
<li>优化：<code>x ≥ 2</code> 时 <code>√x ≤ x/2 + 1</code>，<code>hi</code> 可以从 <code>x</code> 收到 <code>x/2 + 1</code>，少一探。</li>
</ul>

<h2>九、常见坑</h2>
<ol>
<li><strong><code>while (left &lt;= right)</code> 写成 <code>&lt;</code></strong>：闭区间单元素时漏检 —— <code>[-1]</code> 找 <code>-1</code> 返回 -1。约定决定条件，混派必翻车。</li>
<li><strong><code>left = mid</code> / <code>right = mid</code> 忘了 ±1</strong>：区间不再严格收缩，<code>lo == hi</code> 时原地打转<strong>死循环</strong>。记住不变量测试视角：每一帧区间宽度必须变小。</li>
<li><strong><code>(left + right) / 2</code> 爆 int</strong>：Java/C++ 里 <code>left + right</code> 可超 <code>2³¹-1</code> 变负数。写 <code>left + ((right - left) &gt;&gt; 1)</code>。JS 无此坑（number 到 2⁵³），但 JS 的 <code>&gt;&gt;</code> 会先转 32 位整数 —— 数组长度超 2³⁰ 时得用 <code>Math.floor</code>。</li>
<li><strong>69 的 <code>mid * mid</code> 溢出</strong>：<code>x = 2147395599</code> 时 <code>mid = 46340</code>，<code>mid² = 2147395600 &gt; 2³¹-1</code>，Java <code>int</code> 下变<strong>负数</strong> → 谓词误判为真 → 答案错成 46340。升 <code>long</code> 或改除法（注意除零）。</li>
<li><strong>答案二分忘了证单调</strong>：模板照搬的前提是谓词"前真后假"。<code>P(k)</code> 不单调时二分的"排除一半"没有依据 —— 先证单调再动手。</li>
<li><strong><code>(int) Math.sqrt(x)</code> 一行流</strong>：对 <code>x ≤ 2³¹-1</code> 恰好安全（double 尾数 52 位），但面试官出题就是要你写二分/牛顿；且 <code>x</code> 一旦超过 <code>2⁵³</code>，double 连整数本身都存不准，浮点误差就是真坑。</li>
<li><strong>牛顿法整除的收敛方向</strong>：<code>(k + x//k) // 2</code> 可能<strong>停在 <code>⌊√x⌋ + 1</code> 再下来</strong>，循环条件必须是 <code>k * k &gt; x</code>（用平方判停），不能数步数。</li>
</ol>
<h2>十、面试怎么答</h2>

<strong>704 的三段话</strong>：① 二分的本质是维持不变量"答案若在则恒在 <code>[left, right]</code>"，每轮排除一半且绝不误伤；② 三条铁律配套闭区间约定：<code>while (left &lt;= right)</code>、<code>mid = left + ((right - left) &gt;&gt; 1)</code> 防爆 int、收缩必带 ±1 因为 mid 检查过；③ 区间空（<code>left &gt; right</code>）时返回 -1，其时 <code>left</code> 就是插入位置（LC 35 顺手带走）。

<strong>69 的三段话</strong>：① 构造谓词 <code>P(k) = k² ≤ x</code>，它在 <code>[0, x]</code> 上前真后假，<code>⌊√x⌋</code> 就是最后一个真 —— 这是<strong>答案二分</strong>，数组是自己造的；② 与 704 唯一差异：P(mid) 成立时不返回，记候选 <code>ans = mid</code> 再向右，区间空时 <code>ans</code>（也即 <code>hi</code>）就是答案；③ 溢出对策：<code>mid²</code> 升 long 或 <code>mid &lt;= x / mid</code>（防 <code>mid = 0</code> 除零）。加分项：牛顿法 <code>k ← (k + x/k)/2</code>，二次收敛 <code>O(log log x)</code>。

若追问"为什么 <code>left &lt;= right</code> 而不是 <code>&lt;</code>"：不要背，现场推 —— 闭区间里 <code>left == right</code> 仍是<strong>一个未检查的元素</strong>，用 <code>&lt;</code> 就漏检；两派写法（闭区间 / 左闭右开）各自自洽，<strong>混用</strong>才是事故现场。
<h2>结语</h2>

这一篇把二分从"技巧"还原成"纪律"：一条不变量、一个约定、三条铁律。704 教你<strong>命中即收工</strong>，69 教你<strong>成立不收工</strong> —— 因为要找的从来不是某个元素，而是真与假的那道边界。边界一旦站稳，35、34、278、875、1011 全是同一句话的复读。
