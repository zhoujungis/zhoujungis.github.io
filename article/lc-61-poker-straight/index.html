    <noscript><div class="ns-article"><h1>【扑克】5 张牌判断顺子：王只补缺失，补不了重复</h1><div class="ns-meta">2026/10/14 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>

给定 5 张牌，牌面数字 1~13（A=1，J=11，Q=12，K=13），判断是不是顺子（连续 5 张）。追问：如果牌里有大小王（记作 0，可当任意牌），怎么判断？
<div class="codehilite"><pre><span></span><code>输入: [1, 2, 3, 4, 5]
输出: true

输入: [0, 0, 1, 2, 5]     两张王补上 3、4，凑出 1-2-3-4-5
输出: true
</code></pre></div>


这就是 <a href="/article/lc-61-poker-straight/">LeetCode 面试题 61. 扑克牌中的顺子</a>（剑指 Offer 61）。这题代码只有十行，但面试分数全在细节里：重复怎么办、王怎么算、边界怎么判。官方样例只有两组，恰好把三个最常见的错法全部放过去了。
<ul>
<li><a href="#section-1">一、核心洞察：把「连续 5 张」塌缩成「相邻差」</a></li>
<li><a href="#section-2">二、基础版：没有王，相邻差必须全是 1</a></li>
<li><a href="#section-3">三、含大小王：排序、数王、补洞</a></li>
<li><a href="#section-4">四、动画怎么看</a></li>
<li><a href="#section-5">五、完整推演表</a></li>
<li><a href="#section-6">六、Java 版：两个官方样例抓得住的错</a></li>
<li><a href="#section-7">七、变体：环形 A、k 张王、n 张牌</a></li>
<li><a href="#section-8">八、复杂度</a></li>
<li><a href="#section-9">九、常见坑：官方样例抓不住的三个 bug</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：把「连续 5 张」塌缩成「相邻差」</h2>

<strong>不要问「这 5 张是不是顺子」，要问「排序之后，相邻两张差多少」。</strong>

5 张连续的牌，排序后相邻差全是 1；有断档的地方，差就大于 1。而大小王（0）是一张「万能填空牌」：断档缺几个数，就拿几张王去填。这一句话就是全部的算法：
<div class="codehilite"><pre><span></span><code>排序 → 数王 → 逐对检查相邻差 → 差多少就补多少王 → 王够就是顺子
</code></pre></div>


但有一条约束藏在题面里，漏掉它的人最多：<strong>顺子是 5 个互不相同的数。王能填「缺失的数」，填不了「重复的数」</strong> —— <code>[1,2,2,3,4]</code> 里有两个 2，再来十张王也变不成顺子。
<blockquote>

一句话总结：<strong>无重复 + 跨度够小，就一定是顺子；王只是把「跨度」的上限从 4 放宽了一点。</strong>
</blockquote>
<h2>二、基础版：没有王，相邻差必须全是 1</h2>

先解追问之前的版本：牌面 1~13、没有王。5 张不同的牌连续，排序后每对相邻牌的差恰好是 1 —— 任何一处差 2 就意味着中间缺了一个数，而没人能补。

等价的写法是用跨度：5 个互不相同的数连续，最小值和最大值必须正好差 4（比如 1-5、9-13）。于是得到两条判据，缺一不可：
<div class="codehilite"><pre><span></span><code>无重复          （5 个数互不相同）
max - min = 4   （跨度恰好 4）
</code></pre></div>


注意第二条是 <code>= 4</code> 不是 <code>&lt;= 4</code>：<code>[1,2,3,4,6]</code> 跨度 5，看着只差一点，但中间实实在在缺一个 5。
<h2>三、含大小王：排序、数王、补洞</h2>

加上大小王（0 当任意牌）之后，判据从「差必须是 1」放宽成「差超过 1 的地方，拿王去补」。完整代码：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">is_straight</span><span class="p">(</span><span class="n">cards</span><span class="p">:</span> <span class="nb">list</span><span class="p">[</span><span class="nb">int</span><span class="p">])</span> <span class="o">-&gt;</span> <span class="nb">bool</span><span class="p">:</span>
    <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="n">cards</span><span class="p">)</span> <span class="o">!=</span> <span class="mi">5</span><span class="p">:</span>
        <span class="k">raise</span> <span class="ne">ValueError</span><span class="p">(</span><span class="s2">&quot;必须恰好 5 张牌&quot;</span><span class="p">)</span>
    <span class="n">s</span> <span class="o">=</span> <span class="nb">sorted</span><span class="p">(</span><span class="n">cards</span><span class="p">)</span>          <span class="c1"># 王（0）小于所有牌面，自动排到最前</span>
    <span class="n">jokers</span> <span class="o">=</span> <span class="n">s</span><span class="o">.</span><span class="n">count</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span>        <span class="c1"># 每张王 = 一次「任意填」的机会</span>
    <span class="n">rest</span> <span class="o">=</span> <span class="n">s</span><span class="p">[</span><span class="n">jokers</span><span class="p">:]</span>          <span class="c1"># 非王牌，升序</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">rest</span><span class="p">)):</span>
        <span class="k">if</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">==</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]:</span>
            <span class="k">return</span> <span class="kc">False</span>       <span class="c1"># 重复：王填不了已有的数</span>
        <span class="k">if</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">-</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span> <span class="o">&gt;</span> <span class="mi">1</span><span class="p">:</span>
            <span class="n">jokers</span> <span class="o">-=</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">-</span> <span class="n">rest</span><span class="p">[</span><span class="n">i</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span> <span class="o">-</span> <span class="mi">1</span>   <span class="c1"># 中间的洞拿王补</span>
            <span class="k">if</span> <span class="n">jokers</span> <span class="o">&lt;</span> <span class="mi">0</span><span class="p">:</span>
                <span class="k">return</span> <span class="kc">False</span>   <span class="c1"># 王用完了还不够</span>
    <span class="k">return</span> <span class="kc">True</span>
</code></pre></div>


三步分解：<strong>排序</strong>（王浮到最前）、<strong>数王</strong>（<code>jokers</code> 张王是预算）、<strong>逐对补洞</strong>（相邻差 <code>gap</code> 大于 1 就消耗 <code>gap - 1</code> 张王）。重复检查放在补洞之前 —— 这两个失败原因是独立的，谁都救不了谁。

还有一个更漂亮的等价判据，一行就能写完：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">is_straight</span><span class="p">(</span><span class="n">cards</span><span class="p">:</span> <span class="nb">list</span><span class="p">[</span><span class="nb">int</span><span class="p">])</span> <span class="o">-&gt;</span> <span class="nb">bool</span><span class="p">:</span>
    <span class="n">s</span> <span class="o">=</span> <span class="nb">sorted</span><span class="p">(</span><span class="n">cards</span><span class="p">)</span>
    <span class="n">rest</span> <span class="o">=</span> <span class="p">[</span><span class="n">c</span> <span class="k">for</span> <span class="n">c</span> <span class="ow">in</span> <span class="n">s</span> <span class="k">if</span> <span class="n">c</span> <span class="o">!=</span> <span class="mi">0</span><span class="p">]</span>
    <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="nb">set</span><span class="p">(</span><span class="n">rest</span><span class="p">))</span> <span class="o">!=</span> <span class="nb">len</span><span class="p">(</span><span class="n">rest</span><span class="p">):</span>
        <span class="k">return</span> <span class="kc">False</span>
    <span class="k">return</span> <span class="kc">True</span> <span class="k">if</span> <span class="ow">not</span> <span class="n">rest</span> <span class="k">else</span> <span class="nb">max</span><span class="p">(</span><span class="n">rest</span><span class="p">)</span> <span class="o">-</span> <span class="nb">min</span><span class="p">(</span><span class="n">rest</span><span class="p">)</span> <span class="o">&lt;</span> <span class="mi">5</span>
</code></pre></div>


为什么 <code>&lt; 5</code> 就够了？设非王牌有 <code>m = 5 - k</code> 张（<code>k</code> 是王数），它们互不相同，中间的洞数是 <code>跨度 - (m - 1)</code>。「王够」即 <code>k &gt;= 跨度 - (m - 1)</code>，代入 <code>m = 5 - k</code> 化简后正好是 <code>跨度 &lt;= 4</code>，也就是 <code>跨度 &lt; 5</code>。无王时它自动收紧成 <code>跨度 = 4</code>（因为 5 个不同数的跨度至少是 4）—— <strong>一条判据同时覆盖了两个版本</strong>。

<h2>四、动画怎么看</h2>

<strong>动画一（<code>[3, 0, 7, 5, 4]</code>，7 帧）</strong> 演示完整流程。乱序入手，排序后王浮到最前；然后逐对检查非王牌：<code>3→4</code> 差 1 天然连续，<code>4→5</code> 差 1 天然连续，<code>5→7</code> 差 2 缺一个 6 —— 拿唯一一张王补上，预算刚好用完。画面分五段：
<ul>
<li><strong>横幅</strong>：当前阶段（排序 / 数王 / 检查相邻对 / 判定）、动作、关键数值；</li>
<li><strong>牌面</strong>：排序后的 5 张牌，王烫金，当前检查的相邻对橙框相连；</li>
<li><strong>相邻对账本</strong>：每对非王牌一枚 chip（差 1 连续 / 差 N 王补 / 重复 / 王不够），检查到哪枚亮到哪枚；</li>
<li><strong>拼出的顺子</strong>：已经接上的连续段，王补的格子烫金标注「王补」；</li>
<li><strong>判定</strong>：是顺子（绿）/ 不是顺子（红）+ 王的用量。</li>
</ul>

值得盯的是第 6 帧（<code>5→7</code>）：这是全程唯一一次动用王，缺的 6 被烫金标出，王的预算从 1 变 0 —— 「刚好够」和「不够」之间没有任何缓冲。

这题没有溢出问题（5 张牌、最大 13），Java 版的坑全在变量的初始化上。两个经典错误，官方样例<strong>都能</strong>抓住，列出来是因为它们出现频率极高：

<strong>错法一：<code>min</code> 用 0 初始化。</strong> 写 <code>int min = 0, max = 0</code> 再扫一遍求最值 —— 非王牌最小也比 0 大，<code>min</code> 永远停在 0，跨度虚大。<code>[1,2,3,4,5]</code> 被判成 <code>max - min = 5</code>，直接返回 false。官方样例 1 就是这个输入，一跑便知。

<strong>错法二：把王算进跨度。</strong> 求 <code>max - min</code> 时没有跳过 0 —— 王比所有牌面都小，<code>min</code> 被王占走，跨度虚大。<code>[0,0,1,2,5]</code> 被算成 <code>5 - 0 = 5</code>，判 false，正确是 true。官方样例 2 一跑便知。

两个错法共享同一个教训：<strong>王不是一张「数字为 0 的牌」，它是「还没有决定是什么」的牌</strong> —— 统计跨度、查重复、算差值时都不该有它的戏份，它唯一的出场方式是「补洞」。

<h2>九、常见坑：官方样例抓不住的三个 bug</h2>

官方样例只有两组：<code>[1,2,3,4,5]</code> 和 <code>[0,0,1,2,5]</code>。第一组无王且完美连续，第二组两张王正好补满两个洞 —— <strong>重复、王不够补、王的记账方式，样例一个都没考到</strong>。下面三个错法在两组样例上全部返回 true，一声不响，各自的最小反例才能现形：
<h3>9.1 不查重复，只看跨度</h3>

只判 <code>max(非王) - min(非王) &lt; 5</code>，不查重复。反例 <code>[1,2,2,3,4]</code>：非王跨度 3，判据放行 —— 但两个 2 重复，王填不了已有的数。更极端的 <code>[2,2,2,2,2]</code> 跨度 0，错法照样判 true。<strong>测顺子必带一组带重复的用例。</strong>
<h3>9.2 判据写成 ≤ 5</h3>

5 张无王的牌要连续，跨度必须<strong>恰好是 4</strong>。写成 <code>&lt;= 5</code>，<code>[1,2,3,4,6]</code>（跨度 5、无王）被放过去 —— 它中间实实在在缺一个 5，而手里没有王。<code>&lt;</code> 和 <code>&lt;=</code> 的一字之差，恰好落在样例覆盖不到的边界上。
<h3>9.3 遍历从下标 1 开始，把「王-王」也算成相邻对</h3>

剑指的经典错写法：排序后 <code>for i in 1..4: gap += nums[i] - nums[i-1] - 1</code>，最后判 <code>gap &lt;= 王数</code>。看着没问题，但 0 和 0 这一对也被算了进去：<code>0 - 0 - 1 = -1</code>，<strong>每对王贡献一个负 gap，把真正的洞抵掉了</strong>。

反例 <code>[0,0,1,2,6]</code>：四对相邻差的账面是 <code>-1, 0, 0, 3</code>，合计 2，两张王「刚好够」—— 实际呢？非王 <code>[1,2,6]</code>，要补的是 3、4、5 三个洞，2 张王根本不够。正确答案是 false，错法判 true。
<div class="algo-viz algo-viz--poker61bug"></div>


<strong>测法</strong>：<code>[1,2,2,3,4]</code>（重复）、<code>[1,2,3,4,6]</code>（跨 5 无王）、<code>[0,0,1,2,6]</code>（王被负 gap 抵掉）这三组反例应当常备 —— 每一组都精准打在一条被忽略的约束上。三个错法方向一致：<strong>把不是顺子的放过去</strong>。对照第六节的两个错法（<code>min</code> 初始化为 0、王算进跨度），那两个方向相反、会把顺子错杀，而且官方样例恰好能抓住 —— 样例的覆盖是有偏的，不能只靠它。
<h2>十、面试怎么答</h2>

30 秒版本：
<blockquote>

排序，王（0）浮到最前；数王，每张王是一次任意填的机会；逐对检查非王牌的相邻差：差 1 连续，差 N 就消耗 N-1 张王补中间的洞，遇到重复直接 false —— 王能填缺失的数，填不了已有的数。王用完还不够，就不是顺子。时间空间都是 O(1)。
</blockquote>
