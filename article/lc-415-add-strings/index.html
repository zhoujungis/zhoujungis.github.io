    <noscript><div class="ns-article"><h1>【LC 415】字符串相加：竖式加法 —— 把小学列竖式翻译成代码</h1><div class="ns-meta">2026/9/29 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>

给定两个字符串形式的非负整数 <code>num1</code> 和 <code>num2</code>，计算它们的和并同样以字符串形式返回。

你不能使用任何内建的用于处理大整数的库（比如 BigInteger），也不能直接将输入的字符串转换为整数形式。

示例：
<div class="codehilite"><pre><span></span><code>输入: num1 = &quot;456&quot;, num2 = &quot;77&quot;
输出: &quot;533&quot;
</code></pre></div>


腾讯面试高频（TOP 9 常客），还有两个常见延伸：大数相加<strong>含负数</strong>（符号处理 + 转减法），以及进阶的<strong>大数相乘</strong>（LC 43）。这篇把主解法和两个延伸一次讲透。
<ul>
<li><a href="#section-1">一、核心洞察：不是算法题，是翻译题</a></li>
<li><a href="#section-2">二、拆解：三个实现要点</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、变体：含负数、大数相乘、二进制与链表</a></li>
<li><a href="#section-6">六、Java 版</a></li>
<li><a href="#section-7">七、边界情况</a></li>
<li><a href="#section-8">八、复杂度</a></li>
<li><a href="#section-9">九、常见坑</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：不是算法题，是翻译题</h2>

这题的送分处和难点是同一句话：
<blockquote>

<strong>"不能转整数"不是刁难，而是排除法</strong> —— 它把「先转数字再算」的捷径全部排除，剩下的唯一解法就是你小学二年级学的<strong>列竖式</strong>。
</blockquote>

面试官想看的就是这件事：<strong>你能不能把一个"生活里已经会"的过程，一丝不漏地翻译成代码</strong>。竖式人人会列，但翻译成代码时几乎人人漏东西 —— 漏进位、漏补零、漏最后一位的进位。所以这题考的不是"想出算法"，而是<strong>写的完整度</strong>。

竖式的过程拆开看，每一列只有一次决策：
<div class="codehilite"><pre><span></span><code>    1 1          ← 进位行（手算时写在顶上的小 1）
    4 5 6
+     7 7
-------
  5 3 3          ← 从个位往高位，一列一列算出来
</code></pre></div>


个位：6 + 7 = 13，<strong>写下 3，进位 1 带上一位</strong>；十位：5 + 7 + 1 = 13，写下 3 进 1；百位：4 + 0 + 1 = 5（num2 没有百位，<strong>补 0</strong>），写下 5 进 0 —— 结束。

三个关键词：<strong>从个位开始（末尾对齐）、写下个位带走进位、缺位补零</strong>。翻译成代码就是双指针从两个串的末尾出发，加上一个 <code>carry</code> 变量。
<h2>二、拆解：三个实现要点</h2>
<h3>2.1 对齐：下标判断补零，不动原串</h3>

两个串长度不等，怎么对齐数位？两种做法：
<table>
<thead>
<tr>
<th>做法</th>
<th>写法</th>
<th>评价</th>
</tr>
</thead>
<tbody>
<tr>
<td>先补零对齐</td>
<td><code>padStart</code> 把短串补齐再逐位加</td>
<td>多复制一份，且忘了去前导零会出错</td>
</tr>
<tr>
<td><strong>下标判断</strong></td>
<td><code>i &gt;= 0 ? num1[i] - 48 : 0</code></td>
<td>零拷贝，一 BM 一行解决 ✅</td>
</tr>
</tbody>
</table>

选后者。<code>i &lt; 0</code> 表示 num1 这一位已经用完，<strong>这一列它贡献 0</strong> —— 注意是"贡献 0"，不是"跳过这列"：列还在，只是这一侧的加数是 0。
<h3>2.2 每一列：加、写、进</h3>
<div class="codehilite"><pre><span></span><code>sum  = a + b + carry      ← a、b 是这一列的两个数字（含补零），carry 是低位带上来的
out  = sum % 10           ← 写下的本位
carry = sum &gt;= 10 ? 1 : 0 ← 带上一位的进位（两个非负一位数相加，进位最多是 1）
</code></pre></div>


为什么进位最多是 1？<code>9 + 9 + 1 = 19</code>，就算两个加数都是 9、低位还进 1，和也不会到 20 —— 所以 <code>carry</code> 是 0/1 变量，不是"除以 10 取整"的一般化。这是非负十进制竖式的特例，写代码时可以直接利用。
<h3>2.3 循环条件：三连 or</h3>

这是<strong>全题最容易漏的一处</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">while</span> <span class="n">i</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">j</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">carry</span> <span class="o">&gt;</span> <span class="mi">0</span><span class="p">:</span>   <span class="c1"># 三连 or，一个都不能少</span>
</code></pre></div>


前两个条件管"还有数位没加"，<code>carry &gt; 0</code> 管"最后还有进位要长出一位"。漏掉 <code>carry</code> 的经典翻车现场：
<div class="codehilite"><pre><span></span><code>&quot;999&quot; + &quot;1&quot;：
  9+1=10 写 0 进 1；9+0+1=10 写 0 进 1；9+0+1=10 写 0 进 1
  两串都走完了 —— 但 carry 还是 1！
漏 carry → 输出 &quot;000&quot;      正确 → &quot;1000&quot;
</code></pre></div>

<h3>2.4 完整代码（Python）</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">addStrings</span><span class="p">(</span><span class="n">num1</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">num2</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="n">i</span><span class="p">,</span> <span class="n">j</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">num1</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">num2</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="n">carry</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="n">res_low_to_high</span> <span class="o">=</span> <span class="p">[]</span>          <span class="c1"># 低位在前，push 顺序天然从个位往高位</span>

    <span class="k">while</span> <span class="n">i</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">j</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">carry</span> <span class="o">&gt;</span> <span class="mi">0</span><span class="p">:</span>
        <span class="n">a</span> <span class="o">=</span> <span class="nb">ord</span><span class="p">(</span><span class="n">num1</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="o">-</span> <span class="mi">48</span> <span class="k">if</span> <span class="n">i</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="k">else</span> <span class="mi">0</span>
        <span class="n">b</span> <span class="o">=</span> <span class="nb">ord</span><span class="p">(</span><span class="n">num2</span><span class="p">[</span><span class="n">j</span><span class="p">])</span> <span class="o">-</span> <span class="mi">48</span> <span class="k">if</span> <span class="n">j</span> <span class="o">&gt;=</span> <span class="mi">0</span> <span class="k">else</span> <span class="mi">0</span>
        <span class="n">s</span> <span class="o">=</span> <span class="n">a</span> <span class="o">+</span> <span class="n">b</span> <span class="o">+</span> <span class="n">carry</span>
        <span class="n">res_low_to_high</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">s</span> <span class="o">%</span> <span class="mi">10</span><span class="p">)</span>
        <span class="n">carry</span> <span class="o">=</span> <span class="mi">1</span> <span class="k">if</span> <span class="n">s</span> <span class="o">&gt;=</span> <span class="mi">10</span> <span class="k">else</span> <span class="mi">0</span>
        <span class="n">i</span> <span class="o">-=</span> <span class="mi">1</span>
        <span class="n">j</span> <span class="o">-=</span> <span class="mi">1</span>

    <span class="k">return</span> <span class="s1">&#39;&#39;</span><span class="o">.</span><span class="n">join</span><span class="p">(</span><span class="nb">map</span><span class="p">(</span><span class="nb">str</span><span class="p">,</span> <span class="nb">reversed</span><span class="p">(</span><span class="n">res_low_to_high</span><span class="p">)))</span>
</code></pre></div>


两个实现细节：
<ul>
<li><strong>数字转值用 <code>ord(c) - 48</code></strong>（或 <code>c - '0'</code>）：数字字符 <code>'0'</code> 到 <code>'9'</code> 的 ASCII 码连续，减掉 <code>'0'</code> 的码值 48 就是数值。这是"逐字符转数字"，<strong>不是</strong>"整串转整数" —— 不违反题意。</li>
<li><strong>结果用数组 push 再 reverse</strong>：竖式天然从低位往高位生成，push 到数组尾部正好是低位在前，最后 reverse 一次 join。<strong>别用 <code>unshift</code>/头插</strong> —— 每次 O(n) 的头部搬移，整个算法退化成 O(n²)（见第九节坑 4）。</li>
</ul>
<div class="algo-viz algo-viz--lc415"></div>

<h2>三、动画怎么看</h2>

动画就是一张竖式：num1 行、num2 行右对齐（短串左侧空缺列画成灰虚格），横线下面是结果行 —— 它比上面多一格，<strong>留给最后一次进位长出来的那一位</strong>。
<ul>
<li><strong>digit 帧</strong>：当前列淡金底，<code>i</code>、<code>j</code> 两根指针分别压在两行刚参与相加的格子上；该侧补零时格子显示灰色的 0；顶上的小 <code>1</code>（进位）标在下一列上方 —— 和你手算时写在竖式顶上的进位一模一样；结果行刚写出的格子橙色描边。</li>
<li><strong>done 帧</strong>：结果行整体变绿，横幅给出答案字符串。</li>
</ul>

看点有两个：一是<strong>补零格的灰 0</strong> —— "缺位贡献 0，列照算不误"；二是<strong>最后溢出格</strong> —— 如果最后一列算完 carry 还是 1，结果行最左那格就会从虚线空格变成 1（把输入换成 <code>"999"</code> 和 <code>"1"</code> 可以看到）。

对照检查三个要点：第 3 帧 <code>j = -1</code>，num2 没有百位，<code>b</code> 补 0 而列照算；第 2、3 帧 <code>carryIn = 1</code> 接住上一帧的 <code>carryOut</code>；三列算完 <code>carryOut = 0</code>，循环终止 —— 如果最后还有进位，就会多出一帧长出第 4 位。
<h2>五、变体：含负数、大数相乘、二进制与链表</h2>
<h3>5.1 腾讯变体：大数相加含负数</h3>

输入可能带负号（如 <code>"-123"</code> + <code>"45"</code>）。解法骨架不变，<strong>外面套一层符号分发</strong>：
<ol>
<li><strong>拆符号</strong>：先取每个串的符号和绝对值部分（<code>'-123'</code> → 负，<code>'123'</code>）；</li>
<li><strong>同号</strong>：绝对值做竖式加法（就是本题），符号保持；</li>
<li><strong>异号</strong>：转成<strong>大数减法</strong> —— 先比较两个绝对值的大小（<strong>先比长度，等长再按字典序逐位比</strong>；字符串比大小只能这么比，不能转数字），然后用大的减小的，符号跟随绝对值大的一方。</li>
</ol>

减法的竖式和加法对称，但有一个加法没有的坑：<strong>借位</strong>。<code>a - b - borrow &lt; 0</code> 时要 <code>+ 10</code> 并把 borrow 置 1；而且结果可能产生<strong>前导零</strong>（<code>"1000" - "999"</code> 逐位算出 <code>"0001"</code>），返回前必须剥掉 —— 只留最后一位，其余 0 全剥（<code>"000"</code> 要返回 <code>"0"</code> 不是空串）。

面试时先把四种符号组合枚举成一张表再动手（<code>++</code>/<code>--</code> 直接加，<code>-+</code>/<code>+-</code> 转减法），这张表就是你的正确性论证，比边写边想稳得多。
<h3>5.2 进阶：大数相乘（LC 43）</h3>

竖式乘法：<code>num1</code> 的第 <code>i</code> 位乘 <code>num2</code> 的第 <code>j</code> 位，乘积落在<strong>结果的第 <code>i + j + 1</code> 位</strong>（两串各自低位对齐后，<code>i</code>、<code>j</code> 从 0 计）—— 这个"下标恰好相加"的规律是整题的题眼，背下来直接写：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">multiply</span><span class="p">(</span><span class="n">num1</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">num2</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="k">if</span> <span class="n">num1</span> <span class="o">==</span> <span class="s2">&quot;0&quot;</span> <span class="ow">or</span> <span class="n">num2</span> <span class="o">==</span> <span class="s2">&quot;0&quot;</span><span class="p">:</span>
        <span class="k">return</span> <span class="s2">&quot;0&quot;</span>
    <span class="n">m</span><span class="p">,</span> <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">num1</span><span class="p">),</span> <span class="nb">len</span><span class="p">(</span><span class="n">num2</span><span class="p">)</span>
    <span class="n">res</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="p">(</span><span class="n">m</span> <span class="o">+</span> <span class="n">n</span><span class="p">)</span>           <span class="c1"># 乘积最多 m+n 位</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">m</span> <span class="o">-</span> <span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">):</span>
        <span class="k">for</span> <span class="n">j</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span> <span class="o">-</span> <span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">):</span>
            <span class="n">mul</span> <span class="o">=</span> <span class="p">(</span><span class="nb">ord</span><span class="p">(</span><span class="n">num1</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="o">-</span> <span class="mi">48</span><span class="p">)</span> <span class="o">*</span> <span class="p">(</span><span class="nb">ord</span><span class="p">(</span><span class="n">num2</span><span class="p">[</span><span class="n">j</span><span class="p">])</span> <span class="o">-</span> <span class="mi">48</span><span class="p">)</span>
            <span class="n">p1</span><span class="p">,</span> <span class="n">p2</span> <span class="o">=</span> <span class="n">i</span> <span class="o">+</span> <span class="n">j</span><span class="p">,</span> <span class="n">i</span> <span class="o">+</span> <span class="n">j</span> <span class="o">+</span> <span class="mi">1</span>
            <span class="n">total</span> <span class="o">=</span> <span class="n">mul</span> <span class="o">+</span> <span class="n">res</span><span class="p">[</span><span class="n">p2</span><span class="p">]</span>
            <span class="n">res</span><span class="p">[</span><span class="n">p2</span><span class="p">]</span> <span class="o">=</span> <span class="n">total</span> <span class="o">%</span> <span class="mi">10</span>
            <span class="n">res</span><span class="p">[</span><span class="n">p1</span><span class="p">]</span> <span class="o">+=</span> <span class="n">total</span> <span class="o">//</span> <span class="mi">10</span>   <span class="c1"># 进位往高位累加，之后统一处理</span>
    <span class="c1"># 剥前导零</span>
    <span class="n">k</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="k">while</span> <span class="n">k</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">res</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span> <span class="ow">and</span> <span class="n">res</span><span class="p">[</span><span class="n">k</span><span class="p">]</span> <span class="o">==</span> <span class="mi">0</span><span class="p">:</span>
        <span class="n">k</span> <span class="o">+=</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="s1">&#39;&#39;</span><span class="o">.</span><span class="n">join</span><span class="p">(</span><span class="nb">map</span><span class="p">(</span><span class="nb">str</span><span class="p">,</span> <span class="n">res</span><span class="p">[</span><span class="n">k</span><span class="p">:]))</span>
</code></pre></div>


注意它和加法的关系：<strong>进位的搬运和竖式加法完全同款</strong>（满十进一），只是每列的"加数"从一个变成了 <code>m</code> 个乘积的累加 —— 所以 LC 43 本质上是"LC 415 的每列叠了多层"。
<h3>5.3 同族题</h3>
<table>
<thead>
<tr>
<th>题</th>
<th>变化点</th>
<th>一句话</th>
</tr>
</thead>
<tbody>
<tr>
<td>LC 67 二进制求和</td>
<td>基数从 10 变 2</td>
<td>骨架原样复用：<code>sum % base</code> 写下、<code>sum // base</code>（二进制下就是 <code>sum &gt;= 2</code>）进位 —— 把 10 全换成 base 参数化</td>
</tr>
<tr>
<td>LC 2 两数相加</td>
<td>数字存在<strong>链表</strong>里</td>
<td>链表头就是个位 —— 天然从低位往高存，<strong>正好是竖式的生成顺序</strong>，连 reverse 都省了</td>
</tr>
<tr>
<td>LC 43 大数相乘</td>
<td>每列多层累加</td>
<td><code>i + j + 1</code> 落位 + 同款进位搬运</td>
</tr>
</tbody>
</table>

家族口诀：<strong>"逐位处理 + 进位/借位变量 + 三连 or 循环条件"就是整个大数运算家族的通用骨架</strong>，变的只是 base（67）、存储方向（2）和每列的运算量（43）。
<h2>六、Java 版</h2>
<div class="codehilite"><pre><span></span><code><span class="kd">public</span><span class="w"> </span><span class="n">String</span><span class="w"> </span><span class="nf">addStrings</span><span class="p">(</span><span class="n">String</span><span class="w"> </span><span class="n">num1</span><span class="p">,</span><span class="w"> </span><span class="n">String</span><span class="w"> </span><span class="n">num2</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">num1</span><span class="p">.</span><span class="na">length</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">num2</span><span class="p">.</span><span class="na">length</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">carry</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="n">StringBuilder</span><span class="w"> </span><span class="n">sb</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">new</span><span class="w"> </span><span class="n">StringBuilder</span><span class="p">();</span><span class="w">   </span><span class="c1">// append 尾插 = 低位在前</span>

<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="p">(</span><span class="n">i</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">carry</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kt">int</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="n">num1</span><span class="p">.</span><span class="na">charAt</span><span class="p">(</span><span class="n">i</span><span class="p">)</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="sc">&#39;0&#39;</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">        </span><span class="kt">int</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="n">num2</span><span class="p">.</span><span class="na">charAt</span><span class="p">(</span><span class="n">j</span><span class="p">)</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="sc">&#39;0&#39;</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">        </span><span class="kt">int</span><span class="w"> </span><span class="n">s</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">carry</span><span class="p">;</span>
<span class="w">        </span><span class="n">sb</span><span class="p">.</span><span class="na">append</span><span class="p">(</span><span class="n">s</span><span class="w"> </span><span class="o">%</span><span class="w"> </span><span class="mi">10</span><span class="p">);</span>
<span class="w">        </span><span class="n">carry</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">s</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">10</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">        </span><span class="n">i</span><span class="o">--</span><span class="p">;</span><span class="w"> </span><span class="n">j</span><span class="o">--</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">sb</span><span class="p">.</span><span class="na">reverse</span><span class="p">().</span><span class="na">toString</span><span class="p">();</span>
<span class="p">}</span>
</code></pre></div>


Java 的 <code>StringBuilder.append</code> 尾插 + 最后 <code>reverse</code>，和 Python 的 push + reversed 完全同构。
<h2>七、边界情况</h2>

<h2>八、复杂度</h2>
<ul>
<li><strong>时间 O(max(m, n))</strong>：每一列一次加法，列数是较长串的长度（溢出时多一列）。</li>
<li><strong>额外空间 O(1)</strong>：只有 <code>carry</code> 和两个指针；结果串本身是题目要求的输出，不计入（Python 的 <code>reversed</code> + <code>join</code> 是构造输出，不是辅助数据结构）。</li>
</ul>

对照被排除的做法：转 int / BigInteger 在语言里通常是 O(n²) 甚至更差（大数乘法的复杂度），而且题目明令禁止；<code>padStart</code> 补零法多 O(m+n) 的拷贝，量级不变但常数和出错面都大。
<h2>九、常见坑</h2>
<h3>9.1 循环条件漏掉 carry</h3>

三连 or 少最后一个：<code>"999" + "1"</code> 输出 <code>"000"</code> 而不是 <code>"1000"</code>。<strong>最高位溢出</strong>是这题最经典的丢分点，写完先跑这个用例。
<h3>9.2 一侧走完后"跳过"而不是"补 0"</h3>

<code>i &lt; 0</code> 时这列 num1 贡献 0，<strong>列照算</strong>。写成 <code>if (i &gt;= 0 &amp;&amp; j &gt;= 0)</code> 才进循环的话，短串走完整个循环就停了，长串剩余部分和进位全丢。
<h3>9.3 字符转数值用错方法</h3>

<code>num1[i]</code> 是<strong>字符</strong>不是数字：Python 里 <code>num1[i]</code> 得到 <code>'6'</code>，直接参与加法是类型错误；正确的是 <code>ord(c) - 48</code>（或 <code>int(c)</code>，逐字符转不违反题意）。Java 的 <code>charAt(i) - '0'</code> 同理。另外别忘了题面禁的是"整串转整数"（<code>Integer.parseInt(num1)</code> 会直接溢出），逐字符转数字恰恰是竖式的本意。
<h3>9.4 用 unshift / 头插构造结果</h3>

竖式从低位往高位生成，<code>unshift</code> 每次头插 O(n)，整体 O(n²)。<strong>push + 最后 reverse</strong>（或 StringBuilder.append + reverse），O(n) 完事。
<h3>9.5 结果前导零</h3>

本题输入保证无前导零，竖式法也不会产生前导零（多出的那一位只会在 carry 溢出时是 1），但<strong>变体里要当心</strong>：减法（含负数变体）和乘法（LC 43）都会算出前导零，返回前必须剥，且剥到只剩一位时要保留 <code>"0"</code>。
<h3>9.6 负数变体里直接照抄减 48</h3>

输入带负号时，<code>'-123'[0]</code> 是 <code>'-'</code>，<code>ord('-') - 48 = -3</code> —— 静默算出一个负"数字"，答案错得莫名其妙。变体必须<strong>先拆符号再进竖式</strong>（见 5.1），这也是面试官加负号这条件的全部用意：考你会不会在"纯算法"外面包一层工程上的输入处理。
<h2>十、面试怎么答</h2>
<ol>
<li><strong>一句话定性</strong>："不能转整数就是把捷径排除，剩下的是列竖式 —— 逐位加 + 进位变量，我直接写。"</li>
<li><strong>先说三个实现要点再动手</strong>：末尾对齐下标补零、每列加-写-进、<strong>循环条件三连 or</strong> —— 第三点主动说出来，是这题最值钱的一句。</li>
<li><strong>主动提溢出用例</strong>：<code>"999" + "1"</code> → <code>"1000"</code>，说明你意识到 carry 会长出一位。</li>
<li><strong>复杂度</strong>：O(max(m, n)) 时间，O(1) 额外空间。</li>
<li><strong>延伸准备好</strong>：含负数（符号分发表 + 减法借位 + 剥前导零）、大数相乘（<code>i + j + 1</code> 落位）—— 腾讯面试从这题出发往下追问基本就是这两条路。</li>
</ol>
<h2>结语</h2>

字符串相加表面是模拟，内核是<strong>"把一个你早就会的过程翻译成无遗漏的代码"</strong>。竖式人人会列，但三连 or、补零、reverse 这三处细节决定了翻译的完整度 —— 算法的能力边界往往不在"想到"，而在"写全"。下一题若被追问大数相乘，记住那个落位公式：<code>i + j + 1</code>。</div></div></noscript>
