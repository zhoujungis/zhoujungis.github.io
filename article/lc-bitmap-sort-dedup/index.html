    <noscript><div class="ns-article"><h1>【海量数据】10 亿整数排序去重：一张位图，119 MiB 换 4 GB</h1><div class="ns-meta">2026/10/15 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>

10 亿个无序整数，内存有限（比如 1 GB），要求<strong>排序去重</strong>后输出。如果只问个数，就是<strong>统计 distinct 个数</strong>。追问：如果还想知道哪些数重复了、哪些只出现一次，怎么办？

这就是位图（BitMap）的主场。这道题在面试里出现的频率极高，因为它考的不是某个精巧算法，而是一个思维转换：<strong>当整数有界时，「值域」本身就可以当存储用。</strong>
<ul>
<li><a href="#section-1">一、核心洞察：用「值域」换「空间」</a></li>
<li><a href="#section-2">二、基础版：1-bit 位图，去重和排序都是白送</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、2-bit 位图：去重、数重复、找唯一</a></li>
<li><a href="#section-6">六、位运算三件套与内存布局</a></li>
<li><a href="#section-7">七、变体：值域爆炸怎么办</a></li>
<li><a href="#section-8">八、复杂度与选型</a></li>
<li><a href="#section-9">九、常见坑：五个每一个都真实致命</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：用「值域」换「空间」</h2>

先算账。10 亿个 32 位整数，原样放进内存：
<div class="codehilite"><pre><span></span><code><span class="mf">10</span><span class="o">^</span><span class="mf">9</span><span class="w"> </span><span class="err">×</span><span class="w"> </span><span class="mf">4</span><span class="w"> </span><span class="n">字节</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">4</span><span class="w"> </span><span class="n">GB</span>
</code></pre></div>


一般的机器直接出局。换 <code>HashSet</code>？每个元素要装装箱后的对象、引用和哈希节点，一个元素几十字节，10 亿个就是<strong>几十 GB</strong>，比原数组还夸张。

但注意一件事：<strong>这些整数的值域是有界的</strong>。如果值域是 <code>0 ~ 10^9 - 1</code>，那一共只有 10^9 种可能的取值 —— 给每种取值发一个「来过 / 没来」的记号，只需要：
<div class="codehilite"><pre><span></span><code><span class="mf">10</span><span class="o">^</span><span class="mf">9</span><span class="w"> </span><span class="n">bit</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">10</span><span class="o">^</span><span class="mf">9</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="mf">8</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">125</span><span class="p">,</span><span class="mf">000</span><span class="p">,</span><span class="mf">000</span><span class="w"> </span><span class="n">字节</span><span class="w"> </span><span class="err">≈</span><span class="w"> </span><span class="mf">119</span><span class="w"> </span><span class="n">MiB</span>
</code></pre></div>


119 MiB，1 GB 的内存限制轻轻松松装下，还顺带解决了去重和排序：
<ul>
<li><strong>去重是白送的</strong>：一个 bit 只能置 1 一次，重复的数再来，那一位已经是 1 了；</li>
<li><strong>排序也是白送的</strong>：最后按 bit 下标从小到大扫一遍，输出天然有序。</li>
</ul>

这就是全部魔法：<strong>数据量决定你要处理多少个输入，值域决定位图要开多大。</strong> 当值域远小于「数据量 × 每个数据的字节数 × 8」时，位图就是降维打击 —— 这里压缩比是 32 : 1。
<blockquote>

一句话总结：<strong>位图不是一种排序算法，是一种「用值域大小换数据量空间」的存储决策。</strong> 排序和去重只是它的副产品。
</blockquote>
<h2>二、基础版：1-bit 位图，去重和排序都是白送</h2>
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">BitMap</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">size</span><span class="p">:</span> <span class="nb">int</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">size</span> <span class="o">=</span> <span class="n">size</span>
        <span class="c1"># 每 32 个整数挤进一个 32 位字</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">words</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="p">((</span><span class="n">size</span> <span class="o">+</span> <span class="mi">31</span><span class="p">)</span> <span class="o">//</span> <span class="mi">32</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">add</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">v</span><span class="p">:</span> <span class="nb">int</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="kc">None</span><span class="p">:</span>
        <span class="c1"># 置位：只翻 v 对应的那 1 bit，同字其他位原样不动</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">words</span><span class="p">[</span><span class="n">v</span> <span class="o">&gt;&gt;</span> <span class="mi">5</span><span class="p">]</span> <span class="o">|=</span> <span class="mi">1</span> <span class="o">&lt;&lt;</span> <span class="p">(</span><span class="n">v</span> <span class="o">&amp;</span> <span class="mi">31</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">contains</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">v</span><span class="p">:</span> <span class="nb">int</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">bool</span><span class="p">:</span>
        <span class="k">return</span> <span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">words</span><span class="p">[</span><span class="n">v</span> <span class="o">&gt;&gt;</span> <span class="mi">5</span><span class="p">]</span> <span class="o">&gt;&gt;</span> <span class="p">(</span><span class="n">v</span> <span class="o">&amp;</span> <span class="mi">31</span><span class="p">))</span> <span class="o">&amp;</span> <span class="mi">1</span> <span class="o">==</span> <span class="mi">1</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">sorted_distinct</span><span class="p">(</span><span class="bp">self</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">list</span><span class="p">[</span><span class="nb">int</span><span class="p">]:</span>
        <span class="c1"># 按 bit 下标从小到大扫，输出即有序去重序列</span>
        <span class="k">return</span> <span class="p">[</span><span class="n">v</span> <span class="k">for</span> <span class="n">v</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">size</span><span class="p">)</span> <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">contains</span><span class="p">(</span><span class="n">v</span><span class="p">)]</span>
</code></pre></div>


三步走：<strong>置位</strong>（<code>|=</code>）、<strong>判重</strong>（看一眼 bit 是 0 还是 1）、<strong>扫描</strong>（下标顺序就是值顺序）。整道题的主体就这三行。

用一组小数据走一遍 —— <code>[37, 12, 37, 5, 63, 42]</code>，值域 <code>0 ~ 63</code>（刚好两个字）：
<div class="algo-viz algo-viz--bitmap"></div>


注意第二个 37：<code>locate</code> 帧算出它落在字 1 第 5 位，那一位已经是 1 —— 直接跳过，<strong>去重就这样发生了，没有比较、没有哈希、没有额外空间</strong>。
<h2>三、动画怎么看</h2>

<strong>动画一（<code>[37, 12, 37, 5, 63, 42]</code>，14 帧）</strong> 演示 1-bit 位图全流程。每个输入数占两帧：<code>locate</code> 帧算 <code>word</code> 和 <code>bit</code>（<code>37 = 1 × 32 + 5</code>，所以是字 1 第 5 位），<code>act</code> 帧执行置位或跳过。画面分五段：
<ul>
<li><strong>横幅</strong>：当前阶段（定位 / 置位 / 跳过 / 扫描输出）和关键数值；</li>
<li><strong>位图阵列</strong>：2 行 × 32 列，一行一个字，绿 = 已置位、橙 = 当前位、金 = 命中重复，行首标 word 号、行下标 bit 刻度；</li>
<li><strong>定位等式</strong>：<code>v = word × 32 + bit</code>，置位帧额外显示指令 <code>words[w] |= 1 &lt;&lt; b</code>；</li>
<li><strong>输出 chips</strong>：已置位的值，升序排列，最新置位的烫金；</li>
<li><strong>进度判定</strong>：已置位 / 已跳过 / 共多少输入。</li>
</ul>

值得盯的是第 5、6 帧（第二个 37）：<code>locate</code> 帧就发现那一位已是 1，<code>act</code> 帧什么都不做 —— 去重发生在「看一眼」里。

<strong>动画二（<code>[3, 7, 3, 3, 12, 7]</code>，8 帧）</strong> 演示 2-bit 位图，回答三个问题：出现过哪些、哪些重复了、哪些只出现一次。

换成 10 亿规模，账本是这样的：

<tr>
<td>2-bit 全域位图</td>
<td>1 GiB</td>
<td>在 512 MiB 基础上换来「次数分档」</td>
</tr>
</tbody>
</table></div>

注意最后两行：如果值的分布不可控（可能有负数、可能是整个 int32 范围），直接按 <code>2^32</code> 开全域位图 —— 512 MiB 换一个不用操心偏移的干净实现，这笔账大多数时候都划算。
<h2>五、2-bit 位图：去重、数重复、找唯一</h2>

1-bit 位图只有一个答案维度：「出现过 / 没出现过」。想同时知道<strong>哪些数重复了、哪些只出现一次</strong>，给每个数加一个 bit：
<div class="codehilite"><pre><span></span><code><span class="mf">00</span><span class="w"> </span><span class="n">未出现</span><span class="w">  </span><span class="err">→</span><span class="w">  </span><span class="mf">01</span><span class="w"> </span><span class="n">出现一次</span><span class="w">  </span><span class="err">→</span><span class="w">  </span><span class="mf">10</span><span class="w"> </span><span class="n">出现多次</span><span class="w">  </span><span class="err">→</span><span class="w">  </span><span class="err">（</span><span class="mf">11</span><span class="w"> </span><span class="n">保留态</span><span class="err">）</span>
</code></pre></div>


转移表：
<div class="table-scroll"><table>
<thead>
<tr>
<th>当前状态</th>
<th>又来一个相同的数</th>
<th>动作</th>
</tr>
</thead>
<tbody>
<tr>
<td>00</td>
<td>第一次见到</td>
<td>翻 01</td>
</tr>
<tr>
<td>01</td>
<td>第二次见到</td>
<td>清低位置高位，翻 10</td>
</tr>
<tr>
<td>10</td>
<td>第三次及以后</td>
<td>保持，不再加码</td>
</tr>
<tr>
<td>11</td>
<td>保留态</td>
<td>兜底视作多次，翻 10</td>
</tr>
</tbody>
</table></div>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">add</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">v</span><span class="p">:</span> <span class="nb">int</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="kc">None</span><span class="p">:</span>
    <span class="n">cur</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">_state</span><span class="p">(</span><span class="n">v</span><span class="p">)</span>
    <span class="k">if</span> <span class="n">cur</span> <span class="o">==</span> <span class="mb">0b00</span><span class="p">:</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_set</span><span class="p">(</span><span class="n">v</span><span class="p">,</span> <span class="mb">0b01</span><span class="p">)</span>          <span class="c1"># 一次</span>
    <span class="k">elif</span> <span class="n">cur</span> <span class="o">==</span> <span class="mb">0b01</span><span class="p">:</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_set</span><span class="p">(</span><span class="n">v</span><span class="p">,</span> <span class="mb">0b10</span><span class="p">)</span>          <span class="c1"># 升级成多次</span>
    <span class="k">elif</span> <span class="n">cur</span> <span class="o">==</span> <span class="mb">0b11</span><span class="p">:</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_set</span><span class="p">(</span><span class="n">v</span><span class="p">,</span> <span class="mb">0b10</span><span class="p">)</span>          <span class="c1"># 保留态兜底</span>
    <span class="c1"># cur == 0b10：已经是多次，什么都不做</span>
</code></pre></div>


为什么不是「00/01/10/11 分别表示出现 0/1/2/3 次」？那样第 4 次就溢出了，而这道题只需要区分「一次」和「多次」两档 —— <strong>10 就是多次的垃圾桶</strong>，来多少都接得住。

空间代价是 1-bit 位图的两倍：int32 全域 2-bit 位图 1 GiB。换来的是一次扫描同时输出三个集合：
<div class="algo-viz algo-viz--bitmap2bit"></div>

<h2>六、位运算三件套与内存布局</h2>

三个动作，每个都对应一条位运算，值得逐字记：
<div class="codehilite"><pre><span></span><code><span class="n">定位</span><span class="err">：</span><span class="n">word</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">v</span><span class="w"> </span><span class="o">&gt;&gt;</span><span class="w"> </span><span class="mi">5</span><span class="w">      </span><span class="err">（</span><span class="n">v</span><span class="w"> </span><span class="n">落在第几个字</span><span class="err">，</span><span class="n">每字</span><span class="w"> </span><span class="mi">32</span><span class="w"> </span><span class="n">个数</span><span class="err">）</span>
<span class="w">      </span><span class="nc">bit</span><span class="w">  </span><span class="o">=</span><span class="w"> </span><span class="n">v</span><span class="w"> </span><span class="o">&amp;</span><span class="w"> </span><span class="mi">31</span><span class="w">      </span><span class="err">（</span><span class="n">v</span><span class="w"> </span><span class="n">是字内第几位</span><span class="err">）</span>
<span class="n">置位</span><span class="err">：</span><span class="n">words</span><span class="o">[</span><span class="n">word</span><span class="o">]</span><span class="w"> </span><span class="o">|=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="o">&lt;&lt;</span><span class="w"> </span><span class="nc">bit</span>
<span class="n">查存</span><span class="err">：</span><span class="p">(</span><span class="n">words</span><span class="o">[</span><span class="n">word</span><span class="o">]</span><span class="w"> </span><span class="o">&gt;&gt;</span><span class="w"> </span><span class="nc">bit</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">1</span>
<span class="n">清位</span><span class="err">：</span><span class="n">words</span><span class="o">[</span><span class="n">word</span><span class="o">]</span><span class="w"> </span><span class="o">&amp;=</span><span class="w"> </span><span class="o">~</span><span class="p">(</span><span class="mi">1</span><span class="w"> </span><span class="o">&lt;&lt;</span><span class="w"> </span><span class="nc">bit</span><span class="p">)</span><span class="w">      </span><span class="err">←</span><span class="w"> </span><span class="n">波浪号不能丢</span>
</code></pre></div>


以 37 为例：<code>37 &gt;&gt; 5 = 1</code>（在字 1），<code>37 &amp; 31 = 5</code>（字内第 5 位）—— 因为 <code>37 = 1 × 32 + 5</code>。字内 32 个 bit 互不干扰，<code>|=</code> 只翻本位，这是整套操作安全性的根基。

几个工程细节：
<ul>
<li><strong>负数要减 min 平移</strong>：<code>idx = v - min</code>。不减就是负下标，直接越界；</li>
<li><strong>字节序无关</strong>：位图按「值」寻址，不按内存布局寻址，大小端机器上行为一致；</li>
<li><strong>字长是平台细节</strong>：演示用 32 位字（对应 int32），工程上可以用 64 位字（每字 64 个数，<code>&gt;&gt; 6</code> / <code>&amp; 63</code>），寻址更粗、缓存更友好；</li>
<li><strong>扫描可以按字加速</strong>：整字是 0 就跳过 32 位，统计 distinct 个数用 popcount（<code>Integer.bitCount</code>）一次算一整个字，比逐位判存快 32 倍。</li>
</ul>
<h2>七、变体：值域爆炸怎么办</h2>

位图的前提是<strong>值域有界且不大</strong>。这个前提不成立时，套路是降维 + 分块：

<strong>64 位随机数 / UUID</strong>：值域 <code>2^64</code>，位图要 <code>2^64 bit = 2 EiB</code>，银河系都装不下。这时候：
<ul>
<li><strong>范围分桶</strong>：先按高位把数据切到若干桶（落磁盘），每个桶的值域缩小到能开位图，桶内位图去重，桶间按序归并；</li>
<li><strong>哈希分区</strong>：值域不好切就按哈希分，代价是丢掉了「天然有序」，归并时要重新排；</li>
<li><strong>布隆过滤器</strong>：只回答「可能在 / 一定不在」，有假阳性、不能去重输出，但空间是位图的又一个数量级之下；</li>
<li><strong>外排</strong>：终极方案，内存只留缓冲区分块排序，结果落磁盘归并 —— 这就是「大数据量排序」的标准答案，位图是它的有界值域特例。</li>
</ul>

<strong>多机版</strong>：按值域切片把数据分到不同机器（range sharding），每台机器独立位图，最后按片序拼接 —— 去重和排序在分片界面上天然成立。

<strong>只要 distinct 个数</strong>：扫完位图后 <code>Integer.bitCount</code> 逐字累加，不需要输出序列，<code>O(值域 / 32)</code> 个字操作。
<h2>八、复杂度与选型</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>维度</th>
<th>位图</th>
<th>比较排序</th>
</tr>
</thead>
<tbody>
<tr>
<td>时间</td>
<td>O(n + 值域)</td>
<td>O(n log n)</td>
</tr>
<tr>
<td>空间</td>
<td>O(值域 / 8)</td>
<td>O(n)</td>
</tr>
<tr>
<td>去重</td>
<td>免费</td>
<td>扫一遍</td>
</tr>
<tr>
<td>有序输出</td>
<td>免费（扫描顺序）</td>
<td>免费（排序结果）</td>
</tr>
</tbody>
</table></div>

<code>O(n + 值域)</code> 里的两个项要分开看：<strong>n 是数据量，值域是值域</strong>。10 亿个数、值域 10^9，两项同阶，总共约 2×10^9 次基本操作；而比较排序是 <code>10^9 × log2(10^9) ≈ 10^9 × 30</code>，差了 15 倍，而且排序的常数（比较、交换、缓存不友好）远大于位图的置位。

选型的关键比值是 <strong>值域 / 数据量</strong>：
<ul>
<li>值域 ≈ 数据量 × 32（int32 有界）→ 位图完胜，32 : 1 压缩；</li>
<li>值域 &gt;&gt; 数据量（比如 100 个数散在 <code>2^32</code> 里）→ 位图巨亏，512 MiB 存 100 个数，老老实实用 HashSet；</li>
<li>值域 &gt;&gt; 数据量 × 32（64 位场景）→ 位图直接出局，走向分块或外排。</li>
</ul>
<h2>九、常见坑：五个每一个都真实致命</h2>
<h3>9.1 置位写成赋值：<code>|=</code> 变 <code>=</code></h3>
<div class="codehilite"><pre><span></span><code><span class="n">words</span><span class="p">[</span><span class="n">v</span> <span class="o">&gt;&gt;</span> <span class="mi">5</span><span class="p">]</span> <span class="o">=</span> <span class="mi">1</span> <span class="o">&lt;&lt;</span> <span class="p">(</span><span class="n">v</span> <span class="o">&amp;</span> <span class="mi">31</span><span class="p">)</span>    <span class="c1"># 错，应为 |=</span>
</code></pre></div>


赋值把<strong>整个字</strong>冲掉，同字其他位置的全部清零。反例 <code>[0, 5]</code>：先置 0，再置 5，0 被冲掉 —— 输出只剩 <code>[5]</code>。这类 bug 在稀疏数据上要漏掉一大片。
<h3>9.2 清位忘写波浪号</h3>
<div class="codehilite"><pre><span></span><code><span class="n">words</span><span class="p">[</span><span class="n">w</span><span class="p">]</span> <span class="o">&amp;=</span> <span class="p">(</span><span class="mi">1</span> <span class="o">&lt;&lt;</span> <span class="n">b</span><span class="p">)</span>    <span class="c1"># 错，应为 &amp;= ~(1 &lt;&lt; b)</span>
</code></pre></div>


<code>&amp;</code> 之后整个字只剩本位，同字其他位被误伤。反例：字里已有 0 和 5，清 5 会把 0 一起清掉。<strong><code>~</code> 一丢，清位变屠版。</strong>
<h3>9.3 负数不减 min</h3>

负数值直接当 <code>idx = v</code> 用就是负下标，越界。正确做法 <code>idx = v - min</code>，位图大小 = <code>max - min + 1</code>。面试题经常 silently 假设「非负整数」，主动问一句「值域是多少、有没有负数」是加分项。
<h3>9.4 没评估值域就上位图</h3>

64 位整数、UUID、手机号（11 位十进制 ≈ 2^37）看着都不大，一算全傻眼：手机号值域 <code>10^11</code>，位图要 <code>10^11 bit ≈ 11.6 GiB</code>，比原数据（10 亿 × 8 字节 = 8 GB）还大。<strong>先算值域账，再决定用不用位图。</strong>
<h3>9.5 1-bit 位图答不了「出现几次」</h3>

「找只出现一次的数」在 1-bit 位图里无解 —— 出现过两次和一次，bit 都是 1。这个需求必须上加一个 bit（2-bit 位图）或换计数结构。<strong>追问「哪些数重复了」时，答案不是改代码，是改数据结构。</strong>
<h2>十、面试怎么答</h2>

30 秒版本：
<blockquote>

10 亿个 int32 原样放是 4 GB，但值域有界 —— 开一张位图，每个可能取值 1 bit，值域 10^9 就是 119 MiB。逐个数置位，重复的再置那一位已经是 1，天然去重；最后按 bit 下标扫一遍，天然有序。时间 O(n + 值域)，空间 O(值域 / 8)，压缩比 32 : 1。
</blockquote>

如果还有时间，主动补三句，分别是三个加分点：
<ol>
<li><strong>位运算三件套</strong>：<code>word = v &gt;&gt; 5</code>、<code>bit = v &amp; 31</code>、置位 <code>|=</code>、清位 <code>&amp;= ~</code>—— 波浪号和或号是两道送命题；</li>
<li><strong>2-bit 位图</strong>：加一个 bit 就能同时回答「出现过 / 重复了 / 只一次」，空间翻倍换次数分档；</li>
<li><strong>值域爆炸的退路</strong>：64 位场景先范围分桶再桶内位图，或者直接外排 —— 位图是「有界值域」的特例，不是万能药。</li>
</ol>
