这段代码处理了六种帧。
<div class="table-scroll"><table>
<thead>
<tr>
<th>帧类型</th>
<th>处理方式</th>
<th>为什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>空行</td>
<td>跳过</td>
<td>SSE 用空行分隔事件</td>
</tr>
<tr>
<td>以 <code>:</code> 开头</td>
<td>跳过</td>
<td>注释或 keep-alive</td>
</tr>
<tr>
<td><code>data: [DONE]</code></td>
<td>结束循环</td>
<td>流的终止标记</td>
</tr>
<tr>
<td><code>data: {...}</code> 带 <code>error</code></td>
<td>返回 <code>Err</code></td>
<td>服务端在流里报错</td>
</tr>
<tr>
<td><code>data: {...}</code> 带 <code>usage</code></td>
<td>更新用量</td>
<td>流式用量在末尾单独一帧</td>
</tr>
<tr>
<td><code>data: {...}</code> 带 <code>delta</code></td>
<td>累积文本 / 工具调用</td>
<td>正常增量</td>
</tr>
<tr>
<td>无法解析的 JSON</td>
<td>跳过</td>
<td>容忍半帧或厂商扩展</td>
</tr>
</tbody>
</table></div>

「无法解析就跳过」看起来危险，其实是流式解析的必要妥协。网络分帧不保证每次 <code>read</code> 都拿到完整 JSON；<code>lines()</code> 已经按行切了，但某些厂商会在 <code>data:</code> 里放非标准字段。跳过坏帧，比整轮失败更划算。真正的错误会通过 <code>error</code> 字段或 HTTP 状态暴露，不会只藏在坏帧里。

非流式路径的 <code>read_json</code> 更简单：解析整个响应体，取 <code>choices[0].message</code>，读 <code>content</code>、<code>tool_calls</code>、<code>usage</code>。如果响应里没有 <code>choices</code>，会返回一个带截断响应体的错误，方便排查兼容层返回了什么。
<hr>
<h2>工具调用是拼出来的，不是读出来的</h2>

非流式响应里，<code>tool_calls</code> 是一个完整的数组。流式响应里不是。

OpenAI 的流式工具调用是<strong>增量拼接</strong>的：每个 delta 带一个 <code>index</code>，表示这是第几个调用；<code>id</code> 和 <code>function.name</code> 通常只在第一帧出现；<code>function.arguments</code> 是一段一段的字符串片段，需要按顺序追加。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">accumulate_tool_calls</span><span class="p">(</span><span class="n">tcs</span><span class="p">:</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;&amp;</span><span class="n">Value</span><span class="o">&gt;</span><span class="p">,</span><span class="w"> </span><span class="n">out</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">ToolCall</span><span class="o">&gt;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">arr</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tcs</span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">as_array</span><span class="p">())</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="p">};</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">tc</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">arr</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">idx</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tc</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;index&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">i</span><span class="o">|</span><span class="w"> </span><span class="n">i</span><span class="p">.</span><span class="n">as_u64</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="k">as</span><span class="w"> </span><span class="kt">usize</span><span class="p">;</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">idx</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">out</span><span class="p">.</span><span class="n">resize</span><span class="p">(</span><span class="n">idx</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">ToolCall</span><span class="p">::</span><span class="n">default</span><span class="p">());</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">slot</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">[</span><span class="n">idx</span><span class="p">];</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">id</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tc</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;id&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">i</span><span class="o">|</span><span class="w"> </span><span class="n">i</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">id</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">slot</span><span class="p">.</span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">id</span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">f</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tc</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;function&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">f</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;name&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">n</span><span class="o">|</span><span class="w"> </span><span class="n">n</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">name</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="n">slot</span><span class="p">.</span><span class="n">name</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">name</span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">args</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">f</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;arguments&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">slot</span><span class="p">.</span><span class="n">arguments</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="n">args</span><span class="p">);</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


假设模型要同时读两个文件，流可能是这样的。
<div class="table-scroll"><table>
<thead>
<tr>
<th>帧</th>
<th><code>index</code></th>
<th>内容</th>
<th>累积结果</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>0</td>
<td><code>id=call_a, name=read_file</code></td>
<td>槽 0：名字就位，参数为空</td>
</tr>
<tr>
<td>2</td>
<td>0</td>
<td><code>arguments={"path":"a</code></td>
<td>槽 0：参数字符串前半段</td>
</tr>
<tr>
<td>3</td>
<td>0</td>
<td><code>.rs"}</code></td>
<td>槽 0：参数拼接完成</td>
</tr>
<tr>
<td>4</td>
<td>1</td>
<td><code>id=call_b, name=read_file</code></td>
<td>槽 1：第二个调用出现</td>
</tr>
<tr>
<td>5</td>
<td>1</td>
<td><code>arguments={"path":"b.rs"}</code></td>
<td>槽 1：参数拼接完成</td>
</tr>
</tbody>
</table></div>

这里有三个必须写对的点。

<strong>第一，<code>arguments</code> 必须是 <code>push_str</code>，不能是赋值。</strong> 写成 <code>slot.arguments = args</code> 会只保留最后一段，模型收到的 JSON 永远是残缺的，工具会报「invalid JSON arguments」。

<strong>第二，<code>id</code> 和 <code>name</code> 只在非空时覆盖。</strong> 后续帧里这两个字段通常是 <code>null</code> 或空字符串。如果无条件赋值，槽里的名字会被清空。

<strong>第三，槽位要按 <code>index</code> 扩容。</strong> 模型可能先发 <code>index=1</code> 再发 <code>index=0</code>，也可能跳过某个 index。<code>resize(idx + 1, default)</code> 保证槽位存在，最后按顺序执行时不会越界。

拼接完成后，<code>AssistantTurn.tool_calls</code> 是一个有序数组。循环按这个顺序执行，也按这个顺序回填结果。模型看到的 <code>tool_call_id</code> 顺序和它请求的顺序一致，这是后面配对的前提。
<hr>
<h2><code>assistant_message</code>：为什么空 content 要写 <code>null</code></h2>

模型返回的 <code>AssistantTurn</code> 不能直接塞回 <code>messages</code>。OpenAI 的消息格式要求 assistant 消息里的工具调用是另一种结构：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">assistant_message</span><span class="p">(</span><span class="n">turn</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">AssistantTurn</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Value</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">content</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">Value</span><span class="p">::</span><span class="n">Null</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">Value</span><span class="p">::</span><span class="nb">String</span><span class="p">(</span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">clone</span><span class="p">())</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;assistant&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">content</span><span class="w"> </span><span class="p">});</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">calls</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">args</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">c</span><span class="p">.</span><span class="n">arguments</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="s">&quot;{}&quot;</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="o">&amp;</span><span class="n">c</span><span class="p">.</span><span class="n">arguments</span><span class="w"> </span><span class="p">};</span>
<span class="w">        </span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">            </span><span class="s">&quot;id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">c</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;type&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;function&quot;</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;function&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="s">&quot;name&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">c</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;arguments&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">args</span><span class="w"> </span><span class="p">}</span>
<span class="w">        </span><span class="p">})</span>
<span class="w">    </span><span class="p">}).</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;assistant&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">content</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;tool_calls&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">calls</span><span class="w"> </span><span class="p">})</span>
<span class="p">}</span>
</code></pre></div>


三个细节。

<strong>空 content 写 <code>null</code>，不写空字符串。</strong> 有些兼容层对 <code>content: ""</code> 和 <code>content: null</code> 的处理不一样。当一条 assistant 消息只包含工具调用时，标准做法是 <code>content: null</code>。写空字符串在部分厂商那里会被当成「模型说了空话」，甚至触发校验错误。

<strong>空参数写 <code>{}</code>。</strong> 模型有时会发出 <code>arguments: ""</code>，表示这个工具没有参数。直接原样回传，历史里会留下一个空字符串，下一轮 API 可能拒绝。统一补成 <code>{}</code>，让历史始终是合法 JSON。

<strong><code>tool_calls</code> 只在非空时出现。</strong> 纯文本响应不需要这个字段。多写一个空数组，有些 API 会认为「模型声明了工具调用但没给内容」，行为不确定。

这些都不是「洁癖」，而是跨厂商兼容的生存技巧。OpenAI 兼容层不是标准，每个厂商都有自己的宽容度。Agent 的历史会被反复重发，任何一处不合法都会在下一轮放大成 400。
<hr>
<h2>第四步：执行工具</h2>

<code>execute</code> 是循环里最像「安全边界」的函数。它不直接分发，而是先过三道检查。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">execute</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">call</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">llm</span><span class="p">::</span><span class="n">ToolCall</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">reason</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">check_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {reason}&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="nc">Value</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">call</span><span class="p">.</span><span class="n">arguments</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">json</span><span class="o">!</span><span class="p">({})</span>

<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">serde_json</span><span class="p">::</span><span class="n">from_str</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">arguments</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">v</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">v</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: invalid JSON arguments for `{}`: {e}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">};</span>

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">hook</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">hooks</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">event</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">HookEvent</span><span class="p">::</span><span class="n">PreToolUse</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">matches</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">))</span>
<span class="w">    </span><span class="p">{</span>
<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">hooks</span><span class="p">::</span><span class="n">run</span><span class="p">(</span><span class="n">hook</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">workspace</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">ok</span><span class="p">()</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{}</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">                </span><span class="s">&quot;ERROR: `{}` blocked by PreToolUse hook (exit {}):</span><span class="se">\n</span><span class="s">{}&quot;</span><span class="p">,</span>
<span class="w">                </span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">code</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">output</span>
<span class="w">            </span><span class="p">),</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: PreToolUse hook failed: {e}&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">args</span><span class="p">);</span>

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">hook</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">hooks</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">event</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">HookEvent</span><span class="p">::</span><span class="n">PostToolUse</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">matches</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">))</span>
<span class="w">    </span><span class="p">{</span>
<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">hooks</span><span class="p">::</span><span class="n">run</span><span class="p">(</span><span class="n">hook</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">workspace</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">ok</span><span class="p">()</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{}</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">result</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">                </span><span class="s">&quot;</span><span class="se">\n</span><span class="s">[PostToolUse hook exited {}]</span><span class="se">\n</span><span class="s">{}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">code</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">output</span>
<span class="w">            </span><span class="p">)),</span>

<span class="w">        </span><span class="p">}</span>

把这个函数拆开看，它其实是一条流水线：
<ol>
<li><strong>权限检查</strong>：这个工具在当前模式、allow/deny 列表下能不能跑。</li>
<li><strong>参数解析</strong>：模型给的 JSON 是不是合法。不合法就返回错误字符串，不 panic。</li>
<li><strong>执行前钩子</strong>：用户可以挂自己的脚本，非零退出直接否决这次调用。</li>
<li><strong>分发执行</strong>：交给 <code>run_tool</code>。</li>
<li><strong>执行后钩子</strong>：不能否决，只能追加警告。</li>
</ol>

最值得注意的是第 2 步和第 3 步的失败处理：<strong>它们返回的是字符串，不是 <code>Err</code>，更不是 panic。</strong> 这意味着参数写错的工具调用不会中止整轮对话，模型会在下一条 <code>tool</code> 消息里看到「你的 JSON 不合法」，然后自己重试。

这是 Agent 和普通程序的一个重要区别：<strong>错误是模型的输入，不是程序的终止信号。</strong> 普通函数遇到非法参数会抛异常，Agent 的工具层要把异常翻译成模型能读懂的一句话。
<hr>
<h2>三道闸：权限、参数、钩子</h2>

把三道闸分开看，各自的职责和失败语义不一样。
<div class="table-scroll"><table>
<thead>
<tr>
<th>闸门</th>
<th>检查内容</th>
<th>失败时模型看到什么</th>
<th>能否恢复</th>
</tr>
</thead>
<tbody>
<tr>
<td>权限闸</td>
<td>模式封锁、deny 列表、allow 列表</td>
<td><code>ERROR: tool ... is not available in Plan mode</code></td>
<td>换模式或换工具</td>
</tr>
<tr>
<td>参数闸</td>
<td><code>arguments</code> 是否为合法 JSON</td>
<td><code>ERROR: invalid JSON arguments for ...</code></td>
<td>重新生成参数</td>
</tr>
<tr>
<td>前置钩子</td>
<td>用户脚本的退出码</td>
<td><code>ERROR: ... blocked by PreToolUse hook</code></td>
<td>改命令或绕过</td>
</tr>
<tr>
<td>后置钩子</td>
<td>用户脚本的警告</td>
<td>结果末尾追加 <code>[PostToolUse hook exited N]</code></td>
<td>不影响结果</td>
</tr>
</tbody>
</table></div>

权限闸的语义最强：它在工具清单构建时已经过滤过一次，执行时又检查一次。为什么重复？因为清单是给模型看的，模型可能凭记忆调用一个已经被过滤掉的工具；执行时的检查才是真正的安全边界。

参数闸的语义最弱：它只保证「是合法 JSON」，不保证「符合工具的 Schema」。<code>read_file</code> 要求 <code>path</code> 是字符串，模型传了数字，<code>fs::read_file</code> 里的 <code>req_str</code> 会返回错误，同样变成字符串结果。Schema 校验没有单独做，是因为每个工具自己最清楚参数该怎么解释，集中校验反而容易和实现脱节。

钩子闸是唯一允许「一票否决」的外部扩展点。<code>PreToolUse</code> 非零退出，工具就不会执行；<code>PostToolUse</code> 非零退出，工具已经执行完了，只能追加警告。这个设计把「阻止」和「提醒」分开，避免后置钩子产生「已经改了文件但假装没改」的错觉。
<hr>
<h2>工具结果一律是字符串</h2>

<code>run_tool</code> 负责真正的分发，它的返回类型是 <code>String</code>，不是 <code>Result&lt;String, String&gt;</code>。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">run_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">name</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;subagent&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">sname</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;name&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">n</span><span class="o">|</span><span class="w"> </span><span class="n">n</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">task</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;task&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_subagent</span><span class="p">(</span><span class="n">sname</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">s</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">s</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {e}&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="p">};</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">tools</span><span class="p">::</span><span class="n">dispatch</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">s</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">s</span><span class="p">,</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;unknown tool&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">m</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">mcp</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">result</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">call</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">args</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                        </span><span class="k">return</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="p">{</span>
<span class="w">                            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">s</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">s</span><span class="p">,</span>
<span class="w">                            </span><span class="nb">Err</span><span class="p">(</span><span class="n">err</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {err}&quot;</span><span class="p">),</span>
<span class="w">                        </span><span class="p">};</span>
<span class="w">                    </span><span class="p">}</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {e}&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>tools::dispatch</code> 自己返回 <code>Result&lt;String, String&gt;</code>，每个工具实现也返回同样的类型。到了 <code>run_tool</code> 这一层，错误被统一翻译成 <code>ERROR: ...</code> 字符串。成功的内置工具结果也不会原样回灌：<code>dispatch</code> 最后一行是 <code>r.map(|s| clamp(s, ctx.max_output))</code>，默认 <code>max_output = 20_000</code>；超过上限时按字符边界截断，并注明省略了多少。注意这个上限按字节长度算，不是 token 数。

这个设计有一个直接后果：<strong>模型永远能看到工具失败的原因。</strong>
<div class="table-scroll"><table>
<thead>
<tr>
<th>失败类型</th>
<th>工具层返回</th>
<th>模型下一轮会做什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>文件不存在</td>
<td><code>ERROR: path: No such file or directory</code></td>
<td>换路径或先 <code>list_dir</code></td>
</tr>
<tr>
<td><code>old_string</code> 找不到</td>
<td><code>ERROR: old_string not found ... read the file and match it exactly</code></td>
<td>重新读文件</td>
</tr>
<tr>
<td><code>old_string</code> 多处匹配</td>
<td><code>ERROR: occurs N times ... pass replace_all=true</code></td>
<td>补上下文或加 <code>replace_all</code></td>
</tr>
<tr>
<td>文件超过 4 MB</td>
<td><code>ERROR: ... read it in chunks with offset/limit</code></td>
<td>带 <code>offset</code> / <code>limit</code> 重读</td>
</tr>
<tr>
<td>命令被用户拒绝</td>
<td><code>Command denied by the user. Do not retry it; ask what to do instead.</code></td>
<td>停下来问用户</td>
</tr>
<tr>
<td>shell 非零退出</td>
<td>正常结果，包含 <code>exit code: N</code> 和 stderr</td>
<td>分析错误并修正</td>
</tr>
<tr>
<td>未知工具</td>
<td><code>ERROR: unknown tool ...</code></td>
<td>换工具</td>
</tr>
</tbody>
</table></div>

注意「命令被用户拒绝」这一行：它不是 <code>ERROR:</code> 开头，而是一句明确的指令 <code>Do not retry it; ask what to do instead.</code>。这是有意为之。模型对 <code>ERROR:</code> 的默认反应是「重试或换个参数」，但对用户拒绝，正确的反应是停下来。错误文案本身就是行为引导。

还有一层：<code>tools::dispatch</code> 返回「unknown tool」时，<code>run_tool</code> 会再去 MCP 服务器里找同名工具。这是内置工具和 MCP 工具的统一入口。内置工具先匹配，匹配不到才走 MCP，避免 MCP 服务器覆盖内置工具的行为。
<hr>
<h2>回灌历史：<code>tool_call_id</code> 是配对的锚</h2>

工具执行完之后，结果要回到 <code>messages</code>。这一步看起来只是三行 <code>json!</code>，其实是最容易破坏历史不变量的一步。
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">call</span><span class="p">,</span><span class="w"> </span><span class="n">result</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">zip</span><span class="p">(</span><span class="n">results</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">tool_call</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">summarize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">arguments</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="n">result</span><span class="p">);</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;tool_call_id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">call</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">result</span><span class="p">,</span>
<span class="w">    </span><span class="p">}));</span>
<span class="p">}</span>
</code></pre></div>


一条工具结果消息只包含三个字段：角色是 <code>tool</code>，<code>tool_call_id</code> 指向 assistant 消息里的某个调用，<code>content</code> 是结果字符串。没有 <code>name</code> 字段，没有时间戳，没有结构化 JSON。

为什么这么简单？因为 API 只认这个形状。<code>tool_call_id</code> 是配对的唯一锚点，模型靠它把「我刚才请求的第三个调用」和「这条结果」对应起来。如果 id 写错、写空、或者顺序错乱，模型会收到一组对不上的结果，轻则答非所问，重则 API 直接 400。

一次带两个工具调用的轮次，历史长这样。
<div class="table-scroll"><table>
<thead>
<tr>
<th>序号</th>
<th>role</th>
<th>关键字段</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>system</td>
<td><code>content</code></td>
<td>系统提示词 + 记忆块</td>
</tr>
<tr>
<td>2</td>
<td>user</td>
<td><code>content</code></td>
<td>用户指令</td>
</tr>
<tr>
<td>3</td>
<td>assistant</td>
<td><code>content: null</code>, <code>tool_calls: [call_a, call_b]</code></td>
<td>模型请求两个工具</td>
</tr>
<tr>
<td>4</td>
<td>tool</td>
<td><code>tool_call_id: call_a</code></td>
<td>第一个工具的结果</td>
</tr>
<tr>
<td>5</td>
<td>tool</td>
<td><code>tool_call_id: call_b</code></td>
<td>第二个工具的结果</td>
</tr>
<tr>
<td>6</td>
<td>assistant</td>
<td><code>content: "已经改好了"</code></td>

</tr>

这个序列必须严格保持。尤其注意第 3 条：assistant 消息里的 <code>tool_calls</code> 顺序是 <code>[call_a, call_b]</code>，第 4、5 条的顺序也必须一致。NanoHermes 用 <code>zip</code> 保证这一点：<code>turn.tool_calls</code> 和 <code>results</code> 按同一顺序配对，即使 <code>call_b</code> 先执行完，<code>call_a</code> 的结果仍然排在前面。
<hr>
<h2>第五步：循环从哪里出去</h2>

循环有三个出口，每个出口对应一种收尾方式。
<div class="table-scroll"><table>
<thead>
<tr>
<th>出口</th>
<th>触发条件</th>
<th><code>run</code> 返回</th>
<th>历史状态</th>
<th>提示</th>
</tr>
</thead>
<tbody>
<tr>
<td>正常完成</td>
<td><code>turn.tool_calls.is_empty()</code></td>
<td>最后一条 assistant 文本</td>
<td>完整，最后一条是 assistant</td>
<td>无</td>
</tr>
<tr>
<td>用户中断</td>
<td>循环顶部 <code>interrupt::take()</code> 为真</td>
<td>最后一次 assistant 文本</td>
<td>完整，最后一条是工具结果</td>
<td>保留上下文，可 <code>/undo</code></td>
</tr>
<tr>
<td>迭代上限</td>
<td><code>for</code> 跑满 <code>max_iterations</code></td>
<td>最后一次 assistant 文本</td>
<td>完整，最后一条是工具结果</td>
<td>警告「未完成」</td>
</tr>
</tbody>
</table></div>

三个出口都保证历史是合法的。这是循环设计里最重要的一条不变量。

为什么中断和上限退出时，历史最后一条是工具结果而不是 assistant 工具调用？因为检查点放在循环顶部。上一轮的工具结果已经全部回填，<code>compact</code> 也跑完了，下一轮还没发请求。在这个位置退出，历史停在「工具调用 + 全部结果」的完整状态，模型下次接着跑不会缺配对。

如果中断检查放在工具执行中间，就可能出现「assistant 请求了三个工具，只回填了一个结果」的状态。下一次请求会直接被 API 拒绝，而且用户看不出原因。这个坑很隐蔽，后面「十个陷阱」里会再提一次。

正常完成时，最后一条 assistant 消息没有 <code>tool_calls</code>，只有文本。<code>final_text</code> 就是这条文本。如果模型在最后一轮既说了话又调用了工具，循环会继续，不会把「说话」当成结束。<strong>只有「不再调用工具」才是完成信号。</strong>
<hr>
<h2>并发工具调用：作用域线程与按序回收</h2>

模型经常在一次响应里请求多个工具。比如「读三个文件」「同时跑测试和 lint」。串行执行会让总延迟等于各工具延迟之和，所以 NanoHermes 在工具调用多于一个时并发执行。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">results</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">vec!</span><span class="p">[</span><span class="bp">self</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">[</span><span class="mi">0</span><span class="p">])]</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">this</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Agent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">;</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">scope</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="w">        </span><span class="n">handles</span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">join</span><span class="p">().</span><span class="n">unwrap_or_else</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="s">&quot;ERROR: tool thread panicked&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">()</span>
<span class="w">            </span><span class="p">}))</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="w">    </span><span class="p">})</span>
<span class="p">};</span>
</code></pre></div>


这里用的是 <code>std::thread::scope</code>，不是 <code>tokio::spawn</code>，也不是线程池。每个工具调用一个线程，跑完就回收。
<div class="table-scroll"><table>
<thead>
<tr>
<th>方案</th>
<th>延迟</th>
<th>复杂度</th>
<th>适用场景</th>
</tr>
</thead>
<tbody>
<tr>
<td>串行执行</td>
<td>各工具之和</td>
<td>最低</td>
<td>工具之间强依赖、调用数少</td>
</tr>
<tr>
<td>每次一个线程</td>
<td>最慢的那个</td>
<td>低</td>
<td>调用数少、工具是阻塞 IO</td>
</tr>
<tr>
<td>线程池</td>
<td>受池大小限制</td>
<td>中</td>
<td>高频短任务</td>
</tr>
<tr>
<td>async 运行时</td>
<td>最慢的那个</td>
<td>高</td>
<td>大量并发、需要取消</td>
</tr>
</tbody>
</table></div>

NanoHermes 选第二个，理由和它的整体纲领一致：<strong>一次响应里的工具调用通常只有 1–5 个，为这个量级引入线程池或异步运行时，收益远小于复杂度。</strong>

<code>thread::scope</code> 的好处是生命周期由编译器保证：线程借用的 <code>&amp;Agent</code> 一定活到 <code>join</code> 结束，不需要 <code>Arc</code>，也不需要 <code>'static</code>。代价是 <code>Agent</code> 必须实现 <code>Sync</code>——这反过来约束了 <code>Ctx</code> 里的共享状态（任务管理器、todo 列表、子代理任务板、并发门）必须用内部可变性 + 同步原语，而不是 <code>&amp;mut</code>。这是一个「类型系统逼着你把共享状态设计对」的例子。

结果回收用 <code>zip</code> 保证顺序。<code>join</code> 按 <code>handles</code> 的顺序调用，所以即使第三个工具最先完成，<code>results[0]</code> 仍然是第一个调用的结果。线程 panic 不会让整个进程崩溃，<code>join</code> 返回 <code>Err</code>，被翻译成一条 <code>ERROR: tool thread panicked</code> 结果。模型会看到「这个工具挂了」，而不是进程退出。

并发也带来一个新的问题：<strong>副作用可能交错。</strong> 两个 <code>write_file</code> 同时写同一个文件，结果取决于谁先落盘；一个 <code>git_commit</code> 和一个 <code>edit_file</code> 同时跑，提交的内容不确定。NanoHermes 没有做工具级的互斥，因为模型很少主动请求这种冲突组合，而且真实冲突应该由工具自己处理（比如 git 的锁）。这是一个「把复杂度留给必要的地方」的取舍。
<hr>
<h2>中断：Ctrl-C 只在步骤边界生效</h2>

终端 Agent 必须能被中断。但「中断」不是简单地把进程杀掉，否则会话历史会停在半截，下次恢复直接坏掉。

NanoHermes 的做法是：Ctrl-C 不杀进程，只置一个原子标志；循环在步骤边界检查这个标志。
<div class="codehilite"><pre><span></span><code><span class="k">struct</span><span class="w"> </span><span class="nc">InterruptGuard</span><span class="p">;</span>

<span class="k">impl</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">fn</span><span class="w"> </span><span class="nf">new</span><span class="p">()</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Self</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">take</span><span class="p">();</span>
<span class="w">        </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">install</span><span class="p">();</span>
<span class="w">        </span><span class="n">InterruptGuard</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>

<span class="k">impl</span><span class="w"> </span><span class="nb">Drop</span><span class="w"> </span><span class="k">for</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">fn</span><span class="w"> </span><span class="nf">drop</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">restore_default</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>run</code> 的第一行是 <code>let _guard = InterruptGuard::new();</code>。这个 guard 在 <code>run</code> 结束时自动 <code>Drop</code>，恢复默认的 SIGINT 行为。即使用户在工具执行期间按了 Ctrl-C，信号处理器也只是把标志置位，不会终止进程。

循环顶部的检查是唯一的消费点：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">interrupted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">        </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


这个位置保证了中断不会发生在「工具执行到一半」。用户按下 Ctrl-C 后，当前工具会继续跑完，结果照常回填，<code>compact</code> 照常执行，然后下一轮开始时才发现标志，退出循环。
<div class="table-scroll"><table>
<thead>
<tr>
<th>中断时机</th>
<th>行为</th>
<th>历史状态</th>
</tr>
</thead>
<tbody>
<tr>
<td>模型请求过程中</td>
<td>请求继续，响应到达后回填</td>
<td>完整</td>
</tr>
<tr>
<td>工具执行过程中</td>
<td>当前工具跑完，结果回填</td>
<td>完整</td>
</tr>
<tr>
<td>工具结果回填后、下一轮前</td>
<td>立即退出</td>
<td>完整</td>
</tr>
<tr>
<td>多工具并发执行中</td>
<td>所有线程 join 完再退出</td>
<td>完整</td>
</tr>
</tbody>
</table></div>

代价是「停止」不够即时。如果一个 <code>run_command</code> 要跑 120 秒，用户按下 Ctrl-C 后最多还要等 120 秒。这是有意的取舍：宁可慢一点，也不要把历史弄坏。真要立即杀，应该用后台任务 + <code>task_kill</code>，而不是中断整个轮次。

<code>InterruptGuard</code> 的注释里还提到「引用计数」，让嵌套轮次（比如工具里又跑了一个子代理轮次）不会拆掉外层的处理器。这个细节保证了中断语义在嵌套场景下仍然一致。

中断之后，<code>run</code> 会打印一句提示，告诉用户对话已保留，可以输入新指令或 <code>/undo</code> 回退。<code>/undo</code> 的实现是 <code>rewind</code>：从最后一条 user 消息往前找，删掉整个轮次。它和中断是两套机制，一个是「停」，一个是「退」。
<hr>
<h2>迭代上限：40 次到底在数什么</h2>

<code>max_iterations</code> 的默认值是 40。这个数字经常被误解成「最多调用 40 次工具」，其实不是。

它数的是<strong>模型往返回合数</strong>。一次合回 = 一次 <code>complete()</code> = 一次 HTTP 请求 + 该响应里的所有工具调用。如果模型一次响应请求了 5 个工具，那仍然只算 1 次迭代。
<div class="table-scroll"><table>
<thead>
<tr>
<th>场景</th>
<th>典型迭代数</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>回答一个概念问题</td>
<td>1</td>
<td>模型直接回复，不调用工具</td>
</tr>
<tr>
<td>读一个文件并解释</td>
<td>2–3</td>
<td>读文件、可能再读一次、总结</td>
</tr>
<tr>
<td>修一个明确的 bug</td>
<td>4–8</td>
<td>读、改、跑测试、再改</td>
</tr>
<tr>
<td>实现一个小功能</td>
<td>8–20</td>
<td>探索、多文件修改、验证</td>
</tr>
<tr>
<td>长任务 / 重构</td>
<td>20–40</td>
<td>容易触顶</td>
</tr>
<tr>
<td>死循环</td>
<td>40</td>
<td>模型反复调用同一个失败工具</td>
</tr>
</tbody>
</table></div>

40 是一个很宽松的上限。它的作用不是「限制正常任务」，而是「兜住模型卡死」。没有这个上限，模型可能在一个永远失败的命令上无限重试，烧掉大量 token。

循环跑满时会打印 <code>reached the 40 iteration limit without finishing</code>。注意措辞是「未完成」，不是「出错」。达到上限不是异常，是一个正常的资源边界。

上限也和成本直接相关。假设每轮输入 8,000 token、输出 500 token，40 轮就是 320,000 输入 token 加 20,000 输出 token。对于按量计费的 API，这是一笔不能忽略的钱。<code>max_iterations</code> 是成本控制的第一道闸，第二道是上下文压缩，第三道是工具输出上限。
<hr>
<h2>上下文压缩：12 万字符与最近 10 条</h2>

循环跑得越久，<code>messages</code> 越大。每一轮请求都要把完整历史发一遍，历史越大，输入 token 越多，延迟越高，最终会超过模型的上下文窗口。

NanoHermes 的压缩策略是「超预算就把旧消息换成一段摘要」。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">compact_with</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">force</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">size</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">to_string</span><span class="p">().</span><span class="n">len</span><span class="p">()).</span><span class="n">sum</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">force</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="p">(</span><span class="n">size</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">CONTEXT_CHAR_BUDGET</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">KEEP_RECENT</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">().</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">KEEP_RECENT</span><span class="p">);</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">[</span><span class="n">start</span><span class="p">][</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">start</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">dropped</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">drain</span><span class="p">(</span><span class="mi">1</span><span class="o">..</span><span class="n">start</span><span class="p">).</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">note</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">summarize_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dropped</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Some</span><span class="p">(</span><span class="n">summary</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[Earlier conversation summary]</span><span class="se">\n</span><span class="s">{summary}&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="s">&quot;[Earlier conversation was omitted to keep the context small]&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">insert</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;system&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">note</span><span class="w"> </span><span class="p">}));</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">note</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;compacted: {} messages&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">dropped</span><span class="p">.</span><span class="n">len</span><span class="p">()));</span>
<span class="w">    </span><span class="n">dropped</span><span class="p">.</span><span class="n">len</span><span class="p">()</span>
<span class="p">}</span>
</code></pre></div>


参数和边界如下。
<div class="table-scroll"><table>
<thead>
<tr>
<th>参数</th>
<th>值</th>
<th>作用</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>CONTEXT_CHAR_BUDGET</code></td>
<td><code>120_000</code></td>
<td>触发压缩的字符预算（序列化后的 JSON 长度）</td>
</tr>
<tr>
<td><code>KEEP_RECENT</code></td>
<td><code>10</code></td>
<td>永远保留的最近消息条数</td>
</tr>
<tr>
<td>摘要长度</td>
<td>最多 300 词</td>
<td><code>llm::summarize</code> 的提示词约束</td>
</tr>
<tr>
<td>压缩位置</td>
<td><code>messages[1]</code></td>
<td>系统消息之后插入摘要</td>
</tr>
<tr>
<td>失败回退</td>
<td>一行占位说明</td>
<td>摘要请求失败时不让历史缺口无声消失</td>
</tr>
</tbody>
</table></div>

几个细节值得展开。

<strong>预算按字符算，不按 token 算。</strong> 精确 token 数需要 tokenizer，引入 tokenizer 会破坏「三个依赖 crate」的纲领。字符数是近似值，对中英文混排的误差在可接受范围内。120,000 字符大约对应 30,000–60,000 token，取决于语言比例。

<strong>保留最近 10 条，而不是最近 10 轮。</strong> 一条工具结果也算一条。一次带 5 个工具调用的轮次会占 7 条（user、assistant、5 个 tool）。这样做的目的是保证「最近一次工具交互」一定还在上下文里，模型不会刚拿到结果就忘了。

<strong>切点不能落在 tool 消息中间。</strong> <code>while start &lt; len &amp;&amp; messages[start]["role"] == "tool"</code> 把切点往后推，直到不是工具结果。否则会出现「assistant 的工具调用被摘要掉了，但 tool 结果还在」的非法序列。

<strong>摘要失败要留痕。</strong> 如果摘要请求失败，插入一行 <code>[Earlier conversation was omitted ...]</code>，而不是什么都不插。模型需要知道「有一段历史被省略了」，否则它会以为自己一直只有这么点上下文。

<strong>压缩是同步的。</strong> 它会在工具结果回填之后、下一轮请求之前阻塞执行。摘要本身就是一次模型请求，所以压缩那一轮的实际延迟会多一次模型往返。这是不可避免的成本，但只在超预算时发生。

<code>/compact</code> 命令可以强制压缩，走的是 <code>compact_with(true)</code>，忽略预算检查。它返回被摘要掉的消息数，用户可以据此判断压缩有没有生效。
<hr>
<h2>会话持久化：每轮结束落盘</h2>

<code>run</code> 的最后一步是 <code>self.persist()</code>，把 <code>messages</code> 写进会话文件（如果配置了 <code>--session</code>）。写盘用「临时文件 + rename」，避免写到一半崩溃留下截断的 JSON。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">save_session_file</span><span class="p">(</span><span class="n">path</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">,</span><span class="w"> </span><span class="n">messages</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="n">Value</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="p">(),</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">body</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">serde_json</span><span class="p">::</span><span class="n">to_string_pretty</span><span class="p">(</span><span class="n">messages</span><span class="p">).</span><span class="n">map_err</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">tmp</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">path</span><span class="p">.</span><span class="n">with_extension</span><span class="p">(</span><span class="s">&quot;tmp&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">fs</span><span class="p">::</span><span class="n">write</span><span class="p">(</span><span class="o">&amp;</span><span class="n">tmp</span><span class="p">,</span><span class="w"> </span><span class="n">body</span><span class="p">).</span><span class="n">map_err</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">fs</span><span class="p">::</span><span class="n">rename</span><span class="p">(</span><span class="o">&amp;</span><span class="n">tmp</span><span class="p">,</span><span class="w"> </span><span class="n">path</span><span class="p">).</span><span class="n">map_err</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(())</span>
<span class="p">}</span>
</code></pre></div>


启动时，<code>load_session_file</code> 读取这个文件，然后 <code>refresh_system</code> 用当前配置重新生成系统消息，替换掉文件里的旧版本。
<div class="table-scroll"><table>
<thead>
<tr>
<th>时机</th>
<th>动作</th>
<th>目的</th>
</tr>
</thead>
<tbody>
<tr>
<td>启动 + 有会话文件</td>
<td>读 JSON，刷新系统消息</td>
<td>恢复历史，但使用最新配置</td>
</tr>
<tr>
<td>每轮结束</td>
<td>写临时文件，rename 覆盖</td>
<td>崩溃安全</td>
</tr>
<tr>
<td>加载失败</td>
<td>打印警告，使用全新会话</td>
<td>不让坏文件阻塞启动</td>
</tr>
<tr>
<td><code>reset</code></td>
<td>清空历史，保留系统消息</td>
<td>开新话题</td>
</tr>
<tr>
<td><code>rewind</code></td>
<td>删除最后 N 个用户轮次</td>
<td>撤销最近的指令</td>
</tr>
</tbody>
</table></div>

为什么系统消息要刷新而不是原样恢复？因为系统消息是配置，不是对话。用户的工具列表、人设、权限模式、AGENTS.md 都可能变。如果原样恢复旧提示词，会话会带着过期的规则跑，出现「明明改了配置但不生效」的诡异现象。

持久化也有边界：<code>self.complete()?</code> 失败时，<code>run</code> 提前返回，<code>persist()</code> 不会执行。此时内存里的 <code>messages</code> 已经多了一条 user 消息，但磁盘上还是上一轮的状态。下次启动会丢掉这条失败的指令。这个行为可以接受——失败的请求本来就没有产生有效回复——但它提醒我们，<code>?</code> 在循环里是一个「跳过收尾」的出口。
<hr>
<h2>记忆沉淀：只从完整结束的轮次里提炼</h2>

循环结束后，如果这一轮正常完成、开启了记忆功能、并且真的用过工具，<code>distill_memories</code> 会让模型从对话里提炼几条长期记忆。
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">completed</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">memory</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">distill_memories</span><span class="p">(</span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


门槛有三层：
<ol>
<li><strong>必须 <code>completed</code></strong>。中断或超限的半截对话不提炼，因为结论还没形成。</li>
<li><strong>必须 <code>cfg.memory</code></strong>。记忆功能关闭时直接跳过。</li>
<li><strong>必须通过 <code>worth_distilling</code></strong>。寒暄、短指令、没用过工具的轮次不值得再花一次模型请求。</li>
</ol>

提炼时取最近 6000 字符的对话摘录，让模型输出若干条 <code>(kind, text)</code>，<code>kind</code> 是 lesson / preference / correction / fact 之一。每一条通过 <code>memory::remember</code> 写入，返回是否真的新增（去重）。最后如果写入了至少一条，打印一句 <code>已从本次对话沉淀 N 条长期记忆</code>。

这个设计把「记忆」放在循环之外，而不是循环之内。循环不负责决定记什么，它只负责在正确的时间点触发一次提炼。这样循环保持简单，记忆策略可以独立演化。
<hr>
<h2>token 账本：为什么上报的是增量</h2>

<code>UsageTotals</code> 只有三个字段：
<div class="table-scroll"><table>
<thead>
<tr>
<th>字段</th>
<th>含义</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>requests</code></td>
<td>这个会话发过多少次模型请求</td>
</tr>
<tr>
<td><code>prompt_tokens</code></td>
<td>累计输入 token</td>
</tr>
<tr>
<td><code>completion_tokens</code></td>
<td>累计输出 token</td>
</tr>
</tbody>
</table></div>

每次 <code>complete()</code> 返回后，<code>run</code> 把这一轮的用量累加进去，然后调用 <code>style.usage(1, prompt, completion)</code>。注意第一个参数是 <code>1</code>，表示「本次请求数」，而不是累计请求数。
<div class="codehilite"><pre><span></span><code><span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">requests</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">;</span>
<span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">;</span>
<span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">usage</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">,</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">);</span>
</code></pre></div>


为什么上报增量而不是累计值？因为同一个 <code>Agent</code> 实例可能服务多个隔离的会话。daemon 模式下，云端任务通过 <code>replace_messages</code> 切换消息向量，复用同一个 Agent。如果 UI 收到的是累计值，它会把这些互不相关的任务加在一起，算出一个没有意义的总额。上报增量，客户端可以按任务自己累加，本地模式下增量相加也正好等于累计值。

这是一个典型的「接口形状由部署形态决定」的例子。单机 CLI 用累计值更省事，但 daemon 必须用增量。NanoHermes 选择了对两种形态都正确的那个。
<hr>
<h2>两百行的边界：什么故意不写进循环</h2>

「两百行」不是一个代码高尔夫的成绩，而是一条边界。它说明哪些东西属于循环，哪些不属于。
<div class="table-scroll"><table>
<thead>
<tr>
<th>模块</th>
<th>在循环里吗</th>
<th>为什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>HTTP 请求、重试、代理</td>
<td>否</td>
<td><code>llm::chat</code> 的职责，循环只拿到 <code>AssistantTurn</code></td>
</tr>
<tr>
<td>SSE 解析、工具调用拼接</td>
<td>否</td>
<td>传输层细节，循环不关心帧</td>
</tr>
<tr>
<td>系统提示词构建</td>
<td>否</td>
<td>配置与项目文件的事，循环只消费结果</td>
</tr>
<tr>
<td>工具实现</td>
<td>否</td>
<td>每个工具自己处理参数、边界、错误</td>
</tr>
<tr>
<td>权限与钩子</td>
<td>是（调用点）</td>
<td>必须在执行前拦截，不能下放给工具</td>
</tr>
<tr>
<td>上下文压缩</td>
<td>是（调用点）</td>
<td>必须知道完整历史，工具看不到</td>
</tr>
<tr>
<td>记忆检索 / 沉淀</td>
<td>是（调用点）</td>
<td>需要当前用户文本与完整对话</td>
</tr>
<tr>
<td>会话持久化</td>
<td>是（调用点）</td>
<td>只有循环知道一轮何时结束</td>
</tr>
<tr>
<td>并发调度</td>
<td>是（内联）</td>
<td>需要知道本轮所有工具调用</td>
</tr>
<tr>
<td>UI 渲染</td>
<td>否</td>
<td>通过 <code>Style</code> / <code>UiSink</code> 注入，循环只发事件</td>
</tr>
<tr>
<td>MCP 协议</td>
<td>否</td>
<td><code>McpManager</code> 的职责，循环只看到工具名</td>
</tr>
<tr>
<td>子代理编排</td>
<td>部分</td>
<td><code>subagent</code> 是一个工具，但任务板与门控在 <code>Ctx</code> 里</td>
</tr>
</tbody>
</table></div>

这张表解释了为什么循环能这么短：<strong>它只保留「必须知道完整一轮」的逻辑。</strong> 凡是单个工具自己能处理的，全部下放；凡是传输层能封装的，全部上移。循环退化成一个协调者，而不是一个什么都干的上帝对象。

这也是判断一个 Agent 架构是否健康的标准：如果主循环里出现了「解析 SSE」「拼 URL」「判断文件类型」这类代码，说明分层漏了。
<hr>
<h2>十个常见实现陷阱</h2>

下面这些坑，几乎每一个手写 Agent 的人都会踩至少三个。
<div class="table-scroll"><table>
<thead>
<tr>
<th>陷阱</th>
<th>症状</th>
<th>正确做法</th>
</tr>
</thead>
<tbody>
<tr>
<td>工具结果不带 <code>tool_call_id</code></td>
<td>下一轮 API 400，提示 tool 消息缺少 id</td>
<td>每条 tool 消息都带对应调用的 id</td>
</tr>
<tr>
<td>流式 <code>arguments</code> 用赋值</td>
<td>工具收到残缺 JSON，报参数错误</td>
<td>用 <code>push_str</code> 按 <code>index</code> 追加</td>
</tr>
<tr>
<td>中断在工具执行中间生效</td>
<td>历史里 assistant 有 3 个调用，只有 1 个结果</td>
<td>只在循环顶部检查中断</td>
</tr>
<tr>
<td>没有迭代上限</td>
<td>模型卡在失败命令上无限重试，账单暴涨</td>
<td>设 <code>max_iterations</code> 并明确提示</td>
</tr>
<tr>
<td>工具输出无上限</td>
<td>一次 <code>cat</code> 大文件把上下文撑爆</td>
<td>工具层统一截断，读文件设硬上限</td>
</tr>
<tr>
<td>工具错误直接 panic</td>
<td>一个路径写错导致整个进程退出</td>
<td>错误翻译成字符串结果</td>
</tr>
<tr>
<td>空 content 写空字符串</td>
<td>某些兼容层拒绝只有工具调用的 assistant 消息</td>
<td>写 <code>null</code></td>
</tr>
<tr>
<td>压缩切在 tool 消息中间</td>
<td>历史出现孤立的工具结果</td>
<td>切点后移到非 tool 消息</td>
</tr>
<tr>
<td>每轮追加记忆块</td>
<td>系统提示词随轮次线性增长</td>
<td>按标记整体替换</td>
</tr>
<tr>
<td>把规划写成循环阶段</td>
<td>模型被迫走固定流程，简单任务也绕一圈</td>
<td>规划交给模型，用工具表达</td>
</tr>
</tbody>
</table></div>

再补充三个更细的：
<ul>
<li><strong>并发结果按完成顺序回填</strong>。<code>join</code> 的顺序必须和 <code>tool_calls</code> 一致，不能按「谁先完成」排序，否则模型看到的结果和请求对不上。</li>
<li><strong><code>tool_choice</code> 在没有工具时也传</strong>。部分 API 会直接报错，必须用 <code>has_tools</code> 包一层。</li>
<li><strong>系统消息在恢复会话时原样保留</strong>。配置改了却不生效，排查半天以为是模型问题。</li>
</ul>

这些坑的共同点是：<strong>它们都不会在第一次运行时暴露。</strong> 单轮问答看起来一切正常，跑到第三轮、第五轮、第十轮才炸。Agent 的调试难度主要来自这种「状态累积型」故障。
<hr>
<h2>收尾：下一篇讲上下文</h2>

回到开头那句话：Agent 的本质是一个循环。

模型负责决策，工具负责行动，循环负责把两者接起来。规划、记忆、反思、多智能体，都是在这个循环上长出来的行为，不是循环之外的另一套系统。理解了两百行，后面的东西就有了挂载点。

这一篇刻意只讲了「怎么转」。还有一半问题没回答：<strong>转起来之后，历史里该留什么、该丢什么？</strong>

上下文是 Agent 最稀缺的资源。工具结果、文件内容、错误信息、历史对话都在争夺同一块窗口。留得太多，模型抓不住重点、成本飙升；丢得太多，模型忘了自己在干什么。NanoHermes 用「12 万字符预算 + 最近 10 条 + 摘要替换」处理这个问题，但真正的难点在于：<strong>摘要该保留什么。</strong>

下一篇《Agent 上下文：留什么，丢什么》会拆开 <code>compact</code>、<code>summarize</code> 和工具输出上限，讨论一个更本质的问题：什么样的信息值得跨轮携带。
