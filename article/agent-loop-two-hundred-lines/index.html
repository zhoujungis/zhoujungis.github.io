<h2>前言：为什么第一篇写循环</h2>

Agent 这个领域最不缺名词。

规划、反思、记忆、检索、工具使用、多智能体协作、任务分解、自我修正……每一个名词都能单独写一篇文章，每一个名词背后都有一堆论文和框架。第一次接触的人很容易产生一种错觉：Agent 是一个很复杂的系统，必须先选一个框架，再往里填配置。

但如果你把一个 Agent 的进程暂停在任意一个时刻，看它正在做什么，答案通常朴素得过分：<strong>它在等一次 HTTP 响应，或者在跑一条 shell 命令。</strong>

模型本身是无状态的。它不记得上一轮说过什么，也不知道自己刚才调用过哪个工具。所谓「多轮对话」，是客户端每一轮都把完整历史重新发一遍；所谓「工具调用」，是模型输出一段 JSON，客户端照着 JSON 去执行，再把执行结果作为下一条消息发回去。Agent 的全部魔法，就发生在这个「发出去、拿回来、执行、再发出去」的循环里。

NanoHermes 把这件事做得非常直白。<code>agent/src/agent.rs</code> 里的 <code>Agent::run</code> 本体是 109 行，从 <code>pub fn run</code> 到右花括号，包含注释和空行。加上它直接调用的 <code>complete</code>、<code>execute</code>、<code>assistant_message</code> 和 <code>compact</code>，去掉注释与空行，核心大约两百行。

这两百行里没有异步运行时，没有状态机生成器，没有中间件管线。只有五个判定、四个变量、三道闸，以及一个 <code>for</code> 循环。

这个系列的第一篇就讲这两百行。原因很简单：<strong>后面的上下文、记忆、工具、并发、安全、多体、观测，全都是挂在这个循环上的。</strong> 循环看不懂，后面的每一篇都会变成背名词。
<hr>
<h2>一句话：Agent = 模型 + 工具 + 循环</h2>

先把定义压到最短：
<blockquote>

<strong>Agent 是一个循环：把消息和工具清单发给模型；模型返回文本或工具调用；如果有工具调用，执行它们，把结果追加进消息列表，再发一次；直到模型不再调用工具。</strong>
</blockquote>

这句话里有三个组成部分，缺一不可。
<div class="table-scroll"><table>
<thead>
<tr>
<th>组成</th>
<th>职责</th>
<th>没有它会怎样</th>
</tr>
</thead>
<tbody>
<tr>
<td>模型</td>
<td>读消息、决定下一步、输出文本或工具调用</td>
<td>没有决策来源，只能按固定规则跑脚本</td>
</tr>
<tr>
<td>工具</td>
<td>真正读文件、改代码、跑命令、查网页</td>
<td>模型只能「说」，不能「做」，输出止于聊天框</td>
</tr>
<tr>
<td>循环</td>
<td>把模型输出变成动作，把动作结果变成模型输入</td>
<td>一次问答就结束，无法完成多步任务</td>
</tr>
</tbody>
</table></div>

很多人把「工具」理解成插件市场里的东西，其实工具的最小定义只是一个<strong>有名字、有 JSON Schema、能被模型点名调用的函数</strong>。它可以是 <code>read_file</code>，也可以是一次 HTTP 请求，甚至可以是另一个 Agent。模型不需要理解工具内部怎么实现，它只需要知道工具叫什么、参数长什么样、返回什么。

同样，循环也不需要理解模型怎么推理。它只做四件事：拼消息、发请求、执行调用、判断是否继续。把这四件事写清楚，一个 Agent 就成立了。
<hr>
<h2>拆掉名词之后，只剩五个要素</h2>

把「规划」「记忆」「RAG」这些词先放到一边，一个能跑的最小 Agent 只需要五个要素。
<div class="table-scroll"><table>
<thead>
<tr>
<th>要素</th>
<th>在 NanoHermes 里的对应物</th>
<th>代码位置</th>
</tr>
</thead>
<tbody>
<tr>
<td>消息列表</td>
<td><code>Vec&lt;Value&gt;</code>，OpenAI 的 <code>messages</code> 格式</td>
<td><code>Agent.messages</code></td>
</tr>
<tr>
<td>工具声明</td>
<td>19 个内置工具 + Skill + MCP + 子代理</td>
<td><code>tools::specs()</code>、<code>Agent::build_tools</code></td>
</tr>
<tr>
<td>一次模型调用</td>
<td>阻塞 HTTP，可选 SSE 流式</td>
<td><code>llm::chat</code></td>
</tr>
<tr>
<td>一次工具执行</td>
<td>权限检查、参数解析、钩子、分发</td>
<td><code>Agent::execute</code></td>
</tr>
<tr>
<td>终止条件</td>
<td>不再调用工具 / 被中断 / 达到迭代上限</td>
<td><code>Agent::run</code> 的三个出口</td>
</tr>
</tbody>
</table></div>

这五个要素里，真正容易写错的不是「怎么发 HTTP」，而是<strong>消息列表的状态管理</strong>。

模型是无状态的，但它对消息格式有严格假设：一条带 <code>tool_calls</code> 的 assistant 消息，后面必须跟齐每个调用的 <code>tool</code> 消息，且 <code>tool_call_id</code> 一一对应。少一条、多一条、顺序错了，API 都会拒绝。所以 Agent 的循环本质上是一个状态机：它必须保证每一轮结束后，历史仍然是一个合法的消息序列。

后面的「中断只在步骤边界生效」「工具错误也要变成结果」「并发执行但按序回填」，全部是为了守住这一条不变量。
<hr>
<h2>一个用户轮次的完整时序</h2>

在贴代码之前，先看一次真实的用户轮次。假设用户说「把 README 里的安装命令改成 pnpm」。
<div class="table-scroll"><table>
<thead>
<tr>
<th>步骤</th>
<th>动作</th>
<th>发生位置</th>
<th>失败时</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>按当前指令检索长期记忆，替换系统消息里的注入块</td>
<td><code>memory::retrieve_block</code>、<code>set_memory_block</code></td>
<td>静默跳过，不影响本轮</td>
</tr>
<tr>
<td>2</td>
<td>把用户消息追加到 <code>messages</code></td>
<td><code>Agent::run</code></td>
<td>不会失败</td>
</tr>
<tr>
<td>3</td>
<td>检查中断标志</td>
<td><code>interrupt::take()</code></td>
<td>直接退出循环</td>
</tr>
<tr>
<td>4</td>
<td>发一次模型请求</td>
<td><code>complete</code> → <code>llm::chat</code></td>
<td>返回 <code>Err</code>，整轮中止</td>
</tr>
<tr>
<td>5</td>
<td>累计 token 用量</td>
<td><code>UsageTotals</code></td>
<td>不会失败</td>
</tr>
<tr>
<td>6</td>
<td>把 assistant 消息追加到 <code>messages</code></td>
<td><code>assistant_message</code></td>
<td>不会失败</td>
</tr>
<tr>
<td>7</td>
<td>没有工具调用？结束</td>
<td><code>turn.tool_calls.is_empty()</code></td>
<td>正常返回</td>
</tr>
<tr>
<td>8</td>
<td>有工具调用？并发执行</td>
<td><code>execute</code> + <code>thread::scope</code></td>
<td>每个工具的错误变成字符串</td>
</tr>
<tr>
<td>9</td>
<td>把每个结果以 <code>role=tool</code> 追加</td>
<td><code>tool_call_id</code> 配对</td>
<td>不会失败</td>
</tr>
<tr>
<td>10</td>
<td>检查上下文是否超预算，必要时压缩</td>
<td><code>compact</code></td>
<td>摘要失败则退化为截断提示</td>
</tr>
<tr>
<td>11</td>
<td>回到步骤 3，继续下一轮</td>
<td><code>for</code> 循环</td>
<td>最多 <code>max_iterations</code> 次</td>
</tr>
</tbody>
</table></div>

这张表值得多看几眼，因为它暴露了几个设计选择：
<ul>
<li><strong>记忆检索在用户消息入历史之前</strong>。检索的 query 就是这一轮的用户输入，而不是上一轮的残留。</li>
<li><strong>中断检查在循环顶部</strong>。它不会在工具执行到一半时打断，只在「上一轮已经完全收尾、下一轮还没开始」的位置生效。</li>
<li><strong>工具执行和结果回填是分开的两步</strong>。先并发跑完所有工具，再按调用顺序逐个写回历史。这样模型看到的顺序永远和它请求的顺序一致。</li>
<li><strong>压缩在工具结果回填之后</strong>。压缩的对象是「已经完整的一轮」，不会把一条 assistant 工具调用和它的结果拆开。</li>
</ul>
<hr>
<h2>主循环骨架：109 行的 <code>Agent::run</code></h2>

把 UI 输出、记忆沉淀、持久化这些旁路去掉，循环骨架大概是这样。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">run</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">content</span><span class="p">:</span><span class="w"> </span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">_guard</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">user_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">content_text</span><span class="p">(</span><span class="o">&amp;</span><span class="n">content</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">dir</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">memory_dir</span><span class="p">.</span><span class="n">clone</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">block</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">retrieve_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">);</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">set_memory_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">block</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">content</span><span class="w"> </span><span class="p">}));</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">completed</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">interrupted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">had_tools</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">final_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">interrupted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">            </span><span class="k">break</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>

<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">complete</span><span class="p">()</span><span class="o">?</span><span class="p">;</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">requests</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">;</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">;</span>

<span class="w">        </span><span class="n">final_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">assistant_message</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">));</span>

<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">completed</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">            </span><span class="k">break</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="n">had_tools</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>

<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">results</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_tool_calls</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">);</span>
<span class="w">        </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">call</span><span class="p">,</span><span class="w"> </span><span class="n">result</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">zip</span><span class="p">(</span><span class="n">results</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">                </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">,</span>
<span class="w">                </span><span class="s">&quot;tool_call_id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">call</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">                </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">result</span><span class="p">,</span>
<span class="w">            </span><span class="p">}));</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">compact</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">interrupted</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">warn</span><span class="p">(</span><span class="s">&quot;interrupted — the conversation was kept&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">completed</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">warn</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">            </span><span class="s">&quot;reached the {} iteration limit without finishing&quot;</span><span class="p">,</span>
<span class="w">            </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span>
<span class="w">        </span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">persist</span><span class="p">();</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">final_text</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


这段代码为了篇幅做了两处合并：把并发执行收进了 <code>run_tool_calls</code>，把 UI 输出删掉了。原版里并发执行是内联的 <code>std::thread::scope</code>，后面单独讲。

即便如此，骨架已经完整了。你可以看到它没有任何「规划」阶段，也没有「反思」阶段。模型如果想规划，它会自己调用 <code>todo_write</code>；如果想反思，它会在下一轮看到工具结果后改变主意。<strong>规划不是循环的一个阶段，而是模型在循环里的行为。</strong>

这是理解 Agent 的第一个坎：不要把人类的工作流硬编码成阶段。循环只提供「行动—观察」的节奏，具体怎么行动由模型决定。
<hr>
<h2>循环里的四个变量</h2>

<code>run</code> 里声明了四个可变变量，它们分别回答四个问题。
<div class="table-scroll"><table>
<thead>
<tr>
<th>变量</th>
<th>类型</th>
<th>回答的问题</th>
<th>谁会给它赋值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>completed</code></td>
<td><code>bool</code></td>
<td>模型是否主动停止了工具调用？</td>
<td><code>turn.tool_calls.is_empty()</code></td>
</tr>
<tr>
<td><code>interrupted</code></td>
<td><code>bool</code></td>
<td>用户是否按了 Ctrl-C？</td>
<td>循环顶部的 <code>interrupt::take()</code></td>
</tr>
<tr>
<td><code>had_tools</code></td>
<td><code>bool</code></td>
<td>这一轮是否真的执行过工具？</td>
<td>第一次进入工具分支时置 <code>true</code></td>
</tr>
<tr>
<td><code>final_text</code></td>
<td><code>String</code></td>
<td>最后一条 assistant 文本是什么？</td>
<td>每次模型响应后覆盖</td>
</tr>
</tbody>
</table></div>

前三个变量决定循环结束后怎么收尾，第四个决定 <code>run</code> 返回什么。

<code>final_text</code> 有一个容易忽略的细节：它每一轮都被覆盖，而不是只在结束时赋值。这意味着如果循环因为达到迭代上限而退出，返回的是<strong>最后一次模型响应里的文本</strong>，可能是一句「我准备继续修改」，也可能为空。调用方拿到空字符串是正常的，不代表出错。

<code>had_tools</code> 只服务于一个旁路：对话结束后是否值得提炼长期记忆。纯寒暄的轮次没有工具调用，不值得让模型再花一次请求去总结；只有真正干了活的轮次才进入提炼流程。这个变量不参与循环控制，但它是「记忆沉淀」这个功能的门槛。

<code>interrupted</code> 和 <code>completed</code> 的优先级也值得注意：中断优先。如果用户在最后一轮工具执行完之后按了 Ctrl-C，循环顶部会捕获到，<code>interrupted = true</code>，即使模型本来下一轮就会结束，也会走中断分支。这是符合直觉的：用户说停，就停。
<hr>
<h2>第一步：先检索记忆，再把用户消息放进历史</h2>

循环开始之前，<code>run</code> 做了两件事：检索长期记忆，追加用户消息。

顺序很重要。检索用的 query 是 <code>memory::content_text(&amp;content)</code>，也就是这一轮用户输入里提取出的纯文本。多模态消息（文本 + 图片）会被拆成文本部分，图片不会参与检索。然后 <code>retrieve_block</code> 返回一段已经排好版的记忆块，<code>set_memory_block</code> 把它写进系统消息。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">set_memory_block</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">block</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">system</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">first_mut</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">system</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;role&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="s">&quot;system&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">text</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">system</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="n">c</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="kd">let</span><span class="w"> </span><span class="n">updated</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">set_block</span><span class="p">(</span><span class="n">text</span><span class="p">,</span><span class="w"> </span><span class="n">block</span><span class="p">);</span>
<span class="w">                </span><span class="n">system</span><span class="p">[</span><span class="s">&quot;content&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">(</span><span class="n">updated</span><span class="p">);</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这段代码的关键不是「写进去」，而是「替换」。

系统消息里有一个带标记的记忆区块。每次检索后，新块会替换旧块，而不是追加。原因很实际：如果不替换，第二轮注入一次，第三轮再注入一次，系统提示词会随着轮次线性增长，很快就吃掉整个上下文预算。按标记整体替换，保证记忆块的大小只和检索结果有关，和对话跑了多久无关。

空块代表删除。如果这一轮没有检索到相关记忆，<code>set_block</code> 会把旧块清掉，而不是留着上一轮的残留。这也是「按当前指令检索」的题中之义：记忆应该跟着当前任务走，而不是跟着会话走。

<code>memory_dir</code> 为 <code>None</code> 时，整个记忆功能关闭，连工具层都不会暴露可用的 <code>memory_save</code> / <code>memory_search</code>（虽然声明还在，调用会返回「long-term memory is disabled」）。这一段是系列第三篇的主题，这里只需要记住：<strong>记忆是循环的前置钩子，不是循环的一部分。</strong>
<hr>
<h2>系统提示词：短是设计，不是偷懒</h2>

<code>run</code> 不负责拼系统提示词，那是 <code>prompt::system_prompt</code> 的事。但系统提示词的形状直接影响循环的成本，所以必须在这篇讲清楚。

NanoHermes 的基础提示词很短，核心就是身份、工具使用规则、工作区路径三段。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">system_prompt</span><span class="p">(</span><span class="n">cfg</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Config</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">r#&quot;You are NanoHermes, a lightweight terminal coding agent working inside the user&#39;s workspace.</span>

<span class="s">You help with software engineering tasks: reading and understanding code, editing files,</span>
<span class="s">running commands, searching the codebase, and answering questions about the project.</span>

<span class="s">Operating rules:</span>
<span class="s">- You have tools. Use them to inspect the code instead of guessing about file contents or command output.</span>
<span class="s">- Always read a file before editing it. Never rewrite a file you have not read.</span>
<span class="s">- Prefer targeted edits (edit_file) over whole-file rewrites; keep changes minimal and focused.</span>
<span class="s">- Do not add features, refactors, or &quot;improvements&quot; beyond what the user asked for.</span>
<span class="s">- Prefer non-interactive commands (pass auto-confirm flags) since this terminal has no TTY.</span>
<span class="s">- Briefly explain what you are doing, then act. Do not over-narrate.</span>
<span class="s">- After each tool result, decide the next step. When the task is complete, reply with a</span>
<span class="s">  concise summary and stop calling tools.</span>

<span class="s">Workspace root: {root}</span>
<span class="s">&quot;#</span><span class="p">,</span>
<span class="w">        </span><span class="n">root</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">workspace</span><span class="p">.</span><span class="n">display</span><span class="p">()</span>
<span class="w">    </span><span class="p">);</span>
<span class="w">    </span><span class="c1">// 权限模式提示、用户人设、AGENTS.md 依次追加</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="p">}</span>
</code></pre></div>


这段提示词里没有「你是一个资深工程师」「你要先制定计划」这类话。不是漏了，是刻意不写。原因有三条。

<strong>第一，提示词每轮都要重发。</strong> 系统消息不是只发一次，它在每一次模型请求里都排在最前面。如果基础提示词是 2,000 token，跑 20 轮就是 40,000 token 的输入成本，而且每一轮都要重新计费。提示词越长，循环的边际成本越高。

<strong>第二，长提示词会稀释工具规则。</strong> 模型对上下文的注意力不是均匀的。把「先读再改」埋在三千字的人设后面，效果不如放在前十行。NanoHermes 把最重要的六条规则放在身份之后，就是为了让它们始终在显眼位置。

<strong>第三，项目约定应该由项目自己提供。</strong> 「这个仓库用 pnpm」「提交前跑 cargo fmt」这类信息不该硬编码在 Agent 里，而应该放在 <code>AGENTS.md</code>。NanoHermes 会从文件系统根目录一路读到工作区，把每一层的 <code>AGENTS.md</code> 拼起来，最后读到的（最具体的）排在最后，自然形成优先级。

系统消息的五个来源可以列成一张表。
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>内容</th>
<th>上限 / 条件</th>
</tr>
</thead>
<tbody>
<tr>
<td>内置提示词</td>
<td>身份、六条工作规则、工作区路径</td>
<td>固定，约 30 行</td>
</tr>
<tr>
<td>权限模式提示</td>
<td>Goal / Debug / Plan 各自的一行行为约束</td>
<td>仅非 Default / AcceptEdits 时追加</td>
</tr>
<tr>
<td>用户人设</td>
<td><code>system_prompt</code> 配置里的额外指令</td>
<td>非空才追加，不替换基础规则</td>
</tr>
<tr>
<td><code>AGENTS.md</code></td>
<td>全局 <code>~/.nanohermes/AGENTS.md</code> + 祖先目录逐层</td>
<td>合计 20,000 字符封顶</td>
</tr>
<tr>
<td><code>NANOHERMES.md</code></td>
<td>工作区根目录的项目上下文</td>
<td>非空才追加</td>
</tr>
<tr>
<td>Skills 清单</td>
<td>可用技能的名字与一句话描述</td>
<td>发现到技能才追加</td>
</tr>
</tbody>
</table></div>

注意最后两行不在 <code>prompt.rs</code> 里：<code>NANOHERMES.md</code> 和 Skills 清单由 <code>agent.rs</code> 的 <code>system_content</code> 追加。分层的理由是「谁负责发现，谁负责注入」——项目文件属于工作区，技能属于运行时。

还有一个细节：<code>AGENTS.md</code> 会被 <code>canonicalize</code> 去重。同一个文件通过符号链接或多路径到达时，只读一次。拼接过长时按字符边界截断，并追加一行 <code>project guidance truncated</code>。这些处理都不复杂，但它们决定了「提示词不会因为仓库里有巨型文档而失控」。
<hr>
<h2>第二步：组装工具清单</h2>

模型不会凭空知道有哪些工具。每一轮请求都要带上工具声明，声明是 JSON Schema，模型据此决定调用谁、传什么参数。

NanoHermes 的工具清单由四个来源拼成。
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>内容</th>
<th>加入条件</th>
</tr>
</thead>
<tbody>
<tr>
<td>内置工具</td>
<td>读写文件、补丁、目录、grep、glob、shell、后台任务、网页、todo、git、记忆</td>
<td>始终存在</td>
</tr>
<tr>
<td><code>skill</code></td>
<td>按名字加载某个技能的完整说明</td>
<td>工作区里发现了技能</td>
</tr>
<tr>
<td>MCP 工具</td>
<td>每个 MCP 服务器暴露的工具</td>
<td>配置了 MCP 服务器</td>
</tr>
<tr>
<td>MCP 辅助工具</td>
<td><code>mcp_list_resources</code>、<code>mcp_read_resource</code>、<code>mcp_list_prompts</code>、<code>mcp_get_prompt</code></td>
<td>配置了 MCP 服务器</td>
</tr>
<tr>
<td>子代理</td>
<td><code>subagent</code>、<code>agent_list</code></td>
<td>配置了子代理定义</td>
</tr>
</tbody>
</table></div>

拼完之后还有一道过滤：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">build_tools</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Value</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">list</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tools</span><span class="p">::</span><span class="n">specs</span><span class="p">().</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">skills</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">list</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">skill_tool_spec</span><span class="p">());</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">m</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">mcp</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">list</span><span class="p">.</span><span class="n">extend</span><span class="p">(</span><span class="n">m</span><span class="p">.</span><span class="n">all_tools</span><span class="p">());</span>
<span class="w">        </span><span class="n">list</span><span class="p">.</span><span class="n">extend</span><span class="p">(</span><span class="n">mcp_aux_tools</span><span class="p">());</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">list</span><span class="p">.</span><span class="n">retain</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">name</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;function&quot;</span><span class="p">)</span>
<span class="w">            </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">f</span><span class="o">|</span><span class="w"> </span><span class="n">f</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;name&quot;</span><span class="p">))</span>
<span class="w">            </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">n</span><span class="o">|</span><span class="w"> </span><span class="n">n</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">            </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">check_tool</span><span class="p">(</span><span class="n">name</span><span class="p">).</span><span class="n">is_ok</span><span class="p">()</span>
<span class="w">    </span><span class="p">});</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">subagents</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">list</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">subagent_tool_spec</span><span class="p">());</span>
<span class="w">        </span><span class="n">list</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">agent_list_tool_spec</span><span class="p">());</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">Value</span><span class="p">::</span><span class="n">Array</span><span class="p">(</span><span class="n">list</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


<code>check_tool</code> 的规则是三道，按优先级从高到低：
<ol>
<li><strong>权限模式的硬封锁</strong>：Plan 模式封掉所有写操作和 <code>run_command</code>，Debug 模式封掉写操作但允许跑命令。</li>
<li><strong>deny 列表</strong>：显式禁止的工具永远不能执行。</li>
<li><strong>allow 列表</strong>：一旦配置了 allow 列表，只有列表里的工具能执行。</li>
</ol>
<div class="table-scroll"><table>
<thead>
<tr>
<th>权限模式</th>
<th>硬封锁的工具</th>
<th>适用场景</th>
</tr>
</thead>
<tbody>
<tr>
<td>Default</td>
<td>无</td>
<td>日常使用，按 <code>auto_approve</code> 决定是否确认 shell</td>
</tr>
<tr>
<td>AcceptEdits</td>
<td>无，但 shell 始终要确认</td>
<td>想让文件编辑免确认、命令仍需把关</td>
</tr>
<tr>
<td>Plan</td>
<td><code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>run_command</code>、<code>git_commit</code></td>
<td>只读分析，产出方案</td>
</tr>
<tr>
<td>Goal</td>
<td>无，且永不确认</td>
<td>无人值守，跑到目标完成</td>
</tr>
<tr>
<td>Debug</td>
<td><code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>git_commit</code></td>
<td>允许复现问题，但不许改坏现场</td>
</tr>
</tbody>
</table></div>

这里有一个实现上的小不对称：<code>subagent</code> 和 <code>agent_list</code> 是在 <code>retain</code> 之后追加的，所以构建清单时它们没经过 <code>check_tool</code>。但真正执行时，<code>execute</code> 会再过一次 <code>check_tool</code>，所以安全性不受影响。清单只是「广告」，执行才是「闸门」。这也解释了一个设计原则：<strong>工具声明可以宽，执行必须严。</strong>

工具声明的顺序也有影响。模型在同等条件下倾向于先看到、先选择靠前的工具。NanoHermes 把最常用的读写、搜索、shell 放在前面，把记忆、git、后台任务放在后面。这不是玄学，是减少模型在长清单里的选择成本。
<hr>
<h2>第三步：发一次模型请求</h2>

<code>complete</code> 是循环里最短的函数之一，它只做两件事：取工具清单，按输出格式选择回调。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">complete</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="n">AssistantTurn</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">style</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">tools</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">build_tools</span><span class="p">();</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">output_format</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">OutputFormat</span><span class="p">::</span><span class="n">StreamJson</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">llm</span><span class="p">::</span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">tools</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">delta</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">delta</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="fm">println!</span><span class="p">(</span><span class="s">&quot;{}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;delta&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">delta</span><span class="w"> </span><span class="p">}));</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">})</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">llm</span><span class="p">::</span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">tools</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">delta</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">style</span><span class="p">.</span><span class="n">stream</span><span class="p">(</span><span class="n">delta</span><span class="p">)</span>
<span class="w">        </span><span class="p">}),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


输出格式在这里分叉：普通文本模式把增量交给终端渲染器；<code>stream-json</code> 模式把每个增量包成一个 JSON 对象打到 stdout，方便管道处理。两者的 HTTP 请求完全一样，区别只在「增量到达时怎么处理」。

真正的请求在 <code>llm::chat</code> 里。它构造请求体、处理重试、选择流式或非流式读取，最后返回一个 <code>AssistantTurn</code>：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">AssistantTurn</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">content</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">tool_calls</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">ToolCall</span><span class="o">&gt;</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">usage</span><span class="p">:</span><span class="w"> </span><span class="nc">Usage</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


这个结构是循环的「输入」。<code>content</code> 是模型说的话，<code>tool_calls</code> 是模型想做的动作，<code>usage</code> 是这次请求的 token 消耗。循环只关心前两个，第三个进账本。
<hr>
<h2>请求体里每个字段都在回答一个问题</h2>

<code>llm::chat</code> 的 <code>build_body</code> 很短，但每个字段都对应一个实际约束。
<div class="table-scroll"><table>
<thead>
<tr>
<th>字段</th>
<th>值</th>
<th>回答的问题</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>model</code></td>
<td>当前配置或 fallback</td>
<td>用哪个模型</td>
</tr>
<tr>
<td><code>messages</code></td>
<td>完整历史</td>
<td>模型需要看到什么</td>
</tr>
<tr>
<td><code>temperature</code></td>
<td>默认 <code>0.0</code></td>
<td>要不要随机性</td>
</tr>
<tr>
<td><code>max_tokens</code></td>
<td>默认 <code>4096</code></td>
<td>单次响应最多多长</td>
</tr>
<tr>
<td><code>stream</code></td>
<td>默认 <code>true</code></td>
<td>要不要边生成边显示</td>
</tr>
<tr>
<td><code>tools</code></td>
<td>工具声明数组</td>
<td>模型能调用什么</td>
</tr>
<tr>
<td><code>tool_choice</code></td>

<td>让模型自己决定是否调用</td>
</tr>
<tr>
<td><code>reasoning_effort</code></td>

</tr>
<tr>
<td><code>stream_options</code></td>
<td><code>{"include_usage": true}</code></td>
<td>流式响应里要不要带用量</td>
</tr>
</tbody>
</table></div>
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">build_body</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">|</span><span class="n">model</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">body</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;model&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">model</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;messages&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">messages</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;temperature&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">cfg</span><span class="p">.</span><span class="n">temperature</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;max_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">cfg</span><span class="p">.</span><span class="n">max_tokens</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;stream&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">cfg</span><span class="p">.</span><span class="n">stream</span><span class="p">,</span>
<span class="w">    </span><span class="p">});</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">has_tools</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;tools&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tools</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">        </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;tool_choice&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;auto&quot;</span><span class="p">.</span><span class="n">into</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">thinking</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;reasoning_effort&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;high&quot;</span><span class="p">.</span><span class="n">into</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">stream</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;stream_options&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;include_usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">true</span><span class="w"> </span><span class="p">});</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">body</span>
<span class="p">};</span>
</code></pre></div>


几个选择值得解释。

<strong><code>temperature</code> 默认 0.0。</strong> coding agent 不是创意写作，代码修改需要可复现。温度越高，同一份上下文产生的 diff 越随机，调试成本越高。NanoHermes 把默认值设成 0，需要发散时再通过配置调高。

<strong><code>max_tokens</code> 默认 4096。</strong> 这不是模型的上限，是单次响应的预算。工具调用本身很短，4096 足够容纳一次「解释 + 多个工具调用」。太大的值会让模型倾向于写长回复，反而拖慢循环。

<strong><code>tool_choice</code> 只在有工具时出现。</strong> 没有工具还传 <code>"auto"</code>，有些 API 会直接报错。<code>has_tools</code> 这个布尔值就是为了避免这种低级错误。

<strong><code>stream_options.include_usage</code> 是流式用量的来源。</strong> 默认的 SSE 流不会在最后带 usage，必须显式要求。NanoHermes 需要这个字段才能在没有非流式响应的情况下记账。

<strong>没有 <code>top_p</code>、<code>seed</code>、<code>presence_penalty</code>。</strong> 不是这些参数没用，而是它们对 coding agent 的收益太低，传了只会增加兼容性风险。不同厂商的 OpenAI 兼容层对这些字段的支持程度不一样，少传一个就少一个「某家 API 不认」的故障点。
<hr>
<h2>重试与降级：只认五种错误</h2>

网络请求会失败。Agent 的循环不能因为一次 429 就整轮崩掉，所以 <code>llm::chat</code> 外面套了一个重试循环。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">attempt</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="k">loop</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">chat_with_model</span><span class="p">(</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="n">build_body</span><span class="p">(</span><span class="o">&amp;</span><span class="n">cfg</span><span class="p">.</span><span class="n">model</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">on_text</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">),</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">is_retryable_error</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">attempt</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">max_retries</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">attempt</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">                </span><span class="kd">let</span><span class="w"> </span><span class="n">delay</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">backoff_ms</span><span class="p">(</span><span class="n">cfg</span><span class="p">.</span><span class="n">retry_base_ms</span><span class="p">,</span><span class="w"> </span><span class="n">attempt</span><span class="p">);</span>
<span class="w">                </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;note: retrying in {delay}ms (attempt {attempt}/{})&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">max_retries</span><span class="p">);</span>
<span class="w">                </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">sleep</span><span class="p">(</span><span class="n">Duration</span><span class="p">::</span><span class="n">from_millis</span><span class="p">(</span><span class="n">delay</span><span class="p">));</span>
<span class="w">                </span><span class="k">continue</span><span class="p">;</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">fallback</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="n">cfg</span><span class="p">.</span><span class="n">fallback_model</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="n">is_retryable_error</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="k">return</span><span class="w"> </span><span class="n">chat_with_model</span><span class="p">(</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="n">build_body</span><span class="p">(</span><span class="n">fallback</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">on_text</span><span class="p">);</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">);</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>is_retryable_error</code> 的判断非常朴素：错误字符串里包含 <code>HTTP 429</code>、<code>HTTP 500</code>、<code>HTTP 502</code>、<code>HTTP 503</code> 或 <code>HTTP 504</code>。
<div class="table-scroll"><table>
<thead>
<tr>
<th>错误</th>
<th>是否重试</th>
<th>理由</th>
</tr>
</thead>
<tbody>
<tr>
<td>HTTP 429</td>
<td>是</td>
<td>限流，等一会儿可能恢复</td>
</tr>
<tr>
<td>HTTP 500</td>
<td>是</td>
<td>服务端内部错误，可能瞬时</td>
</tr>
<tr>
<td>HTTP 502 / 503 / 504</td>
<td>是</td>
<td>网关或上游暂时不可用</td>
</tr>
<tr>
<td>HTTP 400 / 401 / 403</td>
<td>否</td>
<td>请求格式、鉴权、权限问题，重试无用</td>
</tr>
<tr>
<td>JSON 解析失败</td>
<td>否</td>
<td>响应结构不对，重试大概率一样</td>
</tr>
<tr>
<td>连接超时</td>
<td>否</td>
<td>错误字符串不匹配，直接失败</td>
</tr>
</tbody>
</table></div>

退避公式是 <code>base * 2^(attempt-1)</code>，上限 30 秒。默认 <code>base = 500ms</code>、<code>max_retries = 2</code>，所以最多等 500ms、1000ms 两次，总共 1.5 秒。这个量级适合交互式 CLI：用户还在等，不能睡太久。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">backoff_ms</span><span class="p">(</span><span class="n">base_ms</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span><span class="w"> </span><span class="n">attempt</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">base_ms</span>
<span class="w">        </span><span class="p">.</span><span class="n">saturating_mul</span><span class="p">(</span><span class="mi">2</span><span class="k">u64</span><span class="p">.</span><span class="n">saturating_pow</span><span class="p">(</span><span class="n">attempt</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="mi">1</span><span class="p">)))</span>
<span class="w">        </span><span class="p">.</span><span class="n">min</span><span class="p">(</span><span class="mi">30_000</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


重试耗尽后，如果配置了 <code>fallback_model</code>，会用备用模型再试一次。注意这次不再重试，只试一次。备用模型的意义是「主模型限流时还能干活」，不是「无限续命」。

这里有一个诚实但容易被忽略的代价：<strong>流式请求如果在吐出部分文本后失败，重试会再次触发 <code>on_text</code>，界面上可能出现重复文本。</strong> NanoHermes 没有做增量去重，因为绝大多数可重试错误发生在建立连接或首帧阶段；真正的中途断流属于少数情况，去重逻辑的复杂度不值得。知道这个边界，比假装它不存在更好。
<hr>
<h2>流式解析：一行一行读 SSE</h2>

流式响应是 <code>text/event-stream</code>，格式是一行一行的 <code>data: {...}</code>。NanoHermes 没有引入 SSE 库，而是直接用 <code>BufReader::lines()</code> 读。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">read_stream</span><span class="p">(</span><span class="n">resp</span><span class="p">:</span><span class="w"> </span><span class="nc">ureq</span><span class="p">::</span><span class="n">Response</span><span class="p">,</span><span class="w"> </span><span class="n">on_text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="k">impl</span><span class="w"> </span><span class="nb">FnMut</span><span class="p">(</span><span class="o">&amp;</span><span class="kt">str</span><span class="p">))</span>
<span class="w">    </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="n">AssistantTurn</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span>
<span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">AssistantTurn</span><span class="p">::</span><span class="n">default</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">reader</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">BufReader</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">resp</span><span class="p">.</span><span class="n">into_reader</span><span class="p">());</span>

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">reader</span><span class="p">.</span><span class="n">lines</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">l</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">l</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;stream read error: {e}&quot;</span><span class="p">)),</span>
<span class="w">        </span><span class="p">};</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">l</span><span class="p">.</span><span class="n">trim_end_matches</span><span class="p">([</span><span class="sc">&#39;\r&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;\n&#39;</span><span class="p">]);</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">l</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">l</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="sc">&#39;:&#39;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">continue</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">data</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">l</span><span class="p">.</span><span class="n">strip_prefix</span><span class="p">(</span><span class="s">&quot;data:&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Some</span><span class="p">(</span><span class="n">d</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">d</span><span class="p">.</span><span class="n">trim</span><span class="p">(),</span>
<span class="w">            </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
<span class="w">        </span><span class="p">};</span>

<span class="w">            </span><span class="k">break</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>

<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">v</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">v</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">_</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
<span class="w">        </span><span class="p">};</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">err</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;error&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;API error: {err}&quot;</span><span class="p">));</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;usage&quot;</span><span class="p">).</span><span class="n">is_some</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">usage_from_value</span><span class="p">(</span><span class="o">&amp;</span><span class="n">v</span><span class="p">);</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">delta</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;choices&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="n">c</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="mi">0</span><span class="p">))</span>
<span class="w">            </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="n">c</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;delta&quot;</span><span class="p">))</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">continue</span><span class="w"> </span><span class="p">};</span>

<span class="w">                </span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="n">text</span><span class="p">);</span>
