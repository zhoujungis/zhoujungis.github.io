    <noscript><div class="ns-article"><h1>【LC 42】接雨水：四种解法其实在回答同一个问题，而三维版把它变成了 Dijkstra</h1><div class="ns-meta">2026/9/28 · Stack Frame</div><div class="markdown-body"><blockquote>

<strong>适用读者</strong>：背过"双指针解接雨水"但一直没想明白为什么对的人；以及想知道单调栈到底在干什么的人
<strong>技术栈</strong>：Python 为主，附 Java 版
<strong>难度</strong>：Hard —— 但它的 Hard 之处不在代码长，而在<strong>核心论证</strong>：为什么"较矮的那一端"可以立刻结算
<strong>收获</strong>：四种解法其实是同一个问题的四种回答方式、双指针 <code>O(1)</code> 空间的正确性论证、单调栈"按层累加"的视角、以及 LC 407 三维版如何把这道题变成 Dijkstra
</blockquote>
<h2>题目</h2>

给定 <code>n</code> 个非负整数表示每个宽度为 <code>1</code> 的柱子的高度图，计算按此排列的柱子，下雨之后能接多少雨水。
<div class="codehilite"><pre><span></span><code>输入：height = [0,1,0,2,1,0,1,3,2,1,2,1]
输出：6

输入：height = [4,2,0,3,2,5]
输出：9
</code></pre></div>


先提醒一句：<strong>这两个示例的答案很容易记混</strong> —— 第一个是 <code>6</code>，第二个是 <code>9</code>。
我自己第一次复盘这道题时就把 <code>9</code> 记成了第一个例子的答案，还顺手用反例验证了一下才确认。
把两个答案都钉死，后面推演时才有对照的锚点。
<hr>
<h2>一、核心洞察：整道题只有一句话</h2>

无论用哪种解法，第一步都是把问题拆到"一个位置"上：
<blockquote>

<strong>位置 <code>i</code> 能存多少水，只取决于它左边最高的柱子和它右边最高的柱子。</strong>
</blockquote>

理由很朴素：水会往两边流，<strong>能留住的高度是两侧的短板</strong> —— 这就是木桶原理。写成公式：
<div class="codehilite"><pre><span></span><code><span class="n">water</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nf">max</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="nf">min</span><span class="p">(</span><span class="n">左最高</span><span class="p">,</span><span class="w"> </span><span class="n">右最高</span><span class="p">)</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">height</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="p">)</span>
</code></pre></div>


拿第一个例子验证一下位置 <code>5</code>（高度 <code>0</code>）：它左边最高是 <code>2</code>（位置 3 那根），右边最高是 <code>3</code>（位置 7 那根），短板是 <code>2</code>，所以这格能存 <code>2 - 0 = 2</code> 单位水 —— 整个例子最大的一格。

所以<strong>这道题从头到尾只在问一件事</strong>：
<blockquote>

<strong>每个位置的"左最高"和"右最高"分别是多少？</strong>
</blockquote>

接下来你会看到，所谓"四种解法"，其实只是<strong>四种获取这两个数的方式</strong>。
<hr>
<h2>二、四种解法：同一个问题的四种回答</h2>
<table>
<thead>
<tr>
<th>解法</th>
<th>怎么拿到"左右最高"</th>
<th>时间</th>
<th>空间</th>
</tr>
</thead>
<tbody>
<tr>
<td>暴力</td>
<td>每个位置左右各扫一遍</td>
<td><code>O(n²)</code></td>
<td><code>O(1)</code></td>
</tr>
<tr>
<td>动态规划</td>
<td>预处理两个数组：前缀最大 + 后缀最大</td>
<td><code>O(n)</code></td>
<td><code>O(n)</code></td>
</tr>
<tr>
<td><strong>双指针</strong></td>
<td><strong>边走边维护，只在"确定安全"的一侧结算</strong></td>
<td><code>O(n)</code></td>
<td><strong><code>O(1)</code></strong></td>
</tr>
<tr>
<td>单调栈</td>
<td>换视角：不按列算，按"凹槽"一层层横着填</td>
<td><code>O(n)</code></td>
<td><code>O(n)</code></td>
</tr>
</tbody>
</table>

先看最朴素的两个，它们是理解后两个的台阶。

<strong>暴力</strong>：对每个位置 <code>i</code>，往左扫一遍求最大、往右扫一遍求最大。正确，但每个位置都要 <code>O(n)</code>，总共 <code>O(n²)</code>。

<strong>动态规划</strong>：发现"往左扫"的结果可以复用 —— 开两个数组，<code>leftMax[i]</code> 表示 <code>[0..i]</code> 的最大值，<code>rightMax[i]</code> 表示 <code>[i..n-1]</code> 的最大值，各扫一遍预处理出来，然后每个位置 <code>O(1)</code> 查表：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">trap</span><span class="p">(</span><span class="n">height</span><span class="p">):</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">height</span><span class="p">)</span>
    <span class="n">leftMax</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="n">n</span>     <span class="c1"># leftMax[i] = max(height[0..i])</span>
    <span class="n">rightMax</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="n">n</span>    <span class="c1"># rightMax[i] = max(height[i..n-1])</span>

    <span class="n">leftMax</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">=</span> <span class="n">height</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="n">n</span><span class="p">):</span>
        <span class="n">leftMax</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">leftMax</span><span class="p">[</span><span class="n">i</span> <span class="o">-</span> <span class="mi">1</span><span class="p">],</span> <span class="n">height</span><span class="p">[</span><span class="n">i</span><span class="p">])</span>

    <span class="n">rightMax</span><span class="p">[</span><span class="n">n</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span> <span class="o">=</span> <span class="n">height</span><span class="p">[</span><span class="n">n</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span> <span class="o">-</span> <span class="mi">2</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">):</span>
        <span class="n">rightMax</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">rightMax</span><span class="p">[</span><span class="n">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">],</span> <span class="n">height</span><span class="p">[</span><span class="n">i</span><span class="p">])</span>

    <span class="k">return</span> <span class="nb">sum</span><span class="p">(</span><span class="nb">min</span><span class="p">(</span><span class="n">leftMax</span><span class="p">[</span><span class="n">i</span><span class="p">],</span> <span class="n">rightMax</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="o">-</span> <span class="n">height</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span><span class="p">))</span>
</code></pre></div>


时间降到 <code>O(n)</code>，但开了两个数组，空间 <code>O(n)</code>。

<strong>接下来的问题就变成了：能不能不算出完整的两个数组？</strong>
<hr>
<h2>三、双指针：完整代码</h2>

双指针的答案，是把"预处理"变成"边走边算"：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">trap</span><span class="p">(</span><span class="n">height</span><span class="p">):</span>
    <span class="n">l</span><span class="p">,</span> <span class="n">r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">height</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="n">left_max</span> <span class="o">=</span> <span class="n">right_max</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="n">ans</span> <span class="o">=</span> <span class="mi">0</span>

    <span class="k">while</span> <span class="n">l</span> <span class="o">&lt;</span> <span class="n">r</span><span class="p">:</span>
        <span class="k">if</span> <span class="n">height</span><span class="p">[</span><span class="n">l</span><span class="p">]</span> <span class="o">&lt;</span> <span class="n">height</span><span class="p">[</span><span class="n">r</span><span class="p">]:</span>
            <span class="n">left_max</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">left_max</span><span class="p">,</span> <span class="n">height</span><span class="p">[</span><span class="n">l</span><span class="p">])</span>     <span class="c1"># ① 先更新</span>
            <span class="n">ans</span> <span class="o">+=</span> <span class="n">left_max</span> <span class="o">-</span> <span class="n">height</span><span class="p">[</span><span class="n">l</span><span class="p">]</span>             <span class="c1"># ② 再结算</span>
            <span class="n">l</span> <span class="o">+=</span> <span class="mi">1</span>
        <span class="k">else</span><span class="p">:</span>
            <span class="n">right_max</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">right_max</span><span class="p">,</span> <span class="n">height</span><span class="p">[</span><span class="n">r</span><span class="p">])</span>
            <span class="n">ans</span> <span class="o">+=</span> <span class="n">right_max</span> <span class="o">-</span> <span class="n">height</span><span class="p">[</span><span class="n">r</span><span class="p">]</span>
            <span class="n">r</span> <span class="o">-=</span> <span class="mi">1</span>

    <span class="k">return</span> <span class="n">ans</span>
</code></pre></div>


先看写法上的一个细节：<strong><code>left_max</code> 必须先更新再结算</strong>。
<div class="codehilite"><pre><span></span><code><span class="n">left_max</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">left_max</span><span class="p">,</span> <span class="n">height</span><span class="p">[</span><span class="n">l</span><span class="p">])</span>   <span class="c1"># ① 先更新</span>
<span class="n">ans</span> <span class="o">+=</span> <span class="n">left_max</span> <span class="o">-</span> <span class="n">height</span><span class="p">[</span><span class="n">l</span><span class="p">]</span>           <span class="c1"># ② 再结算</span>
</code></pre></div>


这个顺序让"新高"的情况自动消零：当 <code>height[l]</code> 就是新的左侧最高时，<code>left_max</code> 被更新成 <code>height[l]</code>，于是 <code>left_max - height[l] = 0</code>，<strong>不用写 <code>if</code> 特判</strong>。反过来先结算再更新，新高那格会算出<strong>负数</strong>，把总量往回扣。
<div class="algo-viz algo-viz--lc42"></div>

<hr>
<h2>四、动画怎么看</h2>

画面里是一排柱子（浅米色），<strong>接住的水画成蓝色</strong>，堆在每根柱子头顶。三个要点：
<ol>
<li><strong>左右两个游标从两端往中间走</strong>，标签在基线下方两行（<code>L</code> 绿色在上、<code>R</code> 蓝紫在下）。它们一定会越靠越近，最后一帧相遇。</li>

<hr>
<h2>六、为什么"较矮的那一端"可以立刻结算</h2>

这是全篇最核心的一节。<strong>背代码的人很多，能讲清这段的人不多 —— 而面试恰恰考这个。</strong>

先摆出困难：算法里的 <code>left_max</code> 是"<strong>到目前为止</strong>见过的最高"，不是全局的"左侧最高"。扫描还没结束，右侧是什么样我们根本不知道。那凭什么敢拿这个局部值当水位？

<strong>以 <code>height[l] &lt; height[r]</code>、结算左端为例。</strong>

第一步（容易看到的）：
<blockquote>

<code>l</code> 的右边<strong>至少有一根</strong>高度 <code>&gt;= height[r]</code> 的柱子 —— 就是 <code>r</code> 自己那根。
而 <code>height[r] &gt; height[l]</code>，所以 <code>l</code> 的右侧最高<strong>一定严格大于它自己的高度</strong>。
</blockquote>

这一步只说明"右边不会漏水"，还不够 —— 短板是 <code>min(左, 右)</code>，我们还得排除"左边比右边还高、右边才是短板"的情况。

第二步（真正的论证，用反证）：
<blockquote>

假设反过来：<code>left_max</code> <strong>超过</strong>了真正的右侧最高。
那么 <code>left_max</code> 来自 <code>[0..l]</code> 里的某根高柱 <code>k</code>。
想一想左指针<strong>经过 <code>k</code> 的那一刻</strong>：<code>height[k]</code> 比当时右边所有已扫过的柱子都高，
于是判据 <code>height[l] &lt; height[r]</code> 在那里<strong>不成立</strong>，算法会转头去结算右侧；
右侧会一路收缩，直到出现一根更高的柱子（把 <code>right_max</code> 抬到 <code>&gt; left_max</code>），或者指针相遇。
<strong>无论哪种情况，等算法真的走到 <code>l</code> 来结算时，右侧最高已经不可能低于 <code>left_max</code> 了。</strong>
</blockquote>

所以结论是：
<blockquote>

<strong>矮的那一端，它的"外侧上界"已经由对面的柱子保证了；对侧不可能是短板。</strong>
于是水位可以放心地用"已知的这一侧"来定 —— 这就是为什么双指针不需要预处理两个数组。
</blockquote>

一句话记法：<strong>谁矮结算谁，因为矮的那一侧的答案已经"单方面确定"了。</strong>
<hr>
<h2>七、换个视角：单调栈，横着切</h2>

前面三种解法都是<strong>竖着切</strong> —— 站在位置 <code>i</code> 上问"我头顶能存多少水"，一次算完一整列。

单调栈是<strong>横着切</strong>：不问每一列，而是<strong>找到一个凹槽就结算一整层</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">trap</span><span class="p">(</span><span class="n">height</span><span class="p">):</span>
    <span class="n">stack</span> <span class="o">=</span> <span class="p">[]</span>                      <span class="c1"># 存的是下标（不是值），对应高度单调递减</span>
    <span class="n">ans</span> <span class="o">=</span> <span class="mi">0</span>

    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="nb">len</span><span class="p">(</span><span class="n">height</span><span class="p">)):</span>
        <span class="k">while</span> <span class="n">stack</span> <span class="ow">and</span> <span class="n">height</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">&gt;</span> <span class="n">height</span><span class="p">[</span><span class="n">stack</span><span class="p">[</span><span class="o">-</span><span class="mi">1</span><span class="p">]]:</span>
            <span class="n">top</span> <span class="o">=</span> <span class="n">stack</span><span class="o">.</span><span class="n">pop</span><span class="p">()</span>       <span class="c1"># 槽底</span>
            <span class="k">if</span> <span class="ow">not</span> <span class="n">stack</span><span class="p">:</span>
                <span class="k">break</span>               <span class="c1"># 只有右边界、没有左边界 → 围不出凹槽</span>
            <span class="n">width</span> <span class="o">=</span> <span class="n">i</span> <span class="o">-</span> <span class="n">stack</span><span class="p">[</span><span class="o">-</span><span class="mi">1</span><span class="p">]</span> <span class="o">-</span> <span class="mi">1</span>
            <span class="n">bounded</span> <span class="o">=</span> <span class="nb">min</span><span class="p">(</span><span class="n">height</span><span class="p">[</span><span class="n">i</span><span class="p">],</span> <span class="n">height</span><span class="p">[</span><span class="n">stack</span><span class="p">[</span><span class="o">-</span><span class="mi">1</span><span class="p">]])</span> <span class="o">-</span> <span class="n">height</span><span class="p">[</span><span class="n">top</span><span class="p">]</span>
            <span class="n">ans</span> <span class="o">+=</span> <span class="n">width</span> <span class="o">*</span> <span class="n">bounded</span>
        <span class="n">stack</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">i</span><span class="p">)</span>

    <span class="k">return</span> <span class="n">ans</span>
</code></pre></div>

<div class="algo-viz algo-viz--lc42stack"></div>

<h3>7.1 它在干什么</h3>

栈里存的是<strong>还没找到右边界的、高度一路下降的那些柱子</strong>。一旦遇到一根比栈顶更高的柱子，说明凹槽的右边界出现了：
<ul>
<li><strong>栈顶</strong> = 槽底</li>
<li><strong>弹出后的新栈顶</strong> = 左边界</li>
<li><strong>当前这根</strong> = 右边界</li>
</ul>

于是这一层的水：
<div class="codehilite"><pre><span></span><code>宽 = 右边界 - 左边界 - 1
高 = min(左边界高度, 右边界高度) - 槽底高度      ← 又是木桶原理
水量 += 宽 × 高
</code></pre></div>


注意弹栈是 <code>while</code> —— 一根足够高的右边界会<strong>一口气盖住好几层</strong>。

<h3>7.3 "按层累加"最硬的证据</h3>

对比一下两个动画里<strong>下标 5 那格</strong>的水是怎么来的：
<ul>
<li><strong>双指针（竖着切）</strong>：帧 10 一次结算完 —— <code>leftMax(2) - height(0) = 2</code>，两单位一步到位。</li>
<li><strong>单调栈（横着切）</strong>：<strong>分两次加上</strong> —— <code>i = 6</code> 时加 1 层（凹槽 <code>[4,6]</code>），<code>i = 7</code> 时再加 1 层（凹槽 <code>[3,7]</code>），<code>1 + 1 = 2</code>。</li>
</ul>

<strong>同一个位置的水，竖着切是一整笔，横着切是好几笔。</strong> 这是两种视角最直观的差别，也是"单调栈为什么能工作"的最好注脚：它算的不是"这格能存多少"，而是"这一层能铺多宽"。

两个解法的复杂度都是 <code>O(n)</code>：每个下标恰好入栈一次、出栈一次。区别在空间 —— 双指针 <code>O(1)</code>，单调栈最坏 <code>O(n)</code>。
<hr>
<h2>八、进阶：LC 407 接雨水 II —— 当"左右"变成"四面八方"</h2>

三维版给你一个 <code>m × n</code> 的高度矩阵，每个格子四面都可能漏水，问总共能接多少水。
<div class="codehilite"><pre><span></span><code>输入：heightMap = [[3,3,3,3,4],[3,2,2,3,4],[3,2,1,3,4],[4,4,4,4,4]]
输出：5
</code></pre></div>

<h3>8.1 一维的公式在这里失效了</h3>

<code>min(左最高, 右最高)</code> 在二维没有直接对应物 —— 一个格子的"周围"不是一个方向，而是<strong>无数条通往边界的路径</strong>。

但把这个公式<strong>翻译</strong>一下，推广路径就自己浮现了：
<blockquote>

一维里，<code>leftMax[i]</code> 是什么？是<strong>从 <code>i</code> 往左走到边界这条路径上，最高的那根柱子</strong> —— 也就是这条路径的<strong>瓶颈</strong>。
<code>rightMax[i]</code> 同理，是"往右走"那条路径的瓶颈。

所以一维的水位 = <strong>"往左走"和"往右走"这两条路径的瓶颈，取较小者</strong>。

二维里，从格子到边界有无数条路径，水位 = <strong>所有路径瓶颈的最小值</strong>：

<code>水位(x, y) = min over 所有到边界的路径 p 的 ( max(height) along p )</code>
</blockquote>

<strong>这是图论里的"最小瓶颈路径"问题</strong> —— 而"最小化路径上的最大值"正是 Dijkstra 的一个标准变体（把"路径权值之和最小"换成"路径最大值最小"）。
<h3>8.2 多源 Dijkstra：从边界往内灌</h3>

从每个格子出发找路径太慢；反过来想 —— <strong>从边界出发</strong>。所有边界格子本身就是"已知的边界"，它们的水位就是自己的高度。把它们全部放进一个<strong>最小堆</strong>，然后不断取出<strong>水位最低</strong>的那个格子，向内扩散：
<div class="codehilite"><pre><span></span><code><span class="kn">import</span><span class="w"> </span><span class="nn">heapq</span>

<span class="k">def</span><span class="w"> </span><span class="nf">trapRainWater</span><span class="p">(</span><span class="n">heightMap</span><span class="p">):</span>
    <span class="n">m</span><span class="p">,</span> <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">heightMap</span><span class="p">),</span> <span class="nb">len</span><span class="p">(</span><span class="n">heightMap</span><span class="p">[</span><span class="mi">0</span><span class="p">])</span>
    <span class="k">if</span> <span class="n">m</span> <span class="o">&lt;</span> <span class="mi">3</span> <span class="ow">or</span> <span class="n">n</span> <span class="o">&lt;</span> <span class="mi">3</span><span class="p">:</span>
        <span class="k">return</span> <span class="mi">0</span>                       <span class="c1"># 没有内部格子</span>

    <span class="n">visited</span> <span class="o">=</span> <span class="p">[[</span><span class="kc">False</span><span class="p">]</span> <span class="o">*</span> <span class="n">n</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">m</span><span class="p">)]</span>
    <span class="n">heap</span> <span class="o">=</span> <span class="p">[]</span>
    <span class="c1"># ① 所有边界格子入堆：它们是初始的&quot;围堰&quot;，水位 = 自身高度</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">m</span><span class="p">):</span>
        <span class="k">for</span> <span class="n">j</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span><span class="p">):</span>
            <span class="k">if</span> <span class="n">i</span> <span class="o">==</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">i</span> <span class="o">==</span> <span class="n">m</span> <span class="o">-</span> <span class="mi">1</span> <span class="ow">or</span> <span class="n">j</span> <span class="o">==</span> <span class="mi">0</span> <span class="ow">or</span> <span class="n">j</span> <span class="o">==</span> <span class="n">n</span> <span class="o">-</span> <span class="mi">1</span><span class="p">:</span>
                <span class="n">visited</span><span class="p">[</span><span class="n">i</span><span class="p">][</span><span class="n">j</span><span class="p">]</span> <span class="o">=</span> <span class="kc">True</span>
                <span class="n">heapq</span><span class="o">.</span><span class="n">heappush</span><span class="p">(</span><span class="n">heap</span><span class="p">,</span> <span class="p">(</span><span class="n">heightMap</span><span class="p">[</span><span class="n">i</span><span class="p">][</span><span class="n">j</span><span class="p">],</span> <span class="n">i</span><span class="p">,</span> <span class="n">j</span><span class="p">))</span>

    <span class="n">ans</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="k">while</span> <span class="n">heap</span><span class="p">:</span>
        <span class="n">h</span><span class="p">,</span> <span class="n">x</span><span class="p">,</span> <span class="n">y</span> <span class="o">=</span> <span class="n">heapq</span><span class="o">.</span><span class="n">heappop</span><span class="p">(</span><span class="n">heap</span><span class="p">)</span>  <span class="c1"># ② 当前围堰上最矮的那根</span>
        <span class="k">for</span> <span class="n">dx</span><span class="p">,</span> <span class="n">dy</span> <span class="ow">in</span> <span class="p">((</span><span class="mi">1</span><span class="p">,</span> <span class="mi">0</span><span class="p">),</span> <span class="p">(</span><span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="mi">0</span><span class="p">),</span> <span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="mi">1</span><span class="p">),</span> <span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">)):</span>
            <span class="n">nx</span><span class="p">,</span> <span class="n">ny</span> <span class="o">=</span> <span class="n">x</span> <span class="o">+</span> <span class="n">dx</span><span class="p">,</span> <span class="n">y</span> <span class="o">+</span> <span class="n">dy</span>
            <span class="k">if</span> <span class="mi">0</span> <span class="o">&lt;=</span> <span class="n">nx</span> <span class="o">&lt;</span> <span class="n">m</span> <span class="ow">and</span> <span class="mi">0</span> <span class="o">&lt;=</span> <span class="n">ny</span> <span class="o">&lt;</span> <span class="n">n</span> <span class="ow">and</span> <span class="ow">not</span> <span class="n">visited</span><span class="p">[</span><span class="n">nx</span><span class="p">][</span><span class="n">ny</span><span class="p">]:</span>
                <span class="n">visited</span><span class="p">[</span><span class="n">nx</span><span class="p">][</span><span class="n">ny</span><span class="p">]</span> <span class="o">=</span> <span class="kc">True</span>
                <span class="k">if</span> <span class="n">heightMap</span><span class="p">[</span><span class="n">nx</span><span class="p">][</span><span class="n">ny</span><span class="p">]</span> <span class="o">&lt;</span> <span class="n">h</span><span class="p">:</span>
                    <span class="n">ans</span> <span class="o">+=</span> <span class="n">h</span> <span class="o">-</span> <span class="n">heightMap</span><span class="p">[</span><span class="n">nx</span><span class="p">][</span><span class="n">ny</span><span class="p">]</span>   <span class="c1"># ③ 矮于围堰 → 接水</span>
                <span class="c1"># ④ 新围堰高度：格子高就用它自己，矮就用水位顶上来</span>
                <span class="n">heapq</span><span class="o">.</span><span class="n">heappush</span><span class="p">(</span><span class="n">heap</span><span class="p">,</span> <span class="p">(</span><span class="nb">max</span><span class="p">(</span><span class="n">heightMap</span><span class="p">[</span><span class="n">nx</span><span class="p">][</span><span class="n">ny</span><span class="p">],</span> <span class="n">h</span><span class="p">),</span> <span class="n">nx</span><span class="p">,</span> <span class="n">ny</span><span class="p">))</span>

    <span class="k">return</span> <span class="n">ans</span>
</code></pre></div>


三个关键点：

<strong>为什么取堆顶（水位最低）就能保证正确？</strong> 这和一维双指针的论证<strong>同构</strong>：当处理围堰上最矮的那根 <code>h</code> 时，任何还没访问的格子，它到边界的任何路径都必须经过当前围堰 —— 而围堰上最矮的就是 <code>h</code>，所以它的水位<strong>至少</strong>是 <code>h</code>；又因为堆保证 <code>h</code> 是当前可能的最小瓶颈，所以水位<strong>恰好</strong>是 <code>h</code>。<strong>这就是 Dijkstra 的贪心正确性，一字不差地搬了过来。</strong>

<strong>入堆的为什么是 <code>max(自身高度, 当前水位)</code>？</strong> 因为一个格子被水淹后，它对<strong>更内部的格子</strong>而言就不再是"高度 <code>height[x][y]</code> 的柱子"，而是"高度为水位的围堰"。这行代码是整个算法最容易写错的地方。

<strong>为什么入堆时就标记 <code>visited</code>（而不是出堆时）？</strong> 因为第一次入堆时的水位就是最终水位（堆的单调性保证），后到的路径只会更高。<strong>这和一维的"left_max 先更新再结算"是同一个道理</strong>：第一次就是最优，之后不用再看。

复杂度：每个格子入堆出堆各一次，堆操作 <code>O(log(mn))</code> —— 总计 <code>O(mn·log(mn))</code>，空间 <code>O(mn)</code>。

<h3>常见坑</h3>

<strong>坑 1：<code>left_max</code> 先结算再更新</strong>

新高那格会算出<strong>负数</strong>，把总量往回扣。正确顺序永远是"先更新、再结算"，让新高自动消零。

<strong>坑 2：双指针的判据写反</strong>

<code>height[l] &lt; height[r]</code> 时结算<strong>左</strong>端。写反的话，你会去结算较高的一端 —— 而那一端的外侧上界还没确定，答案会<strong>偏大</strong>（把不该存的水也算进去了）。这类 bug 官方样例<strong>测不出来</strong>：<code>[0,1,0,2,1,0,1,3,2,1,2,1]</code> 两端恰好相差 <code>1</code>，两种判据都能得到 <code>6</code>。要测就用 <code>[5,0,1]</code>（正确 <code>1</code>，判据写反会得 <code>4</code>）或 <code>[4,0,0,0,3]</code>（正确 <code>9</code>，写反会得 <code>12</code>）。

<strong>坑 3：单调栈弹栈后不检查栈空</strong>
<div class="codehilite"><pre><span></span><code><span class="n">top</span> <span class="o">=</span> <span class="n">stack</span><span class="o">.</span><span class="n">pop</span><span class="p">()</span>
<span class="k">if</span> <span class="ow">not</span> <span class="n">stack</span><span class="p">:</span>
    <span class="k">break</span>          <span class="c1"># ← 漏掉这行，下面 stack[-1] 会越界</span>
</code></pre></div>


弹出后栈空说明<strong>只有右边界</strong>（弹出的就是当前最左的柱子），左边没有墙，围不出凹槽。

<strong>坑 4：单调栈的栈存了"值"而不是"下标"</strong>

宽度公式 <code>i - stack[-1] - 1</code> 需要的是<strong>下标</strong>。存值的话宽度算不出来，只能另开一个平行数组记下标，反而更绕。

<strong>坑 5：三维版入堆时忘了 <code>max(自身高度, 水位)</code></strong>

直接入堆 <code>heightMap[nx][ny]</code> 的话，一个被水淹过的洼地会以"干地"的身份参与后续围堰，内部的水位会被低估。<strong>一格被淹之后，它对更内部的格子而言就是"水位那么高的墙"。</strong>

<strong>坑 6：三维版忘了处理 <code>m &lt; 3</code> 或 <code>n &lt; 3</code></strong>

行数或列数不足 <code>3</code> 时<strong>没有内部格子</strong>，直接返回 <code>0</code>。不写这个守卫，边界初始化的循环会照常跑，虽然大多数时候答案恰好也是 <code>0</code>，但逻辑上是在"用没有内部格子的流程接水"，纯属侥幸。
<hr>
<h2>十二、面试怎么答</h2>

接雨水是"三种解法层层递进"的标准素材，建议的答法顺序：
<ol>
<li>

<strong>先给核心公式</strong>："<code>water[i] = max(0, min(左最高, 右最高) - height[i])</code>，木桶原理。整道题只是在问'每个位置的两侧最高是多少'。"
</li>
<li>

<strong>说暴力与 DP</strong>："暴力每个位置扫两边，<code>O(n²)</code>；发现'往左扫'可以复用，就预处理两个数组，<code>O(n)</code> 时间 <code>O(n)</code> 空间。"
</li>
<li>

<strong>引出双指针并讲清论证</strong>（这段是分水岭）："双指针把预处理变成边走边算，关键在<strong>为什么敢用局部最大值结算</strong> —— 因为较矮的那一端，它的外侧上界已经由对面的柱子保证了；对侧不可能是短板。反证：如果左侧那根高柱真是更高的那个，它当年经过时判据就不会选它，右侧会被一路收缩到出现更高的柱子为止。"
</li>
<li>

<strong>主动补单调栈</strong>："还有一个横着切的视角：栈里维护高度递减的下标，遇到更高的柱子就结算一层。它和双指针的答案一致，但同一个位置的水会被<strong>分几次</strong>加上 —— 这是两种视角最直观的差别。"
</li>
<li>

<strong>如果面试官追问三维版</strong>："把 <code>min(左最高, 右最高)</code> 翻译成'两条路径瓶颈取 min'，二维就是'所有路径瓶颈取 min' —— 最小瓶颈路径，多源 Dijkstra，从边界入最小堆，每次取水位最低的向外扩散。复杂度 <code>O(mn·log(mn))</code>。"
</li>
</ol>
<hr>
<h2>结语</h2>

接雨水这道题最迷人的地方，是它把"一个问题"换了好几副面孔：
<ul>
<li>暴力和 DP 说：<strong>把每个位置的两侧最高都算出来</strong>。</li>
<li>双指针说：<strong>不需要全部算出来，只算"已经确定的那一半"</strong>。</li>
<li>单调栈说：<strong>别按列算了，按层填</strong> —— 同一格的水可以分几次到账。</li>
<li>而三维版说：<strong>"左右最高"本来就只是"路径瓶颈"的特例</strong>，把两个方向推广到所有方向，接雨水就变成了 Dijkstra。</li>
</ul>

四副面孔背后是同一个木桶原理：<strong>水停在短板上</strong>。一维的短板是两根柱子里较矮的，二维的短板是所有路径里最平缓的那条。

最后自测一下 —— 特别是用<strong>示例 2</strong>，因为它的水更深、更容易暴露判据写反的 bug：
<div class="codehilite"><pre><span></span><code><span class="k">assert</span> <span class="n">trap</span><span class="p">([</span><span class="mi">0</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">1</span><span class="p">])</span> <span class="o">==</span> <span class="mi">6</span>   <span class="c1"># 官方例 1</span>
<span class="k">assert</span> <span class="n">trap</span><span class="p">([</span><span class="mi">4</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">5</span><span class="p">])</span> <span class="o">==</span> <span class="mi">9</span>                      <span class="c1"># 官方例 2</span>
<span class="k">assert</span> <span class="n">trap</span><span class="p">([</span><span class="mi">5</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">1</span><span class="p">])</span> <span class="o">==</span> <span class="mi">1</span>                                <span class="c1"># 判据写反会得 4</span>
<span class="k">assert</span> <span class="n">trap</span><span class="p">([</span><span class="mi">4</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">3</span><span class="p">])</span> <span class="o">==</span> <span class="mi">9</span>                          <span class="c1"># 判据写反会得 12</span>
<span class="k">assert</span> <span class="n">trap</span><span class="p">([</span><span class="mi">2</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">2</span><span class="p">])</span> <span class="o">==</span> <span class="mi">2</span>                                <span class="c1"># 最小的凹槽</span>
</code></pre></div>


这几行比跑十遍官方样例有用。</div></div></noscript>
