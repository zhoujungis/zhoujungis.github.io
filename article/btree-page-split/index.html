<h2>前言：慢查询是表，页分裂是里</h2>

之前那篇《慢查询实战》讲的是<strong>表</strong>：看到扫描行数爆炸、看到临时表、看到回表次数，然后改写 SQL、加覆盖索引、调改写阈值。但有几个常见现象，只有钻到存储引擎的页里才能真正解释：
<ul>
<li>为什么<strong>顺序主键</strong>建出来的索引紧凑，随机 UUID 建出来的索引碎片多、页数多？</li>
<li>为什么大量插入后表空间文件涨得比数据本身多？那些多出来的页是哪来的？</li>
<li>索引页为什么会有「填充率」一说，教科书上写的一半满，在源码里真的存在吗？</li>
<li>「树高 +1」听起来是全局大事，它到底是一次性大动作还是一步步涨上去的？</li>
</ul>

答案全部收敛到同一个机制：<strong>页分裂</strong>（page split）。B+ 树的每个节点是一整页，页满了就必须撕成两半、把多出来的一半挂到父节点上；父节点因此可能再分裂，一路递归到根，根分裂则整棵树长高一层。

本文把两套工业级实现的分裂路径并排放着读：<strong>SQLite</strong>（单文件、教科书级清晰的 <code>balance</code> 系列函数）与 <strong>InnoDB</strong>（生产级、有并发与表空间管理的 <code>btr_page_split_and_insert</code>）。两边的页格式天差地别，但手术流程惊人地一致：<strong>检查 → 选点 → 分配 → 改结构 → 搬记录 → 递归向上</strong>。

与 WAL 篇一样，全部结论回源码取证；取证不到的（比如「50% 填充率」这句流行说法）会如实标注为源码不存在，并给出实际机制。
<h2>先看案发现场：一页到底长什么样</h2>

分裂是把一页变成两页，所以第一件事是弄清单页的构造。教科书说「节点里有 n 个键和 n+1 个指针」，但源码里的真实布局比这有趣得多——<strong>键和指针并不相邻存放</strong>。
<h2>SQLite 的页：8 字节头与相向而生的两个数组</h2>

SQLite 官方文件格式注释（<code>src/btreeInt.h</code>）画得很直白：
<div class="codehilite"><pre><span></span><code>**      |----------------|
**      | file header    |   100 bytes.  Page 1 only.
**      |----------------|
**      | page header    |   8 bytes for leaves.  12 bytes for interior nodes
**      |----------------|
**      | cell pointer   |   |  2 bytes per cell.  Sorted order.
**      | array          |   |  Grows downward
**      |                |   v
**      |----------------|
**      | unallocated    |
**      | space          |
**      |----------------|   ^  Grows upwards
**      | cell content   |   |  Arbitrary order interspersed with freeblocks.
**      | area           |   |  and free space fragments.
**      |----------------|
</code></pre></div>


一页从上往下是「页头 → cell 指针数组（向低地址长）」，从下往上是「cell 内容区（向高地址长）」，两边<strong>相向而生，中间是未分配空隙</strong>。这个「相向生长」的结构是后面一切空间计算的几何基础：指针数组尾部到内容区起点的距离，就是这一页还能装多少东西的唯一真相。

页头字段表同样在 <code>btreeInt.h</code>：
<div class="codehilite"><pre><span></span><code>**   OFFSET   SIZE     DESCRIPTION
**      0       1      Flags. 1: intkey, 2: zerodata, 4: leafdata, 8: leaf
**      1       2      byte offset to the first freeblock
**      3       2      number of cells on this page
**      5       2      first byte of the cell content area
**      7       1      number of fragmented free bytes
**      8       4      Right child (the Ptr(N) value).  Omitted on leaves.
</code></pre></div>


叶子页 8 字节头，内部页多一个 4 字节右孩子指针共 12 字节。读页时 <code>btreeInitPage()</code> 把这些字段翻进内存结构：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">cellOffset</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">u16</span><span class="p">)(</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">hdrOffset</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">8</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">childPtrSize</span><span class="p">);</span>
<span class="w">  </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aCellIdx</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">data</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">childPtrSize</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">8</span><span class="p">;</span>
<span class="w">  </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aDataEnd</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aData</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">pBt</span><span class="o">-&gt;</span><span class="n">pageSize</span><span class="p">;</span>
<span class="w">  </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aDataOfst</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aData</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">childPtrSize</span><span class="p">;</span>
<span class="w">  </span><span class="cm">/* EVIDENCE-OF: R-37002-32774 The two-byte integer at offset 3 gives the</span>
<span class="cm">  ** number of cells on the page. */</span>
<span class="w">  </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nCell</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">get2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="mi">3</span><span class="p">]);</span>
</code></pre></div>


注意此时页内容<strong>一个字节都没读</strong>——只有页头进入内存。cell 何时真正解码，要等到查找或插入真的踩到它。
<h2>InnoDB 的页：38 字节 FIL 头、哨兵记录与 slot 目录</h2>

InnoDB 的一页要厚重得多：默认 16 KB（<code>UNIV_PAGE_SIZE_SHIFT_DEF = 14</code>，<code>include/univ.i</code>），开头是 38 字节 FIL 文件头（页号、校验和、页类型、LSN……），然后才是索引页头：
<div class="codehilite"><pre><span></span><code><span class="cm">/** index page header starts at this offset */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_HEADER</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">FSEG_PAGE_DATA</span><span class="p">;</span>

<span class="cm">/*-----------------------------*/</span>
<span class="cm">/** number of slots in page directory */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_N_DIR_SLOTS</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="cm">/** pointer to record heap top */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_HEAP_TOP</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">2</span><span class="p">;</span>
<span class="cm">/** number of records in the heap, bit 15=flag: new-style compact page format */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_N_HEAP</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">4</span><span class="p">;</span>
<span class="cm">/** pointer to start of page free record list */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_FREE</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">6</span><span class="p">;</span>
<span class="cm">/** number of bytes in deleted records */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_GARBAGE</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">8</span><span class="p">;</span>
</code></pre></div>


（<code>include/page0types.h</code>。）字段继续往下：<code>PAGE_N_RECS = 16</code> 用户记录数、<code>PAGE_LEVEL = 26</code> 节点层高（叶子是 0）、<code>PAGE_INDEX_ID = 28</code>。用户记录的起点是：
<div class="codehilite"><pre><span></span><code><span class="cm">/** start of data on the page */</span>
<span class="k">constexpr</span><span class="w"> </span><span class="kt">uint32_t</span><span class="w"> </span><span class="n">PAGE_DATA</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">PAGE_HEADER</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">36</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">FSEG_HEADER_SIZE</span><span class="p">;</span>
</code></pre></div>


38（FIL）+ 36（字段区）+ 20（两个 10 字节段头，只在根页用）= <strong>94</strong>。也就是说 InnoDB 一页的前 94 字节与用户数据无关，页尾还有 8 字节的目录收尾区（<code>FIL_PAGE_DATA_END</code>）。真正干活的记录堆从 94 开始，而堆的最前面固定钉着两条 13 字节的哨兵：
<div class="codehilite"><pre><span></span><code><span class="k">static</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">byte</span><span class="w"> </span><span class="n">infimum_supremum_compact</span><span class="p">[]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* the infimum record */</span>
<span class="w">    </span><span class="mh">0x01</span><span class="w"> </span><span class="cm">/*n_owned=1*/</span><span class="p">,</span><span class="w"> </span><span class="mh">0x00</span><span class="p">,</span><span class="w"> </span><span class="mh">0x02</span><span class="w"> </span><span class="cm">/* heap_no=0, REC_STATUS_INFIMUM */</span><span class="p">,</span><span class="w"> </span><span class="mh">0x00</span><span class="p">,</span>
<span class="w">    </span><span class="mh">0x0d</span><span class="w"> </span><span class="cm">/* pointer to supremum */</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;i&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;n&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;f&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;i&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;m&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;u&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;m&#39;</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="w">    </span><span class="cm">/* the supremum record */</span>
<span class="w">    </span><span class="mh">0x01</span><span class="w"> </span><span class="cm">/*n_owned=1*/</span><span class="p">,</span><span class="w"> </span><span class="mh">0x00</span><span class="p">,</span><span class="w"> </span><span class="mh">0x0b</span><span class="w"> </span><span class="cm">/* heap_no=1, REC_STATUS_SUPREMUM */</span><span class="p">,</span><span class="w"> </span><span class="mh">0x00</span><span class="p">,</span>
<span class="w">    </span><span class="mh">0x00</span><span class="w"> </span><span class="cm">/* end of record list */</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;s&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;u&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;p&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;r&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;e&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;m&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;u&#39;</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;m&#39;</span><span class="p">};</span>
</code></pre></div>


<code>page_create_low()</code> 初始化空页时把这 30 字节 <code>memcpy</code> 到 <code>PAGE_DATA</code>。infimum 是记录链的头、supremum 是尾，<strong>每一条记录的「下一条」都能顺藤摸瓜走到头</strong>——这个设计在分裂搬记录时会反复出现：搬一半记录，本质是把一条单链从中间剪断再接两条。

记录头的位布局（<code>include/rem0rec.ic</code> 的注释）值得逐字看一眼，它是「单链 + 目录」两条索引并存的证据：
<div class="codehilite"><pre><span></span><code><span class="w">        </span><span class="p">(</span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="n">byte</span><span class="w"> </span><span class="n">offset</span><span class="w">         </span><span class="p">(</span><span class="mi">2</span><span class="p">)</span><span class="w"> </span><span class="n">bit</span><span class="w"> </span><span class="n">usage</span><span class="w"> </span><span class="kr">within</span><span class="w"> </span><span class="n">byte</span>
<span class="w">        </span><span class="n">downward</span><span class="w"> </span><span class="n">from</span>
<span class="w">        </span><span class="n">origin</span><span class="w"> </span><span class="o">-&gt;</span><span class="w">       </span><span class="mi">1</span><span class="w">       </span><span class="mi">8</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">relative</span><span class="w"> </span><span class="n">offset</span><span class="w"> </span><span class="kr">of</span><span class="w"> </span><span class="n">next</span><span class="w"> </span><span class="kd">record</span>
<span class="w">                        </span><span class="mi">2</span><span class="w">       </span><span class="mi">8</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">relative</span><span class="w"> </span><span class="n">offset</span><span class="w"> </span><span class="kr">of</span><span class="w"> </span><span class="n">next</span><span class="w"> </span><span class="kd">record</span>
<span class="w">                                  </span><span class="n">the</span><span class="w"> </span><span class="n">relative</span><span class="w"> </span><span class="n">offset</span><span class="w"> </span><span class="n">is</span><span class="w"> </span><span class="n">an</span><span class="w"> </span><span class="kt">unsigned</span><span class="w"> </span><span class="mi">16</span><span class="o">-</span><span class="n">bit</span>
<span class="w">                                  </span><span class="n">integer</span><span class="o">:</span>
<span class="w">                                  </span><span class="p">(</span><span class="n">offset_of_next_record</span>
<span class="w">                                   </span><span class="o">-</span><span class="w"> </span><span class="n">offset_of_this_record</span><span class="p">)</span><span class="w"> </span><span class="n">mod</span><span class="w"> </span><span class="mi">64</span><span class="n">Ki</span><span class="p">,</span>
<span class="w">                        </span><span class="mi">3</span><span class="w">       </span><span class="mi">3</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">status</span><span class="o">:</span>
<span class="w">                                        </span><span class="mo">000</span><span class="o">=</span><span class="n">conventional</span><span class="w"> </span><span class="kd">record</span>
<span class="w">                                        </span><span class="mo">001</span><span class="o">=</span><span class="n">node</span><span class="w"> </span><span class="n">pointer</span><span class="w"> </span><span class="kd">record </span><span class="p">(</span><span class="n">inside</span><span class="w"> </span><span class="n">B</span><span class="o">-</span><span class="n">tree</span><span class="p">)</span>
<span class="w">                                        </span><span class="mo">010</span><span class="o">=</span><span class="n">infimum</span><span class="w"> </span><span class="kd">record</span>
<span class="w">                                        </span><span class="mo">011</span><span class="o">=</span><span class="n">supremum</span><span class="w"> </span><span class="kd">record</span>
<span class="w">                                </span><span class="mi">5</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">heap</span><span class="w"> </span><span class="n">number</span>
<span class="w">                        </span><span class="mi">4</span><span class="w">       </span><span class="mi">8</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">heap</span><span class="w"> </span><span class="n">number</span>
<span class="w">                        </span><span class="mi">5</span><span class="w">       </span><span class="mi">4</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">n_owned</span>
<span class="w">                                </span><span class="mi">4</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="n">info</span><span class="w"> </span><span class="n">bits</span>
</code></pre></div>


每条记录原点之前 5 字节头，第 1~2 字节存的是<strong>相对偏移</strong>（无符号、mod 64Ki），所以记录在页内可以乱序存放而链不乱——<code>page_get_middle_rec</code> 按序号跳到中点、<code>page_move_rec_list_*</code> 剪断重接，靠的都是这 2 字节。<code>n_owned</code> 则配合页尾目录：每 4~8 条记录分摊一个 slot，二分查找时先在页尾 slot 上走、再顺链微调。

两种布局的对照到这里已经可以立住了：
<div class="table-scroll"><table>
<thead>
<tr>
<th></th>
<th>SQLite</th>
<th>InnoDB</th>
</tr>
</thead>
<tbody>
<tr>
<td>页头</td>
<td>8 / 12 字节</td>
<td>FIL 38 字节 + 字段区 36 字节 + 段头 20 字节</td>
</tr>
<tr>
<td>记录寻址</td>
<td>2 字节 cell 指针数组（排序，直接寻址）</td>
<td>记录头 2 字节相对偏移单链 + 页尾 slot 目录</td>
</tr>
<tr>
<td>页尾</td>
<td>无</td>
<td>8 字节目录区，slot 2 字节/个</td>
</tr>
<tr>
<td>「下一条」</td>
<td>无（数组天然有序）</td>
<td>相对偏移 mod 64Ki</td>
</tr>
</tbody>
</table></div>

<strong>数组寻址快但插入要 memmove，链式插入 O(1) 但查找要走链</strong>——分裂时两者的代价结构正好反过来：SQLite 要搬指针也要搬内容，InnoDB 主要是把链剪断重接。
<h2>插入前的三道检查：放不下是怎样被发现的</h2>

「页满了」不是一个瞬间，而是三道依次收紧的检查。SQLite 这边，第一道在 <code>insertCell()</code>：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nOverflow</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">sz</span><span class="o">+</span><span class="mi">2</span><span class="o">&gt;</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nFree</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pTemp</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="n">memcpy</span><span class="p">(</span><span class="n">pTemp</span><span class="p">,</span><span class="w"> </span><span class="n">pCell</span><span class="p">,</span><span class="w"> </span><span class="n">sz</span><span class="p">);</span>
<span class="w">      </span><span class="n">pCell</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pTemp</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">put4byte</span><span class="p">(</span><span class="n">pCell</span><span class="p">,</span><span class="w"> </span><span class="n">iChild</span><span class="p">);</span>
<span class="w">    </span><span class="n">j</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nOverflow</span><span class="o">++</span><span class="p">;</span>
<span class="w">    </span><span class="cm">/* Comparison against ArraySize-1 since we hold back one extra slot</span>
<span class="cm">    ** as a contingency.  In other words, never need more than 3 overflow</span>
<span class="cm">    ** slots but 4 are allocated, just to be safe. */</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">ArraySize</span><span class="p">(</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">apOvfl</span><span class="p">)</span><span class="mi">-1</span><span class="w"> </span><span class="p">);</span>
<span class="w">    </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">apOvfl</span><span class="p">[</span><span class="n">j</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pCell</span><span class="p">;</span>
<span class="w">    </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aiOvfl</span><span class="p">[</span><span class="n">j</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">u16</span><span class="p">)</span><span class="n">i</span><span class="p">;</span>
</code></pre></div>


新 cell 需要 <code>sz+2</code> 字节（内容 + 2 字节指针），超过本页空闲 <code>nFree</code> 就<strong>不落页</strong>，挂进进程内的 overflow 槽（最多用 3 个、分配 4 个）。注意此时磁盘上的页毫发无损——溢出是内存里的账，等 <code>balance()</code> 来清算。这是个重要的设计：<strong>分裂的决策可以攒着，不必每插一条就重排一次</strong>。

第二道在 <code>allocateSpace()</code>，处理「未分配空隙不够但页里其实有空洞」的情况：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* The request could not be fulfilled using a freelist slot.  Check</span>
<span class="cm">  ** to see if defragmentation is necessary.</span>
<span class="cm">  */</span>
<span class="w">  </span><span class="n">testcase</span><span class="p">(</span><span class="w"> </span><span class="n">gap</span><span class="o">+</span><span class="mi">2</span><span class="o">+</span><span class="n">nByte</span><span class="o">==</span><span class="n">top</span><span class="w"> </span><span class="p">);</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">gap</span><span class="o">+</span><span class="mi">2</span><span class="o">+</span><span class="n">nByte</span><span class="o">&gt;</span><span class="n">top</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nCell</span><span class="o">&gt;</span><span class="mi">0</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">CORRUPT_DB</span><span class="w"> </span><span class="p">);</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nFree</span><span class="o">&gt;=</span><span class="mi">0</span><span class="w"> </span><span class="p">);</span>
<span class="w">    </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">defragmentPage</span><span class="p">(</span><span class="n">pPage</span><span class="p">,</span><span class="w"> </span><span class="n">MIN</span><span class="p">(</span><span class="mi">4</span><span class="p">,</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nFree</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="p">(</span><span class="mi">2</span><span class="o">+</span><span class="n">nByte</span><span class="p">)));</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="w"> </span><span class="p">)</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="n">rc</span><span class="p">;</span>
<span class="w">    </span><span class="n">top</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">get2byteNotZero</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">5</span><span class="p">]);</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">gap</span><span class="o">+</span><span class="mi">2</span><span class="o">+</span><span class="n">nByte</span><span class="o">&lt;=</span><span class="n">top</span><span class="w"> </span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


「指针数组尾部到内容区起点」的空隙装不下时，先调 <code>defragmentPage</code> 把散落的 cell 挤紧再试——<strong>能整理就不分裂</strong>。整理后还放不下，才回到第一道走 overflow。

第三道是删除路径的边界检查 <code>dropCell()</code>，顺带展示了这个几何结构的腐败检测：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">pc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">get2byte</span><span class="p">(</span><span class="n">ptr</span><span class="p">);</span>
<span class="w">  </span><span class="n">hdr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">hdrOffset</span><span class="p">;</span>
<span class="w">  </span><span class="n">testcase</span><span class="p">(</span><span class="w"> </span><span class="n">pc</span><span class="o">==</span><span class="p">(</span><span class="n">u32</span><span class="p">)</span><span class="n">get2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">5</span><span class="p">])</span><span class="w"> </span><span class="p">);</span>
<span class="w">  </span><span class="n">testcase</span><span class="p">(</span><span class="w"> </span><span class="n">pc</span><span class="o">+</span><span class="n">sz</span><span class="o">==</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">pBt</span><span class="o">-&gt;</span><span class="n">usableSize</span><span class="w"> </span><span class="p">);</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pc</span><span class="o">+</span><span class="n">sz</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">pBt</span><span class="o">-&gt;</span><span class="n">usableSize</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="o">*</span><span class="n">pRC</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">SQLITE_CORRUPT_BKPT</span><span class="p">;</span>
<span class="w">    </span><span class="k">return</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
<span class="w">  </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">freeSpace</span><span class="p">(</span><span class="n">pPage</span><span class="p">,</span><span class="w"> </span><span class="n">pc</span><span class="p">,</span><span class="w"> </span><span class="n">sz</span><span class="p">);</span>
</code></pre></div>


「偏移 + 长度」越出可用页尾即判库损坏——数组结构的每一条边界都是可计算的，算不出来就是坏的。

InnoDB 的对应路径分乐观与悲观两级。乐观插入 <code>btr_cur_optimistic_insert()</code>（<code>btr/btr0cur.cc</code>）先算容量：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">ulint</span><span class="w"> </span><span class="n">max_size</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">page_get_max_insert_size_after_reorganize</span><span class="p">(</span><span class="n">page</span><span class="p">,</span><span class="w"> </span><span class="mi">1</span><span class="p">);</span>

<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">page_has_garbage</span><span class="p">(</span><span class="n">page</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">((</span><span class="n">max_size</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">rec_size</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">max_size</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">BTR_CUR_PAGE_REORGANIZE_LIMIT</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span>
<span class="w">        </span><span class="n">page_get_n_recs</span><span class="p">(</span><span class="n">page</span><span class="p">)</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="o">&amp;&amp;</span>
<span class="w">        </span><span class="n">page_get_max_insert_size</span><span class="p">(</span><span class="n">page</span><span class="p">,</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">rec_size</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="k">goto</span><span class="w"> </span><span class="n">fail</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">max_size</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">rec_size</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">goto</span><span class="w"> </span><span class="n">fail</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


<code>fail:</code> 标签给 <code>err = DB_FAIL</code>。判据同样是两级：<strong>重组后能不能放下</strong>（<code>max_insert_size_after_reorganize</code>，先假设整理过）与<strong>原样能不能放下</strong>（<code>max_insert_size</code>）——与 SQLite 的「先 defragment 再说」如出一辙。配套宏说明重组的门槛：
<div class="codehilite"><pre><span></span><code><span class="cm">/** In the optimistic insert, if the insert does not fit, but this much space</span>
<span class="cm">can be released by page reorganize, then it is reorganized */</span>
<span class="cp">#define BTR_CUR_PAGE_REORGANIZE_LIMIT (UNIV_PAGE_SIZE / 32)</span>
</code></pre></div>


16 KB 的 1/32 = 512 字节：空洞超过 512 字节就值得重组一次。

<code>DB_FAIL</code> 之后进入悲观路径 <code>btr_cur_pessimistic_insert()</code>，在这里分裂被正式分流——<strong>根页与普通页是两条路</strong>：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">dict_index_get_page</span><span class="p">(</span><span class="n">index</span><span class="p">)</span><span class="w"> </span><span class="o">==</span>
<span class="w">      </span><span class="n">btr_cur_get_block</span><span class="p">(</span><span class="n">cursor</span><span class="p">)</span><span class="o">-&gt;</span><span class="n">page</span><span class="p">.</span><span class="n">id</span><span class="p">.</span><span class="n">page_no</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* The page is the root page */</span>
<span class="w">    </span><span class="o">*</span><span class="n">rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_root_raise_and_insert</span><span class="p">(</span><span class="n">flags</span><span class="p">,</span><span class="w"> </span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">entry</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="o">*</span><span class="n">rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_split_and_insert</span><span class="p">(</span><span class="n">flags</span><span class="p">,</span><span class="w"> </span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">entry</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span>

<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!*</span><span class="n">rec</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">DB_OUT_OF_FILE_SPACE</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


最底层的「放不下」则由 <code>page_mem_alloc_heap()</code> 的返回值宣判（<code>page/page0page.cc</code>）：堆顶加 <code>need</code> 超过可用空间就 <code>return (nullptr)</code>。三道检查、两级路径、一个失败出口——放不下是怎样被一层层发现的，链路完整了。
<h2>什么时候值得动手术：重组阈值与「50% 填充」的真相</h2>

SQLite 把「要不要动手术」浓缩成 <code>balance()</code> 入口的一个算式：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">NEVER</span><span class="p">(</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nFree</span><span class="o">&lt;</span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">btreeComputeFreeSpace</span><span class="p">(</span><span class="n">pPage</span><span class="p">)</span><span class="w"> </span><span class="p">)</span><span class="w"> </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nOverflow</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nFree</span><span class="o">*</span><span class="mi">3</span><span class="o">&lt;=</span><span class="p">(</span><span class="kt">int</span><span class="p">)</span><span class="n">pCur</span><span class="o">-&gt;</span><span class="n">pBt</span><span class="o">-&gt;</span><span class="n">usableSize</span><span class="o">*</span><span class="mi">2</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="cm">/* No rebalance required as long as:</span>
<span class="cm">      **   (1) There are no overflow cells</span>
<span class="cm">      **   (2) The amount of free space on the page is less than 2/3rds of</span>
<span class="cm">      **       the total usable space on the page. */</span>
<span class="w">      </span><span class="k">break</span><span class="p">;</span>
</code></pre></div>


两条同时满足就不重排：<strong>没有溢出 cell，且空闲空间不超过可用区的 2/3</strong>。注意这是重排的<strong>下</strong>界——页得空到 1/3 以下才值得动，而不是满了才动。攒一批 overflow 一起处理，均摊了每次分裂的固定开销。

现在说那句流行的话：「B+ 树页分裂后每页约 50% 填充」。<strong>InnoDB 源码里没有 "50%" 这个字面量</strong>（已 grep 确认），实际机制是按记录条数取中点（<code>include/page0page.ic</code>）：
<div class="codehilite"><pre><span></span><code><span class="cm">/** Returns the middle record of the records on the page. If there is an</span>
<span class="cm"> even number of records in the list, returns the first record of the</span>
<span class="cm"> upper half-list.</span>
<span class="cm"> @return middle record */</span>
<span class="k">static</span><span class="w"> </span><span class="kr">inline</span><span class="w"> </span><span class="n">rec_t</span><span class="w"> </span><span class="o">*</span><span class="nf">page_get_middle_rec</span><span class="p">(</span><span class="n">page_t</span><span class="w"> </span><span class="o">*</span><span class="n">page</span><span class="p">)</span><span class="w"> </span><span class="cm">/*!&lt; in: page */</span>
<span class="p">{</span>
<span class="w">  </span><span class="n">ulint</span><span class="w"> </span><span class="n">middle</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">page_get_n_recs</span><span class="p">(</span><span class="n">page</span><span class="p">)</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">PAGE_HEAP_NO_USER_LOW</span><span class="p">)</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="mi">2</span><span class="p">;</span>

<span class="w">  </span><span class="k">return</span><span class="w"> </span><span class="p">(</span><span class="n">page_rec_get_nth</span><span class="p">(</span><span class="n">page</span><span class="p">,</span><span class="w"> </span><span class="n">middle</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


<code>(n_recs + 2) / 2</code>——按<strong>条数</strong>取中点，不是按字节数。一条 100 字节的记录和一条 800 字节的记录各算一票，所以分裂后的两半字节数经常明显不等；再加上左右倾斜的启发式（下文第五节），「一半满」只是条数意义的近似。教科书的 50% 是对<strong>条数</strong>说的，也是对<strong>均匀记录</strong>假设下对字节说的——这句话的严谨版本是：<strong>中点按条数切，字节分布看记录大小的运气</strong>。

而 SQLite 连中点都不保证：它的配平目标写在 <code>balance_nonroot()</code> 的注释里，是「若干页装下全部 cell、每页都不超 <code>usableSpace</code>」的装箱问题，允许结果是 2 页、3 页甚至更多，每页的填充率由 cell 大小的组合决定。
<h2>SQLite 的手术室：balance_nonroot 的配平账本</h2>

<code>balance()</code> 是入口，注释列出它调度的三个子程序——<code>balance_quick()</code>（快路径，一分为二）、<code>balance_deeper()</code>（长高）、<code>balance_nonroot()</code>（通用配平）。真正的重分配在 <code>balance_nonroot()</code>，第一件事是记账：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/*</span>
<span class="cm">  ** Figure out the number of pages needed to hold all b.nCell cells.</span>
<span class="cm">  ** Store this number in &quot;k&quot;.  Also compute szNew[] which is the total</span>
<span class="cm">  ** size of all cells on the i-th page and cntNew[] which is the index</span>
<span class="cm">  ** in b.apCell[] of the cell that divides page i from page i+1. </span>
<span class="cm">  ** cntNew[k] should equal b.nCell.</span>
<span class="cm">  **</span>
<span class="cm">  ** Values computed by this block:</span>
<span class="cm">  **</span>
<span class="cm">  **           k: The total number of sibling pages</span>
<span class="cm">  **    szNew[i]: Spaced used on the i-th sibling page.</span>
<span class="cm">  **   cntNew[i]: Index in b.apCell[] and b.szCell[] for the first cell to</span>
<span class="cm">  **              the right of the i-th sibling page.</span>
<span class="cm">  ** usableSpace: Number of bytes of space available on each sibling.</span>
<span class="cm">  **</span>
<span class="cm">  */</span>
</code></pre></div>


先取出本页与左右兄弟页的<strong>全部 cell 摊平</strong>，然后回答三个问题：装完需要几页（<code>k</code>）、每页占多少字节（<code>szNew[]</code>）、每一刀切在哪（<code>cntNew[]</code>）。接着是配平循环：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">k</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">nOld</span><span class="p">;</span>
<span class="w">  </span><span class="k">for</span><span class="p">(</span><span class="n">i</span><span class="o">=</span><span class="mi">0</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">&lt;</span><span class="n">k</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">){</span>
<span class="w">    </span><span class="kt">int</span><span class="w"> </span><span class="n">sz</span><span class="p">;</span>
<span class="w">    </span><span class="k">while</span><span class="p">(</span><span class="w"> </span><span class="n">szNew</span><span class="p">[</span><span class="n">i</span><span class="p">]</span><span class="o">&gt;</span><span class="n">usableSpace</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">i</span><span class="o">+</span><span class="mi">1</span><span class="o">&gt;=</span><span class="n">k</span><span class="w"> </span><span class="p">){</span>
<span class="w">        </span><span class="n">k</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">i</span><span class="o">+</span><span class="mi">2</span><span class="p">;</span>
<span class="w">        </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">k</span><span class="o">&gt;</span><span class="n">NB</span><span class="o">+</span><span class="mi">2</span><span class="w"> </span><span class="p">){</span><span class="w"> </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">SQLITE_CORRUPT_BKPT</span><span class="p">;</span><span class="w"> </span><span class="k">goto</span><span class="w"> </span><span class="n">balance_cleanup</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">        </span><span class="n">szNew</span><span class="p">[</span><span class="n">k</span><span class="mi">-1</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">        </span><span class="n">cntNew</span><span class="p">[</span><span class="n">k</span><span class="mi">-1</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">b</span><span class="p">.</span><span class="n">nCell</span><span class="p">;</span>
<span class="w">      </span><span class="p">}</span>
<span class="w">      </span><span class="n">sz</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">cachedCellSize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">b</span><span class="p">,</span><span class="w"> </span><span class="n">cntNew</span><span class="p">[</span><span class="n">i</span><span class="p">]</span><span class="mi">-1</span><span class="p">);</span>
<span class="w">      </span><span class="n">szNew</span><span class="p">[</span><span class="n">i</span><span class="p">]</span><span class="w"> </span><span class="o">-=</span><span class="w"> </span><span class="n">sz</span><span class="p">;</span>
<span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="o">!</span><span class="n">leafData</span><span class="w"> </span><span class="p">){</span>
<span class="w">        </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">cntNew</span><span class="p">[</span><span class="n">i</span><span class="p">]</span><span class="o">&lt;</span><span class="n">b</span><span class="p">.</span><span class="n">nCell</span><span class="w"> </span><span class="p">){</span>
<span class="w">          </span><span class="n">sz</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">cachedCellSize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">b</span><span class="p">,</span><span class="w"> </span><span class="n">cntNew</span><span class="p">[</span><span class="n">i</span><span class="p">]);</span>
<span class="w">        </span><span class="p">}</span><span class="k">else</span><span class="p">{</span>
<span class="w">          </span><span class="n">sz</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">      </span><span class="p">}</span>
<span class="w">      </span><span class="n">szNew</span><span class="p">[</span><span class="n">i</span><span class="o">+</span><span class="mi">1</span><span class="p">]</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">sz</span><span class="p">;</span>
<span class="w">      </span><span class="n">cntNew</span><span class="p">[</span><span class="n">i</span><span class="p">]</span><span class="o">--</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
</code></pre></div>


逐行读：某页累计超过 <code>usableSpace</code>，就把最右边的 cell 挪给下一页（<code>szNew[i] -= sz; szNew[i+1] += sz</code>），挪到本页装下为止；如果后面根本没有下一页，<code>k = i+2</code> <strong>新开一页</strong>——2 页变 3 页就是在这里发生的。每搬一个 cell 都按真实字节数增减，这是精确的装箱，不是拍脑袋的对半。上限被常量卡死：
<div class="codehilite"><pre><span></span><code><span class="cp">#define NN 1             </span><span class="cm">/* Number of neighbors on either side of pPage */</span>
<span class="cp">#define NB 3             </span><span class="cm">/* (NN*2+1): Total pages involved in the balance */</span>
</code></pre></div>


参与平衡的是本页加左右各一个兄弟（NB=3），新页数上限 <code>NB+2 = 5</code>，超出直接 <code>SQLITE_CORRUPT_BKPT</code>。NB 上方的注释还有句实话：<code>NB has been 3 since the inception of SQLite and we have never tested any other value.</code>

装箱只是第一轮，注释说它有偏：<code>The packing computed by the previous block is biased toward the siblings on the left side ... This adjustment is not optional.</code>——右兄弟可能被搬空，必须再做一次调整。<strong>配平是两次扫描：先装、再纠偏。</strong>

分裂的终点是把新页挂回树上。<code>balance_quick()</code> 的注释把分隔键的构造讲得非常细：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="cm">/* Create a divider cell to insert into pParent. The divider cell</span>
<span class="cm">    ** consists of a 4-byte page number (the page number of pPage) and</span>
<span class="cm">    ** a variable length key value (which must be the same value as the</span>
<span class="cm">    ** largest key on pPage).</span>
<span class="cm">    **</span>
<span class="cm">    ** To find the largest key value on pPage, first find the right-most</span>
<span class="cm">    ** cell on pPage. The first two fields of this cell are the</span>
<span class="cm">    ** record-length (a variable length integer at most 32-bits in size)</span>
<span class="cm">    ** and the key value (a variable length integer, may have any value).</span>
<span class="cm">    ** The first of the while(...) loops below skips over the record-length</span>
<span class="cm">    ** field. The second while(...) loop copies the key value from the</span>
<span class="cm">    ** cell on pPage into the pSpace buffer.</span>
<span class="cm">    */</span>
</code></pre></div>


分隔键 =「被分裂页的最大 key + 该页页号」，从原页最右 cell 现场抠出来，然后：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="cm">/* Insert the new divider cell into pParent. */</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">insertCell</span><span class="p">(</span><span class="n">pParent</span><span class="p">,</span><span class="w"> </span><span class="n">pParent</span><span class="o">-&gt;</span><span class="n">nCell</span><span class="p">,</span><span class="w"> </span><span class="n">pSpace</span><span class="p">,</span><span class="w"> </span><span class="p">(</span><span class="kt">int</span><span class="p">)(</span><span class="n">pOut</span><span class="o">-</span><span class="n">pSpace</span><span class="p">),</span>
<span class="w">                      </span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">pgno</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
</code></pre></div>


（上面第二行的 <code>(int)(pOut-pSpace)</code> 以源码为准，此处为示意——正文引用以下方 <code>balance_nonroot</code> 的通用路径为准。）通用路径的对应两行则毫无修饰：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Insert new divider cells into pParent. */</span>
<span class="w">  </span><span class="k">for</span><span class="p">(</span><span class="n">i</span><span class="o">=</span><span class="mi">0</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">&lt;</span><span class="n">nNew</span><span class="mi">-1</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">){</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">insertCell</span><span class="p">(</span><span class="n">pParent</span><span class="p">,</span><span class="w"> </span><span class="n">nxDiv</span><span class="o">+</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">pCell</span><span class="p">,</span><span class="w"> </span><span class="n">sz</span><span class="p">,</span><span class="w"> </span><span class="n">pTemp</span><span class="p">,</span><span class="w"> </span><span class="n">pNew</span><span class="o">-&gt;</span><span class="n">pgno</span><span class="p">);</span>
</code></pre></div>


每个新页（除最右）都向父页补一个分隔 cell。而父页放不下这个新 cell 时——回想第一道检查——它会变成父页的 overflow，等父页的 <code>balance()</code> 清算。<strong>分裂就是这样自下而上传播的。</strong>
<h2>InnoDB 的手术单：btr_page_split_and_insert 八步</h2>

InnoDB 的分裂函数在 <code>btr/btr0btr.cc</code>（不是 btr0cur.cc），头注释就是一张手术须知：
<div class="codehilite"><pre><span></span><code><span class="cm">/** Splits an index page to halves and inserts the tuple. It is assumed</span>
<span class="cm"> that mtr holds an x-latch to the index tree. NOTE: the tree x-latch is</span>
<span class="cm"> released within this function! NOTE that the operation of this</span>
<span class="cm"> function must always succeed, we cannot reverse it: therefore enough</span>
<span class="cm"> free disk space (2 pages) must be guaranteed to be available before</span>
<span class="cm"> this function is called.</span>
<span class="cm"> @return inserted record */</span>
</code></pre></div>


三句话三个承诺：树上已有 X 锁、锁会在函数内提前释放、<strong>只许成功不许回滚</strong>——所以调用前必须保证 2 页的空闲磁盘。WAL 篇讲过的「先记账再动数据」在这里换了个形态：redo 保证崩溃后能重放，但重放中途没有回滚，所以空间必须先备齐。

函数主体用编号注释标出八个步骤，取证到的关键节点：

<strong>第 1 步——选分裂点：</strong>
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* 1. Decide the split record; split_rec == NULL means that the</span>
<span class="cm">  tuple to be inserted should be the first record on the upper</span>
<span class="cm">  half-page */</span>
<span class="w">  </span><span class="n">insert_left</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">false</span><span class="p">;</span>

<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">n_iterations</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">direction</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">FSP_UP</span><span class="p">;</span>
<span class="w">    </span><span class="n">hint_page_no</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">page_no</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">    </span><span class="n">split_rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_get_split_rec</span><span class="p">(</span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">);</span>
</code></pre></div>


<strong>第 2 步——中点兜底 + 分配新页：</strong>
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">page_get_n_recs</span><span class="p">(</span><span class="n">page</span><span class="p">)</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="n">split_rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">page_get_middle_rec</span><span class="p">(</span><span class="n">page</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">btr_page_tuple_smaller</span><span class="p">(</span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">,</span><span class="w"> </span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="n">n_uniq</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="n">split_rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">page_rec_get_next</span><span class="p">(</span><span class="n">page_get_infimum_rec</span><span class="p">(</span><span class="n">page</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="n">split_rec</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">nullptr</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">}</span>

<span class="w">  </span><span class="cm">/* 2. Allocate a new page to the index */</span>
<span class="w">  </span><span class="n">new_block</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_alloc</span><span class="p">(</span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">hint_page_no</span><span class="p">,</span><span class="w"> </span><span class="n">direction</span><span class="p">,</span>
<span class="w">                             </span><span class="n">btr_page_get_level</span><span class="p">(</span><span class="n">page</span><span class="p">),</span><span class="w"> </span><span class="n">mtr</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
</code></pre></div>


<strong>第 5 步——把一半记录搬到新页：</strong>
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* 5. Move then the records to the new page */</span>
<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">direction</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">FSP_DOWN</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/*          fputs(&quot;Split left\n&quot;, stderr); */</span>

<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="nb">false</span>
<span class="cp">#ifdef UNIV_ZIP_COPY</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">page_zip</span>
<span class="cp">#endif </span><span class="cm">/* UNIV_ZIP_COPY */</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="o">!</span><span class="n">page_move_rec_list_start</span><span class="p">(</span><span class="n">new_block</span><span class="p">,</span><span class="w"> </span><span class="n">block</span><span class="p">,</span><span class="w"> </span><span class="n">move_limit</span><span class="p">,</span>
<span class="w">                                     </span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
</code></pre></div>


（右搬分支在后面调 <code>page_move_rec_list_end</code>。）中间还有第 3 步算上半页首记录、第 4 步 <code>btr_attach_half_pages</code> 改树结构、第 6 步决定元组插进哪半、第 7 步重定位光标、第 8 步插入。完整的八步单：
<ol>
<li><code>/* 1. Decide the split record; ... */</code> 选分裂点</li>
<li><code>/* 2. Allocate a new page to the index */</code> 分配新页</li>
<li><code>/* 3. Calculate the first record on the upper half-page...*/</code> 算上半页首记录</li>
<li><code>/* 4. Do first the modifications in the tree structure */</code> 挂新页、改父指针（<code>btr_attach_half_pages</code>）</li>
<li><code>/* 5. Move then the records to the new page */</code> 搬记录</li>
<li><code>/* 6. ... Decide the page where the tuple should be inserted */</code> 决定插入哪半</li>
<li><code>/* 7. Reposition the cursor for insert...*/</code> 重定位光标</li>
<li><code>/* 8. If insert did not fit, try page reorganization...*/</code> 插不进就重组再试</li>
</ol>

第 8 步的失败处理是整段最生猛的一行——<code>n_iterations++; goto func_start;</code>，<strong>整场重来</strong>，回到第 1 步换个分裂点再来一轮。第 4 步里 <code>btr_attach_half_pages</code> 的注释则是递归的证据：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Build the node pointer (= node key and page address) for the upper</span>
<span class="cm">  half */</span>

<span class="w">  </span><span class="n">node_ptr_upper</span><span class="w"> </span><span class="o">=</span>
<span class="w">      </span><span class="n">dict_index_build_node_ptr</span><span class="p">(</span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">split_rec</span><span class="p">,</span><span class="w"> </span><span class="n">upper_page_no</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">level</span><span class="p">);</span>

<span class="w">  </span><span class="cm">/* Insert it next to the pointer to the lower half. Note that this</span>
<span class="cm">  may generate recursion leading to a split on the higher level. */</span>

<span class="w">  </span><span class="n">btr_insert_on_non_leaf_level</span><span class="p">(</span><span class="n">flags</span><span class="p">,</span><span class="w"> </span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">level</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">node_ptr_upper</span><span class="p">,</span>
<span class="w">                               </span><span class="n">UT_LOCATION_HERE</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
</code></pre></div>


<code>may generate recursion leading to a split on the higher level</code>——父层可能因此再分裂，一路涨到根。
<h2>分裂点怎么选：中点、方向与启发式</h2>

分裂点的选择直接决定两半的均衡，两边策略不同。InnoDB 是「启发式优先、中点兜底」：先 <code>btr_page_get_split_rec</code> 按插入方向试导向右（<code>FSP_UP</code>、<code>hint_page_no = page_no + 1</code>）或向左，失败了才退回 <code>page_get_middle_rec</code> 按条数取中。更极端的情况是只有一条记录时，按新元组与它的大小关系决定 <code>split_rec</code> 还是 <code>nullptr</code>（新元组直接成为上半页第一条）。

<code>split_rec == NULL</code> 那条分支值得留意：<strong>待插入的元组本身就是分裂点</strong>——它将成为右半页的第一条记录。这让「往满页里插一个比所有人都大/小的 key」这种边界情况不必先插后搬，直接切在待插入位置。

SQLite 的 <code>balance_nonroot</code> 不选点，它<strong>摊平后重新装箱</strong>：不关心原来哪条在哪，只按 <code>cntNew[]</code> 切刀重装 2~3 页。两者哲学差异在此：
<ul>
<li><strong>InnoDB</strong>：保持链的相对次序，从中间剪断，O(半页) 搬移，方向启发式让顺序追加的分裂点尽量靠后（配合新页分配的 <code>hint_page_no</code>，让同向插入的页号连号）。</li>
<li><strong>SQLite</strong>：全量摊平重排，用两次扫描保证每页都在 <code>usableSpace</code> 内，代价是 cell 指针与内容都要动，换来的是「一次 balance 解决所有历史欠账」。</li>
</ul>
<h2>新页从哪来：freelist、extent 预留与只许成功</h2>

分裂的第二个关键输入是新页。SQLite 走文件级 freelist——空闲页以 trunk/leaf 两级结构链在第 1 页偏移 32 处：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* If control flows to this point, then it was not possible to add the</span>
<span class="cm">  ** the page being freed as a leaf page of the first trunk in the free-list.</span>
<span class="cm">  ** Possibly because the free-list is empty, or possibly because the</span>
<span class="cm">  ** first trunk in the free-list is full. Either way, the page being freed</span>
<span class="cm">  ** will become the new first trunk page in the free-list.</span>
<span class="cm">  */</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">SQLITE_OK</span><span class="o">!=</span><span class="p">(</span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btreeGetPage</span><span class="p">(</span><span class="n">pBt</span><span class="p">,</span><span class="w"> </span><span class="n">iPage</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">pPage</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">))</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="k">goto</span><span class="w"> </span><span class="n">freepage_out</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
<span class="w">  </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">sqlite3PagerWrite</span><span class="p">(</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">pDbPage</span><span class="p">);</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">!=</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="k">goto</span><span class="w"> </span><span class="n">freepage_out</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
<span class="w">  </span><span class="n">put4byte</span><span class="p">(</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aData</span><span class="p">,</span><span class="w"> </span><span class="n">iTrunk</span><span class="p">);</span>
<span class="w">  </span><span class="n">put4byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">aData</span><span class="p">[</span><span class="mi">4</span><span class="p">],</span><span class="w"> </span><span class="mi">0</span><span class="p">);</span>
<span class="w">  </span><span class="n">put4byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">pPage1</span><span class="o">-&gt;</span><span class="n">aData</span><span class="p">[</span><span class="mi">32</span><span class="p">],</span><span class="w"> </span><span class="n">iPage</span><span class="p">);</span>
</code></pre></div>


<code>freePage2()</code> 把被删的页挂为新 trunk（页头 4 字节指向下个 trunk、第 5 字节记 leaf 数），分配端 <code>allocateBtreePage()</code> 从同一位置取：<code>iTrunk = get4byte(&amp;pPage1-&gt;aData[32]);</code>。<strong>删表的页变成分裂的新页</strong>，文件因此不必一直长。

InnoDB 这边是段/extent 分配，且把「只许成功」贯彻成了前置预留。悲观插入在进分裂函数之前先留够空间（<code>btr0cur.cc</code>）：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!</span><span class="p">(</span><span class="n">flags</span><span class="w"> </span><span class="o">&amp;</span><span class="w"> </span><span class="n">BTR_NO_UNDO_LOG_FLAG</span><span class="p">)</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">index</span><span class="o">-&gt;</span><span class="n">table</span><span class="o">-&gt;</span><span class="n">is_intrinsic</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* First reserve enough free space for the file segments</span>
<span class="cm">    of the index tree, so that the insert will not fail because</span>
<span class="cm">    of lack of space */</span>

<span class="w">    </span><span class="n">ulint</span><span class="w"> </span><span class="n">n_extents</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">tree_height</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="mi">16</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">3</span><span class="p">;</span>

<span class="w">    </span><span class="n">success</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">fsp_reserve_free_extents</span><span class="p">(</span><span class="o">&amp;</span><span class="n">n_reserved</span><span class="p">,</span><span class="w"> </span><span class="n">index</span><span class="o">-&gt;</span><span class="n">space</span><span class="p">,</span><span class="w"> </span><span class="n">n_extents</span><span class="p">,</span>
<span class="w">                                       </span><span class="n">FSP_NORMAL</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!</span><span class="n">success</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="k">return</span><span class="w"> </span><span class="p">(</span><span class="n">DB_OUT_OF_FILE_SPACE</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


预留量随树高走（<code>tree_height / 16 + 3</code> 个 extent），树越高、分裂波及层越多、预留越多——<strong>把「递归长高可能连续分配多页」的最坏情况一次算进去</strong>。分配本体 <code>btr_page_alloc</code> 的文档则坦承这个保证有多虚：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Parameter true below states that the caller has made the</span>
<span class="cm">  reservation for free extents, and thus we know that a page can</span>
<span class="cm">  be allocated. However, for the cases where the file size is</span>
<span class="cm">  either smaller than an extent or same as the initial size,</span>
<span class="cm">  the fsp_reserve_free_extents returns reserved extents as 0.</span>
<span class="cm">  This can be true even if the initial allocation is about</span>
<span class="cm">  to be completely filled up. The function below is a point</span>
<span class="cm">  of no return and expects that enough space is already allocated.</span>
<span class="cm">  However, the callers of this function rely on the success/failure</span>
<span class="cm">  return by fsp_reserve_free_extents, which does not really guarantee</span>
<span class="cm">  that a whole extent has been reserved.</span>
<span class="cm">  The function fseg_alloc_free_page_general should attempt to ensure</span>
<span class="cm">  enough space is reserved before proceeding ahead. */</span>
</code></pre></div>


<code>point of no return</code>——过了这道门就没有回头路，所以函数文档要求「空间已就位」；预留本身又「并不真的保证留了一整个 extent」，最后的兜底是 <code>btr_page_alloc</code> 返回 NULL → 分裂返回 nullptr → 上层 <code>DB_OUT_OF_FILE_SPACE</code>。<strong>把失败挡在门外（预留）+ 门内尽力（point of no return）+ 兜底错误码</strong>，三层才撑起头注释那句 "must always succeed"。
<h2>父页的分隔键：分裂如何递归向上</h2>

两边的递归机制同构：新页需要一个指向父层的分隔键，父层放不下就自己分裂。InnoDB 的递归入口是 <code>btr_insert_on_non_leaf_level()</code>（<code>btr0btr.cc</code>，注意 8.x 实名如此，不是 <code>btr_cur_insert_on_non_leaf_level</code>），<code>btr_attach_half_pages</code> 调用它时的注释已明说 <code>may generate recursion</code>。函数内部：
<div class="codehilite"><pre><span></span><code><span class="w">      </span><span class="n">btr_cur_search_to_nth_level</span><span class="p">(</span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">level</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">,</span><span class="w"> </span><span class="n">PAGE_CUR_LE</span><span class="p">,</span>
<span class="w">                                  </span><span class="n">BTR_CONT_MODIFY_TREE</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="w">                                  </span><span class="n">location</span><span class="p">.</span><span class="n">filename</span><span class="p">,</span><span class="w"> </span><span class="n">location</span><span class="p">.</span><span class="n">line</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">err</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">DB_FAIL</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">err</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_cur_pessimistic_insert</span><span class="p">(</span>
<span class="w">        </span><span class="n">flags</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">BTR_NO_LOCKING_FLAG</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">BTR_KEEP_SYS_FLAG</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">BTR_NO_UNDO_LOG_FLAG</span><span class="p">,</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">rec</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">dummy_big_rec</span><span class="p">,</span><span class="w"> </span><span class="nb">nullptr</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
<span class="w">    </span><span class="n">ut_a</span><span class="p">(</span><span class="n">err</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">DB_SUCCESS</span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


先在 <code>level + 1</code> 层乐观插入，<code>DB_FAIL</code> 转悲观（悲观就可能又走到分裂），<code>ut_a(err == DB_SUCCESS)</code> 断言必须成功——而 <code>BTR_NO_LOCKING_FLAG | BTR_NO_UNDO_LOG_FLAG</code> 表明这层递归是在已经持有树锁、已在外层记过账的语境下做的，<strong>锁与日志的边界是外层定的，递归层只管结构</strong>。

SQLite 的对应就是 <code>insertCell(pParent, ...)</code> 那行——父页放不下自然变 overflow，外层 do-loop 再对父页调 <code>balance()</code>。传播的驱动力不同（InnoDB 显式递归、SQLite 靠 overflow 攒账 + 循环），但方向一致：<strong>分裂永远从叶子往上冒泡，根是最后一个让步的</strong>。

冒泡的另一面是锁范围：InnoDB 在叶子分裂、且新元组确定能放下时会提前放树锁：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* If the split is made on the leaf level and the insert will fit</span>
<span class="cm">  on the appropriate half-page, we may release the tree x-latch.</span>
<span class="cm">  We can then move the records after releasing the tree latch,</span>
<span class="cm">  thus reducing the tree latch contention. */</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="n">mtr</span><span class="o">-&gt;</span><span class="n">memo_release</span><span class="p">(</span><span class="n">dict_index_get_lock</span><span class="p">(</span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="p">),</span>
<span class="w">                      </span><span class="n">MTR_MEMO_X_LOCK</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">MTR_MEMO_SX_LOCK</span><span class="p">);</span>
</code></pre></div>


<strong>搬记录（慢活）排在放锁之后</strong>——树锁只覆盖结构修改，不覆盖数据搬移，把锁的持有窗口压到最短。这是教科书的「先锁结构再放锁」手法在分裂里的具体形态。
<h2>树怎么长高：两条路线，同样不变的根</h2>

根页分裂是分裂的极端形态。两边都遵守同一条不变式：<strong>根页号永远不变</strong>（文件头/meta 里记的地址不能动），变的是根页的内容与角色。

SQLite 走 <code>balance_deeper()</code>——<strong>原地长高</strong>。<code>balance()</code> 的根页分支：
<div class="codehilite"><pre><span></span><code><span class="w">    </span><span class="p">}</span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="p">(</span><span class="n">iPage</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">pCur</span><span class="o">-&gt;</span><span class="n">iPage</span><span class="p">)</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="p">){</span>
<span class="w">      </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">pPage</span><span class="o">-&gt;</span><span class="n">nOverflow</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="p">(</span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">anotherValidCursor</span><span class="p">(</span><span class="n">pCur</span><span class="p">))</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">        </span><span class="cm">/* The root page of the b-tree is overfull. In this case call the</span>
<span class="cm">        ** balance_deeper() function to create a new child for the root-page</span>
<span class="cm">        ** and copy the current contents of the root-page to it. The</span>
<span class="cm">        ** next iteration of the do-loop will balance the child page.</span>
<span class="cm">        */</span>
<span class="w">        </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">balance_deeper_called</span><span class="o">==</span><span class="mi">0</span><span class="w"> </span><span class="p">);</span>
<span class="w">        </span><span class="n">VVA_ONLY</span><span class="p">(</span><span class="w"> </span><span class="n">balance_deeper_called</span><span class="o">++</span><span class="w"> </span><span class="p">);</span>
<span class="w">        </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">balance_deeper</span><span class="p">(</span><span class="n">pPage</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">pCur</span><span class="o">-&gt;</span><span class="n">apPage</span><span class="p">[</span><span class="mi">1</span><span class="p">]);</span>
</code></pre></div>


<code>balance_deeper()</code> 分配新页、把根的内容整体搬下去：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Make pRoot, the root page of the b-tree, writable. Allocate a new</span>
<span class="cm">  ** page that will become the new right-child of pPage. Copy the contents</span>
<span class="cm">  ** of the node stored on pRoot into the new child page.</span>
<span class="cm">  */</span>
<span class="w">  </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">sqlite3PagerWrite</span><span class="p">(</span><span class="n">pRoot</span><span class="o">-&gt;</span><span class="n">pDbPage</span><span class="p">);</span>
<span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">rc</span><span class="o">==</span><span class="n">SQLITE_OK</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="n">rc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">allocateBtreePage</span><span class="p">(</span><span class="n">pBt</span><span class="p">,</span><span class="o">&amp;</span><span class="n">pChild</span><span class="p">,</span><span class="o">&amp;</span><span class="n">pgnoChild</span><span class="p">,</span><span class="n">pRoot</span><span class="o">-&gt;</span><span class="n">pgno</span><span class="p">,</span><span class="mi">0</span><span class="p">);</span>
<span class="w">    </span><span class="n">copyNodeContent</span><span class="p">(</span><span class="n">pRoot</span><span class="p">,</span><span class="w"> </span><span class="n">pChild</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">rc</span><span class="p">);</span>
</code></pre></div>


然后根页清零、只留一个右孩子指针：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Zero the contents of pRoot. Then install pChild as the right-child. */</span>
