<span class="w">  </span><span class="n">zeroPage</span><span class="p">(</span><span class="n">pRoot</span><span class="p">,</span><span class="w"> </span><span class="n">pChild</span><span class="o">-&gt;</span><span class="n">aData</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span><span class="w"> </span><span class="o">&amp;</span><span class="w"> </span><span class="o">~</span><span class="n">PTF_LEAF</span><span class="p">);</span>
<span class="w">  </span><span class="n">put4byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">pRoot</span><span class="o">-&gt;</span><span class="n">aData</span><span class="p">[</span><span class="n">pRoot</span><span class="o">-&gt;</span><span class="n">hdrOffset</span><span class="o">+</span><span class="mi">8</span><span class="p">],</span><span class="w"> </span><span class="n">pgnoChild</span><span class="p">);</span>
</code></pre></div>


注意 <code>&amp;pRoot-&gt;aData[pRoot-&gt;hdrOffset+8]</code>——内部页头偏移 8 的右孩子字段。根页从「装满数据的叶子」变成「只有一个孩子的内部页」，下一轮 do-loop 再平衡那个孩子。<strong>SQLite 文件里没有存储树高的字段</strong>（取证确认），高度是「根往下数到叶子」现场数出来的。

InnoDB 走 <code>btr_root_raise_and_insert()</code>——<strong>先搬家、再分裂</strong>，头注释把流程一句话说完：
<div class="codehilite"><pre><span></span><code><span class="cm">/** Makes tree one level higher by splitting the root, and inserts</span>
<span class="cm"> the tuple. It is assumed that mtr contains an x-latch on the tree.</span>
<span class="cm"> NOTE that the operation of this function must always succeed,</span>
<span class="cm"> we cannot reverse it: therefore enough free disk space must be</span>
<span class="cm"> guaranteed to be available before this function is called.</span>
<span class="cm"> @return inserted record */</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Allocate a new page to the tree. Root splitting is done by first</span>
<span class="cm">  moving the root records to the new page, emptying the root, putting</span>
<span class="cm">  a node pointer to the new page, and then splitting the new page. */</span>

<span class="w">  </span><span class="n">level</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_get_level</span><span class="p">(</span><span class="n">root</span><span class="p">);</span>

<span class="w">  </span><span class="n">new_block</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_alloc</span><span class="p">(</span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="n">FSP_NO_DIR</span><span class="p">,</span><span class="w"> </span><span class="n">level</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>

<span class="w">  </span><span class="cm">/* New page could not be allocated */</span>
<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!</span><span class="n">new_block</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">nullptr</span><span class="p">;</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Rebuild the root page to get free space */</span>
<span class="w">  </span><span class="n">btr_page_empty</span><span class="p">(</span><span class="n">root_block</span><span class="p">,</span><span class="w"> </span><span class="n">root_page_zip</span><span class="p">,</span><span class="w"> </span><span class="n">index</span><span class="p">,</span><span class="w"> </span><span class="n">level</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">);</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Split the child and insert tuple */</span>
<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">dict_index_is_spatial</span><span class="p">(</span><span class="n">index</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* Split rtree page and insert tuple */</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="p">(</span>
<span class="w">        </span><span class="n">rtr_page_split_and_insert</span><span class="p">(</span><span class="n">flags</span><span class="p">,</span><span class="w"> </span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">));</span>
<span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="p">(</span>
<span class="w">        </span><span class="n">btr_page_split_and_insert</span><span class="p">(</span><span class="n">flags</span><span class="p">,</span><span class="w"> </span><span class="n">cursor</span><span class="p">,</span><span class="w"> </span><span class="n">offsets</span><span class="p">,</span><span class="w"> </span><span class="n">heap</span><span class="p">,</span><span class="w"> </span><span class="n">tuple</span><span class="p">,</span><span class="w"> </span><span class="n">mtr</span><span class="p">));</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


三步：根的全部记录复制到新页 → <code>btr_page_empty</code> 把根清空并以 <code>level + 1</code> 重建（根成了只含一个 node pointer 的上层页）→ 对<strong>新页</strong>执行常规分裂。树高在搜索时记进游标（<code>btr0cur.cc</code>）：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">UNIV_UNLIKELY</span><span class="p">(</span><span class="n">height</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">ULINT_UNDEFINED</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* We are in the root node */</span>

<span class="w">    </span><span class="n">height</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">btr_page_get_level</span><span class="p">(</span><span class="n">page</span><span class="p">);</span>
<span class="w">    </span><span class="n">root_height</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">height</span><span class="p">;</span>
<span class="w">    </span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">tree_height</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">root_height</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
</code></pre></div>


<code>cursor-&gt;tree_height = root_height + 1</code>——这是 8.x 树高的唯一权威来源（旧版的 <code>dict_index_get_height</code> 已不存在，取证确认 grep 零命中）。

两条路线的对照很干净：

<thead>
<tr>
<th></th>
<th>SQLite <code>balance_deeper</code></th>
<th>InnoDB <code>btr_root_raise_and_insert</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>新页</td>
<td><code>allocateBtreePage</code>，根内容 <code>copyNodeContent</code> 搬下</td>
<td><code>btr_page_alloc</code>，根记录搬走后 <code>btr_page_empty</code></td>
</tr>
<tr>
<td>根页变化</td>
<td>清零 + 1 个右孩子指针</td>
<td><code>level + 1</code> 重建，1 个 node pointer</td>
</tr>
<tr>
<td>随后</td>
<td>下一轮 do-loop 平衡孩子</td>
<td>立即对新页 <code>btr_page_split_and_insert</code></td>
</tr>
<tr>

<td>不变</td>
</tr>
<tr>

<strong>长高不是全局重写，只是根页的角色转换</strong>：树高 +1 的物理代价是一次页面复制 + 一条父指针。也正因为便宜，「树高 3 层存亿级数据」才成立——每长一层，fanout 就乘一次页容量。
<h2>手术可能白做：重组、重试与整场重来</h2>

页分裂不是一锤子买卖，源码里三处「白做之后怎么办」的设计才是工程味所在。

<strong>SQLite：先整理再分裂，分裂后还有下一轮。</strong> 第二道检查里 <code>defragmentPage</code> 抢在分裂前面；<code>balance()</code> 本身是 do-loop，溢出清了但条件仍不满足就再走一轮；<code>balance_quick</code> 失败则退回 <code>balance_nonroot</code> 全量配平。整理的语义写在函数头：
<div class="codehilite"><pre><span></span><code><span class="cm">/*</span>
<span class="cm">** Defragment the page given. This routine reorganizes cells within the</span>
<span class="cm">** page so that there are no free-blocks on the free-block list.</span>
<span class="cm">**</span>
<span class="cm">** Parameter nMaxFrag is the maximum amount of fragmented space that may be</span>
<span class="cm">** present in the page after this routine returns.</span>
<span class="cm">**</span>
<span class="cm">** EVIDENCE-OF: R-44582-60138 SQLite may from time to time reorganize a</span>
<span class="cm">** b-tree page so that there are no freeblocks or fragment bytes, all</span>
<span class="cm">** unused bytes are contained in the unallocated space region, and all</span>
<span class="cm">** cells are packed tightly at the end of the page.</span>
<span class="cm">*/</span>
</code></pre></div>


<strong>InnoDB：第 8 步失败就整场重来。</strong> 手术单的最后一步：<code>If insert did not fit, try page reorganization...</code>，重组也放不下就 <code>n_iterations++; goto func_start;</code> 回到第 1 步。第二轮的第 1 步代码正好接上——<code>if (n_iterations &gt; 0)</code> 走 <code>btr_page_get_split_rec</code> 的另一侧启发式。<strong>重来的成本是有的（新页已经分配），但换来分裂点的第二次机会</strong>；<code>n_iterations</code> 也是 <code>btr_page_get_split_rec</code> 向右倾向的开关，追加场景第二轮几乎必然成功。

<strong>递归层的断言。</strong> <code>btr_insert_on_non_leaf_level</code> 里 <code>ut_a(err == DB_SUCCESS)</code>——递归路径不接受失败，因为外层已承诺"只许成功"。这份自信的来源正是上一节的 <code>n_extents = tree_height / 16 + 3</code> 预留：<strong>承诺不靠运气，靠进门之前把门后的路都买下来</strong>。
<h2>页内碎片：freeblock 链与整理的时机</h2>

分裂讲的是页<strong>之间</strong>的再分配，页<strong>内部</strong>的空洞是另一半故事。SQLite 的空闲总量计算把两种空洞分开记账：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="cm">/* Compute the total free space on the page</span>
<span class="cm">  ** EVIDENCE-OF: R-23588-34450 The two-byte integer at offset 1 gives the</span>
<span class="cm">  ** start of the first freeblock on the page, or is zero if there are no</span>
<span class="cm">  ** freeblocks. */</span>
<span class="w">  </span><span class="n">pc</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">get2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">1</span><span class="p">]);</span>
<span class="w">  </span><span class="n">nFree</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">7</span><span class="p">]</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">top</span><span class="p">;</span><span class="w">  </span><span class="cm">/* Init nFree to non-freeblock free space */</span>
</code></pre></div>


页空闲 = 未分配空隙（内容区起点 <code>top</code>）+ 碎片字节数（offset 7）+ 沿 offset 1 的 freeblock 链逐块累加。freeblock 的结构与合并规则在 <code>freeSpace()</code> 的注释与代码：
<div class="codehilite"><pre><span></span><code><span class="cm">/*</span>
<span class="cm">** Return a section of the pPage-&gt;aData to the freelist.</span>
<span class="cm">** The first byte of the new free block is pPage-&gt;aData[iStart]</span>
<span class="cm">** and the size of the block is iSize bytes.</span>
<span class="cm">**</span>
<span class="cm">** Adjacent freeblocks are coalesced.</span>
<span class="cm">**</span>
<span class="cm">** Even though the freeblock list was checked by btreeComputeFreeSpace(),</span>
<span class="cm">** that routine will not detect overlap between cells or freeblocks.  Nor</span>
<span class="cm">** does it detect cells or freeblocks that encroach into the reserved bytes</span>
<span class="cm">** at the end of the page.  So do additional corruption checks inside this</span>
<span class="cm">** routine and return SQLITE_CORRUPT if any problems are found.</span>
<span class="cm">*/</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">iStart</span><span class="o">&lt;=</span><span class="n">x</span><span class="w"> </span><span class="p">){</span>
<span class="w">    </span><span class="cm">/* The new freeblock is at the beginning of the cell content area,</span>
<span class="cm">    ** so just extend the cell content area rather than create another</span>
<span class="cm">    ** freelist entry */</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">iStart</span><span class="o">&lt;</span><span class="n">x</span><span class="w"> </span><span class="p">)</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="n">SQLITE_CORRUPT_PAGE</span><span class="p">(</span><span class="n">pPage</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="p">(</span><span class="w"> </span><span class="n">iPtr</span><span class="o">!=</span><span class="n">hdr</span><span class="o">+</span><span class="mi">1</span><span class="w"> </span><span class="p">)</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="n">SQLITE_CORRUPT_PAGE</span><span class="p">(</span><span class="n">pPage</span><span class="p">);</span>
<span class="w">    </span><span class="n">put2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">1</span><span class="p">],</span><span class="w"> </span><span class="n">iFreeBlk</span><span class="p">);</span>
<span class="w">    </span><span class="n">put2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">hdr</span><span class="o">+</span><span class="mi">5</span><span class="p">],</span><span class="w"> </span><span class="n">iEnd</span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span><span class="k">else</span><span class="p">{</span>
<span class="w">    </span><span class="cm">/* Insert the new freeblock into the freelist */</span>
<span class="w">    </span><span class="n">put2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">iPtr</span><span class="p">],</span><span class="w"> </span><span class="n">iStart</span><span class="p">);</span>
<span class="w">    </span><span class="n">put2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">iStart</span><span class="p">],</span><span class="w"> </span><span class="n">iFreeBlk</span><span class="p">);</span>
<span class="w">    </span><span class="n">assert</span><span class="p">(</span><span class="w"> </span><span class="n">iSize</span><span class="o">&gt;=</span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">iSize</span><span class="o">&lt;=</span><span class="mh">0xffff</span><span class="w"> </span><span class="p">);</span>
<span class="w">    </span><span class="n">put2byte</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">[</span><span class="n">iStart</span><span class="o">+</span><span class="mi">2</span><span class="p">],</span><span class="w"> </span><span class="p">(</span><span class="n">u16</span><span class="p">)</span><span class="n">iSize</span><span class="p">);</span>
<span class="w">  </span><span class="p">}</span>
</code></pre></div>


三个细节：空洞贴着内容区前沿就直接把起点外扩、不占链表槽位；按偏移升序插入、相邻自动合并；≤3 字节的碎屑不入链，只累加进 offset 7 的 fragment 计数。<strong>「删掉一条记录」在页内留下的坑有三种归宿</strong>——并入空隙、进链、计碎片——而整理（<code>defragmentPage</code>）把三者全部折回空隙，cell 紧贴页尾重排。

InnoDB 的对应物是 <code>PAGE_FREE</code>（空闲记录链头）与 <code>PAGE_GARBAGE</code>（删除记录字节数），加上重组门槛 <code>BTR_CUR_PAGE_REORGANIZE_LIMIT = UNIV_PAGE_SIZE / 32</code>。<strong>两套实现都把「空洞的字数」单独存进页头</strong>——这是判断何时重组的原料：<code>page_has_garbage</code> + <code>max_insert_size_after_reorganize</code> 的组合，等价于 SQLite 的 <code>nFree</code> + <code>defragmentPage</code>。

这也直接回答前言的两个现象：<strong>随机 UUID 主键</strong>的插入点随机落在任意页，每次删除/更新都在不同页上留 freeblock，页页有洞、频繁重组与分裂，文件自然碎；<strong>顺序主键</strong>的插入集中在最右叶子，旧页洞少、新页连号（<code>hint_page_no = page_no + 1</code> 与 freelist/extent 的顺序分配），填充率高。
<h2>顺序写为什么不碎：分裂方向的暗示</h2>

把散落的证据串成一条实践线：
<ol>
<li>InnoDB 分裂第 1 步的 <code>if (n_iterations &gt; 0) { direction = FSP_UP; hint_page_no = page_no + 1; ... }</code>——重试时明确向上、页号 +1 的方向暗示；</li>
<li><code>btr_page_alloc(cursor-&gt;index, hint_page_no, direction, ...)</code> 把暗示传给段分配器，让新页尽量跟在原页后面；</li>
<li>中点分裂让「顺序追加」的分裂模式稳定复现：每次都在右半页尾部追加、满了一刀切、新的右半又在页尾——<strong>页与页首尾相接，几乎不产生页内碎片</strong>；</li>
<li>SQLite 的 <code>balance</code> 虽无方向概念，但 do-loop 攒账 + 2/3 阈值同样让顺序插入「攒够了才动一次，动一次就装到 <code>usableSpace</code> 为止」。</li>
</ol>

反过来，随机主键让每次插入落在任意页，第 3 步的稳定复现被打破：页页都差一口、页页都触发整理或分裂，而 NB=3 的窗口（本页 + 左右兄弟）在随机写下拿不到「同向攒出来」的邻居。<strong>慢查询文章里「用自增/时间戳做主键、避免随机 UUID 索引」这条建议，在这里的源头就是方向暗示与中点分裂的相互作用。</strong>
<h2>并发之下：树锁的释放时机与不可回滚契约</h2>

分裂期间其他会话看到什么？InnoDB 的证据链：入口断言要求树 X/SX 锁已持有、页已 X fix 进 mtr：
<div class="codehilite"><pre><span></span><code><span class="w">  </span><span class="n">ut_ad</span><span class="p">(</span><span class="n">mtr_memo_contains_flagged</span><span class="p">(</span><span class="n">mtr</span><span class="p">,</span><span class="w"> </span><span class="n">dict_index_get_lock</span><span class="p">(</span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="p">),</span>
<span class="w">                                  </span><span class="n">MTR_MEMO_X_LOCK</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">MTR_MEMO_SX_LOCK</span><span class="p">)</span><span class="w"> </span><span class="o">||</span>
<span class="w">        </span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="o">-&gt;</span><span class="n">table</span><span class="o">-&gt;</span><span class="n">is_intrinsic</span><span class="p">());</span>
<span class="w">  </span><span class="p">...</span>
<span class="w">  </span><span class="n">ut_ad</span><span class="p">(</span>
<span class="w">      </span><span class="n">mtr_is_block_fix</span><span class="p">(</span><span class="n">mtr</span><span class="p">,</span><span class="w"> </span><span class="n">block</span><span class="p">,</span><span class="w"> </span><span class="n">MTR_MEMO_PAGE_X_FIX</span><span class="p">,</span><span class="w"> </span><span class="n">cursor</span><span class="o">-&gt;</span><span class="n">index</span><span class="o">-&gt;</span><span class="n">table</span><span class="p">));</span>
</code></pre></div>


锁模式枚举（<code>btr0btr.h</code>）里普通读者是 <code>BTR_SEARCH_LEAF = RW_S_LATCH</code>，普通写者 <code>BTR_MODIFY_LEAF = RW_X_LATCH</code>，而动结构的是 <code>BTR_MODIFY_TREE = 33</code> / <code>BTR_CONT_MODIFY_TREE = 34</code>——<strong>读叶子、改叶子、改树是三个独立档位</strong>，只有分裂/长高才升到改树档。配合前文的提前 <code>memo_release</code>：
<ul>
<li>第 1~4 步（选点、分配、挂树）持树锁；</li>
<li>确认新页装得下后<strong>先放树锁</strong>，再搬记录；</li>
<li>搬记录期间别的会话可以进树，只被新旧两页的页锁挡住。</li>
</ul>

再叠上 WAL 篇的结论——页修改经 redo log 落盘、只许成功不许回滚——整幅图景是：<strong>结构变更小窗口持树锁，数据搬移只持页锁，崩溃由 redo 保证重放完整，空间由前置预留保证不失败</strong>。四件事各管一段，谁也不越界。

SQLite 是单写者模型（库级写锁），没有这套并发戏法，换来的是 <code>balance()</code> 可以随意摊平重排、<code>anotherValidCursor</code> 只需检查游标有效性。<strong>复杂度守恒：并发的账在锁上，正确的账在回滚上，SQLite 把两笔都记在了别处（写锁 + 事务日志）。</strong>
<h2>两套实现对照表与实践线</h2>

全文的机制可以压成一张表：

</tr>
<tr>

<tr>
<td>父层传播</td>
<td><code>insertCell(parent)</code> → overflow → 上层 balance</td>
<td><code>btr_insert_on_non_leaf_level</code> 显式递归</td>
</tr>
<tr>
<td>长高</td>
<td><code>balance_deeper</code> 原地变内部页</td>
<td><code>btr_root_raise_and_insert</code> 搬家再分裂</td>
</tr>
<tr>
<td>失败语义</td>
<td>rc 逐级传播</td>
<td>只许成功，<code>ut_a(DB_SUCCESS)</code> + <code>DB_OUT_OF_FILE_SPACE</code> 兜底</td>
</tr>
<tr>
<td>树高存储</td>
<td>无字段，现场数</td>
<td><code>PAGE_LEVEL</code> 页内字段 + <code>cursor-&gt;tree_height</code></td>
</tr>
</tbody>
</table></div>

接回实践线，页分裂视角给出的判断顺序：
<ol>
<li><strong>主键形态先看</strong>——顺序追加命中方向暗示与稳定中点分裂，随机 key 打散这两者（上文实践线第 1~4 条）；</li>
<li><strong>看页填充率而非行数</strong>——<code>INFORMATION_SCHEMA.INNODB_TABLES</code> 的页数/行数比，或 SQLite <code>PRAGMA page_count</code> 与 freelist（<code>PRAGMA freelist_count</code>）的差值，对应 <code>PAGE_GARBAGE</code> 与 freeblock 链；</li>
<li><strong>负载尾部留重组空间</strong>——两边的重组门槛（<code>nFree</code> 超 1/3、空洞超 512 字节）说明周期性整理本来就设计在路径里，不必为偶发重组报警；</li>
<li><strong>树高是免费的</strong>——长高 = 一次根页复制 + 一条父指针，3 层与 4 层的读代价差一次页访问；真正贵的是分裂<strong>频度</strong>（每次一个 mtr + 一次段分配 + 可能的锁放大），不是树高本身。</li>
</ol>
<h2>结语</h2>

教科书把页分裂画成一个箭头分成两个，源码里它是一张八步手术单：选点要启发式、分配要预支、搬链要剪断重接、父层要递归、根页要搬家、插不进要整场重来、空间要在进门之前买足。这些步骤没有一步是多余的——每一步都对着一种具体的事故：分裂点选偏了、表空间满了、锁持太久、崩溃落在搬一半、父页也满了。

两套实现的对照再次印证了 WAL 篇那句话的镜像：<strong>格式是随便定的，契约是不能动的</strong>。cell 指针数组还是相对偏移链、8 字节头还是 94 字节头，两边随便选；但「先检查再整理、整理不行再分裂、分裂必须给父层一个分隔键、长高必须保住根页号、失败必须有明确出口」——一条不差。

下次在慢查询文章里写下「换成顺序主键」时，你可以指到具体的地方：InnoDB 分裂第 1 步那行 <code>hint_page_no = page_no + 1</code>。它就是「索引不碎」这四个字在源码里的全部形态。</div></div></noscript>
