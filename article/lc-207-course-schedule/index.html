    <noscript><div class="ns-article"><h1>【LC 207】课程表：Kahn 的入度表，和 DFS 的三色标记（附 210 返序）</h1><div class="ns-meta">2026/10/12 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>

<strong>LC 207 课程表</strong>：你一共需要修 <code>numCourses</code> 门课，课程编号为 <code>0</code> 到 <code>numCourses - 1</code>。先修关系由 <code>prerequisites</code> 给出，<code>prerequisites[i] = [a, b]</code> 表示<strong>修课程 <code>a</code> 之前必须先修课程 <code>b</code></strong>。判断是否可能修完所有课程。

<strong>LC 210 课程表 II</strong>：同一张图，如果能修完，返回<strong>任意一种</strong>合法的修课顺序；修不完返回空数组。
<div class="codehilite"><pre><span></span><code>输入: numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
输出: true（207）；[0,1,2,3] 或 [0,2,1,3] 都合法（1 和 2 互不依赖，可互换）
      注意 [0,3,1,2] 不合法 —— 3 必须先修 1、2

输入: numCourses = 2, prerequisites = [[1,0],[0,1]]
输出: false（207）；[]（210）—— 1 等 0、0 等 1，互相等待
</code></pre></div>


先把方向钉死，这是本题第一大坑：<code>[a, b]</code> 是「修 a 前先修 b」，所以边是 <strong>b → a</strong>（先修课指向后修课）。画反了不是小事 —— 它决定你后面所有入度、所有顺序的对错。

于是整道题的翻译只有一句话：
<blockquote>

<strong>修课顺序 = 有向图的拓扑序；能修完 ⇔ 这张图没有环。</strong>
</blockquote>

剩下的全部内容，就是「判环 + 生成拓扑序」的两台机器：<strong>Kahn（入度表 + 队列）</strong> 和 <strong>DFS 三色标记</strong>。
<ul>
<li><a href="#section-1">一、核心洞察：拓扑序与环</a></li>
<li><a href="#section-2">二、Kahn 算法：入度表 + 队列</a></li>
<li><a href="#section-3">三、DFS 三色标记：白、灰、黑，和灰色回边</a></li>
<li><a href="#section-4">四、动画怎么看</a></li>
<li><a href="#section-5">五、完整推演表</a></li>
<li><a href="#section-6">六、Java 版</a></li>
<li><a href="#section-7">七、同族题：210 / 269 / 310 / 802 / 1203 / 444</a></li>
<li><a href="#section-8">八、边界情况</a></li>
<li><a href="#section-9">九、复杂度</a></li>
<li><a href="#section-10">十、常见坑</a></li>
<li><a href="#section-11">十一、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：拓扑序与环</h2>

一个有向图里，如果能把所有节点排成一条线，使<strong>每条边都从排在前面的点指向排在后面的点</strong>，这条线就是<strong>拓扑序</strong>。它恰好就是「一种合法的修课顺序」：先修课全部排在依赖它的课之前。

三条基本性质：
<ul>
<li><strong>有拓扑序 ⇔ 图是有向无环图（DAG）</strong>。有环 ⇒ 环上的课互相等 ⇒ 无解（返回 false / 空数组）。</li>
<li><strong>拓扑序通常不唯一</strong>。本文的默认例子 <code>[[1,0],[2,0],[3,1],[3,2]]</code>，<code>[0,1,2,3]</code> 和 <code>[0,2,1,3]</code> 都合法（1 和 2 互不依赖，可以换位置）。</li>
<li><strong>孤立课（没有先修也没有后继）永远可以最先修</strong>：入度为 0。</li>
</ul>

求解路线两条，互为镜像：
<ul>
<li><strong>Kahn</strong>：反复找「入度为 0」的课修掉，修完把它指向的课入度减 1 —— <strong>天然产出拓扑序</strong>；</li>
<li><strong>DFS 三色</strong>：沿着边深搜，<strong>碰到指回递归栈的边 = 有环</strong>；节点完成时追加后序，<strong>后序反转 = 拓扑序</strong>。</li>
</ul>
<h2>二、Kahn 算法：入度表 + 队列</h2>

入度 = 一门课「还有几门先修没修完」。入度 0 = 现在就能修。Kahn 的全部动作就是：<strong>修掉所有 0 入度的课，并松开它们的后继</strong>。
<div class="codehilite"><pre><span></span><code><span class="kn">from</span><span class="w"> </span><span class="nn">collections</span><span class="w"> </span><span class="kn">import</span> <span class="n">deque</span>

<span class="k">def</span><span class="w"> </span><span class="nf">canFinish</span><span class="p">(</span><span class="n">numCourses</span><span class="p">,</span> <span class="n">prerequisites</span><span class="p">):</span>
    <span class="n">adj</span> <span class="o">=</span> <span class="p">[[]</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">numCourses</span><span class="p">)]</span>
    <span class="n">indegree</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="n">numCourses</span>
    <span class="k">for</span> <span class="n">a</span><span class="p">,</span> <span class="n">b</span> <span class="ow">in</span> <span class="n">prerequisites</span><span class="p">:</span>
        <span class="n">adj</span><span class="p">[</span><span class="n">b</span><span class="p">]</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">a</span><span class="p">)</span>          <span class="c1"># 先修 b → 后修 a</span>
        <span class="n">indegree</span><span class="p">[</span><span class="n">a</span><span class="p">]</span> <span class="o">+=</span> <span class="mi">1</span>
    <span class="n">q</span> <span class="o">=</span> <span class="n">deque</span><span class="p">(</span><span class="n">v</span> <span class="k">for</span> <span class="n">v</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">numCourses</span><span class="p">)</span> <span class="k">if</span> <span class="n">indegree</span><span class="p">[</span><span class="n">v</span><span class="p">]</span> <span class="o">==</span> <span class="mi">0</span><span class="p">)</span>
    <span class="n">order</span> <span class="o">=</span> <span class="p">[]</span>
    <span class="k">while</span> <span class="n">q</span><span class="p">:</span>
        <span class="n">cur</span> <span class="o">=</span> <span class="n">q</span><span class="o">.</span><span class="n">popleft</span><span class="p">()</span>
        <span class="n">order</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">cur</span><span class="p">)</span>         <span class="c1"># 出队顺序就是拓扑序</span>
        <span class="k">for</span> <span class="n">nxt</span> <span class="ow">in</span> <span class="n">adj</span><span class="p">[</span><span class="n">cur</span><span class="p">]:</span>
            <span class="n">indegree</span><span class="p">[</span><span class="n">nxt</span><span class="p">]</span> <span class="o">-=</span> <span class="mi">1</span>
            <span class="k">if</span> <span class="n">indegree</span><span class="p">[</span><span class="n">nxt</span><span class="p">]</span> <span class="o">==</span> <span class="mi">0</span><span class="p">:</span>    <span class="c1"># 入度减到 0 才能修</span>
                <span class="n">q</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">nxt</span><span class="p">)</span>
    <span class="k">return</span> <span class="nb">len</span><span class="p">(</span><span class="n">order</span><span class="p">)</span> <span class="o">==</span> <span class="n">numCourses</span>   <span class="c1"># 207 的答案；210 直接返回 order（不足则 []）</span>
</code></pre></div>


判据一句话：<strong>出队数量 == numCourses ⇔ 没有环</strong>。如果只剩环（或等环）的课，它们的入度永远减不到 0，队列提前枯竭，<code>len(order) &lt; numCourses</code>。
<h2>三、DFS 三色标记：白、灰、黑，和灰色回边</h2>

换一台机器：给每个节点三种颜色 ——
<ul>
<li><strong>白</strong>（0）：还没访问过；</li>
<li><strong>灰</strong>（1）：正在递归栈里（进了它、还没探完它的所有后继）；</li>
<li><strong>黑</strong>（2）：已确认安全（后继全部处理完，且从它出发到不了环）。</li>
</ul>

沿边深搜：碰到<strong>白</strong>就推进去；碰到<strong>黑</strong>直接跳过（那条路已经验过安全）；碰到<strong>灰</strong> —— 说明这条边指回了当前递归栈里的祖先，<strong>环被抓住</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">canFinish_dfs</span><span class="p">(</span><span class="n">numCourses</span><span class="p">,</span> <span class="n">prerequisites</span><span class="p">):</span>
    <span class="n">adj</span> <span class="o">=</span> <span class="p">[[]</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">numCourses</span><span class="p">)]</span>
    <span class="k">for</span> <span class="n">a</span><span class="p">,</span> <span class="n">b</span> <span class="ow">in</span> <span class="n">prerequisites</span><span class="p">:</span>
        <span class="n">adj</span><span class="p">[</span><span class="n">b</span><span class="p">]</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">a</span><span class="p">)</span>
    <span class="n">color</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="n">numCourses</span>        <span class="c1"># 0 白 / 1 灰 / 2 黑</span>
    <span class="n">order</span> <span class="o">=</span> <span class="p">[]</span>                      <span class="c1"># 后序</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">dfs</span><span class="p">(</span><span class="n">v</span><span class="p">):</span>
        <span class="n">color</span><span class="p">[</span><span class="n">v</span><span class="p">]</span> <span class="o">=</span> <span class="mi">1</span>                <span class="c1"># 白 → 灰</span>
        <span class="k">for</span> <span class="n">nxt</span> <span class="ow">in</span> <span class="n">adj</span><span class="p">[</span><span class="n">v</span><span class="p">]:</span>
            <span class="k">if</span> <span class="n">color</span><span class="p">[</span><span class="n">nxt</span><span class="p">]</span> <span class="o">==</span> <span class="mi">1</span><span class="p">:</span>     <span class="c1"># 灰色回边 = 环</span>
                <span class="k">return</span> <span class="kc">False</span>
            <span class="k">if</span> <span class="n">color</span><span class="p">[</span><span class="n">nxt</span><span class="p">]</span> <span class="o">==</span> <span class="mi">0</span> <span class="ow">and</span> <span class="ow">not</span> <span class="n">dfs</span><span class="p">(</span><span class="n">nxt</span><span class="p">):</span>
                <span class="k">return</span> <span class="kc">False</span>
        <span class="n">color</span><span class="p">[</span><span class="n">v</span><span class="p">]</span> <span class="o">=</span> <span class="mi">2</span>                <span class="c1"># 灰 → 黑</span>
        <span class="n">order</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">v</span><span class="p">)</span>             <span class="c1"># 后序：把它追加在「所有后继之后」</span>
        <span class="k">return</span> <span class="kc">True</span>

    <span class="k">for</span> <span class="n">v</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">numCourses</span><span class="p">):</span>
        <span class="k">if</span> <span class="n">color</span><span class="p">[</span><span class="n">v</span><span class="p">]</span> <span class="o">==</span> <span class="mi">0</span> <span class="ow">and</span> <span class="ow">not</span> <span class="n">dfs</span><span class="p">(</span><span class="n">v</span><span class="p">):</span>
            <span class="k">return</span> <span class="kc">False</span>
    <span class="k">return</span> <span class="kc">True</span>                     <span class="c1"># 210 的答案 = order[::-1]</span>
</code></pre></div>


两个要点：
<ol>
<li><strong>必须区分灰和黑</strong>。只用一个 <code>visited</code> 布尔数组会把「黑邻居（安全汇合）」也当成环，误报；</li>
<li><strong>后序反转才是拓扑序</strong>。后序的追加时机是「所有后继处理完之后」—— 所以先修课自然排在后面，反转后翻到前面。默认例题里后序是 <code>[3,1,2,0]</code>，反转 <code>[0,2,1,3]</code> 就是答案。</li>
</ol>

对照来看：<strong>Kahn 给 <code>[0,1,2,3]</code>，DFS 给 <code>[0,2,1,3]</code> —— 都对</strong>。拓扑序不唯一，两台机器只是「挑了不同的合法线」。
<h2>四、动画怎么看</h2>

<strong>动画一</strong>（<code>algo-viz--lc207</code>）：<strong>Kahn</strong>。上方是课程图（圆点 = 课程，箭头 = 先修 → 后修，<strong>右上角小圆 = 当前入度</strong>）；下方两行分别是<strong>队列</strong>（0 入度的课）和<strong>顺序 order</strong>（已修完的课）。盯住三件事：0 入度的课怎么第一时间全部进队列、每修完一门课它的后继入度 −1（<strong>角标当场变小</strong>）、以及<strong>入度减到 0 的课才入队</strong>。最后 <code>order</code> 满员 = 能修完。

<strong>动画二</strong>（<code>algo-viz--lc207dfs</code>）：<strong>DFS 三色</strong>。同一张图：白色 = 没访问、灰色 = 递归栈里、黑色 = 已确认安全；左下的<strong>递归栈</strong>就是当前的「灰色路径」，右下的<strong>后序 post</strong> 是节点变黑时追加的顺序。盯住两件事：<strong>灰 → 黑发生在「后继全处理完」时</strong>，以及（有环的图上）<strong>灰色回边会被描红</strong> —— 那就是环。跑完 <code>post</code> 反转就是拓扑序。

<li><strong>LC 210 课程表 II</strong>：本题的返序版 —— 把 Kahn 的出队顺序（或 DFS 的后序反转）直接返回；</li>
<li><strong>LC 269 火星词典</strong>（会员）：从相邻单词的第一个不同字母建出字母间的偏序边，再做拓扑排序 —— <strong>难点在建图，不在排序</strong>；</li>
<li><strong>LC 310 最小高度树</strong>：无向图里反复剥掉「度为 1」的叶子（和 Kahn 剥入度是同一种思想），最后剩下的 1~2 个点就是答案；</li>
<li><strong>LC 802 找到最终安全状态</strong>：反向图上剥「出度为 0」的点，剥不掉的（在环上或等环）就是不安全 —— Kahn 的镜像；</li>
<li><strong>LC 1203 项目管理</strong>：两次拓扑排序 —— 组内排序 + 组间排序；</li>
<li><strong>LC 444 序列重建</strong>（会员）：判断拓扑序是否<strong>唯一</strong> —— 队列里同时有 2 个以上 0 入度点就说明有分支，顺序不唯一。</li>
</ul>

把它们排成一列看：<strong>拓扑排序的模板永远是「算入度/出度 + 反复剥 0 度点（或 DFS 三色）」</strong>；剩下的差别只在「边从哪来」（先修关系 / 字母序 / 反向图）和「剥到最后返回什么」。
<h2>八、边界情况</h2>
<ul>
<li><strong>自环</strong>：<code>[[0,0]]</code> —— 课程等自己，入度永远 ≥ 1，返回 false；</li>
<li><strong>重边</strong>：<code>[[1,0],[1,0]]</code> —— 入度被记成 2，被 0 松弛两次才到 0，结果仍正确（但要知道这个行为）；</li>
<li><strong>孤立课</strong>：没有先修也没有后继，入度 0 直接修，不影响结果；</li>
<li><strong><code>numCourses = 1</code>、无先修</strong>：返回 true，顺序 <code>[0]</code>；</li>
<li><strong>空 <code>prerequisites</code></strong>：全部入度 0，顺序 <code>[0,1,...,n-1]</code> 本身就是一个合法拓扑序；</li>
<li><strong>多个连通块</strong>：Kahn 天然处理（入队所有 0 入度点）；DFS 要在外层循环里对每个未访问点各起一次；</li>
<li><strong>环上挂着树枝</strong>：树枝上的课也被环卡住（等环里的先修），Kahn 里它们的入度同样减不到 0 —— 判环看的是<strong>出队总数</strong>，不是「有没有节点在环里」的直接检测。</li>
</ul>
<h2>九、复杂度</h2>
<table>
<thead>
<tr>
<th>做法</th>
<th>时间</th>
<th>空间</th>
<th>特点</th>
</tr>
</thead>
<tbody>
<tr>
<td>Kahn（入度表 + 队列）</td>
<td><code>O(V + E)</code></td>
<td><code>O(V + E)</code></td>
<td>直观、天然产出拓扑序</td>
</tr>
<tr>
<td>DFS 三色</td>
<td><code>O(V + E)</code></td>
<td><code>O(V + E)</code></td>
<td>判环顺手；后序反转得序</td>
</tr>
</tbody>
</table>

<code>V = numCourses</code>、<code>E = prerequisites.length</code>。建图 <code>O(E)</code>，每个节点、每条边恰好被处理一次。剪枝提前退出（发现环立刻返回）不会改变最坏复杂度。
<h2>十、常见坑</h2>
<ol>
<li><strong>方向画反</strong>：<code>[a, b]</code> 是 b → a（先修 → 后修）。画成 a → b 的话，拓扑序会整个反过来。</li>
<li><strong>Kahn 简化过头</strong>：只 <code>cur</code> 出队却忘了<strong>给后继减入度</strong>，或者没判断「减到 0 才入队」—— 入度还是正数的课被塞进队列，顺序直接错。</li>
<li><strong>判环用「队列空」</strong>：所有课修完队列也会空。判据是 <strong>出队数量 == numCourses</strong>。</li>
<li><strong>DFS 只用一个 <code>visited</code> 布尔值</strong>：没有灰/黑之分，遇到「黑邻居（安全汇合）」也会误报环。必须三色。</li>
<li><strong>后序忘了反转</strong>：<code>post.append(v)</code> 的顺序是「后继在前」，直接返回就是反的拓扑序。</li>
<li><strong>递归深度</strong>：链形图最坏递归 <code>O(V)</code>，大图换<strong>显式栈迭代版</strong>（或者直接 Kahn，天然无递归）。</li>
<li><strong>210 有环时返回了什么</strong>：Kahn 里 <code>order</code> 只装了一半 —— 必须检查「<code>len(order) == numCourses</code>」再返回，否则返回残缺顺序。</li>
<li><strong>重复边让入度变多</strong>：<code>[[1,0],[1,0]]</code> 会把 1 的入度记成 2（不影响正确性，但要心里有数）；如果用 <code>set</code> 建图，行为会变，别混着写。</li>
<li><strong>外层循环漏起点</strong>：DFS 版只从 <code>0</code> 开始，会漏掉其它连通块 —— 要对每个未访问节点各起一次 DFS。</li>
<li><strong>以为拓扑序唯一</strong>：默认例子就有两个合法答案；要「唯一性判定」那是 LC 444 的追问。</li>
</ol>
<h2>十一、面试怎么答</h2>

<strong>第一段 · 骨架</strong>：这题是把「能不能修完」翻译成「有向图有没有环」。先用 <code>[a, b]</code> ⇒ 边 <code>b → a</code> 建图，然后二选一：Kahn 反复剥 0 入度的课、数出队数量；或 DFS 三色，遇见灰色回边就是环。两者都是 <code>O(V + E)</code>。

<strong>第二段 · 主动补 210</strong>（<strong>这段是区分度所在</strong>）：Kahn 的出队顺序天然是一个拓扑序；DFS 则要把<strong>后序反转</strong>。顺带指出<strong>拓扑序不唯一</strong>（默认例子 <code>[0,1,2,3]</code> 与 <code>[0,2,1,3]</code> 都对），说明你理解的是「一个」合法序而不是唯一解。

<strong>第三段 · 追问连接</strong>：判唯一性 → LC 444（队列里同层多个 0 入度点 = 不唯一）；建图本身是难点 → LC 269 火星词典；无向图版「剥叶子」 → LC 310；反向图剥出度 → LC 802。

<strong>追问连跳</strong>：
- 要<strong>返序</strong> → LC 210，Kahn 直接返回 or DFS 后序反转；
- 要<strong>判唯一</strong> → LC 444，看队列是否同时有多个候选；
- 要<strong>从字母对建图再排序</strong> → LC 269，先处理「前一个词是后一个词前缀」的非法情形；
- 要<strong>剥叶子求中心</strong> → LC 310；
- 要<strong>安全节点</strong> → LC 802，反向图 + 剥出度。

一句话收尾：「课程表只有一句话 —— <strong>修课顺序 = 拓扑序，能修完 = 无环</strong>；Kahn 剥入度、DFS 认灰边，是这句话的两台等价机器。」
<h2>结语</h2>

207 的全部难度浓缩在一个翻译里：<strong>先修关系是有向边，修课顺序是拓扑序，环 = 永远修不完</strong>。Kahn 用入度表把「现在能修的课」显式排成队列，DFS 用三种颜色把「还没探完的路径」显式画成栈 —— 两条路都通向同一句判据：剥完（或走完）所有节点就没有环。真正拉开差距的，是<strong>方向别画反、灰黑要分清、后序记得翻</strong>这三件小事。
