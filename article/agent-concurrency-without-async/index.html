<h2>前言：并行不是为了快，是为了别让一轮卡死</h2>

先纠正一个常见误解：Agent 做并发，首要目标不是「跑得更快」。

一个 coding agent 的绝大多数时间花在两件事上：等模型返回，和等命令跑完。模型调用是串行的——你必须拿到这一轮的 <code>assistant</code> 消息，才知道要调哪些工具。所以真正能并行的窗口只有一个：<strong>同一次模型回复里给出的多个工具调用</strong>。

这个窗口很小，但它决定了体验的下限。模型一次给出四个 <code>read_file</code> 和一个 <code>grep</code>，如果串行执行，一次探索要等五倍的时间；如果其中一个 <code>run_command</code> 卡住（等一个永远不返回的服务），串行实现会把后面四个结果一起拖死。并行在这里的作用是<strong>把最慢的那个变成整批的耗时，而不是总和</strong>，同时让「一个慢工具」不再阻塞其他工具的结果。

但并行一旦引入，问题就从「快不快」变成「对不对」：结果顺序会不会错、共享状态会不会被踩、Ctrl-C 到底打在哪一层、一个线程挂了整轮会不会崩。NanoHermes 的答案很朴素：不用 async 运行时，就用 <code>std::thread::scope</code> 起线程，用一个 <code>join</code> 屏障收口，用一把计数门限制子代理数量。全文拆的就是这套朴素方案里每一处必须想清楚的地方。
<h2>结论先行：并发的四个层次</h2>

把「并行」这个词拆开，NanoHermes 里其实有四层不同的东西，混在一起谈就会得出错误结论。

<thead>
<tr>
<th>层次</th>
<th>实现</th>
<th>并发度</th>
<th>谁在等谁</th>

</thead>
<tbody>
<tr>
<td>工具级</td>
<td><code>std::thread::scope</code> 每个 <code>tool_call</code> 一个线程</td>
<td>无上限</td>
<td>主线程等全部线程 join</td>
</tr>
<tr>

<tr>
<td>命令级</td>
<td><code>run_command</code> 两个排空线程 + 25ms 轮询</td>

</tr>
<tr>
<td>进程级</td>

四层的数字完全不同：工具层没有上限，子代理层是 4，命令层是 2，进程层是 1。所以「NanoHermes 支持多少并发」这个问题没有单一答案——正确答案是「一个守护进程一次服务一个会话，一个会话一轮最多并发执行模型给出的所有工具调用，其中子代理最多 4 个同时跑」。

这四层里最容易出事的是第一层，因为它是唯一没有上限的一层。后面会专门讲。
<h2>没有 async 的世界：线程就是原语</h2>

整个并发实现依赖的标准库能力只有五个：
<div class="table-scroll"><table>
<thead>
<tr>
<th>原语</th>
<th>用在哪</th>
<th>为什么用它</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>std::thread::scope</code></td>
<td>一轮内的工具调用</td>
<td>能借用 <code>&amp;Agent</code>，不需要 <code>Arc</code></td>
</tr>
<tr>
<td><code>Mutex</code></td>
<td><code>Board</code>、<code>TaskManager</code>、<code>TodoList</code>、MCP 管道</td>
<td>保护可变状态</td>
</tr>
<tr>
<td><code>Condvar</code></td>
<td><code>Gate</code></td>
<td>许可不足时阻塞等待</td>
</tr>
<tr>
<td><code>AtomicBool</code></td>
<td><code>interrupt::INTERRUPTED</code></td>
<td>信号处理器里只能原子写</td>
</tr>
<tr>
<td><code>mpsc::channel</code></td>
<td>MCP 的请求/响应配对</td>
<td>读线程把响应投递给等待方</td>
</tr>
</tbody>
</table></div>

没有 <code>tokio</code>，没有 <code>async-std</code>，没有 <code>futures</code>。整个 <code>agent</code> crate 的依赖里找不到一个异步运行时。这在 2026 年看起来有点逆潮流，但对这个项目是合理选择——原因下一节讲。

代价也要说清楚：没有取消令牌，所以中断只能在「步骤边界」检查，一个跑着的工具没法被打断；没有 <code>select!</code>，所以「命令输出和超时哪个先到」要靠 25ms 轮询；没有结构化并发，所以一个线程 panic 只能靠 <code>join</code> 的返回值兜。
<h2>为什么不是 async：四条理由与三项代价</h2>

先讲理由，四条都是这个项目的具体约束，不是「线程更简单」这种泛泛之谈。

<strong>第一，工具几乎全是阻塞调用。</strong> <code>read_file</code> 是 <code>std::fs</code>，<code>run_command</code> 是 <code>Command::spawn</code> 加管道读取，<code>git</code> 是子进程，<code>web_fetch</code> 是 <code>ureq</code> 的同步 HTTP。这些操作在 async 里要么用 <code>spawn_blocking</code> 包起来（等于还是线程），要么换成异步版的库（<code>tokio::fs</code>、<code>reqwest</code>），后者会把依赖树扩大一个数量级。对一个「单二进制、零运行时、能塞进 5 MB 里」的 CLI 来说，这个交换不划算。

<strong>第二，并发窗口天然有界。</strong> 一次模型回复里的工具调用数量是有限的（实践中 1 到 8 个居多），而且每轮结束都要 join 全部线程才能拼消息。这意味着线程数量不会随时间累积——不存在「长连接持有线程」的问题。线程池要解决的正是「线程生命周期长于任务」的场景，这里不存在。

<strong>第三，barrier 让状态管理变简单。</strong> 因为每轮有一个 join 屏障，<code>self.messages</code> 在整个并行期间都是只读的。主线程在 <code>join</code> 全部返回之后才写历史。这一点极其重要：它意味着对话历史不需要任何锁。如果换成 async 加 <code>select!</code>，某个工具的 future 可能和历史写入交错，你就必须给历史加锁，或者引入更复杂的所有权设计。

<strong>第四，编译期就能验证。</strong> <code>Agent</code> 要能被作用域线程共享，Rust 会强制它 <code>Sync</code>。任何一个字段忘了加 <code>Mutex</code>，编译器直接报错，不会等到线上才发现数据竞争。async 方案的等价检查是 <code>Send</code>，但因为 <code>await</code> 点可以出现在任何地方，跨 <code>await</code> 持有 <code>MutexGuard</code> 这类问题编译器帮不了你。

代价同样要认：
<div class="table-scroll"><table>
<thead>
<tr>
<th>代价</th>
<th>具体表现</th>
<th>缓解方式</th>
</tr>
</thead>
<tbody>
<tr>
<td>无法中途取消</td>
<td>工具跑起来就只能等它返回</td>
<td>给命令设超时（默认 120s，上限 3600s）</td>
</tr>
<tr>
<td>线程栈开销</td>
<td>每个线程默认 2 MiB 虚拟栈</td>
<td>工具调用数量有界，实际 RSS 远小于峰值</td>
</tr>
<tr>
<td>阻塞门浪费线程</td>
<td>排队等许可的子代理占着一个 OS 线程</td>
<td>子代理上限 4，排队数受工具调用数限制</td>
</tr>
</tbody>
</table></div>

第二项值得展开：2 MiB 是虚拟地址空间，不是物理内存。Linux 上线程栈是惰性分配的，真正提交的只有实际用到的几页。所以「20 个工具线程 = 40 MB」这个算法是错的，实际 RSS 增加通常在几百 KB 量级。真正贵的不是栈，是每个线程持有的缓冲区（比如 <code>read_capped</code> 里 16 KiB 的读缓冲）。
<h2>一轮的结构：join 屏障</h2>

把并发塞进一轮的代码只有十几行，但每一行都有原因：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">results</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">vec!</span><span class="p">[</span><span class="bp">self</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">[</span><span class="mi">0</span><span class="p">])]</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 借用成 &amp;Agent，让作用域线程共享（execute 取 &amp;self，Agent 是 Sync）</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">this</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Agent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">;</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">scope</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span>
<span class="w">            </span><span class="p">.</span><span class="n">tool_calls</span>
<span class="w">            </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="w">        </span><span class="n">handles</span>
<span class="w">            </span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">h</span><span class="p">.</span><span class="n">join</span><span class="p">()</span>
<span class="w">                    </span><span class="p">.</span><span class="n">unwrap_or_else</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="s">&quot;ERROR: tool thread panicked&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span>
<span class="w">            </span><span class="p">})</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="w">    </span><span class="p">})</span>
<span class="p">};</span>
</code></pre></div>


四个设计点：

<strong>单调用走快路径。</strong> <code>tool_calls.len() == 1</code> 时不起线程，直接在当前线程执行。这是最常见的情况（模型一次只调一个工具），省掉线程创建和 join 的开销，也省掉一次 <code>Sync</code> 检查带来的心智负担。

<strong><code>this: &amp;Agent = self</code> 这行不是多余的。</strong> <code>std::thread::scope</code> 的闭包捕获的是 <code>&amp;mut self</code>（因为 <code>self</code> 是 <code>&amp;mut Agent</code>），而 <code>spawn</code> 里的闭包需要 <code>move</code>。显式重借用成 <code>&amp;Agent</code> 之后，编译器知道移动的是共享引用而不是可变引用，<code>Agent</code> 只需要满足 <code>Sync</code>。不写这行，编译器会报「cannot move out of <code>self</code>」。

<strong><code>handles.into_iter().map(join)</code> 保证了顺序。</strong> 结果向量按下标对齐 <code>tool_calls</code>，和哪个线程先跑完无关。这是下一节「结果顺序」的基础。

<strong><code>unwrap_or_else</code> 把 panic 变成字符串。</strong> <code>join</code> 返回 <code>Result</code>，线程 panic 时是 <code>Err</code>。这里不 <code>unwrap</code>，而是产出一条错误结果——理由在「一个线程 panic 了会怎样」一节。

整个结构的本质是一个<strong>每轮重建的 fork-join</strong>：起 N 个线程，等 N 个全部结束，拿 N 个字符串，拼进历史。没有线程池，没有任务队列，没有长时间存活的 worker。这种「用完就扔」的模型牺牲了创建开销（Linux 上一个线程创建约几十微秒），换来了状态管理的极大简化。

三个观察：

<strong>只有子代理有并发上限。</strong> 工具线程和守护进程都没有。前者依赖「模型给出的调用数量有限」这个经验假设，后者是明确的单线程设计。两个地方都没有硬保护。

<strong>4 这个数字的来历是资源而不是性能。</strong> 子代理每个都要独立发一次完整的模型请求，4 个并发意味着瞬时 4 份上下文在飞行。上下文预算是 120,000 字符（<code>CONTEXT_CHAR_BUDGET</code>），4 份就是 480,000 字符的内存峰值，加上每份都要序列化成 JSON 发出去。再高就开始和主对话抢内存与网络带宽。

<strong>40 轮和 4 个并发叠起来是 160。</strong> 理论上一个子代理可以跑 40 轮、每轮再发多个工具调用，四个子代理同时跑。这不是设计目标，而是上界——一个失控的子代理最多消耗 40 次模型请求，四个最多 160 次。这个上界之所以重要，是因为它给出了「一次误触发的最坏成本」。
<h2>std::thread::scope 解决了什么</h2>

普通 <code>thread::spawn</code> 要求闭包 <code>'static</code>，也就是不能借用栈上的东西。要用 <code>&amp;Agent</code>，就得把 <code>Agent</code> 塞进 <code>Arc</code>，然后每个工具调用都要 <code>Arc::clone</code>。<code>scope</code> 的作用是引入一个词法作用域：作用域内的线程可以借用作用域外的栈变量，作用域结束时自动 join 所有线程。

三个具体好处：

<strong>没有 <code>Arc</code> 开销。</strong> <code>Agent</code> 里有一个 <code>Vec&lt;Value&gt;</code> 的对话历史、一个 <code>Ctx</code>、一个可选的 MCP 管理器。包进 <code>Arc</code> 本身不贵，但 <code>Arc&lt;Agent&gt;</code> 会让每个工具都想「能不能拿可变引用」，从而诱发 <code>Arc&lt;Mutex&lt;Agent&gt;&gt;</code> 这种把整个 agent 串行化的退化设计。<code>scope</code> 强制你保持 <code>&amp;Agent</code> 共享不可变，共享可变状态只能落在 <code>Ctx</code> 内部的锁上——这恰好是正确的粒度。

<strong>作用域结束一定 join。</strong> 就算中间 <code>?</code> 提前返回，<code>scope</code> 也会在退出时等所有线程结束。这保证了「不可能有线程还在写状态而主线程已经继续」。普通 <code>spawn</code> 你需要自己维护 <code>JoinHandle</code> 列表，漏一个就是悬空的后台任务。

<strong>panic 不会泄漏线程。</strong> 线程 panic 时 <code>scope</code> 依然会 join（拿到 <code>Err</code>），不会留下一个已崩溃但未回收的线程。

需要注意 <code>scope</code> 不提供的是：<strong>线程数量限制</strong>。代码里是 <code>turn.tool_calls.iter().map(...)</code>，调用几个就起几个。模型一次返回 20 个工具调用，就起 20 个线程。这是后面「工具线程没有上限」要展开的缺陷。
<h2>为什么 Agent 必须是 Sync</h2>

<code>Agent</code> 能不能被多个线程共享，不是设计选择，是编译器的强制要求。<code>scope</code> 里 <code>this: &amp;Agent</code> 被 <code>move</code> 进闭包，闭包要 <code>Send</code>，因此 <code>&amp;Agent</code> 要 <code>Send</code>，等价于 <code>Agent: Sync</code>。

<code>Agent</code> 的字段里，只有 <code>Ctx</code> 是共享可变状态的载体：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Ctx</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">root</span><span class="p">:</span><span class="w"> </span><span class="nc">PathBuf</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">auto_approve</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">approval</span><span class="p">:</span><span class="w"> </span><span class="nc">crate</span><span class="p">::</span><span class="n">config</span><span class="p">::</span><span class="n">ApprovalPolicy</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">sandbox</span><span class="p">:</span><span class="w"> </span><span class="nc">crate</span><span class="p">::</span><span class="n">config</span><span class="p">::</span><span class="n">SandboxMode</span><span class="p">,</span>

<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">tasks</span><span class="p">:</span><span class="w"> </span><span class="nc">TaskManager</span><span class="p">,</span><span class="w">       </span><span class="c1">// Mutex&lt;HashMap&lt;String, Task&gt;&gt;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">todos</span><span class="p">:</span><span class="w"> </span><span class="nc">TodoList</span><span class="p">,</span><span class="w">          </span><span class="c1">// Mutex&lt;Vec&lt;Todo&gt;&gt;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">skills</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Skill</span><span class="o">&gt;</span><span class="p">,</span><span class="w">       </span><span class="c1">// 只读</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">board</span><span class="p">:</span><span class="w"> </span><span class="nc">Board</span><span class="p">,</span><span class="w">             </span><span class="c1">// Mutex&lt;Vec&lt;Job&gt;&gt; + Mutex&lt;u64&gt;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">gate</span><span class="p">:</span><span class="w"> </span><span class="nc">Gate</span><span class="p">,</span><span class="w">               </span><span class="c1">// Mutex&lt;usize&gt; + Condvar</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">memory_dir</span><span class="p">:</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;</span><span class="n">PathBuf</span><span class="o">&gt;</span><span class="p">,</span>

</code></pre></div>


前四个字段是不可变的（<code>root</code>、<code>auto_approve</code>、<code>approval</code>、<code>sandbox</code>），后三个是锁，<code>skills</code> 是只读。<code>memory_dir</code> 只是路径，真正的记忆库读写发生在 <code>memory.rs</code> 里，走的是文件系统——同一时刻两个线程写同一个记忆文件会有丢失更新的风险，这一点后面「不是所有工具都该并行」里还会提。

<code>Agent</code> 的其余字段——<code>messages</code>、<code>usage</code>、<code>style</code>、<code>session</code>、<code>mcp</code>——要么只在并行区之外被访问（<code>messages</code>、<code>usage</code>、<code>session</code>），要么内部自带锁（<code>mcp</code> 的 <code>Arc&lt;Mutex&lt;...&gt;&gt;</code>）。<code>style</code> 里包的 <code>UiSink</code> 是 <code>Arc&lt;dyn Fn + Send + Sync&gt;</code>，本身就是线程安全的。

这个字段划分直接决定了并发的安全性：<strong>并行区里能改的东西，只有 <code>Ctx</code> 里那五把锁保护的部分</strong>。任何需要写 <code>messages</code> 的逻辑都必须回到主线程，而主线程在 join 屏障里等着。这是「用结构换正确性」的典型做法。

逐个看这五把锁保护什么，会发现问题不是「有没有锁」，而是「锁的粒度对不对」。

争用程度最高的是后两把，但它们的临界区都只有几行——<code>Board::seq</code> 是 <code>*seq += 1</code> 加一次 <code>format!</code>，<code>Gate::active</code> 是一次比较加一次自增。真正可能长时间持有的是 <code>TaskManager.tasks</code>，因为它把「读管道」放在锁里，这一点后面专门讲。

<code>Board</code> 用两把锁而不是一把，是个值得说的细节：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Board</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">jobs</span><span class="p">:</span><span class="w"> </span><span class="nc">Mutex</span><span class="o">&lt;</span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Job</span><span class="o">&gt;&gt;</span><span class="p">,</span>
<span class="w">    </span><span class="n">seq</span><span class="p">:</span><span class="w"> </span><span class="nc">Mutex</span><span class="o">&lt;</span><span class="kt">u64</span><span class="o">&gt;</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


如果合并成一把锁，<code>start()</code> 里就要持锁做 <code>format!("agent-{seq}")</code>（一次堆分配）和 <code>task.to_string()</code>（可能很长）。分成两把之后，取号和登记各自临界区极短，而且 <code>start()</code> 里两次 <code>lock()</code> 的顺序是固定的（先 <code>seq</code> 后 <code>jobs</code>），不存在反向获取路径，所以不会死锁。

代价是「取号和登记之间不是原子的」：并发 <code>start()</code> 时可能出现 <code>agent-3</code> 先被登记、<code>agent-2</code> 后被登记的顺序。<code>list()</code> 返回的是登记顺序，所以任务板上的 id 可能不是单调递增的。这是个无害的瑕疵——id 只用来标识，不用来排序。
<h2>Mutex 粒度：为什么 Board 用两把锁</h2>

延续上一节的思路，锁粒度设计有三个层次，<code>Ctx</code> 里三种都有：

<strong>粗粒度：一把锁保护整个集合。</strong> <code>TodoList</code> 和 <code>TaskManager</code> 都是这种。<code>todo_write</code> 语义是「整体替换」，所以一把锁最自然——读和写都需要看到完整列表。

<strong>中粒度：一个逻辑实体一把锁。</strong> <code>Board</code> 把「取号」和「作业表」分开。取号是高频极短操作，作业表是低频较长操作，混在一起会让 <code>start()</code> 的临界区被 <code>task</code> 字符串的复制拖长。

<strong>细粒度：每个条目一把锁。</strong> NanoHermes 没有用这种。在 <code>TaskManager</code> 里，如果每个 <code>Task</code> 自带一把锁，<code>task_output(task1)</code> 就不会阻塞 <code>task_kill(task2)</code>。这正是 <code>TaskManager</code> 当前最大的问题——后面会展开。

判断粒度是否合适的标准不是「锁够不够细」，而是「<strong>有没有一条路径会在持锁期间做阻塞 I/O</strong>」。<code>Board</code> 的临界区全是内存操作，粒度怎么分都对；<code>TaskManager</code> 的 <code>output()</code> 在锁里调 <code>read()</code>，这时候粒度就是错的，再细也没用，必须改结构。
<h2>Condvar 与 Gate：并发门的十二行实现</h2>

限制子代理并发的是一个手写的计数信号量，全部实现不到二十行：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Gate</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">active</span><span class="p">:</span><span class="w"> </span><span class="nc">Mutex</span><span class="o">&lt;</span><span class="kt">usize</span><span class="o">&gt;</span><span class="p">,</span>
<span class="w">    </span><span class="n">cv</span><span class="p">:</span><span class="w"> </span><span class="nc">Condvar</span><span class="p">,</span>
<span class="w">    </span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">,</span>
<span class="p">}</span>

<span class="k">impl</span><span class="w"> </span><span class="n">Gate</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">new</span><span class="p">(</span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Self</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">Gate</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">active</span><span class="p">:</span><span class="w"> </span><span class="nc">Mutex</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">0</span><span class="p">),</span>
<span class="w">            </span><span class="n">cv</span><span class="p">:</span><span class="w"> </span><span class="nc">Condvar</span><span class="p">::</span><span class="n">new</span><span class="p">(),</span>
<span class="w">            </span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="nc">max</span><span class="p">.</span><span class="n">max</span><span class="p">(</span><span class="mi">1</span><span class="p">),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">acquire</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">GateGuard</span><span class="o">&lt;&#39;</span><span class="nb">_</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">active</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">active</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="w">        </span><span class="k">while</span><span class="w"> </span><span class="o">*</span><span class="n">active</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">max</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">active</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cv</span><span class="p">.</span><span class="n">wait</span><span class="p">(</span><span class="n">active</span><span class="p">).</span><span class="n">unwrap</span><span class="p">();</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="o">*</span><span class="n">active</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">        </span><span class="n">GateGuard</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">gate</span><span class="p">:</span><span class="w"> </span><span class="nc">self</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个细节值得单独说。

<strong><code>while</code> 而不是 <code>if</code>。</strong> <code>Condvar::wait</code> 可能被虚假唤醒（spurious wakeup），返回时条件不一定成立。用 <code>while</code> 循环重新检查是标准写法。很多教程用 <code>if</code>，在 Linux 上通常也能跑，但那是运气。

<strong><code>max.max(1)</code>。</strong> 配置成 0 会被抬成 1，否则 <code>acquire()</code> 永远等不到许可，整轮死锁。这是一个「宁可多跑一个，也不要卡死」的降级选择。

<strong><code>GateGuard</code> 用 <code>Drop</code> 还许可。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">impl</span><span class="w"> </span><span class="nb">Drop</span><span class="w"> </span><span class="k">for</span><span class="w"> </span><span class="n">GateGuard</span><span class="o">&lt;&#39;</span><span class="nb">_</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">fn</span><span class="w"> </span><span class="nf">drop</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">active</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">gate</span><span class="p">.</span><span class="n">active</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="w">        </span><span class="o">*</span><span class="n">active</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">active</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="mi">1</span><span class="p">);</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">gate</span><span class="p">.</span><span class="n">cv</span><span class="p">.</span><span class="n">notify_one</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>Drop</code> 保证四条路径都会还许可：正常返回、<code>?</code> 提前返回、<code>panic</code> 展开、以及 <code>run_subagent</code> 里 <code>match</code> 的任一个分支。这是 RAII 在并发里最重要的价值——不需要在每条返回路径上手写 <code>release()</code>。

<code>notify_one</code> 而不是 <code>notify_all</code>：每次释放只多出一个空位，唤醒一个等待者正好。用 <code>notify_all</code> 会造成「惊群」——所有等待者醒来抢同一把锁，只有一个能拿到许可，其余重新睡回去。
<h2>门的位置错了：先登记后排队</h2>

<code>Gate</code> 的实现是对的，但它的<strong>调用位置</strong>有问题：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">run_subagent</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">start</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">);</span><span class="w">   </span><span class="c1">// 先登记</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">_permit</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">gate</span><span class="p">.</span><span class="n">acquire</span><span class="p">();</span><span class="w">       </span><span class="c1">// 再排队</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_subagent_inner</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">);</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="o">&amp;</span><span class="n">result</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">text</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">finish_ok</span><span class="p">(</span><span class="o">&amp;</span><span class="n">id</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">),</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">err</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">finish_err</span><span class="p">(</span><span class="o">&amp;</span><span class="n">id</span><span class="p">,</span><span class="w"> </span><span class="n">err</span><span class="p">),</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">result</span>
<span class="p">}</span>
</code></pre></div>


<code>start()</code> 在前，<code>acquire()</code> 在后。后果有两个：

<strong>第一，任务板上的状态是假的。</strong> <code>Board::start</code> 把新作业登记成 <code>JobStatus::Running</code>。但如果此刻已经跑着 4 个子代理，第 5 个会卡在 <code>acquire()</code> 上——它一行代码都没执行，任务板却显示 <code>[running]</code>。模型调 <code>agent_list</code> 看到的是一排 <code>running</code>，其中有一半在排队。它无从区分「真在跑」和「在等许可」。

<strong>第二，<code>duration</code> 把排队时间算进去了。</strong> <code>Job</code> 里的 <code>started: Instant</code> 在 <code>start()</code> 时记录，<code>finish()</code> 里用 <code>job.started.elapsed()</code> 算时长。所以一个排队 30 秒、实际执行 2 秒的子代理，任务板会显示 32.0s。这个数字会误导任何基于任务板做的性能判断。

修法很简单：加一个 <code>Queued</code> 状态，并让 <code>start()</code> 接受状态参数。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">enqueue</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">);</span><span class="w">   </span><span class="c1">// 登记为 Queued</span>
<span class="kd">let</span><span class="w"> </span><span class="n">_permit</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">gate</span><span class="p">.</span><span class="n">acquire</span><span class="p">();</span>
<span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">mark_running</span><span class="p">(</span><span class="o">&amp;</span><span class="n">id</span><span class="p">);</span><span class="w">              </span><span class="c1">// 拿到许可再改状态</span>
</code></pre></div>


同时把 <code>started</code> 的赋值挪到 <code>mark_running</code> 里，<code>duration</code> 就只算执行时间。改动不超过 20 行，但让任务板从「大致对」变成「可以直接用来判断卡在哪」。

为什么原实现会写成这样？因为最自然的顺序是「先登记再干活」——你要先有 id 才能结算。而门是后来加的，加的时候就在登记的下一行插了一句 <code>acquire()</code>，没有人回头看状态机的语义。这是并发改造中最常见的错误类型：<strong>在已有流程里插入一个阻塞点，但没有重新检查这个阻塞点上游已经做了什么</strong>。
<h2>子代理：并行的第一类真实用户</h2>

工具调用并行是「同一批里各干各的」，子代理是「同一个任务分给几个人」。两者的区别在于子代理内部还会再发起模型请求和工具调用。

一个子代理的完整生命周期：
<div class="table-scroll"><table>
<thead>
<tr>
<th>阶段</th>
<th>代码</th>
<th>共享状态</th>
</tr>
</thead>
<tbody>
<tr>
<td>登记</td>
<td><code>board.start(name, task)</code></td>
<td><code>Board.jobs</code>、<code>Board.seq</code></td>
</tr>
<tr>
<td>排队</td>
<td><code>gate.acquire()</code></td>
<td><code>Gate.active</code></td>
</tr>
<tr>
<td>组配置</td>
<td><code>self.cfg.clone()</code> + 模型覆盖 + 关流式</td>
<td>无（纯本地）</td>
</tr>
<tr>
<td>组工具</td>
<td><code>build_tools()</code> 按 <code>allowed_tools</code> 过滤，去掉 <code>subagent</code></td>
<td>无</td>
</tr>
<tr>
<td>组消息</td>
<td>一条 system（子代理 prompt）+ 一条 user（任务）</td>
<td>无</td>
</tr>
<tr>
<td>循环</td>
<td><code>llm::chat</code> → 执行工具 → 追加结果，最多 40 轮</td>
<td><code>Ctx</code> 的五把锁</td>
</tr>
<tr>
<td>结算</td>
<td><code>finish_ok</code> / <code>finish_err</code></td>
<td><code>Board.jobs</code></td>
</tr>
</tbody>
</table></div>

关键点在于<strong>子代理不持有父代理的对话历史</strong>。它只拿到两样东西：自己的 system prompt（来自配置文件的 <code>prompt</code> 字段）和一句任务描述。这是子代理能真正并行的前提——如果它要继承父对话，四个子代理就要各自复制一份 120,000 字符的历史，内存和 token 成本会立刻爆炸。

代价是信息不对称：子代理不知道父代理之前试过什么、失败了什么。所以 <code>subagent</code> 工具的描述里写着「用于评审、测试、调研，或者任何能从专注专家中获益的任务」——它适合「有明确输入输出的独立子任务」，不适合「接着上一步继续改」。

<code>Board</code> 记录了每个子代理的任务原文和结果预览（500 字符），父代理通过 <code>agent_list</code> 能看到一张进度表：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">job</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">jobs</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">duration</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">job</span><span class="p">.</span><span class="n">duration</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Some</span><span class="p">(</span><span class="n">d</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{:.1}s&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">d</span><span class="p">.</span><span class="n">as_secs_f64</span><span class="p">()),</span>
<span class="w">        </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="s">&quot;…&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;- {} [{}] {} ({}) — {}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="n">job</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">        </span><span class="n">job</span><span class="p">.</span><span class="n">status</span><span class="p">.</span><span class="n">as_str</span><span class="p">(),</span>
<span class="w">        </span><span class="n">job</span><span class="p">.</span><span class="n">name</span><span class="p">,</span>
<span class="w">        </span><span class="n">duration</span><span class="p">,</span>
<span class="w">        </span><span class="n">job</span><span class="p">.</span><span class="n">task</span>
<span class="w">    </span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


这张表的设计意图是「让模型自己判断要不要继续等」。如果两个子代理都 <code>done</code>，一个还 <code>running</code> 且已经 40 秒，模型可以选择先处理已完成的结果。这是把调度权交回模型，而不是在代码里写死「等全部完成」。
<h2>子代理内部为什么又是串行</h2>

<code>run_subagent_inner</code> 里的工具循环是串行的，代码里还专门写了一行注释：
<div class="codehilite"><pre><span></span><code><span class="c1">// 子代理的工具调用按顺序执行（子代理本身已经受限）。</span>
<span class="k">for</span><span class="w"> </span><span class="n">call</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">);</span>
<span class="w">    </span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;tool_call_id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">call</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">out</span><span class="p">,</span>
<span class="w">    </span><span class="p">}));</span>
<span class="p">}</span>
</code></pre></div>


理由有三条，都成立：

<strong>第一，嵌套并行会指数放大线程数。</strong> 父代理起 4 个子代理，每个子代理再起 5 个工具线程，就是 24 个线程。如果子代理还能再分子代理（代码里已经把 <code>subagent</code> 工具过滤掉了，所以不会），理论上是 4 的幂。串行是一种「在嵌套层主动降级」的策略。

<strong>第二，子代理的工具调用数量通常很少。</strong> 子代理是「专注专家」，它的 prompt 会把任务收窄，所以一轮里往往只有一两个工具调用。并行的收益本来就小。

<strong>第三，也是真正的原因：子代理本身已经并行了。</strong> 四个子代理同时跑，每个内部串行——总并发度是 4，已经吃满了这部分收益。再往内层并行，收益递减而复杂度和线程数线性增长。

代价也要认：如果一个子代理内部串行跑了 5 个各 20 秒的命令，它就要 100 秒；这四个子代理里最慢的那个决定整轮耗时。所以「子代理内部串行」这个决定，把最坏情况从「最慢的单个工具」变成了「最慢的子代理内部工具之和」。

这条注释里还藏着一个措辞问题：原文是英文 <code>(sub-agents are bounded)</code>，「bounded」指的是并发度受限，但读起来容易被理解成「子代理的工具调用数量有上限」——实际上没有。子代理的工具调用数量和父代理一样，完全由模型输出决定。注释应该写成「子代理的并发度已经由 Gate 限制，内部再并行会放大线程数」。
<h2>子代理的四处越界：中断、上限、模型、白名单</h2>

子代理虽然共享 <code>&amp;self</code>，但有四处「以为继承了，其实没有」的地方，每一处都是真实的行为差异。

<strong>第一处：中断。</strong> 父代理的 <code>run()</code> 每轮开头检查 <code>crate::interrupt::take()</code>，但 <code>run_subagent_inner</code> 的循环里<strong>没有任何中断检查</strong>。这意味着 Ctrl-C 之后：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="n">sub_cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">llm</span><span class="p">::</span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="n">sub_cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">tools</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{})</span><span class="o">?</span><span class="p">;</span><span class="w">   </span><span class="c1">// 没有 take()</span>
<span class="w">    </span><span class="c1">// …执行工具…</span>
<span class="p">}</span>
</code></pre></div>


子代理会继续把剩下的轮次跑完，最多 40 次模型请求。父代理只能等 <code>execute()</code> 返回，才能在下一轮边界看到中断标志。用户按了 Ctrl-C，界面可能还要再等几十秒。

修法：在子代理循环开头加一行 <code>if crate::interrupt::take() { break; }</code>。但要注意这会「消费」掉标志——父代理的下一轮检查就看不到了。正确做法是加一个 <code>peek()</code>（只读不清），或者让子代理在检测到中断时重新 <code>request()</code> 一次再 <code>break</code>。

<strong>第二处：轮次上限。</strong> 子代理用的是 <code>sub_cfg.max_iterations</code>，而 <code>sub_cfg</code> 是 <code>self.cfg.clone()</code>，也就是<strong>父代理的 40 轮</strong>。子代理没有独立的上限配置。这意味着「一个子代理最多跑 40 轮」是硬编码出来的，不能调。合理的做法是给 <code>SubAgentDef</code> 加一个 <code>max_iterations</code> 字段，默认取一个小得多的值（比如 10），因为专注子任务本来就不该长跑。

<strong>第三处：模型覆盖只作用于模型调用。</strong> <code>sub_cfg.model</code> 覆盖了模型名，但工具执行走的是 <code>self.execute(call)</code>，用的是<strong>父代理的 <code>Ctx</code></strong>：同一个 <code>max_output</code>、同一个 <code>auto_approve</code>、同一个 <code>sandbox</code>、同一个任务板。这是对的——工具行为应该一致——但会导致一个反直觉的结果：子代理配置了「便宜的小模型」，但它的工具输出仍然按父代理的 20,000 字节预算返回，小模型可能根本读不完。

<strong>第四处，也是最严重的一处：<code>allowed_tools</code> 只是广告，不是闸门。</strong> 子代理的工具列表是这样过滤的：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">tool_list</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">def</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">all_tools</span>
<span class="w">        </span><span class="p">.</span><span class="n">as_array</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">cloned</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">unwrap_or_default</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* tname 在 def.allowed_tools 里 */</span><span class="w"> </span><span class="p">})</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">all_tools</span><span class="p">.</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">()</span>
<span class="p">};</span>
</code></pre></div>


它只影响<strong>发给模型看的工具列表</strong>。真正的执行前检查是 <code>self.cfg.check_tool(&amp;call.name)</code>，用的是<strong>父代理的</strong>允许/禁止列表，和 <code>def.allowed_tools</code> 毫无关系。所以只要模型输出了 <code>run_command</code> 这个工具名（哪怕它没被广告出去），并且父配置允许，命令就会真的执行。

模型会不会输出没被广告的工具名？正常情况下不会，但它会——历史里出现过、别的子代理用过、或者纯粹幻觉。这是个「靠模型自律」的边界，而白名单的意义正是<strong>不靠模型自律</strong>。

修法很直接：把 <code>allowed_tools</code> 传进执行路径。最小改动是在 <code>execute</code> 上加一个可选的白名单参数，或者给子代理包一层 <code>Ctx</code> 的子视图（把 <code>Ctx</code> 的字段变成可覆盖的）。后者更干净，但要改 <code>Ctx</code> 的结构，是几小时而不是几分钟的工作。
<h2>工具线程没有上限</h2>

回到第一层。这一层的并发度是 <code>turn.tool_calls.len()</code>，代码里没有任何上限：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span>
<span class="w">    </span><span class="p">.</span><span class="n">tool_calls</span>
<span class="w">    </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">    </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
</code></pre></div>


模型一次返回几个，就起几个线程。这个数字完全由模型输出决定，而模型输出又受工具数量和上下文长度影响。理论上一个「读 30 个文件」的批量任务会让模型一次给出 30 个 <code>read_file</code> 调用。

为什么没加上限？因为实践里几乎不会发生：模型的输出长度有限，而每个工具调用都要占几十个 token 的 JSON，30 个调用就要吃掉一两千 token。大多数模型在生成这么多调用之前就会先停下来观察结果。

但这个「几乎不会发生」有个例外：<strong>模型被提示词要求批量操作时</strong>。比如你在 <code>AGENTS.md</code> 里写「一次性读完全部相关文件」，模型就可能真的生成 20 个调用。这时候：
<div class="table-scroll"><table>
<thead>
<tr>
<th>风险</th>
<th>表现</th>
</tr>
</thead>
<tbody>
<tr>
<td>线程数暴涨</td>
<td>20 个线程各自持有 16 KiB 读缓冲 + 文件内容</td>
</tr>
<tr>
<td>文件描述符耗尽</td>
<td>每个 <code>read_file</code> 开一个 fd，20 个并发没问题，200 个就可能触顶</td>
</tr>
<tr>
<td>输出总量失控</td>
<td>20 个结果各 20,000 字节，一次拼进历史就是 400,000 字节</td>
</tr>
</tbody>
</table></div>

第三项最危险，因为它和上下文预算的交互不直观：<code>clamp</code> 保证单个工具输出不超过 20,000 字节，但<strong>没有保证一次批次的输出总量</strong>。20 个结果拼起来可以让 <code>messages</code> 直接超过 <code>CONTEXT_CHAR_BUDGET (120,000)</code>，触发一次压缩——那次压缩又要多一次模型请求来生成摘要。

修法不是简单地给线程数设个 8，而是<strong>给批次输出设总量预算</strong>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">total_budget</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">40_000</span><span class="p">;</span><span class="w">   </span><span class="c1">// 一次批次的输出总和</span>
<span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">used</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="k">usize</span><span class="p">;</span>
<span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">call</span><span class="p">,</span><span class="w"> </span><span class="n">result</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">zip</span><span class="p">(</span><span class="n">results</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">remain</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">total_budget</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">used</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">trimmed</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">clamp</span><span class="p">(</span><span class="n">result</span><span class="p">,</span><span class="w"> </span><span class="n">remain</span><span class="p">);</span>
<span class="w">    </span><span class="n">used</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">trimmed</span><span class="p">.</span><span class="n">len</span><span class="p">();</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="p">}</span>
</code></pre></div>


线程数上限仍然值得加（比如 16），但它防的是资源耗尽，输出预算防的是上下文爆炸。两个问题不能用一个数字解决。
<h2>结果顺序：为什么必须按调用顺序回填</h2>

<code>handles.into_iter().map(join)</code> 的顺序就是 <code>tool_calls</code> 的顺序，所以结果向量天然对齐。这个「天然」是设计出来的，不是巧合。

为什么必须对齐？因为回填历史时是 <code>zip</code>：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">call</span><span class="p">,</span><span class="w"> </span><span class="n">result</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">zip</span><span class="p">(</span><span class="n">results</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">tool_call</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">summarize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">arguments</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="n">result</span><span class="p">);</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;tool_call_id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">call</span><span class="p">.</span><span class="n">id</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">result</span><span class="p">,</span>
<span class="w">    </span><span class="p">}));</span>
<span class="p">}</span>
</code></pre></div>


这里 <code>zip</code> 依赖两个向量<strong>长度相等且顺序一致</strong>。如果并发实现用了 <code>mpsc::channel</code> 收集结果（先完成的先投递），顺序就会变成完成顺序。后果不是「结果稍微乱一点」，而是 OpenAI 协议层面的硬错误：每条 <code>tool</code> 消息的 <code>tool_call_id</code> 必须对应上一条 <code>assistant</code> 消息里某个 <code>tool_calls[].id</code>，顺序错了模型会收到错配的结果——它以为自己在看 <code>read_file</code> 的输出，实际拿到的是 <code>grep</code> 的。

更隐蔽的后果：如果实现用了 <code>join</code> 但把结果 <code>filter</code> 掉了空值，两个向量长度不等，<code>zip</code> 会静默截断——最后一条工具调用<strong>没有对应的 tool 消息</strong>。下一次请求发出去就是 400，错误信息是「tool_calls must be followed by tool messages」，而这时你已经在几百行之外了。

所以这里有三条硬规则：
<div class="table-scroll"><table>
<thead>
<tr>
<th>规则</th>
<th>原因</th>
<th>违反后</th>
</tr>
</thead>
<tbody>
<tr>
<td>每个 <code>tool_call</code> 恰好一条 <code>tool</code> 消息</td>
<td>协议要求成对</td>
<td>下次请求 400</td>
</tr>
<tr>
<td>顺序与 <code>tool_calls</code> 一致</td>
<td><code>zip</code> 按位置匹配</td>
<td>结果错配，模型基于错误信息推理</td>
</tr>
<tr>
<td>结果永远返回字符串，不返回空</td>
<td><code>zip</code> 会截断</td>
<td>同上</td>
</tr>
</tbody>
</table></div>

第三条正是 <code>unwrap_or_else(|_| "ERROR: tool thread panicked")</code> 存在的原因——panic 也要产出一条字符串，保持成对。
<h2>一个线程 panic 了会怎样</h2>

<code>join()</code> 返回 <code>Result&lt;T, Box&lt;dyn Any&gt;&gt;</code>，线程 panic 时是 <code>Err</code>。代码选择把它变成一条错误字符串：
<div class="codehilite"><pre><span></span><code><span class="n">h</span><span class="p">.</span><span class="n">join</span><span class="p">().</span><span class="n">unwrap_or_else</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="s">&quot;ERROR: tool thread panicked&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span>
</code></pre></div>


这个选择意味着：<strong>一个工具的 panic 不会让整轮失败</strong>。其余工具的结果照常回填，模型会看到某一条结果是「ERROR: tool thread panicked」，然后自己决定要不要重试。

这是对的设计，但有一个重要的前提：<strong>panic 时锁不能处于中毒状态</strong>。<code>std::sync::Mutex</code> 的语义是，持锁线程 panic 会让锁「中毒」，后续 <code>lock()</code> 返回 <code>Err(PoisonError)</code>。而代码里到处是 <code>.lock().unwrap()</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">jobs</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">jobs</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
</code></pre></div>


一旦某个工具在持 <code>Board.jobs</code> 时 panic，之后所有 <code>agent_list</code> 调用都会 panic——从「一个工具失败」升级成「任务板永久不可用」。

好消息是这些锁的临界区都很短，而且全是纯内存操作，panic 的概率极低（<code>format!</code> 分配失败、切片越界）。真正的风险在 <code>TaskManager</code>，因为它在锁里做 I/O——一次管道读取 panic 就能毒死整个任务表。

修法有两种：把 <code>.unwrap()</code> 换成 <code>.unwrap_or_else(|e| e.into_inner())</code>（忽略中毒，继续用可能不一致的数据），或者改用 <code>parking_lot::Mutex</code>（不中毒）。前者零依赖，后者更干净。对一个「工具 panic 已经降级成字符串」的系统来说，忽略中毒是更合适的选择——数据不一致的风险远小于「整个功能永久失效」。
<h2>不是所有工具都该并行</h2>

并行是默认行为，但有些工具组合并行会出错。这不是实现缺陷，而是「工具语义里隐含了顺序」。
<div class="table-scroll"><table>
<thead>
<tr>
<th>组合</th>
<th>问题</th>
<th>后果</th>
</tr>
</thead>
<tbody>
<tr>
<td>两个 <code>edit_file</code> 改同一个文件</td>
<td>各自读全文、改、写回</td>
<td>后写覆盖先写，丢失一处修改</td>
</tr>
<tr>
<td><code>write_file</code> + <code>read_file</code> 同一文件</td>
<td>读到的可能是旧内容</td>
<td>模型基于旧内容做判断</td>
</tr>
<tr>
<td>两个 <code>todo_write</code></td>
<td>语义是整体替换</td>
<td>后到的列表完全覆盖先到的</td>
</tr>
<tr>
<td>两个 <code>run_command</code> 同时要审批</td>
<td>共用一份 stdin</td>
<td>提示交错，答案错配</td>
</tr>
<tr>
<td><code>git_commit</code> + <code>edit_file</code></td>
<td>提交的内容不确定</td>
<td>提交了半成品</td>
</tr>
</tbody>
</table></div>

第一项是最容易踩的。<code>edit_file</code> 的语义是「读全文 → 替换 → 写回」，两个并发调用必然产生丢失更新。而模型完全可能在一轮里给出「改 A 文件第 10 行」和「改 A 文件第 20 行」两个调用——它以为这是两个独立操作，实际上是一个读-改-写竞争。

代码层面没有任何保护：<code>edit_file</code> 里既不锁文件，也不检查 mtime。所以这不是「理论风险」，而是「只要模型这么干就一定出错」。

修法有三档：

<strong>第一档（最省事）：在工具描述里写清约束。</strong> <code>edit_file</code> 的描述里加一句「同一个文件的多处修改请合并成一次调用」。这依赖模型遵守，但成本为零，能消掉大部分情况。

<strong>第二档（中等）：在 <code>dispatch</code> 层做同文件串行化。</strong> 维护一个 <code>HashMap&lt;PathBuf, Mutex&lt;()&gt;&gt;</code>，<code>edit_file</code>/<code>write_file</code>/<code>apply_patch</code> 进入时先拿对应文件的锁。改动约 30 行，能彻底消除丢失更新。

<strong>第三档（最彻底）：给每个 <code>tool_call</code> 标一个「资源」标签，同资源串行、异资源并行。</strong> 这是真正正确的方案，但需要给 24 个工具都标注资源，工作量大。对一个 20 多个工具的项目，第二档是性价比最高的。

顺带说一句：<code>todo_write</code> 的「整体替换」语义在并行下还有个额外问题——两个并发的 <code>todo_write</code> 谁赢取决于调度，而模型看到的结果里两条都返回了「已写入」，它会以为自己成功更新了两次。这类「都成功但只有一个生效」的情况，是最难查的一类并发问题。
<h2>并发下的审批：stdin 只有一份</h2>

<code>run_command</code> 在执行前可能要求确认：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">sandbox</span><span class="p">::</span><span class="n">needs_approval</span><span class="p">(</span><span class="n">ctx</span><span class="p">.</span><span class="n">auto_approve</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">.</span><span class="n">approval</span><span class="p">,</span><span class="w"> </span><span class="n">command</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">confirm</span><span class="p">(</span><span class="n">command</span><span class="p">)</span>
<span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="s">&quot;Command denied by the user. Do not retry it; ask what to do instead.&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">());</span>
<span class="p">}</span>
</code></pre></div>


<code>confirm()</code> 的实现是读一行 stdin：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">confirm</span><span class="p">(</span><span class="n">command</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">eprint!</span><span class="p">(</span><span class="s">&quot;Run this command? [y/N] {command}</span><span class="se">\n</span><span class="s">&gt; &quot;</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">io</span><span class="p">::</span><span class="n">stderr</span><span class="p">().</span><span class="n">flush</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">line</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">io</span><span class="p">::</span><span class="n">stdin</span><span class="p">().</span><span class="n">read_line</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">line</span><span class="p">).</span><span class="n">is_err</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="fm">matches!</span><span class="p">(</span><span class="n">line</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">to_ascii_lowercase</span><span class="p">().</span><span class="n">as_str</span><span class="p">(),</span><span class="w"> </span><span class="s">&quot;y&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;yes&quot;</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


如果一轮里有两个 <code>run_command</code> 都需要确认，两个线程会同时进 <code>confirm()</code>。后果：

<strong>提示交错。</strong> 两个 <code>eprint!</code> 会混在一起，用户看到的是两行粘在一起的提示，分不清哪个是哪个命令。

<strong>答案错配。</strong> 两个线程都在 <code>read_line</code>，用户输入一个 <code>y</code>，可能被任意一个线程读走。另一个线程继续等，用户以为已经确认过了，实际上第一条命令还没跑。

<strong>在非交互环境直接失败。</strong> stdin 不是 TTY 时（CI、管道），<code>read_line</code> 会返回 EOF 或者读到无关数据，两条命令都被拒。

这不是一个理论问题。默认配置下 <code>needs_approval</code> 对危险命令返回 true，而模型完全可能一次给出「跑测试」和「跑构建」两个命令。

修法：把审批收到主线程。并行区里遇到需要审批的调用，先挂起（返回一个「待审批」标记），等所有线程 join 之后，主线程串行地一个个问，问完再补跑。这需要把 <code>execute</code> 拆成「可并行部分」和「需审批部分」两段，改动不小。

低成本替代方案：加一把全局的 <code>Mutex&lt;()&gt;</code> 把 <code>confirm()</code> 包起来。这样提示不会交错，但「等用户输入时整轮卡住」的问题还在——只是从「互相踩」变成「排队踩」。对交互式 CLI 来说这已经够用了，因为用户输入本来就是串行的。
<h2>后台任务：另一种并发</h2>

前面的并发都是「同时做，然后一起收」。后台任务是另一种：<strong>先返回，稍后再收</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">spawn</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">command</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">cwd</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">,</span><span class="w"> </span><span class="n">sandbox</span><span class="p">:</span><span class="w"> </span><span class="nc">SandboxMode</span><span class="p">,</span><span class="w"> </span><span class="n">workspace</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">)</span>
<span class="w">    </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">cmd</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">super</span><span class="p">::</span><span class="n">shell</span><span class="p">::</span><span class="n">shell_command</span><span class="p">(</span><span class="n">command</span><span class="p">);</span>
<span class="w">    </span><span class="n">cmd</span><span class="p">.</span><span class="n">current_dir</span><span class="p">(</span><span class="n">cwd</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">stdin</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">null</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">stdout</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">piped</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">stderr</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">piped</span><span class="p">());</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">child</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cmd</span><span class="p">.</span><span class="n">spawn</span><span class="p">().</span><span class="n">map_err</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;failed to start shell: {e}&quot;</span><span class="p">))</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">tasks</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">insert</span><span class="p">(</span><span class="n">id</span><span class="p">.</span><span class="n">clone</span><span class="p">(),</span><span class="w"> </span><span class="n">task</span><span class="p">);</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">id</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


<code>spawn</code> 立即返回一个 task id，模型可以用 <code>task_output</code> 轮询、用 <code>task_kill</code> 终止。这解决了一类具体问题：跑测试、跑构建、起开发服务器——这些命令要几十秒到几分钟，阻塞在一轮里既浪费上下文（模型只能干等），又可能超时。

但这个模块有两个真实缺陷，都是并发相关的，且都不是「理论风险」。
<h2>后台任务的第一个缺陷：stderr 从未被读走</h2>

<code>spawn</code> 里给 stderr 也接了管道：
<div class="codehilite"><pre><span></span><code><span class="p">.</span><span class="n">stderr</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">piped</span><span class="p">());</span>
</code></pre></div>


但 <code>output()</code> 只排空 stdout：
<div class="codehilite"><pre><span></span><code><span class="c1">// 排空 stdout。</span>
<span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">child</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">task</span><span class="p">.</span><span class="n">child</span><span class="p">.</span><span class="n">as_mut</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="p">.</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">total</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">);</span>
<span class="w">        </span><span class="n">task</span><span class="p">.</span><span class="n">out_buf</span><span class="p">.</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">kept</span><span class="p">);</span>
<span class="w">        </span><span class="n">task</span><span class="p">.</span><span class="n">out_total</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">total</span><span class="p">;</span>
<span class="w">        </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">out</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 检查是否结束。</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">try_wait</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* … */</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


stderr 的管道从头到尾没有任何人读。后果分两步：

<strong>第一步：stderr 写满 64 KiB 时子进程阻塞。</strong> 管道的内核缓冲区默认 64 KiB（Linux）。子进程往 stderr 写满 64 KiB 之后，<code>write</code> 系统调用就会阻塞，直到有人读走。而没有人读，所以它永远不会解除。

<strong>第二步：任务永远不结束，<code>task_output</code> 永远显示 running。</strong> 而且此时 stdout 也没有新数据，<code>task_output</code> 返回 <code>(no output yet)</code>。模型会以为任务还在跑，继续等——直到轮次上限。

哪些命令会踩到？任何 stderr 输出超过 64 KiB 的：<code>cargo build</code> 的编译警告、<code>npm install</code> 的进度条、<code>pytest -v</code> 的失败堆栈。这些恰好是后台任务最常用的场景。

修法很直接：起一个线程排空 stderr，把内容追加到独立的缓冲区（或者合并到 <code>out_buf</code> 并标注来源）。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">stderr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stderr</span><span class="p">.</span><span class="n">take</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">buf</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">clone</span><span class="p">(</span><span class="o">&amp;</span><span class="n">shared_err_buf</span><span class="p">);</span>
<span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">_total</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="n">stderr</span><span class="p">);</span>
<span class="w">    </span><span class="n">buf</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">kept</span><span class="p">);</span>
<span class="p">});</span>
</code></pre></div>


这正好是 <code>shell.rs</code> 对前台命令做的事——同一个问题，两处实现，一处对一处错。后台任务这里大概是「先实现最小可用版本，后来忘了补」。
<h2>后台任务的第二个缺陷：在锁里读到 EOF</h2>

第二个缺陷更隐蔽，因为它藏在 <code>read_capped</code> 的循环条件里：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">output</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">task_id</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">map</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">tasks</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span><span class="w">          </span><span class="c1">// ← 持锁</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">task</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">map</span><span class="p">.</span><span class="n">get_mut</span><span class="p">(</span><span class="n">task_id</span><span class="p">).</span><span class="n">ok_or_else</span><span class="p">(</span><span class="err">…</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">child</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">task</span><span class="p">.</span><span class="n">child</span><span class="p">.</span><span class="n">as_mut</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="p">.</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">total</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">);</span><span class="w"> </span><span class="c1">// ← 在锁里阻塞读</span>
<span class="w">            </span><span class="c1">// …</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="p">}</span>
</code></pre></div>


<code>read_capped</code> 的循环是「一直读到 <code>Ok(0)</code>（EOF）或者出错」。对于一个<strong>还在运行且暂时没有输出</strong>的后台任务，stdout 是打开的、没有数据，<code>read()</code> 会<strong>阻塞</strong>——它既不返回 0，也不返回错误，就一直等下去。

所以：<code>task_output(task-1)</code> 在一个安静运行的任务上会挂住（直到那个任务产生输出或退出）。而在挂住期间，<code>self.tasks</code> 的锁一直被持有，于是：
<div class="table-scroll"><table>
<thead>
<tr>
<th>操作</th>
<th>结果</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>task_list</code></td>
<td>阻塞（等锁）</td>
</tr>
<tr>
<td><code>task_kill</code></td>
<td>阻塞（等锁）</td>
</tr>
<tr>
<td>新的 <code>run_command(background=true)</code></td>
<td>阻塞（等锁）</td>
</tr>
<tr>
<td>另一个 <code>task_output</code></td>
<td>阻塞（等锁）</td>
</tr>
</tbody>
</table></div>

一次「看一眼有没有输出」的轮询，把整个后台任务子系统冻住了。这是个典型的<strong>在临界区里做阻塞 I/O</strong> 的错误——锁的粒度本身没错，错的是锁里放了不该放的东西。

这也解释了为什么前台 <code>run_command</code> 没这个问题：它把读管道放在<strong>独立线程</strong>里（<code>let out_thread = std::thread::spawn(move || read_capped(out_pipe))</code>），主线程只做 25ms 轮询 <code>try_wait()</code>，从不阻塞在读上。同一份 <code>read_capped</code>，放在线程里就是对的，放在锁里就是错的。

修法：把「读」移到线程里，锁里只做「取缓冲区快照」。
<div class="codehilite"><pre><span></span><code><span class="c1">// spawn 时就起好两个读线程，持续把数据写进 Arc&lt;Mutex&lt;Vec&lt;u8&gt;&gt;&gt;</span>
<span class="c1">// output() 只做：</span>
<span class="kd">let</span><span class="w"> </span><span class="n">map</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">tasks</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">task</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">map</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="n">task_id</span><span class="p">).</span><span class="n">ok_or_else</span><span class="p">(</span><span class="err">…</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="kd">let</span><span class="w"> </span><span class="n">text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">task</span><span class="p">.</span><span class="n">buf</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">clone</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">finished</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">task</span><span class="p">.</span><span class="n">child</span><span class="p">.</span><span class="n">try_wait</span><span class="p">()</span><span class="err">…</span><span class="p">;</span>
</code></pre></div>


这样 <code>output()</code> 的临界区只有内存拷贝，不会再阻塞。
<h2>管道背压：最容易误判成死锁的现象</h2>

上面两个缺陷的共同根源是<strong>管道背压</strong>（backpressure）：管道的缓冲区有限，写满之后写方阻塞，直到读方取走数据。

这个机制在并发代码里制造了一类特别难查的现象：<strong>程序看起来死锁了，其实是有一方在等另一方，而另一方在等一个永远不会到来的读</strong>。

三种典型形态：
<div class="table-scroll"><table>
<thead>
<tr>
<th>形态</th>
<th>表现</th>
<th>根因</th>
</tr>
</thead>
<tbody>
<tr>
<td>只读 stdout 不读 stderr</td>
<td>命令卡住，stdout 无输出</td>
<td>stderr 写满 64 KiB</td>
</tr>
<tr>
<td>持锁读管道</td>
<td>所有任务操作卡住</td>
<td>锁被一个阻塞的 <code>read</code> 持有</td>
</tr>
<tr>
<td>先 wait 再 read</td>
<td>命令永不结束</td>
<td>输出写满缓冲区，子进程无法退出</td>
</tr>
</tbody>
</table></div>

第三种是经典错误，也是 <code>shell.rs</code> 里那行注释存在的原因：
<div class="codehilite"><pre><span></span><code><span class="c1">// 两个管道各用一个线程排空，这样喋喋不休的子进程永远不会因为写满</span>
<span class="c1">// OS 管道缓冲、而我们还在等它退出，造成死锁。</span>
<span class="kd">let</span><span class="w"> </span><span class="n">out_pipe</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="p">.</span><span class="n">take</span><span class="p">().</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;stdout piped&quot;</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">err_pipe</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stderr</span><span class="p">.</span><span class="n">take</span><span class="p">().</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;stderr piped&quot;</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">out_thread</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="n">out_pipe</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">err_thread</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="n">err_pipe</span><span class="p">));</span>
</code></pre></div>


如果写成「先 <code>child.wait()</code> 拿到退出码，再读管道」，一个输出超过 64 KiB 的命令会：子进程写满缓冲区 → 阻塞在 write → 永远不退出 → <code>wait()</code> 永远返回不了 → 你永远走不到读管道那一行。循环等待，真正的死锁。

正确顺序只有一种：<strong>先起读线程，再等退出</strong>。<code>shell.rs</code> 做对了，<code>tasks.rs</code> 做错了两处（stderr 没读、在锁里读）。加起来是「同一模块内的两处不一致」，这也是为什么本文要用一整节讲背压——它不是边缘知识，而是这类代码的基本功。

还有一个细节值得注意：<code>read_capped</code> 在缓冲区满了之后<strong>继续读但丢弃</strong>：
<div class="codehilite"><pre><span></span><code><span class="nb">Ok</span><span class="p">(</span><span class="n">n</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">total</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">n</span><span class="p">;</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">kept</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">CAPTURE_BYTES</span><span class="w"> </span><span class="p">{</span>
