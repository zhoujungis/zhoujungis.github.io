<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">room</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">CAPTURE_BYTES</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">kept</span><span class="p">.</span><span class="n">len</span><span class="p">();</span>
<span class="w">        </span><span class="n">kept</span><span class="p">.</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">buf</span><span class="p">[</span><span class="o">..</span><span class="n">n</span><span class="p">.</span><span class="n">min</span><span class="p">(</span><span class="n">room</span><span class="p">)]);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


不能「读到上限就 break」，因为那会让子进程再次阻塞。必须继续读到 EOF，只是不保留。这就是为什么它返回 <code>(kept, total)</code> 两个值——<code>total</code> 用来告诉模型「还有多少没显示」。
<h2>中断：抢占点只有一个</h2>

并发引入后，中断的语义变得更难定义：「按 Ctrl-C 到底应该停掉什么」。

NanoHermes 的答案极其保守：<strong>只在一个地方检查中断</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 只在步骤边界中止，保证历史里不会留下「有 assistant tool_calls</span>
<span class="w">    </span><span class="c1">// 但没有对应 tool 结果」的半截状态。</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">interrupted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">        </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">complete</span><span class="p">()</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="c1">// …执行工具…</span>
<span class="p">}</span>
</code></pre></div>


「步骤边界」的定义是：一次模型往返加它触发的全部工具执行，整体做完之后。所以在下面这些时刻按 Ctrl-C，都要等到当前步骤结束才生效：
<div class="table-scroll"><table>
<thead>
<tr>
<th>时刻</th>
<th>生效延迟</th>
</tr>
</thead>
<tbody>
<tr>
<td>模型正在流式输出</td>
<td>等这次请求结束</td>
</tr>
<tr>
<td>工具正在跑</td>
<td>等所有工具 join</td>
</tr>
<tr>
<td>子代理正在跑</td>
<td>等子代理跑完（最多 40 轮）</td>
</tr>
<tr>
<td>命令正在跑</td>
<td>等命令返回或超时（默认 120s）</td>
</tr>
</tbody>
</table></div>

这个设计的正当理由写在注释里：如果在工具执行中途中断，历史里会出现「assistant 消息里有 3 个 tool_calls，但只有 1 个 tool 结果」的状态，下一次请求直接 400。所以宁可不响应，也不能破坏历史的一致性。

代价是最坏情况下的等待时间可能是几分钟。缓解手段有两个：<code>run_command</code> 的超时（默认 120s，上限 3600s），以及子代理的 40 轮上限。两者都不是为中断设计的，但客观上限制了最坏延迟。

更好的做法是<strong>两阶段中断</strong>：第一次 Ctrl-C 设置标志并打印「正在完成当前步骤，再按一次强制退出」，第二次直接 <code>exit</code>。这样既保留了历史一致性，又给用户一个逃生口。实现只需要再加一个 <code>AtomicUsize</code> 计数。

顺便说一下中断机制本身：
<div class="codehilite"><pre><span></span><code><span class="k">static</span><span class="w"> </span><span class="n">INTERRUPTED</span><span class="p">:</span><span class="w"> </span><span class="nc">AtomicBool</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">AtomicBool</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="kc">false</span><span class="p">);</span>
<span class="k">static</span><span class="w"> </span><span class="n">DEPTH</span><span class="p">:</span><span class="w"> </span><span class="nc">AtomicUsize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">AtomicUsize</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>

<span class="cp">#[cfg(all(target_os = </span><span class="s">&quot;linux&quot;</span><span class="cp">, any(target_arch = </span><span class="s">&quot;x86_64&quot;</span><span class="cp">, target_arch = </span><span class="s">&quot;aarch64&quot;</span><span class="cp">)))]</span>
<span class="k">extern</span><span class="w"> </span><span class="s">&quot;C&quot;</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">on_sigint</span><span class="p">(</span><span class="n">_sig</span><span class="p">:</span><span class="w"> </span><span class="kt">i32</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">INTERRUPTED</span><span class="p">.</span><span class="n">store</span><span class="p">(</span><span class="kc">true</span><span class="p">,</span><span class="w"> </span><span class="n">Ordering</span><span class="p">::</span><span class="n">SeqCst</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


信号处理器里只能做异步信号安全的事，<code>AtomicBool::store</code> 是安全的。<code>sigsuspend</code>、<code>printf</code>、<code>malloc</code> 都不是。这行代码看起来简单，但它必须留在「只做一次原子写」的范围内。

<code>DEPTH</code> 的引用计数解决的是嵌套问题：如果外层 <code>run()</code> 装了处理器，内层某个东西又调用 <code>install()</code>，退出时不能把外层的处理器卸掉。只在 <code>0 -&gt; 1</code> 装、<code>1 -&gt; 0</code> 卸。

装和卸都由一个 RAII 守卫负责，它在 <code>run()</code> 的第一行创建：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">_guard</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="p">::</span><span class="n">new</span><span class="p">();</span><span class="w">   </span><span class="c1">// 丢弃上一轮残留的标志，再装处理器</span>

<span class="k">impl</span><span class="w"> </span><span class="nb">Drop</span><span class="w"> </span><span class="k">for</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">fn</span><span class="w"> </span><span class="nf">drop</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">restore_default</span><span class="p">();</span><span class="w">   </span><span class="c1">// 引用计数减一，最外层才真的恢复</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这样「提前 <code>?</code> 返回」「panic 展开」两条路径都能把处理器卸干净，不会出现「REPL 已经空闲、Ctrl-C 却仍然只是设标志而不退出」的状态。<code>restore_default()</code> 里还有一个 <code>if prev == 0 { return; }</code> 的保护，防止不配对的 <code>leave</code> 把计数减到负数。
<h2>中断与并发的交叉：Ctrl-C 打断的是哪一层</h2>

把上一节和前面的并发层次对上，中断的实际覆盖面是这样：
<div class="table-scroll"><table>
<thead>
<tr>
<th>层</th>
<th>中断是否生效</th>
<th>原因</th>
</tr>
</thead>
<tbody>
<tr>
<td>主循环</td>
<td>是（边界处）</td>
<td><code>take()</code> 在每轮开头</td>
</tr>
<tr>
<td>工具线程</td>
<td>否</td>
<td><code>execute</code> 里没有检查点</td>
</tr>
<tr>
<td>子代理</td>
<td>否（间接）</td>
<td>内部无检查，父线程 join 时无法打断</td>
</tr>
<tr>
<td>子进程</td>
<td>部分</td>
<td>只有超时能杀，Ctrl-C 不会传导</td>
</tr>
</tbody>
</table></div>

「子进程」这一项值得展开。Ctrl-C 对前台 <code>run_command</code> 的影响分平台：

<strong>Linux 上</strong>，SIGINT 发给整个进程组（终端驱动），所以子进程也会收到——它自己会退出。但 <code>run_command</code> 的主线程正在 25ms 轮询 <code>try_wait()</code>，会看到子进程退出，然后正常返回。所以「命令被 Ctrl-C 打断」这件事，在 Linux 上是子进程自己响应 SIGINT，不是 Agent 杀它。

<strong>Windows 上</strong>，<code>interrupt::install()</code> 直接返回 false（代码里非 Linux 分支就是 <code>false</code>），因为 Windows 没有 <code>sigaction</code> 那一套。Ctrl-C 会走默认处置——<strong>整个进程被杀死</strong>，包括 Agent 本身。所以 Windows 上按 Ctrl-C 不是「打断当前轮次」，而是「退出程序」。这是个平台差异，不是 bug，但必须在文档里写清楚，否则用户会以为对话能保住。

<strong>桌面 GUI 上</strong>，没有终端可以送 SIGINT，所以提供了一条进程内路径：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">request</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">INTERRUPTED</span><span class="p">.</span><span class="n">store</span><span class="p">(</span><span class="kc">true</span><span class="p">,</span><span class="w"> </span><span class="n">Ordering</span><span class="p">::</span><span class="n">SeqCst</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


GUI 的「停止」按钮调这个函数，主循环在下一个步骤边界看到标志。所以 GUI 的停止和终端的 Ctrl-C 语义一致，都是「当前步骤做完就停」。
<h2>守护进程：并发为零</h2>

<code>run_daemon</code> 的主循环是这样的：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">stream</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">listener</span><span class="p">.</span><span class="n">incoming</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">stream</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">stream</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">s</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">s</span><span class="p">,</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;accept error: {e}&quot;</span><span class="p">);</span><span class="w"> </span><span class="k">continue</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">peer</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">stream</span><span class="p">.</span><span class="n">peer_addr</span><span class="p">().</span><span class="n">ok</span><span class="p">();</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">handle_daemon_request</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">agent</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">store</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">stream</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(())</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{}</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* 记日志 */</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>listener.incoming()</code> 是一个阻塞迭代器，<code>handle_daemon_request</code> 在<strong>当前线程同步执行</strong>。所以：

<strong>进程级并发是 1。</strong> 第二个请求要等第一个处理完，才能从 backlog 里被 <code>accept</code>。

<strong><code>agent</code> 是 <code>&amp;mut</code>。</strong> 这从类型层面就禁止了并发处理——<code>handle_daemon_request</code> 需要可变借用，两个请求不可能同时持有。

<strong><code>SessionStore</code> 是普通 <code>HashMap</code>。</strong> 它没有 <code>Mutex</code>，因为根本不需要。

这个设计对单用户桌面场景是合理的：你一个人用，一次跑一个任务，不需要并发。但对「多客户端共用一个 daemon」的场景就是瓶颈——两个会话不能同时跑。

为什么仍然能用？因为<strong>真正的并行发生在 Agent 内部</strong>。一个请求处理期间，它内部可能起 4 个子代理、8 个工具线程。所以「进程级并发 1」不等于「同时只有一件事在跑」——一个请求内部可以有很多事同时在跑，只是不能有两个请求同时在跑。

对话隔离的做法是 <code>X-Session-Id</code> 头：
<div class="table-scroll"><table>
<thead>
<tr>
<th>id</th>
<th>消息向量</th>
<th>落盘位置</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code></td>
<td><code>store.sessions["default"]</code></td>
<td><code>--session</code> 指定的原路径</td>
</tr>
<tr>
<td>任意其他 id</td>
<td><code>store.sessions[id]</code></td>
<td><code>--session</code> 同目录下的派生文件</td>
</tr>
</tbody>
</table></div>

不同 id 的对话互不可见。但因为处理是串行的，这个隔离是「时间上的隔离」而不是「并发上的隔离」——不需要锁，也不会有竞争。

要支持真并发，最小的改动是把 <code>for stream in incoming()</code> 换成每个连接起一个线程，并把 <code>agent</code> 包进 <code>Arc&lt;Mutex&lt;Agent&gt;&gt;</code>。但那样一来「一个会话一轮跑几分钟」就会阻塞其他会话的模型请求——锁的粒度会变成整个 Agent。更正确的做法是每个会话一个 <code>Agent</code> 实例（<code>SessionStore</code> 里存 <code>Agent</code> 而不是 <code>Vec&lt;Value&gt;</code>），这已经是重构级别的改动。
<h2>为什么单线程 daemon 仍然能用</h2>

上一节的结论可能让人担心「这是不是设计缺陷」。分开看：

<strong>它不是性能瓶颈。</strong> 一个 coding agent 的瓶颈是模型延迟（每次请求几秒到几十秒），不是 CPU。串行处理两个请求的代价是「第二个等第一个」，而如果并行处理，第二个也只是在等模型的 HTTP 响应——总时间几乎一样，只是响应顺序不同。

<strong>它简化了状态。</strong> <code>Agent</code> 里有一个 <code>messages</code> 向量，<code>style</code> 里有一个 <code>UiSink</code>，<code>session</code> 是一个文件路径。这些东西如果并发访问，每一个都要加锁或复制。单线程意味着这些都可以保持「一个请求从头用到尾」的模型。

<strong>它让流式输出变简单。</strong> <code>stream_turn</code> 把 <code>UiSink</code> 装到 Agent 上，这个 sink 会从工具线程里被调用：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">Mutex</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">out</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">sink_out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">clone</span><span class="p">(</span><span class="o">&amp;</span><span class="n">out</span><span class="p">);</span>
<span class="n">agent</span><span class="p">.</span><span class="n">set_ui_sink</span><span class="p">(</span><span class="n">Arc</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">|</span><span class="n">ev</span><span class="p">:</span><span class="w"> </span><span class="nc">UiEvent</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 序列化成一行 NDJSON 写进 socket</span>
<span class="p">}));</span>
</code></pre></div>


<code>Arc&lt;Mutex&lt;TcpStream&gt;&gt;</code> 让多个工具线程能并发写同一个连接，每次写一行 JSON。如果同时有两个请求共用这个 Agent，sink 就会指向错误的客户端——这是单线程模型的又一个隐性收益。

所以这个设计的真正边界是：<strong>单用户、单任务、可以串行</strong>。超出这个边界就要重构，但在边界内它是对的。

把全文提到的缺陷集中起来，按「修起来值不值」排序：

前三个是「会在真实使用中造成可见故障」的，后四个是「在特定条件下出问题」的。

值得注意排序里第 7 项：修法只要 5 行（加一把 <code>Mutex&lt;()&gt;</code> 包住 <code>confirm</code>），是投入产出比最高的一项。而第 1、2 项虽然工作量也不大，但它们需要改数据结构（<code>Task</code> 里要加 <code>Arc&lt;Mutex&lt;Vec&lt;u8&gt;&gt;&gt;</code>），会影响 <code>output</code>、<code>list</code>、<code>kill</code> 三个方法。

还有一个不在表里的隐性缺陷：<strong>Mutex 中毒</strong>。所有 <code>.lock().unwrap()</code> 在持锁线程 panic 后都会连锁失败。它不在表里，因为触发概率低，但如果触发，后果是「功能永久失效」而不是「一次失败」。改法是 <code>.unwrap_or_else(|e| e.into_inner())</code>，或者换 <code>parking_lot</code>。
<h2>怎么验证并发真的正确</h2>

并发代码的验证不能靠「跑一遍没崩」。NanoHermes 的做法是一个专门的测试模块：
<div class="codehilite"><pre><span></span><code><span class="sd">/// 并发工具调用路径的线程安全测试。`run()` 为每个 `tool_call` 起一个</span>
<span class="sd">/// 作用域线程，全部共享 `&amp;Agent` 并调用 `execute()`。这些测试直接走</span>
<span class="sd">/// 那条路径，带 MCP 和不带 MCP 各一份。这样数据竞争会在这里暴露，</span>
<span class="sd">/// 而不是在生产环境。</span>
<span class="cp">#[cfg(test)]</span>
<span class="k">mod</span><span class="w"> </span><span class="nn">concurrency_tests</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="p">}</span>
</code></pre></div>


两个测试，覆盖两类风险：

<strong>第一类：内置工具的共享状态。</strong> 10 组线程，每组三个工具（<code>list_dir</code>、<code>glob</code>、<code>read_file</code>），共 30 个线程同时跑。验证的是「<code>Ctx</code> 里没有被锁保护的可变状态」。

<strong>第二类：MCP 与内置工具混合。</strong> 8 个并发的 MCP <code>echo</code>、3 个 MCP 辅助工具（资源、prompt）、2 个内置工具。这一组专门验证 MCP 的 <code>Arc&lt;Mutex&lt;ChildStdin&gt;&gt;</code> 和 <code>Arc&lt;Mutex&lt;HashMap&lt;u64, Sender&gt;&gt;&gt;</code> 在并发下是否正确配对——8 个并发请求各自期待自己的响应，任何一个 id 错配都会让 <code>echo-3</code> 拿到 <code>echo-7</code> 的结果，断言立刻失败。

第三个测试是 <code>Gate</code> 本身：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">gate</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">Gate</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">2</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">concurrent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">AtomicUsize</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">0</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">peak</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Arc</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">AtomicUsize</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">0</span><span class="p">));</span>
<span class="c1">// 6 个线程抢 2 个许可，记录历史峰值</span>
<span class="fm">assert!</span><span class="p">(</span><span class="n">peak</span><span class="p">.</span><span class="n">load</span><span class="p">(</span><span class="n">Ordering</span><span class="p">::</span><span class="n">SeqCst</span><span class="p">)</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="mi">2</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;peak was {}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">peak</span><span class="p">.</span><span class="n">load</span><span class="p">(</span><span class="n">Ordering</span><span class="p">::</span><span class="n">SeqCst</span><span class="p">));</span>
<span class="fm">assert_eq!</span><span class="p">(</span><span class="o">*</span><span class="n">gate</span><span class="p">.</span><span class="n">active</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">(),</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;all permits released&quot;</span><span class="p">);</span>
</code></pre></div>


它验证两件事：峰值不超过上限（门有效），结束后计数归零（许可都还了）。第二条尤其重要——如果某个路径忘了还许可，测试会在最后一步失败，而不是等到线上「越跑越卡」。

这套测试的局限要说清楚：
<div class="table-scroll"><table>
<thead>
<tr>
<th>局限</th>
<th>后果</th>
<th>补充手段</th>
</tr>
</thead>
<tbody>
<tr>
<td>靠运气撞竞争</td>
<td>可能全部通过但仍有竞争</td>
<td>加大线程数、循环多次</td>
</tr>
<tr>
<td>不做内存序检测</td>
<td>无法发现微弱的顺序问题</td>
<td>用 <code>-Z sanitizer=thread</code> 或 Miri</td>
</tr>
<tr>
<td>不模拟 panic</td>
<td>锁中毒路径未覆盖</td>
<td>专门的 panic 注入测试</td>
</tr>
</tbody>
</table></div>

更严格的手段是 <strong>Loom</strong>——它穷举所有线程交错，能在几秒钟内找到竞争。代价是要把标准库的 <code>Mutex</code>/<code>Condvar</code> 换成 Loom 的等价物（通过 <code>cfg</code> 切换），代码会变丑。对这个项目，Loom 的收益不足以抵消侵入性，但值得知道它的存在。

实用建议：把并发测试放在单独的 <code>mod</code> 里，用 <code>--test-threads=1</code> 跑一遍（串行执行测试，减少相互干扰），再用默认并发跑一遍。两遍都过，比跑一遍更有信息量。
<h2>并发设计的六条原则</h2>

把这篇文章的观察压缩成六条，可以直接用在别的项目上。

<strong>第一，先划分并行区，再谈并行度。</strong> NanoHermes 的并行区只有「一次工具批次执行」，边界清晰到可以用一个 <code>scope</code> 括起来。并行区之外的任何状态都天然安全。反过来，如果并行区边界模糊（比如「任何时候都可以并发」），你就必须给每一份状态都加锁，复杂度直接翻倍。

<strong>第二，用 join 屏障消灭锁。</strong> 因为主线程在屏障上等，<code>messages</code> 在整个并行期间只读，所以不需要锁。这是「用等待换简单」的交易：牺牲一点延迟（等最慢的线程），换掉一整类同步问题。

<strong>第三，任何持锁期间的 I/O 都是错的。</strong> <code>TaskManager</code> 的两个缺陷都是这一条的违例。锁的临界区只能有内存操作；I/O 要么放到线程里，要么改成非阻塞加轮询。

<strong>第四，有界并发必须用 RAII 还许可。</strong> <code>GateGuard</code> 的 <code>Drop</code> 覆盖了所有返回路径，包括 panic。手写 <code>release()</code> 一定会漏一条路径，而且漏的那条通常是异常路径——也就是最难测的那条。

<strong>第五，中断点越少，语义越清楚。</strong> 只在一个地方检查中断，换来的是「历史永远一致」。代价是最坏延迟，可以用超时和两阶段中断来缓解。反过来，「到处都能中断」的实现在 Agent 场景里几乎一定会在历史里留下半截状态。

<strong>第六，上下限要分别设计。</strong> 子代理有上限（4），工具线程没有；单个工具输出有上限（20,000 字节），批次总量没有。有上限的地方防的是资源耗尽，没上限的地方靠的是「经验上不会太多」。后者迟早会被一个提示词改动打破，所以要显式检查。
<h2>小结：并行是边界问题，不是性能问题</h2>

回到开头那句话：Agent 做并发，首要目标不是快。

这篇拆下来，真正有价值的不是「怎么起线程」——那只有十几行——而是<strong>边界在哪</strong>：
<ul>
<li>哪些状态可以在并行区被修改（<code>Ctx</code> 里的五把锁）</li>
<li>哪些操作有界（子代理 4 个，命令 120 秒，MCP 请求 60 秒）</li>
<li>哪些操作无界（工具线程数，批次输出总量，子代理轮次）</li>
<li>哪些语义在并行下会坏掉（同文件的两个 <code>edit_file</code>，两个 <code>todo_write</code>，两条要审批的命令）</li>
<li>哪些延迟是设计内的（中断只在步骤边界生效，最长等一个完整步骤）</li>
</ul>

NanoHermes 的实现不完美——本文列了七个可以修的缺陷，其中两个（后台任务的 stderr 和锁内阻塞读）会让功能真的卡死。但它的骨架是对的：一个清晰的并行区、一个 join 屏障、一个 RAII 计数的门、一个只检查一处的中断点。这四样东西加起来不到 60 行，却撑起了整个并发模型。

不用 async 运行时不是一个宗教立场，而是一个成本核算：对这个项目，线程加屏障的总成本（几十微秒的创建开销、一个 2 MiB 的虚拟栈、无法中途取消）远小于引入一整套异步生态的成本（依赖树、跨 <code>await</code> 的状态、<code>Send</code> 检查的复杂度）。换一个场景——比如需要维持上万条长连接——这个核算就会反过来。

下一篇进入安全：让它跑命令，而不失控。并发解决的是「几件事同时做」，安全解决的是「这几件事能做什么」——两者在 <code>needs_approval</code> 那一行代码上相交，而那正是本文第 7 个缺陷所在的位置。</div></div></noscript>
