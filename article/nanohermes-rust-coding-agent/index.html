<hr>
<h2>前言：第 N 个 coding agent，凭什么值得写</h2>

2026 年的 coding agent 已经不缺了。Claude Code、Codex、Trae、Cursor 各有各的生态位，开源的复刻版本每周都在冒新的。它们的共同点是：<strong>都很重</strong>。Node 或 Python 运行时、几百个传递依赖、一个 tokio 或 asyncio 事件循环、动辄几百 MB 的安装体积、空转时几百 MB 的常驻内存。

NanoHermes 反过来问了一个很小的工程问题：

<strong>如果我只要一个能读文件、改代码、跑命令、连 MCP 的终端 agent，最小能有多小？</strong>

它的回答是一整套取舍：单二进制（设计目标约 2 MB）、常驻内存只跟上下文长度有关、依赖清单只有三个 crate、没有异步运行时、连 <code>libc</code> 都不依赖，并且能跑在 1 GB 内存的 Debian VPS 上当一个常驻 HTTP 服务。

这篇文章不吹概念，只拆实现。它的技术密度集中在几个地方：<strong>一个不用 async 的 agent 主循环怎么组织</strong>、<strong>并发工具调用用什么原语</strong>、<strong>Landlock 沙箱和 SIGINT 接管如何在不引入 <code>libc</code> 的前提下完成</strong>、<strong>长期记忆如何在不接任何嵌入服务的前提下做中文检索</strong>、<strong>一个 agent 的上下文如何被逐层加上限</strong>。这几件事每一件都有「不读源码猜不到」的细节，下面逐个展开。
<hr>
<h2>一分钟认识 NanoHermes</h2>

一句话定义：<strong>一个 Rust 写的、OpenAI 兼容的终端编码 agent，加一个 Tauri 桌面外壳，加一个可部署的 HTTP daemon。</strong>

它是一次代码写成、三种形态分发：

<thead>
<tr>
<th>形态</th>

</tr>
</thead>
<tbody>
<tr>
<td>CLI / REPL</td>

</tr>

</tr>
<tr>
<td>HTTP 服务</td>

</tr>

能做的事，按「多久能感觉到」排序：
<ul>
<li><strong>真工具</strong>：读/写/编辑文件、打补丁、列目录、<code>grep</code>、<code>glob</code>、跑 shell、抓网页、搜网页、维护 todo、操作 git、管理后台任务。</li>
<li><strong>规划与记忆</strong>：<code>todo_write</code> / <code>todo_read</code> 让模型自己排计划并跨轮跟踪；长期记忆把经验、偏好、纠正、事实沉淀到本地文件，下一轮按相关度检索注入。</li>
<li><strong>可扩展</strong>：MCP 服务器（stdio 与 streamable HTTP 两种传输）、Skills（<code>.nanohermes/skills/&lt;name&gt;/SKILL.md</code>）、子代理（并行委派）、生命周期钩子（能否决工具调用）。</li>
<li><strong>安全</strong>：三级审批策略 + Linux Landlock 文件系统沙箱。</li>
<li><strong>桌面外壳</strong>：四栏布局、虚拟滚动transcript、增量 Markdown、停靠式结果面板、命令面板、三套主题。</li>
</ul>

其中有一条容易被忽略的事实：<strong>整个桌面端的前端是 React 19 + TypeScript + Vite，Rust 侧是一个 72 KB 的单文件 <code>gui/src/main.rs</code></strong>——没有插件、没有胶水框架、没有状态机生成器。Tauri 命令就是普通函数，加上属性宏。
<hr>
<h2>三条设计纲领</h2>

在深入代码之前，先把三条纲领摆出来，因为后面几乎所有细节都从它们长出来。

<strong>纲领一：没有 async 运行时。</strong> HTTP 用阻塞的 <code>ureq</code>；工具调用并发使用 <code>std::thread::scope</code> 的作用域线程；每个 MCP 服务器一个专用读取线程。没有 tokio，也就没有每任务状态机、线程池和运行时内存开销。

<strong>纲领二：依赖极简到近乎偏执。</strong> <code>agent</code> crate 的依赖只有三个：<code>serde_json</code>、<code>ureq</code>（带 TLS）、<code>base64</code>。连 <code>serde</code> 的派生宏都没有——所有值按 <code>serde_json::Value</code> 处理。连 <code>libc</code> 都没有——Landlock 沙箱和 SIGINT 接管绕道一个自己写的裸系统调用模块。

<strong>纲领三：一切输出都有上限。</strong> 工具结果统一裁到 20 KB；命令输出每路 256 KB；读文件超过 4 MB 直接拒绝；网页响应体裁到 2 MB；<code>grep</code> 最多 200 条；<code>glob</code> 最多 500 个文件；项目指引和技能正文各限 20 KB。上下文与进程内存都被这些数字兜住。

这三条纲领共同定义了这个项目的性格：<strong>把复杂度压在「必须写、且值得自己写」的那一层，其余的一律砍掉。</strong>
<hr>
<h2>技术栈、依赖清单与 release profile</h2>

workspace 的 <code>Cargo.toml</code> 是单一事实来源，两个 crate 都继承 <code>version</code> / <code>edition</code> / <code>license</code>：
<div class="codehilite"><pre><span></span><code><span class="k">[workspace]</span>
<span class="n">resolver</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;2&quot;</span>
<span class="n">members</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;agent&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;gui&quot;</span><span class="p">]</span>

<span class="k">[workspace.package]</span>
<span class="n">version</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;0.1.0&quot;</span>
<span class="n">edition</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;2021&quot;</span>
<span class="n">license</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;MIT&quot;</span>

<span class="k">[profile.release]</span>
<span class="n">opt-level</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;z&quot;</span><span class="w">    </span><span class="c1"># 为体积优化</span>
<span class="n">lto</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="w">         </span><span class="c1"># 链接期优化</span>
<span class="n">codegen-units</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1</span><span class="w">  </span><span class="c1"># 牺牲编译速度换更激进的优化</span>
<span class="n">panic</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;abort&quot;</span><span class="w">    </span><span class="c1"># 不要 unwind 表</span>

</code></pre></div>


<code>agent</code> 的依赖表短到可以整段贴出来，注释本身就是在陈述设计目标：
<div class="codehilite"><pre><span></span><code><span class="c1"># Minimal dependency footprint is a design goal:</span>
<span class="c1">#  - no async runtime (no tokio) =&gt; no per-task state machines / thread pools</span>
<span class="c1">#  - one blocking HTTP client (ureq) instead of reqwest/hyper</span>
<span class="c1">#  - serde_json only (no serde derive proc-macro)</span>
<span class="k">[dependencies]</span>
<span class="n">serde_json</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;1&quot;</span>
<span class="n">ureq</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">version</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="s2">&quot;2&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">features</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;json&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;tls&quot;</span><span class="p">]</span><span class="w"> </span><span class="p">}</span>
<span class="n">base64</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;0.22&quot;</span>
</code></pre></div>


<code>gui</code> 侧同样克制，而它复用的正是 agent 那一套阻塞 HTTP 客户端——注释里写明了原因：
<div class="codehilite"><pre><span></span><code><span class="k">[dependencies]</span>
<span class="n">agent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">path</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="s2">&quot;../agent&quot;</span><span class="w"> </span><span class="p">}</span>
<span class="n">tauri</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">version</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="s2">&quot;2&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">features</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[]</span><span class="w"> </span><span class="p">}</span>
<span class="n">serde</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">version</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="s2">&quot;1&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">features</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;derive&quot;</span><span class="p">]</span><span class="w"> </span><span class="p">}</span>
<span class="n">serde_json</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;1&quot;</span>
<span class="c1"># Same blocking HTTP client the agent uses; &quot;tls&quot; keeps https (Caddy-fronted) daemons reachable.</span>
<span class="n">ureq</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">version</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="s2">&quot;2&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">features</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;json&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;tls&quot;</span><span class="p">]</span><span class="w"> </span><span class="p">}</span>
</code></pre></div>


前端栈（<code>ui/package.json</code>）也刻意保持窄：运行时依赖只有 <code>@tauri-apps/api</code>、<code>highlight.js</code>、<code>marked</code>、<code>react</code>、<code>react-dom</code>；工具链是 Vite 6、Vitest 5、TypeScript 5.7、jsdom 30。

Tauri 的窗口配置很朴素，值得注意的只有两点：<code>withGlobalTauri: true</code>（前端直接拿全局 <code>window.__TAURI__</code>，不需要额外的注入包）和 <code>decorations: false</code>（去掉系统标题栏，标题栏由前端自绘）。

<code>agent/src</code> 一共约 9,200 行 Rust，模块划分相当细。按体积排下来，最大的三个是 <code>agent.rs</code>（主循环，52 KB）、<code>main.rs</code>（CLI 与 REPL，58 KB）、<code>mcp.rs</code>（MCP 客户端，38 KB）——也就是说，<strong>一个 agent 的核心逻辑、一个终端 UI、一个协议客户端就占了大半</strong>，其余全是工具实现。

<code>ui/src</code> 约 8,800 行 TypeScript，其中最大的是 <code>lib/store.ts</code>（45 KB，全局状态与 IPC 粘合层）、<code>components/SettingsPage.tsx</code>（33 KB）、<code>styles/shell.css</code>（65 KB）和 <code>App.e2e.test.tsx</code>（26 KB）。
<hr>
<h2>核心技术一：没有 async 运行时的 agent 主循环</h2>

主循环在 <code>agent/src/agent.rs</code> 的 <code>Agent::run</code> 里，一共一百多行，把一个「用户轮次」从开始跑到结束。它的骨架是这样的：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">run</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">content</span><span class="p">:</span><span class="w"> </span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// A Ctrl-C during this turn sets a flag instead of killing the process.</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">_guard</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">InterruptGuard</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="c1">// 跨会话记忆：按当前指令检索相关记忆，整体替换系统消息里的注入块</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">user_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">content_text</span><span class="p">(</span><span class="o">&amp;</span><span class="n">content</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">dir</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">memory_dir</span><span class="p">.</span><span class="n">clone</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">block</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">retrieve_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">);</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">set_memory_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">block</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">content</span><span class="w"> </span><span class="p">}));</span>

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="c1">// Abort only at a step boundary so the history never keeps an</span>
<span class="w">        </span><span class="c1">// assistant tool-call without its matching tool result.</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">interrupt</span><span class="p">::</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">interrupted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">complete</span><span class="p">()</span><span class="o">?</span><span class="p">;</span>
<span class="w">        </span><span class="c1">// ... 累计 token 用量、推送 assistant 消息</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">completed</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">        </span><span class="c1">// ... 并发执行工具、按调用顺序回填 tool 消息</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">compact</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 只有完整结束的轮次才沉淀记忆</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">completed</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">memory</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">distill_memories</span><span class="p">(</span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">);</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">persist</span><span class="p">();</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">final_text</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


值得逐个说的有四件事。

<strong>第一，中断点被放在「步骤边界」而不是「随时」。</strong> 循环开头那句 <code>crate::interrupt::take()</code> 是唯一的打断位置。注释把原因说得很清楚：如果在一个 tool call 发出后、结果回填前打断，历史里就会留下一个没有匹配结果的 assistant tool-call，下一次请求会被 API 判为非法。所以中断只会落在两次「模型往返」之间，代价是响应延迟最多一个步骤。

<strong>第二，长期记忆是每轮重新检索、整体替换的。</strong> <code>set_memory_block</code> 不是往系统消息后面追加，而是按固定标记把旧块整体换掉。这样对话轮回一百次，注入块也还是那一块，不会越积越多——这是注入式记忆最容易踩的坑。

<strong>第三，token 用量上报的是「增量」而不是「累计总数」。</strong> 源码里有一段注释解释得很实在：云端的 daemon 用一个 agent 服务很多会话，累计总数是跨越所有会话的，客户端拿到没法用；上报每次请求的增量，客户端才能自己算出正确的「每任务总数」，而本地场景下增量累加本来就等于总数。

<strong>第四，记忆提炼有硬门槛。</strong> 只有 <code>completed</code> 为真（正常跑完、不是被中断也不是撞到迭代上限）才提炼；提炼失败只静默降级，不影响对话结果。半截对话不会被当成经验写进记忆库。

主循环之外，模型侧的一次往返被封装在 <code>complete()</code> 里，最终落到 <code>llm::chat</code>。它处理的东西不少：构造请求体、按需挂 <code>tools</code> 与 <code>tool_choice</code>、<code>thinking</code> 打开时写 <code>reasoning_effort: "high"</code>、流式时加 <code>stream_options.include_usage</code> 以便在流里拿到 token 统计，然后进入重试循环：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">backoff_ms</span><span class="p">(</span><span class="n">base_ms</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span><span class="w"> </span><span class="n">attempt</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">base_ms</span>
<span class="w">        </span><span class="p">.</span><span class="n">saturating_mul</span><span class="p">(</span><span class="mi">2</span><span class="k">u64</span><span class="p">.</span><span class="n">saturating_pow</span><span class="p">(</span><span class="n">attempt</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="mi">1</span><span class="p">)))</span>
<span class="w">        </span><span class="p">.</span><span class="n">min</span><span class="p">(</span><span class="mi">30_000</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


退避是 <code>base * 2^(attempt-1)</code>、封顶 30 秒；可重试的判据只看 HTTP 状态码（429、500、502、503、504）；重试次数耗尽后，如果配了 <code>--fallback-model</code>，会用备用模型再发一次。默认 <code>--max-retries 2</code>、<code>--retry-base-ms 500</code>。
<hr>
<h2>核心技术二：并发工具调用靠的是作用域线程</h2>

模型一个回合里返回多个 <code>tool_calls</code> 时，NanoHermes 会并发执行它们。没有 tokio，用的是 <code>std::thread::scope</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">results</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">vec!</span><span class="p">[</span><span class="bp">self</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">[</span><span class="mi">0</span><span class="p">])]</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// Reborrow as `&amp;Agent` so the scoped threads can share it</span>
<span class="w">    </span><span class="c1">// (`execute` takes `&amp;self`, and `Agent` is `Sync`).</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">this</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Agent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">;</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">scope</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="w">        </span><span class="n">handles</span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">join</span><span class="p">().</span><span class="n">unwrap_or_else</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="s">&quot;ERROR: tool thread panicked&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">()))</span>
<span class="w">            </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="w">    </span><span class="p">})</span>
<span class="p">};</span>
</code></pre></div>


这里有四个设计细节：
<ul>
<li><strong>单次调用走直路，不付线程开销。</strong> 只有 <code>len() &gt; 1</code> 才铺开线程，绝大多数回合其实是单工具调用。</li>
<li><strong>结果按调用顺序回收。</strong> <code>join</code> 的顺序就是 <code>tool_calls</code> 的顺序，所以哪个线程先跑完都不影响 <code>tool_call_id</code> 与结果的配对。</li>
<li><strong><code>Agent</code> 必须是 <code>Sync</code>。</strong> 这是整个并发方案的前置条件。MCP 侧的做法是把 <code>Child</code> 进程和读取线程的 <code>JoinHandle</code> 一起塞进 <code>Mutex&lt;Server&gt;</code>，于是 <code>Manager</code>（进而 <code>Agent</code>）满足 <code>Sync</code>。</li>
<li><strong>线程 panic 不会带崩整轮。</strong> 单个工具线程 panic 时，<code>join</code> 返回 <code>Err</code>，被转成一条看起来像工具错误的字符串交回模型——模型会当成一次失败的工具调用继续往下走。</li>
</ul>

MCP 工具的并发粒度是另一层的：同一个服务器的调用在它的 stdin 锁上串行（协议就是单连接请求-响应），不同服务器之间并行。这个边界画得很准。
<hr>
<h2>核心技术三：连 libc 都不依赖——一个 30 行的裸系统调用 shim</h2>

<code>sandbox.rs</code> 和 <code>interrupt.rs</code> 都需要 Rust 标准库不暴露的系统调用：Landlock 系列，以及 <code>rt_sigaction</code>。正常做法是加 <code>libc</code> 依赖，NanoHermes 的做法是自己写 <code>agent/src/sys.rs</code>：
<div class="codehilite"><pre><span></span><code><span class="cp">#[cfg(target_arch = </span><span class="s">&quot;x86_64&quot;</span><span class="cp">)]</span>
<span class="k">pub</span><span class="w"> </span><span class="k">mod</span><span class="w"> </span><span class="nn">nr</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">CLOSE</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">3</span><span class="p">;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">RT_SIGACTION</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">13</span><span class="p">;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">OPENAT</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">257</span><span class="p">;</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">PRCTL</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">157</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


两个架构各写一份系统调用号表（x86_64 与 aarch64 的 <code>openat</code> 是 257 对 56、<code>prctl</code> 是 157 对 167），再给一个最多六个参数的 <code>syscall()</code>，x86_64 用 <code>asm!</code> 发 <code>syscall</code> 指令、aarch64 用 <code>svc 0</code>，寄存器分配各不相同。

整个模块不到 75 行，带 <code>#![cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))]</code> 门控，非 Linux 平台编译时整个消失。<strong>这是「依赖极简」纲领最贵的一笔代价：把可移植性和一部分安全审计负担换成了 30 行汇编。</strong> 反过来看也合理——这两个特性本来就只在 Linux 上有意义。
<hr>

<code>apply_patch</code> 也有个值得说的取舍：补丁按<strong>内容</strong>匹配而不是按行号，所以源码有少量漂移时仍然能打上。
<hr>
<h2>核心技术五：上下文压缩——老对话换成一段摘要</h2>

上下文管理在 <code>agent/src/agent.rs</code> 的 <code>compact_with</code> 里，两个常量定调：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">CONTEXT_CHAR_BUDGET</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">120_000</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">KEEP_RECENT</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">10</span><span class="p">;</span>
</code></pre></div>


超过 12 万字符（或消息条数超过「保留数 + 1」）时开始压缩。流程是：从倒数第 10 条往前找一个安全起点，把更老的一段 <code>drain</code> 出来交给模型做摘要，再把摘要作为一条 <code>system</code> 消息插回索引 1 的位置。

三个细节避免了常见事故：
<ul>
<li><strong>不会切在工具调用链中间。</strong> 起点如果落在 <code>role == "tool"</code> 的消息上就往后推，直到不是 tool 消息——否则会出现「摘要里丢了 assistant 的 tool_call，但 tool 结果还留着」的错位。</li>
<li><strong>摘要失败也不丢数据。</strong> 摘要调用失败时退化成一句 <code>[Earlier conversation was omitted to keep the context small]</code>，而不是直接报错或静默丢失。</li>
<li><strong>可手动触发。</strong> <code>/compact</code> 强制压缩一次，绕过体积判断。</li>
</ul>

<code>KEEP_RECENT = 10</code> 这个数是个经验取舍：最近 10 条足够覆盖「当前正在改的文件 + 上一条工具结果」，再老的对话对延续任务的价值快速衰减。
<hr>
<h2>核心技术六：长期记忆——本地 BM25 加中文二元切分</h2>

长期记忆是 <code>agent/src/memory.rs</code> 的职责，落盘在 <code>~/.nanohermes/memory.json</code>。它要解决的问题很实际：<strong>不接任何嵌入服务，怎么做中文检索？</strong>

答案是两段式——先分词，再 BM25。

分词器 <code>tokenize()</code> 同时处理中英混排：
<ul>
<li>ASCII 字母数字的连续段当英文单词，转小写，<strong>长度小于 2 的直接丢弃</strong>（消掉 <code>a</code>、<code>is</code> 这类噪声）。</li>
<li>CJK 连续段做<strong>二元切分</strong>（<code>windows(2)</code>），单字段落保留单字。所以「上下文压缩」会变成「上下」「下文」「文压」「压缩」。</li>
<li>CJK 的判定覆盖了汉字、假名、谚文和兼容区，不只统一表意区。</li>
</ul>

打分是标准 BM25，<code>k1 = 1.2</code>、<code>b = 0.75</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">idf</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="mf">1.0</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="p">(</span><span class="n">n</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">n_q</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">0.5</span><span class="p">)</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="p">(</span><span class="n">n_q</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">0.5</span><span class="p">)).</span><span class="n">ln</span><span class="p">();</span>
<span class="n">score</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">idf</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="n">f</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="n">k1</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">1.0</span><span class="p">))</span>
<span class="w">       </span><span class="o">/</span><span class="w"> </span><span class="p">(</span><span class="n">f</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">k1</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="mf">1.0</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">len</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">avg_len</span><span class="p">.</span><span class="n">max</span><span class="p">(</span><span class="mf">1.0</span><span class="p">)));</span>
</code></pre></div>


两个细节超出了教科书写法：
<ul>
<li><strong>类别词也参与匹配。</strong> 每条记忆有 <code>kind</code>（<code>lesson</code> / <code>preference</code> / <code>correction</code> / <code>fact</code>），分词时把它的中文标签和英文标识一起并进文档词袋，于是「我之前纠正过什么」这种查询能直接命中 <code>correction</code> 类条目。</li>
<li><strong>零分条目直接过滤。</strong> 没有共同词的条目根本不进排序，避免无关记忆挤占 top-k。</li>
</ul>

条目数有限，所以是逐条算分、不做倒排索引——一个 <code>Vec</code> 加一个 <code>HashMap</code> 就够了。检索结果是<strong>每轮重新计算</strong>的，注入方式和前面说的记忆块替换共用同一套标记机制。

写入侧还有两道闸：<code>memory_save</code> 遇到同文本条目直接跳过（去重），以及每轮结束时的自动提炼只发生在完整结束的回合。所以记忆库不会被寒暄和半截对话污染。
<hr>
<h2>核心技术七：MCP 客户端——两种传输，一个极简实现</h2>

MCP 支持在 <code>agent/src/mcp.rs</code>，两种传输都实现了。

<strong>stdio 传输</strong>走的是 LSP 风格的帧：<code>Content-Length: N\r\n\r\n</code> 加 JSON 体，一字不差：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">frame</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;Content-Length: {}</span><span class="se">\r\n\r\n</span><span class="s">&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">body</span><span class="p">.</span><span class="n">len</span><span class="p">());</span>
</code></pre></div>


<strong>streamable HTTP 传输</strong>是同步 POST，请求头 <code>Accept: application/json, text/event-stream</code>，服务端返回的 <code>Mcp-Session-Id</code> 会被记住并在后续请求里带回去。响应体可能是 JSON，也可能是 SSE 形式的 <code>event: message</code> + <code>data: {...}</code>，客户端两种都能解。

握手序列是标准三步：<code>initialize</code>（<code>protocolVersion: "2024-11-05"</code>）→ <code>notifications/initialized</code> → <code>tools/list</code>。拿到的工具声明会被转换成 OpenAI function-calling 格式并入 agent 的工具表，之后按名字自动分发——也就是说 <strong>MCP 工具对模型来说和内置工具没有区别</strong>，模型的调用体验是一致的。

除了工具，还有四个辅助工具把 MCP 的 resources 与 prompts 也暴露出来：<code>mcp_list_resources</code>、<code>mcp_read_resource</code>、<code>mcp_list_prompts</code>、<code>mcp_get_prompt</code>。这几个只在配了 MCP 服务器时出现。

配置就是一个 JSON 文件，<code>command</code> 走 stdio、<code>url</code> 走 HTTP，两种写法在同一个 <code>servers</code> 对象里并存。
<hr>
<h2>核心技术八：Skills 与渐进式披露</h2>

Skills 是「可复用的指令包」，一个目录一份 <code>SKILL.md</code>，支持 YAML frontmatter 声明 <code>name</code> 和 <code>description</code>。

搜索顺序是 workspace 优先：先扫 <code>&lt;workspace&gt;/.nanohermes/skills/</code>，再扫 <code>~/.nanohermes/skills/</code>，同名时工作区的覆盖全局的（<code>discover_in</code> 里用一个 <code>HashSet</code> 做去重，目录列表排序后按序处理）。

关键在于<strong>它不进上下文</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">MAX_BODY_CHARS</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">20_000</span><span class="p">;</span>

<span class="sd">/// A discovered skill. `body` is read lazily so startup only pays for parsing</span>
<span class="sd">/// the frontmatter.</span>
</code></pre></div>


启动时只解析 frontmatter，正文惰性读取。系统提示词里只出现每个 skill 的<strong>名字和描述</strong>；模型需要时再调 <code>skill</code> 工具把正文（上限 20 KB）拉进来。这就是渐进式披露——<strong>技能库可以很大，但基础提示词永远是小的</strong>。

frontmatter 缺失时有兜底：目录名当名字，正文第一行当描述。
<hr>
<h2>核心技术九：子代理任务板与并发门控</h2>

子代理配置在 <code>--subagents</code> 指定的 JSON 里，每个子代理可以有自己的 prompt、模型和 <code>allowed_tools</code> 白名单。配好之后出现 <code>subagent</code>（委派）和 <code>agent_list</code>（查任务板）两个工具。

<code>agent/src/board.rs</code> 里有两种机制：

<strong>任务板 <code>Board</code></strong> 记录每个委派任务：自增序号生成 id（格式 <code>agent-N</code>）、名字、任务描述、状态（<code>running</code> / <code>done</code> / <code>failed</code>）、耗时、结果预览。结果在板上只留 500 字符预览：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">RESULT_PREVIEW</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">500</span><span class="p">;</span>
</code></pre></div>


预览裁剪还专门处理了 UTF-8 边界——<code>while end &gt; 0 &amp;&amp; !flat.is_char_boundary(end)</code>——避免把一个多字节字符劈成两半 panic。完整结果仍然作为工具结果回给模型，板上留个摘要只是为了 <code>agent_list</code> 读起来清爽。

<strong>并发门控 <code>Gate</code></strong> 是个教科书式的 <code>Mutex</code> + <code>Condvar</code> 计数信号量：<code>acquire()</code> 在满额时 <code>cv.wait</code>，返回的 <code>GateGuard</code> 在 <code>Drop</code> 里减一并 <code>notify_one</code>。上限由 <code>MAX_PARALLEL_SUBAGENTS = 4</code> 定死，也就是最多 4 个并发委派。为什么需要它？因为主循环是「一个工具调用一个线程」，而一个回合完全可能同时发出好几个委派——没有门控就会瞬间炸出十几个并发 LLM 请求。
<hr>
<h2>核心技术十：生命周期钩子，能一票否决工具调用</h2>

钩子定义在配置文件里，是 <code>PreToolUse</code> / <code>PostToolUse</code> 两类 shell 命令，<code>matcher</code> 支持 <code>*</code>（全部）或逗号分隔的工具名列表。

运行方式在 <code>agent/src/hooks.rs</code>：<code>sh -c</code> 执行，工作目录是 workspace 根，工具调用以 JSON 写到钩子的 stdin：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">payload</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">tool</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;event&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">event</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;arguments&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">args</span><span class="w"> </span><span class="p">}).</span><span class="n">to_string</span><span class="p">();</span>
</code></pre></div>


同时导出 <code>NANOHERMES_TOOL_NAME</code> 与 <code>NANOHERMES_HOOK_EVENT</code> 两个环境变量，不用解析 stdin 也能分支。

两个实现细节值得抄：
<ul>
<li><strong>两条管道各起一个线程去排空。</strong> stdout 和 stderr 分别在独立线程里 <code>read_capped</code>——如果只在一处读，另一个管道写满 64 KB 缓冲区就会死锁，而「话多的钩子」恰恰是常见情况。</li>
<li><strong>钩子必须快，慢了就当失败。</strong> <code>HOOK_TIMEOUT_SECS = 30</code>，超时杀掉进程并返回 <code>-2</code>（<code>-1</code> 表示被信号杀死）。注释写得很直白：钩子只是快检查和通知，卡住的钩子不能把 agent 永久拖住。</li>
</ul>

语义上两者是有差别的：<code>PreToolUse</code> 返回非零会<strong>阻止</strong>这次工具调用，并把钩子输出交回模型；<code>PostToolUse</code> 返回非零只能给工具结果<strong>追加一条警告</strong>，没法撤销已发生的事。这个不对称是刻意的——想拦就在执行前拦。
<hr>
<h2>核心技术十一：安全模型——Landlock 沙箱与三级审批</h2>

两个互相独立的开关，一个管「问不问」，一个管「能做什么」。

<strong>审批策略</strong>决定什么时候需要用户确认：
<div class="table-scroll"><table>
<thead>
<tr>
<th>策略</th>
<th>行为</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>never</code></td>
<td>任何命令都不问（默认，<code>-y</code> 也是它）</td>
</tr>
<tr>
<td><code>on-request</code></td>
<td>只问那些<strong>不是</strong>公认只读命令的</td>
</tr>
<tr>
<td><code>untrusted</code></td>
<td>全部都要问，只读命令也不例外</td>
</tr>
</tbody>
</table></div>

只读命令的识别逻辑（<code>is_trusted_command</code>）比想象中严格。第一道闸就是元字符——只要出现 <code>|</code>、<code>&amp;</code>、<code>;</code>、<code>&lt;</code>、<code>&gt;</code>、反引号、<code>$</code>、括号或换行，<strong>无论开头是什么程序都直接判为不可信</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">cmd</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="fm">matches!</span><span class="p">(</span><span class="n">c</span><span class="p">,</span><span class="w"> </span><span class="sc">&#39;|&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&amp;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&lt;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&gt;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;`&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;$&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;(&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;)&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;\n&#39;</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


过了这一关，才做白名单匹配：先跳过前置的 <code>KEY=VALUE</code> 环境变量赋值，再去掉路径前缀，最后查 <code>TRUSTED_BINARIES</code>（<code>ls</code>、<code>cat</code>、<code>grep</code>、<code>rg</code>、<code>stat</code>、<code>jq</code>、<code>tree</code> 等纯只读程序）。<code>git</code> 单独走 <code>git_subcommand_is_read_only()</code>：它会跳过 <code>-C</code>、<code>-c</code>、<code>--git-dir</code>、<code>--work-tree</code>、<code>--namespace</code> 这些<strong>吃下一个 token 作值</strong>的全局参数，再看子命令是否在白名单里。

<strong>沙箱模式</strong>用 Linux Landlock 限制被 spawn 命令的文件系统视野：
<div class="table-scroll"><table>
<thead>
<tr>
<th>模式</th>
<th>行为</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>off</code></td>
<td>不限制（默认）</td>
</tr>
<tr>
<td><code>read-only</code></td>
<td>可以读、可以执行，完全不能写</td>
</tr>
<tr>
<td><code>workspace-write</code></td>
<td>可以读、可以执行，只能在 workspace 下写</td>
</tr>
</tbody>
</table></div>

实现上最有意思的一点是<strong>它拒绝降级</strong>：Landlock 通过 <code>Command::pre_exec</code> 安装——也就是在 <code>fork</code> 之后、<code>exec</code> 之前，因此限制天然覆盖命令派生出的所有子进程。如果内核不暴露 Landlock（或外层沙箱挡掉了），NanoHermes <strong>拒绝执行该命令</strong>，而不是悄悄以无沙箱方式跑掉。注释里的理由说得对：一门心思「优雅降级」的安全机制，等于没有。

而这一切仍然走前面那个裸系统调用 shim，不引入任何外部 crate。
<hr>
<h2>核心技术十二：Ctrl-C 不杀进程，<code>/undo</code> 能回退</h2>

交互式使用时，Ctrl-C 的语义被改写了：它<strong>不是</strong>杀掉进程，而是翻转一个标志位，让当前轮次在下一个步骤边界干净退出，对话上下文完整保留。

<code>agent/src/interrupt.rs</code> 的实现有一处很妙的时序设计：<strong>处理器只在轮次运行期间安装</strong>。
<div class="codehilite"><pre><span></span><code><span class="k">static</span><span class="w"> </span><span class="n">INTERRUPTED</span><span class="p">:</span><span class="w"> </span><span class="nc">AtomicBool</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">AtomicBool</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="kc">false</span><span class="p">);</span>
<span class="sd">/// Nesting depth of active turns; the handler is installed at 0 -&gt; 1 and</span>
<span class="sd">/// removed at 1 -&gt; 0.</span>
<span class="k">static</span><span class="w"> </span><span class="n">DEPTH</span><span class="p">:</span><span class="w"> </span><span class="nc">AtomicUsize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">AtomicUsize</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
</code></pre></div>


引用计数保证嵌套轮次（比如子代理在工具调用里跑起来）只有一个处理器，而最外层退出时恢复 <code>SIG_DFL</code> 默认动作——于是<strong>空闲时按 Ctrl-C 仍然照常退出</strong>，只有忙碌时才变成「停止当前轮次」。一个信号，两种语义，靠的是「安装/卸载的时机」而不是判断标志位。

另外一个工程细节：x86_64 上的内核<strong>拒绝投递被捕获的信号，除非调用方提供一个会执行 <code>rt_sigreturn</code>（系统调用 15）的 restorer</strong>。这就是整个项目里唯一一段手写汇编除了 <code>syscall</code> 指令之外还存在的原因：
<div class="codehilite"><pre><span></span><code><span class="n">core</span><span class="p">::</span><span class="n">arch</span><span class="p">::</span><span class="fm">global_asm!</span><span class="p">(</span>
<span class="w">    </span><span class="s">&quot;.globl nanohermes_sigrestorer&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;.hidden nanohermes_sigrestorer&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;nanohermes_sigrestorer:&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;mov rax, 15&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;syscall&quot;</span><span class="p">,</span>
<span class="p">);</span>
</code></pre></div>


桌面端没有 SIGINT 可发，所以另有一个 <code>request()</code> 直接翻同一个标志位：<strong>GUI 的「停止」按钮和终端的 Ctrl-C 走的是同一条路径</strong>，agent 循环不需要知道调用者是谁。

配套的是 <code>/undo [n]</code>：把最近 n 个完整用户轮次（该轮用户消息及其之后的一切）从历史里删掉并持久化。它和「中断保留上下文」是一对——<strong>中断是保留，回退是撤销</strong>，两种都需要，因为「跑歪了想接着改」和「跑歪了想当没发生」是两种真实需求。
<hr>
<h2>桌面端：Tauri GUI 的四栏外壳与流式隔离</h2>

<code>gui/</code> 把同一个 agent 包成桌面应用，四栏布局：

</tbody>

权限模式有五档，语义差别比名字看起来大：
<div class="table-scroll"><table>

<tr>
<th>模式</th>
<th>UI 标签</th>
<th>行为</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code></td>
<td>Agent</td>

</tr>
<tr>
<td><code>accept-edits</code></td>

</tr>

</tr>

</tr>

<code>plan</code> / <code>goal</code> / <code>debug</code> 这三档除了工具闸门，还会往系统提示词里塞一句模式指引——源码里的注释说明了原因：<strong>让模型按启动方式行事，而不只是依赖工具被禁用</strong>。被禁的工具模型还会反复尝试，写了指引它就会自己换策略。

GUI 侧的性能取舍写在 README 的「Desktop performance notes」里，四条都是踩过坑的结论：
<ul>
<li><strong>不允许阻塞式 Tauri 命令。</strong> 同步的 <code>#[tauri::command]</code> 跑在窗口主线程上，任何磁盘或网络操作都会把整个 UI 冻住一整轮。所以所有碰文件系统、开进程、发 HTTP 的命令都是 <code>async fn</code> 并交给 <code>tauri::async_runtime::spawn_blocking</code>；只有 <code>get_settings</code> 和 <code>stop_task</code> 这两个纯内存操作保持同步。设置页的并发写入还用了一个静态互斥锁串行化，防止两次 flush 乱序落盘。</li>
<li><strong>流式文本不进全局 store。</strong> 增量走一条专用订阅通道，只有正在写入的那个气泡订阅它；每个阶段（工具调用、轮次结束）才提交一次到 transcript。所以长回答不会连累侧边栏、结果面板和标题栏重渲染。事件在 <code>nanohermes://delta|tool|note|usage</code> 通道上按 40 毫秒批量下发。</li>
<li><strong>transcript 虚拟化。</strong> 只有视口内（和附近）的消息被挂载；最后一个气泡还在增长时跳过高度测量；「贴底滚动」由流式通道驱动，不触发 React 渲染。</li>
<li><strong>增量 Markdown。</strong> 流式期间按代码围栏外的空行切块：已经稳定的块只渲染一次就保留，未闭合的围栏只更新它那个 <code>code</code> 文本节点，语法高亮在轮次结束后逐代码块做，而不是对整篇回答做一次。</li>
</ul>

整个 GUI 的 IPC 面是 16 个命令：<code>get_settings</code>、<code>save_settings_cmd</code>、<code>new_task</code>、<code>open_task</code>、<code>reset_task</code>、<code>delete_task</code>、<code>set_mode</code>、<code>list_workspace_files</code>、<code>read_file_preview</code>、<code>file_diff</code>、<code>stop_task</code>、<code>export_task</code>、<code>list_dirs</code>、<code>model_health</code>、<code>cloud_health</code>、<code>run_task</code>。另外有两条 stream 读取路径——<code>read_ndjson</code> 解 NDJSON 增量，<code>cloud_read_stream</code> 读远端 daemon 的流——都写在一个 72 KB 的文件里。
<hr>
<h2>daemon 模式与 VPS 部署</h2>

<code>agent --daemon</code> 把 agent 变成一个常驻 HTTP 服务，接口小到只有两个端点：
<div class="table-scroll"><table>
<thead>
<tr>
<th>端点</th>
<th>方法</th>
<th>鉴权</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/</code></td>
<td>POST</td>
<td>Bearer（设了 token 时）</td>
<td><code>{"prompt": "..."}</code> → <code>{"response": "...", "session": "&lt;id&gt;"}</code></td>
</tr>
<tr>
<td><code>/health</code></td>
<td>GET</td>
<td>无</td>
<td><code>{"status":"ok","sessions":N}</code>，给存活探针用</td>
</tr>
</tbody>
</table></div>

会话隔离靠一个请求头：带上 <code>X-Session-Id</code> 就切到那个会话，不同 id 永不共享上下文，不带就用 <code>default</code>。每个会话独立落盘成一个 JSON 文件。

桌面端把「云端任务」接到它：每个云任务带自己的 <code>X-Session-Id</code>，于是<strong>同一个 daemon 能同时服务多个桌面任务而不串味</strong>。代价是云任务的配置由 daemon 启动参数决定——模型、人格、温度、权限模式都不从桌面端下发，而且<strong>云轮次无法中途取消</strong>（请求整个握在 daemon 手里）。

部署脚本 <code>scripts/deploy-debian.sh</code> 把该做的都做了：
<div class="table-scroll"><table>
<thead>
<tr>
<th>步骤</th>
<th>内容</th>
</tr>
</thead>
<tbody>
<tr>
<td>安装</td>
<td>二进制 <code>/opt/nanohermes/nanohermes</code>，工作区 <code>/opt/nanohermes/workspace</code>，会话目录权限 700</td>
</tr>
<tr>
<td>令牌</td>
<td><code>openssl rand -hex 24</code> 生成到 <code>/opt/nanohermes/.daemon_token</code>，重跑时复用</td>
</tr>
<tr>
<td>服务</td>
<td>写 systemd unit：<code>--daemon --daemon-port 8787 -C &lt;workspace&gt; --session &lt;dir&gt;/default.json --sandbox workspace-write</code>，<code>Restart=always</code></td>
</tr>
<tr>
<td>加固</td>
<td><code>NoNewPrivileges</code> + <code>ProtectSystem=strict</code> 配 <code>ReadWritePaths</code></td>
</tr>
<tr>
<td>启动</td>
<td><code>systemctl enable --now</code>，然后 curl <code>/health</code> 打印 token</td>
</tr>
</tbody>
</table></div>

有一个坑在文档里被点出来了：<code>ProtectSystem=strict</code> 会挡住 <code>~/.nanohermes/memory.json</code> 的写入，所以开了长期记忆就必须在 drop-in 里加 <code>ReadWritePaths=/root/.nanohermes</code>。另外 1 GB 实例要先加 swap——<strong>编译是唯一吃内存的步骤</strong>。

对外暴露的方式给了三种：SSH 隧道（不开放任何端口）、Caddy 反代（443 被占就用 8443，注意 Let's Encrypt 的 HTTP-01 仍要 80）、Cloudflare Tunnel。文档里那句警告值得原样引用：<strong>永远不要把 8787 直接暴露出去</strong>——唯一的凭证就是那个 Bearer token，而流量是明文的。
<hr>
<h2>会话持久化与多模态输入</h2>

会话文件是一个 OpenAI 风格消息的 JSON 数组，写盘方式是原子的：<strong>先写同目录的 <code>.tmp</code> 兄弟文件，再 rename</strong>。所以写一半崩溃不会把会话截断成半截。保存时机是每个完成的轮次之后以及 <code>/clear</code> 之后；启动时读失败会退回全新对话并打印警告，而不是拒绝启动。

多模态输入对视觉模型开放：一次性用 <code>-i</code>，REPL 里用 <code>/image</code>，桌面端可以粘贴截图、拖拽文件或从选择器挑。约束是每轮最多 4 张、长边缩到 1024 px、非可解码图片或超过 12 MB 会被拒绝并给出原因。传输方式是 data URL，所以模型必须支持 vision。
<hr>
<h2>测试矩阵</h2>

Rust 侧是「每个模块自带 <code>#[cfg(test)]</code>」加一个真正的端到端套件，一条 <code>cargo test --workspace</code> 全跑。<code>agent/tests/e2e_mock_llm.rs</code> 起一个<strong>只依赖标准库、不联网</strong>的本地 mock OpenAI 服务，用它驱动真实的 <code>Agent</code>，覆盖：工具调用往返、流式与非流式回复、一次瞬时 5xx 后的重试、以及硬性 API 错误。MCP 侧另有 <code>agent/tests/mock_mcp_server.py</code> 这个 mock stdio 服务器。

单元测试覆盖的清单相当能说明「哪些地方被当成真会出问题的地方」：补丁应用（简单/多 hunk/插入/上下文缺失报错）、glob 匹配、MCP 资源与提示词的列出和读取、MCP 工具自动分发、streamable HTTP 握手与调用、MCP 并发安全（混合并发请求与压力突发）、<code>execute()</code> 并发（内置工具、内置与 MCP 混合）、HTML 转文本与搜索结果解析、会话任务列表、git 工具往返、token 用量解析与退避计算、多模态内容组装、会话存取往返、AGENTS.md 注入（含关闭）、技能发现（frontmatter、兜底命名、工作区覆盖）、钩子执行（退出码、工具名匹配、stdin 载荷）、子代理任务板顺序与并发门控、审批策略判定与可信命令识别、<strong>Landlock 的工作区边界强制</strong>、SIGINT 标志位的置位与清除、长期记忆（中文二元分词、BM25 排序、去重、提炼门槛）。

前端是 Vitest + jsdom，覆盖纯逻辑（主题解析与持久化、store 状态迁移、Markdown 清洗、图片附件处理、会话内查找、diff 块）加组件测试（设置页、命令面板、结果面板、快捷键面板），再加一个 <code>App.e2e.test.tsx</code>：<strong>对着被 mock 的 Tauri IPC 桥渲染真实的 store 和组件</strong>，验证长 transcript 的虚拟滚动、跨屏消息的查找、diff 变更跳转、以及运行中/停止中的输入区状态。

顺带一提，GUI 侧还有一个回归测试专门断言「长时间运行的命令永远不在主线程上同步执行」——这类性能约定最容易在后续改动里被悄悄破坏，所以值得一条测试盯着。
<hr>
<h2>已知限制与我的判断</h2>

把限制写清楚，比把功能写清楚更有价值：
<ul>
<li><strong>沙箱与 SIGINT 接管是 Linux 专属。</strong> 两者都建立在裸系统调用上，Windows/macOS 编译时整块消失。也就是说桌面端在 Windows 上跑的是「无沙箱 + 系统默认 Ctrl-C 处理」。</li>
<li><strong>云轮次不可取消。</strong> 请求整个握在 daemon 手里，桌面端只能等；本地任务才能在步骤边界停止。</li>
<li><strong>daemon 以 root 运行，token 是唯一凭证。</strong> 谁拿到 token 谁就能在 workspace 里读写执行——这是文档里反复强调不要裸暴露端口的根本原因。</li>
<li><strong>没有 async 的代价是真实的。</strong> 一个卡住的 HTTP 请求会占住一个线程直到超时（默认 120 秒）。在 CLI 和 GUI 场景下这完全可接受，但如果有人想把它塞进一个高并发网关，架构假设就不成立了。</li>
<li><strong>Windows 安装包未签名</strong>，首次运行会触发 SmartScreen 警告。</li>
</ul>

我的判断是：NanoHermes 值得读的地方<strong>不是功能清单，而是约束纪律</strong>。同为 coding agent，功能集大同小异；它把「不用 async 运行时」「只用三个 crate」「不依赖 libc」「所有输出都有上限」这四条约束坚持到底，才长出了这些实现——裸系统调用 shim、作用域线程并发、逐层钳制的输出上限、零依赖的中文 BM25。

这几条约束换来的是：一个设计目标约 2 MB 的单个二进制，常驻内存主要跟上下文长度相关，却能同时当 CLI、当桌面应用、当 VPS 上的 systemd 服务。<strong>在一个大家都往上堆依赖的方向上，往回收也是一种工程能力。</strong>
