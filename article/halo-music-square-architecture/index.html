    <noscript><div class="ns-article"><h1>Halo 音乐广场技术拆解：用 Cloudflare 构建多音源在线音乐应用</h1><div class="ns-meta">2026/8/31 · Zhou Jun</div><div class="markdown-body">我一直想做一个打开浏览器就能用的音乐工具：输入歌名，多个平台同时返回结果；点一下歌曲就能播放，歌词跟着进度滚动；常听的歌曲可以收藏，也可以整理成自己的歌单。这个想法最后落成了 <a href="https://github.com/zhoujungis/halo_music" rel="noopener noreferrer" target="_blank">HALO Music</a>，也就是我自己的 Halo 音乐广场。

这个项目的重点并不是把某一个平台的页面重新做一遍，而是把多个音源、浏览器播放器、用户数据和桌面端包装在一个轻量架构里。前端是可以直接部署到 Cloudflare Pages 的静态页面，后端使用 Pages Functions 提供 API，D1 负责账号、歌单和缓存，Electron 再把同一套 Web 应用封装成 Windows 桌面客户端。
<blockquote>

项目用于学习、研究和演示。音乐内容、音频地址、歌词和封面归对应平台及原作者所有，使用时应遵守当地法律、上游平台服务条款与版权政策。
</blockquote>
<h2>一、先看整体架构</h2>

项目没有单独维护一套前端和一套桌面播放器。浏览器与 Electron 都加载同一个 <code>index.html</code>，区别只在于外面是否包了一层原生窗口：

<span class="w">    </span><span class="n">subgraph</span><span class="w"> </span><span class="n">Client</span><span class="p">[</span><span class="n">客户端</span><span class="p">]</span>

<span class="w">    </span><span class="n">end</span>
<span class="w">    </span><span class="n">subgraph</span><span class="w"> </span><span class="n">Cloudflare</span><span class="p">[</span><span class="n">Cloudflare</span><span class="w"> </span><span class="n">Pages</span><span class="p">]</span>
<span class="w">        </span><span class="n">Static</span><span class="p">[</span><span class="n">Pages</span><span class="w"> </span><span class="n">静态资源</span><span class="p">]</span>
<span class="w">        </span><span class="n">Functions</span><span class="p">[</span><span class="n">Pages</span><span class="w"> </span><span class="n">Functions</span><span class="err">\</span><span class="n">n</span><span class="o">/</span><span class="n">api</span><span class="cm">/*]</span>

这套拆分有三个直接收益：静态资源可以交给 Pages 的 CDN；需要密钥、签名或跨域处理的请求放在 Functions；播放器状态仍然留在浏览器，播放过程不需要把音频流经过自己的服务器。
<h2>二、前端：一个静态入口承载完整播放器</h2>
<h3>1. 用原生运行时状态控制交互</h3>

为了让部署和桌面端都足够轻，当前前端没有引入大型 UI 框架，页面结构、样式和运行时逻辑集中在 <code>index.html</code>、<code>styles.css</code> 与 <code>app.js</code>。运行时用一组简单状态描述当前会话：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="nx">tracks</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[]</span>
<span class="kd">let</span><span class="w"> </span><span class="nx">currentIndex</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">0</span>
<span class="kd">let</span><span class="w"> </span><span class="nx">currentList</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nx">tracks</span>
<span class="kd">let</span><span class="w"> </span><span class="nx">isPlaying</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span>
<span class="kd">let</span><span class="w"> </span><span class="nx">repeatOn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span>
<span class="kd">let</span><span class="w"> </span><span class="nx">liked</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="ow">new</span><span class="w"> </span><span class="nb">Set</span><span class="p">(</span><span class="nb">JSON</span><span class="p">.</span><span class="nx">parse</span><span class="p">(</span><span class="nx">localStorage</span><span class="p">.</span><span class="nx">getItem</span><span class="p">(</span><span class="s2">&quot;halo-liked-tracks&quot;</span><span class="p">)</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="s2">&quot;[]&quot;</span><span class="p">))</span>
<span class="kd">const</span><span class="w"> </span><span class="nx">audio</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="ow">new</span><span class="w"> </span><span class="nx">Audio</span><span class="p">()</span>
</code></pre></div>


搜索、播放器、歌词和队列都围绕这组状态重新渲染。歌曲行、专辑卡片和播放器按钮使用事件委托，点击歌曲时只更新索引、播放上下文和 <code>&lt;audio&gt;</code> 的状态，不会创建第二个播放器实例。
<h3>2. 多音源并行搜索，再统一排序和去重</h3>

不同平台的搜索接口响应格式并不一致。客户端先在各自的适配器中提取歌曲 ID、歌名、歌手、专辑、封面和时长，再转成统一对象。当前浏览器搜索会并行执行网易云、QQ 音乐和酷我音乐请求：
<div class="codehilite"><pre><span></span><code><span class="kd">const</span><span class="w"> </span><span class="nx">results</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">await</span><span class="w"> </span><span class="nb">Promise</span><span class="p">.</span><span class="nx">allSettled</span><span class="p">([</span>
<span class="w">  </span><span class="nx">searchNetease</span><span class="p">(</span><span class="nx">keyword</span><span class="p">,</span><span class="w"> </span><span class="nx">limit</span><span class="p">),</span>
<span class="w">  </span><span class="nx">searchQQ</span><span class="p">(</span><span class="nx">keyword</span><span class="p">,</span><span class="w"> </span><span class="nx">limit</span><span class="p">),</span>
<span class="w">  </span><span class="nx">searchKuwo</span><span class="p">(</span><span class="nx">keyword</span><span class="p">,</span><span class="w"> </span><span class="nx">limit</span><span class="p">),</span>
<span class="p">])</span>

<span class="kd">const</span><span class="w"> </span><span class="nx">groups</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nx">results</span><span class="p">.</span><span class="nx">map</span><span class="p">((</span><span class="nx">item</span><span class="p">)</span><span class="w"> </span><span class="p">=&gt;</span>
<span class="w">  </span><span class="nx">item</span><span class="p">.</span><span class="nx">status</span><span class="w"> </span><span class="o">===</span><span class="w"> </span><span class="s2">&quot;fulfilled&quot;</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="nx">item</span><span class="p">.</span><span class="nx">value</span><span class="w"> </span><span class="o">:</span><span class="w"> </span><span class="p">[],</span>
<span class="p">)</span>
<span class="k">return</span><span class="w"> </span><span class="nx">interleave</span><span class="p">(</span><span class="nx">groups</span><span class="p">)</span>
</code></pre></div>


这里使用 <code>Promise.allSettled</code>，是因为一个音源临时不可用时，其他音源仍然应该显示。<code>interleave</code> 按平台交错结果，避免列表前半段全部来自同一个平台；<code>dedupeTracks</code> 再用平台 ID 和“歌名 + 歌手”的规范化键去重。规范化会去掉空格、连接号和括号等差异，减少同一首歌重复出现。

项目的服务端适配器还覆盖 QQ、酷我、JOOX 等需要代理或备用解析的场景，歌单导入则额外支持网易云、汽水音乐和 QQ 音乐公开链接。这样“搜索索引”和“播放地址解析”可以分别演进，不必让一个平台的接口变化拖垮所有功能。
<h3>3. 延迟加载歌曲详情，播放时才解析音频</h3>

搜索结果只保存可以展示列表的元数据，QQ 和酷我歌曲的真实播放地址在用户点击播放后才获取。<code>ensureTrackDetails</code> 会根据 <code>track.source</code> 选择适配器，并用 <code>loadingPromise</code> 合并同一首歌的并发请求：
<div class="codehilite"><pre><span></span><code><span class="k">async</span><span class="w"> </span><span class="kd">function</span><span class="w"> </span><span class="nx">ensureTrackDetails</span><span class="p">(</span><span class="nx">track</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="nx">track</span><span class="p">.</span><span class="nx">detailsLoaded</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="nx">track</span><span class="p">.</span><span class="nx">audioUrl</span><span class="p">)</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="kc">true</span>
<span class="w">  </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="nx">track</span><span class="p">.</span><span class="nx">loadingPromise</span><span class="p">)</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nx">track</span><span class="p">.</span><span class="nx">loadingPromise</span>

<span class="w">  </span><span class="nx">track</span><span class="p">.</span><span class="nx">loadingPromise</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nx">resolveBySource</span><span class="p">(</span><span class="nx">track</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="k">finally</span><span class="p">(()</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="nx">track</span><span class="p">.</span><span class="nx">loadingPromise</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">null</span><span class="w"> </span><span class="p">})</span>
<span class="w">  </span><span class="k">return</span><span class="w"> </span><span class="nx">track</span><span class="p">.</span><span class="nx">loadingPromise</span>
<span class="p">}</span>
</code></pre></div>


拿到地址后才设置 <code>audio.src</code> 并调用 <code>audio.load()</code>。播放失败时不会把短时效地址永久写入收藏或歌单，而是允许刷新解析、重试候选地址或切换音源。网易云路径则通过兼容解析服务获取 URL 和歌词，QQ/酷我则优先经过 <code>/api/music</code>。
<h3>4. LRC 歌词和播放器时间轴共用一个时钟</h3>

歌词同步没有另起定时器，而是直接使用 <code>&lt;audio&gt;</code> 的 <code>timeupdate</code> 事件。LRC 解析器支持一行多个时间标签，也兼容 <code>mm:ss.xx</code> 与 <code>mm:ss:xxx</code> 形式：
<div class="codehilite"><pre><span></span><code><span class="kd">function</span><span class="w"> </span><span class="nx">parseLrc</span><span class="p">(</span><span class="nx">text</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="kd">const</span><span class="w"> </span><span class="nx">lines</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[]</span>
<span class="w">  </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kd">const</span><span class="w"> </span><span class="nx">line</span><span class="w"> </span><span class="k">of</span><span class="w"> </span><span class="nb">String</span><span class="p">(</span><span class="nx">text</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="s2">&quot;&quot;</span><span class="p">).</span><span class="nx">split</span><span class="p">(</span><span class="sr">/\r?\n/</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">const</span><span class="w"> </span><span class="nx">tags</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[...</span><span class="nx">line</span><span class="p">.</span><span class="nx">matchAll</span><span class="p">(</span><span class="sr">/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g</span><span class="p">)]</span>
<span class="w">    </span><span class="kd">const</span><span class="w"> </span><span class="nx">content</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nx">line</span><span class="p">.</span><span class="nx">replace</span><span class="p">(</span><span class="sr">/\[[^\]]+\]/g</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;&quot;</span><span class="p">).</span><span class="nx">trim</span><span class="p">()</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="o">!</span><span class="nx">content</span><span class="p">)</span><span class="w"> </span><span class="k">continue</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kd">const</span><span class="w"> </span><span class="nx">tag</span><span class="w"> </span><span class="k">of</span><span class="w"> </span><span class="nx">tags</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="kd">const</span><span class="w"> </span><span class="nx">fraction</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nx">tag</span><span class="p">[</span><span class="mf">3</span><span class="p">]</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="nb">Number</span><span class="p">(</span><span class="sb">`0.</span><span class="si">${</span><span class="nx">tag</span><span class="p">[</span><span class="mf">3</span><span class="p">].</span><span class="nx">padEnd</span><span class="p">(</span><span class="mf">3</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;0&quot;</span><span class="p">).</span><span class="nx">slice</span><span class="p">(</span><span class="mf">0</span><span class="p">,</span><span class="w"> </span><span class="mf">3</span><span class="p">)</span><span class="si">}</span><span class="sb">`</span><span class="p">)</span><span class="w"> </span><span class="o">:</span><span class="w"> </span><span class="mf">0</span>
<span class="w">      </span><span class="nx">lines</span><span class="p">.</span><span class="nx">push</span><span class="p">({</span><span class="w"> </span><span class="nx">time</span><span class="o">:</span><span class="w"> </span><span class="nb">Number</span><span class="p">(</span><span class="nx">tag</span><span class="p">[</span><span class="mf">1</span><span class="p">])</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mf">60</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="nb">Number</span><span class="p">(</span><span class="nx">tag</span><span class="p">[</span><span class="mf">2</span><span class="p">])</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="nx">fraction</span><span class="p">,</span><span class="w"> </span><span class="nx">text</span><span class="o">:</span><span class="w"> </span><span class="nx">content</span><span class="w"> </span><span class="p">})</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">}</span>
<span class="w">  </span><span class="k">return</span><span class="w"> </span><span class="nx">lines</span><span class="p">.</span><span class="nx">sort</span><span class="p">((</span><span class="nx">a</span><span class="p">,</span><span class="w"> </span><span class="nx">b</span><span class="p">)</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="nx">a</span><span class="p">.</span><span class="nx">time</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="nx">b</span><span class="p">.</span><span class="nx">time</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


渲染歌词时从后往前找到最后一个 <code>line.time &lt;= audio.currentTime</code> 的行，给它加上 <code>active</code> 状态；点击歌词行则直接把 <code>audio.currentTime</code> 设置为该行的时间戳。因此进度条、歌词高亮和当前播放歌曲天然保持一致。
<h3>5. 响应式布局不是简单缩小</h3>

桌面端是“搜索 / 播放器与歌词 / 播放列表”三栏工作区；移动端改成底部导航，在“搜索、歌词、我的”之间切换。布局使用 CSS Grid、媒体查询和独立滚动容器，歌词区和队列不会把页面整体撑出视口。主题、收藏和歌单等轻量数据放在 <code>localStorage</code>，即使未登录也能先完成搜索和本地整理。
<h2>三、HALO Track：隔离平台差异的核心数据结构</h2>

如果每个组件都直接读取某个平台的字段，后续添加音源会迅速变成条件分支地狱。因此项目约定了统一的 HALO Track：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nx">uid</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;qq-歌曲标识&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">source</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;qq&quot;</span><span class="p">,</span><span class="w">              </span><span class="c1">// netease / qq / kuwo / joox</span>
<span class="w">  </span><span class="nx">title</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;歌曲名&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">artist</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;歌手&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">album</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;专辑&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">cover</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;https://...&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">songid</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;平台歌曲 ID&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">quality</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;lossless&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">qualityLabel</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;无损&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">pay</span><span class="o">:</span><span class="w"> </span><span class="s2">&quot;&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nx">audioUrl</span><span class="o">:</span><span class="w"> </span><span class="kc">null</span><span class="p">,</span><span class="w">             </span><span class="c1">// 运行时字段</span>
<span class="w">  </span><span class="nx">lrc</span><span class="o">:</span><span class="w"> </span><span class="kc">null</span><span class="w">                   </span><span class="c1">// 运行时字段</span>
<span class="p">}</span>
</code></pre></div>


展示层只关心 <code>title</code>、<code>artist</code>、<code>album</code>、<code>cover</code>、<code>source</code> 等稳定字段；适配器负责把平台响应翻译成这些字段；详情层再按 <code>source</code> 补齐 <code>audioUrl</code> 和歌词。<code>serializeTrack()</code> 会过滤短时效音频 URL、歌词和详情状态，只保存可以复用的标识与展示信息，避免把已经失效的资源写进 localStorage 或 D1。
<h2>四、后端：Pages Functions 作为音源适配与安全边界</h2>
<h3>1. 文件即路由的 API</h3>

Cloudflare Pages 会把 <code>functions/api/</code> 下的文件映射成 <code>/api/*</code>。主要接口分成三组：
<table>
<thead>
<tr>
<th>接口</th>
<th>作用</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>GET /api/music</code></td>
<td>搜索、详情、音频解析、代理与缓存</td>
</tr>
<tr>
<td><code>POST /api/register</code>、<code>POST /api/login</code>、<code>POST /api/logout</code></td>
<td>账号和会话</td>
</tr>
<tr>
<td><code>GET/PUT /api/library</code></td>
<td>读取或覆盖当前用户的收藏和歌单</td>
</tr>
<tr>
<td><code>POST /api/import-playlist</code></td>
<td>服务端解析公开歌单并转换为 HALO Track</td>
</tr>
<tr>
<td><code>GET /api/me</code></td>
<td>返回当前会话对应的用户名</td>
</tr>
</tbody>
</table>

<code>/api/music</code> 用 <code>action</code> 区分 <code>qq_search</code>、<code>kuwo_search</code>、<code>qq_detail</code>、<code>kuwo_detail</code>、<code>qq_audio</code> 和 <code>kuwo_audio</code>。服务端限制关键词长度、返回数量和上游请求时间，避免某个平台响应异常时占满整个 Function 请求。
<h3>2. 解析地址的缓存与验证</h3>

音频解析比搜索更容易遇到短时效 URL、失效候选和上游限流，所以项目采用“候选地址 + 可播放验证 + 缓存”的策略：
<ol>
<li>根据歌曲 ID、音质和时长生成缓存键。</li>
<li>先查 Worker 进程内的 LRU，再查 D1 的共享缓存。</li>
<li>缓存未命中时尝试主接口和备用接口。</li>
<li>对返回地址做 HTTP、歌曲 ID 和时长等基本校验。</li>
<li>将验证过的候选信息写入缓存；播放失败时用 <code>refresh=1</code> 强制重新解析。</li>
</ol>

内存 LRU 最多保留约 500 项，搜索缓存默认约 45 秒，D1 作为跨请求、跨 Worker 实例的二级缓存。项目只缓存可复用的解析结果，不把音频文件搬到自己的存储中，也不把临时 URL 当成永久链接。
<h3>3. 公开歌单在服务端导入</h3>

公开歌单导入放在 <code>import-playlist.js</code>，原因是分享链接解析、分页和上游请求更适合在服务端完成。Function 会识别网易云、汽水音乐和 QQ 音乐的公开链接，必要时先解析官方短链接，再读取页面或接口中的歌曲信息，最后统一转换成 HALO Track。

导入过程设置了明确上限：QQ 歌单最多处理前 1,200 首，网易云最多 2,000 首，汽水音乐页面读取上限为 4 MB。限制请求规模既能保护上游，也能避免超过 Pages Functions 的执行时间。
<h2>五、D1 数据模型与“本地优先”同步</h2>

D1 是 SQLite 数据库，当前核心表如下：
<table>
<thead>
<tr>
<th>表</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>music_users</code></td>
<td>用户名、密码哈希和随机 salt</td>
</tr>
<tr>
<td><code>music_sessions</code></td>
<td>会话 token、用户名和过期时间</td>
</tr>
<tr>
<td><code>music_libraries</code></td>
<td>用户收藏与自建歌单 JSON</td>
</tr>
<tr>
<td><code>music_cache</code></td>
<td>音频和详情共享缓存</td>
</tr>
<tr>
<td><code>search_cache</code></td>
<td>短期搜索结果缓存</td>
</tr>
</tbody>
</table>

收藏和歌单采用“localStorage 先落地、D1 异步同步”：未登录时数据只属于当前浏览器；登录后页面再把库提交到 <code>/api/library</code>，弱网下仍能继续使用本地数据。云端库目前按 JSON 保存，优点是实现简单、适合个人项目；如果未来要做协作歌单、增量同步或操作审计，再拆成歌曲、歌单和关系表会更合适。
<h2>六、账号安全和 Electron 安全边界</h2>

账号密码不会以明文保存。服务端使用 Web Crypto 的 PBKDF2-SHA-256，100,000 次迭代和 16 字节随机 salt，只把哈希和 salt 写入 D1。登录后用随机 UUID 生成会话 token，放进 <code>HttpOnly; Secure; SameSite=Lax</code> Cookie，默认有效期 30 天。

桌面端的安全目标是“只做窗口壳，不把 Node 权限交给网页”：
<div class="codehilite"><pre><span></span><code><span class="nx">webPreferences</span><span class="o">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="nx">preload</span><span class="o">:</span><span class="w"> </span><span class="nx">path</span><span class="p">.</span><span class="nx">join</span><span class="p">(</span><span class="nx">__dirname</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;preload.cjs&quot;</span><span class="p">),</span>
<span class="w">  </span><span class="nx">contextIsolation</span><span class="o">:</span><span class="w"> </span><span class="kc">true</span><span class="p">,</span>
<span class="w">  </span><span class="nx">nodeIntegration</span><span class="o">:</span><span class="w"> </span><span class="kc">false</span><span class="p">,</span>
<span class="w">  </span><span class="nx">sandbox</span><span class="o">:</span><span class="w"> </span><span class="kc">true</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


<code>preload.cjs</code> 只通过 <code>contextBridge</code> 暴露最小的平台信息，窗口打开外部链接时交给系统默认浏览器处理。Electron 主进程默认创建 1440×920、最小 960×640 的窗口，也支持通过 <code>HALO_MUSIC_URL</code> 或 <code>--url=</code> 参数切换到自己的 Pages 域名。
<h2>七、测试、开发与部署</h2>

本地开发需要 Node.js 20 LTS 或更高版本、npm 和 Wrangler 4：
<div class="codehilite"><pre><span></span><code><span class="n">npm</span> <span class="n">install</span>
<span class="n">npx</span> <span class="n">wrangler</span> <span class="n">d1</span> <span class="n">execute</span> <span class="n">halo-music-db</span> <span class="p">-</span><span class="n">-local</span> <span class="p">-</span><span class="o">-file</span> <span class="n">schema</span><span class="p">.</span><span class="n">sql</span>
<span class="n">npm</span> <span class="n">run</span> <span class="n">dev</span>
</code></pre></div>


项目使用 Node 原生 <code>node:test</code>，覆盖账号会话、收藏与歌单持久化、多个平台字段归一化、歌单链接识别、QQ 签名与分页、LRC 解析、音频容器识别、播放上下文切歌，以及浏览器端内联脚本语法检查：
<div class="codehilite"><pre><span></span><code><span class="n">npm</span> <span class="n">test</span>
</code></pre></div>


部署时只需要把 Pages 静态文件和 Functions 一起发布，并在 <code>wrangler.toml</code> 中绑定 D1：

<span class="n">pages_build_output_dir</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;.&quot;</span>

<span class="k">[[d1_databases]]</span>
<span class="n">binding</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;DB&quot;</span>
<span class="n">database_name</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;halo-music-db&quot;</span>
<span class="n">database_id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">&quot;替换为你的 D1 database_id&quot;</span>
</code></pre></div>


桌面端复用已经部署的 Pages 地址，不需要再启动一个本地 HTTP 服务：
<div class="codehilite"><pre><span></span><code><span class="n">npm</span> <span class="n">run</span> <span class="n">desktop</span><span class="p">:</span><span class="n">dev</span>
<span class="n">npm</span> <span class="n">run</span> <span class="n">desktop</span><span class="p">:</span><span class="n">all</span>

Windows 安装包和便携版会输出到 <code>release/</code>，应用 ID 是 <code>com.halomusic.desktop</code>。
<h2>八、做完之后得到的经验</h2>

这个项目最值得记录的不是某一个平台接口，而是几个可以复用的工程决策：
<ol>
<li><strong>先统一领域模型，再接入音源。</strong> HALO Track 把平台差异挡在适配器里，播放器和歌单逻辑不需要知道上游字段叫什么。</li>
<li><strong>搜索和播放解析分离。</strong> 搜索追求并行和容错，播放解析追求校验、缓存和重试，两者的性能目标不同。</li>
<li><strong>临时资源不要当数据库事实。</strong> 音频 URL 会过期，应该保存歌曲 ID 和展示信息，播放时重新解析。</li>
<li><strong>本地优先能降低登录和网络依赖。</strong> localStorage 让收藏和歌单在弱网下可用，D1 再负责登录用户的跨设备同步。</li>
<li><strong>桌面端优先复用 Web 版本。</strong> Electron 只提供原生窗口和安全边界，业务逻辑、播放器和后端接口保持一套实现。</li>
</ol>

项目仍然有清晰的边界：上游接口和音频地址可能随时变化，Pages Functions 的执行时间会限制大批量导入，前端主入口也可以继续拆分成模块化组件。下一步更值得投入的方向，是更细粒度的歌单数据模型、增量同步、Playwright 视觉回归，以及对各音源适配器建立更稳定的契约测试。

如果你想了解具体实现，欢迎直接阅读 <a href="https://github.com/zhoujungis/halo_music" rel="noopener noreferrer" target="_blank">halo_music 源码</a>。这个项目从一个“能搜歌和播放”的小工具开始，逐渐长成了一个包含 Web、Serverless、SQLite 缓存和桌面壳的完整练习场。</div></div></noscript>
