<blockquote>

适用读者：用 MQ 做过异步解耦，但说不清"消息到底会不会丢、丢在哪"的后端工程师
技术栈：Python 纯标准库模拟链路 + 实测数据；原理与语言无关，RabbitMQ / RocketMQ / Kafka / Redis Stream 通用
阅读时间：约 24 分钟 | 难度：中高级 | 收获：丢消息的完整归因链路 + 三种配置的实测对比 + 上线 Checklist
</blockquote>
<h2>前言：一次"订单消息凭空消失"的事故</h2>

风控同学找过来：过去一个月有 600 多笔订单，状态已变更为"已支付"，但下游的积分系统<strong>没有发放积分</strong>。两边对账，中间就是隔着一个 MQ。

排查日志的过程很煎熬：生产者日志里有"发送成功"，消费端却完全没有这条消息的消费记录——<strong>消息在中间凭空消失了</strong>。

最后定位到三个因素叠加：
<ol>
<li>生产者发送时开了 <code>auto_ack</code> 类似的"发完就算"，网络抖动丢了没人知道；</li>
<li>Broker 消息没开持久化，恰好重启了一次，内存队列被清空；</li>
<li>消费者是"取到即确认"，处理到一半进程被 OOM Kill，消息已经从队列里移除了。</li>
</ol>

这三个环节，<strong>任何一个单独出问题的概率都不高，但乘起来就是每月几百笔订单</strong>。

这篇文章不背"如何保证消息不丢失"的面试答案，而是把一条消息的完整旅程拆开，<strong>逐跳分析它能丢在哪、用什么机制兜住，并真的写一个链路模拟器跑一遍，用数据对比三种典型配置的丢消息率</strong>。

<hr>
<h2>1. 消息到底能丢在哪：一条消息的完整旅程</h2>

一条消息从生产到生效，要经过三跳：
<div class="codehilite"><pre><span></span><code>生产者 ──①──&gt; Broker ──②──&gt; 存储 ──③──&gt; 消费者
</code></pre></div>


每一跳都有独立的丢失原因：
<table>
<thead>
<tr>
<th>跳</th>
<th>丢失原因</th>
<th>兜底机制</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 生产者 → Broker</td>
<td>网络丢包、Broker 处理前崩溃、客户端"发完就算"</td>
<td>发送确认（Publisher Confirm / ACK）、失败重试、本地消息表</td>
</tr>
<tr>
<td>② Broker 存储</td>
<td>未持久化、写缓存后宕机、单点磁盘故障</td>
<td>持久化 + 同步刷盘、多副本</td>
</tr>
<tr>
<td>③ Broker → 消费者</td>
<td>自动 ACK 后消费者崩溃、消费逻辑抛异常未处理</td>
<td>手动 ACK + 重投递、重试队列、死信队列</td>
</tr>
</tbody>
</table>

一个关键的认知：<strong>可靠性是"最弱一跳"决定的</strong>。三跳里任何一跳是 fire-and-forget，整体就是 fire-and-forget。上面事故里三个环节各丢一部分，比例叠加起来正好对上对账差异。

还有一条贯穿全文的原则：<strong>可靠性不是免费的</strong>。每加一层兜底，都会付出吞吐、延迟或复杂度的代价。所以正确的姿势不是"无脑全开"，而是<strong>按消息的业务价值分级</strong>：
<table>
<thead>
<tr>
<th>等级</th>
<th>典型消息</th>
<th>配置</th>
</tr>
</thead>
<tbody>
<tr>
<td>可丢弃</td>
<td>埋点日志、监控打点</td>
<td>fire-and-forget 即可</td>
</tr>
<tr>
<td>尽力而为</td>
<td>推送通知、缓存刷新</td>
<td>发送确认 + 重试</td>
</tr>
<tr>
<td>绝不丢失</td>
<td>订单、支付、积分</td>
<td>全链路确认 + 持久化 + 手动 ACK + 幂等消费</td>
</tr>
</tbody>
</table>
<hr>
<h2>2. 生产端：发送确认与本地消息表</h2>
<h3>2.1 "发送成功"的两种含义</h3>

大部分消息丢失事故的起点，是混淆了两种"发送成功"：
<ul>
<li><strong>API 调用成功</strong>：消息写进了客户端的网络缓冲区，<code>send()</code> 没抛异常。</li>
<li><strong>Broker 落盘确认</strong>：Broker 明确回复"我收到了，并且已持久化"。</li>
</ul>

RabbitMQ 的 Publisher Confirm、RocketMQ 的同步发送 + Broker ACK、Kafka 的 <code>acks=all</code>，解决的都是同一件事：把"成功"的定义从①升级到②。

Kafka 的 <code>acks</code> 参数是个很好的度量衡：
<table>
<thead>
<tr>
<th>配置</th>
<th>含义</th>
<th>丢失窗口</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>acks=0</code></td>
<td>发出去就算成功</td>
<td>网络丢包 + Leader 宕机即丢</td>
</tr>
<tr>
<td><code>acks=1</code></td>
<td>Leader 写入即确认</td>
<td>Leader 宕机且未同步到 Follower 时丢</td>
</tr>
<tr>
<td><code>acks=all</code></td>
<td>ISR 全部副本写入才确认</td>
<td>只要还有一个副本活着就不丢（配合 <code>min.insync.replicas=2</code>）</td>
</tr>
</tbody>
</table>
<h3>2.2 重试解决不了的问题：本地消息表</h3>

发送确认 + 失败重试能覆盖绝大多数瞬时故障，但有一个它永远解决不了的场景：<strong>本地事务和发消息的原子性</strong>。

经典场景：下单接口先写订单表，再发"订单已创建"消息。两步之间服务崩溃，订单存在、消息永远发不出去。反过来先发消息再写库，则是用户收到了"下单成功"的推送，订单却是空的。

这不是重试能解决的，因为<strong>第一步成功、第二步失败时，进程可能已经死了，没有任何代码能再重试</strong>。

解法是把两步变成一个事务——在同一个数据库事务里写业务表 + 写一张 <code>outbox</code>（本地消息表）：
<div class="codehilite"><pre><span></span><code><span class="k">BEGIN</span><span class="p">;</span>
<span class="k">INSERT</span><span class="w"> </span><span class="k">INTO</span><span class="w"> </span><span class="n">orders</span><span class="w"> </span><span class="p">(...)</span><span class="w"> </span><span class="k">VALUES</span><span class="w"> </span><span class="p">(...);</span><span class="w">          </span><span class="c1">-- 业务数据</span>
<span class="k">INSERT</span><span class="w"> </span><span class="k">INTO</span><span class="w"> </span><span class="n">outbox</span><span class="w"> </span><span class="p">(</span><span class="n">topic</span><span class="p">,</span><span class="w"> </span><span class="n">payload</span><span class="p">,</span><span class="w"> </span><span class="n">status</span><span class="p">)</span><span class="w">     </span><span class="c1">-- 消息先落库</span>
<span class="w">    </span><span class="k">VALUES</span><span class="w"> </span><span class="p">(</span><span class="s1">&#39;order.created&#39;</span><span class="p">,</span><span class="w"> </span><span class="s1">&#39;...&#39;</span><span class="p">,</span><span class="w"> </span><span class="s1">&#39;pending&#39;</span><span class="p">);</span>
<span class="k">COMMIT</span><span class="p">;</span>
</code></pre></div>


然后由一个独立的<strong>投递任务</strong>轮询 <code>outbox</code>，把 <code>pending</code> 的消息发出去，收到 Broker 确认后标记为 <code>sent</code>：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">deliver_outbox</span><span class="p">():</span>
    <span class="n">rows</span> <span class="o">=</span> <span class="n">db</span><span class="o">.</span><span class="n">query</span><span class="p">(</span>
        <span class="s2">&quot;SELECT id, topic, payload FROM outbox &quot;</span>
        <span class="s2">&quot;WHERE status=&#39;pending&#39; ORDER BY id LIMIT 100&quot;</span>
    <span class="p">)</span>
    <span class="k">for</span> <span class="n">row</span> <span class="ow">in</span> <span class="n">rows</span><span class="p">:</span>
        <span class="k">try</span><span class="p">:</span>
            <span class="n">broker</span><span class="o">.</span><span class="n">publish</span><span class="p">(</span><span class="n">row</span><span class="o">.</span><span class="n">topic</span><span class="p">,</span> <span class="n">row</span><span class="o">.</span><span class="n">payload</span><span class="p">)</span>   <span class="c1"># 带发送确认</span>
            <span class="n">db</span><span class="o">.</span><span class="n">execute</span><span class="p">(</span><span class="s2">&quot;UPDATE outbox SET status=&#39;sent&#39; WHERE id=</span><span class="si">%s</span><span class="s2">&quot;</span><span class="p">,</span> <span class="n">row</span><span class="o">.</span><span class="n">id</span><span class="p">)</span>
        <span class="k">except</span> <span class="ne">Exception</span><span class="p">:</span>
            <span class="k">continue</span>  <span class="c1"># 下轮重试</span>
</code></pre></div>


这个模式叫 <strong>Transactional Outbox</strong>，它的精髓是：<strong>把"发消息"这个网络操作从事务里挪出去，事务里只做本地写</strong>。本地写是原子的，消息只要落了库就永远不会丢——最多是晚一点被投递出去。

代价也明确：投递有轮询延迟（可加 <code>SELECT ... FOR UPDATE SKIP LOCKED</code> 或 CDC 如 Debezium 优化），且 outbox 表需要清理策略。但对比"订单存在、消息消失"，这点代价几乎总是值得的。
<hr>
<h2>3. Broker 端：持久化、刷盘与副本</h2>

消息到了 Broker 还没完——<strong>内存里的消息不是你的消息，落盘的才是</strong>。

三个层次的可靠性，逐层递进：

<strong>第一层：持久化标记。</strong> RabbitMQ 要求 exchange、queue、message 三者都标记 durable/persistent，任何一个漏了，重启后照样丢。Kafka 天然写磁盘，这一层默认达标。

<strong>第二层：刷盘时机。</strong> 写到操作系统的 page cache 不等于落盘，机器掉电时 page cache 会丢。RocketMQ 提供了明确的选择：
<ul>
<li><strong>异步刷盘</strong>：写 page cache 即返回，吞吐高，掉电丢窗口内的消息；</li>
<li><strong>同步刷盘</strong>：等磁盘写完才返回 ACK，吞吐低，不丢。</li>
</ul>

<strong>第三层：副本。</strong> 单机磁盘坏了，持久化救不了你。Kafka 的 ISR 机制、RocketMQ 的 Dledger / 主从同步，本质都是用<strong>多机器冗余</strong>换单点故障的免疫。

一个容易被忽略的细节：<strong>持久化是异步的，确认和刷盘之间有时间窗</strong>。RabbitMQ 的 persistent 消息被 Confirm 时通常已落盘，但批量场景下要留意 <code>basic.consume</code> 的 prefetch 与刷盘节奏；Kafka 的 <code>acks=all</code> 只保证副本内存同步，配合 <code>flush.messages</code> / <code>log.flush.interval.messages</code> 才能控制掉电窗口。理解这个窗口，才能解释"我都配了持久化为什么还丢了几条"。
<hr>
<h2>4. 消费端：自动 ACK 是最大的坑</h2>

三跳里，<strong>生产事故最集中的是第三跳</strong>，而元凶几乎总是同一个：自动 ACK。

自动 ACK 的语义是：<strong>消息一送达消费者就从队列里移除</strong>——注意是"送达"，不是"处理完"。于是：
<ul>
<li>消费者处理到一半崩溃 → 消息已删除，业务永远没执行；</li>
<li>处理逻辑抛异常 → 消息已删除，异常吞掉就是静默丢单。</li>
</ul>

手动 ACK 把确认时机从"送达"推迟到"业务完成"：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">on_message</span><span class="p">(</span><span class="n">ch</span><span class="p">,</span> <span class="n">method</span><span class="p">,</span> <span class="n">properties</span><span class="p">,</span> <span class="n">body</span><span class="p">):</span>
    <span class="k">try</span><span class="p">:</span>
        <span class="n">handle</span><span class="p">(</span><span class="n">body</span><span class="p">)</span>          <span class="c1"># 真正的业务逻辑</span>
        <span class="n">ch</span><span class="o">.</span><span class="n">basic_ack</span><span class="p">(</span><span class="n">method</span><span class="o">.</span><span class="n">delivery_tag</span><span class="p">)</span>
    <span class="k">except</span> <span class="n">TransientError</span><span class="p">:</span>
        <span class="n">ch</span><span class="o">.</span><span class="n">basic_nack</span><span class="p">(</span><span class="n">method</span><span class="o">.</span><span class="n">delivery_tag</span><span class="p">,</span> <span class="n">requeue</span><span class="o">=</span><span class="kc">False</span><span class="p">)</span>  <span class="c1"># 进重试/死信</span>
    <span class="k">except</span> <span class="n">PermanentError</span><span class="p">:</span>
        <span class="n">ch</span><span class="o">.</span><span class="n">basic_nack</span><span class="p">(</span><span class="n">method</span><span class="o">.</span><span class="n">delivery_tag</span><span class="p">,</span> <span class="n">requeue</span><span class="o">=</span><span class="kc">False</span><span class="p">)</span>  <span class="c1"># 不可恢复，也进死信</span>
</code></pre></div>


注意两个细节：
<ol>
<li><strong>崩溃在 ACK 之前</strong>，Broker 会把消息重投给其他消费者——消息不丢，但<strong>会被处理多次</strong>（见下一节）；</li>
<li><strong>NACK 不要无脑 requeue=True</strong>。一条消息格式损坏，requeue 后立刻被取出、再次 NACK、再入队——无限循环，CPU 打满，整个队列堵死。正确姿势是重试有限次后进死信队列（DLQ）。</li>
</ol>
<hr>
<h2>5. 重复不可怕：幂等消费兜底</h2>

到这里一个结论已经浮出水面：<strong>"不丢"和"不重"是物理上不可兼得的</strong>。

想不丢，就必须"先处理、后确认"（或 Broker 重投）；而"先处理后确认"意味着确认之前崩溃就会重投——同一条消息被处理两次。反过来"先确认后处理"保证不重，但崩溃即丢。这本质上就是分布式系统 CAP 之外的经典两难，只能二选一。

工程上的标准答案是：<strong>选择 at-least-once（可能重复），用幂等消费消灭重复的影响</strong>。

幂等的具体手段在我之前那篇《API 幂等性深度解析》里有完整展开——唯一约束、状态机、<code>dedup_key</code> 去重表。落到 MQ 消费场景，最常用的是<strong>消费去重表</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">CREATE</span><span class="w"> </span><span class="k">TABLE</span><span class="w"> </span><span class="n">consumed_messages</span><span class="w"> </span><span class="p">(</span>
<span class="w">    </span><span class="n">message_key</span><span class="w"> </span><span class="nb">VARCHAR</span><span class="p">(</span><span class="mi">64</span><span class="p">)</span><span class="w"> </span><span class="k">PRIMARY</span><span class="w"> </span><span class="k">KEY</span><span class="p">,</span><span class="w">   </span><span class="c1">-- 业务唯一键：订单号/消息ID</span>
<span class="w">    </span><span class="n">consumed_at</span><span class="w"> </span><span class="n">DATETIME</span><span class="w"> </span><span class="k">NOT</span><span class="w"> </span><span class="k">NULL</span>
<span class="p">);</span>

<span class="k">BEGIN</span><span class="p">;</span>
<span class="k">INSERT</span><span class="w"> </span><span class="k">IGNORE</span><span class="w"> </span><span class="k">INTO</span><span class="w"> </span><span class="n">consumed_messages</span><span class="w"> </span><span class="p">(</span><span class="n">message_key</span><span class="p">,</span><span class="w"> </span><span class="n">consumed_at</span><span class="p">)</span>
<span class="w">    </span><span class="k">VALUES</span><span class="w"> </span><span class="p">(</span><span class="s1">&#39;order:20260916:0001&#39;</span><span class="p">,</span><span class="w"> </span><span class="n">NOW</span><span class="p">());</span>
<span class="c1">-- 受影响行数为 0 =&gt; 已消费过，直接 ACK 跳过</span>
<span class="k">UPDATE</span><span class="w"> </span><span class="n">points</span><span class="w"> </span><span class="k">SET</span><span class="w"> </span><span class="n">balance</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">balance</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">100</span><span class="w"> </span><span class="k">WHERE</span><span class="w"> </span><span class="n">order_id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">...;</span>
<span class="k">COMMIT</span><span class="p">;</span>
</code></pre></div>


两个实践要点：
<ol>
<li><strong>去重键要用业务键，不要用消息 ID</strong>。Broker 重投后 message_id 通常不变，但生产端重发（本地消息表场景）会生成新 ID；只有"订单号 + 事件类型"这种业务键才真正标识语义。</li>
<li><strong>去重记录要有清理策略</strong>，否则表无限膨胀。按业务容忍窗口清理即可——对账系统跑过 7 天前的数据后，更早的去重记录就可以删了。</li>
</ol>
<hr>
<h2>6. 实测：三种配置的丢消息率对比</h2>

写了 24 分钟原理，是时候用数据验证了。我写了一个链路模拟器（完整代码在仓库 <code>tools/bench_mq_delivery.py</code>，纯标准库、结果可复现）：模拟 10 万条消息经过"生产者 → Broker → 消费者"完整链路，注入三类故障——
<ul>
<li>网络丢包率 0.1%（生产者 → Broker 方向）</li>
<li>Broker 半路宕机一次（5 万条消息时，模拟重启）</li>
<li>消费者处理消息时 0.5% 概率崩溃（模拟 OOM Kill）</li>

三个数据点，三条结论：

<strong>结论一：网络确认是性价比最高的一层。</strong> partial 对比 fire-and-forget，生产端加了确认重试，丢了 127 条（网络丢包 + Broker 崩溃窗口那部分全被兜住了）。只需要一行配置。

<strong>结论二：丢消息的最后一米在消费端。</strong> partial 明明生产端和 Broker 端都配好了，还是丢了 488 条——全部来自"自动 ACK 后消费者崩溃"。这 488 条就是文章开头事故里最隐蔽的那部分：日志显示"消费到了"，但业务没执行。

<strong>结论三：full 模式用 85 次重复换 0 丢失。</strong> 注意 full 配置多了 85 条重复 + 85 次额外发送——这正是"先处理后确认"的重投代价。代价是<strong>确定性的、有界的（0.085%），且被幂等消费完全消化</strong>；而丢消息的代价是不确定的、无界的（可能是积分，也可能是退款）。

一句话总结：<strong>用可预算的小成本（重复 + 幂等表），消灭不可预算的大风险（丢消息）</strong>。
<hr>
<h2>7. 重试、退避与死信队列</h2>

消息兜住了，还有一类问题在等着：<strong>下游一直失败怎么办</strong>。

无脑重试的代价可以用数据量化。模拟消费者宕机 10 秒，期间重试线程不断投递：
<table>
<thead>
<tr>
<th>重试策略</th>
<th>宕机 10 秒内的无效尝试</th>
</tr>
</thead>
<tbody>
<tr>
<td>固定间隔 100ms</td>
<td>101 次</td>
</tr>
<tr>
<td>指数退避（100ms 起步，×2，封顶 5s）</td>
<td><strong>7 次</strong></td>
</tr>
</tbody>
</table>

差了 14 倍。下游越拥塞，固定间隔重试打得越密，恢复越慢——这就是重试风暴。指数退避的标准姿势：
<div class="codehilite"><pre><span></span><code><span class="n">delay</span> <span class="o">=</span> <span class="nb">min</span><span class="p">(</span><span class="n">base</span> <span class="o">*</span> <span class="p">(</span><span class="mi">2</span> <span class="o">**</span> <span class="n">attempt</span><span class="p">)</span> <span class="o">+</span> <span class="n">random</span><span class="o">.</span><span class="n">uniform</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="n">base</span><span class="p">),</span> <span class="n">max_delay</span><span class="p">)</span>
</code></pre></div>


末尾的 <code>random.uniform</code> 是<strong>抖动（jitter）</strong>：没有它，同一批失败的重试会在完全相同的时刻再次打出波峰，退避了个寂寞。

重试策略要配合<strong>分层队列</strong>：
<div class="codehilite"><pre><span></span><code>主队列 ──NACK──&gt; 重试队列 L1 (延迟 5s)  ──NACK──&gt; 重试队列 L2 (延迟 30s)
                                                      │ 超过 3 次
                                                      v
                                              死信队列 DLQ ──&gt; 人工介入/告警
</code></pre></div>

<ul>
<li><strong>L1/L2 延迟队列</strong>：给下游喘息时间，避免热消息高频空转；</li>
<li><strong>DLQ</strong>：重试穷尽后的最终归宿。关键不是把消息扔进去，而是<strong>必须有监控和人工处理流程</strong>——DLQ 里躺了消息没人看，等于换了个地方丢消息。</li>
</ul>

判断要不要重试要区分异常类型：网络超时、下游 503 这类<strong>瞬时异常</strong>值得退避重试；参数校验失败、消息反序列化失败这类<strong>永久异常</strong>，重试一万次也是失败，直接进 DLQ。
<hr>
<h2>8. 积压处理与延迟消息</h2>

可靠性之外，MQ 的日常运维还有两件高频事。

<strong>积压处理</strong>。积压的根因通常是消费速度 &lt; 生产速度。先看能否<strong>水平扩容消费者</strong>——注意消费者数量受限于队列分区/分片数（Kafka 的 consumer 数 ≤ partition 数，超出的实例只能空转）。扩容来不及时的经典组合拳：写一个临时程序把积压消息<strong>批量搬运到一个 10 倍分区的临时 topic</strong>，再起 10 倍消费者消化，处理完删掉临时链路。

预防手段是给消费逻辑做<strong>批量化</strong>：单条 <code>UPDATE</code> 攒成批量 <code>INSERT ... ON DUPLICATE KEY UPDATE</code>，消费吞吐通常能上一个数量级。

<strong>延迟消息</strong>。订单 30 分钟未支付自动取消、优惠券到期提醒，都需要"消息在未来的某时刻才被消费"。三种实现对比：
<table>
<thead>
<tr>
<th>方案</th>
<th>精度</th>
<th>复杂度</th>
</tr>
</thead>
<tbody>
<tr>
<td>死信队列 + TTL（RabbitMQ 经典玩法）</td>
<td>有队头阻塞问题：前一条 TTL 长会卡住后面的</td>
<td>低</td>
</tr>
<tr>
<td>RocketMQ 延迟等级 / 定时消息</td>
<td>秒级（4.x 固定 18 个等级，5.x 任意时刻）</td>
<td>低</td>
</tr>
<tr>
<td>时间轮 / 延迟队列服务（自建）</td>
<td>任意精度</td>
<td>高，需要考虑持久化与恢复</td>
</tr>
</tbody>
</table>

注意 TTL + DLQ 方案的队头陷阱：队列是 FIFO 的，第一条消息 TTL 10 分钟，后面 TTL 30 秒的消息也得等它出队才检查——<strong>延迟值差异大的场景不要用</strong>。
<hr>
<h2>9. 上线 Checklist + 高频 FAQ</h2>

<strong>上线 Checklist</strong>

生产端：
<ul>
<li>[ ] 关键消息禁用 fire-and-forget，开启发送确认（Confirm / <code>acks=all</code> / 同步发送）</li>
<li>[ ] 发送失败有重试，重试上限 + 告警</li>
<li>[ ] 本地事务与发消息的原子性：有本地消息表（Transactional Outbox）</li>
<li>[ ] 消息体里带业务唯一键（供消费端幂等与对账使用）</li>
</ul>

Broker 端：
<ul>
<li>[ ] queue/exchange/message 全部持久化（RabbitMQ 三者缺一不可）</li>
<li>[ ] 多副本或主从，<code>min.insync.replicas</code> ≥ 2（Kafka）</li>
<li>[ ] 明确刷盘模式，知道掉电丢失窗口是多大并接受</li>
</ul>

消费端：
<ul>
<li>[ ] 手动 ACK，业务成功后才确认</li>
<li>[ ] 消费逻辑幂等：去重表或状态机，去重键用业务键</li>
<li>[ ] NACK 不无限 requeue，重试有限次后进 DLQ</li>
<li>[ ] DLQ 有监控告警和人工处理流程</li>
</ul>

运维：
<ul>
<li>[ ] 队列深度、消费延迟（lag）有监控告警</li>
<li>[ ] 有对账任务兜底——<strong>MQ 不是最可靠的系统，对账才是最后防线</strong></li>
<li>[ ] 消息按业务价值分级配置，不是所有 topic 都上全套</li>
</ul>

<strong>高频 FAQ</strong>

<strong>Q：怎么选 MQ？</strong> 中小规模、已有 Redis：Redis Stream 够用（记得配 <code>maxlen</code> 和消费组）。通用场景 RabbitMQ（易运维）或 RocketMQ（功能全，事务消息/延迟消息原生支持）。大数据流、日志管道：Kafka。选型差异远小于配置差异——一个配置错误的 Kafka 丢起消息来比配置正确的 RabbitMQ 惨得多。

<strong>Q：Redis 做队列可靠吗？</strong> 默认配置不可靠（AOF everysec 有 1 秒丢失窗口、主从切换可能丢），<code>WAIT</code> 命令 + appendfsync always 可以逼近可靠但吞吐骤降。小规模 + 接受小概率丢失可用；支付类消息请上专业 MQ。

<strong>Q：事务消息（RocketMQ half message）和本地消息表选哪个？</strong> 事务消息省去轮询表，但绑定特定 MQ 且仍有回查机制要实现。本地消息表与 MQ 无关、便于排查、还能顺便做消息审计。多数团队本地消息表更实用，MQ 本身支持事务消息（如 RocketMQ）时可以省一层。

<strong>Q：消费很慢，先加消费者还是先优化逻辑？</strong> 先看瓶颈：CPU 密集优化逻辑/批量化，IO 密集加并发（asyncio / 线程池 + 调大 prefetch）。逻辑有批量优化空间时优先批量化，再扩分区和消费者——盲目扩容受 partition 数限制还白花钱。
<hr>
<h2>写在最后</h2>

回到开头那 600 笔丢失的订单。修复方案没有引入任何新组件：生产端补上发送确认和本地消息表，Broker 开持久化，消费端换手动 ACK + 去重表，DLQ 加上告警。上线后对账差异归零，重复消费被去重表消化，月均重复量不到万分之九。

MQ 可靠性这件事，知识本身不复杂，复杂的是<strong>三跳里任何一跳的默认配置都不面向可靠</strong>——默认 auto-ack、默认异步刷盘、默认 fire-and-forget。工程上的功课，就是知道每一跳的默认值是什么、哪些业务承受得起、承受不起的怎么换掉。
