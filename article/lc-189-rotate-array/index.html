    <noscript><div class="ns-article"><h1>【LC 189】轮转数组：三次翻转 —— 反转是自己的逆运算</h1><div class="ns-meta">2026/9/29 · Zhou Jun</div><div class="markdown-body"><blockquote>

给定一个整数数组 <code>nums</code>，将数组中的元素向右轮转 <code>k</code> 个位置，其中 <code>k</code> 是非负数。
示例：<code>[1,2,3,4,5,6,7]</code>, <code>k=3</code> → <code>[5,6,7,1,2,3,4]</code>。
进阶：尽可能想出<strong>更多的解决方案</strong>，至少有三种；空间复杂度 <strong>O(1)</strong> 的算法。
</blockquote>

题目进阶点名要 O(1) 空间 —— 这句话把"开新数组按位搬运"（O(n) 空间、最直觉）直接排除，剩下的主角就是<strong>三次翻转</strong>。它是这类题的面试首选：不需要任何数论，六次交换讲完。
<h2>一、先取模，再看那个 Python 语言坑</h2>

<strong>k 必须先对 n 取模</strong>：轮转 n 位等于没转，<code>k</code> 完全可能比 <code>n</code> 大（<code>k=100</code> 配单元素数组）。取模后 <code>k ∈ [0, n-1]</code>，若 <code>k = 0</code> 直接返回。

顺带一个真实的语言坑：Python 圈流行的一行解法是
<div class="codehilite"><pre><span></span><code><span class="n">nums</span><span class="p">[:]</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="o">-</span><span class="n">k</span><span class="p">:]</span> <span class="o">+</span> <span class="n">nums</span><span class="p">[:</span><span class="o">-</span><span class="n">k</span><span class="p">]</span>
</code></pre></div>


<strong>它在 <code>k = 0</code> 时是错的</strong>：<code>-0</code> 就是 <code>0</code>，<code>nums[-0:]</code> 是<strong>整个数组</strong>，结果变成"数组接上自己"。修法是先取模并特判（或写 <code>nums[n-k:]</code> —— 但 <code>k % n == 0</code> 时 <code>n-k = n</code>，<code>nums[n:]</code> 是空的、<code>nums[:n]</code> 是全数组，正好对）：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">rotate</span><span class="p">(</span><span class="n">nums</span><span class="p">,</span> <span class="n">k</span><span class="p">):</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)</span>
    <span class="n">k</span> <span class="o">%=</span> <span class="n">n</span>
    <span class="k">if</span> <span class="n">k</span> <span class="o">==</span> <span class="mi">0</span><span class="p">:</span>
        <span class="k">return</span>
    <span class="n">nums</span><span class="p">[:]</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="n">n</span> <span class="o">-</span> <span class="n">k</span><span class="p">:]</span> <span class="o">+</span> <span class="n">nums</span><span class="p">[:</span><span class="n">n</span> <span class="o">-</span> <span class="n">k</span><span class="p">]</span>
</code></pre></div>


<code>nums[:] = ...</code> 这个写法本身就是<strong>原地修改</strong>的 Python 惯用法（切片赋值改的是原对象的内存内容）—— 和三次翻转一样满足 O(1) 额外空间吗？不：右侧拼接了新列表，仍是 O(n) 辅助空间。<strong>它只是"看起来原地"</strong>。要真 O(1)，往下看。
<h2>二、三次翻转：把"轮转"分解成两次反转</h2>
<h3>2.1 核心观察</h3>

轮转 k 位 = <strong>把数组在 <code>n-k</code> 处切成两段，交换两段的左右位置</strong>：
<div class="codehilite"><pre><span></span><code>[1,2,3,4 | 5,6,7]  →  [5,6,7 | 1,2,3,4]
</code></pre></div>


直接交换两段要 O(n) 暂存。但换个视角：<strong>先整体翻转</strong> —— 两段的内部顺序全部倒过来，同时两段恰好左右就位：
<div class="codehilite"><pre><span></span><code><span class="k">[1,2,3,4,5,6,7]  整体翻转 →  [7,6,5 | 4,3,2,1]</span>
<span class="w">                                </span><span class="na">↑两段就位，但内部全反</span>
<span class="na">再各自翻回内部顺序：</span>
<span class="k">[7,6,5] → [5,6,7]      [4,3,2,1] → [1,2,3,4]</span>
<span class="na">得  [5,6,7,1,2,3,4]  ✓</span>
</code></pre></div>


为什么成立：<strong>反转是自己的逆运算</strong>（翻两次 = 恒等）。整体翻转完成了"位置交换"，代价是把两段内部的顺序搞反了；每段各自再翻一次，内部顺序复原 —— 两次反转恰好一个管位置、一个管顺序，互不干扰。
<h3>2.2 逐帧推演</h3>

官方例 <code>[1,2,3,4,5,6,7]</code>，<code>k=3</code>（与状态机 <code>rotateSteps.js</code> 的 8 帧实际输出逐行核对过，每帧是一对交换）：

第 4 帧有个细节：<strong>"前 k 个"区间 <code>[0,2]</code> 长度 3，只需 1 次交换</strong>（中间的 6 不用动）。翻转次数是 <code>floor(区间长度 / 2)</code> —— 三轮合计 <code>floor(7/2) + floor(3/2) + floor(4/2) = 3 + 1 + 2 = 6</code> 次交换，每个元素恰好动 0 或 1 次。
<h2>三、三次翻转为什么是 O(1)</h2>

每一步都是<strong>双指针向中间收拢的原地交换</strong>：<code>i</code> 从区间左端、<code>j</code> 从右端，交换后各进一格，相遇即止。全程只用了 <code>i</code>、<code>j</code>、一个临时变量 —— <strong>O(1) 辅助空间</strong>。

时间上每轮扫描半个区间，三轮合计正好 O(n)：每个元素被读写常数次。

对照另外两种 O(1) 空间解法：
<table>
<thead>
<tr>
<th>解法</th>
<th>思路</th>
<th>时间</th>
<th>备注</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>三次翻转</strong></td>
<td>整体 → 前 k → 后 n-k</td>
<td>O(n)</td>
<td>无数论，最好写</td>
</tr>
<tr>
<td>环状替换</td>
<td>从 0 出发按 <code>(i+k) mod n</code> 跳环，跳回起点换下一列，环数 = <code>gcd(n, k)</code></td>
<td>O(n)</td>
<td>需要数圈，容易错</td>
</tr>
<tr>
<td>逐位搬运</td>
<td>每轮把最后一个搬到开头，做 k 轮</td>
<td>O(n·k)</td>
<td>k 大时超时，只有教学价值</td>
</tr>
</tbody>
</table>

环状替换的正确性论证依赖 <code>gcd(n, k)</code> 把下标分成若干个置换环 —— 数学上漂亮，工程上三次翻转完胜。<strong>面试先写三次翻转，环状替换作为"我知道还有一种"的加分项。</strong>
<h2>四、Java 版</h2>
<div class="codehilite"><pre><span></span><code><span class="kd">class</span> <span class="nc">Solution</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">public</span><span class="w"> </span><span class="kt">void</span><span class="w"> </span><span class="nf">rotate</span><span class="p">(</span><span class="kt">int</span><span class="o">[]</span><span class="w"> </span><span class="n">nums</span><span class="p">,</span><span class="w"> </span><span class="kt">int</span><span class="w"> </span><span class="n">k</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kt">int</span><span class="w"> </span><span class="n">n</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">nums</span><span class="p">.</span><span class="na">length</span><span class="p">;</span>
<span class="w">        </span><span class="n">k</span><span class="w"> </span><span class="o">%=</span><span class="w"> </span><span class="n">n</span><span class="p">;</span><span class="w">                          </span><span class="c1">// k 可能大于 n</span>
<span class="w">        </span><span class="n">reverse</span><span class="p">(</span><span class="n">nums</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="n">n</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">);</span><span class="w">         </span><span class="c1">// ① 整体</span>
<span class="w">        </span><span class="n">reverse</span><span class="p">(</span><span class="n">nums</span><span class="p">,</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span><span class="w"> </span><span class="n">k</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">);</span><span class="w">         </span><span class="c1">// ② 前 k</span>

<span class="w">    </span><span class="p">}</span>

<span class="w">        </span><span class="k">while</span><span class="w"> </span><span class="p">(</span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">j</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="kt">int</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">a</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="p">;</span><span class="w"> </span><span class="n">a</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">a</span><span class="o">[</span><span class="n">j</span><span class="o">]</span><span class="p">;</span><span class="w"> </span><span class="n">a</span><span class="o">[</span><span class="n">j</span><span class="o">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">t</span><span class="p">;</span>

<span class="p">}</span>
</code></pre></div>


注意 <code>k %= n</code> 之后如果 <code>k == 0</code>，三个 reverse 各自空转（区间长 0 或 1），天然安全 —— 不需要特判。<strong>这是三次翻转比切片法稳的地方：切片法的 k=0 是真坑，翻转法的 k=0 只是空转。</strong>
<h2>五、边界情况与常见坑</h2>

<strong>坑一：忘了取模。</strong> <code>k = 100</code> 配 <code>n = 1</code>：翻转区间 <code>[0, 99]</code> 直接越界。取模是第一步，不是可选优化。

<strong>坑二：翻转的区间端点。</strong> 三轮区间是 <code>[0, n-1]</code> / <code>[0, k-1]</code> / <code>[k, n-1]</code> —— 第二轮的右端是 <code>k-1</code> 不是 <code>k</code>（前 k 个的下标是 0..k-1），第三轮的左端是 <code>k</code>。写错一格就是差一位的死循环或漏翻转。

<strong>坑三：<code>nums = [1]</code> 这类退化输入。</strong> 取模后 k = 0，三个区间 <code>[0,0]</code>/<code>[0,-1]</code>/<code>[0,0]</code> —— 第二轮区间为空，<code>while i &lt; j</code> 天然不进。翻转法对退化输入免疫。

<strong>坑四：向左轮转。</strong> 题目只考向右，但向左 k 位等价于向右 <code>n - (k % n)</code> 位 —— 一行换算，别重写算法。
<h2>六、变体：同一个"反转思想"</h2>
<table>
<thead>
<tr>
<th>题</th>
<th>变的是什么</th>
<th>怎么想</th>
</tr>
</thead>

<td><strong>LC 151 翻转字符串里的单词</strong></td>
<td>数组换成字符串，"轮转"换成"单词反序"</td>
<td>同款三次翻转：整体翻转 → 每个单词各自翻回来 —— 本文思想的直接复用</td>
</tr>

</tr>

<strong>家族共性</strong>：当目标是"元素的位置重排"，先问一句 —— <strong>这个变换能不能拆成若干次"反转"的复合？</strong> 反转是原地 O(1) 的最基础操作，能拆就赢。
<h2>七、面试怎么答</h2>
<ul>
<li><strong>先给思路清单</strong>：切片搬运（O(n) 空间）、逐位搬运（O(n·k)）、环状替换、三次翻转 —— 展示你知道全部选项；</li>
<li><strong>写三次翻转</strong>：先 <code>k %= n</code>，三行 reverse；</li>
<li><strong>主动讲原理</strong>：反转是自己的逆运算，整体翻转管"位置交换"、分段翻转管"顺序恢复"；</li>
<li><strong>主动踩坑自证</strong>：<code>k %= n</code> 防越界；Python 切片法的 <code>nums[-0:]</code> 陷阱；<code>k=0</code> 时翻转法天然安全；</li>
<li><strong>自测</strong>：<code>rotate([1,2,3,4,5,6,7], 3) == [5,6,7,1,2,3,4]</code>、<code>rotate([1,2], 5) == [2,1]</code>、<code>rotate([1,2,3], 3) == [1,2,3]</code>（k = n 不变）；</li>
<li><strong>一句话总结</strong>：<strong>轮转 = 两段交换位置 = 整体反转 + 两段各自反转</strong> —— 反转是自己的逆运算，所以位置和顺序可以分开还原。</li>
</ul>
