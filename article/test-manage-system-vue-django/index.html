    <noscript><div class="ns-article"><h1>从零搭建测试管理系统：Vue 3 + Django 全栈实战</h1><div class="ns-meta">2026/7/3 · Zhou Jun</div><div class="markdown-body"><h1 id="vue-3-django">从零搭建测试管理系统：Vue 3 + Django 全栈实战</h1>
<h2 id="_1">前言</h2>
<p>在软件开发中，测试是保证质量的关键环节。但很多团队还在用 Excel 管理测试用例、用微信群同步缺陷——效率低不说，还容易遗漏和出错。</p>
<p>今天要介绍的<strong>测试管理系统（Test Management System）</strong>就是一个专为 QA 团队打造的全栈平台。它用 <strong>Vue 3</strong> 做前端界面，<strong>Django</strong> 做后端服务，覆盖了测试用例管理、测试计划、执行跟踪、缺陷管理、团队协作的完整生命周期。</p>
<blockquote>
<p>项目地址：<a href="https://github.com/zhoujungis/test_manage_system">github.com/zhoujungis/test_manage_system</a></p>
</blockquote>
<hr />
<h2 id="_2">一、这个系统能做什么？</h2>
<p>用一个图来直观理解：</p>
<div class="codehilite"><pre><span></span><code>                         测试管理系统
 ┌─────────────────────────────────────────────────────────────┐
 │                                                             │
 │  📋 用例管理          📅 测试计划          🔧 执行跟踪       │
 │  ┌──────────┐       ┌──────────┐       ┌──────────┐        │
 │  │ 写用例    │  ──▶  │ 做计划    │  ──▶  │ 跑测试    │        │
 │  │ 导 Excel  │       │ 排顺序    │       │ 记结果    │        │
 │  └──────────┘       └──────────┘       └──────────┘        │
 │                                                    │       │
 │                          ┌─────────────────────────┘       │
 │                          ▼                                  │
 │  🐛 缺陷管理             📊 看板统计          👥 团队协作    │
 │  ┌──────────┐       ┌──────────┐       ┌──────────┐        │
 │  │ 提 Bug   │       │ 数据大盘  │       │ 多角色    │        │
 │  │ 跟踪状态  │       │ 图表分析  │       │ 权限控制  │        │
 │  └──────────┘       └──────────┘       └──────────┘        │
 │                                                             │
 └─────────────────────────────────────────────────────────────┘
</code></pre></div>

<p>简单来说：<strong>把测试工作中 Excel 和聊天记录里的东西，全部搬到一个专业的 Web 系统里</strong>——写用例、分任务、测功能、提 Bug、看报表，一站式搞定。</p>
<hr />

<p>这个项目采用了当前最主流的全栈方案：</p>

<hr />
<h2 id="_4">三、四种角色，各司其职</h2>
<p>系统设计了四个角色，不同角色看到的功能各不相同：</p>
<div class="codehilite"><pre><span></span><code>┌───────────────────────────────────────────────────────────┐
│  角色权限金字塔                                            │
│                                                           │
│       ┌──────────┐                                        │
│       │  Admin   │  系统管理 + 用户管理 + 权限配置         │
│       │  管理员   │  &quot;我有所有钥匙&quot;                        │
│       └────┬─────┘                                        │
│            │                                              │
│       ┌────▼─────┐                                        │
│       │Developer │  用例库增删改 + 项目参与 + 测试执行      │
│       │  开发     │  &quot;我来维护用例库&quot;                       │
│       └────┬─────┘                                        │
│            │                                              │
│       ┌────▼─────┐                                        │
│       │  Tester  │  项目参与 + 看用例 + 跑测试              │
│       │  测试     │  &quot;我来执行测试&quot;                         │
│       └────┬─────┘                                        │
│            │                                              │
│       ┌────▼─────┐                                        │
│       │  Viewer  │  只能看，不能动                          │
│       │  访客     │  &quot;我就看看&quot;                             │
│       └──────────┘                                        │
│                                                           │
└───────────────────────────────────────────────────────────┘
</code></pre></div>

<p>每个权限都是<strong>细粒度</strong>的——同样是"看用例库"，你能看但不能改？你是 Tester。你还能增删改？你是 Developer。每条权限都是独立开关，灵活组合。</p>
<h3 id="_5">安全机制</h3>
<ul>
<li>📧 仅限 <code>@glazero.com</code> 邮箱注册</li>
<li>🔑 密码加密存储，登录需要验证码</li>
<li>⏱️ Access Token 1小时有效，Refresh Token 8小时自动续期</li>
<li>🚦 登录和发验证码接口做了频率限制</li>
</ul>
<hr />
<h2 id="_6">四、十大功能模块详解</h2>
<h3 id="41">4.1 用户认证 —— 进门先刷卡</h3>
<p>注册流程设计得很严谨：</p>
<div class="codehilite"><pre><span></span><code><span class="n">用户输入邮箱</span><span class="w"> </span><span class="p">(</span><span class="nv">@glazero</span><span class="p">.</span><span class="n">com</span><span class="p">)</span>
<span class="w">        </span><span class="err">│</span>
<span class="w">        </span><span class="err">▼</span>
<span class="w">  </span><span class="n">邮箱格式检查</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">域名白名单验证</span>
<span class="w">        </span><span class="err">│</span>
<span class="w">        </span><span class="err">▼</span>
<span class="w">  </span><span class="n">发送验证码到邮箱</span>
<span class="w">        </span><span class="err">│</span>
<span class="w">        </span><span class="err">▼</span>
<span class="w">  </span><span class="n">输入验证码</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">设置密码</span>
<span class="w">        </span><span class="err">│</span>
<span class="w">        </span><span class="err">▼</span>
<span class="w">  </span><span class="n">注册成功</span><span class="w"> </span><span class="err">→</span><span class="w"> </span><span class="n">分配默认角色</span>
<span class="w">        </span><span class="err">│</span>
<span class="w">        </span><span class="err">▼</span>
<span class="w">  </span><span class="n">登录</span><span class="w"> </span><span class="err">→</span><span class="w"> </span><span class="n">获取</span><span class="w"> </span><span class="n">JWT</span><span class="w"> </span><span class="n">Token</span><span class="w"> </span><span class="err">→</span><span class="w"> </span><span class="n">进入系统</span>
</code></pre></div>

<p>用户系统采用 Django 内置 <code>auth.User</code> + <code>UserProfile</code> 扩展的方案：</p>
<div class="codehilite"><pre><span></span><code><span class="c1"># accounts/models.py — 实际代码结构</span>
<span class="kn">from</span><span class="w"> </span><span class="nn">django.contrib.auth.models</span><span class="w"> </span><span class="kn">import</span> <span class="n">User</span>

<span class="k">class</span><span class="w"> </span><span class="nc">UserProfile</span><span class="p">(</span><span class="n">models</span><span class="o">.</span><span class="n">Model</span><span class="p">):</span>
    <span class="n">user</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">OneToOneField</span><span class="p">(</span><span class="n">User</span><span class="p">,</span> <span class="n">on_delete</span><span class="o">=</span><span class="n">models</span><span class="o">.</span><span class="n">CASCADE</span><span class="p">,</span>
                                <span class="n">related_name</span><span class="o">=</span><span class="s1">&#39;profile&#39;</span><span class="p">)</span>
    <span class="n">role</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">CharField</span><span class="p">(</span><span class="n">max_length</span><span class="o">=</span><span class="mi">20</span><span class="p">,</span> <span class="n">default</span><span class="o">=</span><span class="s1">&#39;tester&#39;</span><span class="p">,</span>
        <span class="n">choices</span><span class="o">=</span><span class="p">[(</span><span class="s1">&#39;admin&#39;</span><span class="p">,</span><span class="s1">&#39;管理员&#39;</span><span class="p">),(</span><span class="s1">&#39;tester&#39;</span><span class="p">,</span><span class="s1">&#39;测试&#39;</span><span class="p">),</span>
                 <span class="p">(</span><span class="s1">&#39;developer&#39;</span><span class="p">,</span><span class="s1">&#39;开发&#39;</span><span class="p">),(</span><span class="s1">&#39;viewer&#39;</span><span class="p">,</span><span class="s1">&#39;访客&#39;</span><span class="p">)])</span>
    <span class="n">phone</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">CharField</span><span class="p">(</span><span class="n">max_length</span><span class="o">=</span><span class="mi">20</span><span class="p">,</span> <span class="n">blank</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">can_access_projects</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">BooleanField</span><span class="p">(</span><span class="n">default</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">can_access_testcase_library</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">BooleanField</span><span class="p">(</span><span class="n">default</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">can_manage_testcase_library</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">BooleanField</span><span class="p">(</span><span class="n">default</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">can_access_my_projects</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">BooleanField</span><span class="p">(</span><span class="n">default</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>

<p>注册时根据角色自动设置默认权限——<code>ROLE_DEFAULT_PERMISSIONS</code> 字典定义了 admin/tester/developer/viewer 四种角色各自拥有的功能开关。</p>
<h3 id="42">4.2 项目管理 —— 建立工作空间</h3>
<p>每个测试项目包含完整的上下文信息：</p>
<div class="codehilite"><pre><span></span><code>Project（项目）
├── 基本信息：名称、描述、产品线（摄像头/门铃）
├── 状态：活跃 / 已归档
├── 成员管理
│   ├── Leader（负责人）
│   ├── Tester（测试人员）
│   └── Developer（开发人员）
├── 模块树
│   ├── 📁 视频功能
│   │   ├── 📄 实时预览
│   │   └── 📄 录像回放
│   └── 📁 音频功能
│       └── 📄 双向对讲
└── 任务管理
    ├── 提测轮次
    ├── 优先级
    └── 截止日期
</code></pre></div>

<p>这里最巧妙的是<strong>模块树</strong>设计——通过 Django 的 <code>parent</code> 自引用外键实现无限层级：</p>
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">Module</span><span class="p">(</span><span class="n">models</span><span class="o">.</span><span class="n">Model</span><span class="p">):</span>
    <span class="n">project</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">ForeignKey</span><span class="p">(</span><span class="n">Project</span><span class="p">,</span> <span class="n">on_delete</span><span class="o">=</span><span class="n">models</span><span class="o">.</span><span class="n">CASCADE</span><span class="p">)</span>
    <span class="n">name</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">CharField</span><span class="p">(</span><span class="n">max_length</span><span class="o">=</span><span class="mi">100</span><span class="p">)</span>
    <span class="n">parent</span> <span class="o">=</span> <span class="n">models</span><span class="o">.</span><span class="n">ForeignKey</span><span class="p">(</span><span class="s1">&#39;self&#39;</span><span class="p">,</span> <span class="n">null</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">blank</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span>
                               <span class="n">on_delete</span><span class="o">=</span><span class="n">models</span><span class="o">.</span><span class="n">CASCADE</span><span class="p">)</span>
    <span class="c1"># parent 为 None → 根模块</span>
    <span class="c1"># parent 指向其他 Module → 子模块</span>
</code></pre></div>

<h3 id="43">4.3 用例管理 —— 测试的灵魂</h3>
<p>用例库是整个系统的核心，按产品线（摄像头/门铃）组织：</p>
<div class="codehilite"><pre><span></span><code>用例结构
┌────────────────────────────────────────────┐
│  标题：验证摄像头夜视模式自动切换           │
│  优先级：P1（高）                           │
│  类型：功能测试                             │
│  状态：已启用                               │
│  前置条件：环境光传感器正常                 │
│  ┌──────────────────────────────────────┐  │
│  │  步骤 1                               │  │
│  │  操作：将摄像头置于黑暗环境             │  │
│  │  预期结果：自动切换到夜视模式           │  │
│  ├──────────────────────────────────────┤  │
│  │  步骤 2                               │  │
│  │  操作：打开手电筒照射镜头               │  │
│  │  预期结果：自动切换回日间模式           │  │
│  └──────────────────────────────────────┘  │
└────────────────────────────────────────────┘
</code></pre></div>

<p>批量导入更是实用利器——一条 Django 命令把 Excel 里的用例统统导进来：</p>
<div class="codehilite"><pre><span></span><code>python<span class="w"> </span>manage.py<span class="w"> </span>import_camera_cases<span class="w"> </span>摄像头用例.xlsx
</code></pre></div>

<p>它会自动识别列标题，按工作表名称分组为模块，自动编号步骤。</p>
<h3 id="44">4.4 用例分配与执行 —— 测试跑起来</h3>
<p>一条用例怎么变成测试任务？看看这个流程：</p>
<div class="codehilite"><pre><span></span><code>用例库（Case Library）
    │
    │  分配（Assign）
    ▼
项目 → 任务 → 成员
    │
    │  执行（Execute）
    ▼
┌──────────────────────────────────┐
│  状态：                          │
│  ⬜ 待测试 (pending)             │
│  ✅ 通过 (passed)                │
│  ❌ 失败 (failed)                │
│  ⬛ 不适用 (not_applicable)      │
│  ⬜ 未测 (not_tested)            │
└──────────────────────────────────┘
    │
    │  审批（Approve）
    ▼
  Leader 审核 → 批量通过/驳回
</code></pre></div>

<p>每个执行结果都能<strong>上传附件</strong>（最大 15MB），比如截图、日志。Leader 可以<strong>批量审批</strong>，不用一个个点。</p>
<h3 id="45">4.5 测试计划 —— 先规划再执行</h3>

├── 时间范围：2024-01-15 ~ 2024-01-30
├── 状态：草稿 → 活跃 → 已完成

    ├── ③ 验证夜视切换功能
    └── ④ 验证移动侦测告警
</code></pre></div>

<div class="codehilite"><pre><span></span><code>执行运行 #42（基于计划&quot;摄像头 V2.0 回归测试&quot;）
状态：运行中
┌──────┬──────────────────────┬────────┬──────────┐
│ 序号 │ 用例名称              │  结果   │ 备注     │
├──────┼──────────────────────┼────────┼──────────┤
│  1   │ 验证设备启动时间       │  ✅    │          │
│  2   │ 验证视频流稳定性       │  ❌    │ 偶发花屏  │

<h3 id="47-bug">4.7 缺陷追踪 —— Bug 的生命周期</h3>
<p>执行测试时发现了问题？直接提缺陷：</p>
<div class="codehilite"><pre><span></span><code>缺陷生命周期
┌──────────┐    ┌──────────┐    ┌──────────┐    ┌──────────┐
│   Open   │───▶│In Progress│───▶│ Resolved │───▶│  Closed  │
│   新建    │    │  处理中   │    │  已解决   │    │  已关闭   │
└──────────┘    └──────────┘    └──────────┘    └──────────┘
       ▲                              │               │
       └──────────────────────────────┘               │
                 重新打开                              │
</code></pre></div>

<p>每条缺陷记录包含：
- <strong>标题 &amp; 描述</strong> — 说什么问题
- <strong>严重程度</strong> — S0（最严重/阻塞）到 S4（轻微/建议）
- <strong>关联项目</strong> — 哪个项目的问题
- <strong>关联测试结果</strong> — 哪次测试发现的
- <strong>指派人</strong> — 谁来修</p>

<h3 id="49-api">4.9 数据统计 —— API 层面的数据聚合</h3>
<p>除了首页入口，系统在 <code>dashboard</code> app 中提供了 <strong>统计数据 API</strong>（<code>GET /api/dashboard/stats/</code>），供其他页面或外部工具调用：</p>
<ul>
<li><code>total_projects</code>、<code>total_testcases</code>、<code>total_testplans</code>、<code>total_testruns</code> — 四项基本计数</li>
<li><code>results</code> — 测试结果分布（passed/failed/blocked/skipped/pending）及通过率</li>
<li><code>defects</code> — 缺陷统计（total/open/resolved）</li>
<li><code>priority_distribution</code> — 用例优先级分布（P0-P4 各有多少）</li>
<li><code>type_distribution</code> — 用例类型分布（功能/API/UI/性能）</li>
<li><code>recent_runs</code> — 最近 5 条执行记录</li>
</ul>
<p>支持通过 <code>project_id</code> 参数按项目过滤。这个 API 使用 Django ORM 的 <code>aggregate</code> + 条件 <code>Count</code> 在<strong>单次查询</strong>中完成所有统计，性能高效。</p>
<h3 id="410">4.10 管理员后台 —— 掌控全局</h3>
<p>Admin 角色的专属功能：</p>
<ul>

<li><strong>权限配置</strong> — 精细调整每个人的角色和权限开关</li>
<li>非 Admin 用户<strong>不能修改自己的权限</strong>（安全性设计）</li>
</ul>
