<h2>前言：一次扩容事故的解剖</h2>

一个接口，4 台机器，CPU 利用率 45%，p99 是 80ms。流量翻了一倍，运维把机器加到 8 台。

预期：利用率回到 45%，p99 不变。

实际：利用率确实回到了 46%，但 <strong>p99 涨到了 115ms</strong>。

机器翻倍、负载翻倍、利用率不变——延迟却变差了 44%。这不是玄学，也不是"机器有问题"。这是排队论里一个可以直接算出来的结果，只是大部分人在扩容时不会去算它。

这篇文章要建立一套定量的直觉，回答四个具体问题：
<ol>
<li><strong>利用率到多少算危险？</strong> 为什么是 70%，不是 90%？</li>
<li><strong>该看均值还是方差？</strong> 为什么两个平均响应时间一样的服务，p99 能差 5 倍？</li>
<li><strong>加机器什么时候不管用？</strong> 什么情况下会<strong>越加越慢</strong>？</li>
<li><strong>p99 到底怎么算才对？</strong> 为什么它不能求平均，扇出为什么会让它爆炸？</li>
</ol>

先把结论放前面，后面逐个推导：

<th>问题</th>
<th>结论</th>

<h2>1. Little's Law：三个量测两个就够了</h2>

先给最有用、也最常被忽略的定律。

$$L = \lambda W$$
<ul>
<li>$L$：系统里平均有多少个任务（并发数）</li>
<li>$\lambda$：平均到达率（任务/秒）</li>
<li>$W$：一个任务平均待多久（秒）</li>
</ul>

<strong>它成立的条件弱得惊人</strong>：只要系统处于稳态，不丢任务、不漏任务，且长期平均存在。不需要泊松到达，不需要指数服务时间，不需要任何分布假设。

这意味着你<strong>测两个量就能算出第三个</strong>。实践中最有用的两个推论：

<strong>推论一：从并发和吞吐反推延迟。</strong>
<div class="codehilite"><pre><span></span><code>λ = 1200 req/s（从日志数出来）
L = 60（从服务端 in-flight 计数读出来）
→ W = L / λ = 60 / 1200 = 50ms
</code></pre></div>


当你的服务端没埋延迟指标，但你能数出每秒请求数、又能读到当前并发连接数时，这条推论直接给你平均延迟。

<strong>推论二：估算容量缺口。</strong>

如果 SLA 要求 p50 延迟 50ms，而你的服务平均处理时间是 20ms，那么：

$$L = \lambda W = \lambda \times 0.05$$

在 1000 req/s 下，$L = 50$ 个并发。如果线程池只有 32 个线程，你会在 640 req/s 就开始排队——<strong>Little's Law 直接告诉你线程池该开多大</strong>。

<strong>一个常见的误用</strong>：把 $W$ 当成"响应时间指标"。Little's Law 说的是<strong>长期平均</strong>，它对尾部分布一无所知。一个 $W = 50$ms 的系统，p99 可能是 5 秒。所以 Little's Law 用来定容量，不用来定 SLA。
<h2>2. 利用率：延迟的放大器</h2>

这是整篇文章最核心的一张图。

定义利用率：

$$\rho = \frac{\lambda}{\mu} = \lambda \cdot \mathbb{E}[S]$$

其中 $\mu$ 是服务率（每秒能处理多少个），$\mathbb{E}[S]$ 是平均服务时间。注意 $\rho$ 是<strong>负载强度</strong>，不是"CPU 利用率"——虽然两者通常接近。

对最基础的 M/M/1 队列（单服务台、泊松到达、指数服务时间），平均响应时间是：

$$W = \frac{1}{\mu - \lambda} = \frac{\mathbb{E}[S]}{1 - \rho}$$

把 $\mathbb{E}[S]$ 归一化成 1，看看延迟怎么随利用率变化：

<thead>
<tr>
<th>利用率 $\rho$</th>
<th>延迟倍数 $W/\mathbb{E}[S]$</th>
<th>排队等待占多少</th>
</tr>
</thead>
<tbody>
<tr>
<td>0.10</td>
<td>1.11</td>
<td>10%</td>
</tr>
<tr>
<td>0.30</td>
<td>1.43</td>
<td>30%</td>
</tr>
<tr>
<td>0.50</td>
<td>2.00</td>
<td>50%</td>
</tr>
<tr>
<td>0.70</td>
<td><strong>3.33</strong></td>
<td>70%</td>
</tr>
<tr>
<td>0.80</td>
<td>5.00</td>
<td>80%</td>
</tr>
<tr>

<td>90%</td>
</tr>
<tr>

<td>95%</td>

<td>0.99</td>
<td><strong>100.00</strong></td>
<td>99%</td>
</tr>
</tbody>
</table>

这张表要读出三件事：

<strong>第一，它不是线性的。</strong>从 10% 加到 50%，延迟只涨了 80%；从 70% 加到 90%，延迟涨了 200%。同样的 20 个百分点，代价完全不同。

<strong>第二，利用率就是"排队时间占比"。</strong>在 $\rho = 0.7$ 时，任务有 70% 的时间在排队，只有 30% 在真正被处理。这个对应关系是精确的：$W_q/W = \rho$。

<strong>第三，最后那段是悬崖。</strong>$\rho \to 1$ 时 $W \to \infty$。从 95% 到 99%，延迟又翻 5 倍。

<strong>所以"70% 是安全线"这个经验值不是拍脑袋的</strong>——它是"延迟放大 3.3 倍"这个可接受代价反推出来的。如果你能接受 5 倍，那就是 80%；如果要求严格，就得压到 50%。
<h3>2.1 为什么扩容后延迟会变差</h3>

回到前言那个事故。关键在于<strong>排队是全局的，而服务时间不是</strong>。

4 台机器、流量 1x 时：单台利用率 45%，延迟 $1/(1-0.45) = 1.82$ 倍。

8 台机器、流量 2x 时：单台利用率还是 45% 左右，延迟应该还是 1.82 倍。

<strong>但延迟涨了。</strong>所以问题不在排队模型里——而在模型之外。可能的原因有三类：
<ol>
<li><strong>共享资源没跟着扩容。</strong>数据库连接池、Redis、下游服务还是原来那么多。你的 8 台机器把 2 倍的并发压到了同一个数据库上，瓶颈从应用层转移到了数据库层。</li>
<li><strong>协调成本上升。</strong>8 台机器之间的缓存失效广播、分布式锁竞争、心跳——这些是<strong>节点数的超线性函数</strong>（后面第 8 节会算）。</li>
<li><strong>负载均衡不均。</strong>长连接、连接池预热、GC 时间不同步，都会让"平均 45%"变成"有的 30%、有的 70%"。而延迟是凸函数，70% 那台的延迟贡献远超均值。</li>
</ol>

第 3 点值得展开：<strong>利用率的不均衡会放大延迟</strong>。假设 8 台机器平均 45%，但其中一台 70%：

$$\text{均衡时延迟} = \frac{1}{1-0.45} = 1.82, \qquad \text{最忙那台} = \frac{1}{1-0.70} = 3.33$$

那台机器慢 83%。如果请求会扇出（比如一个页面要问多个分片），整体延迟由最慢的那台决定。<strong>所以扩容时要看的是最大利用率，不是平均利用率。</strong>
<h2>3. Kendall 记号与两个基础模型</h2>

排队模型的命名约定是 $A/S/c/K/N/D$：
<table>
<thead>
<tr>
<th>位置</th>
<th>含义</th>
<th>常见取值</th>
</tr>
</thead>
<tbody>
<tr>
<td>$A$</td>
<td>到达过程</td>
<td>M（马尔可夫/泊松）、D（确定）、G（一般）</td>
</tr>
<tr>
<td>$S$</td>
<td>服务时间分布</td>
<td>M、D、G</td>
</tr>
<tr>
<td>$c$</td>
<td>服务台数量</td>
<td>1, 2, ...</td>
</tr>
<tr>
<td>$K$</td>
<td>系统容量（含排队）</td>
<td>默认 ∞</td>
</tr>
<tr>
<td>$N$</td>
<td>客户总数</td>
<td>默认 ∞</td>
</tr>
<tr>
<td>$D$</td>
<td>调度规则</td>
<td>FCFS、LCFS、PS、SRPT</td>
</tr>
</tbody>
</table>

所以 <strong>M/M/1</strong> 就是"泊松到达、指数服务、单服务台、无限队列、FCFS"。<strong>M/M/c</strong> 是多服务台。
<h3>3.1 M/M/1 的完整解</h3>

$$L = \frac{\rho}{1-\rho}, \quad W = \frac{\mathbb{E}[S]}{1-\rho}, \quad W_q = \frac{\rho \cdot \mathbb{E}[S]}{1-\rho}, \quad L_q = \frac{\rho^2}{1-\rho}$$

四个量之间的关系全部由 Little's Law 串起来：$L = \lambda W$，$L_q = \lambda W_q$，$W = W_q + \mathbb{E}[S]$。<strong>只要记住 $W$ 那一个公式，其余三个都能推出来。</strong>

还有一个容易被忽略的量——<strong>系统里超过 $n$ 个任务的概率</strong>：

$$P(L &gt; n) = \rho^{n+1}$$

$\rho = 0.9$ 时，系统里有超过 10 个任务的概率是 $0.9^{11} = 31\%$。有超过 20 个的概率是 $0.9^{21} = 10.9\%$。<strong>这就是为什么尾延迟对利用率极其敏感</strong>：$\rho$ 每上升一点，长队列的概率指数级上升。
<h3>3.2 M/M/c：多服务台</h3>

对 $c$ 个服务台，总负载 $a = \lambda/\mu$（单位 Erlang），利用率 $\rho = a/c$。

<strong>等待概率</strong>（Erlang C 公式）：

$$C(c, a) = \frac{\dfrac{a^c}{c!}\cdot\dfrac{c}{c-a}}{\displaystyle\sum_{k=0}^{c-1}\frac{a^k}{k!} + \frac{a^c}{c!}\cdot\frac{c}{c-a}}$$

排队时间：

$$W_q = \frac{C(c,a)}{c\mu - \lambda} = C(c,a) \cdot \frac{\mathbb{E}[S]}{c - a}$$

这个公式的工程含义在第 5 节展开——它解释了<strong>为什么"多几台小的"比"一台大的"好</strong>。
<h2>4. 方差比均值重要：P-K 公式</h2>

M/M/1 假设服务时间是指数的，也就是变异系数 $C_s = \sigma_S / \mathbb{E}[S] = 1$。

<strong>真实系统的服务时间很少是指数的。</strong>数据库查询、缓存未命中、GC 暂停——这些都是长尾分布，$C_s$ 常常在 2 到 5 之间。

对 M/G/1（一般服务时间分布、单服务台），排队时间由 <strong>Pollaczek-Khinchine 公式</strong>给出：

$$W_q = \frac{\rho}{1-\rho} \cdot \frac{1 + C_s^2}{2} \cdot \mathbb{E}[S]$$

对比一下就能看出关键：M/M/1 的 $W_q = \frac{\rho}{1-\rho}\mathbb{E}[S]$，正好是 $C_s = 1$ 时 $(1+C_s^2)/2 = 1$ 的特例。

所以：
<ul>
<li><strong>"平均响应时间一样"不等于"性能一样"。</strong>降均值收益有限，降方差收益是乘性的。</li>
<li><strong>GC 暂停是双重伤害。</strong>它既拉高了 $\mathbb{E}[S]$，又把 $C_s$ 从 1 推到 5 以上。同一个暂停，在队列上的代价是平方级的。</li>
<li><strong>批处理和小请求混跑会毒化整个队列。</strong>一个 500ms 的批处理任务混在 5ms 的在线请求里，$C_s$ 会从 0.5 冲到 5。这是"隔离批处理和在线流量"最硬的数学理由。</li>
</ul>
<h3>4.1 一个反直觉的推论：随机路由比轮询好</h3>

如果 $C_s$ 很大，把请求<strong>随机</strong>分给多台机器，比<strong>轮询</strong>更稳。

轮询追求每台机器拿到相同数量，但当服务时间方差很大时，某一台可能恰好连续拿到几个慢请求，而轮询不会自我纠正。随机路由下，慢请求的分布更均匀，$C_s$ 的放大效应被摊薄。

这是"最少连接数"（least-connections）策略优于轮询的原因之一：它用的是<strong>当前状态</strong>（连接数）而不是<strong>历史计数</strong>。
<h2>5. 为什么"多几台小的"胜过"一台大的"</h2>

用 Erlang C 算一个具体例子。目标：处理 $\lambda = 18$ req/s，每请求 $\mathbb{E}[S] = 0.5$s，所以总负载 $a = 9$ Erlang。

<strong>方案 A：1 台大机器，能力 10 req/s。</strong>

$$a = 9, \quad c = 1, \quad \rho = 0.9$$

M/M/1 下 $W_q = \frac{0.9}{0.1} \times 0.5 = 4.5$s，总响应时间 $W = 5.0$s。

<strong>方案 B：10 台小机器，每台能力 1 req/s。</strong>

$$a = 9, \quad c = 10, \quad \rho = 0.9$$

先算 Erlang C：

$$C(10, 9) = \frac{\frac{9^{10}}{10!}\cdot\frac{10}{10-9}}{\sum_{k=0}^{9}\frac{9^k}{k!} + \frac{9^{10}}{10!}\cdot 10}$$

数值计算：$\frac{9^{10}}{10!} = \frac{3486784401}{3628800} = 960.8643$，乘以 $10$ 得 $9608.643$。

$\sum_{k=0}^{9}\frac{9^k}{k!} = 1 + 9 + 40.5 + 121.5 + 273.375 + 492.075 + 738.113 + 949.000 + 1067.627 + 1067.627 = 4759.818$

所以：

$$C(10,9) = \frac{9608.643}{4759.818 + 9608.643} = \frac{9608.643}{14368.461} = 0.6687$$

排队时间：

$$W_q = 0.6687 \times \frac{0.5}{10 - 9} = 0.334\text{s}$$

总响应时间 $W = 0.334 + 0.5 = 0.83$s。

<li><strong>微服务拆得越细，尾延迟越差。</strong>拆成 20 个服务，即使每个都很好，组合起来也容易崩。</li>
<li><strong>"每个服务 p99 都达标"不等于"页面达标"。</strong>SLA 要按扇出路径算，不能按服务算。</li>

</ul>

<strong>工程上的对策有三条</strong>：
<ol>
<li><strong>减少扇出。</strong>合并接口、批量化、在边缘做聚合。$N$ 从 100 降到 10，概率从 63% 降到 9.6%。</li>
<li><strong>对冲请求（hedged requests）。</strong>对慢请求发第二份到另一台机器，取先返回的。代价是额外负载，收益是尾部直接砍掉。适合幂等的读操作。</li>
<li><strong>不让慢请求拖累快请求。</strong>超时 + 降级返回部分结果，比等全部返回好。</li>
</ol>
<h2>7. Amdahl 定律：串行部分的税</h2>

$$S(n) = \frac{1}{(1-p) + \dfrac{p}{n}}$$

$n \to \infty$ 时的上限：

$$\lim_{n \to \infty} S(n) = \frac{1}{1-p}$$

<h2>8. 通用可扩展定律：回退效应</h2>

Amdahl 定律有个缺陷：它假设加机器没有副作用。现实中不是——机器越多，协调成本越高。

Gunther 的<strong>通用可扩展定律（Universal Scalability Law, USL）</strong>加了两项：

$$C(N) = \frac{N}{1 + \alpha(N-1) + \beta N(N-1)}$$
<ul>
<li>$\alpha$：<strong>争用系数</strong>（contention）——串行化导致的排队，线性增长</li>
<li>$\beta$：<strong>一致性系数</strong>（coherency）——节点间的数据同步/通信，<strong>二次增长</strong></li>
</ul>

$\beta = 0$ 时它退化成 Amdahl 的形式。$\beta &gt; 0$ 时，曲线不再是单调上升的。

对 $C(N)$ 求极值，得到<strong>最优节点数</strong>：

$$N^\ast = \sqrt{\frac{1-\alpha}{\beta}}$$

超过 $N^\ast$ 之后，吞吐<strong>下降</strong>——这叫<strong>回退扩展（retrograde scaling）</strong>。
<h3>8.1 算一个例子</h3>

取 $\alpha = 0.05$（5% 的争用），$\beta = 0.001$（一致性成本）：

$$N^\ast = \sqrt{\frac{1 - 0.05}{0.001}} = \sqrt{950} \approx 30.8$$

这就是"加机器反而更慢"的数学形式。它的现实对应是：
<ul>
<li><strong>缓存一致性广播</strong>：每台机器的写操作都要通知其他 $N-1$ 台，总通信量是 $O(N^2)$</li>
<li><strong>分布式锁竞争</strong>：$N$ 个节点抢同一把锁，冲突概率随 $N$ 上升</li>
<li><strong>心跳与成员管理</strong>：全互联心跳是 $O(N^2)$</li>
<li><strong>共享数据库连接</strong>：$N$ 个应用节点共享一个连接池上限</li>
<li><strong>负载均衡的会话同步</strong></li>
</ul>

<strong>所以"扩容"和"加节点"不是一回事。</strong>扩容的前提是 $\beta$ 足够小。如果 $\beta$ 显著，正确做法是：
<ol>
<li><strong>减小 $\alpha$</strong>：去掉串行瓶颈（换掉全局锁、拆分热点）</li>
<li><strong>减小 $\beta$</strong>：减少节点间同步（分片而非共享、去掉全局缓存失效广播、改成最终一致）</li>
</ol>

<strong>分片（sharding）之所以有效，就是因为它把 $\beta$ 从"全局"降到"片内"</strong>：100 个节点分成 10 个片，每片 10 个节点，一致性成本从 $O(100^2)$ 降到 $10 \times O(10^2)$——从 10000 降到 1000。
<h2>9. 重试风暴与亚稳态故障</h2>

排队论假设到达率 $\lambda$ 是外生的、与系统状态无关。<strong>重试打破了这个假设。</strong>

设原始失败率 $f$，最多重试 $k$ 次（即最多 $k+1$ 次尝试），每次重试的负载期望是：

$$\text{负载倍数} = \sum_{i=0}^{k} f^i = \frac{1 - f^{k+1}}{1 - f}$$

<tr>
<th>失败率 $f$</th>
<th>无重试</th>

<th>最多重试 3 次</th>
</tr>
</thead>
<tbody>
<tr>
<td>0.01</td>
<td>1.000x</td>
<td>1.010x</td>
<td>1.010x</td>
</tr>
<tr>
<td>0.10</td>
<td>1.000x</td>
<td>1.100x</td>
<td>1.111x</td>
</tr>
<tr>
<td>0.30</td>
<td>1.000x</td>
<td>1.300x</td>
<td>1.417x</td>
</tr>
<tr>
<td>0.50</td>
<td>1.000x</td>
<td>1.500x</td>
<td>1.875x</td>
</tr>
<tr>
<td>0.70</td>
<td>1.000x</td>
<td>1.700x</td>
<td>2.533x</td>
</tr>
<tr>

</tr>

注意这张表里"最多重试 3 次"这一列<strong>远小于</strong>"无限重试"的理论值 $\frac{1}{1-f}$。$f = 0.9$ 时无限重试的负载倍数是 <strong>10 倍</strong>，而限制 3 次重试只把倍数压到 3.44 倍。<strong>设上限本身就是最重要的保护措施</strong>——它把指数增长截断成常数。

（也要注意这张表低估了真实风险：它假设重试一定失败到上限。如果失败是<strong>瞬时的</strong>，重试可能成功，实际负载倍率会更低；但如果是<strong>过载导致的</strong>失败，重试会继续失败，倍率就朝上限走。<strong>过载场景下要按最坏情况算。</strong>）

<strong>这里的关键是正反馈</strong>：
<div class="codehilite"><pre><span></span><code>负载上升
  → 队列变长（第 2 节：ρ 接近 1 时延迟爆炸）
  → 超时开始触发
  → 重试（第 9 节：负载倍率上升）
  → 负载进一步上升
  → 更多超时
  → ...
</code></pre></div>


这是一个<strong>正反馈环</strong>。它会导向<strong>亚稳态故障（metastable failure）</strong>：
<blockquote>

触发事件（比如一次短暂的网络抖动）消失之后，系统<strong>不会自动恢复</strong>。因为此时"重试产生的负载"本身就已经超过了容量。
</blockquote>

亚稳态故障的特征：
<ul>
<li>系统有两个稳态：正常态和故障态</li>
<li>一旦进入故障态，移除初始触发不能恢复</li>
<li>必须<strong>主动减载</strong>（重启、限流、熔断）才能回到正常态</li>
</ul>

<strong>对策</strong>：
<table>
<thead>
<tr>
<th>措施</th>
<th>作用</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>重试预算（retry budget）</strong></td>
<td>限制重试占总请求的比例（如 10%），而非固定重试次数</td>
</tr>
<tr>
<td><strong>指数退避 + 抖动</strong></td>
<td>避免重试同步，把重试分散到时间上</td>
</tr>
<tr>
<td><strong>熔断器</strong></td>
<td>下游故障时快速失败，不再把请求送过去</td>
</tr>
<tr>
<td><strong>有界队列 + 主动拒绝</strong></td>
<td>队列满了直接拒绝，而不是无限排队</td>
</tr>
<tr>
<td><strong>客户端侧限流</strong></td>
<td>在源头限速，而不是让系统自己崩溃</td>
</tr>
</tbody>
</table>

<strong>"有界队列"这一条特别重要</strong>，它值得单独说。
<h3>9.1 为什么无界队列是个陷阱</h3>

无界队列看起来"友好"——它不拒绝任何请求。但它做了三件坏事：
<ol>
<li><strong>把吞吐问题变成延迟问题。</strong>请求不会失败，但会等很久——等到超时为止，最后还是失败。用户等待时间变长，成功率不变。</li>
<li><strong>掩盖过载。</strong>队列在涨，但错误率不涨，监控看不出问题。等到队列爆了才发现，此时已经晚了。</li>
<li><strong>内存风险。</strong>队列里的每个任务都要占内存，无界队列在过载时会 OOM。</li>
</ol>

<strong>有界队列 + 主动拒绝</strong>的行为更诚实：
<div class="codehilite"><pre><span></span><code>队列未满 → 接收，正常处理
队列已满 → 立即返回 503
</code></pre></div>


好处是：<strong>快速失败给了客户端一个明确的信号</strong>，客户端可以退避、可以降级、可以让用户重试。而无限排队只是把所有人在慢动作里一起拖死。

从排队论看：无界队列把 $\rho$ 推到 1 以上（系统不稳定），延迟无界增长；有界队列把 $\rho$ 强行压回 1 以下（通过丢弃），延迟有界。<strong>丢请求是过载时唯一能保住延迟的办法。</strong>
<h2>10. 协调遗漏：为什么你的压测在撒谎</h2>

这是 Gil Tene 提出的经典问题，也是"压测结果好、线上却崩"的最常见原因。

<strong>问题出在闭环压测工具上。</strong>

闭环（closed-loop）压测的行为是：
<div class="codehilite"><pre><span></span><code>发请求 → 等响应 → 收到响应 → 发下一个请求
</code></pre></div>


考虑一个服务，每 100 个请求会出现一次 1 秒的停顿。

闭环压测会记录到：
<div class="codehilite"><pre><span></span><code>99 个请求：5ms
1  个请求：1005ms
</code></pre></div>


看起来 p99 ≈ 1005ms，可以接受。

<strong>但真实世界的客户端不会等。</strong>它是开环的——不管服务端是否响应，都按固定速率发请求。在那 1 秒停顿里，真实的客户端会发出 200 个请求（按 200 req/s 算），这 200 个请求全部要排队。它们的延迟是：
<div class="codehilite"><pre><span></span><code>第 1 个排队者：等待 1000ms
第 2 个排队者：等待 995ms
...
第 200 个排队者：等待 5ms
</code></pre></div>


<strong>真实的 p99 是 1000ms 左右，但受影响的是 200 个请求，而不是 1 个。</strong>闭环压测只记录到了 1 个。

更糟的是：闭环压测<strong>少发了请求</strong>。那 1 秒里它只发了 1 个（被阻塞住了），而真实情况应该发 200 个。所以它测出来的吞吐也是虚高的。

<strong>修正办法有两个：</strong>

<strong>办法一：记录"意图发送时间"。</strong>
<div class="codehilite"><pre><span></span><code><span class="n">t_intended</span> <span class="o">=</span> <span class="n">time</span><span class="o">.</span><span class="n">now</span><span class="p">()</span>      <span class="c1"># 本来该发的时间</span>
<span class="n">response</span> <span class="o">=</span> <span class="n">send</span><span class="p">(</span><span class="n">request</span><span class="p">)</span>     <span class="c1"># 实际发送</span>
<span class="n">t_returned</span> <span class="o">=</span> <span class="n">time</span><span class="o">.</span><span class="n">now</span><span class="p">()</span>
<span class="n">latency</span> <span class="o">=</span> <span class="n">t_returned</span> <span class="o">-</span> <span class="n">t_intended</span>   <span class="c1"># 用意图时间算，不是用实际发送时间</span>
</code></pre></div>


这样被阻塞的请求会体现出真实的排队延迟。

<strong>办法二：开环压测。</strong>用一个独立的调度器按固定速率发请求，不受响应时间影响。这是 wrk2、k6（<code>constant-arrival-rate</code> 模式）的做法。

<strong>判断你的压测有没有协调遗漏</strong>：看吞吐曲线。如果"增加并发数"时吞吐一直线性上升、延迟几乎不变，说明要么系统容量真的很大，要么<strong>工具在少发请求</strong>。真实的系统在接近容量时，吞吐会饱和、延迟会起飞。
<h2>11. 容量规划实操：余量该留多少</h2>

把前面所有内容收成一套可操作的流程。
<h3>11.1 目标利用率怎么定</h3>

从第 2 节的表反推。问自己："我能接受延迟放大几倍？"
<table>
<thead>
<tr>
<th>可接受的延迟放大</th>
<th>对应利用率上限</th>
<th>适用场景</th>
</tr>
</thead>
<tbody>
<tr>
<td>1.4x</td>
<td>30%</td>
<td>极低延迟要求（交易、竞价）</td>
</tr>
<tr>
<td>2x</td>
<td>50%</td>
<td>延迟敏感型 API</td>
</tr>
<tr>
<td>3.3x</td>
<td>70%</td>
<td>一般在线服务（<strong>最常见的目标</strong>）</td>
</tr>
<tr>
<td>5x</td>
<td>80%</td>
<td>容忍排队、有降级的场景</td>
</tr>
<tr>
<td>10x</td>
<td>90%</td>
<td>批处理、离线任务</td>
</tr>
</tbody>
</table>

<strong>注意这是 M/M/1 的数字。</strong>如果你的服务时间方差大（$C_s &gt; 1$），实际放大倍数要乘上第 4 节的因子。$C_s = 3$ 时，70% 利用率下的延迟放大不是 3.3 倍，而是：

$$W_q = \frac{0.7}{0.3} \times \frac{1 + 9}{2} \times \mathbb{E}[S] = 2.33 \times 5 \times \mathbb{E}[S] = 11.7 \times \mathbb{E}[S]$$

<strong>同一个 70%，方差大的服务延迟放大是 11.7 倍而不是 3.3 倍。</strong>所以先测你的 $C_s$。
<h3>11.2 容量计算公式</h3>

需要的实例数：

$$N = \left\lceil \frac{\lambda \cdot \mathbb{E}[S]}{\rho_\text{target}} \right\rceil$$

例：峰值 500 req/s，平均处理 80ms，目标利用率 70%：

$$N = \left\lceil \frac{500 \times 0.08}{0.7} \right\rceil = \left\lceil 57.1 \right\rceil = 58$$

<strong>但这个数字有三个陷阱：</strong>
<ol>
<li><strong>$\lambda$ 要用峰值，不是均值。</strong>峰值可能是均值的 3-5 倍。按均值算容量是经典的翻车方式。</li>
<li><strong>要留 N+1 的故障余量。</strong>58 台里坏 1 台，剩下 57 台的实际利用率变成 $40/57 = 70.2\%$——刚好顶到目标线上，没有余量了。如果只按 100% 利用率规划（40 台），坏 1 台就是 $\rho = 1.0$，队列长度无界，直接雪崩。</li>
<li><strong>要留发布余量。</strong>滚动发布时，一部分实例在重启，可用容量会下降。蓝绿或金丝雀发布期间容量要额外打折。</li>
</ol>

<strong>实践中常见的做法</strong>：按"峰值负载 + 单实例故障 + 发布余量"算，得到的目标利用率通常在 50-60%，而不是 70%。
<h3>11.3 自动扩缩容的三个坑</h3>

<strong>坑一：按 CPU 扩容会滞后。</strong>CPU 上升是<strong>结果</strong>，不是原因。等到 CPU 到 80% 才扩容，队列已经排起来了，而新实例启动还要 30-60 秒。

<strong>更好的信号</strong>：队列深度、请求排队时间、并发数（Little's Law 里的 $L$）。这些是<strong>领先指标</strong>——它们上升时，CPU 可能还没到阈值。

<strong>坑二：扩得快、缩得慢要不对称。</strong>扩容要激进（宁可多开），缩容要保守（宁可多留）。缩容太快会在流量回升时来不及扩，进入振荡。

<strong>坑三：没有滞回就会抖动。</strong>扩容阈值 70%、缩容阈值 70% 会导致系统在阈值附近反复扩缩。标准做法是留滞回带（比如扩到 60% 以下才缩）加冷却时间。
<h3>11.4 一张检查清单</h3>

扩容决策前，按顺序问：
<ul>
<li>[ ] <strong>瓶颈在哪里？</strong>先确认瓶颈是应用层 CPU，而不是数据库、缓存、下游服务。如果是后者，加应用实例没用（第 2.1 节）。</li>
<li>[ ] <strong>$\mathbb{E}[S]$ 和 $C_s$ 是多少？</strong>没有这两个数，所有计算都是猜的。</li>
<li>[ ] <strong>$\lambda$ 用的是峰值吗？</strong>峰值/均值比是多少？</li>
<li>[ ] <strong>当前最大实例利用率是多少？</strong>不是平均值（第 2.1 节）。</li>
<li>[ ] <strong>$\beta$ 大不大？</strong>如果节点间有全局同步（缓存广播、全局锁），先减小 $\beta$，否则加节点可能倒退（第 8 节）。</li>
<li>[ ] <strong>有重试吗？重试预算是多少？</strong>重试会放大负载，可能触发亚稳态（第 9 节）。</li>
<li>[ ] <strong>队列有界吗？</strong>无界队列会把过载变成延迟（第 9.1 节）。</li>
<li>[ ] <strong>压测有协调遗漏吗？</strong>看吞吐曲线是否饱和（第 10 节）。</li>
<li>[ ] <strong>p99 是怎么聚合的？</strong>如果是"各窗口 p99 求平均"，这个数字是错的（第 6.1 节）。</li>
</ul>
<h2>12. FAQ</h2>

<strong>Q：这些公式假设泊松到达，真实流量不是泊松的，还能用吗？</strong>

A：能用，但要知道误差方向。真实流量通常<strong>比泊松更突发</strong>（突发性可以用 $C_a^2$ 描述，泊松是 $C_a^2 = 1$）。更突发的到达会让队列更长，所以 M/M/1 的公式是<strong>乐观估计</strong>。有个经验公式（Kingman 近似）同时考虑两个变异系数：

$$W_q \approx \frac{\rho}{1-\rho} \cdot \frac{C_a^2 + C_s^2}{2} \cdot \mathbb{E}[S]$$

$C_a^2 = C_s^2 = 1$ 时它退化成 M/M/1。<strong>这个公式比 M/M/1 实用得多</strong>，因为它把"流量有多突发"和"服务时间有多不稳"都算进去了。

<strong>Q：利用率 70% 是绝对的吗？</strong>

A：不是。它对应"延迟放大 3.3 倍"这个假设。如果你能接受 5 倍，可以到 80%；如果要求严格，压到 50%。另外它是 M/M/1 的数字，$C_s$ 大会显著恶化（第 11.1 节）。

<strong>Q：为什么不用"平均响应时间"做监控？</strong>

A：因为平均对尾部分布不敏感。99 个 5ms + 1 个 5s，平均是 54.95ms——看起来完全正常，但 1% 的用户等了 5 秒。而且如第 6.2 节所示，尾部在扇出场景下会变成多数。<strong>看 p99、p999，以及"超过阈值的请求比例"。</strong>

<strong>Q：p999 和 p99 该看哪个？</strong>

A：取决于扇出。如果每个请求扇出 $N$ 个后端，那么"用户体验到的 p99"约等于"后端的 $1 - (1-0.99)^{1/N}$ 分位"。$N = 100$ 时，就是后端的 p50 左右。<strong>扇出越大，越要往深里看。</strong>

<strong>Q：Little's Law 能用来做容量规划吗？</strong>

A：能，而且是最实用的工具。$L = \lambda W$ 只要测两个量。最常用的场景：<strong>用并发数和吞吐量反推延迟</strong>，或者<strong>用目标延迟和预期吞吐反推需要多少并发</strong>（进而决定线程池/连接池大小）。注意它只给长期平均，不给尾部分布。

<strong>Q：为什么加机器有时候会变慢？</strong>

A：三种可能，按常见程度排序：
1. <strong>瓶颈不在应用层</strong>（数据库、缓存、下游），加应用实例只是把压力往下游压（第 2.1 节）。
2. <strong>节点间协调成本超线性增长</strong>，USL 的 $\beta$ 项，超过 $N^\ast$ 后吞吐下降（第 8 节）。
3. <strong>负载不均</strong>，平均利用率没变但最大利用率上升，延迟是凸函数（第 2.1 节）。

<strong>Q：文章里没有实测数字，这些公式可信吗？</strong>

A：这些是排队论的<strong>闭式解</strong>，不是估算。M/M/1、Erlang C、P-K、Amdahl、USL 都是教科书结论，可以查证。文章里所有表格都是把公式代进去算出来的，你可以自己验算。但要注意：<strong>闭式解的可信度取决于假设是否成立</strong>——所以第 12 节第一个问题（用 Kingman 近似）和第 4 节（先测 $C_s$）比公式本身更重要。
<h2>结语</h2>

如果只从这篇文章带走三件事：

<strong>第一，利用率是延迟的放大器，而且是非线性的。</strong>70% 对应 3.3 倍，90% 对应 10 倍。这条曲线解释了大部分"为什么慢"的问题——不是代码慢，是排队。

<strong>第二，方差和均值一样重要。</strong>两个平均响应时间相同的服务，$C_s$ 从 1 涨到 3，队列长度差 5 倍。降方差（隔离批处理、消 GC 暂停、减少长尾查询）的收益是乘性的，而降均值的收益是加性的。

<strong>第三，加机器有天花板。</strong>Amdahl 给的是串行部分的天花板，USL 给的是一致性成本的天花板。超过 $N^\ast$ 之后加机器会让系统<strong>变慢</strong>。这时候要做的不是扩容，是改架构。

最后回到前言那个事故：4 台加到 8 台，p99 反而涨了 44%。现在你有工具去诊断它了——先看瓶颈是不是转移到了共享资源，再看最大利用率而非平均利用率，最后算一下 $\beta$ 是不是已经大到让扩容失效。

<strong>不要靠加机器解决问题，要靠算清楚再决定加不加。</strong>
