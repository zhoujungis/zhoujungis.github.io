<blockquote>

适用读者：写过 CRUD、被超卖/重复下单/定时任务重复执行坑过的后端工程师
技术栈：Redis 7 + Python / Java 双示例，不绑定 Django，Spring Boot / Go 同样适用

</blockquote>
<h2>前言：一个被“卖超了”的优惠券</h2>

假设你写了这样一个接口：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">grab_coupon</span><span class="p">(</span><span class="n">user_id</span><span class="p">):</span>
    <span class="n">coupon</span> <span class="o">=</span> <span class="n">Coupon</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="nb">id</span><span class="o">=</span><span class="mi">1</span><span class="p">)</span>
    <span class="k">if</span> <span class="n">coupon</span><span class="o">.</span><span class="n">stock</span> <span class="o">&gt;</span> <span class="mi">0</span><span class="p">:</span>
        <span class="n">coupon</span><span class="o">.</span><span class="n">stock</span> <span class="o">-=</span> <span class="mi">1</span>
        <span class="n">coupon</span><span class="o">.</span><span class="n">save</span><span class="p">()</span>
        <span class="n">Order</span><span class="o">.</span><span class="n">objects</span><span class="o">.</span><span class="n">create</span><span class="p">(</span><span class="n">user_id</span><span class="o">=</span><span class="n">user_id</span><span class="p">,</span> <span class="n">coupon_id</span><span class="o">=</span><span class="mi">1</span><span class="p">)</span>
        <span class="k">return</span> <span class="kc">True</span>
    <span class="k">return</span> <span class="kc">False</span>
</code></pre></div>


单机单进程时没问题。上线后你扩了 4 台机器，压测 200 并发抢 100 张券，结果：
<ul>
<li>数据库里 <code>stock</code> 变成了 -37；</li>
<li>订单表多了 137 条；</li>
<li>老板在群里 @ 你。</li>
</ul>

直觉反应是“加锁”。单机 <code>threading.Lock</code> / <code>synchronized</code> 锁不住 4 台机器。这时你需要的是<strong>分布式锁</strong>：让分布式系统里的 N 个进程，对同一资源“互斥访问”。

Redis 是最常见的分布式锁实现，但也是<strong>被误用最多的</strong>。这篇文章把五个版本逐个拆开：每个版本解决什么、引入什么新坑、源码层面为什么这样写。最后还会诚实地告诉你：<strong>Redis 锁解决不了的两种场景</strong>，以及该换什么。

<hr>
<h2>1. 分布式锁的四条军规</h2>

Martin Kleppmann 等人在讨论 Redlock 时总结的约束，任何分布式锁都应该满足：
<table>
<thead>
<tr>
<th>性质</th>
<th>含义</th>
<th>反例</th>
</tr>
</thead>
<tbody>
<tr>
<td>互斥性 Safety</td>
<td>任意时刻只有一个客户端持有锁</td>
<td>两台机器同时扣减库存</td>
</tr>
<tr>
<td>无死锁 Liveness</td>
<td>持有者崩溃后锁最终能释放</td>
<td>进程 kill -9 后所有请求卡死</td>
</tr>
<tr>
<td>容错性 Fault Tolerance</td>
<td>Redis/网络抖动时仍能达成互斥</td>
<td>Redis 主从切换丢锁导致双持锁</td>
</tr>
<tr>
<td>可重入/可识别归属</td>
<td>锁只能由持有者释放，不能被别人误解</td>
<td>A 超时了，B 拿到锁，A 醒来把 B 的锁删了</td>
</tr>
</tbody>
</table>

记住第 4 条，后面 80% 的坑都和它有关：<strong>“删别人的锁”比“拿不到锁”更危险</strong>。拿不到锁只是失败重试，删别人的锁是数据错乱。
<hr>
<h2>2. V1：SETNX 天真版，为什么线上必翻车</h2>

最早的教程都这么写：
<div class="codehilite"><pre><span></span><code><span class="c1"># V1：错误示范，请勿抄</span>
<span class="k">def</span><span class="w"> </span><span class="nf">acquire</span><span class="p">(</span><span class="n">lock_key</span><span class="p">):</span>
    <span class="k">return</span> <span class="n">redis</span><span class="o">.</span><span class="n">setnx</span><span class="p">(</span><span class="n">lock_key</span><span class="p">,</span> <span class="mi">1</span><span class="p">)</span> <span class="o">==</span> <span class="mi">1</span>

<span class="k">def</span><span class="w"> </span><span class="nf">release</span><span class="p">(</span><span class="n">lock_key</span><span class="p">):</span>
    <span class="n">redis</span><span class="o">.</span><span class="n">delete</span><span class="p">(</span><span class="n">lock_key</span><span class="p">)</span>
</code></pre></div>


配合业务：
<div class="codehilite"><pre><span></span><code><span class="k">if</span> <span class="n">acquire</span><span class="p">(</span><span class="s2">&quot;lock:coupon:1&quot;</span><span class="p">):</span>
    <span class="k">try</span><span class="p">:</span>
        <span class="n">grab_coupon</span><span class="p">(</span><span class="n">user_id</span><span class="p">)</span>
    <span class="k">finally</span><span class="p">:</span>
        <span class="n">release</span><span class="p">(</span><span class="s2">&quot;lock:coupon:1&quot;</span><span class="p">)</span>
</code></pre></div>


三个致命问题：

<strong>问题 1：没有过期时间，必死锁。</strong>

进程在 <code>grab_coupon</code> 中途崩溃（OOM、kill -9、容器被驱逐），<code>finally</code> 根本没机会执行，<code>lock:coupon:1</code> 永远留在 Redis。所有后续请求 <code>SETNX</code> 永远返回 0，优惠券再也抢不了，只能半夜起来手动 <code>DEL</code>。

有人打补丁：“加个过期不就行了？”
<div class="codehilite"><pre><span></span><code><span class="c1"># V1.1：依然错误</span>
<span class="k">if</span> <span class="n">redis</span><span class="o">.</span><span class="n">setnx</span><span class="p">(</span><span class="n">lock_key</span><span class="p">,</span> <span class="mi">1</span><span class="p">)</span> <span class="o">==</span> <span class="mi">1</span><span class="p">:</span>
    <span class="n">redis</span><span class="o">.</span><span class="n">expire</span><span class="p">(</span><span class="n">lock_key</span><span class="p">,</span> <span class="mi">10</span><span class="p">)</span>  <span class="c1"># 两条命令，非原子</span>
</code></pre></div>


<code>SETNX</code> 和 <code>EXPIRE</code> 之间崩溃，同样死锁。<strong>加锁必须是原子操作</strong>，这是 V2 要解决的。

<strong>问题 2：谁都能删。</strong>

A 拿到锁，业务执行太慢（GC 停顿、慢 SQL），锁过期了。B 拿到锁开始执行。A 醒来执行 <code>finally: DEL</code>，把 B 的锁删了。C 又进来，三个人同时在临界区。这就是第 1 章说的“删别人的锁”。

<strong>问题 3：不可重入导致的自死锁。</strong>

同一线程嵌套调用两次 <code>acquire</code>（比如抢券逻辑里又调了需要同一把锁的发短信逻辑），第二次 <code>SETNX</code> 返回 0，直接返回失败，业务莫名其妙走不通。
<blockquote>

<strong>结论：V1 只能用于单机演示，任何生产环境都不该出现。看到 <code>setnx + expire</code> 分两步写的代码，直接标红。</strong>
</blockquote>
<hr>
<h2>3. V2：SET NX PX + 唯一值，第一个可用版本</h2>

Redis 2.6.12 起 <code>SET</code> 命令原生支持 <code>NX</code> + <code>PX</code>，一句话把“加锁+过期”变成原子操作：
<div class="codehilite"><pre><span></span><code>SET lock:coupon:1 &lt;unique_token&gt; NX PX 30000
</code></pre></div>

<ul>
<li><code>NX</code>：key 不存在才成功，相当于 SETNX；</li>
<li><code>PX 30000</code>：30 秒过期，防止死锁；</li>
<li><code>&lt;unique_token&gt;</code>：UUID，每个持有者唯一，用于“只能自己删自己”。</li>
</ul>

Python 正确版：
<div class="codehilite"><pre><span></span><code><span class="kn">import</span><span class="w"> </span><span class="nn">uuid</span>
<span class="kn">import</span><span class="w"> </span><span class="nn">redis</span>

<span class="n">r</span> <span class="o">=</span> <span class="n">redis</span><span class="o">.</span><span class="n">Redis</span><span class="p">(</span><span class="n">host</span><span class="o">=</span><span class="s2">&quot;127.0.0.1&quot;</span><span class="p">,</span> <span class="n">port</span><span class="o">=</span><span class="mi">6379</span><span class="p">,</span> <span class="n">decode_responses</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>

<span class="k">def</span><span class="w"> </span><span class="nf">acquire</span><span class="p">(</span><span class="n">lock_key</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">ttl_ms</span><span class="p">:</span> <span class="nb">int</span> <span class="o">=</span> <span class="mi">30000</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span> <span class="o">|</span> <span class="kc">None</span><span class="p">:</span>
    <span class="n">token</span> <span class="o">=</span> <span class="n">uuid</span><span class="o">.</span><span class="n">uuid4</span><span class="p">()</span><span class="o">.</span><span class="n">hex</span>
    <span class="n">ok</span> <span class="o">=</span> <span class="n">r</span><span class="o">.</span><span class="n">set</span><span class="p">(</span><span class="n">lock_key</span><span class="p">,</span> <span class="n">token</span><span class="p">,</span> <span class="n">nx</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">px</span><span class="o">=</span><span class="n">ttl_ms</span><span class="p">)</span>
    <span class="k">return</span> <span class="n">token</span> <span class="k">if</span> <span class="n">ok</span> <span class="k">else</span> <span class="kc">None</span>

<span class="k">def</span><span class="w"> </span><span class="nf">release</span><span class="p">(</span><span class="n">lock_key</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">token</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">bool</span><span class="p">:</span>
    <span class="c1"># 必须比较 token 再删，且比较+删除要原子，见 4.1 的 Lua</span>
    <span class="k">if</span> <span class="n">r</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="n">lock_key</span><span class="p">)</span> <span class="o">==</span> <span class="n">token</span><span class="p">:</span>
        <span class="n">r</span><span class="o">.</span><span class="n">delete</span><span class="p">(</span><span class="n">lock_key</span><span class="p">)</span>
        <span class="k">return</span> <span class="kc">True</span>
    <span class="k">return</span> <span class="kc">False</span>
</code></pre></div>


Java（Jedis / Lettuce 同理，核心就是一行 SET）：
<div class="codehilite"><pre><span></span><code><span class="n">String</span><span class="w"> </span><span class="n">token</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">UUID</span><span class="p">.</span><span class="na">randomUUID</span><span class="p">().</span><span class="na">toString</span><span class="p">();</span>
<span class="n">String</span><span class="w"> </span><span class="n">ok</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">jedis</span><span class="p">.</span><span class="na">set</span><span class="p">(</span><span class="s">&quot;lock:coupon:1&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">token</span><span class="p">,</span><span class="w"> </span><span class="n">SetParams</span><span class="p">.</span><span class="na">setParams</span><span class="p">().</span><span class="na">nx</span><span class="p">().</span><span class="na">px</span><span class="p">(</span><span class="mi">30000</span><span class="p">));</span>
<span class="kt">boolean</span><span class="w"> </span><span class="n">locked</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;OK&quot;</span><span class="p">.</span><span class="na">equals</span><span class="p">(</span><span class="n">ok</span><span class="p">);</span>
</code></pre></div>


这个版本解决了 V1 的两个问题：
<ol>
<li>原子加锁+过期，不会死锁；</li>
<li>token 归属校验，不会误删别人的锁（至少“检查”是做了，是否有竞态见下一节）。</li>
</ol>

但还剩两个坑：

<strong>坑 A：<code>GET + DEL</code> 非原子，极端情况下依然误删。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">if</span> <span class="n">r</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="n">lock_key</span><span class="p">)</span> <span class="o">==</span> <span class="n">token</span><span class="p">:</span>  <span class="c1"># A 判断是自己的</span>
    <span class="c1"># ← 在这里，锁刚好过期，B SET 成功拿到锁</span>
    <span class="n">r</span><span class="o">.</span><span class="n">delete</span><span class="p">(</span><span class="n">lock_key</span><span class="p">)</span>        <span class="c1"># A 把 B 的锁删了</span>
</code></pre></div>


窗口很小，但在高并发 + GC 停顿下一定会出现。修复必须用 Lua（下一章）。

<strong>坑 B：TTL 拍脑袋。</strong>

TTL 设 30 秒，业务 31 秒才跑完，锁提前释放，并发又进来了。TTL 设 10 分钟，进程崩溃后要 10 分钟才能恢复，故障窗口太大。这是 V3 看门狗要解决的矛盾：<strong>TTL 既要短（快速恢复），又要长（覆盖业务）</strong>。
<blockquote>

<strong>结论：V2 是面试标准答案，生产及格线。个人博客、小后台、定时任务防重跑，用 V2 + Lua 解锁已经够了。</strong>
</blockquote>
<hr>
<h2>4. V3：Lua 解锁 + 看门狗续期，生产模板</h2>
<h3>4.1 解锁必须用 Lua</h3>

把“比较 token + 删除”塞进一个 Lua 脚本，Redis 单线程执行脚本，保证原子：
<div class="codehilite"><pre><span></span><code><span class="c1">-- KEYS[1] = lock_key, ARGV[1] = token</span>
<span class="kr">if</span><span class="w"> </span><span class="nv">redis</span><span class="p">.</span><span class="nf">call</span><span class="p">(</span><span class="s2">&quot;GET&quot;</span><span class="p">,</span><span class="w"> </span><span class="nv">KEYS</span><span class="p">[</span><span class="mi">1</span><span class="p">])</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="nv">ARGV</span><span class="p">[</span><span class="mi">1</span><span class="p">]</span><span class="w"> </span><span class="kr">then</span>
<span class="w">    </span><span class="kr">return</span><span class="w"> </span><span class="nv">redis</span><span class="p">.</span><span class="nf">call</span><span class="p">(</span><span class="s2">&quot;DEL&quot;</span><span class="p">,</span><span class="w"> </span><span class="nv">KEYS</span><span class="p">[</span><span class="mi">1</span><span class="p">])</span>
<span class="kr">else</span>
<span class="w">    </span><span class="kr">return</span><span class="w"> </span><span class="mi">0</span>
<span class="kr">end</span>
</code></pre></div>


Python 封装：
<div class="codehilite"><pre><span></span><code><span class="n">UNLOCK_LUA</span> <span class="o">=</span> <span class="s2">&quot;&quot;&quot;</span>
<span class="s2">if redis.call(&quot;GET&quot;, KEYS[1]) == ARGV[1] then</span>
<span class="s2">    return redis.call(&quot;DEL&quot;, KEYS[1])</span>
<span class="s2">else</span>
<span class="s2">    return 0</span>
<span class="s2">end</span>
<span class="s2">&quot;&quot;&quot;</span>
<span class="n">_unlock</span> <span class="o">=</span> <span class="n">r</span><span class="o">.</span><span class="n">register_script</span><span class="p">(</span><span class="n">UNLOCK_LUA</span><span class="p">)</span>

<span class="k">def</span><span class="w"> </span><span class="nf">release_safe</span><span class="p">(</span><span class="n">lock_key</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">token</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">bool</span><span class="p">:</span>
    <span class="k">return</span> <span class="n">_unlock</span><span class="p">(</span><span class="n">keys</span><span class="o">=</span><span class="p">[</span><span class="n">lock_key</span><span class="p">],</span> <span class="n">args</span><span class="o">=</span><span class="p">[</span><span class="n">token</span><span class="p">])</span> <span class="o">==</span> <span class="mi">1</span>
</code></pre></div>


Java（Redisson 也是这个思路，只是封装得更好）：
<div class="codehilite"><pre><span></span><code><span class="c1">// Jedis eval 原子解锁</span>
<span class="n">String</span><span class="w"> </span><span class="n">lua</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;if redis.call(&#39;GET&#39;,KEYS[1])==ARGV[1] then return redis.call(&#39;DEL&#39;,KEYS[1]) else return 0 end&quot;</span><span class="p">;</span>
<span class="n">jedis</span><span class="p">.</span><span class="na">eval</span><span class="p">(</span><span class="n">lua</span><span class="p">,</span><span class="w"> </span><span class="n">List</span><span class="p">.</span><span class="na">of</span><span class="p">(</span><span class="s">&quot;lock:coupon:1&quot;</span><span class="p">),</span><span class="w"> </span><span class="n">List</span><span class="p">.</span><span class="na">of</span><span class="p">(</span><span class="n">token</span><span class="p">));</span>
</code></pre></div>


这一行是<strong>所有 Redis 锁实现的分水岭</strong>：没用 Lua / <code>EVAL</code> 的实现，一律按 V1 处理。
<h3>4.2 看门狗：TTL 短 + 自动续期</h3>

矛盾回顾：TTL 短则业务超期被踢，TTL 长则崩溃恢复慢。

Redisson 的解法是<strong>看门狗（Watchdog）</strong>：加锁时给一个短 TTL（默认 30 秒），后台起一个定时任务，每 10 秒检查一次“业务还没跑完且锁还是我的”，就 <code>PEXPIRE</code> 续期 30 秒。业务结束或进程崩溃，续期停止，锁最多 30 秒后自动释放。
<div class="codehilite"><pre><span></span><code><span class="kn">import</span><span class="w"> </span><span class="nn">threading</span>
<span class="kn">import</span><span class="w"> </span><span class="nn">time</span>

<span class="k">class</span><span class="w"> </span><span class="nc">RedisLock</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">client</span><span class="p">,</span> <span class="n">key</span><span class="p">,</span> <span class="n">ttl_ms</span><span class="o">=</span><span class="mi">30000</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">r</span> <span class="o">=</span> <span class="n">client</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">key</span> <span class="o">=</span> <span class="n">key</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">ttl_ms</span> <span class="o">=</span> <span class="n">ttl_ms</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">token</span> <span class="o">=</span> <span class="kc">None</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_stop</span> <span class="o">=</span> <span class="n">threading</span><span class="o">.</span><span class="n">Event</span><span class="p">()</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">acquire</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">timeout_ms</span><span class="o">=</span><span class="mi">5000</span><span class="p">):</span>
        <span class="n">deadline</span> <span class="o">=</span> <span class="n">time</span><span class="o">.</span><span class="n">time</span><span class="p">()</span> <span class="o">+</span> <span class="n">timeout_ms</span> <span class="o">/</span> <span class="mi">1000</span>
        <span class="k">while</span> <span class="n">time</span><span class="o">.</span><span class="n">time</span><span class="p">()</span> <span class="o">&lt;</span> <span class="n">deadline</span><span class="p">:</span>
            <span class="n">token</span> <span class="o">=</span> <span class="n">uuid</span><span class="o">.</span><span class="n">uuid4</span><span class="p">()</span><span class="o">.</span><span class="n">hex</span>
            <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">r</span><span class="o">.</span><span class="n">set</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">key</span><span class="p">,</span> <span class="n">token</span><span class="p">,</span> <span class="n">nx</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">px</span><span class="o">=</span><span class="bp">self</span><span class="o">.</span><span class="n">ttl_ms</span><span class="p">):</span>
                <span class="bp">self</span><span class="o">.</span><span class="n">token</span> <span class="o">=</span> <span class="n">token</span>
                <span class="n">threading</span><span class="o">.</span><span class="n">Thread</span><span class="p">(</span><span class="n">target</span><span class="o">=</span><span class="bp">self</span><span class="o">.</span><span class="n">_watchdog</span><span class="p">,</span> <span class="n">daemon</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span><span class="o">.</span><span class="n">start</span><span class="p">()</span>
                <span class="k">return</span> <span class="kc">True</span>
            <span class="n">time</span><span class="o">.</span><span class="n">sleep</span><span class="p">(</span><span class="mf">0.05</span><span class="p">)</span>
        <span class="k">return</span> <span class="kc">False</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">_watchdog</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="c1"># 每 ttl/3 续期一次</span>
        <span class="k">while</span> <span class="ow">not</span> <span class="bp">self</span><span class="o">.</span><span class="n">_stop</span><span class="o">.</span><span class="n">wait</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">ttl_ms</span> <span class="o">/</span> <span class="mi">3000</span><span class="p">):</span>
            <span class="n">lua</span> <span class="o">=</span> <span class="s2">&quot;if redis.call(&#39;GET&#39;,KEYS[1])==ARGV[1] then return redis.call(&#39;PEXPIRE&#39;,KEYS[1],ARGV[2]) else return 0 end&quot;</span>
            <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">r</span><span class="o">.</span><span class="n">eval</span><span class="p">(</span><span class="n">lua</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="bp">self</span><span class="o">.</span><span class="n">key</span><span class="p">,</span> <span class="bp">self</span><span class="o">.</span><span class="n">token</span><span class="p">,</span> <span class="bp">self</span><span class="o">.</span><span class="n">ttl_ms</span><span class="p">)</span> <span class="o">==</span> <span class="mi">0</span><span class="p">:</span>
                <span class="k">break</span>  <span class="c1"># 锁已丢，不再续</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">release</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">_stop</span><span class="o">.</span><span class="n">set</span><span class="p">()</span>
        <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">token</span><span class="p">:</span>
            <span class="n">release_safe</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">key</span><span class="p">,</span> <span class="bp">self</span><span class="o">.</span><span class="n">token</span><span class="p">)</span>
</code></pre></div>


生产建议：<strong>直接用 Redisson（Java）/ redis-py 的锁 + 自研看门狗，而不是手写</strong>。Redisson 的 <code>RLock.lock()</code> 默认就带看门狗 + 可重入计数 + Pub/Sub 唤醒等待者，比上面 30 行健壮得多：
<div class="codehilite"><pre><span></span><code><span class="n">RLock</span><span class="w"> </span><span class="n">lock</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">redisson</span><span class="p">.</span><span class="na">getLock</span><span class="p">(</span><span class="s">&quot;lock:coupon:1&quot;</span><span class="p">);</span>
<span class="n">lock</span><span class="p">.</span><span class="na">lock</span><span class="p">();</span><span class="w">  </span><span class="c1">// 默认 30s + 看门狗续期，可重入</span>
<span class="k">try</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">grabCoupon</span><span class="p">(</span><span class="n">userId</span><span class="p">);</span>
<span class="p">}</span><span class="w"> </span><span class="k">finally</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">lock</span><span class="p">.</span><span class="na">unlock</span><span class="p">();</span>
<span class="p">}</span>
</code></pre></div>

<h3>4.3 等待策略：别用无脑 while true</h3>

上面 <code>acquire</code> 里 <code>sleep(50ms)</code> 轮询是最糙的。三个优化方向：
<table>
<thead>
<tr>
<th>策略</th>
<th>做法</th>
<th>适用</th>
</tr>
</thead>
<tbody>
<tr>
<td>固定退避 + 超时</td>
<td>50ms 轮询，最多等 5 秒</td>
<td>通用默认</td>
</tr>
<tr>
<td>指数退避 + 抖动</td>
<td>50ms → 100ms → 200ms…+随机</td>
<td>争抢激烈时减少 Redis 压力</td>
</tr>
<tr>
<td>Pub/Sub 唤醒</td>
<td>Redisson 解锁时 publish，等待者 subscribe 被唤醒再抢</td>
<td>高并发秒杀，减少空转</td>
</tr>
</tbody>
</table>

小博客/后台任务用第一种就够，秒杀再上第三种。
<blockquote>

<strong>结论：V3（SET NX PX + token + Lua 解锁 + 看门狗）是单 Redis 实例下的生产标准答案。本文附带的模板可以直接抄。</strong>
</blockquote>
<hr>
<h2>5. V4：Redlock，争议最大的算法</h2>
<h3>5.1 Redlock 想解决什么</h3>

V3 有一个前提：<strong>Redis 是单实例（或主从但只写主）</strong>。一旦用了 Redis Cluster / 哨兵主从切换，会出现丢锁：
<ol>
<li>A 在 Master 拿到锁 <code>lock:1</code>；</li>
<li>Master 还没同步给 Slave 就宕机；</li>
<li>Slave 升主，没有 <code>lock:1</code>；</li>
<li>B 在新 Master 拿到同一把锁，A 和 B 同时在临界区。</li>
</ol>

Redlock（Antirez 提出）的思路：准备 5 个<strong>独立</strong> Redis 实例，拿锁要多数派（≥3）成功，且总耗时小于 TTL 才算拿到。释放时逐个实例 Lua 删除。
<div class="codehilite"><pre><span></span><code><span class="c1"># 伪代码，理解思想用，生产请用 redlock-py / Redisson.RedLock</span>
<span class="k">def</span><span class="w"> </span><span class="nf">redlock_acquire</span><span class="p">(</span><span class="n">key</span><span class="p">,</span> <span class="n">token</span><span class="p">,</span> <span class="n">ttl_ms</span><span class="p">,</span> <span class="n">instances</span><span class="p">):</span>
    <span class="n">n</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="n">start</span> <span class="o">=</span> <span class="n">time</span><span class="o">.</span><span class="n">time</span><span class="p">()</span>
    <span class="k">for</span> <span class="n">r</span> <span class="ow">in</span> <span class="n">instances</span><span class="p">:</span>
        <span class="k">try</span><span class="p">:</span>
            <span class="k">if</span> <span class="n">r</span><span class="o">.</span><span class="n">set</span><span class="p">(</span><span class="n">key</span><span class="p">,</span> <span class="n">token</span><span class="p">,</span> <span class="n">nx</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">px</span><span class="o">=</span><span class="n">ttl_ms</span><span class="p">):</span>
                <span class="n">n</span> <span class="o">+=</span> <span class="mi">1</span>
        <span class="k">except</span> <span class="ne">Exception</span><span class="p">:</span>
            <span class="k">pass</span>
    <span class="n">elapsed</span> <span class="o">=</span> <span class="p">(</span><span class="n">time</span><span class="o">.</span><span class="n">time</span><span class="p">()</span> <span class="o">-</span> <span class="n">start</span><span class="p">)</span> <span class="o">*</span> <span class="mi">1000</span>
    <span class="c1"># 多数派 + 没超时 = 成功，否则回滚</span>
    <span class="k">if</span> <span class="n">n</span> <span class="o">&gt;=</span> <span class="nb">len</span><span class="p">(</span><span class="n">instances</span><span class="p">)</span> <span class="o">//</span> <span class="mi">2</span> <span class="o">+</span> <span class="mi">1</span> <span class="ow">and</span> <span class="n">elapsed</span> <span class="o">&lt;</span> <span class="n">ttl_ms</span><span class="p">:</span>
        <span class="k">return</span> <span class="kc">True</span>
    <span class="k">for</span> <span class="n">r</span> <span class="ow">in</span> <span class="n">instances</span><span class="p">:</span>
        <span class="k">try</span><span class="p">:</span>
            <span class="n">release_safe_on</span><span class="p">(</span><span class="n">r</span><span class="p">,</span> <span class="n">key</span><span class="p">,</span> <span class="n">token</span><span class="p">)</span>
        <span class="k">except</span> <span class="ne">Exception</span><span class="p">:</span>
            <span class="k">pass</span>
    <span class="k">return</span> <span class="kc">False</span>
</code></pre></div>

<h3>5.2 为什么争议这么大</h3>

Martin Kleppmann 发长文炮轰 Redlock，核心两点：
<ol>
<li><strong>依赖系统时钟</strong>：Redlock 用“总耗时 &lt; TTL”判断有效性，假设各实例时钟大致同步。一旦某台机器时钟跳变（NTP 纠时、虚拟机暂停），锁的有效期判断就错了。而 fencing token 方案不依赖时钟。</li>
<li><strong>没有解决 GC 停顿导致的互斥失效</strong>：A 拿到锁后 STW 停顿 40 秒（TTL 30 秒），锁过期被 B 拿走，A 恢复后继续执行业务，照样双写。这是<strong>所有基于 TTL 的锁</strong>的原罪，Redlock 也不例外。真正的解法是让资源层做 fencing（下一章）。</li>
</ol>

Antirez 的反驳：Redlock 的目标是“在 Redis 挂掉/切换时仍互斥”，不是“解决进程停顿”，两者不在一层。时钟跳变可以通过运维规范缓解。

谁对？我的生产经验：
<ul>
<li>90% 的团队<strong>连单实例锁都没写对</strong>（还在用 V1），根本轮不到操心 Redlock；</li>
<li>用了云 Redis（主从自动切换）又要求强互斥（库存、资金）的，要么上 Redlock，要么直接换 ZK/Etcd；</li>
<li>普通防重（定时任务、短信防抖），单实例 + V3 足够，别给自己加戏。</li>
</ul>
<blockquote>

<strong>结论：Redlock 不是银弹，是“单实例不够用”时的备选项。先把 V3 写对，再谈 Redlock。</strong>
</blockquote>
<hr>
<h2>6. 失效边界：Redis 锁搞不定的两种场景</h2>

这是深度长文必须有的诚实章节。
<h3>6.1 场景一：进程停顿超过 TTL，锁形同虚设</h3>

如 5.2 所述，任何 TTL 锁都防不住“拿到锁后长时间停顿”。解法是 <strong>fencing token（栅栏令牌）</strong>：

每次加锁成功返回一个单调递增的 token（如 Redis <code>INCR lock:fence</code>），业务写资源时必须带上 token，资源层拒绝旧 token 的写入：
<div class="codehilite"><pre><span></span><code><span class="mf">1.</span><span class="w"> </span><span class="n">A</span><span class="w"> </span><span class="n">拿锁</span><span class="err">，</span><span class="n">fence</span><span class="o">=</span><span class="mf">10</span>
<span class="mf">2.</span><span class="w"> </span><span class="n">A</span><span class="w"> </span><span class="n">STW</span><span class="w"> </span><span class="mf">40</span><span class="n">s</span><span class="err">，</span><span class="n">锁过期</span><span class="err">，</span><span class="n">B</span><span class="w"> </span><span class="n">拿锁</span><span class="err">，</span><span class="n">fence</span><span class="o">=</span><span class="mf">11</span>
<span class="mf">3.</span><span class="w"> </span><span class="n">B</span><span class="w"> </span><span class="n">写入</span><span class="w"> </span><span class="n">DB</span><span class="err">（</span><span class="n">fence</span><span class="o">=</span><span class="mf">11</span><span class="err">），</span><span class="n">成功</span>
<span class="mf">4.</span><span class="w"> </span><span class="n">A</span><span class="w"> </span><span class="n">恢复</span><span class="err">，</span><span class="n">想写入</span><span class="w"> </span><span class="n">DB</span><span class="err">（</span><span class="n">fence</span><span class="o">=</span><span class="mf">10</span><span class="err">），</span><span class="n">DB</span><span class="w"> </span><span class="n">发现</span><span class="w"> </span><span class="mf">10</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mf">11</span><span class="err">，</span><span class="n">拒绝</span>
</code></pre></div>


MySQL 实现骨架：
<div class="codehilite"><pre><span></span><code><span class="c1">-- 资源表加 fence 列</span>
<span class="k">UPDATE</span><span class="w"> </span><span class="n">coupon_stock</span><span class="w"> </span><span class="k">SET</span><span class="w"> </span><span class="n">stock</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">stock</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">fence</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">11</span>
<span class="k">WHERE</span><span class="w"> </span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="k">AND</span><span class="w"> </span><span class="n">fence</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">11</span><span class="p">;</span><span class="w">  </span><span class="c1">-- 旧 token 写不进去</span>
</code></pre></div>


这就是 ZooKeeper / Etcd 顺序节点的思想：<strong>锁只做“选主”，真正防并发靠资源层的版本号校验</strong>。资金、库存务必加这一层。
<h3>6.2 场景二：锁粒度太大，系统被串行化</h3>

有人给“整个下单接口”加一把大锁，并发 1000 直接变串行，RT 从 50ms 涨到 2s。排查三问：
<ol>
<li>锁的 key 能不能更细？<code>lock:coupon:1</code> 比 <code>lock:coupon</code> 好，<code>lock:coupon:1:user:123</code> 在防重复提交时更好；</li>
<li>临界区能不能更小？只锁“查库存+扣减”，短信/日志扔出锁外异步做；</li>
<li>能不能不用锁？库存扣减完全可以用 DB 原子操作代替：</li>
</ol>
<div class="codehilite"><pre><span></span><code><span class="k">UPDATE</span><span class="w"> </span><span class="n">coupon</span><span class="w"> </span><span class="k">SET</span><span class="w"> </span><span class="n">stock</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">stock</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="k">WHERE</span><span class="w"> </span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="k">AND</span><span class="w"> </span><span class="n">stock</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="c1">-- 影响行数 1 = 成功，0 = 没抢到，无需任何分布式锁</span>
</code></pre></div>


<strong>能用原子操作解决的，别用锁。</strong> 锁是最重的同步手段。
<hr>

我的选型口诀：
<ul>
<li>先问“能不能不用锁”（原子 SQL / 唯一索引去重）；</li>
<li>能，写 SQL；</li>
<li>不能，单 Redis V3；</li>
<li>云上主从切换丢过锁，再上 Redlock 或 ZK；</li>
<li>钱相关的，锁 + fencing/唯一约束双保险。</li>
</ul>
<hr>
<h2>8. 上线 Checklist + 高频 FAQ</h2>

<strong>Checklist（10 项）</strong>
<ul>
<li>[ ] 加锁是 <code>SET key token NX PX</code> 单命令，非 <code>SETNX + EXPIRE</code> 两步</li>
<li>[ ] token 是每次随机的 UUID，解锁用 Lua 比较+删除</li>
<li>[ ] TTL 按“崩溃恢复容忍”设（30s 左右），业务耗时靠看门狗续期而非调大 TTL</li>
<li>[ ] 临界区只放必须互斥的代码，IO（短信/邮件/日志）扔出去</li>
<li>[ ] 锁 key 带业务前缀和版本：<code>lock:v1:coupon:1</code>，大改版切 <code>v2</code></li>
<li>[ ] 获取不到锁有超时 + 退避，而非 <code>while True</code> 打爆 Redis</li>
<li>[ ] 主从切换场景已评估，丢不起的上了 Redlock 或 fencing</li>
<li>[ ] 资金/库存有 DB 层兜底（<code>WHERE stock &gt; 0</code> / 唯一约束 / fence 列）</li>
<li>[ ] 监控了锁等待时长和拿锁失败率，而非只监控 Redis 存活</li>
<li>[ ] 本地压测过“持有者崩溃”和“业务超 TTL”两种故障，而非只测 happy path</li>
</ul>

<strong>FAQ</strong>

<strong>Q1：TTL 设多少？</strong>
A：默认 30s + 看门狗。先短后调，别一上来 10 分钟。

<strong>Q2：Redisson 和手写哪个好？</strong>
A：生产用 Redisson（Java）/ 成熟库。手写只用于学习和面试讲原理。

<strong>Q3：Redis Cluster 能用 Redlock 吗？</strong>
A：Redlock 要求 5 个<strong>独立主节点</strong>，不是 Cluster 分片。Cluster 用 <code>{hash tag}</code> 把锁固定到单槽位，走 V3 也行，但 failover 丢锁问题仍在。

<strong>Q4：定时任务重复执行，用锁还是用 ShedLock？</strong>
A：Java 直接 ShedLock（DB/Redis/JDBC 都支持），原理就是本文 V2，省得自己写。

<strong>Q5：点了两次提交，生成两个订单，锁加哪？</strong>
A：key 加用户维度：<code>lock:order:submit:{userId}:{idempotencyKey}</code>，前端再配按钮防抖 + 后端唯一约束，三层。

<strong>Q6：Go / Python 没有 Redisson 怎么办？</strong>
A：<code>redis-py</code> + 本文 V3 模板，或 <code>go-redsync</code>（Redlock 官方 Go 实现），都有看门狗等价物。
<hr>
<h2>结语</h2>

Redis 分布式锁就三句话：
<blockquote>
<ol>
<li>加锁原子（SET NX PX），解锁原子（Lua 比 token 再删）；</li>
<li>TTL 短 + 看门狗续，锁粒度越细越好；</li>
<li>丢不起的场景，锁只是“选主”，真正保命的是资源层的 fencing/唯一约束。</li>
</ol>
</blockquote>

下次有人说“加个 Redis 锁就行了”，把这篇的 Checklist 甩给他：V1 的代码还在不在？Lua 解锁写了吗？TTl 多少？主从切换丢锁怎么办？资金有 DB 兜底吗？五个问题答完，才算真的“加了锁”。</div></div></noscript>
