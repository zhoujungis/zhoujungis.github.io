<h2>前言：记忆不是仓库，是索引</h2>

人记住一件事，往往不是因为「存下来了」，而是因为「下次遇到相似场景时想起来了」。Agent 也一样：把用户说过的每一句话都存进数据库，并不能让它更懂你；真正起作用的是，在下一个任务开始时，它能不能从几百条旧信息里挑出三条真正相关的，塞进本次请求。

这件事看起来需要语义检索：用户上次说「发布脚本要先 dry-run」，这次问「怎么上线文章」，两句话没有共同词，向量相似度能连上，BM25 连不上。于是很多项目第一反应就是上向量库。但向量库只解决召回的一半问题，另一半——写什么、写多长、什么时候丢、注入多少——它一点都帮不上。而且它会把一个「单二进制、离线可用、好测试」的 Agent，变成一个需要模型服务、索引文件和重建流程的系统。

NanoHermes 走的是另一条路：不接向量库，用本地 BM25 加中日文二元切分做近似语义检索。整个 Agent 记忆模块 <code>agent/src/memory.rs</code> 不到 500 行，配上 <code>agent.rs</code> 里三处调用，就把「跨会话记住偏好与教训」跑通了。本文按数据流拆开：一条记忆怎么被写进来、怎么被去重、怎么被淘汰、怎么被检索、怎么被注入，以及这套做法在哪些地方会失效。
<h2>结论先行：记住四个数字</h2>

<thead>
<tr>

</thead>
<tbody>
<tr>
<td><code>MAX_ENTRIES</code></td>

<tr>

</tr>
<tr>
<td><code>INJECT_TOP_K</code></td>

</tr>
<tr>
<td><code>INJECT_CHAR_BUDGET</code></td>
<td>2,400</td>
<td>每轮注入字符数</td>

</tr>

四个数字之外还有三个：提炼摘录最多 6000 字符、单条消息摘录截到 1200 字符、去重的包含判定阈值是 12 字节。它们分别控制「读多少」「写多长」「算不算同一条」。

这四个上限不是拍脑袋定的，而是互相咬合的：单条最多 400 字，注入 4 条，理论上限是 1,600 字，加上每条 <code>- [经验]</code> 这样的前缀和标题行，刚好落在 2,400 字符预算内。也就是说，正常情况下 <code>INJECT_TOP_K</code> 先生效，字符预算只是最后一道保险；只有当日志行变长、标签变多时，预算才会先触发。

记忆库总量也能算出来：500 条 × 400 字，最坏情况 20 万字；中文按 UTF-8 三字节算约 600 KB，中英混合通常三四百 KB。对一个本地 Agent 来说，这个体积可以直接整文件读进内存做线性扫描，不需要索引。
<h2>三个容易混淆的东西：上下文、会话、记忆</h2>

三者是独立演化的。02 讲的压缩只动 <code>messages</code>，不会碰 <code>memory.json</code>；清空会话（<code>reset</code>）只重置消息数组，记忆库原封不动；反过来，关掉记忆功能也不会影响会话恢复。

这个边界很重要。很多人把「记忆」和「会话历史」混为一谈，于是做出一种东西：把所有历史都塞进上下文，然后在超长时做摘要。那不是长期记忆，那只是更长的上下文。长期记忆的判据是：换一个新会话、换一个任务，它还在，并且能被检索出来。

还有一层：默认情况下记忆目录是全局的（<code>~/.nanohermes</code>），不按项目隔离。这意味着在 A 项目学到的「部署前先跑测试」会出现在 B 项目的系统提示词里。对通用偏好是好事，对项目特有的路径约定可能是噪音。需要隔离时只能通过 <code>memory_dir</code> 配置换目录，代码里没有按 workspace 自动分库。
<h2>不接向量库：四个现实约束</h2>

先说结论：不是向量检索不好，而是它解决的那部分问题，在这个项目里排不到前三。
<div class="table-scroll"><table>
<thead>
<tr>
<th>维度</th>
<th>向量库</th>
<th>本地 BM25</th>
</tr>
</thead>
<tbody>
<tr>
<td>依赖</td>
<td>需要 embedding 模型（本地几百 MB 或联网 API）</td>
<td>纯 Rust 标准库 + 一个 JSON 文件</td>
</tr>
<tr>
<td>运维</td>
<td>索引文件、重建、版本迁移</td>
<td>读文件、线性扫描</td>
</tr>
<tr>
<td>隐私</td>
<td>记忆文本要发给 embedding 服务</td>
<td>全部留在本机</td>
</tr>
<tr>
<td>可解释性</td>
<td>只能给出相似度分数</td>
<td>能打印命中了哪些词、每项得分多少</td>
</tr>
<tr>
<td>更新成本</td>
<td>新增/修改要重新算向量</td>
<td>写入即生效</td>
</tr>
<tr>
<td>同义词召回</td>
<td>强（「发布」能连上「上线」）</td>
<td>弱（没有共同词就是零分）</td>
</tr>
<tr>
<td>冷启动</td>
<td>需要模型加载</td>
<td>毫秒级</td>
</tr>
<tr>
<td>可测试性</td>
<td>依赖模型输出，结果不稳定</td>
<td>纯函数，断言稳定</td>
</tr>
</tbody>
</table></div>

四个现实约束是：
<ol>
<li>项目目标是「小二进制、低内存、无 async 运行时」。引入 embedding 模型会把二进制和内存占用推高一个量级，和设计目标直接冲突。</li>
<li>记忆默认开启，用户可能完全离线。联网 embedding 会让「离线可用」变成一句空话。</li>
<li>记忆里会出现文件路径、内部接口名、甚至半截代码。把这些发给第三方 embedding API，是额外的隐私面。</li>
<li>记忆只有几百条。几百条文本做线性 BM25，每轮耗时可忽略；为这个规模上向量索引，是典型的过度设计。</li>
</ol>

代价也要说清楚：BM25 是词袋模型，不理解同义改写。用户上次说「上线」，这次问「部署」，如果记忆里只有「上线」两个字，就检索不到。缓解办法不是加向量库，而是写记忆时把两种说法都写进去，或者写得更具体（「上线 = 部署到 GitHub Pages」），让未来的查询更容易命中。这是写法问题，不是检索器问题。
<h2>全景：一次对话里的四个动作</h2>
<div class="codehilite"><pre><span></span><code>写入（轮次结束）
  user_text ──► worth_distilling? ──► excerpt_from(6000)
             ──► llm::distill ──► parse_distill
             ──► normalize ──► dedupe ──► trim(500) ──► memory.json

写入（轮次中，模型主动）
  memory_save(kind, text) ──► remember ──► 同一条链路

读取（下一轮开始）
  user_text ──► tokenize ──► BM25(search) ──► top 4
            ──► render_block(≤2400) ──► set_block(system)
</code></pre></div>


四个动作对应四个函数入口：<code>distill_memories</code>（自动写）、<code>save_tool</code>（主动写）、<code>retrieve_block</code>（读）、<code>set_block</code>（注入）。它们共享同一个 <code>memory.json</code>，没有缓存，也没有守护进程。

值得注意的顺序：读取发生在用户消息入队之前（<code>Agent::run</code> 开头），写入发生在轮次完整结束之后。也就是说，本轮新提炼出的记忆不会立刻影响本轮，只会影响下一轮或下一个会话。这个延迟是故意的：提炼本身要额外调用一次模型，如果放在轮次中间，会把延迟叠加到用户等待上。
<h2>存储：一个 JSON 文件与四个字段</h2>
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Entry</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">kind</span><span class="p">:</span><span class="w"> </span><span class="nc">Kind</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// 来源：`auto`（自动提炼）、`tool`（模型主动记录）或任务标识。</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">source</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// 写入时间（Unix 秒）。</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">ts</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


落盘格式就是一个对象包一个数组：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;entries&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span>
<span class="w">    </span><span class="p">{</span>
<span class="w">      </span><span class="nt">&quot;kind&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;correction&quot;</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;text&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;部署脚本默认先 dry-run，确认后再真正执行&quot;</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;source&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;auto&quot;</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;ts&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">1761200000</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">]</span>
<span class="p">}</span>
</code></pre></div>


四个字段各有用途：

<thead>
<tr>
<th>字段</th>
<th>用途</th>
<th>缺失/异常时</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>kind</code></td>
<td>决定注入标签与淘汰顺位</td>
<td>解析失败整条丢弃</td>
</tr>
<tr>
<td><code>text</code></td>
<td>检索与注入的唯一正文</td>

</tr>
<tr>
<td><code>source</code></td>
<td>区分自动提炼与主动写入，便于排查</td>

</tr>
<tr>

存储位置默认是 <code>~/.nanohermes/memory.json</code>，由 <code>default_dir()</code> 从 <code>HOME</code> 或 <code>USERPROFILE</code> 推导；<code>memory_dir</code> 配置可以覆盖。读取函数 <code>load</code> 的设计非常保守：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">load</span><span class="p">(</span><span class="n">dir</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Entry</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">data</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">fs</span><span class="p">::</span><span class="n">read_to_string</span><span class="p">(</span><span class="n">store_path</span><span class="p">(</span><span class="n">dir</span><span class="p">))</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Vec</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">v</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">serde_json</span><span class="p">::</span><span class="n">from_str</span><span class="p">::</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="p">(</span><span class="o">&amp;</span><span class="n">data</span><span class="p">)</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Vec</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


文件不存在、没有权限、JSON 损坏，一律返回空列表。好处是记忆永远不阻塞对话；坏处是「空列表」和「真的没有记忆」无法区分——这条我们放到失败语义一节展开。

还有一个细节：<code>save</code> 用的是 <code>std::fs::write</code>，先 <code>create_dir_all</code> 再整文件覆盖，没有临时文件加原子重命名。进程在写入中途被杀，文件就可能留下半截 JSON；下一次 <code>load</code> 返回空，下一次 <code>save</code> 又会用新内容覆盖掉这半截文件。也就是说，损坏的后果不是「读不出来」，而是「静默清零」。
<h2>四个类别：分桶是为了淘汰时有依据</h2>

<code>Kind</code> 只有四个值，但每个都有明确语义，并且参与两件事：注入时显示中文标签，淘汰时决定谁先被丢。
<div class="table-scroll"><table>
<thead>
<tr>
<th>类别</th>
<th>含义</th>
<th>典型例子</th>
<th>注入标签</th>
<th>淘汰顺位</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Preference</code></td>
<td>稳定的用户偏好</td>
<td>回复用中文、不要 emoji、UI 要简洁</td>
<td>偏好</td>
<td>0（最后丢）</td>
</tr>
<tr>
<td><code>Correction</code></td>
<td>用户否定过的做法与给出的正确做法</td>
<td>「不要单独弹窗，停靠在窗口右侧」</td>
<td>纠正</td>
<td>1</td>
</tr>
<tr>
<td><code>Lesson</code></td>
<td>踩过的坑、验证有效的做法</td>
<td>「WSL 里 git push 会缺凭据管理器」</td>
<td>经验</td>
<td>2</td>
</tr>
<tr>

<td>3（最先丢）</td>
</tr>

顺位数字越大越先被淘汰。理由很直白：偏好和纠正代表用户的稳定意图，重复写错代价最高；事实和具体经验容易过期，也容易从代码里重新发现。

注意最后一行：主动写入时非法类别直接失败，自动提炼时非法类别降级成事实。一个严格、一个宽松，因为自动提炼的输出不可控，不能因为模型写错一个枚举值就丢掉整条记忆。
<h2>写入路径一：模型主动 <code>memory_save</code></h2>

工具声明很直白：让模型把「值得跨任务记住」的东西写进来，参数是类别加一句自包含的话。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">save_tool</span><span class="p">(</span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Value</span><span class="p">,</span><span class="w"> </span><span class="n">dir</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">kind</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span>
<span class="w">        </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;kind&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">k</span><span class="o">|</span><span class="w"> </span><span class="n">k</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="n">Kind</span><span class="p">::</span><span class="n">parse</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">ok_or</span><span class="p">(</span><span class="s">&quot;kind 必须是 lesson / preference / correction / fact 之一&quot;</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span>
<span class="w">        </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;text&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">ok_or</span><span class="p">(</span><span class="s">&quot;缺少 text&quot;</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">added</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">remember</span><span class="p">(</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="n">kind</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">n</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">load</span><span class="p">(</span><span class="n">dir</span><span class="p">).</span><span class="n">len</span><span class="p">();</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="k">if</span><span class="w"> </span><span class="n">added</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;已记下（{kind:?}），当前记忆共 {n} 条&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;与已有记忆重复，未新增；当前记忆共 {n} 条&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">})</span>
<span class="p">}</span>
</code></pre></div>


返回值里带了总数，是为了让模型知道记忆库的规模；重复写入时明确说「未新增」，避免模型以为写成功了而反复重试。<code>source</code> 固定为 <code>tool</code>，事后可以区分这条记忆是模型主动记的，还是轮次结束自动提炼的。

什么时候该主动写？提示词里写的是：用户偏好、对你行为的纠正、付出代价换来的经验、稳定的项目事实。不该写的东西同样重要：一次性的文件状态、当前任务的临时决定、能从代码里直接读到的信息。这些写进去只会稀释检索。

工具层还有一道开关。<code>Ctx</code> 里的 <code>memory_dir</code> 是 <code>Option&lt;PathBuf&gt;</code>：
<div class="codehilite"><pre><span></span><code><span class="s">&quot;memory_save&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="o">&amp;</span><span class="n">ctx</span><span class="p">.</span><span class="n">memory_dir</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="n">dir</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">memory</span><span class="p">::</span><span class="n">save_tool</span><span class="p">(</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="n">dir</span><span class="p">),</span>
<span class="w">    </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="s">&quot;long-term memory is disabled (settings)&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">()),</span>
<span class="p">},</span>
</code></pre></div>


关闭记忆时工具仍然出现在工具列表里，只是调用会返回错误。这个不对称后面会单独说。
<h2>写入路径二：轮次结束自动提炼</h2>

主动写入依赖模型自觉，覆盖率不稳定。所以还有一条兜底：每个完整结束的轮次，让模型从这段对话里提炼一次。
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">completed</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">memory</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">distill_memories</span><span class="p">(</span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


<code>completed</code> 这个条件很关键：被 Ctrl-C 中断、或者撞到最大迭代次数的半截对话，不提炼。理由是被中断的轮次往往停在工具调用中间，结论还没出来，提炼出来的多半是过程噪音。

<code>distill_memories</code> 本身只有二十来行：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">distill_memories</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">user_text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">dir</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">memory_dir</span><span class="p">.</span><span class="n">clone</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Some</span><span class="p">(</span><span class="n">d</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">d</span><span class="p">,</span>
<span class="w">        </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="p">,</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">memory</span><span class="p">::</span><span class="n">worth_distilling</span><span class="p">(</span><span class="n">user_text</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">excerpt</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">excerpt_from</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="mi">6000</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">items</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">distill</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">excerpt</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">items</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">items</span><span class="p">,</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">_</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="p">,</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">saved</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="k">usize</span><span class="p">;</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">kind</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">items</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">remember</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="n">kind</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">text</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;auto&quot;</span><span class="p">).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="kc">false</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">saved</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">saved</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span>
<span class="w">            </span><span class="p">.</span><span class="n">note</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;已从本次对话沉淀 {saved} 条长期记忆&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个失败点全部静默：目录没配、门槛没过、模型调用失败。记忆是加分项，不能因为它挂掉就让一次已经成功的对话报错。成功时给一行提示，让用户知道「刚才那次对话被记住了」，而不是完全无感。
<h2>提炼门槛：一句 <code>contains</code> 省下一次模型调用</h2>

自动提炼的成本是每轮一次额外模型请求。如果用户只是说「继续」「好的」，这次请求就纯属浪费。所以有一个廉价预判：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">worth_distilling</span><span class="p">(</span><span class="n">user_text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">had_tools</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">const</span><span class="w"> </span><span class="n">MARKERS</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="o">&amp;</span><span class="kt">str</span><span class="p">;</span><span class="w"> </span><span class="mi">8</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[</span><span class="s">&quot;不对&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;错了&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;不是&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;不要&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;别&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;应该&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;重新&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;以后&quot;</span><span class="p">];</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">user_text</span><span class="p">.</span><span class="n">trim</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">MARKERS</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">text</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="n">m</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">text</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">24</span>
<span class="p">}</span>
</code></pre></div>


规则只有三条：

</tr>

这条门槛有一个粗糙的地方：关键词用的是 <code>contains</code>，没有词边界。「别」会命中「特别」，「不是」会命中「是不是」。中文本来就没有空格分词，做精确匹配要引入分词器，成本比收益高；最终选择接受假阳性——多提炼一次只是多一次模型调用，漏掉一次纠正才是真正的损失。

<code>had_tools</code> 直接放行也有类似的取舍：一次只读文件的轮次可能什么经验都没有，但仍然会提炼。所以提炼提示词里必须有一条「没有可长期保留的就返回空数组」，把判断权交回模型。
<h2>提炼提示词：四条硬约束</h2>

提炼用的是独立提示词，和主对话完全隔离：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">DISTILL_SYSTEM</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;\</span>
<span class="s">You extract durable long-term memories for a coding assistant from a finished conversation turn.</span>
<span class="s">Return ONLY a JSON array (no prose, no markdown fences). Each item is</span>
<span class="s">{</span><span class="se">\&quot;</span><span class="s">kind</span><span class="se">\&quot;</span><span class="s">: </span><span class="se">\&quot;</span><span class="s">lesson|preference|correction|fact</span><span class="se">\&quot;</span><span class="s">, </span><span class="se">\&quot;</span><span class="s">text</span><span class="se">\&quot;</span><span class="s">: </span><span class="se">\&quot;</span><span class="s">...</span><span class="se">\&quot;</span><span class="s">} where:</span>
<span class="s">- lesson:     an experience or lesson learned (a pitfall to avoid, or an approach that worked);</span>
<span class="s">- preference: a stable user preference (style, workflow, deliverable format);</span>
<span class="s">- correction: something the user rejected and the right way they gave instead;</span>
<span class="s">- fact:       a durable project/environment convention.</span>
<span class="s">Rules: each text is ONE self-contained sentence in the conversation&#39;s language, at most 200 characters;</span>
<span class="s">it must hold up in future unrelated sessions (no task-local details like dates or one-off file states);</span>
<span class="s">dedupe near-identical items; if nothing is durable, return [].&quot;</span><span class="p">;</span>
</code></pre></div>

这里有个前后不一致：提示词要求 200 字符，代码里的 <code>MAX_TEXT</code> 是 400 字符。模型守规矩时没问题；模型写长了，<code>remember</code> 会在 400 字处静默截断，可能把一句话切成半截。宽松的上限是给主动调用 <code>memory_save</code> 留的余量，但对自动提炼来说，200 和 400 之间那段空白其实是风险区。

提示词还允许返回空数组。这是整套设计里最容易被忽略的一句：没有可记的东西，比硬凑一条更正确。一个只会写「用户让我改代码」的记忆库，检索价值是零。
<h2>摘录怎么拼：system 丢掉，工具结果截到 1200 字</h2>

提炼不是把整个对话原样发过去，而是先拼一段摘录：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">excerpt_from</span><span class="p">(</span><span class="n">messages</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="n">Value</span><span class="p">],</span><span class="w"> </span><span class="n">max_chars</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">m</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">messages</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">role</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;role&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">body</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">role</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="s">&quot;system&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;tool&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[tool result] {}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">content_text</span><span class="p">(</span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="o">&amp;</span><span class="n">Value</span><span class="p">::</span><span class="n">Null</span><span class="p">))),</span>
<span class="w">            </span><span class="s">&quot;assistant&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;tool_calls&quot;</span><span class="p">).</span><span class="n">is_some</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="n">c</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">).</span><span class="n">trim</span><span class="p">().</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="k">continue</span><span class="p">;</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">                </span><span class="n">content_text</span><span class="p">(</span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="o">&amp;</span><span class="n">Value</span><span class="p">::</span><span class="n">Null</span><span class="p">))</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">content_text</span><span class="p">(</span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="o">&amp;</span><span class="n">Value</span><span class="p">::</span><span class="n">Null</span><span class="p">)),</span>
<span class="w">        </span><span class="p">};</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">body</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">body</span><span class="p">.</span><span class="n">trim</span><span class="p">();</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">body</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">continue</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">body</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">body</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">take</span><span class="p">(</span><span class="mi">1200</span><span class="p">).</span><span class="n">collect</span><span class="p">();</span>
<span class="w">        </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[{role}] {body}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">));</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="n">max_chars</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">break</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">out</span>
<span class="p">}</span>
</code></pre></div>


处理规则可以列成一张表：
<div class="table-scroll"><table>
<thead>
<tr>
<th>消息类型</th>
<th>处理</th>
<th>理由</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>system</code></td>
<td>整条跳过</td>
<td>系统提示词是配置，不是对话内容</td>
</tr>
<tr>
<td><code>tool</code></td>
<td>加 <code>[tool result]</code> 前缀，正文截 1200 字</td>
<td>工具输出常常几万字节，全发会挤掉真正的结论</td>
</tr>
<tr>
<td><code>assistant</code> 只有 <code>tool_calls</code> 没有正文</td>
<td>整条跳过</td>
<td>这类消息只有函数名和参数，对提炼没帮助</td>
</tr>
<tr>
<td><code>assistant</code> 有正文</td>
<td>保留，截 1200 字</td>
<td>结论、计划、解释都在这里</td>
</tr>
<tr>
<td><code>user</code></td>
<td>保留，截 1200 字</td>
<td>目标、约束、纠正都在这里</td>
</tr>
<tr>
<td>多模态数组</td>
<td>只取 <code>text</code> 部分</td>
<td>图片对文本提炼没有用，而且 base64 会爆长度</td>
</tr>
</tbody>
</table></div>

注意截断发生在单条消息上，不是整体截断：每条最多 1200 字，总长度到 6000 就停止追加。所以一次提炼最多看到五条满长消息，或者更多短消息。

还有一个隐含信息：工具结果被保留，而不是被丢弃。这一点和「上下文压缩」不同——压缩时工具结果最容易被丢，因为它们通常很长；但提炼经验时，工具结果恰恰是「什么命令有效、报了什么错」的证据。同一份历史，两个消费者，两种取舍。
<h2>摘录的盲区：只取开头 6000 字符</h2>

<code>excerpt_from</code> 是从 <code>messages[0]</code> 开始往后遍历的。这意味着摘录取的是对话的开头，而不是结尾。
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">m</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">messages</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="n">max_chars</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


在一个短轮次里这没问题：6000 字符足够覆盖全部消息。但在一个长轮次里——比如用户让它读十个文件、跑五次命令、最后给结论——摘录会在前五六条消息处就用完预算，真正的结论、最后的纠正、最终确认的方案，全部落在 6000 字符之外。提炼出来的记忆于是偏向「任务开始时说了什么」，而不是「任务结束时得出了什么」。

更麻烦的是，这个盲区没有任何提示：模型不会知道自己只看到了前半段，它会根据前半段自信地提炼。结果是记忆库里多了一条「用户在开头提到的初步想法」，少了一条「最后确认的做法」。

有两个改法，代价都很低：
<div class="table-scroll"><table>
<thead>
<tr>
<th>改法</th>
<th>做法</th>
<th>代价</th>
</tr>
</thead>
<tbody>
<tr>
<td>取尾部</td>
<td>反向遍历，或先算总长再从后往前收集</td>
<td>丢掉任务目标，可能提炼出没有上下文的结论</td>
</tr>
<tr>
<td>首尾各一半</td>
<td>前 3000 字符 + 后 3000 字符，中间省略</td>
<td>实现多十几行，但目标和结论都能保住</td>
</tr>
</tbody>
</table></div>

如果历史已经被压缩过，情况会好一些：<code>messages[1]</code> 是一条摘要，正好概括了被丢掉的中段，而摘录从索引 1 开始就会优先包含它。但这只是碰巧缓解，不能替代「取尾部」的修正。
<h2>解析：模型不听话时的四层兜底</h2>

提炼要求「只返回 JSON 数组」，但模型经常会加围栏、加前言、或者包一层对象。解析器为此做了四层容错：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">parse_distill</span><span class="p">(</span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="p">(</span><span class="n">Kind</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="p">)</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">trimmed</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">text</span><span class="p">.</span><span class="n">trim</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">json_part</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="nb">Some</span><span class="p">(</span><span class="n">a</span><span class="p">),</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">b</span><span class="p">))</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">trimmed</span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="sc">&#39;[&#39;</span><span class="p">),</span><span class="w"> </span><span class="n">trimmed</span><span class="p">.</span><span class="n">rfind</span><span class="p">(</span><span class="sc">&#39;]&#39;</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">trimmed</span><span class="p">[</span><span class="n">a</span><span class="o">..=</span><span class="n">b</span><span class="p">].</span><span class="n">to_string</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="nb">Some</span><span class="p">(</span><span class="n">a</span><span class="p">),</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">b</span><span class="p">))</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">trimmed</span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="sc">&#39;{&#39;</span><span class="p">),</span><span class="w"> </span><span class="n">trimmed</span><span class="p">.</span><span class="n">rfind</span><span class="p">(</span><span class="sc">&#39;}&#39;</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">trimmed</span><span class="p">[</span><span class="n">a</span><span class="o">..=</span><span class="n">b</span><span class="p">].</span><span class="n">to_string</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">trimmed</span><span class="p">.</span><span class="n">to_string</span><span class="p">()</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">v</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">serde_json</span><span class="p">::</span><span class="n">from_str</span><span class="p">::</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="p">(</span><span class="o">&amp;</span><span class="n">json_part</span><span class="p">)</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Vec</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">arr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">v</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">Value</span><span class="p">::</span><span class="n">Array</span><span class="p">(</span><span class="n">a</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">a</span><span class="p">,</span>
<span class="w">        </span><span class="n">Value</span><span class="p">::</span><span class="n">Object</span><span class="p">(</span><span class="n">_</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">v</span>
<span class="w">            </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;memories&quot;</span><span class="p">)</span>

一个测试直接锁住了前三行和最后两行的行为。这种「宽松解析」不是偷懒，而是把模型的不可控性挡在记忆库之外：解析失败最多是这一轮没有新记忆，绝不会写进半条脏数据。
<h2>去重：normalize 之后比「包含」，但 12 是字节</h2>

模型很爱重复。同一句「回复用中文」，可能在十个轮次里被提炼十次。如果不去重，500 条上限很快就被同一句话占满。<code>remember</code> 的去重逻辑是：先归一化，再比相等或包含。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">normalize</span><span class="p">(</span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">text</span><span class="p">.</span><span class="n">to_lowercase</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">chars</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="o">!</span><span class="n">c</span><span class="p">.</span><span class="n">is_whitespace</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="s">&quot;，。！？；：、,.!?;:()（）「」</span><span class="se">\&quot;</span><span class="s">&#39;“”【】…—-·*#`&gt;~&quot;</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">*</span><span class="n">c</span><span class="p">))</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="p">}</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">key</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">normalize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">text</span><span class="p">);</span>
<span class="k">for</span><span class="w"> </span><span class="n">e</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">entries</span><span class="p">.</span><span class="n">iter_mut</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">old</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">normalize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">.</span><span class="n">text</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">old</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">key</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="p">(</span><span class="n">key</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">12</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">old</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">key</span><span class="p">))</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="p">(</span><span class="n">old</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">12</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">key</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">old</span><span class="p">))</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">e</span><span class="p">.</span><span class="n">ts</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">now</span><span class="p">();</span>
<span class="w">        </span><span class="n">e</span><span class="p">.</span><span class="n">source</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">source</span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
<span class="w">        </span><span class="n">save</span><span class="p">(</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">entries</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="kc">false</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>
