这里最容易看错的是 <code>12</code>。<code>String::len()</code> 返回的是 UTF-8 字节数，不是字符数。对中文来说，12 字节只有 4 个字；对英文来说，12 字节是 12 个字符。所以「用中文」（3 个字，9 字节）不会触发包含判定，而「不要用 emoji」（约 15 字节）会。这个阈值实际上偏向英文和长句，短中文偏好更容易重复堆积。

去重命中时，只刷新 <code>ts</code> 和 <code>source</code>，不改 <code>kind</code> 也不改 <code>text</code>。这带来一个副作用：如果先写了一条 <code>fact</code>，后来同一句话被当成 <code>preference</code> 写入，类别仍然是 <code>fact</code>，淘汰顺位也不会更新。想改类别只能先删掉旧条目——而代码里没有删除单条记忆的工具。
<h2>上限与淘汰：500 条、400 字与一个顺位表</h2>

写入前会先把文本截到 400 字，再追加，再 <code>trim</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">text</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">take</span><span class="p">(</span><span class="n">MAX_TEXT</span><span class="p">).</span><span class="n">collect</span><span class="p">();</span>
<span class="c1">// ...</span>
<span class="n">entries</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">Entry</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">kind</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">,</span><span class="w"> </span><span class="n">source</span><span class="p">:</span><span class="w"> </span><span class="nc">source</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span><span class="w"> </span><span class="n">ts</span><span class="p">:</span><span class="w"> </span><span class="nc">now</span><span class="p">()</span><span class="w"> </span><span class="p">});</span>
<span class="n">trim</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">entries</span><span class="p">);</span>
<span class="n">save</span><span class="p">(</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">entries</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


<code>trim</code> 的写法值得单独看：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">trim</span><span class="p">(</span><span class="n">entries</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Entry</span><span class="o">&gt;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">entries</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">MAX_ENTRIES</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">victim</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">entries</span>
<span class="w">            </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">enumerate</span><span class="p">()</span>
<span class="w">            </span><span class="p">.</span><span class="n">max_by_key</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">_</span><span class="p">,</span><span class="w"> </span><span class="n">e</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">eviction_rank</span><span class="p">(),</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">ts</span><span class="p">))</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">_</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="n">i</span><span class="p">)</span>
<span class="w">            </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
<span class="w">        </span><span class="n">entries</span><span class="p">.</span><span class="n">remove</span><span class="p">(</span><span class="n">victim</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


逐条解释：
<ol>
<li>先按类别顺位排序：<code>Fact</code> 3、<code>Lesson</code> 2、<code>Correction</code> 1、<code>Preference</code> 0。</li>
<li>顺位相同时，按 <code>ts</code> 取最大值。</li>
<li>删掉这一条，直到总数回到 500。</li>
</ol>

设计意图写在注释里：先丢经验与事实，偏好与纠正最后才动。理由前面说过，用户的稳定意图比一次性事实更值钱。

但 <code>max_by_key</code> 在顺位相同时取的是最大的 <code>ts</code>，也就是最新写入的那条。这和第 2 步的意图相反。
<h2>一个真实的偏差：注释说丢最旧，代码丢最新</h2>

<code>trim</code> 上方的注释是「超出上限时淘汰：先丢最旧的经验/事实」。而代码在类别顺位相同时选择 <code>ts</code> 最大的条目，也就是最新的一条。于是实际行为变成：当记忆库满 500 条、且最该淘汰的类别里有多个条目时，被删掉的是最近刚写的那条，而不是最旧的那条。

这会造成一种反直觉的现象：用户刚纠正过一次，系统提炼出一条新的 <code>Lesson</code>；如果此时库里已经有 500 条且 <code>Fact</code>/<code>Lesson</code> 占多数，这条新记忆可能刚写进去就被淘汰。偏好和纠正因为顺位低，暂时不受影响。

修法只需要把时间比较反过来：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">victim</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">entries</span>
<span class="w">    </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">enumerate</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">max_by_key</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">_</span><span class="p">,</span><span class="w"> </span><span class="n">e</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">eviction_rank</span><span class="p">(),</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">cmp</span><span class="p">::</span><span class="n">Reverse</span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">ts</span><span class="p">)))</span>
<span class="w">    </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">_</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="n">i</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
</code></pre></div>


<code>Reverse</code> 让「最大」在时间维度上变成「最小」，于是先按类别顺位、再按最旧排序。或者拆成两步：先筛出最高顺位的候选集，再在里面找 <code>min_by_key(|e| e.ts)</code>。

为什么这个偏差一直没被发现？因为对应的测试只断言了「偏好条目活下来」，没有断言「同类别里丢的是最旧的」：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">trims_oldest_lessons_before_touching_preferences</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">entries</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">vec!</span><span class="p">[</span><span class="n">entry</span><span class="p">(</span><span class="n">Kind</span><span class="p">::</span><span class="n">Preference</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;用户偏好简洁的中文回复&quot;</span><span class="p">)];</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="n">MAX_ENTRIES</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">entries</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">entry</span><span class="p">(</span><span class="n">Kind</span><span class="p">::</span><span class="n">Lesson</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;经验{i}：某个只对本次有意义的细节&quot;</span><span class="p">)));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">trim</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">entries</span><span class="p">);</span>
<span class="w">    </span><span class="fm">assert_eq!</span><span class="p">(</span><span class="n">entries</span><span class="p">.</span><span class="n">len</span><span class="p">(),</span><span class="w"> </span><span class="n">MAX_ENTRIES</span><span class="p">);</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="n">entries</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">Kind</span><span class="p">::</span><span class="n">Preference</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


测试名里写着 <code>oldest</code>，断言里却只有「偏好还在」。这是一个很典型的测试盲区：测试名描述了意图，断言只验证了其中一半。如果补一句「最后一条 <code>Lesson</code> 仍然存在」，这个偏差当场就会暴露。

把这件事写进文章，不是为了挑刺，而是想说明一个工程事实：注释、测试名、实现三者不一致，是长期记忆这种「低频、难观察」的模块最容易积累的债务。记忆淘汰错了，用户不会收到报错，只会觉得「它怎么又忘了」。
<h2>检索：为什么是 BM25 而不是余弦相似度</h2>

BM25 是信息检索里的经典打分函数，本质是「词频 × 逆文档频率 × 长度归一化」。它不产生向量，只比较词是否重叠、重叠多少次、这个词有多稀有。
<div class="table-scroll"><table>
<thead>
<tr>
<th>特性</th>
<th>对记忆检索的意义</th>
</tr>
</thead>
<tbody>
<tr>
<td>词袋匹配</td>
<td>查询和记忆必须有共同词，结果可解释</td>
</tr>
<tr>
<td>IDF 加权</td>
<td>「的」「是」这类高频词几乎不加分，罕见词权重高</td>
</tr>
<tr>
<td>长度归一化</td>
<td>长记忆不会因为词多就天然占优</td>
</tr>
<tr>
<td>无训练</td>
<td>新增记忆立即生效，不需要重建索引</td>
</tr>
<tr>
<td>确定性</td>
<td>同样的库和查询，分数完全一致，方便写测试</td>
</tr>
</tbody>
</table></div>

不足也明确：没有共同词就是零分，同义改写、跨语言、代词指代全部接不住。所以 <code>search</code> 直接过滤掉零分条目，宁可返回空，也不返回一堆不相关的结果。

还有两个隐含行为：
<ol>
<li>没有时间衰减。一条三年前的偏好和昨天刚写的偏好，只要词频一样，得分就一样。<code>ts</code> 只用于去重刷新和淘汰排序，不参与打分。</li>
<li>没有类别权重。<code>Preference</code> 不会因为「更重要」而加分，类别只通过标签词进入索引。</li>
</ol>

这两点在几百条规模下可以接受：库里大部分是近期写的内容，时间衰减的收益不明显；类别权重则可能引入新的调参负担。
<h2>分词：英文按词，中文按二元</h2>

BM25 的前提是「词」。英文有空格，中文没有，所以 <code>tokenize</code> 用了两套规则：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">flush_word</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">|</span><span class="n">buf</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">out</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">buf</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">out</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">buf</span><span class="p">.</span><span class="n">to_lowercase</span><span class="p">());</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">buf</span><span class="p">.</span><span class="n">clear</span><span class="p">();</span>
<span class="p">};</span>
<span class="kd">let</span><span class="w"> </span><span class="n">flush_cjk</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">|</span><span class="n">cjk</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">out</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">chars</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="kt">char</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cjk</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">chars</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">out</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">chars</span><span class="p">[</span><span class="mi">0</span><span class="p">].</span><span class="n">to_string</span><span class="p">());</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">for</span><span class="w"> </span><span class="n">w</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">chars</span><span class="p">.</span><span class="n">windows</span><span class="p">(</span><span class="mi">2</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">out</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">w</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">collect</span><span class="p">());</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">cjk</span><span class="p">.</span><span class="n">clear</span><span class="p">();</span>
<span class="p">};</span>
</code></pre></div>

<div class="table-scroll"><table>
<thead>
<tr>
<th>输入片段</th>
<th>输出 token</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>NanoHermes</code></td>
<td><code>nanohermes</code></td>
</tr>
<tr>
<td><code>Vite</code></td>
<td><code>vite</code></td>
</tr>
<tr>
<td><code>a</code></td>
<td>丢弃（ASCII 单词少于 2 字符）</td>
</tr>
<tr>
<td><code>120_000</code></td>
<td><code>120</code>、<code>000</code>（下划线是分隔符）</td>
</tr>
<tr>
<td><code>前端用</code></td>
<td><code>前端</code>、<code>端用</code></td>
</tr>
<tr>
<td><code>构建</code></td>
<td><code>构建</code></td>
</tr>
<tr>
<td><code>好</code></td>
<td><code>好</code>（单字段落保留单字）</td>
</tr>
</tbody>
</table></div>

规则总结：
<ol>
<li>ASCII 字母数字连续段做小写单词，少于 2 个字符直接丢掉。</li>
<li>CJK 连续段做二元切分：n 个字产生 n-1 个 token；只有一个字时保留这个单字。</li>
<li>其他字符（空格、标点、下划线、符号）都是分隔符，同时冲刷两边的缓冲区。</li>
</ol>

二元切分的好处是「不需要词典」：任何中文串都能切，生僻词、专有名词、代码里的中文注释都不怕。坏处是会产生跨词的假 token，也会让单字查询变得很弱。
<h2>二元切分的假阳性</h2>

以「前端用 Vite 构建」为例，CJK 段「前端用」被切成「前端」和「端用」。「端用」不是词，但它会进入索引，也会进入查询。后果有两类：
<div class="table-scroll"><table>
<thead>
<tr>
<th>现象</th>
<th>例子</th>
<th>影响</th>
</tr>
</thead>
<tbody>
<tr>
<td>跨词假 token</td>
<td>「前端用」产生「端用」</td>
<td>查询「端用」会误命中这段文本，但这种查询几乎不存在</td>
</tr>
<tr>
<td>单字噪音</td>
<td>「好」保留为单字</td>
<td>查询含「好」时，所有含「好」的记忆都得分</td>
</tr>
<tr>
<td>同义不匹配</td>
<td>记忆写「上线」，查询写「部署」</td>
<td>零分，检索不到</td>
</tr>
<tr>
<td>语序不敏感</td>
<td>「A 调用 B」与「B 调用 A」token 相同</td>
<td>方向关系丢失，可能召回错误经验</td>
</tr>
</tbody>
</table></div>

真正影响体验的是后两类：同义不匹配和语序丢失。第一类假 token 大多无害，因为没人会去搜「端用」。

缓解手段不在检索器，而在写入侧：
<ol>
<li>写记忆时把关键同义词一起写进去：「上线（部署）前先跑 dry-run」。</li>
<li>尽量写具体名词和路径，而不是代词：「发布脚本」而不是「那个脚本」。</li>
<li>一条记忆只讲一件事，避免长句里塞多个主语，降低语序歧义。</li>
</ol>

这也解释了一个看似奇怪的设计选择：<code>MAX_TEXT</code> 是 400 字，但提示词要求 200 字。短句更容易被检索，也更不容易在注入时挤占预算。
<h2>类别词也进索引：查「偏好」能直接命中</h2>

构建文档词频时，除了正文，还会把类别标签和英文类别名加进去：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">docs</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">entries</span>
<span class="w">    </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">e</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tokenize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">.</span><span class="n">text</span><span class="p">);</span>
<span class="w">        </span><span class="c1">// 类别词也参与匹配：「偏好」「纠正」这样的查询能直接命中对应条目。</span>
<span class="w">        </span><span class="n">t</span><span class="p">.</span><span class="n">extend</span><span class="p">(</span><span class="n">tokenize</span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">label</span><span class="p">()));</span>
<span class="w">        </span><span class="n">t</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">as_str</span><span class="p">().</span><span class="n">to_string</span><span class="p">());</span>
<span class="w">        </span><span class="n">t</span>
<span class="w">    </span><span class="p">})</span>
<span class="w">    </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
</code></pre></div>


于是三种查询都能工作：
<div class="table-scroll"><table>
<thead>
<tr>
<th>查询</th>
<th>命中的内容</th>
</tr>
</thead>
<tbody>
<tr>
<td>「部署流程」</td>
<td>正文含「部署」的记忆</td>
</tr>
<tr>
<td>「偏好」</td>
<td>所有 <code>Preference</code> 条目（标签词「偏好」匹配）</td>
</tr>
<tr>
<td>「preference」</td>
<td>所有 <code>Preference</code> 条目（英文类别名匹配）</td>
</tr>
</tbody>
</table></div>

这相当于给记忆加了一个免费的「类型过滤器」，用户或模型不用记 slug，直接用中文类别词就能翻出某一类。

副作用是类别词会抬高该类条目的长度和词频。<code>df</code> 是在包含标签词的文档集合上统计的，所以「偏好」这个词的 <code>df</code> 等于偏好类条目数，IDF 会相应降低；这是合理的——类别词本来就应该比具体名词更常见、更不值钱。
<h2>BM25 公式：五个变量与一次排序</h2>

核心只有两行：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">idf</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="mf">1.0</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="p">(</span><span class="n">n</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">n_q</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">0.5</span><span class="p">)</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="p">(</span><span class="n">n_q</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">0.5</span><span class="p">)).</span><span class="n">ln</span><span class="p">();</span>
<span class="n">score</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">idf</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="n">f</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="n">k1</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mf">1.0</span><span class="p">))</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="p">(</span><span class="n">f</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">k1</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="p">(</span><span class="mf">1.0</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">len</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">avg_len</span><span class="p">.</span><span class="n">max</span><span class="p">(</span><span class="mf">1.0</span><span class="p">)));</span>
</code></pre></div>

<div class="table-scroll"><table>
<thead>
<tr>
<th>符号</th>
<th>含义</th>
<th>取值/来源</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>n</code></td>
<td>记忆总条数</td>
<td><code>docs.len()</code></td>
</tr>
<tr>
<td><code>n_q</code></td>
<td>含该词的条数（文档频率）</td>
<td>遍历 docs 统计</td>
</tr>
<tr>
<td><code>f</code></td>
<td>该词在当前条目中的词频</td>
<td>逐条统计</td>
</tr>
<tr>
<td><code>len</code></td>
<td>当前条目的 token 数（含类别词）</td>
<td><code>d.len()</code></td>
</tr>
<tr>
<td><code>avg_len</code></td>
<td>所有条目的平均 token 数</td>
<td>总和除以 n</td>
</tr>
<tr>
<td><code>k1</code></td>
<td>词频饱和系数</td>
<td>1.2</td>
</tr>
<tr>
<td><code>b</code></td>
<td>长度归一化强度</td>
<td>0.75</td>
</tr>
</tbody>
</table></div>

三个部分的作用：
<ol>
<li>IDF：一个词越稀有，命中它越有区分度。「部署」比「的」值钱。</li>
<li>词频饱和：<code>f</code> 从 1 涨到 10 时分数涨得快，从 10 涨到 100 时几乎不涨，避免一条记忆靠重复关键词刷分。</li>
<li>长度归一化：<code>b = 0.75</code> 表示「长度影响占七成五」，长文档需要更高的词频才能拿到同样分数。</li>
</ol>

算完之后过滤零分、按分数降序、截断到 <code>top_k</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">ranked</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="p">(</span><span class="kt">f64</span><span class="p">,</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">scores</span>
<span class="w">    </span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">enumerate</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">_</span><span class="p">,</span><span class="w"> </span><span class="n">s</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="o">*</span><span class="n">s</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mf">0.0</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">s</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="p">(</span><span class="n">s</span><span class="p">,</span><span class="w"> </span><span class="n">i</span><span class="p">))</span>
<span class="w">    </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="n">ranked</span><span class="p">.</span><span class="n">sort_by</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="p">,</span><span class="w"> </span><span class="n">b</span><span class="o">|</span><span class="w"> </span><span class="n">b</span><span class="p">.</span><span class="mf">0.</span><span class="n">partial_cmp</span><span class="p">(</span><span class="o">&amp;</span><span class="n">a</span><span class="p">.</span><span class="mi">0</span><span class="p">).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="n">std</span><span class="p">::</span><span class="n">cmp</span><span class="p">::</span><span class="n">Ordering</span><span class="p">::</span><span class="n">Equal</span><span class="p">));</span>
<span class="n">ranked</span><span class="p">.</span><span class="n">truncate</span><span class="p">(</span><span class="n">top_k</span><span class="p">);</span>
</code></pre></div>


复杂度是 O(条目数 × 查询词数)，500 条约等于几千次哈希查找，每轮一次，完全不需要倒排索引。这也是「不接向量库」在工程上成立的根本原因：规模小到可以暴力。
<h2>Top-K 与字符预算：4 条、2400 字符</h2>

注入侧有两个限制：条数和字符数。<code>retrieve_block</code> 先取前 4 条，再交给 <code>render_block</code> 排版：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">retrieve_block</span><span class="p">(</span><span class="n">dir</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">,</span><span class="w"> </span><span class="n">query</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">entries</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">load</span><span class="p">(</span><span class="n">dir</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">hits</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">search</span><span class="p">(</span><span class="o">&amp;</span><span class="n">entries</span><span class="p">,</span><span class="w"> </span><span class="n">query</span><span class="p">,</span><span class="w"> </span><span class="n">INJECT_TOP_K</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">picked</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;&amp;</span><span class="n">Entry</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">hits</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="p">(</span><span class="n">_</span><span class="p">,</span><span class="w"> </span><span class="n">i</span><span class="p">)</span><span class="o">|</span><span class="w"> </span><span class="o">&amp;</span><span class="n">entries</span><span class="p">[</span><span class="o">*</span><span class="n">i</span><span class="p">]).</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="n">render_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">picked</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


<code>render_block</code> 逐条累加，超过预算就停止：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">line</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;</span><span class="se">\n</span><span class="s">- [{}] {}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">label</span><span class="p">(),</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">text</span><span class="p">);</span>
<span class="k">if</span><span class="w"> </span><span class="n">used</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">line</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">INJECT_CHAR_BUDGET</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">break</span><span class="p">;</span>
<span class="p">}</span>
<span class="n">used</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">line</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">();</span>
<span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="n">line</span><span class="p">);</span>
</code></pre></div>


算一笔账：
<div class="table-scroll"><table>
<thead>
<tr>
<th>条目</th>
<th>每条最大长度</th>
<th>累计</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>400 字正文 + 约 10 字前缀</td>
<td>约 410</td>
</tr>
<tr>
<td>2</td>
<td>同上</td>
<td>约 820</td>
</tr>
<tr>
<td>3</td>
<td>同上</td>
<td>约 1,230</td>
</tr>
<tr>
<td>4</td>
<td>同上</td>
<td>约 1,640</td>
</tr>
</tbody>
</table></div>

四条满长记忆也只有 1,640 字符，离 2,400 还有 760 的余量。所以预算通常不会先触发，<code>top_k = 4</code> 才是实际约束。预算真正起作用的情况是：标签文本变长、未来引入更长的类别名、或者在 <code>render_block</code> 里加了额外的说明行。

顺序也有影响：命中按分数降序排列，预算一旦不够，被丢掉的一定是分数最低的那条，而不是随机一条。这保证「最相关的先注入」。
<h2>注入：一对标记与整体替换</h2>

注入块用一对固定标记包起来：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">BLOCK_START</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;=== Long-term memory (retrieved from past sessions) ===&quot;</span><span class="p">;</span>
<span class="k">pub</span><span class="w"> </span><span class="k">const</span><span class="w"> </span><span class="n">BLOCK_END</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;=== End long-term memory ===&quot;</span><span class="p">;</span>
</code></pre></div>


渲染出来的样子是：
<div class="codehilite"><pre><span></span><code><span class="o">===</span><span class="w"> </span><span class="nv">Long</span><span class="o">-</span><span class="nv">term</span><span class="w"> </span><span class="nv">memory</span><span class="w"> </span><span class="ss">(</span><span class="nv">retrieved</span><span class="w"> </span><span class="nv">from</span><span class="w"> </span><span class="nv">past</span><span class="w"> </span><span class="nv">sessions</span><span class="ss">)</span><span class="w"> </span><span class="o">===</span>
以下是从过往会话中检索到的相关记忆（由对话自动提炼，仅供参考；用户当前指令优先）：

<span class="o">-</span><span class="w"> </span>[偏好]<span class="w"> </span>回复使用中文，代码注释也用中文
<span class="o">-</span><span class="w"> </span>[纠正]<span class="w"> </span>部署脚本默认先<span class="w"> </span><span class="nv">dry</span><span class="o">-</span><span class="nv">run</span>，确认后再执行
<span class="o">-</span><span class="w"> </span>[经验]<span class="w"> </span><span class="nv">WSL</span><span class="w"> </span>里<span class="w"> </span><span class="nv">git</span><span class="w"> </span><span class="nv">push</span><span class="w"> </span>会缺凭据管理器，改用<span class="w"> </span><span class="nv">PowerShell</span>
<span class="o">-</span><span class="w"> </span>[事实]<span class="w"> </span>前端用<span class="w"> </span><span class="nv">Vite</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="nv">React</span>，后端<span class="w"> </span><span class="nv">Django</span>

<span class="o">===</span><span class="w"> </span><span class="k">End</span><span class="w"> </span><span class="nv">long</span><span class="o">-</span><span class="nv">term</span><span class="w"> </span><span class="nv">memory</span><span class="w"> </span><span class="o">===</span>
</code></pre></div>


替换逻辑是「先删旧块，再追加新块」：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">set_block</span><span class="p">(</span><span class="n">system</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">block</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">base</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">system</span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">start</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">base</span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="n">BLOCK_START</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">base</span><span class="p">[</span><span class="n">start</span><span class="o">..</span><span class="p">]</span>
<span class="w">            </span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="n">BLOCK_END</span><span class="p">)</span>
<span class="w">            </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">i</span><span class="o">|</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">BLOCK_END</span><span class="p">.</span><span class="n">len</span><span class="p">())</span>
<span class="w">            </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="n">base</span><span class="p">.</span><span class="n">len</span><span class="p">());</span>
<span class="w">        </span><span class="n">base</span><span class="p">.</span><span class="n">replace_range</span><span class="p">(</span><span class="n">start</span><span class="o">..</span><span class="n">end</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">base</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">base</span><span class="p">.</span><span class="n">trim_end</span><span class="p">().</span><span class="n">to_string</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">block</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">base</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">base</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">block</span><span class="p">.</span><span class="n">to_string</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{base}</span><span class="se">\n\n</span><span class="s">{block}&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


两个关键点：
<ol>
<li>整体替换，不是追加。每轮都先删旧块，所以块不会随着轮次线性增长。</li>
<li>新块为空时删除旧块。这一条常被忽略：如果本轮查询没有命中任何记忆，上一轮的注入块会被清掉，而不是继续留在系统提示词里。</li>
</ol>

第二点是有意的：记忆应该跟着当前任务走，而不是永久占位。但它的副作用是——如果用户这轮只说了「继续」，检索不到任何东西，记忆块就消失了。

注入块放在系统提示词末尾，属于「稳定前缀」的尾部。02 讲过前缀缓存：系统提示词越靠前越稳定，缓存命中率越高。把每轮都会变的记忆块放在最后，改动只影响尾部，不会让整段前缀失效。这是两个模块之间一个没有写在注释里、但很重要的配合。
<h2>每轮重检索：用当前这句话当查询</h2>

<code>Agent::run</code> 的开头，先取当前用户消息的纯文本，再检索、再注入：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">user_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">content_text</span><span class="p">(</span><span class="o">&amp;</span><span class="n">content</span><span class="p">);</span>
<span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">dir</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">memory_dir</span><span class="p">.</span><span class="n">clone</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">block</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">memory</span><span class="p">::</span><span class="n">retrieve_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">user_text</span><span class="p">);</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">set_memory_block</span><span class="p">(</span><span class="o">&amp;</span><span class="n">block</span><span class="p">);</span>
<span class="p">}</span>
<span class="bp">self</span><span class="p">.</span><span class="n">messages</span>
<span class="w">    </span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">content</span><span class="w"> </span><span class="p">}));</span>
</code></pre></div>


注意执行顺序：检索发生在用户消息入队之前，所以查询里不包含本轮消息本身，也不包含之前的对话。查询就是这一句话。

这样做的好处是「意图对齐」：用户这轮说「部署脚本怎么改」，就检索部署相关的记忆；下一轮说「前端样式」，就换成前端相关的记忆。坏处是「短指令失忆」：
<div class="table-scroll"><table>
<thead>
<tr>
<th>用户消息</th>
<th>查询 token</th>
<th>可能结果</th>
</tr>
</thead>
<tbody>
<tr>
<td>「部署脚本怎么改」</td>
<td>部署 / 署脚 / 脚本 / 怎么 / 么改</td>
<td>命中部署相关记忆</td>
</tr>
<tr>
<td>「前端样式再调一下」</td>
<td>前端 / 端样 / 样式 / 再调 / 调一 / 一下</td>
<td>命中前端偏好</td>
</tr>
<tr>
<td>「继续」</td>
<td>继续</td>
<td>很可能零命中，注入块被清空</td>
</tr>
<tr>
<td>「好的，就按这个来」</td>
<td>好的 / 的就 / 就按 / 按这 / 这个 / 个来</td>
<td>很可能零命中</td>
</tr>
</tbody>
</table></div>

于是出现一个体验落差：用户认真描述需求时，Agent 记得他的偏好；用户说「继续」时，Agent 反而把记忆丢了。这不是 bug，而是「用当前消息做查询」这个设计的直接后果。

如果要修，有两个方向：
<ol>
<li>查询拼接最近几条用户消息，而不只是当前这条。代价是相关性被稀释，旧话题会污染新话题。</li>
<li>短消息（比如少于 8 个字符）时沿用上一轮的注入块，不做替换。代价是需要额外的状态，且可能把过时记忆留在窗口里。</li>
</ol>

NanoHermes 选择了最简单的版本：每轮独立检索，零命中就清空。对「一次说清需求」的使用习惯来说，这个取舍是成立的。
<h2>记忆与上下文压缩如何共存</h2>

02 讲过压缩：超过 120,000 字符时，保留最近 10 条，把更早的消息换成一条摘要，插在 <code>messages[1]</code>。记忆块住在 <code>messages[0]</code> 的系统消息里，两条链路互不干扰：
<div class="table-scroll"><table>
<thead>
<tr>
<th>动作</th>
<th>动谁</th>
<th>会不会动记忆块</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>compact_with</code></td>
<td><code>messages[1..start]</code></td>
<td>不会，索引 0 永远保留</td>
</tr>
<tr>
<td><code>set_memory_block</code></td>
<td><code>messages[0].content</code></td>
<td>只替换块本身</td>
</tr>
<tr>
<td><code>refresh_system</code></td>
<td>重建 <code>messages[0]</code></td>
<td>会丢掉旧块，下一轮重新检索</td>
</tr>
<tr>
<td><code>reset</code></td>
<td>重建整个 <code>messages</code></td>
<td>会丢掉旧块，但 <code>memory.json</code> 不变</td>
</tr>
<tr>
<td><code>persist</code></td>
<td>写会话文件</td>
<td>会把当前块一起写进文件</td>
</tr>
</tbody>
</table></div>

有两个细节值得记：
<ol>
<li>压缩产生的摘要插在索引 1，而记忆块在索引 0 的正文里。两者不会互相覆盖，因为 <code>set_block</code> 只认 <code>BLOCK_START</code> 和 <code>BLOCK_END</code> 之间的内容。</li>
<li>会话恢复时，<code>refresh_system</code> 会用当前配置重建系统提示词，旧块被丢弃；第一轮对话开始时重新检索。这保证恢复出来的会话不会带着上一个环境的记忆。</li>
</ol>

换句话说：记忆是「每轮重新取用的外部资料」，压缩是「本轮历史的内部整理」。一个在系统消息里，一个在消息数组的中段，生命周期完全不同。
<h2>失败语义：三条静默降级与一条隐患</h2>

记忆模块的每个失败点都做了处理，但处理方式不一样：
<div class="table-scroll"><table>
<thead>
<tr>
<th>失败点</th>
<th>处理</th>
<th>用户能感知吗</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>memory.json</code> 不存在</td>
<td>返回空列表</td>
<td>不能，等同于「还没有记忆」</td>
</tr>
<tr>
<td><code>memory.json</code> 损坏</td>
<td>返回空列表</td>
<td>不能，所有旧记忆静默消失</td>
</tr>
<tr>
<td>写入磁盘失败</td>
<td>工具调用返回 <code>ERROR</code>，自动提炼忽略</td>
<td>主动写入能感知，自动提炼不能</td>
</tr>
<tr>
<td>提炼模型调用失败</td>
<td>直接返回，不写任何东西</td>
<td>不能</td>
</tr>
<tr>
<td>提炼输出不是 JSON</td>
<td>解析为空列表</td>
<td>不能</td>
</tr>
<tr>
<td>注入时没有命中</td>
<td>删除旧块</td>
<td>不能</td>
</tr>
</tbody>
</table></div>

这套设计的总体原则是「记忆永远不阻塞主流程」，方向是对的。但「损坏即空」这一条留下了一个隐患：
<ol>
<li><code>load</code> 发现 JSON 坏了，返回空列表。</li>
<li>下一轮提炼成功，<code>remember</code> 在空列表上追加一条。</li>
<li><code>save</code> 整文件覆盖，原来的损坏内容被彻底替换。</li>
<li>用户失去全部旧记忆，而且没有任何提示。</li>
</ol>

更稳妥的做法是：<code>load</code> 解析失败时先把原文件重命名为 <code>memory.json.broken</code>，再返回空列表；或者 <code>save</code> 走临时文件加 <code>rename</code> 的原子写入，避免产生半截文件。两者都不改变正常路径的行为，只把「静默清零」变成「保留证据」。

主动写入的失败是可见的：<code>save_tool</code> 把 <code>remember</code> 的错误原样返回，模型会看到 <code>ERROR</code>，可以决定重试或告诉用户。自动提炼则用 <code>unwrap_or(false)</code> 吞掉错误，因为它在轮次结束后运行，没有交互机会。
<h2>并发写入：没有锁的 read-modify-write</h2>

整个存储层没有文件锁，每次写入都是「读全量 → 改内存 → 写全量」：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">entries</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">load</span><span class="p">(</span><span class="n">dir</span><span class="p">);</span>
<span class="c1">// ... 查重或追加 ...</span>
<span class="n">save</span><span class="p">(</span><span class="n">dir</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">entries</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


单线程下没问题。但 <code>Agent::run</code> 会把同一轮里的多个工具调用放到独立线程里并发执行：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">this</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Agent</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">;</span>
<span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">scope</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span>
<span class="w">        </span><span class="p">.</span><span class="n">tool_calls</span>
<span class="w">        </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">});</span>
</code></pre></div>


如果模型在一轮里同时调用两次 <code>memory_save</code>，两个线程会各自 <code>load</code> 到同一份旧列表，各自追加一条，再先后 <code>save</code>。后写的那次覆盖先写的那次，结果是只留下一条记忆。

同样的问题也会出现在 daemon 模式：多个会话共享同一个 <code>memory_dir</code>，各自的轮次结束后都会自动提炼，写入时间重叠就会丢更新。
<div class="table-scroll"><table>
<thead>
<tr>
<th>场景</th>
<th>是否可能并发写</th>
<th>后果</th>
</tr>
</thead>
<tbody>
<tr>
<td>单轮单个工具调用</td>
<td>否</td>
<td>安全</td>
</tr>
<tr>
<td>单轮多个 <code>memory_save</code></td>
<td>是</td>
<td>后写覆盖先写，丢一条</td>
</tr>
<tr>
<td>多个会话同时结束轮次</td>
<td>是</td>
<td>同上</td>
</tr>
<tr>
<td>主动写入与自动提炼重叠</td>
<td>是</td>
<td>同上</td>
</tr>
</tbody>
</table></div>

彻底修需要跨进程文件锁，成本不低。轻量一点的方案是「追加日志」：每次写入往文件末尾追加一行 JSON，读取时按序合并去重，避免整文件覆盖。NanoHermes 目前选了最简单的整文件方案，在「模型很少并行写记忆」的假设下可以接受，但这个假设并没有在代码里强制。
<h2>子代理与多会话：工具共享，注入不共享</h2>

子代理有自己的循环，系统提示词是配置里写死的 <code>def.prompt</code>，不经过 <code>Agent::run</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">messages</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">vec!</span><span class="p">[</span>
<span class="w">    </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;system&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">def</span><span class="p">.</span><span class="n">prompt</span><span class="w"> </span><span class="p">}),</span>
<span class="w">    </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">task</span><span class="w"> </span><span class="p">}),</span>
<span class="p">];</span>
</code></pre></div>


所以子代理不会检索记忆，也不会在结束时提炼记忆。但它的工具调用走的是父代理的 <code>self.execute</code>，共享同一个 <code>Ctx</code>，因此 <code>memory_save</code> 和 <code>memory_search</code> 仍然可用，写入的也是同一个库。
<div class="table-scroll"><table>
<thead>
<tr>
<th>能力</th>
<th>主代理</th>
<th>子代理</th>
</tr>
</thead>
<tbody>
<tr>
<td>每轮检索并注入记忆</td>
<td>是</td>
<td>否（系统提示词固定）</td>
</tr>
<tr>
<td>轮次结束自动提炼</td>
<td>是</td>
<td>否（用的是自己的循环）</td>
</tr>
<tr>
<td>调用 <code>memory_save</code> / <code>memory_search</code></td>
<td>是</td>
<td>是（共享 <code>Ctx</code>）</td>
</tr>
<tr>
<td>写入同一个 <code>memory.json</code></td>
<td>是</td>
<td>是</td>
</tr>
</tbody>
</table></div>

这个设计有利有弊：好处是子代理可以主动查记忆、写记忆，不用把记忆块塞进它有限的上下文；坏处是子代理不知道用户的长期偏好，除非父代理在任务描述里显式带上。

daemon 模式的隔离则是另一层：每个会话 id 对应一个独立的消息数组，通过 <code>replace_messages</code> 切换。记忆库不按会话隔离，所有会话共享。这符合「长期记忆是用户的，不是会话的」这个直觉，但也意味着一个会话写进去的临时教训，会出现在另一个会话的检索结果里。
<h2>关闭记忆之后会发生什么</h2>

配置里 <code>memory</code> 默认是 <code>true</code>。关掉之后，<code>Ctx.memory_dir</code> 被置为 <code>None</code>：
<div class="codehilite"><pre><span></span><code><span class="n">memory_dir</span><span class="p">:</span><span class="w"> </span><span class="nc">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">memory</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">cfg</span><span class="p">.</span><span class="n">memory_dir</span><span class="p">.</span><span class="n">clone</span><span class="p">().</span><span class="n">or_else</span><span class="p">(</span><span class="n">memory</span><span class="p">::</span><span class="n">default_dir</span><span class="p">)</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">None</span>
<span class="p">},</span>
</code></pre></div>


于是三件事同时发生：
<div class="table-scroll"><table>
<thead>
<tr>
<th>行为</th>
<th>关闭后的表现</th>
</tr>
</thead>
<tbody>
<tr>
<td>每轮检索注入</td>
<td><code>Agent::run</code> 里的 <code>if let Some(dir)</code> 不成立，跳过</td>
</tr>
<tr>
<td>轮次结束提炼</td>
<td><code>completed &amp;&amp; self.cfg.memory</code> 不成立，跳过</td>
</tr>
<tr>
<td>记忆工具</td>
<td>仍然出现在工具列表里，调用返回 <code>long-term memory is disabled (settings)</code></td>
</tr>
</tbody>
</table></div>

第三点是一个不对称：工具声明没有按 <code>memory_dir</code> 过滤，<code>build_tools</code> 只按权限模式过滤。模型可能看到一个可用工具，调用后却收到错误。更一致的做法是在关闭记忆时把两个工具从列表里去掉，避免模型浪费一次调用。

这个不对称也解释了为什么关闭记忆不会删除任何数据：<code>memory.json</code> 原封不动，重新打开后旧记忆立刻恢复。开关控制的是「读写行为」，不是「存储生命周期」。
<h2>九个单元测试在守什么</h2>

<code>memory.rs</code> 自带九个测试，全部是纯函数或临时目录，不依赖网络和模型：
<div class="table-scroll"><table>
<thead>
<tr>
<th>测试</th>
<th>守住的约束</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>tokenize_handles_cjk_bigrams_and_ascii_words</code></td>
<td>英文小写成词、中文二元切分</td>
</tr>
<tr>
<td><code>round_trips_through_the_store_and_dedupes</code></td>
<td>写入、读回、标点差异去重、包含去重</td>
</tr>
<tr>
<td><code>trims_oldest_lessons_before_touching_preferences</code></td>
<td>满 500 条时偏好不被淘汰</td>
</tr>
<tr>
<td><code>bm25_ranks_relevant_entries_first</code></td>
<td>相关条目排第一、无关条目不出现</td>
</tr>
<tr>
<td><code>block_round_trip_replaces_instead_of_accumulating</code></td>
<td>注入块替换而不是累加、空块删除旧块</td>
</tr>
<tr>
<td><code>parses_distill_output_tolerantly</code></td>
<td>围栏、废话、对象包装、未知类别、空输出</td>
</tr>
<tr>
<td><code>distill_gate_skips_small_talk_but_keeps_corrections</code></td>
<td>寒暄跳过、纠正放行、工具轮次放行</td>
</tr>
<tr>
<td><code>tools_save_and_search_work_against_a_store</code></td>
<td>主动写入、重复提示、检索命中、空结果</td>
</tr>
<tr>
<td><code>excerpt_skips_system_and_images</code></td>
<td>跳过系统消息与图片、保留文本</td>
</tr>
</tbody>
</table></div>

覆盖的空白也很清楚：
<ol>
<li>没有测试淘汰顺序（这正是上一节那个偏差没被发现的原因）。</li>
<li>没有测试并发写入。</li>
<li>没有测试损坏文件的处理路径。</li>
<li>没有测试摘录只取开头导致的长对话盲区。</li>
</ol>

这四条都不是「写不出测试」，而是「没人想到会坏」。对一个低频、静默、跨会话的模块来说，这恰恰是最该补的四类测试。

顺带说一个可测试性上的优点：因为检索是纯函数，测试可以直接构造三条记忆、查一个词、断言第一条命中。如果换成向量检索，同样一条断言就要依赖模型版本和浮点误差，稳定性和可读性都会差很多。这是「不接向量库」在测试层面的隐形收益。
<h2>八个常见记忆陷阱</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>陷阱</th>
<th>表现</th>
<th>修法</th>
</tr>
</thead>
<tbody>
<tr>
<td>把记忆当聊天记录</td>
<td>每条用户消息都写进去，库里全是过程</td>
<td>只写跨会话成立的结论，过滤一次性状态</td>
</tr>
<tr>
<td>写「那个文件」</td>
<td>检索不到，注入也没用</td>
<td>写具体路径、命令、接口名</td>
</tr>
<tr>
<td>只写结论不写触发条件</td>
<td>「要小心」这种记忆无法执行</td>
<td>写成「做 X 之前先做 Y」</td>
</tr>
<tr>
<td>依赖同义词召回</td>
<td>记「上线」，查「部署」零命中</td>
<td>写入时带上同义表达</td>
</tr>
<tr>
<td>用「继续」追问</td>
<td>查询无命中，记忆块被清空</td>
<td>重要偏好提前写在任务描述里</td>
</tr>
<tr>
<td>以为写了就会注入</td>
<td>4 条上限 + 零分过滤 + 预算截断</td>
<td>把最关键的偏好写得短而具体</td>
</tr>
<tr>
<td>并发写记忆</td>
<td>后写覆盖先写，丢条目</td>
<td>避免一轮里多次 <code>memory_save</code>，或改用追加日志</td>
</tr>
<tr>
<td>文件损坏后继续写</td>
<td>旧记忆静默清零</td>
<td>备份损坏文件、原子写入</td>
</tr>
</tbody>
</table></div>

这八条里有三条属于「检索器解决不了、只能靠写入质量」的问题。这也是为什么本文花了很多篇幅讲提示词和摘录，而不是只讲 BM25：记忆系统的效果，七成取决于写进去什么，三成取决于怎么检索。
<h2>怎么验证你的记忆真的在工作</h2>

一套可操作的检查清单：
<div class="table-scroll"><table>
<thead>
<tr>
<th>步骤</th>
<th>命令/操作</th>
<th>预期</th>
</tr>
</thead>
<tbody>
<tr>
<td>看库</td>
<td>打开 <code>~/.nanohermes/memory.json</code></td>
<td>有 <code>entries</code> 数组，每条四个字段</td>
</tr>
<tr>
<td>看条数</td>
<td>数一下数组长度</td>
<td>不超过 500</td>
</tr>
<tr>
<td>看长度</td>
<td>检查每条 <code>text</code></td>
<td>不超过 400 字</td>
</tr>
<tr>
<td>写入</td>
<td>让 Agent 记住一个偏好</td>
<td>工具返回「已记下」，文件新增一条</td>
</tr>
<tr>
<td>重复写</td>
<td>同一句话再写一次</td>
<td>返回「与已有记忆重复，未新增」，条数不变</td>
</tr>
<tr>
<td>检索</td>
<td><code>memory_search</code> 查关键词</td>
<td>返回带分数的相关条目</td>
</tr>
<tr>
<td>注入</td>
<td>新开会话，说一句相关需求</td>
<td>会话文件的系统消息里出现 <code>BLOCK_START</code></td>
</tr>
<tr>
<td>零命中</td>
<td>说「继续」</td>
<td>注入块被删除，而不是保留旧内容</td>
</tr>
<tr>
<td>淘汰</td>
<td>临时把 <code>MAX_ENTRIES</code> 调小跑测试</td>
<td>偏好条目仍在，条数等于上限</td>
</tr>
<tr>
<td>损坏</td>
<td>把文件改成非法 JSON 再对话</td>
<td>对话不报错，但记忆为空（这是隐患，不是特性）</td>
</tr>
</tbody>
</table></div>

最后一行值得单独强调：它验证的是「容错」，同时也暴露了「静默清零」。如果你的项目不能接受这种静默，应该先改 <code>load</code> 的失败路径，再谈其他优化。
<h2>小结：记忆是索引，不是仓库</h2>

把这篇的结论压缩成四句话：
<ol>
<li>记忆的价值在检索，不在存储。存了 500 条但一条都用不上，不如存 20 条条条命中。</li>
<li>写入质量决定上限。类别、长度、自包含、跨会话成立，这四条比任何检索算法都重要。</li>
<li>上限必须存在。条数、单条长度、注入条数、注入字符，四个数字互相咬合，缺一个就会在某个场景下失控。</li>
<li>简单方案有明确边界。BM25 接不住同义词，整文件写入接不住并发，损坏即空接不住数据安全——知道边界在哪，比假装没有边界更重要。</li>
</ol>

NanoHermes 的记忆模块只有几百行，却把「跨会话记住偏好与教训」这件事跑通了。它不完美：摘录取开头、淘汰顺序有偏差、并发会丢更新、损坏会清零。但这些缺陷都是具体的、可定位的、可以逐个修掉的。相比之下，「上向量库」带来的复杂度是弥散的：模型版本、索引重建、隐私边界、离线可用性，每一项都要长期维护。

对个人项目和小团队来说，先用一个 JSON 文件加 BM25 把闭环跑起来，等记忆真的涨到几千条、同义词问题真的成为瓶颈，再考虑向量检索，通常是更划算的顺序。

下一篇进入《Agent 工具设计：为什么输出都要有上限》。记忆解决的是「跨会话记住什么」，工具解决的是「单轮里拿回多少」——两者最终都落在同一个预算问题上。</div></div></noscript>
