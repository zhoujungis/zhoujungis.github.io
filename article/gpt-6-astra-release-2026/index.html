    <noscript><div class="ns-article"><h1>GPT-6 Astra 发布：开发者需要知道的八件事</h1><div class="ns-meta">2026/9/4 · Zhou Jun</div><div class="markdown-body"><h1>GPT-6 Astra 发布：OpenAI 喊出“欢迎来到 AGI 时代”，开发者需要知道的八件事</h1>

<img alt="GPT-6 Astra 发布海报" src="https://images.ctfassets.net/kftzwdyauwt9/H9Mf4UPiWGb0N25sLJHUu/6d971b8e12cbab3db48c94617d703b5d/poster.webp?w=1920&amp;q=80&amp;fm=webp">
<blockquote>

<strong>发布时间：2026 年 9 月 3 日（美西）/ 9 月 4 日（北京时间）</strong>。OpenAI 总裁 Greg Brockman 在发布会结尾说出 <strong>“Welcome to the AGI era.”</strong> 本文基于 OpenAI 官方博文《GPT-6 Astra: A new generation of intelligence》、API 文档、System Card 以及 Bloomberg、量子位、The Decoder 等信源整理，数据截点为 2026-09-04。
</blockquote>
<hr>
<h2>先说结论：GPT-6 Astra 是什么</h2>

一句话：<strong>GPT-6 Astra 是 OpenAI 面向“完整任务交付”而非“单轮问答”的新一代旗舰模型，也是首个被 OpenAI 官方称为“最智能、最对齐（most intelligent and aligned）”并单方面宣布进入 AGI 时代的模型。</strong>
<table>
<thead>
<tr>
<th>维度</th>
<th>关键信息</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>定位</strong></td>
<td>取代 GPT-5.6 Sol 的旗舰，强调 Computer Use / Browser Use / 软件工程 / 网络安全 / 科学 / 专业办公六项全能</td>
</tr>
<tr>
<td><strong>发布时间</strong></td>
<td>2026-09-03 美西首发，限量企业客户即日可用；未来数日向 ChatGPT Plus / Pro / Business / Enterprise 全量开放</td>
</tr>
<tr>
<td><strong>API 名称</strong></td>
<td><code>gpt-6-astra</code>，同步上架 OpenAI API 与 AWS Bedrock，支持 Zero Data Retention（ZDR）</td>
</tr>
<tr>
<td><strong>上下文</strong></td>
<td>输入最高 922,000 tokens，输出最高 128,000 tokens，知识截点 2026-04-30</td>
</tr>
<tr>
<td><strong>定价（Standard）</strong></td>
<td>输入 $10 / 百万 tokens，输出 $50；缓存命中 $1，缓存写入 $12.5；&gt;272K 长输入按 2× 输入 / 1.5× 输出计费；Fast 模式 2×；Batch/Flex 5 折</td>
</tr>
<tr>
<td><strong>口号</strong></td>
<td>Welcome to the AGI era</td>
</tr>
</tbody>
</table>
<blockquote>

Astra 不是简单的“GPT-5.7”——OpenAI 在博文中明确称其集成了多年在 <strong>预训练、强化学习、对齐</strong> 上的“大赌注（big bets）”。但“AGI 时代”目前仍是 OpenAI 单方面的叙事，学术界与评测社区更关注可复现的基准。
</blockquote>
<hr>
<h2>一、为什么叫 Astra，和 GPT-5.6 Sol 是什么关系</h2>
<ul>
<li><strong>Sol → Astra</strong>：Sol（太阳）是 GPT-5.6 的代号，Astra（星群）被定位为下一代“能持续执行完整任务”的智能体。官方表述是：从“回答、生成、调工具”进化到“持续执行完整任务（continuously execute full tasks）”。</li>
<li><strong>不是 10 万亿参数神话</strong>：发布前 X 上曾流传“Astra 10 万亿参数”“代号 Doug 年底再发”等爆料，官方未证实任何参数规模，本文不采信。</li>
<li><strong>替代关系</strong>：GPT-6 Astra 在所有内部对比中均以 GPT-5.6 Sol 为基线（API 版 Sol），创业公司可在 API 中直接把 <code>gpt-5.6-sol</code> 替换为 <code>gpt-6-astra</code> 对比。</li>
</ul>
<hr>
<h2>二、能力新标杆：六个维度的 SOTA 在哪里</h2>

OpenAI 给出的对比表以 <strong>GPT-5.6 Sol / Claude Fable 5.1 / Claude Fable 5 / Claude Opus 5 / Gemini 3.8 Flash</strong> 为对照，以下摘录核心数据（<em>最高 effort 下的最大分，官方研究环境运行</em>）：
<h3>1. 电脑操作（Computer Use）——最大的跃进</h3>
<table>
<thead>
<tr>
<th>评测</th>
<th>GPT-6 Astra</th>
<th>GPT-5.6 Sol</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>OSWorld 2.0</strong> (offline subset)</td>
<td><strong>72.6%</strong></td>
<td>65.7%</td>
<td>离线网页+桌面操作，Astra 平均用时约 40 分钟 vs Sol 75 分钟，快 47%</td>
</tr>
<tr>
<td><strong>ScreenSpot-Pro</strong>（无工具）</td>
<td><strong>92.7%</strong></td>
<td>76.9%</td>
<td>纯视觉定位控件</td>
</tr>
<tr>
<td><strong>Agents' Last Exam</strong></td>
<td><strong>59.3%</strong></td>
<td>53.6%</td>
<td>财务建模、工程、媒体制作等真实软件任务</td>
</tr>
</tbody>
</table>

<strong>这意味着什么</strong>：填表、更新 CRM、排日历、做线上调研、分析科学数据并出图、搭网站并做前端 QA、自主安装调试软件——这些“脏活累活”现在是 Astra 的主战场。配合 Codex harness 1.9× 加速，在 Mind2Web 上体感更快。
<blockquote>

案例：OpenAI 演示了 15 秒浓缩回放——Astra 在 KiCad 中完成 PCB 布局，将电路原理图转为可制造的电路板；以及在 Blender 建模后导入 Unreal Engine 5 生成可行走场景。
</blockquote>
<h3>2. 专业办公（Professional Work）</h3>
<table>
<thead>
<tr>
<th>评测</th>
<th>Astra</th>
<th>Sol</th>
<th>亮点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>AutomationBench</strong></td>
<td><strong>41.4%</strong></td>
<td>18.1%</td>
<td>跨应用自动化</td>
</tr>
<tr>
<td><strong>BenchCAD</strong></td>
<td><strong>95.9%</strong></td>
<td>83.3%</td>
<td>多视图还原 3D CAD 代码</td>
</tr>
<tr>
<td><strong>Internal Design / Data Science</strong></td>
<td>50.0% / 40.9%</td>
<td>47.4% / 30.5%</td>
<td>模板遵循与图表提炼</td>
</tr>
</tbody>
</table>

能力点：<strong>模板对齐的幻灯片/文档/表格</strong>——给几张公司模板，Astra 能拉齐语气与版式，只提炼必要上下文，不再把所有历史信息都塞进输出。结合 ChatGPT 内的 <a href="https://learn.chatgpt.com/docs/sites?surface=app" rel="noopener noreferrer" target="_blank">Sites</a> 可直接从 prompt 建站并托管。
<h3>3. 编程（Coding）</h3>

<thead>
<tr>
<th>评测</th>

<th>Sol</th>
<th>Claude Fable 5.1</th>
<th>节选解读</th>
</tr>
</thead>

两处工程改进值得开发者关注：
<ol>
<li><strong>跨上下文记忆</strong>：Astra 在 Codex 中引入实验性的 <code>config.toml</code> 配置——用“笔记”替代“压缩摘要”来跨窗口保留上下文，旧窗口仍可检索，未捕获的失败原因不会丢失。数周后将成为默认。</li>
<li><strong>沟通更易跟随</strong>：Jane Street、Lovable 的早期评测均提到“更高 effort = 更多次全新构建+浏览器验证，代码更接近可合入质量”。</li>
</ol>
<h3>4. 科学、数学与健康</h3>

最出圈的是 <strong>两项素数间隔新证明</strong>（与 UIUC 的 Julia Stadlmann 合作）：
<ul>
<li><strong>短间隔</strong>：将“无穷多对素数间隔 ≤246”这一保持十多年的界，推进到 <strong>186</strong>；</li>
<li><strong>长间隔</strong>：改进了一个 80 余年未动的长间隔上界中的关键项。</li>
</ul>

两篇证明与删节版思维链已公开。这也是 Astra “在数学上既能解题也能助证”的例证。
<h3>5. 网络安全——首次触及 Critical 阈值</h3>

这是 Astra 最受争议也最受关注的部分。OpenAI 在 <a href="https://openai.com/index/path-to-astra/" rel="noopener noreferrer" target="_blank">Path to Astra</a> 中承认：<strong>Astra 在 Preparedness Framework 下达到 Cybersecurity 的 Critical 级别</strong>，即可在无防护条件下开发零日漏洞利用。

</tr>
<tr>

<strong>对攻防的双刃性</strong>：Astra 能帮防守方做代码审计、补丁生成，但在无防护研究配置下也能对加固浏览器实现任意代码执行、对加固操作系统提权。OpenAI 的策略是：
<ul>
<li>首发版本<strong>拒绝</strong>生成漏洞 PoC；</li>
<li>通过 <a href="https://openai.com/daybreak/" rel="noopener noreferrer" target="_blank">OpenAI Daybreak</a> 在未来数周向可信防守方开放更宽松的 PoC 验证、恶意软件分析等能力；</li>
<li>强化抗越狱与运行时监测。</li>
</ul>

<td><strong>4.2%</strong></td>
<td>12.2%</td>
<td>谎称自己能做什么</td>
</tr>
</tbody>
</table>

但 OpenAI 也坦诚两点退步：
<ul>
<li><strong>可监测性下降</strong>：Astra 的书面推理更难被监测模型捕捉，部分原因是它能用更少步骤解题；</li>
<li><strong>并非绝对对齐</strong>：对齐训练是核心，运行时监测（misalignment monitoring）只是兜底，额外检查会偶发暂停/打断合法任务。</li>
</ul>
<hr>
<h2>三、开发者最关心的 API 变化</h2>
<h3>定价与计费</h3>
<div class="codehilite"><pre><span></span><code>Text tokens（Standard）
  Input          $10 / 1M
  Cached input   $1  / 1M
  Cache writes   $12.5 / 1M
  Output         $50 / 1M

长上下文：输入 &gt;272K 时，全请求按 2× 输入/缓存价、1.5× 输出计费
Batch / Flex：5 折
Fast 模式：2× Standard 价格，速度最高 2×
</code></pre></div>

<blockquote>

对比：GPT-5.6 时代的输入/输出价即便未公开调整，Astra 的绝对单价不低。OpenAI 强调其 <strong>token 效率</strong>——在多数评测中 Astra 用更少输出 token 拿到更高分，部分任务成本反而比 Sol 低 20%–40%。
</blockquote>
<h3>上下文与推理</h3>
<ul>
<li><strong>922K 输入 / 128K 输出 / 2026-04-30 截点</strong>，<code>reasoning_effort</code> 分级可用（低/中/高 effort 对应不同迭代与验证深度）；</li>
<li><strong>100 万上下文实测</strong>：OpenAI MRCR v2 8-needle 256K–512K 达 100%，512K–1M 为 96.3%（Sol 分别为 91.5% / 73.8%）；</li>
<li><strong>抽象推理</strong>：ARC-AGI-3 达 <strong>99.9% [T7]</strong>（Sol 仅 7.8%），ARC-AGI-2 95.0%——官方说明使用了 Responses API 的两项设置以更贴近真实表现。</li>
</ul>
<h3>可用性与合规</h3>
<ul>
<li><strong>发布节奏</strong>：限量企业即日，数日后全量 Plus/Pro/Business/Enterprise；API 与 Bedrock 同步；</li>
<li><strong>额度</strong>：计入现有订阅额度，超出可购 credit；Pro/Business/Enterprise 额外获得 <strong>GPT-6 Astra Pro</strong>；</li>
<li><strong>企业管控</strong>：默认关闭，需管理员显式启用；</li>
<li><strong>隐私</strong>：合规 API 客户支持 ZDR，并试点 <strong>Private Safety Processing</strong>（在保留隐私前提下做安全监测）。</li>
</ul>
<hr>
<h2>四、价格与选型：现在该切到 Astra 吗</h2>
<table>
<thead>
<tr>
<th>场景</th>
<th>推荐</th>
<th>理由</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>需要电脑/浏览器自动化、长程办公流</strong></td>
<td><strong>直接上 Astra</strong></td>
<td>OSWorld、BenchCAD、AutomationBench 均领先一代，效率与对齐双提升</td>
</tr>
<tr>
<td><strong>重度代码与长程重构</strong></td>
<td><strong>Astra 优先，Claude Fable 5.1 作备选</strong></td>
<td>Terminal-Bench Astra 领先，但 Claude 在 Artificial Analysis Coding Agent Index 上仍有 67.2 vs 67.0 的微弱优势</td>
</tr>
<tr>
<td><strong>成本敏感的批量执行</strong></td>
<td><strong>评估后再切</strong></td>
<td>Astra 单价高；若任务可用小模型或缓存命中，DeepSeek/GLM/MiniMax 执行层仍更便宜，Astra 适合做规划与复核</td>
</tr>
<tr>
<td><strong>安全研究/红队</strong></td>

</tr>
</tbody>
</table>
<blockquote>

一句话选型观：<strong>Astra 买的是“一次做对”的能力与对齐，不是“每百万 token 最便宜”。</strong> 高价值、长链条、易出错的任务上 Astra 的综合成本可能更低；高吞吐、低推理的批量任务上，仍可用便宜模型做执行。
</blockquote>
<hr>
<h2>五、局限与冷思考：别被“AGI 时代”带偏</h2>
<ol>
<li><strong>AGI 的定义权之争</strong>：OpenAI 的“AGI 时代”是公司叙事，评测上 Astra 仍在 GPQA、Humanity's Last Exam（with tools 57.2% vs Claude Fable 5.1 的 65.0%）等项落后于竞品，通用性未一统江湖。</li>
<li><strong>网络安全双刃剑</strong>：100% ExploitBench 意味着攻防窗口被压缩，防守方必须更快打补丁。OpenAI 自己也说监测与拦截会误伤合法任务。</li>
<li><strong>可监测性倒退</strong>：思维链更短、更难审计——对需要强审计的金融、医疗场景是风险。</li>
<li><strong>价格与配额</strong>：272K 以上的长输入涨价、Fast 模式 2×，对超长文档工作流要算清账。</li>
<li><strong>幻觉未归零</strong>：能力幻觉从 12.2% 降至 4.2%，但仍非零，高风险决策仍需人审。</li>
</ol>
<hr>
<h2>六、给三类人的落地建议</h2>
<h3>普通用户（ChatGPT Plus/Pro）</h3>
<ul>
<li>先在 ChatGPT 中把“电脑操作”“网页浏览”类任务交给 Astra：订票、填表、整理相册、做简历网站，观察其“先问关键问题，再用合理假设推进”的协作风格；</li>
<li>涉及法律、财务的输出，利用其“区分已确立事实与未支撑假设”的特性，要求它标出不确定处。</li>
</ul>
<h3>开发者（API）</h3>
<ul>
<li><strong>迁移路径</strong>：把 <code>model: "gpt-6-astra"</code> 与 <code>reasoning_effort: medium/high</code> 组合测试，FrontierCode 提示词官方建议加上“避免无谓新建测试文件、复用工具、遵循仓库约定”等 developer message；</li>
<li><strong>长上下文</strong>：把 MRCR 作为健康检查，&gt;272K 时注意计费档位，利用缓存写入/命中降低重复 system prompt 成本；</li>
<li><strong>Codex 用户</strong>：在 <code>config.toml</code> 中开启跨窗口 notes 的实验开关，评估长会话召回率。</li>
</ul>
<h3>企业与团队</h3>
<ul>
<li>默认关闭是安全设计——先在沙盒工作区启用，配置 Auto-Review 与人工复核；</li>
<li>若需 PoC/漏洞验证能力，提前申请 Daybreak 白名单；</li>
<li>合规敏感客户评估 ZDR + Private Safety Processing 的组合。</li>
</ul>
<hr>
<h2>写在最后</h2>
<blockquote>

Astra 在英文化境里是“星”，在 OpenAI 的叙事里是“下一代智能的起点”。它确实在电脑操作、长上下文、数学与网络安全上把天花板抬高了一大截，也把“对齐”的底线抬高了——0% 蜜罐误触、0% 绕过审查、更少幻觉。
</blockquote>

但“欢迎来到 AGI 时代”更像一个路标，而非终点。正如 EpochAI 的 Greg Burnham 所言：“一个时代的结束，另一个时代的开始。”——<strong>Astra 结束的是“模型只负责回答”的时代，开启的是“模型负责把事做完”的时代。</strong> 能否真正把事做对、做得可审计、做得负担得起，还要在未来数月的真实工作流里验证。
