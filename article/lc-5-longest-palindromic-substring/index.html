    <noscript><div class="ns-article"><h1>【LC 5】最长回文子串：枚举中心 —— 2n-1 个中心，别漏了间隙</h1><div class="ns-meta">2026/9/29 · Zhou Jun</div><div class="markdown-body"><h2>题目</h2>

给你一个字符串 <code>s</code>，找到 <code>s</code> 中最长的回文子串。
<div class="codehilite"><pre><span></span><code>输入: s = &quot;babad&quot;
输出: &quot;bab&quot;    （&quot;aba&quot; 同样符合题意）

输入: s = &quot;cbbd&quot;
输出: &quot;bb&quot;
</code></pre></div>


回文串是正着读和反着读都一样的字符串。题面保证 <code>s</code> 至少含一个字符（最短答案就是单字符）。
<ul>
<li><a href="#section-1">一、核心洞察：枚举中心，不是枚举子串</a></li>
<li><a href="#section-2">二、拆解：2n-1 个中心与两种扩展</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、变体：DP 对照与 Manacher</a></li>
<li><a href="#section-6">六、Java 版</a></li>
<li><a href="#section-7">七、边界情况</a></li>
<li><a href="#section-8">八、复杂度</a></li>
<li><a href="#section-9">九、常见坑</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：枚举中心，不是枚举子串</h2>

先算一笔暴力账：子串有 <code>O(n²)</code> 个（n 个起点 × n 个终点 / 2），每个验证回文要 <code>O(n)</code> —— 总共 <code>O(n³)</code>，n = 1000 就是十亿次起步。

换个视角：
<blockquote>

<strong>回文是关于中心对称的。如果一个子串是回文，它完全由"中心 + 半径"决定。</strong>
所以答案 = 所有中心里扩展出的最长回文 —— 中心只有 <strong><code>2n - 1</code> 个</strong>，
每个中心向两边扩展最多 <code>O(n)</code> 步，总时间 <code>O(n²)</code>、空间 <code>O(1)</code>。
</blockquote>

这个 <code>2n - 1</code> 是全题最重要的数字。为什么不是 <code>n</code> 个中心？因为<strong>回文有两种长度奇偶</strong>：
<table>
<thead>
<tr>
<th>中心类型</th>
<th>例子</th>
<th>数量</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>字符中心</strong>（<code>"b a b"</code> 绕着中间的 <code>a</code> 对称）</td>
<td><code>expand(i, i)</code></td>
<td>n</td>
</tr>
<tr>
<td><strong>间隙中心</strong>（<code>"a b b a"</code> 绕着中间那条缝对称）</td>
<td><code>expand(i, i + 1)</code></td>
<td>n - 1</td>
</tr>
</tbody>
</table>

<strong>只写 <code>expand(i, i)</code> 就漏掉了所有偶数回文</strong> —— <code>"abba"</code>、<code>"cbbd"</code> 的中心不在任何字符上，在两个字符之间的<strong>间隙</strong>里。这是本题最经典的 bug，没有之一。
<h2>二、拆解：2n-1 个中心与两种扩展</h2>
<h3>2.1 扩展怎么写</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">expand</span><span class="p">(</span><span class="n">s</span><span class="p">,</span> <span class="n">l</span><span class="p">,</span> <span class="n">r</span><span class="p">):</span>
    <span class="c1"># 从 [l, r] 向两边扩到不能再扩，返回边界</span>
    <span class="k">while</span> <span class="n">l</span> <span class="o">&gt;</span> <span class="mi">0</span> <span class="ow">and</span> <span class="n">r</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">s</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span> <span class="ow">and</span> <span class="n">s</span><span class="p">[</span><span class="n">l</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span> <span class="o">==</span> <span class="n">s</span><span class="p">[</span><span class="n">r</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]:</span>
        <span class="n">l</span> <span class="o">-=</span> <span class="mi">1</span>
        <span class="n">r</span> <span class="o">+=</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="n">l</span><span class="p">,</span> <span class="n">r</span>
</code></pre></div>


注意扩展的写法是<strong>先假设中心合法，再看两边能不能再长</strong> —— 循环里检查的是 <code>s[l-1] == s[r+1]</code>（往外长一格），不是 <code>s[l] == s[r]</code>（那是收缩前的比较对象，会差一位）。
<h3>2.2 主流程：交错枚举</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">longestPalindrome</span><span class="p">(</span><span class="n">s</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">s</span><span class="p">)</span>
    <span class="n">best_l</span><span class="p">,</span> <span class="n">best_r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">0</span>

    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span><span class="p">):</span>
        <span class="c1"># 字符中心：奇数回文</span>
        <span class="n">l</span><span class="p">,</span> <span class="n">r</span> <span class="o">=</span> <span class="n">expand</span><span class="p">(</span><span class="n">s</span><span class="p">,</span> <span class="n">i</span><span class="p">,</span> <span class="n">i</span><span class="p">)</span>
        <span class="k">if</span> <span class="n">r</span> <span class="o">-</span> <span class="n">l</span> <span class="o">&gt;</span> <span class="n">best_r</span> <span class="o">-</span> <span class="n">best_l</span><span class="p">:</span>
            <span class="n">best_l</span><span class="p">,</span> <span class="n">best_r</span> <span class="o">=</span> <span class="n">l</span><span class="p">,</span> <span class="n">r</span>
        <span class="c1"># 间隙中心：偶数回文（i 与 i+1 之间；s[i] != s[i+1] 时天然构不成）</span>
        <span class="k">if</span> <span class="n">i</span> <span class="o">+</span> <span class="mi">1</span> <span class="o">&lt;</span> <span class="n">n</span> <span class="ow">and</span> <span class="n">s</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">==</span> <span class="n">s</span><span class="p">[</span><span class="n">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]:</span>
            <span class="n">l</span><span class="p">,</span> <span class="n">r</span> <span class="o">=</span> <span class="n">expand</span><span class="p">(</span><span class="n">s</span><span class="p">,</span> <span class="n">i</span><span class="p">,</span> <span class="n">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">)</span>
            <span class="k">if</span> <span class="n">r</span> <span class="o">-</span> <span class="n">l</span> <span class="o">&gt;</span> <span class="n">best_r</span> <span class="o">-</span> <span class="n">best_l</span><span class="p">:</span>
                <span class="n">best_l</span><span class="p">,</span> <span class="n">best_r</span> <span class="o">=</span> <span class="n">l</span><span class="p">,</span> <span class="n">r</span>

    <span class="k">return</span> <span class="n">s</span><span class="p">[</span><span class="n">best_l</span><span class="p">:</span><span class="n">best_r</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]</span>
</code></pre></div>


两个细节：
<ul>
<li><strong>间隙中心先判 <code>s[i] == s[i+1]</code></strong>：不相等就不用扩展（最小的偶数回文都构不成）；</li>
<li><strong>同长度先到先得</strong>：<code>&gt;</code> 而不是 <code>&gt;=</code>，<code>"babad"</code> 先扫到 <code>"bab"</code>（起点更靠左），<code>"aba"</code> 不更新 —— 两种答案都对，但返回一个就够。</li>
</ul>
<div class="algo-viz algo-viz--lc5"></div>

<h2>三、动画怎么看</h2>

动画是一行字符格子，扫过 <code>"babad"</code> 的全部 9 个中心（5 字符 + 4 间隙，交错出现）：
<ul>
<li><strong>字符中心帧</strong>：中心格橙框，扩展出的区间淡金底；</li>
<li><strong>间隙中心帧</strong>：两条格之间的<strong>竖虚线</strong>标记中心位置 —— <code>"babad"</code> 里所有间隙都构不成偶数回文（两侧字符不等），虚线一闪就过；换成 <code>"cbbd"</code> 就能看到间隙扩展出 <code>"bb"</code>；</li>
<li><strong>best 下划线</strong>：当前全局最优回文下面一条金线，随扫描推进；</li>
<li><strong>done 帧</strong>：最优区间格子变绿，横幅给出答案字符串。</li>
</ul>

看点是<strong>间隙虚线的"空扫"</strong> —— 它们不是浪费：正是这些"长度 0"的帧，保证了偶数回文不会漏。
<h2>四、完整推演表</h2>

以 <code>"babad"</code> 为主例（9 个中心，交错）：
<table>

<th>best</th>
</tr>
</thead>

<td>-</td>
<td>-</td>
<td>-</td>
</tr>

</tr>

</tr>

<td>3</td>
<td>"bab"</td>
</tr>

<td><code>s[2]|s[3]</code></td>

<td>-</td>
<td>0</td>
<td>"bab"</td>
</tr>
<tr>
<td>7</td>
<td><code>s[3]</code></td>
<td>字符</td>
<td>[3, 3]</td>

</tr>
<tr>
<td>8</td>
<td><code>s[3]|s[4]</code></td>

</tr>

<td><code>s[4]</code></td>

</tbody>
</table>

对照偶数例子 <code>"cbbd"</code>（7 个中心）：字符中心 <code>c</code>/<code>b</code>/<code>d</code> 都是长度 1，<strong>间隙 <code>s[1]|s[2]</code>（b 与 b 相等）扩展出 <code>[1, 2]</code> 即 <code>"bb"</code></strong> —— 这就是题面第二个示例的答案来源。而 <code>"abba"</code>：间隙 <code>s[1]|s[2]</code> 相等后还能继续往外扩（<code>s[0] == s[3]</code>），到 <code>[0, 3]</code> 的 <code>"abba"</code>。
<h2>五、变体：DP 对照与 Manacher</h2>
<h3>5.1 区间 DP（对照解法）</h3>

<code>dp[i][j]</code> 表示 <code>s[i..j]</code> 是否回文：<code>s[i] == s[j]</code> 且（区间长 &lt; 3 或 <code>dp[i+1][j-1]</code>）。
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">longestPalindrome</span><span class="p">(</span><span class="n">s</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">s</span><span class="p">)</span>
    <span class="n">dp</span> <span class="o">=</span> <span class="p">[[</span><span class="kc">False</span><span class="p">]</span> <span class="o">*</span> <span class="n">n</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span><span class="p">)]</span>
    <span class="n">best_l</span><span class="p">,</span> <span class="n">best_r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="mi">0</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span> <span class="o">-</span> <span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">):</span>
        <span class="k">for</span> <span class="n">j</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">i</span><span class="p">,</span> <span class="n">n</span><span class="p">):</span>
            <span class="n">dp</span><span class="p">[</span><span class="n">i</span><span class="p">][</span><span class="n">j</span><span class="p">]</span> <span class="o">=</span> <span class="n">s</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">==</span> <span class="n">s</span><span class="p">[</span><span class="n">j</span><span class="p">]</span> <span class="ow">and</span> <span class="p">(</span><span class="n">j</span> <span class="o">-</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="mi">2</span> <span class="ow">or</span> <span class="n">dp</span><span class="p">[</span><span class="n">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">][</span><span class="n">j</span> <span class="o">-</span> <span class="mi">1</span><span class="p">])</span>
            <span class="k">if</span> <span class="n">dp</span><span class="p">[</span><span class="n">i</span><span class="p">][</span><span class="n">j</span><span class="p">]</span> <span class="ow">and</span> <span class="n">j</span> <span class="o">-</span> <span class="n">i</span> <span class="o">&gt;</span> <span class="n">best_r</span> <span class="o">-</span> <span class="n">best_l</span><span class="p">:</span>
                <span class="n">best_l</span><span class="p">,</span> <span class="n">best_r</span> <span class="o">=</span> <span class="n">i</span><span class="p">,</span> <span class="n">j</span>
    <span class="k">return</span> <span class="n">s</span><span class="p">[</span><span class="n">best_l</span><span class="p">:</span><span class="n">best_r</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]</span>
</code></pre></div>


时间同样是 <code>O(n²)</code>，但<strong>空间 <code>O(n²)</code></strong> —— 中心扩展 <code>O(1)</code>。DP 的价值是提供了另一个视角（大回文由小回文长出来），面试时口头对照即可，动手写中心扩展。
<h3>5.2 Manacher（O(n)，知道即可）</h3>

在字符间插 <code>#</code>（<code>"abba"</code> → <code>"#a#b#b#a#"</code>），奇偶回文统一成奇数长度，再用已算出的回文半径跳过重复比较，做到线性。<strong>面试手写性价比低</strong>：状态多、易错，除非岗位明确要求线性算法，口头说"存在 Manacher，O(n)，思路是插分隔符统一奇偶 + 利用已算半径"就够了。

<h2>八、复杂度</h2>
<ul>
<li><strong>时间 O(n²)</strong>：<code>2n - 1</code> 个中心，每个扩展最多 <code>O(n)</code>。</li>
<li><strong>空间 O(1)</strong>：只有中心变量和最优边界 —— 比 DP 的 <code>O(n²)</code> 空间省一个量级，这也是它优于 DP 的实际理由。</li>
</ul>
<h2>九、常见坑</h2>
<h3>9.1 只写 expand(i, i)，漏掉偶数回文</h3>

最经典的 bug：<code>"cbbd"</code> 会返回 <code>"c"</code>（长度 1），<code>"abba"</code> 也一样。<strong>中心必须交错枚举字符与间隙两类</strong>。自测方法：跑一遍 <code>"cbbd"</code>，答案必须是 <code>"bb"</code>。
<h3>9.2 扩展循环比较对象写错</h3>

<code>while (s[l] == s[r])</code> 是"收缩式"写法 —— 初始 <code>[i, i]</code> 时 <code>s[l] == s[r]</code> 恒真，指针会走出字符串。扩展式写法比较的是<strong>往外一格</strong>：<code>s[l-1] == s[r+1]</code>，边界守卫 <code>l &gt; 0 &amp;&amp; r &lt; n - 1</code> 恰好挡住越界。
<h3>9.3 同长度更新用 &gt;= 导致结果漂移</h3>

<code>&gt;=</code> 会让答案在多个等长回文间跳动（取决于枚举顺序），且最后一次更新不一定起点最靠左。用 <code>&gt;</code> 先到先得，行为可预测。
<h3>9.4 间隙中心忘了先判相等</h3>

<code>s[i] != s[i+1]</code> 时还调用 <code>expand(s, i, i+1)</code> 不算错误（扩展循环自然不推进，返回 <code>[i, i+1]</code>），但这个"区间"<strong>不是回文</strong> —— 直接把它当候选更新答案就错了。先判 <code>s[i] == s[i+1]</code>，或把"是否真回文"的判断留给更新条件之外。
<h3>9.5 DP 边界差一位</h3>

<code>dp[i][j]</code> 的递推里 <code>j - i &lt; 2</code> 兜底（长度 1、2 的区间不需要看内部）；写成 <code>j - i &lt;= 2</code> 或漏掉都会把 <code>"aa"</code> 判成非回文。另外 DP 要<strong>按 i 从大到小</strong>填，否则 <code>dp[i+1][j-1]</code> 还没算。
<h3>9.6 按 UTF-16 码元拆字符串</h3>

JS 里 <code>s[i]</code> / <code>s.split('')</code> 按 UTF-16 码元切，emoji 会被拆成两个代理项，"同一个 emoji"互不相等、回文长度虚高。用 <code>Array.from(s)</code> 按码点拆（Python 天然按码点，无此问题）。
<h2>十、面试怎么答</h2>
<ol>
<li><strong>一句话定性</strong>："回文由中心和半径决定，枚举 <code>2n - 1</code> 个中心向两边扩展 —— <code>O(n²)</code> 时间 <code>O(1)</code> 空间。"</li>
<li><strong>主动报出 2n - 1</strong>："n 个字符中心管奇数回文，n - 1 个间隙中心管偶数回文 —— 漏间隙就漏 <code>"abba"</code>。"这句是面试官判断你真懂假懂的探针。</li>
<li><strong>对照暴力</strong>：先说 <code>O(n³)</code> 的枚举子串账，再给出中心扩展怎么把"验证"融进"枚举"。</li>
<li><strong>复杂度与对照</strong>：DP 同时间 <code>O(n²)</code> 空间；Manacher <code>O(n)</code> 但难写，口头提即可。</li>
<li><strong>边界报菜名</strong>：<code>"cbbd"</code>（偶数）、<code>"aaaa"</code>（连续相同）、<code>"ac"</code>（无回文退单字符）。</li>
</ol>
<h2>结语</h2>

最长回文子串的解法演进是一条"换视角"的路：枚举子串 → 枚举中心（少一个 n）→ 归一化中心 + 复用半径（Manacher，再少一个 n）。中心扩展是这条路上性价比最高的一站 —— 它的难点不在代码量，而在 <strong>2n-1 这个数字背后的奇偶两种中心</strong>。把间隙中心当成本题的肌肉记忆，同族的 LC 647 直接复用。</div></div></noscript>
