不必找游戏，直接开始一局。—— 一个纯用原生 HTML / CSS / JavaScript 写成的浏览器游戏厅，24 款游戏、零框架、零构建、零依赖，AI 从模式评分到 WebAssembly，联机靠 D1 + 轮询，叙事靠 LLM 流式生成，一键部署到 Cloudflare Pages。

<hr>
<h2>引言：为什么还要做一个"小游戏合集"</h2>

市面上不缺小游戏平台，缺的是<strong>能被完整读懂、能被一键复刻</strong>的样本工程。Happy Games 的定位很明确：
<ol>
<li><strong>教学样本</strong>——每个文件夹就能独立运行，没有"先装 300MB node_modules 再看懂 5 层抽象"的心智负担；</li>
<li><strong>技术纵深</strong>——在"零框架"的约束下，把 AI（从启发式到 WASM 引擎）、实时联机、流式叙事、账号体系、全链路测试都做一遍；</li>
<li><strong>可部署</strong>——整站就是静态文件 + Cloudflare Pages Functions + D1，没有容器、没有服务器，一条 <code>wrangler</code> 命令上线。</li>
</ol>

如果你想：
<ul>
<li>找一个 <strong>"浏览器游戏"</strong> 的入门脚手架，抄走即用；</li>
<li>研究 <strong>"零框架如何组织大型前端"</strong> 的真实案例；</li>
<li>学习 <strong>Cloudflare 全家桶（Pages / Functions / D1）</strong> 的最小可用全栈；</li>
<li>或者单纯想摸鱼 10 分钟——这篇文章就是为你写的。</li>
</ul>
<hr>
<h2>一、项目速览：30 秒看懂 Happy Games</h2>
<table>
<thead>
<tr>
<th>维度</th>
<th>关键事实</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>游戏数</strong></td>
<td><strong>24 款</strong>，分 4 板块：棋类竞技 6 / 益智解谜 6 / 娱乐天地 6 / 华夏历史 6</td>
</tr>
<tr>
<td><strong>技术约束</strong></td>
<td>原生 HTML / CSS / JS（ES Modules），<strong>无框架、无构建、无依赖</strong>，双击 HTML 即可本地打开</td>
</tr>
<tr>
<td><strong>AI 能力</strong></td>
<td>模式评分（五子棋）→ Alpha-Beta 剪枝（象棋）→ GNU Go 编译到 WebAssembly（围棋）→ 三档难度全家桶（斗兽棋/黑白棋）</td>
</tr>
<tr>
<td><strong>联机</strong></td>
<td>飞行棋 2–4 人实时对战，房间+密码，D1 存档，前端轮询同步，空座 AI 托管</td>
</tr>
<tr>
<td><strong>叙事</strong></td>
<td>模拟人生 + 华夏大乱斗接入 OpenRouter 大模型，服务端 SSE 流式转发到浏览器</td>
</tr>
<tr>
<td><strong>后端</strong></td>
<td>Cloudflare Pages Functions（<code>functions/api/**</code> 文件即路由）+ Cloudflare D1（SQLite 云数据库）</td>
</tr>
<tr>
<td><strong>测试</strong></td>
<td><code>node --test</code> 跑 25 个文件 288 个用例（纯函数 AI/引擎）+ Playwright 冒烟（桌面+移动端）</td>
</tr>
<tr>
<td><strong>部署</strong></td>
<td><code>npm run deploy</code> → <code>wrangler pages deploy .</code> 整站发布；缓存分层配置在 <code>_headers</code></td>
</tr>
<tr>
<td><strong>设计原则</strong></td>
<td>自包含文件夹 + 纯函数隔离 + 数据驱动首页 + 能离线</td>
</tr>
</tbody>
</table>

<h2>二、游戏全览：24 款怎么玩、亮点在哪</h2>
<h3>♟️ 棋类竞技</h3>
<table>
<thead>
<tr>
<th>游戏</th>
<th>玩法一句话</th>
<th>硬核点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>五子棋</strong></td>
<td>15×15 人机对战</td>
<td>AI 基于 8 档棋形权重（连五 100000 / 活四 10000 / 冲四活三 1000 …）模式评分，三档难度对应不同搜索深度</td>
</tr>
<tr>
<td><strong>中国象棋</strong></td>
<td>人机对弈</td>
<td>移植开源 <a href="https://github.com/itlwei/Chess" rel="noopener noreferrer" target="_blank">itlwei/Chess</a> 引擎：走法生成（bylaw）+ 9 种棋子位置价值表（马 3.5 / 车 9 / 炮 4.5 等）+ alpha-beta 搜索；服务端另有 GLM-4.7-Flash 走法代理兜底</td>
</tr>
<tr>
<td><strong>围棋</strong></td>
<td>人机对弈</td>
<td><strong>GNU Go 编译成 WebAssembly（约 8.7 MB）</strong>，在 Web Worker 异步运行，Komi 7.5，主线程通过 <code>{cmd:'init'/'play'/'genmove'}</code> 消息协议与引擎通信，含颜色归一化与崩溃走法日志</td>
</tr>
<tr>
<td><strong>斗兽棋</strong></td>
<td>河流与陷阱规则</td>
<td>象吃狮、鼠吃象、过河、陷阱困兽；三档 AI；棋子绘有动物 emoji</td>
</tr>
<tr>
<td><strong>黑白棋</strong></td>
<td>八方向翻转</td>
<td>三档 AI + 悔棋</td>
</tr>
<tr>
<td><strong>飞行棋</strong></td>
<td>唯一联机游戏</td>
<td>2–4 人实时对战，掷骰/跳格/飞格按经典规则，人不够空座由服务端 AI 补位，随时开局</td>
</tr>
</tbody>
</table>
<h3>🧩 益智解谜</h3>
<table>
<thead>
<tr>
<th>游戏</th>
<th>玩法一句话</th>
<th>亮点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>规则方块</strong></td>
<td>推文字改规则（"墙是停"、"水是沉" …）</td>
<td>灵感来自 Baba Is You，右侧实时显示当前生效规则，多关卡 + 撤销重置；目标是让任意「你」与任意「胜」相遇</td>
</tr>
<tr>
<td><strong>光线折射</strong></td>
<td>旋转镜面与分光器点亮晶体</td>
<td>深色网格，45° 旋转交互，激光分光折射的物理谜题</td>
</tr>
<tr>
<td><strong>数独</strong></td>
<td>9×9 经典数独</td>
<td>三档难度 + 限时挑战 + 铅笔标记 + 冲突高亮；米白棋盘风格</td>
</tr>
<tr>
<td><strong>迷宫逃脱</strong></td>
<td>限时穿越随机迷宫</td>
<td>难度越高迷宫越大越曲折，每局地图随机生成</td>
</tr>
<tr>
<td><strong>回声行者</strong></td>
<td>每走 6 步旧路变回声追你</td>
<td>影子机制：收集印章、避开过去的自己，路线规划容错极低</td>
</tr>
<tr>
<td><strong>推箱子</strong></td>
<td>15 关手排关卡</td>
<td>由浅入深，温暖复古地板色系，经典推箱子解谜</td>
</tr>
</tbody>
</table>
<h3>🎈 娱乐天地</h3>
<table>
<thead>
<tr>
<th>游戏</th>
<th>玩法一句话</th>
<th>亮点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>星火割草</strong></td>
<td>类吸血鬼幸存者</td>
<td>角色自动射击，击杀掉经验，三选一随机升级（射速/弹道/护甲…），build 构筑决定能撑几波</td>
</tr>
<tr>
<td><strong>模拟人生</strong></td>
<td>文字人生模拟</td>
<td>分配天赋（智识/体魄/财运…），AI 按属性流式生成童年→少年→青年→中年→晚年→总评六段故事，最后给出 0–100 人生评分</td>
</tr>
<tr>
<td><strong>跳跳鸟</strong></td>
<td>点击飞翔穿水管</td>
<td>蓝天草地配色，经典手感，越飞越远</td>
</tr>
<tr>
<td><strong>模拟徒步</strong></td>
<td>三条真实路线：熬太穿越/贡嘎大环线/乌孙古道</td>
<td>翻山越岭 + 补给管理 + 海拔天气，浏览器里的徒步模拟器</td>
</tr>
<tr>
<td><strong>跳一跳</strong></td>
<td>长按蓄力跳平台</td>
<td>正落中心有连击加分，微妙的物理引擎是精髓</td>
</tr>
<tr>
<td><strong>堆塔</strong></td>
<td>摆动方块精准落下</td>
<td>对齐越多层越高，精准截断、层层堆叠，心跳加速</td>
</tr>
</tbody>
</table>
<h3>🏯 华夏历史</h3>
<table>
<thead>
<tr>
<th>游戏</th>
<th>玩法一句话</th>
<th>亮点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>圣旨七日</strong></td>
<td>七天办妥圣旨</td>
<td>每天 3 次行动机会，银两/粮食/民心/治安/士族/名望/情报七资源此消彼长，三次行动后呈报圣旨，第七日按政绩结算</td>
</tr>
<tr>
<td><strong>华夏商旅</strong></td>
<td>踏遍名城经营商号</td>
<td>与 3 名 AI 商人竞逐财富，商品价格与对手策略动态变化</td>
</tr>
<tr>
<td><strong>大唐县令</strong></td>

<h2>三、硬核亮点拆解</h2>
<h3>3.1 AI 引擎：从模式评分到 WebAssembly 的四个层级</h3>

Happy Games 的 AI 不是"随机走一步"，而是横跨四个技术层级：

<strong>① 模式评分（五子棋 <code>gomoku/ai.js</code>）</strong>

8 个方向扫描棋形，按权重打分取最优落点：

三档难度控制搜索深度：初级只看一步（会"手滑"），高级多看几步并把"堵你活三"放在"自己成冲四"之上。所有逻辑写成纯函数，<code>node --test</code> 可直接测。

<strong>② Alpha-Beta 剪枝（中国象棋 <code>xiangqi/engine.js</code>）</strong>

移植自 <a href="https://github.com/itlwei/Chess" rel="noopener noreferrer" target="_blank">itlwei/Chess</a>（MIT），保留引擎核心：
<ul>
<li><strong>走法生成（bylaw）</strong>：每种棋子的合法走法规则（马腿、象眼、宫内斜走等）；</li>
<li><strong>位置价值表</strong>：每枚棋子在不同格子的攻防价值（如兵过河前/后、炮在不同线的价值差异）；</li>
<li><strong>Alpha-Beta 搜索 + 局面评估</strong>：在指数级博弈树中剪掉不可能更优的分支，只搜"有希望"的走法。</li>
</ul>

棋盘逻辑（<code>xiangqi/logic.js</code>）与 AI 引擎（<code>xiangqi/engine.js</code>）完全分离，另在服务端 <code>/api/xiangqi-ai</code> 提供基于 GLM-4.7-Flash 的 AI 走法代理作为兜底——当本地引擎因极端局面无法给出走法时，云端模型补位。

<strong>③ GNU Go → WebAssembly（围棋 <code>weiqi/gnugo.js</code> + <code>weiqi/weiqi.worker.js</code>）</strong>

这是项目里最硬核的一条技术路径：把开源围棋引擎 <strong>GNU Go</strong> 编译成 WebAssembly（<code>weiqi/gnugo.js</code> 约 8.7 MB），在 <strong>Web Worker</strong> 中运行，主线程与 Worker 通过消息协议通信：
<div class="codehilite"><pre><span></span><code>主线程 → Worker：  { cmd: &#39;init&#39;, size, seed }   初始化对局（Komi 7.5 贴目）
主线程 → Worker：  { cmd: &#39;play&#39;, i, j }         玩家落子
主线程 → Worker：  { cmd: &#39;genmove&#39; }            引擎思考落子
Worker → 主线程：  { ok, cmd, board, last }      盘面快照（含颜色归一化）
</code></pre></div>


Worker 里还做了三件关键事：
<ul>
<li><strong>颜色归一化</strong>：不依赖 GNU Go 内部颜色常量方向，首次落子后把"玩家色"统一映射为 1（黑）、另一色为 2（白），主线程渲染永远一致；</li>
<li><strong>走法日志</strong>：记录每一步 <code>(i,j)</code>，引擎崩溃时可复现对局；</li>
<li><strong>stdout/stderr 捕获</strong>：<code>Module.print / printErr</code> 接管 GNU Go 输出，便于诊断。</li>
</ul>

浏览器里跑世界级棋类引擎，且不卡主线程——这是"前端也能做重型 AI"的完整实践。

<strong>④ 三档难度全家桶（斗兽棋 / 黑白棋）</strong>

两款的 AI 都按搜索深度分三档，黑白棋额外支持悔棋。实现同样是纯函数，可单测。
<hr>
<h3>3.2 飞行棋：基于 D1 的实时联机（轮询 + 服务端状态机）</h3>

飞行棋是 24 款里唯一的多人游戏，架构可拆成三层：
<div class="codehilite"><pre><span></span><code>创建/加入  →  状态推进（掷骰/走子/开局）  →  轮询同步
  │                    │                        │
  ▼                    ▼                        ▼
/api/feixingqi/create  /api/feixingqi/roll    前端 1.5s（对局中）/ 2s（大厅）轮询 /api/feixingqi/state
/api/feixingqi/join    /api/feixingqi/move    服务端先 tick() 推进 AI 补位回合再返回
                       /api/feixingqi/start
</code></pre></div>

<ul>
<li><strong>房间管理</strong>：<code>POST /api/feixingqi/create</code> 创建房间（带密码）、<code>POST /api/feixingqi/join</code> 加入房间；房间状态整体序列化为 JSON 存进 D1 <code>feixingqi_rooms</code> 表（<code>code/password/state(JSON)/created_at/updated_at</code>）；</li>
<li><strong>状态推进</strong>：所有走子合法性由服务端校验（防作弊），空座由服务端 AI 托管——哪怕只有一个人，也能凑齐一桌；</li>
<li><strong>轮询同步</strong>：前端定时 <code>fetch /api/feixingqi/state</code>，服务端在返回前先执行 <code>tick()</code> 推进 AI 玩家的回合，玩家看到的永远是"别人已经走完"的最新局面。</li>
</ul>

D1 在这里既是数据库也是缓存，简单够用，免去了 WebSocket 的运维复杂度。
<hr>
<h3>3.3 AI 流式叙事：人生与战报由大模型书写</h3>

「模拟人生」与「华夏大乱斗」把大模型接进了游戏，服务端做 SSE 流式转发：

<strong>模拟人生（<code>/api/life/narrate</code>）</strong>
<ul>
<li>玩家分配出生属性后，前端 <code>POST /api/life/narrate {attributes}</code>；</li>
<li>服务端请求 OpenRouter（<code>inclusionai/ling-3.0-flash:free</code>），把 SSE 流原样转发给浏览器：<code>Content-Type: text/event-stream</code>；</li>
<li>六段人生（童年→少年→青年→中年→晚年→总评）逐字生成，像有人在屏幕那头讲故事；</li>
<li>遇 429 限流自动退避重试（最多 3 次，间隔 2.5s × attempt），提示词严格约束输出格式（每段 130–180 字、评分必须为"人生评分：NN"）。</li>
</ul>

提示词核心约束：
<div class="codehilite"><pre><span></span><code>你是中文人生模拟器的随机推演 AI。严格按六个标题输出，每个标题独占一行：
【童年】【少年】【青年】【中年】【晚年】【人生总评】
前五段各 130–180 字，必须包含该阶段具体事件、影响、如何改变下一阶段；
最后一段开头必须是&quot;人生评分：NN。&quot;（NN 0–100）。
</code></pre></div>


<strong>华夏大乱斗（<code>/api/battle/analyze</code>）</strong>
<ul>
<li>双人轮流为十个职位选将（先锋、后勤…），选将完毕请求 AI 裁判；</li>
<li>AI 按 <strong>朝代适配性 &gt; 职位匹配度 &gt; 实际能力 &gt; 阵容协同</strong> 的优先级逐局评判十场对决，比分精确到 0.1 且每局总和必须为 10；</li>
<li>输出风格是"话说……""且看……"的说书人腔调，同样走 SSE 流式返回。</li>
</ul>
<blockquote>

这两处是"游戏 + LLM"的轻量范式：服务端只做鉴权、限流、流转发，不存大模型状态；前端消费标准 SSE，失败不阻塞游戏主循环。
</blockquote>
<hr>
<h3>3.4 账号与管理台</h3>
<ul>
<li>注册 / 登录 / 退出：<code>POST /api/register|login|logout</code>，密码存储于 D1 <code>users</code> 表（<code>username PK + password + created_at</code>），会话使用随机 token + Cookie（<code>hg_token</code>）鉴权，<code>expires_at</code> 30 天过期校验；</li>
<li><code>GET /api/me</code> 供前端判断登录态：首页据此显示"用户名 · 退出"；管理员账号 <code>zhoujun</code> 自动亮出隐藏的「管理台」入口（<code>/adminPages/</code>）；</li>
<li>通用中间件在 <code>functions/_middleware.js</code>：未登录的 HTML 页面请求一律 302 跳转到 <code>/login.html</code>，静态资源与 <code>/api/*</code> 放行；管理台路径额外校验 <code>username === 'zhoujun'</code> 否则 403；</li>
<li>管理台接口：<code>GET /api/admin/users</code>（用户列表）、<code>GET /api/admin/game-stats</code>（对局与成绩统计）。</li>
</ul>
<hr>
<h3>3.5 快得没有道理：缓存与体验细节</h3>
<ul>
<li><strong>零依赖、零构建</strong>：静态资源秒开，首屏无打包等待；</li>
<li><strong>分层缓存（<code>_headers</code>）</strong>：</li>
<li><code>.css/.js/.mjs</code> → <code>max-age=300, stale-while-revalidate=86400</code>（5 分钟强缓存 + 24 小时过期后后台刷新）</li>
<li><code>.wasm</code> → <code>max-age=604800, immutable</code>（7 天强缓存，GNU Go 引擎一次加载永久缓存）</li>
<li>图片（<code>.png/.jpg/.webp/.svg</code>）→ <code>max-age=86400, stale-while-revalidate=604800</code>（1 天）</li>
<li><strong>首页体验</strong>：每次打开随机抽 3 款游戏做推荐位 + 「随机开一局」按钮（<code>sections.flatMap</code> 后随机取 3 + 随机跳转），选择困难症救星；</li>
<li><strong>响应式</strong>：<code>@media (max-width: 850px / 600px)</code> 两档断点，手机电脑皆可玩，触屏与键盘双输入适配；</li>
<li><strong>游戏运行时</strong>：<code>shared/game-runtime.js</code> 统一管理生命周期、分数与事件上报（见下文），失败不阻塞主循环。</li>
</ul>

<h2>五、架构详解</h2>
<h3>5.1 前端架构：自包含文件夹 + 数据驱动首页</h3>
<div class="codehilite"><pre><span></span><code>┌──────────────────────────────────────────────────────────────┐
│  index.html  首页：板块入口卡 + 每日推荐 + 随机开一局          │
│  /board /puzzle /fun /history  板块页：该板块游戏卡             │
│  shared/landing.js  ★ 唯一数据源：板块 + 游戏配置 + SVG 预览图 │
│  shared/game-runtime.js  生命周期、分数与反馈事件队列            │
│  shared/theme.css / cards.css / game.css  主题与卡片样式       │
├──────────────────────────────────────────────────────────────┤
│  每款游戏 = 一个自包含文件夹                                      │
│  &lt;game&gt;/index.html        页面骨架 + 弹窗说明                     │
│  &lt;game&gt;/&lt;game&gt;.js         交互与渲染（可含 worker）               │
│  &lt;game&gt;/&lt;game&gt;.css        独享样式                               │
│  &lt;game&gt;/ai.js             纯函数 AI（无 DOM，可单测）             │
│  &lt;game&gt;/engine.js         纯逻辑引擎（走法/规则/状态机）           │
│  &lt;game&gt;/logic.js          棋盘规则（如围棋提子/气）                │
│  &lt;game&gt;/levels.js         关卡数据（如推箱子 15 关）               │
│  └─ (worker 文件，如 weiqi/weiqi.worker.js、gnugo.js)       │
└──────────────────────────────────────────────────────────────┘
</code></pre></div>


<strong>三条设计纪律：</strong>
<ol>
<li>

<strong>主题共享</strong>：<code>shared/theme.css</code> 定义全套 CSS 变量（<code>--ink / --accent-red / --accent-gold / --border / --surface / --shadow-soft</code> 等），<code>shared/cards.css</code> 定义首页与板块页卡片，<code>shared/game.css</code> 定义游戏页布局与状态反馈；所有游戏复用同一套视觉语言，不各自发明颜色。
</li>
<li>

<strong>数据驱动首页</strong>：<code>shared/landing.js</code> 是全站唯一数据源。<code>sections</code> 数组定义 4 板块 × 6 游戏的 <code>id / name / description / href / accent / previewSvg</code>，<code>renderHome()</code> 渲染首页 4 个板块入口卡，<code>renderSection(id)</code> 渲染板块页 6 个游戏卡。首页的 3 个推荐位随机抽取、随机开一局按钮、板块页游戏数统计，全部从这一份配置推导——<strong>加一款游戏只改一处</strong>，其余自动生效。
</li>
</ol>

<code>js
   // shared/landing.js 新增游戏只需加一条
   {
     id: 'mygame',
     name: '我的游戏',
     description: '一句话简介',
     href: '/mygame/',
     accent: '#2980b9',
     previewSvg: `&lt;svg viewBox="0 0 120 120"&gt;…&lt;/svg&gt;`,
   }</code>
<ol>
<li><strong>自包含</strong>：每款游戏一个文件夹，页面、样式、逻辑、AI 全在一起，互不干扰。新增游戏不碰其他游戏文件，删除游戏直接删文件夹，零耦合。</li>
</ol>

<strong>运行时共享（<code>shared/game-runtime.js</code>）</strong>

为每局游戏创建会话、记录关键事件、同步分数快照，并在结束/离页时提交结果。核心能力：
<ul>
<li><code>createGameRuntime({gameId, autoStart})</code> 工厂：<code>uuid()</code> 生成 <code>sessionId</code>，<code>start()</code> 调 <code>POST /api/game/sessions</code>，<code>setScore()</code> 去重后推 <code>score_snapshot</code>，<code>finish(outcome)</code> 调 <code>POST /api/game/finish</code> + <code>flush()</code>；</li>
<li>事件队列：<code>MAX_QUEUE=60 / FLUSH_SIZE=6 / FLUSH_DELAY=1600ms</code> 批量上报 <code>POST /api/game/events</code>，幂等 <code>eventId</code>，网络失败不阻塞游戏主循环（失败事件回队重试）；</li>
<li>DOM 快照：<code>MutationObserver</code> 监听 <code>#score / [data-score] / .score-value / #status</code> 等，自动提取分数与"游戏结束/胜利/失败"关键词，触发 <code>finish('won'|'lost')</code>；</li>
<li>自定义事件：监听 <code>happy-game-score</code> / <code>happy-game-event</code>，游戏可 <code>dispatchEvent(new CustomEvent('happy-game-score', {detail:{score, delta}}))</code> 上报；</li>
<li>离页兜底：<code>pagehide</code> 时 <code>navigator.sendBeacon('/api/game/finish', …)</code> 确保成绩不丢。</li>
</ul>
<blockquote>

设计哲学：<strong>Domain 层必须与 DOM / Canvas / 网络 / 数据库解耦</strong>。页面与渲染器只消费 Domain 快照，<code>game-runtime</code> 拥有生命周期与反馈，<code>ai.js / engine.js</code> 纯函数可在 Node 里单测。这是 <code>docs/architecture.md</code> 约定的分层边界：<code>page → shared UI/runtime → game domain → API client → Pages Functions → D1</code>。
</blockquote>

<h3>5.3 数据库（D1）</h3>

<code>schema.sql</code> 定义 7 张表，增量变更放在 <code>migrations/</code>，新库执行完整 <code>schema.sql</code>，已有库按迁移顺序更新：
<div class="codehilite"><pre><span></span><code><span class="n">users</span><span class="w">            </span><span class="c1">-- 用户名 PK + 密码 + 注册时间</span>
<span class="n">sessions</span><span class="w">         </span><span class="c1">-- token PK + 用户名 + 过期时间（idx_sessions_username）</span>
<span class="n">battle_rooms</span><span class="w">     </span><span class="c1">-- 大乱斗房间：code PK / password / state(JSON) / created_at / updated_at</span>
<span class="n">feixingqi_rooms</span><span class="w">  </span><span class="c1">-- 飞行棋房间：同上结构，state 含 seats/pieces/turn/dice/log 等</span>
<span class="n">game_sessions</span><span class="w">    </span><span class="c1">-- 每局游戏生命周期：id PK / game_id / username / anonymous_id / started_at / ended_at / status / score / duration_ms / metadata(JSON)</span>
<span class="n">game_events</span><span class="w">      </span><span class="c1">-- 受白名单约束的关键事件：id / event_id UNIQUE / session_id / game_id / event_type / score / score_delta / payload(JSON) / client_at</span>
<span class="n">game_scores</span><span class="w">      </span><span class="c1">-- 最终成绩：session_id PK / game_id / username / score / outcome / duration_ms / metadata(JSON)</span>
</code></pre></div>


房间状态整体序列化为 JSON 存在单行里（简单够用），联机走"前端轮询 + 服务端状态机推进"模型，D1 即数据库即缓存。

索引覆盖高频查询：<code>game_sessions(game_id, started_at)</code>、<code>game_events(session_id, created_at)</code>、<code>game_scores(game_id, score DESC)</code> 等。

<code>json
  {

<strong>常见坑位：</strong>
<table>
<thead>
<tr>
<th>现象</th>
<th>原因</th>
<th>解法</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/api/me</code> 401 但已登录</td>

<td>确认通过 Pages 域名访问，非 <code>file://</code></td>
</tr>
<tr>
<td>模拟人生 503</td>

</tr>
<tr>

</tr>

<td><code>.wasm</code> 加载慢</td>

<h2>十、为什么坚持"零框架"</h2>

这不是复古，而是权衡后的选择：
<ol>
<li>

<strong>可读性优先</strong>：24 款游戏由不同逻辑构成，React/Vue 的抽象在"每款游戏完全不同"的场景下收益有限，反而增加"先理解框架再理解游戏"的负担；原生代码让新人 10 分钟就能看懂一款游戏的完整链路。
</li>
<li>

<strong>可移植性</strong>：<code>ai.js / engine.js</code> 纯函数不依赖任何框架，Node 里 <code>import</code> 即可测试，未来要迁到小程序、Electron、甚至服务端，都只需重写渲染层。
</li>
<li>

<strong>性能与离线</strong>：无框架意味着无运行时开销、无 hydration、无打包体积；除 AI 叙事与联机外，所有游戏不依赖网络，<code>_headers</code> 缓存让二次访问接近离线体验。
</li>
<li>

<strong>教学价值</strong>：这是一个"能被完整读懂"的前端项目——没有黑盒打包器，没有 2000 行配置，整个项目就是一堆 HTML 文件，上传到 Cloudflare Pages 就能跑。<strong>把复杂度留给游戏逻辑，把简单留给工程。</strong>
</li>
</ol>

当然，零框架不等于零规范：<code>shared/theme.css</code> 的变量体系、<code>shared/landing.js</code> 的唯一数据源、<code>shared/game-runtime.js</code> 的生命周期契约、<code>functions/services</code> 的分层边界，共同构成了项目的隐形框架——只是它们是约定的，而非依赖的。
<hr>
<h2>写在最后</h2>

Happy Games 想证明一件事：<strong>在"重前端框架"的时代，原生技术依然能做出完整、可维护、可部署的全栈产品</strong>——只要把边界划清楚（Domain 与渲染分离、数据驱动首页、分层后端），把 AI 写成纯函数，把联机做成状态机，把部署交给 Cloudflare。

24 款游戏，每款都是一个独立的世界：你可以是棋盘上的谋略家、迷宫里的逃脱者、商道上的冒险家，也可以是七日圣旨里的朝臣、科举考场上的读书人。<strong>不必找游戏，直接开始一局——这一刻，玩点有意思的。</strong>
