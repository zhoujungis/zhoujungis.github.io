    <noscript><div class="ns-article"><h1>【LC 33 / 153】搜索旋转排序数组 &amp; 最小值：同一道断崖，比较对象正好相反</h1><div class="ns-meta">2026/9/29 · Zhou Jun</div><div class="markdown-body"><h1>【LC 33 / 153】搜索旋转排序数组 &amp; 最小值：同一道断崖，比较对象正好相反</h1>
<blockquote>
<ul>
<li><strong>LC 33</strong>：整数数组 <code>nums</code> 经旋转后（如 <code>[0,1,2,4,5,6,7]</code> → <code>[4,5,6,7,0,1,2]</code>）搜索 <code>target</code>，要求 O(log n)，不存在返回 -1。</li>
<li><strong>LC 153</strong>：找出旋转数组中的<strong>最小值</strong>。美团社招面经原题即此题。</li>
</ul>
</blockquote>

这两道题共享同一个画面：<strong>旋转数组是两段各自上升的折线，中间一道断崖</strong>。最小值站在断崖右侧那段的起点上。二分查找它，每一步只需回答一个问题 —— <strong>mid 站在断崖的哪一边？</strong>

有趣的是，两道题判断"哪一边"用的比较对象<strong>正好相反</strong>，而各自都有充分的理由。这就是本篇的全部内容。
<h2>一、画面先行：断崖在哪，答案就在哪边</h2>

以 <code>[4,5,6,7,0,1,2]</code> 为例：
<div class="codehilite"><pre><span></span><code>值:  4 5 6 7 | 0 1 2
     第一段 ↗ | ↗ 第二段
             ↑
           断崖（7 → 0）
</code></pre></div>

<ul>
<li><strong>153（找最小值）</strong>：最小值就是断崖右侧那段的起点。mid 要判断的是"我在断崖左边还是右边"；</li>
<li><strong>33（搜 target）</strong>：mid 把区间切成两半，<strong>至少有一半完全有序</strong>（不含断崖）。在那半里做普通二分的值域判断即可。</li>
</ul>
<h3>1.1 LC 153 的判据：和 nums[right] 比</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">findMin</span><span class="p">(</span><span class="n">nums</span><span class="p">):</span>
    <span class="n">l</span><span class="p">,</span> <span class="n">r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">while</span> <span class="n">l</span> <span class="o">&lt;</span> <span class="n">r</span><span class="p">:</span>
        <span class="n">mid</span> <span class="o">=</span> <span class="p">(</span><span class="n">l</span> <span class="o">+</span> <span class="n">r</span><span class="p">)</span> <span class="o">//</span> <span class="mi">2</span>
        <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]</span> <span class="o">&gt;</span> <span class="n">nums</span><span class="p">[</span><span class="n">r</span><span class="p">]:</span>
            <span class="n">l</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span>     <span class="c1"># mid 在第一段，断崖在右边</span>
        <span class="k">else</span><span class="p">:</span>
            <span class="n">r</span> <span class="o">=</span> <span class="n">mid</span>         <span class="c1"># mid 在第二段，mid 可能就是最小值</span>
    <span class="k">return</span> <span class="n">nums</span><span class="p">[</span><span class="n">l</span><span class="p">]</span>
</code></pre></div>


每一步的含义：
<ul>
<li><strong><code>nums[mid] &gt; nums[r]</code></strong>：mid 比当前区间末尾还大 —— 它右边一定跨过了断崖（否则这段递增到 r 也不会变小），所以<strong>最小值在 <code>[mid+1, r]</code></strong>，mid 自己被淘汰；</li>
<li><strong><code>nums[mid] &lt; nums[r]</code></strong>：mid 在断崖右侧的第二段上（或者断崖就是 mid），<strong>最小值在 <code>[l, mid]</code> 里 —— mid 可能就是答案</strong>，所以收缩是 <code>r = mid</code> 而不是 <code>r = mid - 1</code>。</li>
</ul>

循环条件 <code>l &lt; r</code>：区间缩到 1 个元素时它就是答案。
<h3>1.2 为什么和 right 比，不和 left 比 —— 歧义从哪来</h3>

反过来想：如果和 <code>nums[l]</code> 比，<code>nums[mid] &gt; nums[l]</code> 时 mid 可能在第一段（断崖在右），<strong>也可能整个数组没旋转</strong>（最小值就是 <code>nums[l]</code>）—— 两种情况这一个比较区分不了，下一步方向就无从谈起。<strong>和 right 比没有这个歧义</strong>：<code>nums[mid] === nums[r]</code> 只在区间缩到一两个元素时才可能发生（两段内部严格递增），不影响判断。

<strong>这个"比较对象的选择"就是本题的面试考点。</strong> 下一节会看到 33 用的是 left —— 因为它要的量不一样。
<h3>1.3 动画与逐帧推演</h3>

官方例 <code>[4,5,6,7,0,1,2]</code>（与状态机 <code>rotatedMinSteps.js</code> 的 5 帧实际输出逐行核对过）：
<div class="algo-viz algo-viz--lc153"></div>

<tr>

</tr>

盯住第 2 帧：<code>nums[5] = 1 &lt; nums[6] = 2</code> —— mid 在第二段上，最小值在 <code>[4, 5]</code> 里。如果这里写成 <code>r = mid - 1 = 4</code>，就把 mid 自己（正是最小值 1 的邻居、下一轮的关键候选）扔掉一半范围，整个算法直接失效。<strong>"r = mid" 与 "r = mid - 1" 的一字之差，是这道题最经典的死法。</strong>
<h2>二、LC 33：和 nums[left] 比，找"有序的那半"</h2>
<h3>2.1 判据</h3>

mid 把 <code>[l, r]</code> 切成 <code>[l, mid]</code> 和 <code>[mid, r]</code> 两半，<strong>断崖只在其中一半里，另一半完全有序</strong>。而"左半有序"有一个一步到位的判据：
<div class="codehilite"><pre><span></span><code><span class="n">nums</span><span class="o">[</span><span class="n">l</span><span class="o">]</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">nums</span><span class="o">[</span><span class="n">mid</span><span class="o">]</span><span class="w">  </span><span class="err">→</span><span class="w">  </span><span class="n">左半</span><span class="w"> </span><span class="o">[</span><span class="n">l, mid</span><span class="o">]</span><span class="w"> </span><span class="n">有序</span>
<span class="n">nums</span><span class="o">[</span><span class="n">l</span><span class="o">]</span><span class="w"> </span><span class="o">&gt;</span><span class="w">  </span><span class="n">nums</span><span class="o">[</span><span class="n">mid</span><span class="o">]</span><span class="w">  </span><span class="err">→</span><span class="w">  </span><span class="n">右半</span><span class="w"> </span><span class="o">[</span><span class="n">mid, r</span><span class="o">]</span><span class="w"> </span><span class="n">有序</span>
</code></pre></div>


（等号重要：<code>l === mid</code> 时区间只剩一两个元素，必须判"有序"。）

拿到有序的那半，就用一次<strong>值域判断</strong>决定去哪边：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">search</span><span class="p">(</span><span class="n">nums</span><span class="p">,</span> <span class="n">target</span><span class="p">):</span>
    <span class="n">l</span><span class="p">,</span> <span class="n">r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">while</span> <span class="n">l</span> <span class="o">&lt;=</span> <span class="n">r</span><span class="p">:</span>
        <span class="n">mid</span> <span class="o">=</span> <span class="p">(</span><span class="n">l</span> <span class="o">+</span> <span class="n">r</span><span class="p">)</span> <span class="o">//</span> <span class="mi">2</span>
        <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]</span> <span class="o">==</span> <span class="n">target</span><span class="p">:</span>
            <span class="k">return</span> <span class="n">mid</span>
        <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">l</span><span class="p">]</span> <span class="o">&lt;=</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]:</span>                       <span class="c1"># 左半有序</span>
            <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">l</span><span class="p">]</span> <span class="o">&lt;=</span> <span class="n">target</span> <span class="o">&lt;</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]:</span>          <span class="c1"># target 在左半值域内</span>
                <span class="n">r</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">-</span> <span class="mi">1</span>
            <span class="k">else</span><span class="p">:</span>
                <span class="n">l</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span>                            <span class="c1"># 只可能在右半</span>
        <span class="k">else</span><span class="p">:</span>                                          <span class="c1"># 右半有序</span>
            <span class="k">if</span> <span class="n">nums</span><span class="p">[</span><span class="n">mid</span><span class="p">]</span> <span class="o">&lt;</span> <span class="n">target</span> <span class="o">&lt;=</span> <span class="n">nums</span><span class="p">[</span><span class="n">r</span><span class="p">]:</span>
                <span class="n">l</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span>
            <span class="k">else</span><span class="p">:</span>
                <span class="n">r</span> <span class="o">=</span> <span class="n">mid</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="o">-</span><span class="mi">1</span>
</code></pre></div>


<strong>为什么 33 用 left、153 用 right？</strong> 因为它们要的量不同：
<ul>
<li>153 要知道"<strong>mid 在断崖的哪一边</strong>" —— 这决定最小值在 mid 左边还是右边。和 right 比，<code>mid &gt; right</code> 就实锤 mid 在第一段，没有歧义；</li>
<li>33 要知道"<strong>哪一半有序</strong>" —— mid 把区间切成两半，左半有序当且仅当 <code>nums[l] &lt;= nums[mid]</code>（左端不越过 mid）。和 left 比正好一步得到。</li>
</ul>

<strong>同一个断崖，两道题，比较对象正好相反</strong> —— 不是巧合，是"你问的问题不同"。
<h3>2.2 值域判断的开闭边界</h3>

两个值域判断的端点一开一闭，各有一个理由：
<ul>
<li>左半值域 <code>[nums[l], nums[mid])</code>：右端<strong>开</strong> —— <code>target === nums[mid]</code> 已在开头命中返回，走到这里说明不相等；</li>
<li>右半值域 <code>(nums[mid], nums[r]]</code>：两端都<strong>闭</strong>于 target 一侧 —— 左端开是同理，右端闭是因为 <code>nums[r]</code> 本身可以是 target。</li>
</ul>

写错任何一端的开闭，都会在 target 恰好是端点值时丢解。单测里专门放了 <code>target = 4</code>（第一段左端点）和 <code>target = 2</code>（第二段右端点）两个边界。

第 1 帧值得多看一眼：左半 <code>[0,3]</code> 有序，值域 <code>[4, 7)</code>，target 0 不在 —— <strong>哪怕右半是断崖那侧，target 也只可能在右半</strong>。"进无序的那半"听起来冒险，其实有序半的值域判断已经把另一半的可能性证明完了：target 若在左半，就必须落在它的值域里；不在值域里，就只剩右半。
<h2>三、两个必踩的坑</h2>

<strong>坑一：153 的 <code>r = mid</code> 写成 <code>r = mid - 1</code>。</strong> 1.1 节讲过 —— mid 可能就是最小值。配套的循环条件必须是 <code>l &lt; r</code>（不是 <code>l &lt;= r</code>，否则缩到相邻两个时死循环）。

<strong>坑二：33 的有序判断漏了等号。</strong> <code>nums[l] &lt; nums[mid]</code> 写成严格小于：区间缩到 <code>l === mid</code>（一两个元素）时判断为"左半无序"→ 走右半逻辑 → 但右半此时只有 mid 自己，值域判断用 <code>nums[mid] &lt; target &lt;= nums[r]</code> —— 方向彻底错乱。<strong>等号是"单元素区间也算有序"的保证。</strong>

还有一个高频追问：<strong>为什么 33 里 <code>nums[l] &lt;= nums[mid]</code> 不怕没旋转的情况？</strong> 没旋转时每一步都是左半有序，值域判断正常工作 —— 旋转只是让"哪半有序"换了位置，判断框架一个字没变。153 同理：没旋转时 mid 永远小于 right，一路 <code>r = mid</code> 往左缩，最后停在 <code>nums[0]</code> —— 退化成"找头"，但正确性和复杂度都不变。
<h2>四、复杂度</h2>
<table>
<thead>
<tr>
<th>项</th>
<th>值</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>时间</td>
<td>O(log n)</td>
<td>每步一次比较淘汰一半 —— 和普通二分同阶</td>
</tr>
<tr>
<td>空间</td>
<td>O(1)</td>
<td>三个指针</td>
</tr>
</tbody>
</table>

<strong>对比线性扫描 O(n)</strong>：旋转数组的信息量（两段有序）足以支撑二分 —— 这也是两题题面都点名 O(log n) 的原因。但要清醒：这个 O(log n) 依赖<strong>元素互不相同</strong>（33/153 的题面保证），一旦允许重复，见第五节。
<h2>五、重复元素版本：81 / 154</h2>

元素可以重复时，两题各升级一档，而且都<strong>只坏在一种情况</strong>：
<ul>
<li><strong>LC 81（重复版 33）</strong>：<code>nums[l] === nums[mid]</code> 时无法判断哪半有序（两半都可能）—— 唯一安全的动作是 <code>l += 1</code> 丢掉一个确定不是 target（如果 target === nums[l] 早命中了）的元素。最坏（全是同一个元素）退化成 <strong>O(n)</strong>，平均仍 O(log n)；</li>
<li><strong>LC 154（重复版 153）</strong>：<code>nums[mid] === nums[r]</code> 时无法判断断崖方向 —— 唯一安全的动作是 <code>r -= 1</code>：即使 <code>nums[r]</code> 是最小值，<code>nums[mid]</code> 与它相等，丢掉 r 也丢不掉答案的<strong>值</strong>。同样最坏 O(n)。</li>
</ul>
<blockquote>

这两行 <code>l += 1</code> / <code>r -= 1</code> 是旋转二分在重复元素下仅存的"确定性动作" —— 面试说出"为什么只能这样退、什么时候退化成 O(n)"，比写出无重复版本值钱。
</blockquote>

<h2>七、边界情况与常见坑</h2>

<strong>坑一：153 的 <code>r = mid</code> 与循环条件配套。</strong> <code>r = mid</code> 配 <code>l &lt; r</code>；写成 <code>r = mid - 1</code> 配 <code>l &lt;= r</code> 是另一个（错误）算法 —— 会跳过最小值。

<strong>坑二：33 的 <code>l &lt;= r</code> 循环条件。</strong> 33 是"命中即返回"的普通二分框架，用 <code>l &lt;= r</code>；153 是"缩到一点"的框架，用 <code>l &lt; r</code>。两题循环条件不同不是笔误，是终止语义不同。

<strong>坑三：mid 取整方向。</strong> <code>(l + r) / 2</code> 向下取整在 <code>r = mid</code> 的框架里安全（不会死循环）；如果某天写 <code>r = mid - 1</code> 框架配向下取整的 mid，相邻两元素时 <code>mid === l</code>，收缩后区间不变 → 死循环。（Java 用 <code>&gt;&gt;&gt; 1</code> 防溢出。）

<strong>坑四：target 恰好是端点值。</strong> 2.2 节的开闭边界 —— 自测用例必须包含"target = 第一段左端点"和"target = 第二段右端点"。

<h2>九、面试怎么答</h2>
<ul>
<li><strong>先画图</strong>：两段上升折线 + 断崖，最小值在断崖右侧段起点 —— 画面立住了，判据都是推出来的；</li>
<li><strong>153</strong>：和 <code>nums[r]</code> 比，<code>r = mid</code> 不是 <code>mid - 1</code>，循环条件 <code>l &lt; r</code>；</li>
<li><strong>33</strong>：和 <code>nums[l]</code> 比（带等号）找有序半，值域一开一闭；</li>
<li><strong>主动对比</strong>：<strong>同一道断崖，两题比较对象相反，因为要的量不同</strong>（mid 在断崖哪边 vs 哪半有序）—— 这句是面试的分水岭；</li>
<li><strong>自测</strong>：<code>findMin([4,5,6,7,0,1,2]) == 0</code>；<code>search([4,5,6,7,0,1,2], 0) == 4</code>、<code>search([4,5,6,7,0,1,2], 3) == -1</code>、<code>search([4,5,6,7,0,1,2], 4) == 0</code>（左端点）、<code>search([4,5,6,7,0,1,2], 2) == 6</code>（右端点）；</li>
<li><strong>一句话总结</strong>：旋转数组二分 = <strong>普通二分 + 每步多问一句"mid 在断崖哪边"</strong>，答案就从比较对象的选择里长出来。</li>
</ul>
