    <noscript><div class="ns-article"><h1>API 网关实战：认证、限流与路由的统一入口</h1><div class="ns-meta">2026/9/18 · Zhou Jun</div><div class="markdown-body"><h1>API 网关实战：认证、限流、路由、协议转换的统一入口设计</h1>
<blockquote>

适用读者：正在从单体走向微服务、或者多个后端服务需要统一入口的工程师
技术栈：原理与语言无关，文中涉及 Kong / APISIX / Spring Cloud Gateway / Envoy 对比
阅读时间：约 25 分钟 | 难度：中级 | 收获：网关核心能力全景 + 认证/限流/路由设计决策 + 选型 Checklist
</blockquote>
<h2>前言：从"每个服务都写一遍鉴权"说起</h2>

三年前我做的一个项目，四个后端服务（用户、订单、商品、支付），每个服务都自己实现了一遍 JWT 校验、IP 限流、请求日志。结果：
<ul>
<li>JWT 密钥轮换要改四处、发布四次；</li>
<li>限流阈值改了订单服务，忘了改支付服务，大促时支付先崩了；</li>
<li>路由规则散落在四个服务的配置文件里，排查"这个请求到底转发到了哪个服务"要翻四个仓库；</li>
<li>一个新同事写了第五个服务，忘了加限流，上线当天被爬虫打挂。</li>
</ul>

<strong>这些问题的本质是：跨切关注点（cross-cutting concerns）散落在每个服务里。</strong>

API 网关的思路很简单：<strong>把所有服务的共性需求收到一个统一入口，业务服务只关心业务逻辑。</strong>
<div class="codehilite"><pre><span></span><code>之前：
客户端 ─► 用户服务（自己鉴权、自己限流、自己记日志）
客户端 ─► 订单服务（自己鉴权、自己限流、自己记日志）
客户端 ─► 商品服务（自己鉴权、自己限流、自己记日志）

之后：
客户端 ─► API 网关（鉴权 + 限流 + 路由 + 日志 + 熔断）─► 业务服务（只写业务）
</code></pre></div>


这篇文章不打算只列功能清单，而是把网关涉及的每一个核心能力<strong>讲清楚为什么、怎么做、有什么坑</strong>。

<strong>目录</strong>
<ul>
<li>为什么需要 API 网关</li>
<li>网关的核心能力全景</li>
<li>认证：在网关层统一做，业务服务零信任</li>
<li>限流：三层粒度与两种经典算法</li>
<li>路由：从简单路径匹配到灰度发布</li>
<li>协议转换：gRPC、WebSocket、长连接</li>
<li>网关选型：Kong vs APISIX vs Spring Cloud Gateway vs Envoy</li>
<li>常见陷阱：网关单点、延迟放大、状态管理</li>
<li>上线 Checklist + 高频 FAQ</li>
</ul>
<hr>
<h2>1. 为什么需要 API 网关</h2>
<h3>1.1 没有网关的痛</h3>

假设你有 N 个后端服务，每个都要处理：
<table>
<thead>
<tr>
<th>关注点</th>
<th>每个服务重复实现</th>
<th>统一到网关</th>
</tr>
</thead>
<tbody>
<tr>
<td>身份认证</td>
<td>N 份 JWT/OAuth2 代码</td>
<td>1 份</td>
</tr>
<tr>
<td>限流</td>
<td>N 份限流逻辑，阈值难统一</td>
<td>1 份，集中管理</td>
</tr>
<tr>
<td>SSL/TLS</td>
<td>N 个证书、N 套配置</td>
<td>1 个终止点</td>
</tr>
<tr>
<td>请求日志</td>
<td>N 种格式，聚合困难</td>
<td>统一格式，直接进 ELK</td>
</tr>
<tr>
<td>CORS</td>
<td>N 个服务各自配</td>
<td>网关统一响应</td>
</tr>
<tr>
<td>熔断降级</td>
<td>N 份 Hystrix/Resilience4j</td>
<td>网关层一刀切</td>
</tr>
</tbody>
</table>

这不是"DRY 不 DRY"的代码洁癖问题。<strong>真正的代价是安全漏洞和运维事故</strong>：一个服务漏了限流、忘了关 DEBUG 日志、JWT 校验写错——任何一个都可能成为全站突破口。
<h3>1.2 网关的本质</h3>

一句话：<strong>网关是反向代理 + 跨切关注点管道。</strong>
<div class="codehilite"><pre><span></span><code>请求 ──► 网关 ──┬── 认证 ──┬── 限流 ──┬── 路由 ──┬── 转换 ──► 后端服务
                │         │         │         │
                ▼         ▼         ▼         ▼
            401/403    429      目标服务   协议适配
</code></pre></div>


网关执行的是<strong>管道模型</strong>：请求依次经过认证 → 限流 → 路由 → 转发，每一步都可以拒绝或修改请求。
<h3>1.3 什么时候不需要网关</h3>

诚实地说，<strong>不是所有系统都需要网关</strong>：
<ul>
<li>单体应用（一个后端服务）：网关是多余的，加一层多一跳延迟</li>
<li>两个后端服务且没有跨服务共性需求：用 Nginx 做反向代理就够了</li>
<li>内部服务间调用（服务网格场景）：用 Service Mesh（Istio/Linkerd），不需要 API 网关</li>
</ul>

<strong>网关的价值跟"服务数量 × 共性需求"正相关。</strong> 三个以上面向用户的服务，网关的收益开始明显。
<hr>

这篇文章重点讲认证、限流、路由、协议转换四个最核心、最容易踩坑的能力。
<hr>
<h2>3. 认证：在网关层统一做，业务服务零信任</h2>
<h3>3.1 为什么要在网关做</h3>

两个原因：
<ol>
<li><strong>安全边界</strong>：网关是流量的唯一入口，所有请求都经过它。在这里做认证，漏网之鱼为零。</li>
<li><strong>业务服务零信任</strong>：后端服务<strong>不应该</strong>信任任何调用者——包括网关。正确做法是：网关认证后，把用户身份以<strong>签名 Header 或内部 Token</strong> 传递给后端，后端校验这个内部凭证而不是重新认证。</li>
</ol>
<h3>3.2 四种认证方案</h3>
<table>
<thead>
<tr>
<th>方案</th>
<th>适用场景</th>
<th>优点</th>
<th>缺点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>JWT</strong></td>
<td>面向用户的 Web/App</td>
<td>无状态、可扩展</td>
<td>Token 吊销难（需黑名单或短 TTL）</td>
</tr>
<tr>
<td><strong>OAuth2 + PKCE</strong></td>
<td>第三方接入、开放平台</td>
<td>标准化、权限粒度细</td>
<td>流程复杂</td>
</tr>
<tr>
<td><strong>API Key</strong></td>
<td>服务间调用、开放 API</td>
<td>简单、易轮换</td>
<td>Key 管理成本高</td>
</tr>
<tr>
<td><strong>mTLS</strong></td>
<td>内部服务间通信</td>
<td>最安全（双向证书）</td>
<td>证书管理运维成本高</td>
</tr>
</tbody>
</table>
<h3>3.3 JWT 在网关层的最佳实践</h3>

最常见的模式：网关验证 JWT → 提取用户 ID → 注入 <code>X-User-Id</code> Header → 后端直接用。
<div class="codehilite"><pre><span></span><code><span class="c1"># Kong 的 jwt 插件配置示例</span>
<span class="nt">plugins</span><span class="p">:</span>
<span class="w">  </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">name</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">jwt</span>
<span class="w">    </span><span class="nt">config</span><span class="p">:</span>
<span class="w">      </span><span class="nt">secret_is_base64</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">false</span>
<span class="w">      </span><span class="nt">claims_to_verify</span><span class="p">:</span>
<span class="w">        </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">exp</span>
<span class="w">      </span><span class="nt">key_claim_name</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">iss</span>
<span class="w">      </span><span class="c1"># 验证成功后把 claims 透传给后端</span>
<span class="w">      </span><span class="nt">strip_claim</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">false</span><span class="w">    </span><span class="c1"># 保留 JWT 里的 claims，方便后端取</span>
</code></pre></div>


关键点：
<ul>
<li><strong>网关只验证签名和过期时间</strong>，不做业务授权（那是后端的事）</li>
<li><strong>不要把 JWT 原文传给后端</strong>：网关验证完后，把有用的信息提取到 Header 里，后端只信任网关注入的 Header</li>
<li><strong>JWT 的 TTL 要短</strong>（15 分钟到 1 小时），长 Token 走 Refresh Token 换票——这个流程最好也在网关层处理</li>
<li><strong>JWT 黑名单</strong>：网关本身不维护（那是 Redis 的事），网关应该调一个轻量接口查吊销状态，或干脆用短 TTL 规避</li>
</ul>
<h3>3.4 常见错误</h3>
<table>
<thead>
<tr>
<th>错误</th>
<th>后果</th>
</tr>
</thead>
<tbody>
<tr>
<td>网关认证了但后端又认证一遍</td>
<td>浪费资源，且前后端密钥不一致会出安全漏洞</td>
</tr>
<tr>
<td>后端信任客户端直接传的 <code>user_id</code></td>
<td>越权漏洞——用户 A 可以改用户 B 的数据</td>
</tr>
<tr>
<td>JWT TTL 设 24 小时</td>
<td>Token 泄漏后攻击窗口极长</td>
</tr>
<tr>
<td>网关把 JWT 原文透传给后端</td>
<td>后端可能跳过验证直接用，等于没认证</td>
</tr>
</tbody>
</table>
<hr>
<h2>4. 限流：三层粒度与两种经典算法</h2>
<h3>4.1 三层粒度</h3>

网关限流不是"一个数字搞定"，而是三层：
<table>
<thead>
<tr>
<th>粒度</th>
<th>典型配置</th>
<th>保护对象</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>全局限流</strong></td>
<td>10000 req/s</td>
<td>整个网关，防 DDoS</td>
</tr>
<tr>
<td><strong>用户/租户级</strong></td>
<td>1000 req/s per user_id</td>
<td>防单用户过载</td>
</tr>
<tr>
<td><strong>接口级</strong></td>
<td>100 req/s per /api/payment</td>
<td>保护特定脆弱接口</td>
</tr>
</tbody>
</table>

三层叠加：一个用户的支付请求，同时受"全局 10000"、"该用户 1000"、"支付接口 100"三个限制，取最严的那个。
<h3>4.2 两种经典算法</h3>

<strong>令牌桶（Token Bucket）</strong>：
<ul>
<li>桶里放令牌，以固定速率往桶里加（比如每秒 100 个）</li>
<li>每个请求消耗一个令牌，桶空了就拒绝</li>
<li><strong>允许突发</strong>：如果桶是满的，短时间内可以消耗所有令牌，适合应对突发流量</li>
</ul>
<div class="codehilite"><pre><span></span><code>桶容量 100，每秒加 10 个令牌
请求到达 ──► 桶里有没有令牌？──有──► 放行（消耗 1 个）
                    │
                    无
                    ▼
                   429 Too Many Requests
</code></pre></div>


<strong>漏桶（Leaky Bucket）</strong>：
<ul>
<li>请求进入桶，桶以<strong>固定速率</strong>出水（处理）</li>
<li>桶满了新请求直接溢出（拒绝）</li>
<li><strong>强制匀速</strong>：无论请求多猛，后端收到的速率恒定</li>
</ul>
<table>
<thead>
<tr>
<th>维度</th>
<th>令牌桶</th>
<th>漏桶</th>
</tr>
</thead>
<tbody>
<tr>
<td>突发流量</td>
<td>允许（消耗桶内积累）</td>
<td>拒绝（桶满溢出）</td>
</tr>
<tr>
<td>输出速率</td>
<td>不固定（有令牌就放）</td>
<td>固定</td>
</tr>
<tr>
<td>适用</td>
<td>正常业务（需要容纳突发）</td>
<td>下游处理能力固定的场景</td>
</tr>
<tr>
<td>实现复杂度</td>
<td>低（只维护令牌计数）</td>
<td>低（只维护队列）</td>
</tr>
</tbody>
</table>

<strong>推荐：默认用令牌桶，下游是固定速率的外部 API 时用漏桶。</strong>
<h3>4.3 限流的位置</h3>
<table>
<thead>
<tr>
<th>位置</th>
<th>优点</th>
<th>缺点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>网关层</strong></td>
<td>最早拦截，保护后端</td>
<td>无法区分同一用户的不同请求类型</td>
</tr>
<tr>
<td><strong>业务服务内</strong></td>
<td>能根据业务语义限流</td>
<td>流量已经进了服务，消耗了连接和线程</td>
</tr>
<tr>
<td><strong>CDN/WAF 层</strong></td>
<td>在边缘拦截，最快</td>
<td>只能按 IP/路径，做不到用户级</td>
</tr>
</tbody>
</table>

<strong>最佳实践：网关做用户级+全局限流，业务服务做自己特有的业务限流</strong>（比如"同一商品限购 5 件"这种语义网关理解不了）。
<h3>4.4 限流的返回</h3>

被限流的请求应该收到 <code>429 Too Many Requests</code>，并且带上 <code>Retry-After</code> 头（或 <code>X-RateLimit-Reset</code>），告诉客户端什么时候可以重试。
<div class="codehilite"><pre><span></span><code><span class="err">HTTP/</span><span class="mf">1.1</span><span class="w"> </span><span class="mi">429</span><span class="w"> </span><span class="err">Too</span><span class="w"> </span><span class="err">Ma</span><span class="kc">n</span><span class="err">y</span><span class="w"> </span><span class="err">Reques</span><span class="kc">ts</span>
<span class="err">Re</span><span class="kc">tr</span><span class="err">y</span><span class="mi">-</span><span class="err">A</span><span class="kc">fter</span><span class="p">:</span><span class="w"> </span><span class="mi">30</span>
<span class="err">X</span><span class="mi">-</span><span class="err">Ra</span><span class="kc">te</span><span class="err">Limi</span><span class="kc">t</span><span class="mi">-</span><span class="err">Limi</span><span class="kc">t</span><span class="p">:</span><span class="w"> </span><span class="mi">1000</span>
<span class="err">X</span><span class="mi">-</span><span class="err">Ra</span><span class="kc">te</span><span class="err">Limi</span><span class="kc">t</span><span class="mi">-</span><span class="err">Remai</span><span class="kc">n</span><span class="err">i</span><span class="kc">n</span><span class="err">g</span><span class="p">:</span><span class="w"> </span><span class="mi">0</span>
<span class="err">X</span><span class="mi">-</span><span class="err">Ra</span><span class="kc">te</span><span class="err">Limi</span><span class="kc">t</span><span class="mi">-</span><span class="err">Rese</span><span class="kc">t</span><span class="p">:</span><span class="w"> </span><span class="mi">1718700000</span>

<span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;error&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;rate_limit_exceeded&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;message&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;Too many requests, retry after 30 seconds&quot;</span>
<span class="p">}</span>
</code></pre></div>

<hr>
<h2>5. 路由：从简单路径匹配到灰度发布</h2>
<h3>5.1 路由的基本形式</h3>
<table>
<thead>
<tr>
<th>类型</th>
<th>示例</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>路径前缀</td>
<td><code>/api/users/*</code> → 用户服务</td>
<td>最常用</td>
</tr>
<tr>
<td>精确匹配</td>
<td><code>/health</code> → 健康检查服务</td>
<td>运维接口</td>
</tr>
<tr>
<td>Header 路由</td>
<td><code>X-API-Version: v2</code> → v2 服务</td>
<td>版本路由</td>
</tr>
<tr>
<td>权重路由</td>
<td>90% → v1, 10% → v2</td>
<td>灰度发布</td>
</tr>
<tr>
<td>参数路由</td>
<td><code>?tenant=vip</code> → VIP 集群</td>
<td>多租户隔离</td>
</tr>
</tbody>
</table>
<h3>5.2 路径设计的两个流派</h3>

<strong>前缀流派</strong>（<code>/api/v1/users/123</code>）：
<ul>
<li>优点：清晰、RESTful、网关配置简单</li>
<li>缺点：路径里带版本号，URL 变了客户端要改</li>
</ul>

<strong>子域名流派</strong>（<code>users.api.example.com/v1/123</code>）：
<ul>
<li>优点：服务隔离彻底，域名天然路由</li>
<li>缺点：DNS 配置复杂，开发环境调试麻烦</li>
</ul>

<strong>我的建议：用前缀流派。</strong> 子域名流派在"服务数超过 50"时 DNS 管理会变成灾难，而前缀流派加一个路径重写规则就能解决。
<h3>5.3 灰度发布（金丝雀发布）</h3>

网关是灰度发布的天然执行者——所有流量都经过它，在这里切流最方便。

<strong>按权重切流</strong>：
<div class="codehilite"><pre><span></span><code><span class="c1"># APISIX 路由配置示例</span>
<span class="nt">routes</span><span class="p">:</span>
<span class="w">  </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">uri</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">/api/orders/*</span>
<span class="w">    </span><span class="nt">upstream</span><span class="p">:</span>
<span class="w">      </span><span class="nt">nodes</span><span class="p">:</span>
<span class="w">        </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">host</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">orders-v1.internal</span>
<span class="w">          </span><span class="nt">port</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">8001</span>
<span class="w">          </span><span class="nt">weight</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">90</span>
<span class="w">        </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">host</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">orders-v2.internal</span>
<span class="w">          </span><span class="nt">port</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">8001</span>
<span class="w">          </span><span class="nt">weight</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">10</span>
</code></pre></div>


<strong>按条件切流</strong>（更精准）：
<div class="codehilite"><pre><span></span><code><span class="c1"># 内部员工走新版本，其他人走旧版本</span>
<span class="nt">routes</span><span class="p">:</span>
<span class="w">  </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">uri</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">/api/orders/*</span>
<span class="w">    </span><span class="nt">vars</span><span class="p">:</span>
<span class="w">      </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="p p-Indicator">[</span><span class="s">&quot;http_x_internal_user&quot;</span><span class="p p-Indicator">,</span><span class="w"> </span><span class="s">&quot;==&quot;</span><span class="p p-Indicator">,</span><span class="w"> </span><span class="s">&quot;true&quot;</span><span class="p p-Indicator">]</span>
<span class="w">    </span><span class="nt">upstream</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">orders-v2</span>
<span class="w">  </span><span class="p p-Indicator">-</span><span class="w"> </span><span class="nt">uri</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">/api/orders/*</span>
<span class="w">    </span><span class="nt">upstream</span><span class="p">:</span><span class="w"> </span><span class="l l-Scalar l-Scalar-Plain">orders-v1</span>
</code></pre></div>


灰度发布的要点：
<ol>
<li><strong>先切 1%，观察 30 分钟</strong>（错误率、延迟、业务指标），再逐步放量</li>
<li><strong>灰度期间必须可秒级回滚</strong>——网关改一条权重配置就行，不用重新发布</li>
<li><strong>灰度的维度要选对</strong>：按用户 ID 哈希比按随机权重好，保证同一用户始终走同一版本（避免"刷新一下页面就换了个版本"的困惑）</li>
</ol>
<h3>5.4 路由冲突</h3>

当多个路由规则匹配同一个请求时，网关需要确定性决策：
<ul>
<li><strong>最长前缀匹配</strong>：<code>/api/users/admin</code> 优先于 <code>/api/users/*</code></li>
<li><strong>顺序匹配</strong>：第一个匹配的规则生效（APISIX、Spring Cloud Gateway 的做法）</li>
<li><strong>优先级字段</strong>：给每个规则标优先级（Kong 的做法）</li>
</ul>

<strong>务必写测试验证路由顺序。</strong> 路由冲突导致的"该走 v1 的流量走了 v2"是最难排查的 bug 之一——因为它在监控里没有任何异常，只有业务逻辑不对。
<hr>
<h2>6. 协议转换：gRPC、WebSocket、长连接</h2>
<h3>6.1 HTTP ↔ gRPC</h3>

后端服务越来越多用 gRPC（强类型、高性能、双向流），但客户端（浏览器、移动端）通常只支持 HTTP/JSON。网关的协议转换能力解决的就是这个矛盾：
<div class="codehilite"><pre><span></span><code>浏览器 ──HTTP/JSON──► 网关 ──gRPC/Protobuf──► 后端服务
</code></pre></div>


这不只是"翻译"——还有几个关键差异要处理：
<table>
<thead>
<tr>
<th>HTTP</th>
<th>gRPC</th>
<th>网关怎么桥</th>
</tr>
</thead>
<tbody>
<tr>
<td>状态码（200/404/500）</td>
<td>0/5/13（gRPC status code）</td>
<td>维护一份映射表</td>
</tr>
<tr>
<td>请求体是 JSON</td>
<td>请求体是 Protobuf 二进制</td>
<td>反序列化 → 转换 → 序列化</td>
</tr>
<tr>
<td>同步请求-响应</td>
<td>支持双向流</td>
<td>网关可以选择"只支持 unary"或"透传流"</td>
</tr>
<tr>
<td>Header 是无序键值对</td>
<td>Metadata 是二元组数组</td>
<td>直接映射</td>
</tr>
</tbody>
</table>

<strong>生产建议</strong>：别在网关里做 JSON↔Protobuf 的手工转换（维护成本极高）。用 Envoy 的 gRPC-JSON Transcoder 或 APISIX 的 grpc-transcode 插件，它们根据 <code>.proto</code> 文件自动生成映射。
<h3>6.2 WebSocket</h3>

WebSocket 和网关是天生的"不对付"——网关设计时假设有请求-响应模型，而 WebSocket 是一个长连接。

问题：
<ul>
<li>网关的连接超时（Nginx 默认 60s）会切断空闲的 WebSocket 连接</li>
<li>网关的负载均衡策略（Round-Robin）对长连接不友好——一个新连接来了可能全打到一台机器</li>
<li>网关的限流是按请求次数，WebSocket 一个连接发 1000 条消息，限流该不该算？</li>
</ul>

配置要点：
<div class="codehilite"><pre><span></span><code><span class="c1"># Nginx 的 WebSocket 配置</span>
<span class="k">location</span><span class="w"> </span><span class="s">/ws/</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kn">proxy_pass</span><span class="w"> </span><span class="s">http://backend</span><span class="p">;</span>
<span class="w">    </span><span class="kn">proxy_http_version</span><span class="w"> </span><span class="mi">1</span><span class="s">.1</span><span class="p">;</span>
<span class="w">    </span><span class="kn">proxy_set_header</span><span class="w"> </span><span class="s">Upgrade</span><span class="w"> </span><span class="nv">$http_upgrade</span><span class="p">;</span>
<span class="w">    </span><span class="kn">proxy_set_header</span><span class="w"> </span><span class="s">Connection</span><span class="w"> </span><span class="s">&quot;upgrade&quot;</span><span class="p">;</span>
<span class="w">    </span><span class="kn">proxy_read_timeout</span><span class="w"> </span><span class="s">3600s</span><span class="p">;</span><span class="w">       </span><span class="c1"># 不要用默认 60s</span>
<span class="w">    </span><span class="kn">proxy_send_timeout</span><span class="w"> </span><span class="s">3600s</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


<strong>负载均衡策略</strong>：对 WebSocket 用 <code>ip_hash</code>（同一客户端 IP 始终到同一后端），而不是 Round-Robin。这样连接重建时不会飘到别的机器。
<h3>6.3 SSE（Server-Sent Events）</h3>

SSE 是 WebSocket 的"单向版"——服务器推流给客户端，不需要双向通信。网关对 SSE 的支持通常比 WebSocket 好（因为它仍然是 HTTP 长连接，不需要 <code>Upgrade</code>），但同样要注意<strong>别让网关的缓冲把流式响应变成批量响应</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">location</span><span class="w"> </span><span class="s">/api/events</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kn">proxy_pass</span><span class="w"> </span><span class="s">http://backend</span><span class="p">;</span>
<span class="w">    </span><span class="kn">proxy_buffering</span><span class="w"> </span><span class="no">off</span><span class="p">;</span><span class="w">           </span><span class="c1"># 关缓冲，逐行转发</span>
<span class="w">    </span><span class="kn">proxy_cache</span><span class="w"> </span><span class="no">off</span><span class="p">;</span>
<span class="w">    </span><span class="kn">chunked_transfer_encoding</span><span class="w"> </span><span class="no">on</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>

<h3>选型建议</h3>
<ul>
<li><strong>Java 团队、服务数量 &lt; 10</strong>：Spring Cloud Gateway，跟 Spring Boot 生态无缝集成，不需要额外部署</li>
<li><strong>需要高性能 + 丰富插件</strong>：APISIX，国内社区活跃，文档中文友好</li>
<li><strong>需要对接多种认证协议（OAuth2/OIDC）</strong>：Kong，插件生态最成熟</li>
<li><strong>大型系统、要配合 Service Mesh</strong>：Envoy（作为 Sidecar + 网关双重角色）</li>
<li><strong>个人项目或小团队</strong>：Nginx + Lua 脚本，或直接用云厂商的网关（阿里云 API 网关、AWS API Gateway）</li>
</ul>
<hr>
<h2>8. 常见陷阱</h2>
<h3>8.1 网关变成单点</h3>

所有流量走网关 → 网关挂了 → 全站挂。这是最常见的质疑，也是真实风险。

<strong>解法</strong>：
<ul>
<li>网关至少部署<strong>两个实例</strong>，前面加负载均衡（L4 或 DNS 轮询）</li>
<li>网关本身<strong>无状态</strong>（限流计数放 Redis，认证缓存放 Redis），实例挂了秒切换</li>
<li>网关的<strong>健康检查</strong>必须配，LB 自动摘除不健康的实例</li>
<li>极端情况：网关全挂了，能不能让客户端直连后端？（<strong>不能</strong>——因为后端没有网关的认证/限流能力。这是网关模式的安全代价，要接受）</li>
</ul>
<h3>8.2 网关引入的延迟</h3>

每多一跳就多延迟。网关的处理通常消耗 1-5ms（Lua/C++ 实现），但以下情况会显著放大：
<ul>
<li>网关做了 JWT 验证 + 数据库查询用户信息（额外的 IO）</li>
<li>网关做 JSON↔Protobuf 序列化（大 Body 时耗时）</li>
<li>网关和业务服务不在同一可用区（跨区网络延迟 1-5ms）</li>
</ul>

<strong>建议</strong>：网关和业务服务部署在同一个 VPC/可用区内，网络开销控制在 1ms 以内。
<h3>8.3 网关状态管理</h3>

网关应该是无状态的，但有些功能天然需要状态：
<table>
<thead>
<tr>
<th>有状态需求</th>
<th>推荐方案</th>
</tr>
</thead>
<tbody>
<tr>
<td>限流计数</td>
<td>Redis（原子 <code>INCR</code> + <code>EXPIRE</code>）</td>
</tr>
<tr>
<td>会话粘滞</td>
<td>一致性哈希路由（不需要存状态）</td>
</tr>
<tr>
<td>JWT 吊销列表</td>
<td>Redis（设 TTL = Token 剩余有效期）</td>
</tr>
<tr>
<td>配置热更新</td>
<td>etcd / Consul（控制面推送）</td>
</tr>
</tbody>
</table>

<strong>网关本地内存不应该存任何业务状态。</strong> 本地计数在多个网关实例下会不一致，导致限流失效。
<h3>8.4 网关的版本管理</h3>

网关配置本身就是一种"代码"，应该走版本控制：
<ul>
<li>Kong/APISIX 的配置导出为 YAML，放 Git</li>
<li>变更走 PR + Review（网关配置改错等于全站事故）</li>
<li>用声明式工具（Terraform / decK / APISIX Ingress）管理，不要手动改</li>
</ul>
<hr>
<h2>9. 上线 Checklist + 高频 FAQ</h2>
<h3>Checklist</h3>
<ul>
<li>[ ] 网关至少 2 个实例，前面有负载均衡</li>
<li>[ ] 认证密钥不在网关配置里硬编码，走环境变量或密钥管理服务</li>
<li>[ ] 限流在 Redis 上实现（非本地计数），多实例共享</li>
<li>[ ] 限流返回 <code>429</code> + <code>Retry-After</code>，不是 <code>500</code></li>
<li>[ ] WebSocket 连接超时 &gt; 3600s，SSE 关缓冲</li>
<li>[ ] 路由规则有优先级顺序，不存在歧义</li>
<li>[ ] 灰度发布有秒级回滚方案（改权重配置）</li>
<li>[ ] 网关访问日志统一格式，进 ELK/Loki</li>
<li>[ ] 网关本身有健康检查和监控（CPU、内存、延迟、5xx 率）</li>
<li>[ ] 网关配置走 Git 版本控制，变更走 PR</li>
<li>[ ] SSL 证书自动化续期（Let's Encrypt + Cert-Manager）</li>
<li>[ ] 后端服务<strong>不信任</strong>客户端传的 Header，只信任网关注入的 Header</li>
</ul>
<h3>FAQ</h3>

<strong>Q：网关挂了整个系统就挂了，这不算把风险集中了吗？</strong>

A：算，所以网关本身要做高可用（多实例 + 健康检查）。但即使网关挂了，也只是一个点挂；而如果 10 个服务各自做认证，任何一个漏了认证都是安全漏洞。<strong>网关是把"10 个分散的安全风险"换成"1 个集中的可用性风险"，后者更容易用工程手段（多实例、健康检查、自动恢复）管控。</strong>

<strong>Q：微服务一定要用 API 网关吗？</strong>

A：不一定。服务网格（Service Mesh）是另一种思路——把跨切关注点下沉到每个服务的 Sidecar 代理里，而不是集中到一个网关。网关适合"南北向流量"（外部进内部），Service Mesh 适合"东西向流量"（服务间调用）。中大型系统通常是两者结合：网关管外部入口，Service Mesh 管内部通信。

<strong>Q：网关能替代 Nginx 吗？</strong>

A：API 网关通常是基于 Nginx/OpenResty 构建的（Kong、APISIX 都是），它们比纯 Nginx 多了插件生态和控制面。如果你只需要静态文件服务 + 反向代理，用 Nginx 就够了；如果你需要认证、限流、灰度发布，用 API 网关。

<strong>Q：网关限流和 Redis 分布式限流的区别？</strong>

A：网关限流是"入口层限流"，在流量进后端之前就挡住，保护效果最好。但网关通常只能按 IP/用户/路径限流，做不到"全局限流"（所有用户共享一个总量）。如果你需要精确的全局限流（比如"整个系统每秒不超过 10000 单"），还得在业务层用 Redis 原子计数做二次限流。<strong>网关限流是第一道防线，不是最后一道。</strong>

<strong>Q：个人项目有必要上 API 网关吗？</strong>

A：大多数个人项目不需要。一个 Django/Express 应用 + Nginx 反向代理就够了。除非你有多个独立的后端服务，或者你想实践一下网关的配置和管理。
<hr>
<h2>结语</h2>

API 网关的核心思想可以用一句话概括：<strong>把服务的"怎么进"和"做什么"分开。</strong>

业务服务只需要关心"做什么"——处理业务逻辑、操作数据库、返回结果。至于"怎么进"——谁在调用、能不能调用、调得多快、走哪个版本、用什么协议——都交给网关。

回到开头那个项目：上了网关之后，四个服务的认证代码全删了，JWT 轮换改一处就行，限流阈值在 Dashboard 里改一条配置就生效。新同事写第五个服务，自带认证和限流——因为网关已经帮他做了。

但网关也不是银弹。它引入了一个新的单点、新的延迟源、新的配置复杂度。选不选网关、选哪个网关、配哪些功能，取决于你的服务规模和团队能力。

<strong>没有网关的系统不一定有问题，但有了网关的系统，跨切关注点一定不会散落。</strong> 这一点，就值回票价了。
