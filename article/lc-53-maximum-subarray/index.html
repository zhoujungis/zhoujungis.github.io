    <noscript><div class="ns-article"><h1>【LC 53】最大子数组和：Kadane 只有一句话 —— 带上前面那段，是赚了还是亏了</h1><div class="ns-meta">2026/9/28 · Zhou Jun</div><div class="markdown-body"><blockquote>

<strong>适用读者</strong>：背过 Kadane 但没想明白"为什么 <code>cur &lt; 0</code> 就敢扔掉前面整段"的人；以及想知道分治解法到底在干什么的人
<strong>技术栈</strong>：Python 为主，附 Java 版
<strong>难度</strong>：Medium —— 代码五行，但它的 DP 定义、"负资产"论证和分治的四元组，各值一场面试
<strong>收获</strong>：Kadane 的 DP 本质与"负资产"论证、返回子数组本身的写法、分治解法的四元组合并（线段树的基础）、LC 918 环形版如何把同一个算法反着用
</blockquote>
<h2>题目</h2>

给你一个整数数组 <code>nums</code>，请你找出一个具有最大和的连续子数组（子数组最少包含一个元素），返回其最大和。
<div class="codehilite"><pre><span></span><code>输入：nums = [-2,1,-3,4,-1,2,1,-5,4]
输出：6
解释：连续子数组 [4,-1,2,1] 的和最大，为 6。

输入：nums = [1]
输出：1

输入：nums = [5,4,-1,7,8]
输出：23
</code></pre></div>


这题看起来人畜无害 —— 谁不会写两层循环枚举所有子数组呢？但它是腾讯的 TOP 4、阿里数据岗的必刷题，因为它在短短五行代码里装了三样东西：
<table>
<thead>
<tr>
<th>考点</th>
<th>一句话</th>
</tr>
</thead>
<tbody>
<tr>
<td>DP 的定义方式</td>
<td>"以 <code>i</code> <strong>结尾</strong>的最大子数组和" —— 这个"结尾"是 Kadane 的灵魂</td>
</tr>
<tr>
<td>贪心的正确性</td>
<td>为什么 <code>cur &lt; 0</code> 就敢<strong>扔掉前面整段</strong>？</td>
</tr>
<tr>
<td>分治的信息合并</td>
<td>四元组 <code>(l_sum, r_sum, i_sum, m_sum)</code> —— 这正是线段树的基础</td>
</tr>
</tbody>
</table>
<hr>
<h2>一、核心洞察：整道题只有一句话</h2>

从左到右扫，只维护一个量：
<blockquote>

<strong><code>cur</code> = 以当前位置结尾的最大子数组和。</strong>
</blockquote>

扫到 <code>x</code> 时，以 <code>x</code> 结尾的最大子数组和只有两种可能：
<div class="codehilite"><pre><span></span><code>① 接在前面那段后面 → cur + x
② 从 x 自己重新开始 → x
</code></pre></div>


取更大的那个：

这是一个标准的<strong>动态规划</strong>定义：状态是"以 <code>i</code> 结尾的最大子数组和"，转移只有上面两种 —— 从 <code>O(n²)</code> 种候选坍缩到每个位置 2 种。
<div class="codehilite"><pre><span></span><code>cur = max(x, cur + x)
</code></pre></div>


<strong>这一句从头到尾只在问一件事：带上前面那段，是赚了还是亏了？</strong>

把 <code>max</code> 拆开看：
<ul>
<li>若 <code>cur + x &gt;= x</code>，即 <code>cur &gt;= 0</code> —— 前面那段<strong>不亏</strong>，带着走；</li>
<li>若 <code>cur + x &lt; x</code>，即 <code>cur &lt; 0</code> —— 前面那段是<strong>负资产</strong>，扔掉，从 <code>x</code> 重新开始。</li>
</ul>

所以"要不要重置"的判据<strong>不在 <code>x</code> 身上，而在 <code>cur</code> 身上</strong>：<code>x</code> 自己没有任何选择权，它只能决定"接上之后我值多少"；真正有选择权的是前面那段 —— 它是正的就带上，是负的就扔掉。

全程再用一个 <code>best</code> 记录 <code>cur</code> 的历史最大值。<code>best</code> 的含义是"<strong>所有位置里，以某个位置结尾的最大子数组和的最大值</strong>" —— 因为任何一个子数组都必然以某个位置结尾，所以扫完 <code>best</code> 就是全局答案。
<hr>
<h2>二、完整代码（顺带把子数组本身也返回了）</h2>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">maxSubArray</span><span class="p">(</span><span class="n">nums</span><span class="p">):</span>
    <span class="n">cur</span> <span class="o">=</span> <span class="n">best</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span>          <span class="c1"># 子数组至少含一个元素，从 nums[0] 起步</span>
    <span class="n">start</span> <span class="o">=</span> <span class="n">bestStart</span> <span class="o">=</span> <span class="n">bestEnd</span> <span class="o">=</span> <span class="mi">0</span>

    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)):</span>
        <span class="k">if</span> <span class="n">cur</span> <span class="o">&lt;</span> <span class="mi">0</span><span class="p">:</span>               <span class="c1"># 前面那段是负资产 → 扔掉，从 i 重新开始</span>
            <span class="n">cur</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="n">i</span><span class="p">]</span>
            <span class="n">start</span> <span class="o">=</span> <span class="n">i</span>
        <span class="k">else</span><span class="p">:</span>                     <span class="c1"># 前面那段是正的 → 带上</span>
            <span class="n">cur</span> <span class="o">=</span> <span class="n">cur</span> <span class="o">+</span> <span class="n">nums</span><span class="p">[</span><span class="n">i</span><span class="p">]</span>
        <span class="k">if</span> <span class="n">cur</span> <span class="o">&gt;</span> <span class="n">best</span><span class="p">:</span>            <span class="c1"># 刷新全局最优时，把当前区间记下来</span>
            <span class="n">best</span> <span class="o">=</span> <span class="n">cur</span>
            <span class="n">bestStart</span><span class="p">,</span> <span class="n">bestEnd</span> <span class="o">=</span> <span class="n">start</span><span class="p">,</span> <span class="n">i</span>

    <span class="k">return</span> <span class="n">best</span><span class="p">,</span> <span class="n">nums</span><span class="p">[</span><span class="n">bestStart</span><span class="p">:</span><span class="n">bestEnd</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]</span>
</code></pre></div>


<strong>一个必须点破的等价写法</strong>：题解里常见的 <code>cur = max(x, cur + x)</code> 和这里的 <code>if cur &lt; 0</code> 是同一件事的两种说法：
<div class="codehilite"><pre><span></span><code><span class="nv">cur</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nv">max</span><span class="ss">(</span><span class="nv">x</span>,<span class="w"> </span><span class="nv">cur</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="nv">x</span><span class="ss">)</span><span class="w">          </span>#<span class="w"> </span>值视角：两个候选取大
<span class="k">if</span><span class="w"> </span><span class="nv">cur</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">0</span>:<span class="w"> </span>从<span class="w"> </span><span class="nv">x</span><span class="w"> </span>重新开始<span class="w">       </span>#<span class="w"> </span>位置视角：判据是<span class="s2">&quot;前面那段是不是负的&quot;</span>
</code></pre></div>


写返回值用第一句最短；但<strong>"返回子数组本身"必须用第二句</strong> —— 因为位置信息只存在于第二句里。这也是为什么本文的动画用 <code>if cur &lt; 0</code> 的写法：它能让"扔掉哪段、从哪重起"变成看得见的动作。

初始化还有一个容易错的点：<strong><code>cur</code> 和 <code>best</code> 都从 <code>nums[0]</code> 起步，而不是 0</strong>。子数组至少含一个元素 —— 全负数组的答案是那个最大的负数，从 0 起步会把它错答成 0。
<div class="algo-viz algo-viz--lc53"></div>

<hr>
<h2>三、动画怎么看</h2>

画面里是一排格子，上面有三层信息：
<ul>
<li><strong>绿色色带</strong>（格子上方）：当前正在跟踪的子数组 <code>nums[start..end]</code>；</li>
<li><strong>金色边框 + 金色横线</strong>（格子下方）：历史最优区间 <code>nums[bestStart..bestEnd]</code>；</li>
<li><strong>横幅</strong>：左边是 <code>cur</code>（当前这段的和），中间是 <code>best</code>，右边是最优值。</li>
</ul>

<strong>最值得盯的是两次"重置"（第 1 帧和第 3 帧）</strong>：色带会突然缩短，而被扔掉的那几格变成<strong>灰色虚线</strong> —— 那就是"负资产被扔掉"的动作。第一次扔掉的是 <code>[-2]</code>（一格），第二次扔掉的是 <code>[1, -3]</code>（两格）。

<strong>第 6 帧（<code>i = 6</code>）是全场高潮</strong>：色带扩到 <code>[3..6]</code>，<code>cur</code> 到达 <code>6</code>，金色最优区间也推进到 <code>[3..6]</code> —— 从此再没被超过。
<hr>
<h2>四、完整推演表（10 帧逐帧）</h2>

输入 <code>nums = [-2,1,-3,4,-1,2,1,-5,4]</code>，答案 <code>6</code>，子数组 <code>[4,-1,2,1]</code>。

<tr>
<td>9</td>
<td><code>done</code></td>
<td>—</td>
<td>—</td>
<td>5</td>
<td>6</td>
<td>—</td>
<td>[3..6]</td>
<td><strong>答案 6</strong>，子数组 <code>[4,-1,2,1]</code></td>
</tr>
</tbody>
</table>

几个值得单独拎出来的观察：

<strong>帧 2 是"接上之后立刻变负"的典型</strong>。<code>cur</code> 从 <code>1</code> 接上 <code>-3</code> 变成 <code>-2</code> —— 这一帧本身没重置（因为接上时 <code>cur = 1 &gt;= 0</code>），但接完就变成了负资产，于是下一帧立刻重置。<strong>"接上的决定"和"值不值得"是两回事</strong>：接上是因为当时不亏，扔掉是因为接完变负了。

<strong>帧 7、8 是"best 不再刷新"的典型</strong>。<code>cur</code> 虽然还在波动（<code>6 → 1 → 5</code>），但始终没超过 <code>6</code>。注意 <code>cur</code> 在帧 8 回到了 <code>5</code> —— 如果数组再多一个 <code>2</code>，答案就会变成 <code>7</code>。Kadane 的 <code>cur</code> 永远"蓄势待发"。

<strong>帧 1 和帧 3 的重置对象不同</strong>：第一次扔掉一格（<code>[-2]</code>），第二次扔掉两格（<code>[1,-3]</code>）。重置的粒度完全由"<code>cur</code> 何时变负"决定，没有人工参数。
<hr>
<h2>五、为什么 <code>cur &lt; 0</code> 就敢扔掉前面整段</h2>

这是本题真正的面试考点。反着问更清楚：<strong>扔掉前面整段，难道不会扔掉最优解吗？</strong>

不会。论证只需要一句话：
<blockquote>

如果前面那段是负的（<code>cur &lt; 0</code>），那么<strong>任何</strong>以 <code>i</code> 结尾、并且<strong>包含前面那段</strong>的子数组，都比"只从 <code>i</code> 开始"的子数组<strong>更差</strong> —— 因为它们都多背了一个负数。
</blockquote>

展开说：设 <code>cur &lt; 0</code>，考察任何形如 <code>[前面某段] + nums[i..j]</code> 的候选。它的和 = <code>cur + (nums[i..j] 的和)</code>，而 <code>nums[i..j] 的和</code> 是一样的 —— 所以<strong>带上 <code>cur</code> 的版本一律比不带的小</strong>。也就是说：<strong>在"以 <code>i</code> 结尾"的这批候选里，最优的那个一定不包含前面的负段</strong>。

而 DP 的定义保证我们只关心"以 <code>i</code> 结尾"的最优 —— 扔掉负段不会漏掉任何可能性，因为<strong>最优解要么在前面已经记进 <code>best</code> 了（它的结尾在 <code>i</code> 之前），要么从 <code>i</code> 重新开始</strong>。两头都照顾到了。

一句话记法：<strong><code>cur</code> 是"必须以 <code>i</code> 结尾"这个约束下的最优；扔掉负段，只是在维护这个约束下的最优而已。</strong>
<hr>
<h2>六、分治解法：四个量与信息合并</h2>

分治把数组从中间劈开，答案只有三种来源：
<div class="codehilite"><pre><span></span><code>① 完全在左半边
② 完全在右半边
③ 跨越中点（左半边的后缀 + 右半边的前缀）
</code></pre></div>


麻烦在于 ③ —— "左半边的最大后缀和"没法从"左半边的最大子数组和"推出来。所以分治解法给每个区间<strong>多记三个量</strong>，合起来是四元组：
<div class="codehilite"><pre><span></span><code>i_sum = 区间总和
l_sum = 以左端点开头的最大子数组和（最大前缀）
r_sum = 以右端点结尾的最大子数组和（最大后缀）
m_sum = 区间内的最大子数组和
</code></pre></div>


合并公式（左区间 L、右区间 R）：
<div class="codehilite"><pre><span></span><code>i_sum = L.i_sum + R.i_sum
l_sum = max(L.l_sum, L.i_sum + R.l_sum)          # 要么不跨界，要么全吃左区间再接右边的最大前缀
r_sum = max(R.r_sum, R.i_sum + L.r_sum)          # 对称
m_sum = max(L.m_sum, R.m_sum, L.r_sum + R.l_sum) # 三种来源：在左 / 在右 / 跨中点
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">maxSubArrayDivide</span><span class="p">(</span><span class="n">nums</span><span class="p">):</span>
    <span class="k">def</span><span class="w"> </span><span class="nf">get</span><span class="p">(</span><span class="n">l</span><span class="p">,</span> <span class="n">r</span><span class="p">):</span>
        <span class="k">if</span> <span class="n">l</span> <span class="o">==</span> <span class="n">r</span><span class="p">:</span>
            <span class="n">s</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="n">l</span><span class="p">]</span>
            <span class="k">return</span> <span class="p">(</span><span class="n">s</span><span class="p">,</span> <span class="n">s</span><span class="p">,</span> <span class="n">s</span><span class="p">,</span> <span class="n">s</span><span class="p">)</span>          <span class="c1"># (l_sum, r_sum, i_sum, m_sum)</span>
        <span class="n">mid</span> <span class="o">=</span> <span class="p">(</span><span class="n">l</span> <span class="o">+</span> <span class="n">r</span><span class="p">)</span> <span class="o">//</span> <span class="mi">2</span>
        <span class="n">L</span> <span class="o">=</span> <span class="n">get</span><span class="p">(</span><span class="n">l</span><span class="p">,</span> <span class="n">mid</span><span class="p">)</span>
        <span class="n">R</span> <span class="o">=</span> <span class="n">get</span><span class="p">(</span><span class="n">mid</span> <span class="o">+</span> <span class="mi">1</span><span class="p">,</span> <span class="n">r</span><span class="p">)</span>
        <span class="n">i_sum</span> <span class="o">=</span> <span class="n">L</span><span class="p">[</span><span class="mi">2</span><span class="p">]</span> <span class="o">+</span> <span class="n">R</span><span class="p">[</span><span class="mi">2</span><span class="p">]</span>
        <span class="n">l_sum</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">L</span><span class="p">[</span><span class="mi">0</span><span class="p">],</span> <span class="n">L</span><span class="p">[</span><span class="mi">2</span><span class="p">]</span> <span class="o">+</span> <span class="n">R</span><span class="p">[</span><span class="mi">0</span><span class="p">])</span>
        <span class="n">r_sum</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">R</span><span class="p">[</span><span class="mi">1</span><span class="p">],</span> <span class="n">R</span><span class="p">[</span><span class="mi">2</span><span class="p">]</span> <span class="o">+</span> <span class="n">L</span><span class="p">[</span><span class="mi">1</span><span class="p">])</span>
        <span class="n">m_sum</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">L</span><span class="p">[</span><span class="mi">3</span><span class="p">],</span> <span class="n">R</span><span class="p">[</span><span class="mi">3</span><span class="p">],</span> <span class="n">L</span><span class="p">[</span><span class="mi">1</span><span class="p">]</span> <span class="o">+</span> <span class="n">R</span><span class="p">[</span><span class="mi">0</span><span class="p">])</span>
        <span class="k">return</span> <span class="p">(</span><span class="n">l_sum</span><span class="p">,</span> <span class="n">r_sum</span><span class="p">,</span> <span class="n">i_sum</span><span class="p">,</span> <span class="n">m_sum</span><span class="p">)</span>

    <span class="k">return</span> <span class="n">get</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">nums</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span><span class="p">)[</span><span class="mi">3</span><span class="p">]</span>
</code></pre></div>


<strong>复杂度有个流传很广的错误</strong>：很多资料写 <code>O(n log n)</code>。严格按主定理算，合并是常数次比较（<code>O(1)</code>），递归树共 <code>2n - 1</code> 个节点，所以 <code>T(n) = 2T(n/2) + Θ(1) = Θ(n)</code> —— <strong>和 Kadane 同阶</strong>。<code>O(n log n)</code> 是"朴素分治"的复杂度（每层合并都重新扫一遍区间求跨界最大值）；带四元组缓存之后，合并降到 <code>O(1)</code>，整体就是 <code>O(n)</code>。它的价值从来不在速度 —— 常数比 Kadane 大、还要 <code>O(log n)</code> 的栈空间 —— 而在<strong>可扩展性</strong>：
<blockquote>

<strong>这四个量正是线段树维护的东西。</strong> 把题目改成"支持单点修改、随时询问区间最大子数组和"，Kadane 直接报废，而这套分治改一改就是一棵线段树：单点修改 <code>O(log n)</code>、区间查询 <code>O(log n)</code>（合并时沿路径向上推四元组）。
</blockquote>

一句话：<strong>Kadane 一次性算完就丢，分治把"合并规则"存了下来 —— 前者是算法，后者是数据结构。</strong>
<hr>
<h2>七、变体一：LC 918 环形版 —— 把同一个算法反着用</h2>

环形数组里子数组可以"绕圈"。直接想会晕，但按"绕不绕"分类，答案只有两种来源：
<div class="codehilite"><pre><span></span><code>① 不绕圈：就是普通的最大子数组和 → Kadane
② 绕圈：   子数组 = 整个数组 − 中间被挖掉的那段
           要让绕圈那部分的和最大，就要让挖掉的中间段最小 → 最小子数组和
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="k">[ part1 | 被挖掉的最小段 | part2 ]</span>
<span class="w"> </span><span class="na">←────────── total ──────────→</span>
<span class="na">绕圈和</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">part1 + part2 = total − minSum</span>
</code></pre></div>


<strong>挖掉的中间段必须连续</strong> —— 所以"挖掉最小的连续段"就是"最小子数组和"，而这正是 Kadane 把 <code>max</code> 换成 <code>min</code> 的版本。同一个算法，反着用一遍：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">maxSubarraySumCircular</span><span class="p">(</span><span class="n">nums</span><span class="p">):</span>
    <span class="n">total</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="n">cur_max</span> <span class="o">=</span> <span class="n">max_sum</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span>
    <span class="n">cur_min</span> <span class="o">=</span> <span class="n">min_sum</span> <span class="o">=</span> <span class="n">nums</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span>

    <span class="k">for</span> <span class="n">x</span> <span class="ow">in</span> <span class="n">nums</span><span class="p">:</span>
        <span class="n">cur_max</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">x</span><span class="p">,</span> <span class="n">cur_max</span> <span class="o">+</span> <span class="n">x</span><span class="p">)</span>
        <span class="n">max_sum</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="n">max_sum</span><span class="p">,</span> <span class="n">cur_max</span><span class="p">)</span>
        <span class="n">cur_min</span> <span class="o">=</span> <span class="nb">min</span><span class="p">(</span><span class="n">x</span><span class="p">,</span> <span class="n">cur_min</span> <span class="o">+</span> <span class="n">x</span><span class="p">)</span>
        <span class="n">min_sum</span> <span class="o">=</span> <span class="nb">min</span><span class="p">(</span><span class="n">min_sum</span><span class="p">,</span> <span class="n">cur_min</span><span class="p">)</span>
        <span class="n">total</span> <span class="o">+=</span> <span class="n">x</span>

    <span class="k">if</span> <span class="n">max_sum</span> <span class="o">&lt;</span> <span class="mi">0</span><span class="p">:</span>
        <span class="k">return</span> <span class="n">max_sum</span>            <span class="c1"># 全负数：绕圈方案会挖空整个数组，不合法</span>
    <span class="k">return</span> <span class="nb">max</span><span class="p">(</span><span class="n">max_sum</span><span class="p">,</span> <span class="n">total</span> <span class="o">-</span> <span class="n">min_sum</span><span class="p">)</span>
</code></pre></div>


<strong>全负数边界是这道题唯一的暗礁</strong>。全负时最小的连续段就是<strong>整个数组</strong>，<code>total - minSum = 0</code> —— 那对应一个<strong>空子数组</strong>，而题目要求至少含一个元素。所以必须特判：全负时直接返回普通 Kadane 的结果（最大的那个负数）。
<div class="codehilite"><pre><span></span><code>[-3,-2,-3] → minSum 是整个数组(-8)，total - minSum = 0（空！）→ 必须返回 maxSum = -2
[5,-3,5]   → minSum 是 [-3]，total - minSum = 10 → 环形子数组 [5,5]，答案 10
</code></pre></div>


初始化也同理：<code>max_sum</code>、<code>min_sum</code> 都要从 <code>nums[0]</code> 起步而不是 0 —— 全负时"最佳答案是单个负数"，从 0 起步会错。

</tr>
<tr>
<td><code>[-1]</code></td>
<td><code>-1</code></td>
<td>全负时答案是最大的负数，<strong>不是 0</strong></td>
</tr>
<tr>
<td><code>[-5,-4,-3]</code></td>
<td><code>-3</code></td>
<td>同上</td>
</tr>
<tr>
<td><code>[0,0,0]</code></td>
<td><code>0</code></td>
<td>有 0 可取（取一个 0 就是合法子数组）</td>
</tr>
<tr>
<td><code>[1,2,3,4]</code></td>
<td><code>10</code></td>
<td>全正时整段全取</td>
</tr>
<tr>
<td><code>[10,-10,10,-10,10]</code></td>
<td><code>10</code></td>
<td>每次重置，答案都是单元素</td>
</tr>
</tbody>
</table>
<h3>常见坑</h3>

<strong>坑 1：<code>cur</code> 和 <code>best</code> 从 0 起步</strong>

子数组至少含一个元素。全负数组（如 <code>[-3,-1,-2]</code>）的正确答案是 <code>-1</code>，从 0 起步会错答成 0。<strong>必须从 <code>nums[0]</code> 起步。</strong>

<strong>坑 2：把"重置"写成 <code>cur &lt;= 0</code></strong>

<code>cur == 0</code> 时"接上"和"重起"的<strong>和</strong>一样，但<strong>区间</strong>不一样 —— 写 <code>&lt;=</code> 会把起点白白提前，返回的子数组可能带上一段无用的零前缀。判据严格写 <code>&lt; 0</code>（"前面那段是负资产"才扔）。

<strong>坑 3：918 忘了全负数特判</strong>

<code>total - minSum</code> 在全负时等于 0（空子数组）。少这一行，<code>[-3,-2,-3]</code> 会错答成 <code>0</code> 而不是 <code>-2</code>。判断方式两种都行：<code>maxSum &lt; 0</code> 或 <code>minSum == total</code>。

<strong>坑 4：918 的 <code>max_sum</code>、<code>min_sum</code> 从 0 起步</strong>

同坑 1 —— 全负时环形版的普通分支就是唯一合法答案，起步值错了整题就错。

<strong>坑 5：152 乘积版照抄 Kadane 只维护一个值</strong>

乘法里负负得正：当前最小值（一个负数）乘上新负数可能变成全局最大。必须<strong>同时维护"以 i 结尾的最大乘积"和"以 i 结尾的最小乘积"</strong> 两个量。

<strong>坑 6：认为分治是 <code>O(n log n)</code></strong>

合并四元组是 <code>O(1)</code>，递归树 <code>2n - 1</code> 个节点，总计 <code>O(n)</code>。<code>O(n log n)</code> 是朴素分治（合并时重新扫区间）的账。面试时算清楚这一步，比背复杂度表高一档。
<hr>
<h2>十二、面试怎么答</h2>
<ol>
<li>

<strong>先给 DP 定义</strong>："<code>cur</code> 表示以当前位置<strong>结尾</strong>的最大子数组和。这个'结尾'是关键 —— 它让转移只有两种可能：接上前面的，或从自己重新开始。"
</li>
<li>

<strong>写代码时点破那句话</strong>："<code>cur = max(x, cur + x)</code> 整句只在问：带上前面那段，是赚了还是亏了？<code>cur &lt; 0</code> 就是亏，扔掉重起。"
</li>
<li>

<strong>主动回答正确性</strong>（多数人跳过这步）："扔掉前面整段不会漏解 —— 前面为负时，任何包含它的候选都比不包含的差，所以'以 i 结尾'的最优一定不含负段；而更早的最优已经记在 <code>best</code> 里了。"
</li>
<li>

<strong>如果被追问返回子数组本身</strong>："把 <code>max</code> 写成 <code>if cur &lt; 0</code> 的形式，重置时记 <code>start = i</code>，刷新 <code>best</code> 时记 <code>bestStart/bestEnd</code>。值视角和位置视角是同一件事的两种写法，但位置只存在于后者。"
</li>
<li>

<strong>如果被追问分治</strong>："每个区间记四个量：最大前缀、最大后缀、总和、最大子数组和。合并公式四条，<code>m_sum</code> 的三种来源对应'在左 / 在右 / 跨中点'。合并 <code>O(1)</code>、节点 <code>O(n)</code>，总计 <code>O(n)</code> —— 它的价值是能升级成线段树，支持单点修改。"
</li>
<li>

<strong>如果被追问环形版</strong>："绕圈的子数组等于整个数组挖掉中间一段；挖得越少越好 → 挖掉最小子数组和。所以正反各跑一遍 Kadane。全负时要特判 —— 那时挖掉的是整个数组，剩下的是空子数组，不合法。"
</li>
<li>

<strong>如果被追问 121</strong>："股票的最大利润就是相邻差价数组的最大子数组和。同一个算法换了身衣服。"
</li>
</ol>
<hr>
<h2>结语</h2>

最大子数组和是那种"代码越短、越见功力"的题。

Kadane 的五行代码里，<code>cur = max(x, cur + x)</code> 只有一个决策点，但它背后是三个层次的东西：
<blockquote>

<strong>表层</strong>：两个候选取大。
<strong>DP 层</strong>：<code>cur</code> 是"以 <code>i</code> 结尾"这个约束下的最优 —— "结尾"二字让转移从 <code>O(n²)</code> 种坍缩成 2 种。
<strong>贪心层</strong>：前面那段为负时，它在"以 <code>i</code> 结尾"的所有候选里都是纯负担 —— 扔掉它不丢任何可能性。
</blockquote>

而分治和环形版各自从另一个方向切进来：分治说"把合并规则存下来，就能反复回答"（于是有了线段树）；环形版说"把同一个算法反着用，绕圈就变成了挖洞"。

最后自测一下，特别是全负数和单元素这两个"答案不是 0"的边界：
<div class="codehilite"><pre><span></span><code><span class="k">assert</span> <span class="n">maxSubArray</span><span class="p">([</span><span class="o">-</span><span class="mi">2</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">3</span><span class="p">,</span> <span class="mi">4</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">5</span><span class="p">,</span> <span class="mi">4</span><span class="p">])</span> <span class="o">==</span> <span class="mi">6</span>   <span class="c1"># 官方例</span>
<span class="k">assert</span> <span class="n">maxSubArray</span><span class="p">([</span><span class="o">-</span><span class="mi">3</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="o">-</span><span class="mi">2</span><span class="p">])</span> <span class="o">==</span> <span class="o">-</span><span class="mi">1</span>                     <span class="c1"># 全负：不是 0</span>
<span class="k">assert</span> <span class="n">maxSubArray</span><span class="p">([</span><span class="mi">1</span><span class="p">])</span> <span class="o">==</span> <span class="mi">1</span>                               <span class="c1"># 单元素</span>
<span class="k">assert</span> <span class="n">maxSubArray</span><span class="p">([</span><span class="mi">5</span><span class="p">,</span> <span class="mi">4</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">,</span> <span class="mi">7</span><span class="p">,</span> <span class="mi">8</span><span class="p">])</span> <span class="o">==</span> <span class="mi">23</span>                 <span class="c1"># 全正整段</span>
<span class="k">assert</span> <span class="n">maxSubarraySumCircular</span><span class="p">([</span><span class="mi">5</span><span class="p">,</span> <span class="o">-</span><span class="mi">3</span><span class="p">,</span> <span class="mi">5</span><span class="p">])</span> <span class="o">==</span> <span class="mi">10</span>            <span class="c1"># 环形 [5,5]</span>
<span class="k">assert</span> <span class="n">maxSubarraySumCircular</span><span class="p">([</span><span class="o">-</span><span class="mi">3</span><span class="p">,</span> <span class="o">-</span><span class="mi">2</span><span class="p">,</span> <span class="o">-</span><span class="mi">3</span><span class="p">])</span> <span class="o">==</span> <span class="o">-</span><span class="mi">2</span>          <span class="c1"># 环形全负特判</span>
</code></pre></div>
