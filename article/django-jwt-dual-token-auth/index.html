<h2>7. 注销与安全缺口：最该看的一章</h2>
<h3>7.1 现状：logout 只是前端删 key</h3>
<div class="codehilite"><pre><span></span><code><span class="nx">logout</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="nx">localStorage</span><span class="p">.</span><span class="nx">removeItem</span><span class="p">(</span><span class="s1">&#39;token&#39;</span><span class="p">)</span>
<span class="w">  </span><span class="nx">localStorage</span><span class="p">.</span><span class="nx">removeItem</span><span class="p">(</span><span class="s1">&#39;refresh_token&#39;</span><span class="p">)</span>
<span class="w">  </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


这清的是<strong>这台浏览器</strong>。refresh 在 1 天有效期内<strong>依然有效</strong>：别人拷走 refresh，照样能换 access。后端无状态，根本不知道你“退出了”。对单人博客可接受，对多用户站不可接受。
<h3>7.2 立刻能做的两件事（不改后端）</h3>
<ol>
<li><strong>改密码即吊销全部</strong>：SimpleJWT 的 refresh 里不含密码版本？默认 <code>TOKEN</code> 只认 <code>user_id</code>，改密码后旧 token 照样能用。缓解：重要操作后提示“已退出其他设备”是不诚实的，别写。真要做看 7.3。</li>
<li><strong>缩短 refresh</strong>：后台常用设备 1 天 Hoch，不常用设备每次登录都是一次风险敞口。公共电脑用完务必点退出 + 清 localStorage（F12 → Application → Clear storage）。</li>
</ol>
<h3>7.3 根治：Refresh Rotation + 黑名单（升级方案，直接抄）</h3>
<div class="codehilite"><pre><span></span><code>pip<span class="w"> </span>install<span class="w"> </span>djangorestframework-simplejwt<span class="o">[</span>token-blacklist<span class="o">]</span>
<span class="c1"># settings INSTALLED_APPS 加 &#39;rest_framework_simplejwt.token_blacklist&#39;</span>
python<span class="w"> </span>manage.py<span class="w"> </span>migrate
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="c1"># backend/blog_api/settings.py（升级后）</span>
<span class="n">SIMPLE_JWT</span> <span class="o">=</span> <span class="p">{</span>
    <span class="s1">&#39;ACCESS_TOKEN_LIFETIME&#39;</span><span class="p">:</span> <span class="n">timedelta</span><span class="p">(</span><span class="n">minutes</span><span class="o">=</span><span class="mi">60</span><span class="p">),</span>
    <span class="s1">&#39;REFRESH_TOKEN_LIFETIME&#39;</span><span class="p">:</span> <span class="n">timedelta</span><span class="p">(</span><span class="n">days</span><span class="o">=</span><span class="mi">1</span><span class="p">),</span>
    <span class="s1">&#39;ROTATE_REFRESH_TOKENS&#39;</span><span class="p">:</span> <span class="kc">True</span><span class="p">,</span>   <span class="c1"># 每次刷新都发新 refresh</span>
    <span class="s1">&#39;BLACKLIST_AFTER_ROTATION&#39;</span><span class="p">:</span> <span class="kc">True</span><span class="p">,</span>  <span class="c1"># 旧 refresh 进黑名单，用过即废</span>
    <span class="s1">&#39;AUTH_HEADER_TYPES&#39;</span><span class="p">:</span> <span class="p">(</span><span class="s1">&#39;Bearer&#39;</span><span class="p">,),</span>
<span class="p">}</span>
</code></pre></div>


开了之后 <code>/token/refresh/</code> 返回 <code>{access, refresh（新的）}</code>，旧 refresh 再用直接 401（<code>Token is blacklisted</code>）。前端我已经提前写好了兼容（<code>if (newRefresh) localStorage.setItem(...)</code>，见 6.2），后端一开即生效，不用改前端。

再加一个真正的注销接口：
<div class="codehilite"><pre><span></span><code><span class="c1"># backend/accounts/views.py（新增）</span>
<span class="kn">from</span><span class="w"> </span><span class="nn">rest_framework.decorators</span><span class="w"> </span><span class="kn">import</span> <span class="n">api_view</span><span class="p">,</span> <span class="n">permission_classes</span>
<span class="kn">from</span><span class="w"> </span><span class="nn">rest_framework.permissions</span><span class="w"> </span><span class="kn">import</span> <span class="n">IsAuthenticated</span>
<span class="kn">from</span><span class="w"> </span><span class="nn">rest_framework.response</span><span class="w"> </span><span class="kn">import</span> <span class="n">Response</span>
<span class="kn">from</span><span class="w"> </span><span class="nn">rest_framework_simplejwt.tokens</span><span class="w"> </span><span class="kn">import</span> <span class="n">RefreshToken</span>

<span class="nd">@api_view</span><span class="p">([</span><span class="s2">&quot;POST&quot;</span><span class="p">])</span>
<span class="nd">@permission_classes</span><span class="p">([</span><span class="n">IsAuthenticated</span><span class="p">])</span>
<span class="k">def</span><span class="w"> </span><span class="nf">logout</span><span class="p">(</span><span class="n">request</span><span class="p">):</span>
    <span class="n">refresh</span> <span class="o">=</span> <span class="n">request</span><span class="o">.</span><span class="n">data</span><span class="o">.</span><span class="n">get</span><span class="p">(</span><span class="s2">&quot;refresh&quot;</span><span class="p">)</span>
    <span class="k">if</span> <span class="ow">not</span> <span class="n">refresh</span><span class="p">:</span>
        <span class="k">return</span> <span class="n">Response</span><span class="p">({</span><span class="s2">&quot;detail&quot;</span><span class="p">:</span> <span class="s2">&quot;refresh required&quot;</span><span class="p">},</span> <span class="n">status</span><span class="o">=</span><span class="mi">400</span><span class="p">)</span>
    <span class="k">try</span><span class="p">:</span>
        <span class="n">RefreshToken</span><span class="p">(</span><span class="n">refresh</span><span class="p">)</span><span class="o">.</span><span class="n">blacklist</span><span class="p">()</span>  <span class="c1"># 进黑名单，此 refresh 彻底作废</span>
    <span class="k">except</span> <span class="ne">Exception</span><span class="p">:</span>
        <span class="k">pass</span>  <span class="c1"># 过期/已黑也当成功，前端照常清</span>
    <span class="k">return</span> <span class="n">Response</span><span class="p">({</span><span class="s2">&quot;detail&quot;</span><span class="p">:</span> <span class="s2">&quot;logged out&quot;</span><span class="p">})</span>
</code></pre></div>

<div class="codehilite"><pre><span></span><code><span class="c1"># urls.py 加一行</span>
<span class="n">path</span><span class="p">(</span><span class="s2">&quot;api/logout/&quot;</span><span class="p">,</span> <span class="n">logout</span><span class="p">,</span> <span class="n">name</span><span class="o">=</span><span class="s2">&quot;logout&quot;</span><span class="p">),</span>
</code></pre></div>


前端 <code>logout()</code> 改成先调接口再清本地：
<div class="codehilite"><pre><span></span><code><span class="k">async</span><span class="w"> </span><span class="nx">logout</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">  </span><span class="k">try</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">await</span><span class="w"> </span><span class="nx">client</span><span class="p">.</span><span class="nx">post</span><span class="p">(</span><span class="s1">&#39;/logout/&#39;</span><span class="p">,</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="nx">refresh</span><span class="o">:</span><span class="w"> </span><span class="nx">localStorage</span><span class="p">.</span><span class="nx">getItem</span><span class="p">(</span><span class="s1">&#39;refresh_token&#39;</span><span class="p">)</span><span class="w"> </span><span class="p">})</span>
<span class="w">  </span><span class="p">}</span><span class="w"> </span><span class="k">catch</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* 后端黑名单失败也不阻塞前端清除 */</span><span class="w"> </span><span class="p">}</span>
<span class="w">  </span><span class="k">finally</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* 原来的 removeItem 四件套 */</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这套做完才敢说“退出即吊销”。没做之前，诚实地在管理页写“退出仅清除本机登录态”都比撒谎强。

<h2>8. 调试：复现过期与 8 个大坑</h2>
<h3>8.1 本地 3 分钟复现过期续期</h3>
<div class="codehilite"><pre><span></span><code><span class="c1"># 临时把 access 调成 1 分钟（只本地！提交前改回）</span>
<span class="n">SIMPLE_JWT</span> <span class="o">=</span> <span class="p">{</span><span class="o">**</span><span class="n">SIMPLE_JWT</span><span class="p">,</span> <span class="s1">&#39;ACCESS_TOKEN_LIFETIME&#39;</span><span class="p">:</span> <span class="n">timedelta</span><span class="p">(</span><span class="n">minutes</span><span class="o">=</span><span class="mi">1</span><span class="p">)}</span>
</code></pre></div>

<ol>
<li>登录后台，等 70 秒；</li>
<li>点保存 → Network 应看到：<code>POST /admin/articles/ 401</code> → <code>POST /token/refresh/ 200</code> → <code>POST /admin/articles/ 201</code>；</li>
<li>用户侧无感，只慢了几百毫秒。这就是 single-flight + retry 的完整证据链。</li>
</ol>
<h3>8.2 8 个坑（按踩中频率排序）</h3>
<ol>
<li><strong>Authorization 头没发出去</strong>：CORS 没放行 <code>Authorization</code>。后端 <code>CORS_ALLOWED_ORIGINS</code> 精确到 <code>https://zhoujungis.github.io</code>，且 axios 手动加 Header（不是 Cookie），与 <code>CORS_ALLOW_CREDENTIALS</code> 无关。换域先查 <code>Access-Control-Allow-Headers</code>。</li>
<li><strong>Bearer 写成 Token/Basic</strong>：<code>AUTH_HEADER_TYPES = ('Bearer',)</code>，<code>Token xxx</code> 直接 401。前后统一。</li>
<li><strong>拿 access 去调 /token/refresh/</strong>：refresh 接口要的是 <code>{refresh}</code>，传 access 必 401。复制粘贴时看清 key 名。</li>
<li><strong>refresh 复用（开了 ROTATE 后）</strong>：旧 refresh 用过即黑，5 并发同时刷时没 single-flight 的 4 个全挂。见 6.2。</li>
<li><strong>时钟漂移</strong>：<code>exp</code> 按后端时间签，<code>Date.now()</code> 是前端时间，两边差 5 分钟就会“本地觉得没过期、后端说过期了”或反之。本地预判只做体验优化，<strong>最终以 401 为准</strong>。</li>
<li><strong>PA 强制 HTTPS + Secure Cookie 混用</strong>：如果以后切 HttpOnly Cookie，<code>SESSION_COOKIE_SECURE=True</code> 在本地 http 调不通，别怀疑人生，加 <code>SECURE_SSL_REDIRECT</code> 例外或本地改 False。</li>
<li><strong>localStorage 脏 JSON 白屏</strong>：<code>JSON.parse(localStorage.user)</code> 抛错把 Pinia init 炸了。<code>safeParseUser()</code> 包住（我博客真实修过，见第 5 章）。</li>
<li><strong>匿名 401 被当登录失效</strong>：公开读接口偶发 401（如 CSRF 中间件抖动）不能清 token 跳登录。靠 <code>wasAuthenticated</code> + <code>url.includes('/admin/')</code> 双判断（见 6.2）。</li>
</ol>
<hr>
<h2>9. 上线 Checklist（20 项）+ FAQ（15 问）</h2>

<strong>后端（9）</strong>
<ul>
<li>[ ] <code>ACCESS 30~60min + REFRESH 1~7天</code>，生产 <code>SECRET_KEY</code> 非默认值</li>
<li>[ ] <code>/token/</code> + <code>/token/refresh/</code> 可达，<code>AUTH_HEADER_TYPES</code> 前后一致</li>
<li>[ ] <code>/token/</code> 配 <code>login 5/min</code>、<code>refresh 30/min</code> 限流（3.5，高危）</li>
<li>[ ] 读 <code>IsAuthenticatedOrReadOnly</code>，写 <code>IsAdminUser</code>，401/403 语义分清</li>
<li>[ ] 生产只留 <code>JSONRenderer</code>（减少 token 错误信息泄露）</li>
<li>[ ] 全站 HTTPS + HSTS，CORS 精确域名不开 <code>*</code></li>
<li>[ ] 进阶：<code>token_blacklist</code> + <code>ROTATE + BLACKLIST_AFTER_ROTATION</code> + <code>/logout/</code> 黑名单接口</li>
<li>[ ] 进阶：<code>token_version</code> 字段，改密码/踢设备一键全废（5.4）</li>
<li>[ ] 登录失败日志 + 429 告警（爆破早发现）</li>
</ul>

<strong>前端（11）</strong>
<ul>
<li>[ ] 登录存 access + refresh + <code>token_expiry</code>（exp*1000）</li>
<li>[ ] 请求拦截加 <code>Bearer</code>（Cookie 模式改 <code>withCredentials</code>）</li>
<li>[ ] 响应拦截 401 单飞行刷新 + <code>_retry</code> 只一次 + <code>_skipRefresh</code> 防递归</li>
<li>[ ] <code>/token/</code> 401 不续期，匿名 401 不清登录态不跳页</li>
<li>[ ] 路由守卫过期先 <code>tryRefresh()</code> 再踢，别直接踢</li>
<li>[ ] 退出清四件套（token/expiry/refresh/user），开了黑名单先调 <code>/logout/</code></li>
<li>[ ] 脏 localStorage 不白屏（try/catch + 日志）</li>
<li>[ ] 多 Tab <code>storage</code> 事件同步登录态（6.4）</li>
<li>[ ] 编辑器草稿防丢（localStorage draft + 恢复提示）</li>
<li>[ ] 登录按钮冷却 3 秒 + 统一错误文案（防用户名枚举）</li>
<li>[ ] 公共电脑退出后手动清 Application 存储</li>
</ul>

<strong>FAQ（15 问）</strong>
<ul>
<li><strong>Q：access 1 小时，写长文保存时正好过期会丢稿吗？</strong> A：不会。拦截器自动续 + 重放原请求，编辑器等几百毫秒后拿到 201。再加草稿本地存（6.4）双保险。</li>
<li><strong>Q：refresh 1 天，出差一周回来？</strong> A：重登一次。trade-off，可按频率调 7 天，或“记住我”双档（5.4）。</li>
<li><strong>Q：localStorage 真的不如 Cookie 吗？</strong> A：有用户数据/支付直接 Cookie（4.4）；单人博客 + bleach + CSP + 短 access，localStorage 可接受。看威胁模型。</li>
<li><strong>Q：多 Tab 不同步？</strong> A：<code>storage</code> 事件监听（6.4），一处退处处退。</li>
<li><strong>Q：改密码后旧 token 失效吗？</strong> A：默认不失效。用黑名单逐个废，或 <code>token_version</code> 一键全废（5.4/7.3）。</li>
<li><strong>Q：JWT vs Session 到底选哪个？</strong> A：前后分离跨域选 JWT（2.4）；同域强管控后台 Session 吊销最爽；第三方登录加 OAuth2。</li>
<li><strong>Q：access 里塞 username/is_staff 安全吗？</strong> A：payload 可解码，只塞非敏感展示字段，敏感信息后端查库。</li>
<li><strong>Q：refresh 被偷了怎么办？</strong> A：ROTATE 让旧 refresh 用过即废（7.3）+ 短有效期 + <code>token_version</code> 一键全废。发现即改密码+版本号+1。</li>
<li><strong>Q：登录接口要不要验证码？</strong> A：<code>5/min</code> 限流后脚本效率归零，小博客可不上；被针对性打再加（滑块/turnstile），别提前过度设计。</li>
<li><strong>Q：时钟漂移导致“本地没过期后端说过期”？</strong> A：本地预判只做体验，最终以 401 + 自动续为准（坑 5）。</li>
<li><strong>Q：移动端 App 存哪？</strong> A：Keychain/Keystore（iOS/Android 安全存储），别放 AsyncStorage 明文；续期逻辑同一套。</li>
<li><strong>Q：登出后 refresh 还能用 1 天？</strong> A：没黑名单就是这样（7.1）。要真注销上 <code>/logout/</code> 黑名单（7.3）。</li>
<li><strong>Q：401 和 403 前端怎么分？</strong> A：401→续期；403→提示无权限别续。见权限矩阵（3.3）。</li>
<li><strong>Q：CORS 报错但 Postman 通？</strong> A：Postman 不走浏览器 CORS。查 <code>CORS_ALLOWED_ORIGINS</code> 精确域名 + <code>Authorization</code> 在 Allow-Headers。</li>
<li><strong>Q：PA 上 SECRET_KEY 怎么管？</strong> A：<code>.env</code> + <code>DJANGO_SECRET_KEY</code> 环境变量，绝不进 git（见 settings 注释），丢了全站 token 得重签。</li>
</ul>

<h2>10. 纵深防御 + 测试：上线前最后两块拼图</h2>
<h3>10.1 纵深防御：JWT 只是其中一层</h3>

我博客 <code>settings.py</code> 里和认证联动的四层，一眼看全：
<div class="codehilite"><pre><span></span><code><span class="n">SECURE_SSL_REDIRECT</span> <span class="o">=</span> <span class="kc">True</span>           <span class="c1"># 全站 HTTPS，token 明文传输一生黑</span>
<span class="n">SECURE_HSTS_SECONDS</span> <span class="o">=</span> <span class="mi">31536000</span>       <span class="c1"># HSTS，防 SSL 剥离</span>
<span class="n">CORS_ALLOWED_ORIGINS</span> <span class="o">=</span> <span class="p">[</span><span class="s2">&quot;https://zhoujungis.github.io&quot;</span><span class="p">]</span>  <span class="c1"># 精确域名，Cookie 模式必备</span>
<span class="n">CORS_ALLOW_ALL_ORIGINS</span> <span class="o">=</span> <span class="kc">False</span>       <span class="c1"># 永远别开 *</span>

外加内容侧 <code>bleach</code> 白名单 + 上传禁 SVG（见 XSS 那篇 + 三件套上传限流），认证侧 <code>login 5/min</code>（3.5）。攻击者要偷后台，得连过：HTTPS → 爆破限流 → XSS（bleach）→ 短 access（60min）→ 黑名单/rotation。单点被破不致命，这就是纵深。

<h2>结语</h2>

双 Token 就三句话：<strong>access 短命冲锋，refresh 长命待命，过期自动续命</strong>。难的从来不是配两个有效期，而是续期时的并发（单飞行）、边界（匿名 401 别踢人）、退出（黑名单才算真退出），再加登录口的爆破限流。把这四处做对，登录态就从“玄学掉线”变成“无感续航”。
