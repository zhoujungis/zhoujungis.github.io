<td>报错，拒绝写入</td>
</tr>
<tr>
<td><code>RESULT_PREVIEW</code></td>
<td><code>board.rs</code></td>
<td>500</td>
<td>子代理结果在列表里的预览</td>
<td>截断</td>
</tr>
</tbody>
</table></div>

三个观察：
<ol>
<li><strong>单位不统一。</strong> 有的按字节（<code>MAX_FILE_BYTES</code>、<code>CAPTURE_BYTES</code>、<code>max_output</code>），有的按"字符"名义但其实也是字节（见下一节），有的真的按字符（<code>MAX_BODY_CHARS</code>、<code>MAX_LINE_CHARS</code>）。对英文和代码影响不大，对中文和 emoji 差别是三倍。</li>
<li><strong>超限行为不统一。</strong> 三种：报错（<code>read_file</code>、<code>todo_write</code>）、截断加标注（<code>clamp</code>、<code>clip</code>、<code>CAPTURE_BYTES</code>）、静默跳过（<code>grep</code> 跳过 1 MB 以上的文件）。</li>
<li><strong>数量级分层清晰。</strong> 单次读文件最宽（4 MB），其次是网络（2 MB）、后台任务（512 KB）、前台命令（256 KB），最后统一收到 20,000 字节。这个梯度反映的是「数据从哪来」——本地文件最可信也最可控，网络最不可控。</li>
</ol>

最容易被忽略的是 <code>RESULT_PREVIEW = 500</code>：子代理结果在 <code>agent_list</code> 里的显示长度。它决定了父代理「扫一眼」任务板能看到多少，500 字符约一两句话，刚好够判断子代理是完成了还是卡住了。
<h2>统一出口：dispatch 末尾的 clamp</h2>

不管工具内部怎么封顶，最后还有一道统一的出口：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">dispatch</span><span class="p">(</span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Value</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Ctx</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">r</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">name</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="s">&quot;read_file&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">fs</span><span class="p">::</span><span class="n">read_file</span><span class="p">(</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">),</span>
<span class="w">        </span><span class="c1">// … 二十多个分支 …</span>
<span class="w">        </span><span class="n">other</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;unknown tool `{other}`&quot;</span><span class="p">)),</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="n">r</span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="n">clamp</span><span class="p">(</span><span class="n">s</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">.</span><span class="n">max_output</span><span class="p">))</span>
<span class="p">}</span>
</code></pre></div>


这一行的价值在于「不可绕过」：新增工具时作者可能忘了限输出，但只要走 <code>dispatch</code>，就一定被 <code>clamp</code> 收一遍。这是典型的「默认安全」——不安全的写法需要刻意绕过，而不是刻意加上。

<code>clamp</code> 只有十行，但有两个细节：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">clamp</span><span class="p">(</span><span class="n">s</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">max</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">s</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">max</span><span class="p">;</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">s</span><span class="p">.</span><span class="n">is_char_boundary</span><span class="p">(</span><span class="n">end</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">end</span><span class="w"> </span><span class="o">-=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;{}</span><span class="se">\n</span><span class="s">… output truncated ({} chars omitted)&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">s</span><span class="p">[</span><span class="o">..</span><span class="n">end</span><span class="p">],</span>
<span class="w">        </span><span class="n">s</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">end</span>
<span class="w">    </span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


第一个细节是<strong>字符边界回退</strong>。<code>&amp;s[..end]</code> 要求 <code>end</code> 落在 UTF-8 边界上，否则直接 panic；切到第 20,000 字节时很可能正切在某个中文字符中间（中文占三字节），所以必须往前退。最多退两个字节，但少了它，Agent 会 panic 而不是截断。

第二个细节是<strong>省略字节数</strong>。标注 <code>(3600 chars omitted)</code> 让模型知道这里少了东西，但写的是 <code>chars</code>、算的是字节。中文场景下实际省略的字符数是标注值的三分之一。

还有一处不对称：<code>Result::map</code> 只处理 <code>Ok</code> 分支，<code>Err</code> 原样透传，所以错误信息<strong>不</strong>受 <code>max_output</code> 限制。理论上工具可以返回一条超长错误把上下文撑大，实践中错误都很短，但这个差别值得记住。
<h2>clamp 的注释与实现不一致：字符还是字节</h2>

<code>Ctx</code> 里的字段声明写着：
<div class="codehilite"><pre><span></span><code><span class="sd">/// Max characters of tool output fed back to the model (keeps context small).</span>
<span class="k">pub</span><span class="w"> </span><span class="n">max_output</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">,</span>
</code></pre></div>


注释说是 <strong>characters</strong>。而 <code>clamp</code> 用的是 <code>s.len()</code>——Rust 里 <code>String::len()</code> 返回的是<strong>字节数</strong>。所以 <code>max_output = 20_000</code> 实际是 20,000 字节。

这个差别在中文内容上是三倍：纯 ASCII 的 20,000 字节正好是 20,000 字符；中文（UTF-8 三字节）只有约 6,666 字；中英混排约 10,000 字符。对读中文注释、搜中文文档、拉中文页面，这个差别都会实际发生——中文内容的可比容量只有英文的三分之一。

同一份代码里还有相反的写法：<code>web_fetch</code> 的 <code>clip_chars</code>、<code>grep</code> 的 <code>MAX_LINE_CHARS</code>、技能正文的 <code>MAX_BODY_CHARS</code> 都真的按字符。所以同一个项目里有两套语义，取决于作者当时用的是 <code>s.len()</code> 还是 <code>chars().count()</code>。

这不是需要立刻修的 bug——20,000 字节对绝大多数场景够用。但它是一个<strong>必须写进文档的不一致</strong>，因为任何基于「max_output 是字符数」的容量估算都会错。改法很简单：把 <code>Ctx</code> 的注释从 <code>Max characters</code> 改成 <code>Max bytes</code>（零成本），或把 <code>clamp</code> 改成按 <code>chars()</code> 计数（更符合直觉，但每次都要遍历字符串）。
<h2>截断的三种语义：拒绝、截断、丢弃</h2>

超限之后做什么，不是一个统一的问题。三种做法各有适用场景，选错了会制造很难查的问题。
<div class="table-scroll"><table>
<thead>
<tr>
<th>语义</th>
<th>实现</th>
<th>用在哪</th>
<th>优点</th>
<th>风险</th>
</tr>
</thead>
<tbody>
<tr>
<td>拒绝</td>
<td>返回 <code>Err</code></td>
<td><code>read_file</code> 超 4 MB、<code>todo_write</code> 超 50 条</td>
<td>模型立刻知道要换策略</td>
<td>多一次失败往返</td>
</tr>
<tr>
<td>截断加标注</td>
<td>保留前缀 + 说明省略量</td>
<td><code>clamp</code>、<code>clip</code>、<code>CAPTURE_BYTES</code></td>
<td>有信息可用，模型知道不完整</td>
<td>标注本身也占预算</td>
</tr>
<tr>
<td>静默丢弃</td>
<td>跳过，不提示</td>
<td><code>grep</code> 跳过超 1 MB 的文件</td>
<td>不打断流程</td>
<td>模型以为「没有匹配」</td>
</tr>
</tbody>
</table></div>

第三种最危险，来看具体位置：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">meta</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">fs</span><span class="p">::</span><span class="n">metadata</span><span class="p">(</span><span class="n">path</span><span class="p">)</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="p">};</span>
<span class="k">if</span><span class="w"> </span><span class="n">meta</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">MAX_FILE_BYTES</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="p">;</span><span class="w">   </span><span class="c1">// 超过 1 MB 的文件直接跳过，不报不提示</span>
<span class="p">}</span>
</code></pre></div>


如果模型在一堆小文件里搜一个字符串，而那个字符串恰好只出现在一个大文件里，它会得到 <code>no matches for ...</code>。这个结论是错的，但模型无从判断，因为它不知道有文件被跳过了。

为什么仍然选静默跳过？因为在遍历整个目录树时，为每个超限文件输出一行提示，会让「匹配不到」这种情况返回几十行噪音，反而更糟。折中方案是在最终输出里追加一句「N 个文件因体积被跳过」——只需要一个计数器，成本极低，收益是一整类误判的消除。

同理，<code>read_capped</code> 的「排空丢弃」也是一种设计：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="p">(</span><span class="k">crate</span><span class="p">)</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">read_capped</span><span class="p">(</span><span class="k">mut</span><span class="w"> </span><span class="n">r</span><span class="p">:</span><span class="w"> </span><span class="nc">impl</span><span class="w"> </span><span class="n">Read</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="p">(</span><span class="nb">Vec</span><span class="o">&lt;</span><span class="kt">u8</span><span class="o">&gt;</span><span class="p">,</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">kept</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">Vec</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">total</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="k">usize</span><span class="p">;</span>
<span class="w">    </span><span class="k">loop</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">read</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">buf</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">break</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Ok</span><span class="p">(</span><span class="n">n</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">total</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">n</span><span class="p">;</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="n">kept</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">CAPTURE_BYTES</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="kd">let</span><span class="w"> </span><span class="n">room</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">CAPTURE_BYTES</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">kept</span><span class="p">.</span><span class="n">len</span><span class="p">();</span>
<span class="w">                    </span><span class="n">kept</span><span class="p">.</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">buf</span><span class="p">[</span><span class="o">..</span><span class="n">n</span><span class="p">.</span><span class="n">min</span><span class="p">(</span><span class="n">room</span><span class="p">)]);</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="k">ref</span><span class="w"> </span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">()</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">io</span><span class="p">::</span><span class="n">ErrorKind</span><span class="p">::</span><span class="n">Interrupted</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Err</span><span class="p">(</span><span class="n">_</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">break</span><span class="p">,</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">total</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


它必须继续读完（而不是直接停止读取），否则子进程会因管道写满而阻塞。所以「丢弃」在这里是「读走但不留」，而不是「不读」。返回的 <code>total</code> 就是用来算省略量的。这个函数在三个地方被复用：<code>shell.rs</code>（前台命令）、<code>tasks.rs</code>（后台任务）、<code>git.rs</code>（git 输出），只是各自的 <code>CAPTURE_BYTES</code> 不同。
<h2>read_file：4 MB 的准入门与 2000 行的窗口</h2>

<code>read_file</code> 是使用频率最高的工具，也是唯一一个用「拒绝」而不是「截断」来保护自己的读取工具：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">meta</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">fs</span><span class="p">::</span><span class="n">metadata</span><span class="p">(</span><span class="o">&amp;</span><span class="n">full</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="k">if</span><span class="w"> </span><span class="n">meta</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">MAX_FILE_BYTES</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;{} is {} bytes (&gt; {}); read it in chunks with offset/limit&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="n">full</span><span class="p">.</span><span class="n">display</span><span class="p">(),</span><span class="w"> </span><span class="n">meta</span><span class="p">.</span><span class="n">len</span><span class="p">(),</span><span class="w"> </span><span class="n">MAX_FILE_BYTES</span>
<span class="w">    </span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


错误信息里给了明确的下一步动作：<code>read it in chunks with offset/limit</code>。这比「文件太大」有用得多——它把模型从「我该怎么办」直接引到「用 offset 和 limit」。

<code>MAX_FILE_BYTES = 4 MB</code> 这个数字怎么来的？它不是输出预算，而是<strong>内存预算</strong>。文件会被完整读进内存再按行切分，所以 4 MB 对应的是「单次分配 4 MB 是安全的」。真正的输出预算由后面两层管：2000 行的默认窗口，以及出口的 20,000 字节 <code>clamp</code>。

两者的关系值得算一遍。一个 3.5 MB、每行 100 字节的日志约 35,000 行；默认读前 2000 行约 200 KB，出口 <code>clamp</code> 再切到 20,000 字节，也就是约 200 行。于是模型以为自己要了 2000 行，实际只拿到 200 行加一条截断标注——不注意看标注，它就会基于前 200 行下结论。

更彻底的做法有两种：把 <code>limit</code> 默认值降到跟输出预算匹配（比如 300），让「请求的行数」和「拿到的行数」大致一致；或者在截断标注里写明「本文件共 N 行，你看到的是前 M 行」。NanoHermes 只做了后者的一半（有标注、默认值没调），代价是模型得自己换算。

窗口读的实现里还有一个易错的表达式：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">offset</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">limit</span><span class="p">).</span><span class="n">min</span><span class="p">(</span><span class="n">total</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">width</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">end</span><span class="p">.</span><span class="n">to_string</span><span class="p">().</span><span class="n">len</span><span class="p">();</span>
<span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">line</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">lines</span><span class="p">[(</span><span class="n">offset</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="o">..</span><span class="n">end</span><span class="p">].</span><span class="n">iter</span><span class="p">().</span><span class="n">enumerate</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">n</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">offset</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">i</span><span class="p">;</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{n:&gt;width$}→{line}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


行号右对齐的宽度取自 <code>end</code>（窗口最后一行号）而不是 <code>total</code>（文件总行数）：读第 1 到 2000 行时宽度是 4，只读第 1 到 9 行时宽度就是 1。列宽随窗口变化，不同次调用的对齐方式不一致——对模型影响很小（它读数字），但人把两次输出拼起来看 diff 时会有点干扰。
<h2>read_file 的三个细节：行号宽度、lossy 解码、二进制</h2>

除了行号宽度，<code>read_file</code> 还有两个行为值得单独说。

<strong>第一，是 <code>from_utf8_lossy</code> 而不是严格解码。</strong> 如果文件里有非法 UTF-8 字节（GBK 编码的中文文本、损坏的日志、二进制混入），<code>lossy</code> 会把这些字节替换成 <code>U+FFFD</code> 而不是报错。对 Agent 来说这是对的选择：宁可让模型看到几个替换字符，也不要因为一个坏字节整个文件读不出来。

<strong>第二，<code>read_file</code> 不做二进制检测，而 <code>grep</code> 做。</strong>
<div class="codehilite"><pre><span></span><code><span class="sd">/// Exposed for reuse by the search module.</span>
<span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">is_binary</span><span class="p">(</span><span class="n">bytes</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="kt">u8</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">bytes</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">take</span><span class="p">(</span><span class="mi">8192</span><span class="p">).</span><span class="n">any</span><span class="p">(</span><span class="o">|&amp;</span><span class="n">b</span><span class="o">|</span><span class="w"> </span><span class="n">b</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="mi">0</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


这个函数只被 <code>grep</code> 调用。<code>read_file</code> 拿到一个 2 MB 的 PNG（在 4 MB 准入门之内）会照读不误，返回一大段带 <code>` 的乱码，然后被</code>clamp<code>截到 20,000 字节。模型通常能自己意识到这是二进制文件，但这一轮基本浪费了。修法只需在</code>read_file<code>里加同一句</code>is_binary(&amp;bytes)<code>检查并返回</code>Err("… looks like a binary file")`：判据是「前 8192 字节里有 NUL 字节」，对真正的文本文件零误报，对绝大多数二进制文件都能命中——一行修一个类。
<h2>grep：200 条命中与 240 字符裁剪</h2>

<code>grep</code> 是唯一同时有四重限制的工具：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">MAX_MATCHES</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">200</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">MAX_FILES</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">500</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">MAX_FILE_BYTES</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1024</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mi">1024</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">MAX_LINE_CHARS</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">240</span><span class="p">;</span>
</code></pre></div>

<div class="table-scroll"><table>
<thead>
<tr>
<th>限制</th>
<th>值</th>
<th>作用点</th>
<th>触发的输出</th>
</tr>
</thead>
<tbody>
<tr>
<td>命中条数</td>
<td>200</td>
<td>内层循环，达标即刻停止遍历</td>
<td><code>… stopped after 200 matches</code></td>
</tr>
<tr>
<td>单文件体积</td>
<td>1 MB</td>
<td>进入文件前判断</td>
<td>无提示（静默跳过）</td>
</tr>
<tr>
<td>单行长度</td>
<td>240</td>
<td>匹配成功后的行裁剪</td>
<td>行尾 <code>…</code></td>
</tr>
<tr>
<td>文件数</td>
<td>500</td>
<td>——</td>
<td>只在 <code>glob</code> 里用，<code>grep</code> 不用</td>
</tr>
</tbody>
</table></div>

命中条数的实现有一个细节值得学：
<div class="codehilite"><pre><span></span><code><span class="n">for_each_file</span><span class="p">(</span><span class="o">&amp;</span><span class="n">base</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">path</span><span class="p">,</span><span class="w"> </span><span class="n">rel</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">truncated</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">hay</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">needle</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{}:{}:{}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">rel</span><span class="p">,</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">clip</span><span class="p">(</span><span class="n">line</span><span class="p">)));</span>
<span class="w">        </span><span class="n">hits</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">hits</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="n">MAX_MATCHES</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">truncated</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">            </span><span class="k">return</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">});</span>
</code></pre></div>


用 <code>truncated</code> 标志而不是 <code>break</code>——因为 <code>for_each_file</code> 接收的是闭包，闭包里没法写 <code>break</code>。第一行的 <code>if truncated { return }</code> 让后续文件在闭包入口就直接返回，效果等同于提前终止遍历，但遍历本身还在走（每个剩余文件都要进一次闭包）。对大仓库来说这会多走一些空转，代价可接受。

输出格式是 <code>path:line:text</code>，路径用相对路径并把反斜杠统一换成 <code>/</code>（<code>replace('\\', "/")</code>）。统一成正斜杠让输出跨平台一致，模型不用区分两种路径风格，也不会把反斜杠和分隔冒号混在一起（虽然 Windows 盘符的 <code>C:</code> 仍有歧义）。

还有一个性能隐患：大小写不敏感搜索对每一行都做一次 <code>to_lowercase()</code>，两个分配加两次遍历，一万行的文件就是几万次小分配。更快的做法是无分配的 <code>eq_ignore_ascii_case</code> 匹配。这不影响正确性，但 <code>grep</code> 是使用频率最高的工具之一，值得优化。
<h2>grep 没有文件数上限</h2>

<code>MAX_FILES = 500</code> 只出现在 <code>glob</code> 里。<code>grep</code> 遍历时不限制文件数——它只靠 <code>MAX_MATCHES</code> 兜底。

最坏场景是：在一个有 50 万个文件的目录树里搜一个几乎不存在的字符串。<code>grep</code> 会走遍每个文件（每个都做一次 <code>fs::read</code>），最后返回 <code>no matches</code>，中间可能耗掉几分钟。没有超时，没有文件数上限，也没有进度输出。<code>glob</code> 至少从第 501 个匹配起不再收集，虽然遍历同样继续。Agent 通常在项目根目录搜索，文件数在几千量级，所以这不是紧急问题；但如果工作区里有一个没被忽略规则覆盖的巨大生成目录，<code>grep</code> 就会变成一次「不返回的操作」。改进方向有两个：给 <code>for_each_file</code> 加已访问文件计数并提前终止；把忽略目录改成可配置。

顺带说一个设计上的优点：<code>grep</code> 的 <code>include</code> 参数走 <code>path_matches</code>，会同时尝试匹配相对路径和文件名：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">path_matches</span><span class="p">(</span><span class="n">pattern</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">rel</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">glob_match</span><span class="p">(</span><span class="n">pattern</span><span class="p">,</span><span class="w"> </span><span class="n">rel</span><span class="p">)</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">name</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">rel</span><span class="p">.</span><span class="n">rsplit</span><span class="p">(</span><span class="sc">&#39;/&#39;</span><span class="p">).</span><span class="n">next</span><span class="p">().</span><span class="n">unwrap_or</span><span class="p">(</span><span class="n">rel</span><span class="p">);</span>
<span class="w">    </span><span class="n">glob_match</span><span class="p">(</span><span class="n">pattern</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


所以 <code>include: "*.rs"</code> 能匹配 <code>src/main.rs</code>（用文件名匹配），<code>include: "src/**/*.ts"</code> 也能匹配（用相对路径匹配）。这个双路尝试让模型不用纠结「我该写相对路径还是文件名」，是一个很实用的小设计。
<h2>glob：500 个文件与一条假消息</h2>

<code>glob</code> 的分段匹配器有三条规则：模式用完了必须路径也用完（<code>*.rs</code> 不匹配 <code>src/main.rs</code>）；<code>**</code> 可以吃零到多段（<code>src/**/*.rs</code> 能匹配 <code>src/main.rs</code>）；普通段用 <code>*</code> 和 <code>?</code> 做段内通配（<code>*</code> 不跨 <code>/</code>）。单元测试把这三条都锁住了。

<code>for_each_file</code> 用的是显式栈而不是递归：不会因深层目录栈溢出，而且「先把条目收完再下降」避免了持有 <code>read_dir</code> 句柄时同时递归的资源问题。

最后是那条假消息。截断判断用的是：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">matches</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="n">MAX_FILES</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;</span><span class="se">\n</span><span class="s">… capped at {MAX_FILES} files&quot;</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


条件是 <code>&gt;=</code> 500。如果一个项目恰好有 500 个匹配文件（没有第 501 个），输出照样附上「已截断到 500 个」，模型会以为还有更多，去用别的办法继续找。正确判据应该是「是否因为达到上限而没收集到某个匹配」——在超出分支里把 <code>overflowed</code> 置真即可。差别只在边界情况，但「假截断」比「不截断」更容易误导：它让模型主动放弃已经拿到的完整结果。
<h2>list_dir：唯一没有上限的读取工具</h2>

<code>list_dir</code> 是这套工具里唯一一个完全不做内部限制的读取工具：列出目录下所有条目，靠出口 <code>clamp</code> 兜底。后果可以推算：5000 个文件、每行约 40 字符，总输出约 200 KB，<code>clamp</code> 切到 20,000 字节后只剩约 500 行，目录的后 90% 完全不可见。

这和 <code>read_file</code> 处理大文件的方式形成对比：<code>read_file</code> 会报错让模型分块读，<code>list_dir</code> 则默默给前 500 条，而且没有分页参数（只有 <code>path</code>），模型想「看第 501 到 1000 条」只能换个更深的子目录。典型用法（看看项目有什么）没问题，但面对构建产物、数据集这类大目录时，它会给出一幅误导性的「不完整全景」。低成本改法是加一条 300 条的内部上限，结尾注明「共 N 个条目，显示前 300」。

另一个小问题是每个文件的大小用 <code>human_size</code>（<code>1.5 MB</code> 这种）输出。对人友好，但 <code>1048576</code> 变成 <code>1.0 MB</code> 后，模型想找最大的几个文件得先解析单位再比较。这不是错，是「为谁优化」的选择。
<h2>run_command：256 KB × 2 与超时</h2>

<code>run_command</code> 是能力最强也最危险的工具。它的预算设计有四处：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">CAPTURE_BYTES</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">256</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mi">1024</span><span class="p">;</span>
</code></pre></div>

<div class="table-scroll"><table>
<thead>
<tr>
<th>约束</th>
<th>值</th>
<th>触发后的行为</th>
</tr>
</thead>
<tbody>
<tr>
<td>每个流的捕获量</td>
<td>256 KB</td>
<td>排空丢弃，报告里说明省略字节数</td>
</tr>
<tr>
<td>超时</td>
<td>默认 120s，clamp 到 1..3600</td>
<td>杀进程，报告 <code>command timed out after Ns and was killed</code></td>
</tr>
<tr>
<td>工作目录</td>
<td>默认工作区根目录</td>
<td><code>resolve</code> 到绝对路径</td>
</tr>
<tr>
<td>输出结构</td>
<td>exit code + stdout 段 + stderr 段</td>
<td>空流显示 <code>(empty)</code></td>
</tr>
</tbody>
</table></div>

256 KB 是「每个流」，所以理论最坏是 512 KB，然后又会被出口 <code>clamp</code> 收到 20,000 字节。也就是说 <code>read_capped</code> 的 256 KB 几乎从不成为用户可见的限制——它只是防止内存被一条刷屏命令吃掉。

真正会被用户看到的是超时。超时的实现是轮询：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">exit</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">loop</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">try_wait</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="nb">Some</span><span class="p">(</span><span class="n">status</span><span class="p">))</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">break</span><span class="w"> </span><span class="n">status</span><span class="p">.</span><span class="n">code</span><span class="p">(),</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="nb">None</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">start</span><span class="p">.</span><span class="n">elapsed</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="n">Duration</span><span class="p">::</span><span class="n">from_secs</span><span class="p">(</span><span class="n">timeout</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="kd">let</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">kill</span><span class="p">();</span>
<span class="w">                </span><span class="kd">let</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">wait</span><span class="p">();</span>
<span class="w">                </span><span class="n">timed_out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">                </span><span class="k">break</span><span class="w"> </span><span class="nb">None</span><span class="p">;</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">sleep</span><span class="p">(</span><span class="n">Duration</span><span class="p">::</span><span class="n">from_millis</span><span class="p">(</span><span class="mi">25</span><span class="p">));</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;failed to wait for command: {e}&quot;</span><span class="p">)),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">};</span>
</code></pre></div>


25 毫秒的轮询在灵活（能实现超时）和省 CPU 之间折中，精度约 ±25 ms，对秒级超时够用。<code>kill()</code> 后紧跟 <code>wait()</code> 也是必要的：只发信号不回收会留下僵尸进程。超时时 <code>exit</code> 是 <code>None</code>，报告写成 <code>exit code: killed</code>，让模型能区分正常失败和被超时杀掉。

<code>run_command</code> 还是少数会主动调用审批的工具：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="k">crate</span><span class="p">::</span><span class="n">sandbox</span><span class="p">::</span><span class="n">needs_approval</span><span class="p">(</span><span class="n">ctx</span><span class="p">.</span><span class="n">auto_approve</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">.</span><span class="n">approval</span><span class="p">,</span><span class="w"> </span><span class="n">command</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">confirm</span><span class="p">(</span><span class="n">command</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="s">&quot;Command denied by the user. Do not retry it; ask what to do instead.&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">());</span>
<span class="p">}</span>
</code></pre></div>


这里返回的是 <code>Ok</code> 而不是 <code>Err</code>，且文本里明确写了两条指令：<code>Do not retry it</code>（别重试）和 <code>ask what to do instead</code>（问用户）。把拒绝做成「一条给模型看的指令」而不是「一个错误」，是这套设计里最聪明的几处之一——因为对模型来说，「用户拒绝」和「命令失败」需要完全不同的反应：前者要停下来问，后者可以换命令重试。如果返回 <code>Err</code> 并写成通用错误，模型很可能把被拒绝的命令换个写法再试一次，而这正是用户拒绝的意图所在。
<h2>双线程排空：为什么不能先 wait 再 read</h2>

<code>run_command</code> 里有一段看起来多余的代码：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">out_pipe</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="p">.</span><span class="n">take</span><span class="p">().</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;stdout piped&quot;</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">err_pipe</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stderr</span><span class="p">.</span><span class="n">take</span><span class="p">().</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;stderr piped&quot;</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">out_thread</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="n">out_pipe</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">err_thread</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="n">err_pipe</span><span class="p">));</span>
</code></pre></div>


为什么不能直接 <code>child.wait_with_output()</code>？因为那会等到进程退出才开始读输出。而管道缓冲区有上限（Linux 通常 64 KB），一个输出超过 64 KB 的子进程会在写管道时阻塞，永远不退出——于是 <code>wait</code> 永远不返回。这就是经典的管道死锁。

两个线程各读一个流，主线程只负责等待和超时判断。这样即使子进程输出几兆，管道也不会被填满（因为一直有人在读走）。注释里写得很直白：
<div class="codehilite"><pre><span></span><code><span class="c1">// Drain both pipes on separate threads so a chatty child can never deadlock</span>
<span class="c1">// by filling the OS pipe buffer while we wait for it to exit.</span>
</code></pre></div>


这个模式在 <code>git.rs</code> 里被复用了一次（<code>git diff</code> 也可能输出几兆），在 <code>tasks.rs</code> 里则没有复用——这个差异正是下一节要说的缺陷。
<h2>后台任务：把长命令移出关键路径</h2>

前台 <code>run_command</code> 的超时上限是 3600 秒，但即使在范围内，让模型干等一次 <code>cargo build</code> 也不划算：这一轮的所有时间都花在等命令上，而模型其实可以去读代码、写文档，最后再回来收结果。

所以有 <code>background: true</code>：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;background&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">v</span><span class="o">|</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">as_bool</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="kc">false</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="k">super</span><span class="p">::</span><span class="n">tasks</span><span class="p">::</span><span class="n">run_background</span><span class="p">(</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="n">ctx</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


后台任务的注册表住在 <code>Ctx</code> 里，被所有工具共享，用 <code>Mutex&lt;HashMap&lt;String, Task&gt;&gt;</code> 保护：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">TaskManager</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">tasks</span><span class="p">:</span><span class="w"> </span><span class="nc">Mutex</span><span class="o">&lt;</span><span class="n">HashMap</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">Task</span><span class="o">&gt;&gt;</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


任务 id 是「进程 id + 纳秒时间戳」。用纳秒而不是自增计数器，是为了同一毫秒内启动多个任务时不冲突，也省掉一个全局计数器；带进程 id 则是让<strong>跨进程</strong>的日志能看出任务属于哪个 agent 实例。

配套的三个管理工具形成完整的生命周期：<code>task_list</code> 看有哪些任务和状态，<code>task_output</code> 收增量输出，<code>task_kill</code> 终止。<code>output()</code> 的实现是「drain 增量」而不是「返回全量」：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">output</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">task_id</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">map</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">tasks</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">task</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">map</span><span class="p">.</span><span class="n">get_mut</span><span class="p">(</span><span class="n">task_id</span><span class="p">).</span><span class="n">ok_or</span><span class="p">(</span><span class="cm">/* unknown task */</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">child</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">task</span><span class="p">.</span><span class="n">child</span><span class="p">.</span><span class="n">as_mut</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="p">.</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">total</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="p">);</span>
<span class="w">            </span><span class="n">task</span><span class="p">.</span><span class="n">out_buf</span><span class="p">.</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">kept</span><span class="p">);</span>
<span class="w">            </span><span class="n">task</span><span class="p">.</span><span class="n">out_total</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">total</span><span class="p">;</span>
<span class="w">            </span><span class="n">child</span><span class="p">.</span><span class="n">stdout</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">out</span><span class="p">);</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="c1">// …</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// …</span>
<span class="p">}</span>
</code></pre></div>


<code>take()</code> 之后又放回去，是因为 <code>read_capped</code> 按值接收 reader；写法有点绕，但避免了给 <code>Task</code> 加额外的生命周期参数。

累计输出受 <code>CAPTURE_BYTES = 512 KB</code> 限制，比前台命令的 256 KB 大一倍。理由是合理的：后台任务的输出会被多次 <code>task_output</code> 分批取走，累计量自然更大，而且它是「累计保留」而不是「单次报告」。
<h2>后台任务的一个真实缺陷：stderr 从未被读走</h2>

看 <code>TaskManager::spawn</code> 里的进程配置：
<div class="codehilite"><pre><span></span><code><span class="n">cmd</span><span class="p">.</span><span class="n">current_dir</span><span class="p">(</span><span class="n">cwd</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">stdin</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">null</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">stdout</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">piped</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">stderr</span><span class="p">(</span><span class="n">Stdio</span><span class="p">::</span><span class="n">piped</span><span class="p">());</span>
</code></pre></div>


stdout 和 stderr 都被设成了管道。但回头看上一节的 <code>output()</code>：它只 <code>take()</code> 并读取 <code>child.stdout</code>。<code>Task</code> 结构体里也只有一个 <code>out_buf</code> 字段，没有对应的错误缓冲区。stderr 被设成管道后，<strong>没有任何代码去读它</strong>。

这意味着一件很严重的事：如果一个后台命令往 stderr 写超过管道缓冲区（常见是 64 KB），它会在写 stderr 时永久阻塞，进程永远不退出，<code>task_output</code> 永远显示 <code>running</code>。而模型会一直轮询一个永远不会完成的任务。

什么时候会遇到？比想象的多：
<div class="table-scroll"><table>
<thead>
<tr>
<th>场景</th>
<th>stderr 输出量</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>cargo build</code>（进度条、warning）</td>
<td>编译警告很容易超过 64 KB</td>
</tr>
<tr>
<td><code>npm install</code>（弃用警告、audit 报告）</td>
<td>常见几 KB 到几十 KB</td>
</tr>
<tr>
<td>任何带进度条的 CLI（pip、docker）</td>
<td>进度条持续重绘，量很大</td>
</tr>
<tr>
<td>一个报了很多错的测试命令</td>
<td>无上限</td>
</tr>
</tbody>
</table></div>

对照组是前台 <code>run_command</code>：它用两个线程同时排空两个管道，所以同样的问题不存在。<code>git.rs</code> 的 <code>run_git</code> 也做了同样的事（两个线程）。只有后台任务这条路径漏了。

修法有两种：把 stderr 合并进 stdout（<code>2&gt;&amp;1</code>，但要改命令字符串，不干净），或者给 <code>Task</code> 加一个 <code>err_buf</code>，在 <code>output()</code> 里同样 drain stderr。后者更正确：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="k">mut</span><span class="w"> </span><span class="n">err</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">child</span><span class="p">.</span><span class="n">stderr</span><span class="p">.</span><span class="n">take</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="p">(</span><span class="n">kept</span><span class="p">,</span><span class="w"> </span><span class="n">total</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">read_capped</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">err</span><span class="p">);</span>
<span class="w">    </span><span class="n">task</span><span class="p">.</span><span class="n">err_buf</span><span class="p">.</span><span class="n">extend_from_slice</span><span class="p">(</span><span class="o">&amp;</span><span class="n">kept</span><span class="p">);</span>
<span class="w">    </span><span class="n">task</span><span class="p">.</span><span class="n">err_total</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">total</span><span class="p">;</span>
<span class="w">    </span><span class="n">child</span><span class="p">.</span><span class="n">stderr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">err</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


这样既解决阻塞，也让错误信息可见——现在后台任务的 stderr 内容是完全丢失的，模型只能看到 stdout。对一个 Agent 工具来说，「命令失败了但看不到错误信息」是个很糟糕的状态。

这个缺陷值得单独列出来，因为它完美展示了一类问题：<strong>同一个项目里，两条相似路径（前台/后台）采用了不同的排空策略，其中一条是错的，而没有测试覆盖「后台命令输出大量 stderr」这个场景</strong>。这类问题靠代码审查很难发现，因为错误路径看起来完全正常——它只是永远不结束。
<h2>web_fetch：2 MB 与 20,000 字符</h2>

网络是三个无限来源里最不可控的。<code>web_fetch</code> 为此做了两层限制：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">MAX_RESPONSE_BYTES</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mi">1024</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mi">1024</span><span class="p">;</span>

<span class="kd">let</span><span class="w"> </span><span class="n">max_chars</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span>
<span class="w">    </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;max_chars&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">v</span><span class="o">|</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">as_u64</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="mi">20_000</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">clamp</span><span class="p">(</span><span class="mi">500</span><span class="p">,</span><span class="w"> </span><span class="mi">200_000</span><span class="p">)</span><span class="w"> </span><span class="k">as</span><span class="w"> </span><span class="kt">usize</span><span class="p">;</span>
</code></pre></div>


第一层是响应体：最多留 2 MB，其余读走丢弃。第二层是文本裁剪：<code>clip_chars</code> 按<strong>字符</strong>裁到 <code>max_chars</code>，默认 20,000。注意这一层和出口 <code>clamp</code> 的 20,000 字节语义不同——<code>web_fetch</code> 先按字符裁到 20,000 字，如果这是中文，就是 60,000 字节，然后再被出口 <code>clamp</code> 切到 20,000 字节。两次裁剪都有用，但第二次才是最终生效的那个。

<code>max_chars</code> 被 clamp 在 500 到 200,000 之间。下限 500 防止模型要一个没用的碎片；上限 200,000 防止一次要 100 MB 文本。但上限 200,000 其实永远不会生效，因为出口 <code>clamp</code> 只有 20,000 字节——一个诚实的参数范围应该是 <code>clamp(500, 20_000)</code>，或者至少让参数上限和出口预算一致。

响应体保留量的检查也值得看：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;URL: {url}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">);</span>
<span class="k">if</span><span class="w"> </span><span class="n">total</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">bytes</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[response truncated at {MAX_RESPONSE_BYTES} bytes]</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">));</span>
<span class="p">}</span>
<span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="n">clip_chars</span><span class="p">(</span><span class="o">&amp;</span><span class="n">text</span><span class="p">,</span><span class="w"> </span><span class="n">max_chars</span><span class="p">));</span>
</code></pre></div>


<code>total &gt; bytes.len()</code> 这个判断是「实际读到多少 vs 保留了多少」，比「响应头里的 Content-Length」可靠——因为分块传输、gzip 压缩都可能让 Content-Length 缺失或不准。这是「按实际发生的事实判断」而不是「按声明判断」，在 HTTP 场景下是唯一正确的做法。

<code>web_search</code> 只有结果条数限制（<code>count</code> 默认 5，clamp 到 1..10）。这是合理的：搜索结果结构固定（标题 + URL + 摘要），条数就是长度的唯一决定因素。但如果单个摘要特别长，输出仍可能很大——只是被出口 <code>clamp</code> 兜住。

最后注意「限制输出」不等于「限制计算量」：<code>html_to_text</code> 要遍历整个 HTML 做标签剥离、实体解码、空白折叠，最后才裁剪，所以一个 2 MB 的页面仍会被完整解析一遍。对 Agent 的调用频率无所谓，但如果把 <code>web_fetch</code> 放进循环跑几千次，瓶颈就在这里。
<h2>skill 与项目文档：同样吃预算</h2>

两个不是「工具输出」但同样吃预算的地方也有上限。

<strong>技能正文</strong>：<code>skills.rs</code> 的 <code>MAX_BODY_CHARS = 20_000</code>。<code>skill</code> 工具加载一个技能时会返回完整正文，如果技能文档写得极长，就会把上下文挤满。20,000 字符和 <code>web_fetch</code> 的默认值一致，是一个「够详尽的说明文档，但不会喧宾夺主」的量级。

<strong>项目文档</strong>：<code>prompt.rs</code> 的 <code>MAX_PROJECT_DOCS = 20_000</code>。这里处理的是 <code>AGENTS.md</code>——全局的一份加上从仓库根目录到工作区沿途的每一份，拼接后的总量受 20,000 字符限制，超了就截断并追加 <code>… project guidance truncated</code>。
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">MAX_PROJECT_DOCS</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">20_000</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">DOC_NAMES</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="o">&amp;</span><span class="kt">str</span><span class="p">;</span><span class="w"> </span><span class="mi">1</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">[</span><span class="s">&quot;AGENTS.md&quot;</span><span class="p">];</span>
</code></pre></div>


拼接顺序是「全局 → 根目录 → … → 工作区」，并用 <code>canonicalize</code> 去重（防止符号链接让同一文件被读两次）。这里有个真实的风险：截断是从尾部切的，而排在尾部的正是<strong>最靠近工作区、也最具体</strong>的那份约定。仓库根目录写 15,000 字符、子目录再写 8,000 字符，总长 23,000 超限，被切掉的恰恰是子目录那份的后半部分。更合理的策略是「从工作区往上收集，总量够了就停」，保留最具体的那部分。

技能列表也占预算，但每个技能只有一行，所以影响线性且很小；真正的大头是用 <code>skill</code> 工具加载技能时的正文。这个设计是对的：<strong>索引常驻，正文按需拉取</strong>，和 RAG 思路一致，只是索引极简。
<h2>错误即结果：Err(String) 的另一半价值</h2>

工具层的所有失败都用 <code>Result&lt;String, String&gt;</code> 表达，错误是字符串。这个决定有三层含义。

第一层是<strong>错误文本是给模型看的</strong>，不是给日志看的。所以每条错误都写成了「出了什么问题 + 该怎么办」：
<div class="table-scroll"><table>
<thead>
<tr>
<th>工具</th>
<th>错误文本</th>
<th>给模型的下一步</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>read_file</code></td>
<td><code>… is N bytes (&gt; 4194304); read it in chunks with offset/limit</code></td>
<td>用 offset/limit 分块读</td>
</tr>
<tr>
<td><code>edit_file</code></td>
<td><code>`old_string` not found in … — read the file and match it exactly, including whitespace</code></td>
<td>先读文件，注意空白</td>
</tr>
<tr>
<td><code>edit_file</code></td>
<td><code>`old_string` occurs 3 times; pass replace_all=true or provide more context</code></td>
<td>加参数或补充上下文</td>
</tr>
<tr>
<td><code>grep</code></td>
<td><code>no matches for `xxx`</code></td>
<td>换个词，或确认范围</td>
</tr>
<tr>
<td><code>skill</code></td>
<td><code>unknown skill `x`; available: a, b, c</code></td>
<td>从可用列表里选</td>
</tr>
<tr>
<td><code>subagent</code></td>
<td><code>unknown sub-agent `x`</code></td>
<td>换个名字</td>
</tr>
<tr>
<td><code>git</code></td>
<td><code>git status exited with 128\n…</code></td>
<td>附带 git 自己的报错</td>
</tr>
</tbody>
</table></div>

<code>skill</code> 那条把可用名字都列出来了，<code>git</code> 那条把 git 的 stderr 拼进来了。这两条都是「把模型需要的信息放在错误里」，避免了「报错 → 再查一次可用列表 → 再调用」的两轮往返。

第二层是<strong>错误不会中断轮次</strong>。<code>execute</code> 把错误包装成工具结果字符串，继续下一轮：
<div class="codehilite"><pre><span></span><code><span class="c1">// tools::dispatch 的 Err 在 run_tool 里被格式化成 `ERROR: {e}`</span>
</code></pre></div>


如果工具错误直接冒泡成异常，一次拼错参数就会终止整个任务。做成字符串意味着模型看到 <code>ERROR: …</code> 之后可以自己纠正——读文件、改参数、重试。这是 Agent 和普通程序最大的差别之一：<strong>错误是一等输入，不是例外</strong>。

第三层是一个反直觉的推论：错误文本也应该有上限，而现在没有。<code>clamp</code> 只作用于 <code>Ok</code> 分支。如果某个工具返回一条 100 KB 的错误（比如把整个 <code>git diff</code> 当成失败信息返回），它会原样进上下文。实践中没有工具这么做，但「出口只保护成功路径」是一个应该被记住的不对称。
<h2>审批与确认：哪些工具默认要问</h2>

工具的能力和危险程度不成正比。<code>read_file</code> 再怎么写也不会毁掉代码；<code>run_command</code> 一条 <code>rm -rf</code> 就够了。所以工具还要按危险程度分级管控。

<code>check_tool</code> 是第一道闸门，任何工具在执行前都要过：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">check_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="p">(),</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">permission_mode</span><span class="p">.</span><span class="n">blocked_tools</span><span class="p">().</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;tool `{name}` is not available in {:?} mode&quot;</span><span class="p">,</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">permission_mode</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">disallowed_tools</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;tool `{name}` is disallowed by configuration&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;tool `{name}` is not in the allowed list&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(())</span>
<span class="p">}</span>
</code></pre></div>


顺序有讲究：模式封禁最优先（「当前场景不允许」），然后黑名单（用户明确不要的），最后白名单（只允许这些，属于「收窄」逻辑，只需在前两条都没否掉时判断）。注意被封禁的工具<strong>根本不会出现在工具列表里</strong>（<code>build_tools</code> 里的 <code>retain</code>），而 <code>check_tool</code> 的报错发生在调用时。前者防「模型选错」，后者防「绕过」——如果模型从历史消息里学到一个当前不可用的工具名并尝试调用，会在这里被拦住。

第二道闸门是<strong>执行前的交互确认</strong>，只针对命令类工具：
<div class="table-scroll"><table>
<thead>
<tr>
<th>工具</th>
<th>默认是否确认</th>
<th>依据</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>run_command</code></td>
<td>按 <code>approval</code> 策略</td>
<td>命令不可静态分析</td>
</tr>
<tr>
<td><code>git_commit</code></td>
<td>按 <code>approval</code> 策略</td>
<td>写历史，但可撤销</td>
</tr>
<tr>
<td><code>write_file</code> / <code>edit_file</code> / <code>apply_patch</code></td>
<td>否（除特定模式）</td>
<td>文件可回滚</td>
</tr>
</tbody>
</table></div>

五种权限模式覆盖了主要场景：
<div class="table-scroll"><table>
<thead>
<tr>
<th>模式</th>
<th>阻断的工具</th>
<th>典型用法</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code></td>
<td>无</td>
<td>日常使用</td>
</tr>
<tr>
<td><code>accept-edits</code></td>
<td>无（但强制保留 shell 确认）</td>
<td>信任文件编辑、不信命令</td>
</tr>
<tr>
<td><code>plan</code></td>
<td><code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>run_command</code>、<code>git_commit</code></td>
<td>只读分析</td>
</tr>
<tr>
<td><code>debug</code></td>
<td><code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>git_commit</code></td>
<td>可以跑命令复现，但绝不改文件</td>
</tr>
<tr>
<td><code>goal</code></td>
<td>无（且不确认任何操作）</td>
<td>无人值守</td>
</tr>
</tbody>
</table></div>

<code>plan</code> 和 <code>debug</code> 的区别很能说明问题：<code>plan</code> 连 <code>run_command</code> 都禁掉（计划阶段不应该有副作用），<code>debug</code> 允许跑命令复现问题，但绝不允许改文件——「不要把已经坏掉的状态弄得更坏」。

这个设计把「工具的能力」和「场景的约束」分开了：工具和 <code>Ctx</code> 都不需要知道对方，两者在一个统一的检查函数里汇合。新增工具时只需考虑两件事：名字要不要进某个模式的封禁列表，以及是否需要交互确认。
<h2>只读工具会跳过哪些目录</h2>

<code>for_each_file</code> 有一份硬编码的忽略目录列表：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">is_ignored_dir</span><span class="p">(</span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">matches!</span><span class="p">(</span><span class="n">name</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;.git&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;target&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;node_modules&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;__pycache__&quot;</span>
<span class="w">        </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.venv&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;venv&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;dist&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;build&quot;</span>
<span class="w">        </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.idea&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.cache&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.next&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;vendor&quot;</span>
<span class="w">        </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.tox&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.mypy_cache&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.ruff_cache&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;.pytest_cache&quot;</span>
<span class="w">    </span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


十五个名字覆盖主流生态的构建产物目录：Rust 的 <code>target</code>、Node 的 <code>node_modules</code> / <code>dist</code> / <code>build</code> / <code>.next</code>、Python 的 <code>__pycache__</code> / <code>.venv</code> / <code>.tox</code> 与各种缓存、PHP 的 <code>vendor</code>、IDE 的 <code>.idea</code>。这解决的是很实际的问题：一个中等 Node 项目的 <code>node_modules</code> 可能有十万个文件，不跳过的话「全局找一下这个名字」就会遍历十万个第三方文件。硬编码的优点是开箱即用，缺点是遇到列表外的生成目录（<code>out</code>、<code>bin</code>、<code>obj</code>、<code>.gradle</code>、<code>Pods</code>）只能改代码。

<code>grep</code> 和 <code>glob</code> 都走 <code>for_each_file</code>，共享这份列表；<code>list_dir</code> 不走它，所以列目录时能看到 <code>node_modules</code>（这通常正是用户想要的）。这个区分是对的：<strong>搜索要过滤，列举要完整</strong>。
<h2>输出顺序：稳定排序为什么重要</h2>

三个工具在返回前会排序，理由都值得记一下。

<code>list_dir</code> 把目录和文件分开排序：
<div class="codehilite"><pre><span></span><code><span class="n">dirs</span><span class="p">.</span><span class="n">sort</span><span class="p">();</span>
<span class="n">files</span><span class="p">.</span><span class="n">sort</span><span class="p">();</span>
</code></pre></div>


先输出全部目录再输出全部文件。不排序的话顺序取决于文件系统返回顺序（Linux 上通常是 inode 顺序，看起来是随机的），模型很难判断哪些是主要目录；「目录在前、按字母序」则是人和模型都容易理解的约定。

<code>glob</code> 也排序（<code>matches.sort()</code>）。<code>for_each_file</code> 用栈（<code>pop</code> 取最后一个），收集顺序是「深度优先但逆序」，天然是乱的；排序后同一个模式两次调用返回完全一致的顺序，对缓存结果和对比差异都很重要。

<code>grep</code> <strong>不</strong>排序：按遍历顺序输出命中行，文件内是行号升序，跨文件是遍历顺序，但结果带 <code>path:line</code> 前缀，信息不丢失。不排序的好处是截断发生时被截掉的必然是「遍历靠后」的文件，否则得先收集全部命中才能排序。

三条规则合起来是一个原则：<strong>凡是会「按位置截断」的输出，顺序就决定了什么会被保留</strong>。<code>list_dir</code> 不截断，顺序只是可读性问题；<code>glob</code> 的顺序决定了 500 个文件里保留哪 500 个；<code>grep</code> 的顺序决定了 200 条命中里保留哪 200 条。后者最值得改进——按「路径 + 行号」排序再截断会让输出稳定得多，代价是多占一点内存。
<h2>工具的隐性成本：token、选择困难与误用</h2>

工具不是免费的。每个工具都要在每次请求里带上完整定义，24 个工具大约占 2,500 到 4,000 个 token（取决于描述长度）。按 100 轮对话算，光工具定义就是几十万 token 的输入。

更重要的成本不是钱，是<strong>选择困难</strong>。工具越多，模型选错的概率越高。特别容易混淆的组合有：

<thead>
<tr>
<th>容易混淆的一对</th>
<th>区别</th>
<th>缓解手段</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>write_file</code> vs <code>edit_file</code></td>
<td>整体覆盖 vs 精确替换</td>
<td><code>write_file</code> 描述里写明 <code>Prefer edit_file for small changes</code></td>
</tr>
<tr>
<td><code>edit_file</code> vs <code>apply_patch</code></td>
<td>单点替换 vs 多处改动</td>
<td><code>apply_patch</code> 描述里写明 <code>instead of edit_file</code> 与多行场景</td>
</tr>
<tr>
<td><code>grep</code> vs <code>glob</code></td>
<td>搜内容 vs 搜文件名</td>
<td>描述里分别用 <code>file contents</code> 和 <code>Find files by</code></td>
</tr>
<tr>
<td><code>run_command</code> vs <code>task_output</code></td>
<td>执行 vs 收结果</td>
<td><code>run_command</code> 描述里指明「后台执行后用 task_output 轮询」</td>
</tr>
<tr>
<td><code>memory_save</code> vs <code>todo_write</code></td>
<td>跨会话 vs 会话内</td>
<td>两者描述里都强调了各自的持久性范围</td>
</tr>
<tr>
<td><code>web_fetch</code> vs <code>web_search</code></td>
<td>读已知 URL vs 找未知 URL</td>
<td><code>web_search</code> 描述里指明后续用 <code>web_fetch</code></td>
</tr>
</tbody>
</table></div>

第三列是最有价值的技巧：<strong>用描述消除歧义，而不是靠模型猜</strong>。每一对容易混淆的工具，至少有一方的描述里出现了另一方的名字。工具集越大，这条越该成为硬性要求。

另一类隐性成本是<strong>能力重叠</strong>：<code>apply_patch</code> 能做的 <code>edit_file</code> 基本都能做。重复不是错误，它给了模型更多选择，但要求描述足够清楚，否则模型会随手选一个，失败再换另一个试。
<h2>工具设计八条原则</h2>

把上面所有观察收拢，可以提炼出八条可以直接用的规则。

<strong>一、每个输出都必须有上限，且默认生效。</strong> 上限不是「这个工具可能会很长所以加一下」，而是「所有工具都加，然后对确实不会长的工具放宽」。默认安全，而非默认信任。

<strong>二、上限要分层，不能只有一层。</strong> 枚举前过滤（文件体积）、读取时限制（捕获字节数）、产出后裁剪（单行长度）、出口兜底（全局 clamp）。只有出口兜底的话，内存和耗时问题照样发生。

<strong>三、超限必须可见。</strong> 三种语义里，「静默丢弃」只应该用在「提示本身会造成噪音」的场景，且应该有一个计数汇总。模型不知道信息不完整，就会基于不完整信息给结论——这是最贵的失败模式。

<strong>四、错误文本要写「下一步做什么」。</strong> 不是 <code>file too large</code>，而是 <code>read it in chunks with offset/limit</code>。同理，拒绝要写成指令：<code>Do not retry it; ask what to do instead</code>。

<strong>五、拒绝用 <code>Ok</code> + 指令，失败用 <code>Err</code> + 原因。</strong> 两者对模型意味着完全不同的反应。混在一起会让模型对被拒绝的操作反复重试。

<strong>六、默认值必须覆盖最常见用法，且不能产生危险行为。</strong> <code>offset: 1</code>、<code>limit: 2000</code>、<code>timeout: 120</code>、<code>max_chars: 20000</code> 都是「常见且安全」。反过来，如果一个参数的危险值恰好是默认值（比如「默认删除」），设计就错了。

<strong>七、单位要统一，或者明确标注。</strong> 同一个项目里混用字节和字符是源头性混乱，因为它不报错、只让所有容量估算偏离。选一种，写进字段注释。

<strong>八、用描述消除工具之间的歧义。</strong> 每对容易混淆的工具，至少一方的描述里要点名另一方。这是投入产出比最高的一项工作。

还有一条不在这八条里但同样重要：<strong>给相似的两条代码路径写对称的实现</strong>。前台命令和后台任务的排空策略不一致，直接导致了 stderr 死锁。如果写后台任务时把前台的 <code>run_command</code> 打开对照一遍，这个问题五分钟就能发现。
<h2>九个常见陷阱</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>陷阱</th>
<th>表现</th>
<th>修法</th>
</tr>
</thead>
<tbody>
<tr>
<td>工具输出无上限</td>
<td>一次调用就把上下文挤爆，触发压缩</td>
<td>出口统一 <code>clamp</code> + 每个工具内部封顶</td>
</tr>
<tr>
<td>静默跳过不报数</td>
<td>模型把「文件被跳过」当成「没有匹配」</td>
<td>统计跳过数量，在末尾汇总一行</td>
</tr>
<tr>
<td>单位混用</td>
<td>中文内容的实际容量只有英文三分之一</td>
<td>统一字节或统一字符，写进注释</td>
</tr>
<tr>
<td>默认值与上限不匹配</td>
<td>请求 2000 行，实际拿到 200 行</td>
<td>让默认值贴近真实产出，或在标注里说明</td>
</tr>
<tr>
<td>截断标注算错单位</td>
<td>标注 <code>chars</code> 实际是字节</td>
<td>标注用实际单位，或改成正确计数</td>
</tr>
<tr>
<td>错误没有可行动信息</td>
<td>模型重试同一个错误参数</td>
<td>错误文本写明下一步动作</td>
</tr>
<tr>
<td>拒绝与失败混同</td>
<td>被拒绝的操作被换个写法重试</td>
<td>拒绝返回 <code>Ok</code> + 停止指令</td>
</tr>
<tr>
<td>只有一条管道被排空</td>
<td>命令输出到另一条流时永久阻塞</td>
<td>两个流都排空，或用重定向合并</td>
</tr>
<tr>
<td>忽略目录写死</td>
<td>项目特有的生成目录无法排除</td>
<td>支持配置追加，或至少提供覆盖开关</td>
</tr>
</tbody>
</table></div>

这九个里有四个（静默跳过、单位混用、单位不一致的标注、只有一条管道被排空）不会产生任何报错——它们安静地让工具变差，往往要等到某次具体事故才被发现。这也是「输出预算」这一层值得单独写一篇文章的原因：它是最不可见的一层。
<h2>怎么验证你的工具真的安全</h2>

一套可执行的检查清单，按发现问题的成本从低到高排列。
<div class="table-scroll"><table>
<thead>
<tr>
<th>检查</th>
<th>方法</th>
<th>预期</th>
</tr>
</thead>
<tbody>
<tr>
<td>出口是否有兜底</td>
<td>读 <code>dispatch</code>（或等价的唯一出口）末尾</td>
<td>有统一截断，且对所有工具生效</td>
</tr>
<tr>
<td>每个工具是否自封顶</td>
<td>搜所有常量定义</td>
<td>每个读/执行类工具都有上限</td>
</tr>
<tr>
<td>单位是否统一</td>
<td>对比常量名与实现里的 <code>len()</code> / <code>chars().count()</code></td>
<td>一致，或注释明确</td>
</tr>
<tr>
<td>二进制文件</td>
<td>让 Agent 读一个 PNG</td>
<td>明确报错，而不是返回乱码</td>
</tr>
<tr>
<td>大文件</td>
<td>让 Agent 读一个 10 MB 日志</td>
<td>报错并提示用 offset/limit</td>
</tr>
<tr>
<td>巨型目录</td>
<td>让 Agent 列一个有五千文件的目录</td>
<td>有上限提示，不是静默截断</td>
</tr>
<tr>
<td>刷屏命令</td>
<td>跑一个连续输出 5 分钟的脚本</td>
<td>超时被杀，报告说明；内存不涨</td>
</tr>
<tr>
<td>双流阻塞</td>
<td>后台跑一个往 stderr 写 1 MB 的命令</td>
<td>任务能正常结束（这是最容易漏的一项）</td>
</tr>
<tr>
<td>空参数</td>
<td>直接调用工具传空字符串</td>
<td>明确报错，且报错发生在 IO 之前</td>
</tr>
<tr>
<td>权限模式</td>
<td>用 <code>plan</code> 模式尝试改文件</td>
<td>工具不出现在列表里，直接调用被拒</td>
</tr>
<tr>
<td>审批</td>
<td>在默认模式下跑一条危险命令</td>
<td>出现确认提示；拒绝后模型不重试</td>
</tr>
<tr>
<td>上限触发</td>
<td>临时把 <code>MAX_MATCHES</code> 改成 3</td>
<td>输出带截断说明，条数正确</td>
</tr>
</tbody>
</table></div>

其中「双流阻塞」是唯一一个几乎必然发现 bug 的检查：写一个每秒往 stderr 打印一行的脚本，用后台模式跑十秒，再 <code>task_output</code> 看它能不能结束。如果它永远显示 <code>running</code>，就命中了那条死锁。
<h2>小结：上限是设计，不是补丁</h2>

把这篇的结论压缩成五句话：
<ol>
<li>工具设计有三层：拓扑（有哪些）、形状（怎么调）、预算（回来多少）。前两层决定能不能用对，第三层决定用了之后上下文还在不在。</li>
<li>上限必须分层且默认生效。枚举前过滤、读取时限制、产出后裁剪、出口兜底——四层缺一层，就有对应的资源问题。</li>
<li>超限必须有痕迹。静默跳过是最贵的失败模式，因为它让模型基于不完整的信息自信地下结论。</li>
<li>错误文本是提示词的一部分。写「下一步做什么」，比写「哪里错了」有用得多。</li>
<li>相似路径要对称实现。前台和后台命令的排空策略不一致，直接导致了永久阻塞。</li>
</ol>

一个 Agent 的工具层，说到底是「把外部世界翻译成模型能消化的文本」的一层。翻译的质量取决于两件事：翻译得准不准（schema 与描述），以及翻译的量可不可控（预算）。绝大多数教程只讲第一件，但线上事故多来自第二件。

NanoHermes 的工具层不完美：<code>read_file</code> 不做二进制检测、<code>grep</code> 没有文件数上限、后台任务的 stderr 从不读取、<code>clamp</code> 的单位标注有误、<code>glob</code> 会报「假截断」。但这些缺陷都是可以指认、可以定位、可以逐个修掉的——它们不是「设计上没想到」，而是「实现上漏了一处」。这个差别很重要：前者需要重新架构，后者只需要补一次代码。
