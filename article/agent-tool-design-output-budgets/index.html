    <noscript><div class="ns-article"><h1>Agent 工具设计：为什么输出都要有上限</h1><div class="ns-meta">2026/10/22 · Stack Frame</div><div class="markdown-body"><blockquote>

适用读者：正在给 Agent 加工具、发现「加了工具反而更容易崩」的人；被一次 <code>cat</code> 大文件或一条刷屏命令撑爆上下文的人；想让工具集可维护、可审计的人
结论先行：工具设计有三层契约——拓扑（有哪些工具）、形状（参数与描述）、预算（输出上限）。前两层决定模型「能不能用对」，第三层决定它「用了之后会不会把上下文搞坏」。NanoHermes 的答案是：每个工具自己封顶，再加一道全局兜底 <code>clamp(s, 20_000)</code>
阅读时间：约 52 分钟 | 难度：进阶 | 收获：24 个工具的完整清单与三层契约 + 十三个输出上限的取值理由 + 截断的三种语义 + 工具设计的八条原则 + 九个会悄悄失效的陷阱
</blockquote>

<h2>前言：工具的边界就是 Agent 的边界</h2>

一个 Agent 能做什么，不取决于它的模型多聪明，而取决于它手里有哪些工具。工具集决定了能力的上界：没有 <code>edit_file</code>，它就没法改代码；没有 <code>run_command</code>，它就没法跑测试；没有 <code>web_fetch</code>，它就没法读文档。

但工具集也决定了失败的下界。一个只做读取的工具如果返回 3 MB 文本，这一轮对话就废了——不是模型答不上来，而是返回的内容把上下文挤满，后面的工具结果无处安放。这种失败比「模型答错」更隐蔽：模型会把截断后的半截内容当成全部，基于不完整的信息自信地给结论。

所以工具设计不只是「写几个函数 + 一份 JSON schema」，真正要处理的是三层问题：给模型看什么工具（拓扑）、让它怎么调用（形状）、调用回来多少数据（预算）。NanoHermes 的工具层不到 1200 行，但每一层都有明确设计，本文按这三层拆开讲。
<h2>结论先行：三层契约</h2>

五层里，只有「预算」这一层是绝大多数教程不讲、但线上事故最多的一层。因为拓扑和形状错了会立刻报错，预算错了不会报错——它只是悄悄让模型看到半截数据。
<h2>第一层拓扑：24 个工具从哪来</h2>

工具列表不是硬编码的一整个数组，而是拼出来的：

<code>specs()</code> 里有 21 个内置工具，按用途分成六组：

<thead>
<tr>

<th>工具</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>文件读写</td>
<td><code>read_file</code>、<code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>list_dir</code></td>
<td>五个，覆盖「看、整体写、局部改、多处改、列目录」</td>
</tr>
<tr>
<td>搜索</td>
<td><code>grep</code>、<code>glob</code></td>
<td>内容搜索与文件名搜索</td>
</tr>
<tr>
<td>执行</td>
<td><code>run_command</code>、<code>task_output</code>、<code>task_list</code>、<code>task_kill</code></td>
<td>一个前台加三个后台管理</td>
</tr>
<tr>
<td>网络</td>
<td><code>web_fetch</code>、<code>web_search</code></td>
<td>拉页面与搜结果</td>
</tr>
<tr>
<td>状态</td>
<td><code>todo_write</code>、<code>todo_read</code></td>
<td>会话内的计划列表</td>
</tr>
<tr>
<td>版本控制</td>
<td><code>git_status</code>、<code>git_diff</code>、<code>git_log</code>、<code>git_commit</code></td>
<td>三个只读加一个写入</td>
</tr>
<tr>
<td>记忆</td>
<td><code>memory_save</code>、<code>memory_search</code></td>
<td>跨会话记忆的读写</td>
</tr>
</tbody>
</table></div>

再加三个条件性的：<code>skill</code>（发现技能才加）、<code>subagent</code> 与 <code>agent_list</code>（配置了子代理才加）。MCP 服务器还会动态并入自己的工具，以及四个辅助工具 <code>mcp_list_resources</code>、<code>mcp_read_resource</code>、<code>mcp_list_prompts</code>、<code>mcp_get_prompt</code>。

拼装顺序是先内置、再 skill、再 MCP、最后子代理，这决定了工具在提示词里的先后，而模型对靠前的工具往往更顺手。内置排最前是合理的——它们最可靠、不依赖外部。
<h2>工具为什么会自己变多：skill、MCP、subagent</h2>

一个容易忽略的事实：工具数量不是常量。同一个二进制，在不同工作区、不同配置下，暴露的工具可能差出十几个。

<td>永远</td>

<td>代码</td>
</tr>
<tr>

<td>发现至少一个技能</td>
<td>+1</td>
<td>工作区里的技能目录</td>
</tr>
<tr>
<td>MCP</td>

</tr>
<tr>

</tr>
<tr>

</tr>
</tbody>

这带来一个可维护性要求：工具多了，模型选错的概率上升，用户看 <code>/tools</code> 输出也会疲劳。NanoHermes 的做法是三条：
<ol>
<li>条件性工具绝不无条件暴露。没发现技能就不给 <code>skill</code>，没配子代理就不给 <code>subagent</code>——避免模型去调用一个必然报错的工具。</li>
<li>权限不允许的工具直接过滤掉（<code>list.retain(...)</code>），让模型看不到当前模式下会被拒绝的工具，不浪费一次调用去撞墙。</li>
<li>相关能力合并成一个工具。<code>todo_write</code> 用「替换整个列表」的语义，省掉 add/update/remove/clear 四个工具；<code>run_command</code> 用 <code>background</code> 参数覆盖后台执行，而不是单独一个 <code>run_in_background</code>。</li>
</ol>

第 3 条是有争议的取舍：合并会让单个 schema 变复杂。但对模型来说，理解「带一个 <code>background</code> 布尔值的 <code>run_command</code>」比记住两个名字更省认知。
<h2>第二层形状：JSON schema 是唯一接口</h2>

模型看到的工具定义只有三段：名字、描述、参数 schema。这三段就是全部契约，没有任何隐式约定能被模型猜到。

其中两句是刻意写的：<code>Returns content with line numbers</code> 告诉模型返回格式，<code>Use offset/limit for large files</code> 告诉它大文件怎么办——这直接决定了模型遇到大文件时会不会改成分页读。

反面例子：<code>grep</code> 描述里的 <code>Search file contents for a literal substring</code>，<code>literal</code> 这个词很关键，它明确说明不支持正则；否则模型可能传一个 <code>\d+</code> 或 <code>.*</code> 进来，然后得到「没有匹配」的假结论。而 <code>include</code> 说明写的 <code>Glob filter, e.g. '*.rs' or 'src/**/*.ts'</code>，用两个例子代替语法描述，对模型比抽象说明更有效。

把 24 个工具的 <code>description</code> 摆在一起看，能总结出一个模式：好描述 = 做什么 + 返回什么 + 边界或注意事项。

最值得学的是「跨工具指路」这一类：<code>write_file</code> 指向 <code>edit_file</code>、<code>apply_patch</code> 指向 <code>edit_file</code>、<code>web_search</code> 指向 <code>web_fetch</code>、<code>run_command</code> 指向 <code>task_output</code>。它们不增加任何能力，但显著减少错误选择，工具集越大收益越高。

反面例子：<code>task_list</code> 的描述只有一句 <code>List all background tasks with their id, command and status (running/finished).</code>，正确但偏薄——没说清输出格式，模型只能靠调一次来学。对低频、低风险的只读工具可以接受；如果它经常被误用，就该补上返回示例。
<h2>参数校验的第一道门</h2>

schema 是给模型看的建议，不是强制的。模型完全可能少传一个字段、传错类型，或者传个空字符串。所以每个工具入口都要有自己的校验。

<code>fs.rs</code> 里有一个共用的取值助手：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">req_str</span><span class="o">&lt;&#39;</span><span class="na">a</span><span class="o">&gt;</span><span class="p">(</span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="o">&#39;</span><span class="na">a</span><span class="w"> </span><span class="nc">Value</span><span class="p">,</span><span class="w"> </span><span class="n">key</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;&amp;&#39;</span><span class="na">a</span><span class="w"> </span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="n">key</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">v</span><span class="o">|</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">ok_or_else</span><span class="p">(</span><span class="o">||</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;missing string field `{key}`&quot;</span><span class="p">))</span>
<span class="p">}</span>
</code></pre></div>


一行办三件事：字段不存在、类型不是字符串、值是 <code>null</code>，全部归为「missing string field」，错误里带上字段名，模型才能自己修。

可选参数统一给默认值而不是设为必填，原则是「覆盖最常见用法，且不产生危险行为」：<code>offset</code> 默认 1、<code>limit</code> 默认 2000、<code>timeout_secs</code> 默认 120、<code>max_chars</code> 默认 20000。危险值另用 <code>clamp</code> 挡住——<code>timeout_secs</code> 限在 1..3600 秒，<code>max_chars</code> 限在 500..200,000 字符，模型不能要求一个跑一整天不超时的命令，也不能一次要 100 MB 文本。

这些检查看起来多余（模型为什么要传空字符串？），但挡住了两类真实情况：模型在「先占位再补」的推理中发出半成品调用；JSON 解析失败被兜成空对象，此时所有字段都是缺失。

还有一个顺序细节：<code>edit_file</code> 的空 <code>old_string</code> 检查和 <code>apply_patch</code> 的空 <code>diff</code> 检查都写在读文件之前。参数错误应该在碰到文件系统之前暴露，既省一次 IO，也避免「文件不存在」盖住「参数没填」的真实原因。
<h2>第三层预算：为什么输出必须封顶</h2>

前面两层讲「怎么调」，这一层讲「调完回来多少」，它最容易被忽略，也最容易出事。

反直觉的是：上下文最大的杀手往往不是用户输入，而是工具输出。用户打一行字可能几十个字符，一条 <code>run_command</code> 的输出可以是几兆。没有上限就会出三种坏结果：
<ol>
<li>上下文被挤爆。单次调用就超过 120,000 字符的会话预算，触发压缩，丢掉真正的历史；而压缩摘要还要多一次模型调用。</li>
<li>模型被噪音淹没。<code>ls -R</code> 或 <code>npm install</code> 的几千行里真正有用的可能只有三行，但模型必须读完全部。</li>
<li>请求直接失败。很多模型服务有单请求 token 上限，超了直接报错，整轮白跑。</li>
</ol>

反过来说，上限也是一种信息压缩手段：告诉模型「你看到的不是全部」，让它意识到该分页、缩小范围或换个工具。<strong>上限本身就是提示词的一部分。</strong>
<h2>三个无限来源</h2>

工具输出的长度风险来自三个方向，每个方向的封顶位置都不一样。
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>为什么可能无限</th>
<th>封顶的位置</th>
</tr>
</thead>
<tbody>
<tr>
<td>文件</td>
<td>用户可能有一个 500 MB 的日志文件</td>
<td><code>read_file</code> 的准入门 + <code>clamp</code></td>
</tr>
<tr>
<td>命令</td>
<td><code>npm install</code>、<code>cargo build</code>、<code>git log</code> 的输出条数不可控</td>
<td>管道读取时的捕获上限</td>
</tr>
<tr>
<td>网络</td>
<td>一个页面可以任意长，也可能是 100 MB 的压缩包</td>
<td>响应体字节上限 + 字符裁剪</td>
</tr>
<tr>
<td>目录</td>
<td>一个目录可以有十万个条目</td>
<td>读文件数上限（<code>grep</code>/<code>glob</code>）+ <code>clamp</code></td>
</tr>
</tbody>
</table></div>

对应到实现，封顶分四层：<strong>枚举前过滤</strong>（<code>grep</code> 跳过超过 1 MB 的文件）、<strong>读取时限制</strong>（<code>read_capped</code> 只留前 256 KB）、<strong>产出后裁剪</strong>（<code>clip</code> 把每行截到 240 字符）、<strong>出口兜底</strong>（<code>clamp</code> 统一截到 20,000 字节）。四层的顺序不能乱：枚举阶段不先按体积过滤，一个巨型文件就能拖慢整次 <code>grep</code>；读取阶段不限制，进程内存先炸，根本轮不到出口兜底。

把散在各个文件里的常量集中起来看，会发现它们其实是一套完整的预算体系。

<td>500</td>

<td>停止收集 + 一行说明</td>
</tr>
<tr>
<td><code>MAX_FILE_BYTES</code></td>
<td><code>tools/search.rs</code></td>
<td>1 MB</td>
<td><code>grep</code> 单文件准入</td>
<td>静默跳过该文件</td>
</tr>
<tr>
<td><code>MAX_LINE_CHARS</code></td>
<td><code>tools/search.rs</code></td>
<td>240</td>
<td><code>grep</code> 单行长度</td>
<td>裁剪 + 省略号</td>
</tr>
<tr>
<td><code>CAPTURE_BYTES</code></td>
<td><code>tools/shell.rs</code></td>
<td>256 KB</td>
<td>前台命令每个流</td>
<td>排空丢弃 + 一行说明</td>
</tr>
<tr>
<td><code>CAPTURE_BYTES</code></td>
<td><code>tools/tasks.rs</code></td>
<td>512 KB</td>
<td>后台任务累计输出</td>
<td>排空丢弃 + 一行说明</td>
</tr>
<tr>
<td><code>MAX_RESPONSE_BYTES</code></td>
<td><code>tools/web.rs</code></td>
<td>2 MB</td>
<td>单次下载的响应体</td>
<td>排空丢弃 + 一行说明</td>
</tr>
<tr>
<td><code>MAX_BODY_CHARS</code></td>
<td><code>skills.rs</code></td>
<td>20,000</td>
<td>单个技能正文</td>
<td>截断</td>
</tr>
<tr>
<td><code>MAX_PROJECT_DOCS</code></td>
<td><code>prompt.rs</code></td>
<td>20,000</td>
<td>拼接后的项目文档</td>
<td>截断 + 一行说明</td>
</tr>
<tr>
<td><code>MAX_ITEMS</code></td>
<td><code>tools/todo.rs</code></td>
<td>50</td>
