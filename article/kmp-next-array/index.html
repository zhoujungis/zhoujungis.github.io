    <noscript><div class="ns-article"><h1>【KMP】求 next 数组：自己跟自己的最长相等前后缀</h1><div class="ns-meta">2026/10/14 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>

<strong>求模式串 <code>p = "abacaba"</code> 的 next 数组</strong>。按<strong>最长相等真前后缀</strong>的定义，答案是 <strong><code>[0,0,1,0,1,2,3]</code></strong>。

⚠️ 一句话先记住：<strong>面试前必须确认面试官用的是哪种定义</strong>。另有一种把首项记作 <code>-1</code> 的定义（严蔚敏《数据结构》风格），同一条串在那套定义下的答案是 <strong><code>[-1,0,0,1,0,1,2]</code></strong> —— 两种定义只差一次整体移位，但<strong>报出来的数字完全不同</strong>，报错了就是零分。
<div class="codehilite"><pre><span></span><code><span class="nv">p</span><span class="w">      </span><span class="o">=</span><span class="w"> </span><span class="nv">a</span><span class="w">  </span><span class="nv">b</span><span class="w">  </span><span class="nv">a</span><span class="w">  </span><span class="nv">c</span><span class="w">  </span><span class="nv">a</span><span class="w">  </span><span class="nv">b</span><span class="w">  </span><span class="nv">a</span>
<span class="k">next</span><span class="w">   </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="w">  </span><span class="mi">0</span><span class="w">  </span><span class="mi">1</span><span class="w">  </span><span class="mi">0</span><span class="w">  </span><span class="mi">1</span><span class="w">  </span><span class="mi">2</span><span class="w">  </span><span class="mi">3</span><span class="w">      </span>←<span class="w"> </span>最长相等真前后缀（本文默认）
另一种<span class="w">  </span><span class="o">=</span><span class="w"> </span><span class="o">-</span><span class="mi">1</span><span class="w"> </span><span class="mi">0</span><span class="w">  </span><span class="mi">0</span><span class="w">  </span><span class="mi">1</span><span class="w">  </span><span class="mi">0</span><span class="w">  </span><span class="mi">1</span><span class="w">  </span><span class="mi">2</span><span class="w">      </span>←<span class="w"> </span>首项为<span class="w"> </span><span class="o">-</span><span class="mi">1</span><span class="w"> </span>的定义
</code></pre></div>


这题看上去只是"背个模板"，真正的门槛却在一处很容易被含糊带过的地方：<strong><code>next[i]</code> 到底统计的是哪一段子串的前后缀</strong>。定义含糊一点（把"真"字漏掉、把"含不含自己"混了），答案就会整体错位；而算出 next 之后，<code>next[j-1]</code> 那个下标更是<strong>每一次回退的依据</strong>。
<ul>
<li><a href="#section-1">一、核心洞察：next 是什么，为什么能"自己跟自己比"</a></li>
<li><a href="#section-2">二、两种定义（面试第一坑）</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、同族题：LC 28 / 459 / 214 / 1392 / 686</a></li>
<li><a href="#section-6">六、Java 版</a></li>
<li><a href="#section-7">七、边界情况</a></li>
<li><a href="#section-8">八、复杂度</a></li>
<li><a href="#section-9">九、常见坑</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：next 是什么，为什么能"自己跟自己比"</h2>

先把定义钉死。<code>next[i]</code> = 子串 <code>p[0..i]</code> 的<strong>最长相等真前后缀</strong>的长度。

"<strong>真</strong>"字是关键：前后缀都<strong>不能是整个子串本身</strong>，长度必须严格小于 <code>i + 1</code>。正因为排除了"整串等于整串"这种平凡情况，<code>next[0] = 0</code> 是<strong>恒成立</strong>的（长度为 1 的子串不存在真前后缀）。
<ul>
<li><code>p[0..2] = "aba"</code>：前缀 <code>"a"</code> 与后缀 <code>"a"</code> 相等，长度 1 → <code>next[2] = 1</code>；</li>
<li><code>p[0..3] = "abac"</code>：<code>"a"</code> 对 <code>"c"</code>、<code>"ab"</code> 对 <code>"ac"</code> 都不等 → <code>next[3] = 0</code>；</li>
<li><code>p[0..6] = "abacaba"</code>：<code>"aba"</code> 前后都出现，长度 3 → <code>next[6] = 3</code>。</li>
</ul>

最直白的做法是：<strong>对每个 <code>i</code>，从大到小枚举前后缀长度试到相等为止</strong>。那是 O(n²) —— 对 <code>n</code> 个位置各扫一遍。KMP 的做法只有一句话：
<blockquote>

<strong>让模式串跟自己匹配</strong>：把 <code>p</code> 同时当成"主串"和"模式串"，<code>i</code> 在主串上走，<code>j</code> 记"已匹配的前缀长度"。
</blockquote>
<div class="codehilite"><pre><span></span><code><span class="k">next</span><span class="o">[</span><span class="n">0</span><span class="o">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span>
<span class="k">for</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">..</span><span class="w"> </span><span class="n">n</span><span class="o">-</span><span class="mi">1</span><span class="err">:</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="n">且</span><span class="w"> </span><span class="n">p</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="w"> </span><span class="o">!=</span><span class="w"> </span><span class="n">p</span><span class="o">[</span><span class="n">j</span><span class="o">]</span><span class="err">:</span><span class="w">  </span><span class="n">j</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">next</span><span class="o">[</span><span class="n">j-1</span><span class="o">]</span><span class="w">     </span><span class="err">#</span><span class="w"> </span><span class="n">失配</span><span class="err">：</span><span class="n">退到更短的候选前缀</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">p</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">p</span><span class="o">[</span><span class="n">j</span><span class="o">]</span><span class="err">:</span><span class="w">               </span><span class="n">j</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">j</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="w">         </span><span class="err">#</span><span class="w"> </span><span class="n">相等</span><span class="err">：</span><span class="n">候选前缀再长一位</span>
<span class="w">    </span><span class="k">next</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">j</span>
</code></pre></div>


<code>j</code> 有<strong>两副面孔</strong>，理解这两副面孔，整段代码就不需要背：
<ol>
<li><strong>"已匹配前缀的长度"</strong> —— 进入比较前，恒有</li>
</ol>

<code>p[0 .. j-1]  ==  p[i-j .. i-1]</code>

前 <code>j</code> 个字符与"紧挨着 <code>i</code> 之前的那 <code>j</code> 个字符"逐字相等。这条不变量是全部推导的地基。
2. <strong>"下一个要和 <code>p[i]</code> 比的 p 下标"</strong> —— 因为前 <code>j</code> 个字符已经和 <code>p[i-j..i-1]</code> 对齐了，接下来自然该拿 <code>p[j]</code> 去接 <code>p[i]</code>。
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">prefix_function</span><span class="p">(</span><span class="n">p</span><span class="p">):</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="n">p</span><span class="p">)</span>
    <span class="nb">next</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">*</span> <span class="n">n</span>
    <span class="n">j</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="n">n</span><span class="p">):</span>
        <span class="k">while</span> <span class="n">j</span> <span class="o">&gt;</span> <span class="mi">0</span> <span class="ow">and</span> <span class="n">p</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">!=</span> <span class="n">p</span><span class="p">[</span><span class="n">j</span><span class="p">]:</span>
            <span class="n">j</span> <span class="o">=</span> <span class="nb">next</span><span class="p">[</span><span class="n">j</span> <span class="o">-</span> <span class="mi">1</span><span class="p">]</span>        <span class="c1"># 失配：退到「更短但仍接得上」的候选前缀</span>
        <span class="k">if</span> <span class="n">p</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">==</span> <span class="n">p</span><span class="p">[</span><span class="n">j</span><span class="p">]:</span>
            <span class="n">j</span> <span class="o">+=</span> <span class="mi">1</span>                 <span class="c1"># 相等：候选前缀再长一位</span>
        <span class="nb">next</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">=</span> <span class="n">j</span>
    <span class="k">return</span> <span class="nb">next</span>

<span class="c1"># p = &quot;abacaba&quot; → [0, 0, 1, 0, 1, 2, 3]</span>
</code></pre></div>


三个细节决定了成败：
<ol>
<li><strong><code>next[0] = 0</code> 是定义、不用算</strong>：循环从 <code>i = 1</code> 开始，省掉一次无意义的比较。</li>
<li><strong>回退读的是 <code>next[j-1]</code>，不是 <code>next[j]</code></strong>：<code>p[0..j-1]</code> 自身的最长相等前后缀（长度记在 <code>next[j-1]</code> 里）正是"接得上、又更短"的那个候选。用 <code>next[j]</code> 就错位了一格。</li>
<li><strong>回退是 <code>while</code> 不是 <code>if</code></strong>：一次退不到底就要接着退。<code>i = 3</code> 那一帧只退了一次，但长串上可能连退好几次。</li>
</ol>

一句话记住这台机器：
<blockquote>

<strong><code>j</code> 是"已匹配前缀长度"，<code>p[0..j-1]</code> 与 <code>p[i-j..i-1]</code> 永远对齐；失配就沿 <code>next[j-1]</code> 往回收，相等就让 <code>j</code> 长一位，收尾把 <code>next[i] = j</code> 记下来。</strong>
</blockquote>
<h2>二、两种定义（面试第一坑）</h2>

同一台机器，两种记账方式。<strong>先看表，再作答。</strong>

<td><code>next[0]</code></td>
<td><code>0</code></td>
<td><code>-1</code>（哨兵）</td>
</tr>
<tr>
<td><code>next[i]</code> 的含义</td>
<td><code>p[0..i]</code> 的最长相等真前后缀长度</td>
<td><code>p[0..i-1]</code> 的最长相等真前后缀长度</td>
</tr>
<tr>
<td><code>"abacaba"</code> 的结果</td>
<td><code>[0,0,1,0,1,2,3]</code></td>

两者的关系干净得只有一句话：
<div class="codehilite"><pre><span></span><code>B = [-1] + A[0 .. n-2]
</code></pre></div>


也就是把 A <strong>整体右移一格</strong>，再在首位补一个 <code>-1</code>。逐项验证：<code>B[1] = A[0] = 0</code>、<code>B[2] = A[1] = 0</code>、<code>B[3] = A[2] = 1</code> …… 一直到 <code>B[6] = A[5] = 2</code>，正好是 <code>[-1,0,0,1,0,1,2]</code>。

为什么会有人用 B？因为它把"<strong>失配时 j 该退到哪</strong>"直接编进了数组：
<ul>
<li>用 <strong>A</strong> 时，失配后的动作是 <code>j = next[j-1]</code>（退完再比，<code>j</code> 可能落到 0）；</li>
<li>用 <strong>B</strong> 时，失配后的动作是 <code>j = next[j]</code>，而 <code>B[0] = -1</code> 这个哨兵顺手把"已经退无可退"也表达出来了。</li>
</ul>

代价是 B 在下标上多绕一层：<code>B[i]</code> 描述的是 <code>p[0..i-1]</code>，而 A 的 <code>A[i]</code> 描述的就是 <code>p[0..i]</code> 自己。

结论只有一条：<strong>开口先问"您用的是哪种定义"，再动手</strong>。可以用这一句把主动权拿回来 ——
<blockquote>

"next 有两种常见定义：一种是前缀函数，<code>next[i]</code> 是 <code>p[0..i]</code> 的最长相等真前后缀，<code>next[0] = 0</code>，答案是 <code>[0,0,1,0,1,2,3]</code>；另一种首项取 <code>-1</code>，<code>next[i]</code> 描述 <code>p[0..i-1]</code>，答案是 <code>[-1,0,0,1,0,1,2]</code>。两者只差一次整体移位。我按前一种讲，需要的话可以立刻换成后一种。"
</blockquote>
<h2>三、动画怎么看</h2>

<strong>动画一</strong>（<code>algo-viz--kmp</code>）：上面一行是模式串 <code>p</code> 的格子（每格一个字符 + 下标），紧挨着下面一行是 <code>next</code> 数组 —— 还没算出来的格子画成<strong>虚线框 + 灰点</strong>，算出来的染绿。<code>p</code> 行下挂三枚 chip：橙色 <code>i</code> 指当前字符，金色 <code>j</code> 指"已匹配前缀长度"（也就是下一个要跟 <code>p[i]</code> 比的下标），回退帧再多一枚绿 <code>j</code> 落到新位置。每帧一条动作：比较帧把 <code>p[i]</code>、<code>p[j]</code> 描橙框（相等则染绿），并把<strong>已匹配的那一段前后缀</strong>（<code>p[0..j-1]</code> 与 <code>p[i-j..i-1]</code>）整段刷绿；回退帧用一条<strong>虚线从 <code>p[j]</code> 连到 <code>next[j-1]</code> 那一格</strong>；落定帧把 <code>next[i]</code> 染金。下方是横幅 + 五项统计面板（<code>i</code> / <code>j</code> / 比较次数 / 回退次数 / 已定 next）+ 状态行。

盯住三件事：<strong>比较帧里 <code>j</code> 一动不动</strong> —— <code>j</code> 的进退只在落定帧发生；<strong>回退帧是唯一让 <code>j</code> 变小的时刻</strong>，且它读的一定是 <code>next[j-1]</code> 那一格（虚线指过去的就是它）；以及<strong><code>next[0] = 0</code> 那一格从一开始就是绿的</strong> —— 它是定义，不是算出来的。默认 16 帧走完，<code>next = [0, 0, 1, 0, 1, 2, 3]</code>，全程 7 次比较、1 次回退。

<strong>动画二</strong>（<code>algo-viz--kmpmatch</code>）：主串 <code>text</code> 一行、模式串 <code>p</code> 一行，<code>p</code> <strong>整行按 <code>j</code> 滑动对齐</strong> —— 于是 <code>p[j]</code> 恰好落在 <code>text[i]</code> 正下方，"已匹配前缀"整段对齐一目了然。比较帧把 <code>text[i]</code>、<code>p[j]</code> 描橙框（相等染绿）；回退帧在 <code>p</code> 行画一条<strong>虚线弧</strong>从旧 <code>j</code> 指到新 <code>j</code>，同时<strong>把 <code>text[i]</code> 的橙框留在原地</strong> —— 这就是"<code>i</code> 不动"的视觉证据；命中帧把 <code>text[index..index+n-1]</code> 与整条 <code>p</code> 染金。面板五项是 <code>i</code> / <code>j</code> / KMP 比较 / 暴力比较 / 命中下标，其中"暴力比较"是同一输入上暴力匹配<strong>要花的总次数</strong>（静态算出来的参照系），整局不变。

两个动画分工明确：动画一<strong>算表</strong>（把 next 一个字一个字顶出来），动画二<strong>用表</strong>（拿这张 next 去 <code>text</code> 里找 <code>p</code>，并把 KMP 与暴力的账现场对一遍）。

<h2>五、同族题：LC 28 / 459 / 214 / 1392 / 686</h2>

KMP 的全部内容其实就是 <strong>"一张 next 表 + 一次永不回头的扫描"</strong>。同一副骨架换个问法，就是一条完整的题链：
<ul>
<li><strong>LC 28 找出字符串中第一个匹配项的下标（<code>strStr()</code>）</strong>：就是<strong>动画二</strong>本身，标准库里的 <code>indexOf</code> 底层。<strong>最经典的同族。</strong></li>
<li><strong>LC 459 重复的子字符串</strong>：不用真的去匹配，直接看 next —— <code>n</code> 能被周期周长整除时成立，判据是 <code>n % (n - next[n-1]) == 0</code> <strong>且</strong> <code>next[n-1] &gt; 0</code>。它问的是"next 表<strong>结构</strong>说明了什么"。</li>
<li><strong>LC 214 最短回文串</strong>：把 <code>s + '#' + reverse(s)</code> 拼起来求 next，最长回文前缀的长度就是 <code>next</code> 最后一项 —— 换的是"用 next 找最长回文前缀"。</li>
<li><strong>LC 1392 最长快乐前缀</strong>：字面定义就是 <code>next[n-1]</code>（既是前缀又是后缀的最长子串），一条 next 直接交卷。</li>
<li><strong>LC 686 重复叠加字符串匹配</strong>：允许把 <code>a</code> 重复叠加若干次再匹配 <code>b</code>，匹配次数上界由长度关系定死 —— 换的是"主串可以现场构造"。</li>
</ul>

把它们排成一列看：<strong>"表"永远是 next 表（或它的变体 Z 函数、失配后的 border 链）；"用"永远是一次不回头的扫描；而问题可以问"第几处出现"、"能不能由周期拼成"、"最长回文前缀多长"、"最长的既是前缀又是后缀的子串"。</strong> next 表只是这条坐标轴上一个入口。

两个写法值得单独对比着记：A 版的下标是"<strong>长度</strong>"（<code>j</code> 就是已匹配前缀的长度，<code>p[j]</code> 是下一个待比字符），B 版的下标是"<strong>位置</strong>"（<code>j</code> 指向最后一个已匹配字符，<code>p[j + 1]</code> 才是待比字符）。<strong>但两条串出来的表只差一次整体移位</strong>。
<h2>七、边界情况</h2>
<ul>
<li><strong>单字符串</strong>：<code>p = "a"</code> → <code>next = [0]</code>。长度为 1 没有真前后缀，<code>next[0]</code> 永远是 0，一行代码都不用跑。</li>
<li><strong>全同串</strong>：<code>p = "aaaa"</code> → <code>next = [0, 1, 2, 3]</code>。每多一个字符，前后缀长度就长一位，<code>j</code> 一路自增、一次回退也没有。</li>
<li><strong>完全无相等前后缀</strong>：<code>p = "abcd"</code> → <code>next = [0, 0, 0, 0]</code>。<code>j</code> 每次都在"退到 0 之后仍不等"里收场。</li>
<li><strong><code>next[i]</code> 的上界是 <code>i</code></strong>：因为"真"排除了整串本身。若某个实现算出 <code>next[i] = i + 1</code>，说明"真"这个约束被漏掉了。</li>
<li><strong>匹配未命中 → 返回 <code>-1</code></strong>：不是"返回 0"，也不是"返回最后一个位置"。<code>j</code> 从头到尾没到过 <code>n</code>，就是 <code>-1</code>。</li>
<li><strong>模式串比主串长</strong>：<code>n &gt; m</code> 直接不可能命中（除了 <code>n = 0</code> 的退化情形），循环会自然扫空。</li>
<li><strong>空模式串</strong>：约定 <code>n = 0</code> 时 <code>strStr</code> 返回 0（空串是任何串的前缀），<code>next</code> 是空数组。面试里属于"要先跟面试官对齐"的约定项。</li>
<li><strong><code>text</code> 与 <code>p</code> 有非 ASCII 字符</strong>：<code>charAt</code> 按 UTF-16 码元比较，对 BMP 内的字符没问题；超出 BMP 的字符要按码点遍历。这是实现层的坑，不是算法本身的坑。</li>
</ul>
<h2>八、复杂度</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>写法</th>
<th>时间</th>
<th>空间</th>
</tr>
</thead>
<tbody>
<tr>
<td>求 next：自己跟自己匹配（动画一）</td>
<td><code>O(n)</code></td>
<td><code>O(n)</code></td>
</tr>
<tr>
<td>KMP 匹配：<code>text</code> 里找 <code>p</code>（动画二）</td>
<td><code>O(n + m)</code></td>
<td><code>O(n)</code>（存 next）</td>
</tr>
<tr>
<td>暴力匹配：每个起点从头重比</td>
<td><code>O(n × m)</code></td>
<td><code>O(1)</code></td>
</tr>
<tr>
<td>暴力求 next：对每个 <code>i</code> 枚举前后缀长度</td>
<td><code>O(n²)</code></td>
<td><code>O(n)</code></td>
</tr>
</tbody>
</table></div>

<code>n</code> 是模式串长度、<code>m</code> 是主串长度。<code>O(n)</code> 这一步的论证是<strong>均摊</strong>的，值得背下来：
<blockquote>

<code>j</code> 在每一轮循环里<strong>最多自增 1</strong>（只在 <code>if</code> 相等那一支），所以整个循环里 <code>j</code> 的自增总量不超过 <code>n</code>；而 <code>j</code> 的回退是把自增值<strong>还回去</strong>，总量自然也不超过自增总量。于是 <code>while</code> 的总执行次数是 <code>O(n)</code> —— 单次循环最坏能退到 0，但<strong>整轮加起来</strong>是线性的。
</blockquote>

匹配段同理：<code>i</code> 只增不减（<code>m</code> 步），<code>j</code> 的回退总量不超过它在匹配过程中自增的总量（<code>≤ m</code>），所以 <code>O(n + m)</code>。
<h2>九、常见坑</h2>
<ol>
<li><strong>漏掉"真"字</strong>：把子串本身也算作前后缀，<code>next[i]</code> 会变成 <code>i + 1</code>，回退逻辑随之死循环。<strong>本题的头号坑</strong> —— 定义里"真"这个约束就是全部。</li>
<li><strong>回退写成 <code>j = next[j]</code>（本文 A 定义下）</strong>：应该读 <code>next[j-1]</code>。差这一格会让 <code>j</code> 退到错误的候选上，答案整体错位。</li>
<li><strong>回退用 <code>if</code> 而不是 <code>while</code></strong>：一次退不干净。<code>i = 3</code> 那帧只退一次只是巧合，长串上可能连退多次才落定。</li>
<li><strong>两种定义混着写</strong>：A 版的比较对象是 <code>p[j]</code>、回退读 <code>next[j-1]</code>；B 版比较对象是 <code>p[j+1]</code>、回退读 <code>next[j]</code>。混用会同时错掉比较和回退两处。</li>
<li><strong>匹配时让 <code>i</code> 回退</strong>：一旦写 <code>i = i - j + 1</code> 重来，就退化成暴力 <code>O(n × m)</code>，KMP 的唯一价值（<code>i</code> 永不回头）当场归零。</li>
<li><strong>每轮都重算一遍 next</strong>：next 只依赖模式串，<strong>算一次反复用</strong>。匹配过程里重算是最常见的一种"白送复杂度"。</li>
<li><strong><code>next</code> 数组下标越界</strong>：求 next 时 <code>j &lt; i ≤ n - 1</code>，<code>p[j]</code> 安全；匹配时若 <code>j</code> 已等于 <code>n</code> 还去读 <code>p[j]</code> 就越界了 —— 命中判定要在读之前做。</li>
<li><strong>把 <code>next[i]</code> 理解成"<code>p[0..i-1]</code>"</strong>：那是 B 定义。本文 A 定义下 <code>next[i]</code> 描述的就是 <code>p[0..i]</code> 自己。</li>
</ol>
<h2>十、面试怎么答</h2>

<strong>第一段 · 先问定义</strong>：开口就确认用哪种 —— "前缀函数定义下 <code>next[i]</code> 是 <code>p[0..i]</code> 的最长相等真前后缀、<code>next[0] = 0</code>，答案是 <code>[0,0,1,0,1,2,3]</code>；若用首项 <code>-1</code> 的那版，答案是 <code>[-1,0,0,1,0,1,2]</code>，两者差一次整体移位。"这一句既展示了你<strong>知道有两种定义</strong>，又把选择权交回给面试官。

<strong>第二段 · 讲清机器</strong>：<code>next[0] = 0</code> 是定义；从 <code>i = 1</code> 起"<strong>自己跟自己匹配</strong>" —— <code>j</code> 既是"已匹配前缀长度"，也是"下一个要跟 <code>p[i]</code> 比的下标"；不变量是 <code>p[0..j-1]</code> 与 <code>p[i-j..i-1]</code> 逐字相等；失配就 <code>while</code> 沿 <code>next[j-1]</code> 往回收，相等就让 <code>j</code> 前进一步；收尾 <code>next[i] = j</code>。

<strong>第三段 · 说清复杂度为什么是线性的</strong>：<code>j</code> 每次最多自增 1，回退只是把自增值还回去，<strong>均摊</strong>下来 <code>while</code> 的总步数是 O(n)。匹配段同理，<code>i</code> 只增不减，于是 <code>O(n + m)</code>。

<strong>追问连跳</strong>：
- 把"求 next"换成"<strong>在主串里找第一次出现</strong>" → LC 28 <code>strStr()</code>，动画二；
- 问"能不能由某个子串重复拼成" → LC 459，判据 <code>n % (n - next[n-1]) == 0</code>；
- 问"<strong>最长回文前缀</strong>" → LC 214，把 <code>s + '#' + reverse(s)</code> 求 next；
- 问"<strong>最长的既前缀又后缀的子串</strong>" → LC 1392，答案就是 <code>next[n-1]</code>；
- 问"主串可以现场叠加" → LC 686。

一句话收尾："KMP 只有一台机器 —— <strong>一张 next 表 + 一次永不回头的扫描</strong>。next 是'自己跟自己匹配'攒出来的边界信息，扫描时靠它把'已匹配段里本来就有的相等前后缀'直接兑现，于是 <code>i</code> 永不回退、总代价 <code>O(n + m)</code>。<strong>两种定义只是同一张表的两种记账方式</strong>：<code>B = [-1] + A[0..n-2]</code>。"
<h2>结语</h2>

这道题的"难"不在代码 —— 模板只有六行 —— 而在<strong>定义</strong>。<code>next[i]</code> 描述的到底是 <code>p[0..i]</code> 还是 <code>p[0..i-1]</code>、首位是 <code>0</code> 还是 <code>-1</code>，这两问决定了报出来的数字是 <code>[0,0,1,0,1,2,3]</code> 还是 <code>[-1,0,0,1,0,1,2]</code>。<strong>面试里先把定义问清楚，再动手</strong>，比背模板有用得多。

剩下的一件事就是把"自己跟自己比"这句话真正看懂：<code>j</code> 一边记着"已匹配前缀长度"，一边示意"下一个要跟谁比"；失配时沿 <code>next[j-1]</code> 往回收，收的是更短但仍接得上的候选。等这张表攒完，拿它去 <code>text</code> 里扫一遍，<code>i</code> 一次都不用回头 —— <code>O(n)</code> 攒表、<code>O(n + m)</code> 匹配，KMP 买到的就是这两件事。
