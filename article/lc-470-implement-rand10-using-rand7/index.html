    <noscript><div class="ns-article"><h1>【LC 470】用 Rand7() 实现 Rand10()：拒绝采样 2.45 次</h1><div class="ns-meta">2026/10/12 · Stack Frame</div><div class="markdown-body"><h2>题目</h2>
<blockquote>

来源：<strong>腾讯独有高频</strong>（LC 470）—— 概率类手写题的代表作。
</blockquote>

已有函数 <code>rand7()</code>，它均匀随机地返回 <code>[1, 7]</code> 的整数。请<strong>只用 <code>rand7()</code></strong> 实现 <code>rand10()</code>：均匀随机地返回 <code>[1, 10]</code> 的整数。

两个硬要求：
<ol>
<li><strong>期望调用次数尽量少</strong>（不能写死次数硬试）；</li>
<li><strong>能证明均匀性</strong> —— 每个 1..10 的输出概率严格是 1/10。</li>
</ol>
<blockquote>

百度变体：用 <code>rand4()</code>（均匀返回 <code>0~4</code>）实现 <code>rand6()</code>（均匀返回 <code>0~6</code>）—— 同一台机器换个参数就是它。
</blockquote>

先说一句容易走偏的方向：<strong>一个 <code>rand7()</code> 只有 7 个状态，7 不能均分成 10 份</strong> —— 不管怎么加、减、取模都没用（7 % 10、7 × 3 % 10 都不是均匀的）。出路只有一条：<strong>创造更大的、能被 10 整除的状态空间</strong>。
<ul>
<li><a href="#section-1">一、核心洞察：乘积空间 —— 两次 rand7 凑出 49 个等概率状态</a></li>
<li><a href="#section-2">二、为什么「接受区切得动、拒绝区不捣乱」</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、均匀性证明</a></li>
<li><a href="#section-6">六、期望次数与下界</a></li>
<li><a href="#section-7">七、百度变体：0~4 → 0~6（附同族题）</a></li>
<li><a href="#section-8">八、Java 版</a></li>
<li><a href="#section-9">九、边界与常见坑</a></li>
<li><a href="#section-10">十、复杂度与期望</a></li>
<li><a href="#section-11">十一、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：乘积空间 —— 两次 rand7 凑出 49 个等概率状态</h2>

两次<strong>独立</strong>的 <code>rand7()</code> 构成一个二元组 <code>(a, b)</code>，共有 <code>7 × 7 = 49</code> 种组合，<strong>每种的概率都是 1/49</strong>。把二维拍平成一维：
<div class="codehilite"><pre><span></span><code>v = (a - 1) × 7 + b      →  v 均匀取 1..49
</code></pre></div>


49 里<strong>能被 10 整除的最大块是 40</strong>（<code>40 = 4 × 10</code>）：
<ul>
<li><code>v ≤ 40</code> → <strong>接受</strong>，输出 <code>(v - 1) % 10 + 1</code>；</li>
<li><code>v ≥ 41</code> → <strong>拒绝</strong>（9 个状态，概率 9/49），这两个 <code>rand7()</code> 作废，<strong>整组重掷</strong>。</li>
</ul>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">rand10</span><span class="p">()</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>
    <span class="k">while</span> <span class="kc">True</span><span class="p">:</span>
        <span class="n">v</span> <span class="o">=</span> <span class="p">(</span><span class="n">rand7</span><span class="p">()</span> <span class="o">-</span> <span class="mi">1</span><span class="p">)</span> <span class="o">*</span> <span class="mi">7</span> <span class="o">+</span> <span class="n">rand7</span><span class="p">()</span>   <span class="c1"># 均匀取 1..49</span>
        <span class="k">if</span> <span class="n">v</span> <span class="o">&lt;=</span> <span class="mi">40</span><span class="p">:</span>
            <span class="k">return</span> <span class="p">(</span><span class="n">v</span> <span class="o">-</span> <span class="mi">1</span><span class="p">)</span> <span class="o">%</span> <span class="mi">10</span> <span class="o">+</span> <span class="mi">1</span>        <span class="c1"># 均匀取 1..10</span>
</code></pre></div>


三行代码，但每一行都有讲究：乘 7 是「七进制进位」（把 (a-1) 挪到十位、b 放个位）；<code>- 1</code> 让 a 从 0 起（否则乘积空间会有空洞）；<code>(v-1) % 10 + 1</code> 把 1..40 映射成 1..10 各四次。
<h2>二、为什么「接受区切得动、拒绝区不捣乱」</h2>

看一眼 49 格被怎么切：

<strong>每个输出恰好 4 个来源状态，一个不多一个不少</strong>；40 格被 10 个输出均分、零重叠零遗漏。这就是均匀性的全部来源 —— 动画二就是这张表的逐组点亮。

<strong>动画二（状态切分）</strong>：40 个接受状态的分组表（见第二节的表）—— 十组、每组 4 格、拒绝 9 格，合计 <code>10 × 4 + 9 = 49</code>。
<h2>五、均匀性证明</h2>

设 A 是「本轮被接受」事件，O 是输出：
<div class="codehilite"><pre><span></span><code>P(O = k 且 A) = 4/49          （输出 k 的 4 个来源状态，每个 1/49）
P(A)          = 40/49
⇒ P(O = k | A) = (4/49) / (40/49) = 4/40 = 1/10
</code></pre></div>


<strong>重掷不破坏均匀性</strong>：设第 m 轮才接受，则
<div class="codehilite"><pre><span></span><code>P(第 m 轮接受且输出 k) = (9/49)^(m-1) × 4/49
对所有 m 求和 = (4/49) / (1 - 9/49) = (4/49) × (49/40) = 1/10
</code></pre></div>


每一步重掷都与之前<strong>独立同分布</strong>，所以「第一次落进接受区」的那一轮，条件分布仍是均匀的 —— 拒绝只消耗次数，不改变概率。
<blockquote>

想亲手验证：跑 5 万次统计频数（每个输出应接近 5000 次），或者做卡方检验；本文仓库里的单测就是这么干的（固定随机源 + 频数带 + 结构断言「每个输出恰好 4 个来源状态」）。
</blockquote>
<h2>六、期望次数与下界</h2>

<strong>期望推导</strong>：每轮的接受概率 <code>p = 40/49</code>，轮数服从几何分布：
<div class="codehilite"><pre><span></span><code>E[轮数]   = 1/p = 49/40 = 1.225
E[调用数] = 2 × 1.225 = 2.45 次 rand7()
</code></pre></div>


也就是<strong>平均每产出 1 个 rand10() 结果要掷 2.45 次</strong>；拒绝率 9/49 ≈ 18.4% 是这套方案的必要浪费。

<strong>下界在哪里</strong>：每次 <code>rand7()</code> 携带 <code>log2(7) ≈ 2.807</code> bit 信息，一个 <code>rand10()</code> 需要 <code>log2(10) ≈ 3.322</code> bit —— 所以<strong>任何</strong>方案都至少要 <code>3.322 / 2.807 ≈ 1.18</code> 次调用。2.45（简单拒绝法）到 1.18（下界）之间的差距，属于进阶话题：
<blockquote>

<strong>回收拒绝值</strong>：把被拒绝的状态折算进下一轮（比如把 1..9 的余数乘以 7 再补一次掷骰，凑出新的状态空间再切），期望可以继续下降 —— 面试里能提这一句，说明你理解「拒绝 = 浪费信息」，而不是死记 2.45。
</blockquote>
<h2>七、百度变体：0~4 → 0~6（附同族题）</h2>

同一台机器，参数换一换：<code>rand4()</code> 均匀返回 <code>0~4</code>（<strong>5 个值</strong>），要造 <code>rand6()</code>（均匀返回 <code>0~6</code>，7 个值）。
<ul>
<li>两次独立抽样：<code>v = a × 5 + b</code>（a、b ∈ 0..4）→ <strong>均匀 0..24，共 25 个状态</strong>；</li>
<li>25 里能被 7 整除的最大块：<code>21 = 3 × 7</code> → <code>v ≤ 20</code> 接受、<code>21..24</code> 拒绝；</li>
<li>输出 <code>v % 7</code>（0..6），<strong>每个输出恰好 3 个来源状态</strong>；</li>
<li>期望调用：<code>2 × 25/21 = 50/21 ≈ 2.381</code> 次。</li>
</ul>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">rand6</span><span class="p">()</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>                      <span class="c1"># rand4() 返回 0..4</span>
    <span class="k">while</span> <span class="kc">True</span><span class="p">:</span>
        <span class="n">v</span> <span class="o">=</span> <span class="n">rand4</span><span class="p">()</span> <span class="o">*</span> <span class="mi">5</span> <span class="o">+</span> <span class="n">rand4</span><span class="p">()</span>        <span class="c1"># 均匀 0..24</span>
        <span class="k">if</span> <span class="n">v</span> <span class="o">&lt;=</span> <span class="mi">20</span><span class="p">:</span>
            <span class="k">return</span> <span class="n">v</span> <span class="o">%</span> <span class="mi">7</span>                 <span class="c1"># 均匀 0..6</span>
</code></pre></div>


对照记一下两个数字：<code>49 → 40</code>（每输出 4 个来源）、<code>25 → 21</code>（每输出 3 个来源）。<strong>「最多能切出多少、每份分几个」永远看 <code>⌊状态数 / 目标数⌋ × 目标数</code>。</strong>

<strong>同族题（随机化家族）</strong>：LC 384 打乱数组（Fisher–Yates，等概率的关键在「从后往前交换」）、LC 398 随机数索引（水塘抽样）、LC 528 按权重随机选择（前缀和 + 二分）、LC 478 在圆内随机生成点（拒绝采样，或极坐标里对半径先开方）、LC 497 非重叠矩形中的随机点（面积加权 + 矩形内均匀）。它们和本题共享同一条世界观：<strong>均匀性要靠结构证明，不能靠感觉。</strong>
<h2>八、Java 版</h2>
<div class="codehilite"><pre><span></span><code><span class="kd">class</span> <span class="nc">Solution</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">public</span><span class="w"> </span><span class="kt">int</span><span class="w"> </span><span class="nf">rand10</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">while</span><span class="w"> </span><span class="p">(</span><span class="kc">true</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="kt">int</span><span class="w"> </span><span class="n">v</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="p">(</span><span class="n">rand7</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mi">7</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">rand7</span><span class="p">();</span><span class="w">   </span><span class="c1">// 1..49</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">v</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="mi">40</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">return</span><span class="w"> </span><span class="p">(</span><span class="n">v</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="o">%</span><span class="w"> </span><span class="mi">10</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span><span class="w">           </span><span class="c1">// 1..10</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


Java 两个注意点：<code>(rand7() - 1) * 7 + rand7()</code> 的<strong>两个调用顺序无关</strong>（必须独立），但千万别写成 <code>rand7() * 7 + rand7() - 7</code> 这种化简 —— 中间态会越界、可读性也差；另外不要在循环外缓存 <code>rand7()</code> 结果想「省一次」—— 每次重掷都必须是<strong>新鲜的两个独立样本</strong>。
<h2>九、边界与常见坑</h2>
<ol>
<li><strong>只掷一次</strong>：<code>rand7() * 10 / 7</code>、<code>rand7() % 10</code> 之类都不是均匀的 —— 7 的状态空间切不出 10 份均分；</li>
<li><strong><code>(a-1) * 7 + b</code> 写成 <code>a * 7 + b</code></strong>：得到 8..56，0 和 7 的边界状态概率被扭曲（其实是 8..56 有 49 个数，但 <code>a=0</code> 不存在，映射会撞车 —— 总之不是均匀 1..49）；</li>
<li><strong>取模写成 <code>v % 10</code></strong>：v = 10 会输出 0。正确写法 <code>(v - 1) % 10 + 1</code>；</li>
<li><strong>拒绝区间写成 <code>v ≥ 40</code></strong>：把 v = 40 错误拒绝，接受区只剩 39 个、切不成 4×10。判据是 <strong><code>v ≤ 40</code></strong>（<code>acceptLimit = ⌊49/10⌋ × 10</code>）；</li>
<li><strong>拒绝后只重掷一颗骰子</strong>：必须<strong>重新掷两个</strong>。复用旧的一个值会破坏独立性（旧值和新值的联合分布不再是均匀的 49 格）；</li>
<li><strong>想「省调用」而改小拒绝率</strong>：接受区必须能被 10 整除，40 就是 49 里的最优解 —— 更小的「浪费」只能靠回收余数，而不是缩小接受区；</li>
<li><strong>死循环担心</strong>：理论上有无限重掷的可能，但概率以 <code>(9/49)^m</code> 衰减，期望有限（2.45 次）——不是 bug；</li>
<li><strong>验证均匀性时样本太少</strong>：几万次起步才看得出偏差；判断标准用频数带或卡方，而不是「看着挺均匀」。</li>
</ol>
<h2>十、复杂度与期望</h2>

<thead>
<tr>
<th>指标</th>
<th>值</th>
<th>说明</th>
</tr>
</thead>

<td><code>40/49 ≈ 81.6%</code></td>

</tr>

</tr>

<td>只用了常数个变量</td>
</tr>

<h2>十一、面试怎么答</h2>

<strong>第一段 · 思路</strong>：一次 <code>rand7()</code> 只有 7 个状态，凑不出 10 份均分；两次独立调用构成 49 个等概率状态（乘积空间），取 <code>v = (a-1)×7 + b</code> 得到 1..49 均匀；49 里能被 10 整除的最大块是 40 —— 接受 <code>v ≤ 40</code>、输出 <code>(v-1)%10+1</code>，<code>v &gt; 40</code> 整组重掷。

<strong>第二段 · 证明与期望</strong>（<strong>这段是区分度所在</strong>）：每个输出恰好 4 个来源状态 → 条件概率 <code>4/40 = 1/10</code>；几何级数求和证明重掷不破坏均匀；期望 <code>2 × 49/40 = 2.45</code> 次。顺手报出信息论下界 1.18，说明你知道 2.45 不是终点。

<strong>第三段 · 变体与追问</strong>：换参数（0~4 → 0~6：25 → 21、每份 3 个、期望 50/21）、回收拒绝值的进阶写法、以及「怎么验证均匀」（大样本频数 / 卡方）。

一句话收尾：「这道题只有一句口诀 —— <strong>两次采样凑乘积空间，切出能被目标数整除的最大块</strong>；剩下的是把『拒绝不改变条件分布』证清楚、把期望 2.45 算明白。」
<h2>结语</h2>

<code>rand7 → rand10</code> 的全部内容就是「造大状态空间 + 切整齐」：49 个等概率状态里切出 40 个（4 × 10）接受、9 个拒绝重掷；均匀性来自「每组恰好 4 个来源状态」，期望 2.45 来自几何分布，1.18 是它够不到的下界。把它写对的人，换任何一组参数（5 → 7、3 → 5……）都能一眼报出：状态数、切块、每份几个、期望多少。
