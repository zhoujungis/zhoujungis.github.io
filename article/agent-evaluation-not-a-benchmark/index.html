<h2>前言：CI 全绿，用户第一次用就崩</h2>

上一篇结尾留了一个问题：有了账本、懂了成本，下一个问题是「你怎么知道改动让它变好了」。

答案通常被写成「跑个测试看看」。于是就有了下面这一幕：仓库里 95 个 Rust 测试全绿，CI 徽章亮着，发布说明写着「覆盖工具调用往返、流式与非流式回复、瞬时 5xx 重试与硬错误」。用户装上之后，第一句话就让它读一个文件，它读了；第二句让它改，它改错了地方；第三句它开始重复第一句。三轮之后，任务没完成，账单先到了。

问题不在于「测试没用」，而在于<strong>测试回答的问题和用户问的不是同一个</strong>。测试问的是「这条路径会不会崩」，用户问的是「在我这堆输入上，它把事做成的概率是多少」。

这两个问题的差距，就是评测要填的坑。
<h2>结论先行：一次通过只是抽样</h2>

把这句话拆成三句，就是全文的骨架。

第一，Agent 的一次运行只是联合分布里的一个样本。温度、工具返回、文件状态、网络时序、遍历顺序，任何一项变化都会换一条路径。跑一次得到的是「这条路能走通」，不是「这类任务能做成」。

第二，没有分母的通过率不是通过率。10 次里过 10 次，和 10 次里过 7 次，是两种完全不同的系统，但「跑一次，过了」把它们抹成同一个结论。

第三，只看最终答案的测试，看不见 agent 最典型的失效方式：多调了一次工具、少做了一次确认、把整段历史重发了一遍、把失败的那一轮从账本里漏掉。这些都发生在过程里，而过程在请求体里。

所以本文要做的不是「多写几个测试」，而是把「跑一次」升级成「可重复、有口径、能归因」的评测。
<h2>测试、评测、基准不是一回事</h2>

这三个词经常被混用，混用的代价是：你以为自己在做评测，其实只是在做冒烟测试。

这张表最重要的一列是「重复」。前三行里只有评测和基准带重复，因为只有它们关心「分布」而不是「这一次」。

第二重要的一列是「口径」。单元测试的口径是编译器给的（相等、不 panic），评测的口径要你自己定：什么算成功，部分成功算不算，超时算不算失败，成本超了算不算失败。口径没定，分数就没有意义。
<h2>只跑一次漏掉了什么</h2>

一次运行会同时掩盖三件事，而且这三件事的掩盖方式不一样。
<div class="table-scroll"><table>
<thead>
<tr>
<th>掩盖</th>
<th>机制</th>
<th>后果</th>
<th>只有重复能发现</th>
</tr>
</thead>
<tbody>
<tr>
<td>偶然通过</td>
<td>模型这次恰好走了对的路</td>

<td>是</td>
</tr>
<tr>
<td>偶然失败</td>
<td>环境抖动、端口冲突、时序</td>
<td>工程师学会「重跑一次」</td>
<td>是</td>
</tr>
<tr>
<td>根本没执行</td>
<td>条件跳过、断言恒真、mock 替身太理想</td>
<td>绿灯但零覆盖</td>
<td>否，靠审计断言</td>
</tr>

第三类最危险，因为它连「偶尔失败」都不会给你，它永远绿。后文会给出这种测试的具体例子：一个在 Windows CI 上永远跳过的沙箱测试，一个两边恒真的断言。

第二类则会训练出一种坏习惯：看到红就重跑。重跑三次取多数，本质上是在用人力做重试策略，而且把「不稳定」这个信号擦掉了。不稳定本身是信息，不该被擦掉。
<h2>复合成功率：二十步的 0.95 只剩 0.36</h2>

Agent 的任务是串行的：读文件、改一处、跑测试、看输出、再改一处。每一步都成功，任务才成功。所以任务成功率是每步成功率的乘积。

这张表解释了一件很反直觉的事：<strong>把单步成功率从 0.90 提到 0.95，二十步任务的成功率是从 12% 提到 36%，翻了三倍</strong>。而把它从 0.95 提到 0.98，是从 36% 到 67%。单步的几个百分点，在任务层是几倍。

它也解释了为什么「跑一次成功」几乎不能说明什么：一次 20 步的成功，在单步 0.95 的系统上本来就有 36% 的概率发生。你观察到的可能只是那 36%。

所以评测的第一个动作不是加样本，而是<strong>数一数这个任务有多少步</strong>。步数决定了你需要多高的单步可靠性，也决定了你应该把重复次数花在哪里。
<h2>通过率需要一个分母</h2>

「通过率 90%」这句话本身不完整。完整的写法至少要有四个字段：
<div class="codehilite"><pre><span></span><code>pass_rate = 通过的运行次数 / 总运行次数
任务数     = 12 个真实任务
每任务次数 = 5 次
总运行次数 = 60
通过判定   = 文件内容匹配 + 退出码 0 + 轮数 &lt;= 8
</code></pre></div>


换成一句话：<strong>分子是什么、分母是什么、判定是什么、跑了几次</strong>。缺任何一个，这个数字都可以被解释成任意结论。

常见的三种缺分母写法：
<ul>
<li>「我跑了三个 case，都过了」——分母是 3，没有统计意义，但作为冒烟测试是合格的</li>
<li>「我们的 eval 是 87 分」——分子分母都不清楚，87 分可能来自 100 个 case 的加权，也可能来自 10 个 case 的主观打分</li>
<li>「提升后从 80% 到 85%」——如果各跑了 10 次，这个 5 个点的差值完全在噪声里</li>
</ul>

最后一条最需要警惕。两个版本的差值，必须和置信区间一起看。
<h2>十次全过能说明什么</h2>

用 Wilson 区间算一下。假设真实通过率未知，你跑了 n 次全部通过，95% 置信区间的下界是这样的：
<div class="table-scroll"><table>
<thead>
<tr>
<th>运行次数 n</th>
<th>全过时的下界</th>
<th>换句话说</th>
</tr>
</thead>
<tbody>
<tr>
<td>10</td>
<td>72.2%</td>
<td>真实通过率可能只有七成</td>
</tr>
<tr>
<td>20</td>
<td>83.9%</td>
<td>仍然可能不到九成</td>
</tr>
<tr>
<td>50</td>
<td>92.9%</td>
<td>才开始像「九成以上」</td>
</tr>
<tr>
<td>100</td>
<td>96.3%</td>
<td>可以说「大概率九成五以上」</td>
</tr>
</tbody>
</table></div>

计算用的是 Wilson 分数区间，<code>z = 1.96</code>，全通过时下界简化为 <code>1 / (1 + z²/n)</code>。这个式子很好记：<strong>分母里的 <code>z²/n</code> 就是「样本不够」的罚项</strong>。

所以「跑了十次都过」的正确结论是「失败率大概率低于 26%」，而不是「它很稳」。这个区别在决策时很要命：26% 的失败率意味着每四个用户就有一个踩坑。
<h2>零失败只能证明一个上界</h2>

如果一次失败都没看到，你唯一能说的是「失败率不高于某个值」。这个上界的经典估法是「三倍法则」：n 次零失败，95% 置信上界约为 <code>3/n</code>。
<div class="table-scroll"><table>
<thead>
<tr>
<th>零失败的次数</th>
<th>失败率上界</th>
<th>适用结论</th>
</tr>
</thead>
<tbody>
<tr>
<td>10</td>
<td>26%</td>
<td>只能证明「不是必崩」</td>
</tr>
<tr>
<td>30</td>
<td>9.5%</td>
<td>可以接受一个内部工具</td>
</tr>
<tr>
<td>60</td>
<td>4.9%</td>
<td>可以对小范围用户开放</td>
</tr>
<tr>
<td>300</td>
<td>1.0%</td>
<td>才够谈「稳定」</td>
</tr>
</tbody>
</table></div>

反过来，如果你想用 ±5% 的精度估计一个 95% 的通过率，需要多少次？按正态近似 <code>n ≈ z²p(1-p)/e²</code>，代入 <code>p=0.95</code>、<code>e=0.05</code>，得到约 73 次。

这两个数字放在一起，就能回答一个很实际的问题：<strong>你的评测预算够不够支撑你想说的那句话</strong>。如果只跑 10 次，就别在周报里写「通过率 95%」。
<h2>pass@1 与 pass@k 不是同一个数</h2>

同一个模型，同一个任务，跑 k 次，只要有一次成功就算过，这叫 pass@k；每次都必须成功，那是 pass@1 的 k 次平均。两者可以差很远。
<div class="table-scroll"><table>
<thead>
<tr>
<th>指标</th>
<th>定义</th>
<th>分母</th>
<th>回答的问题</th>
</tr>
</thead>
<tbody>
<tr>
<td>pass@1</td>
<td>单次运行成功率</td>
<td>运行次数</td>
<td>用户第一次用会怎样</td>
</tr>
<tr>
<td>pass@k</td>
<td>k 次里至少成功一次的比例</td>
<td>任务数</td>
<td>给用户 k 次机会会怎样</td>
</tr>
<tr>
<td>flaky rate</td>
<td>同一版本上既过又挂的任务占比</td>
<td>被重复的任务数</td>
<td>系统稳不稳</td>
</tr>
<tr>
<td>完成率</td>
<td>明确标记为完成的运行占比</td>
<td>运行次数</td>
<td>它有没有把事做完</td>
</tr>
<tr>
<td>平均轮数</td>
<td>每任务模型请求次数</td>
<td>运行次数</td>
<td>效率与成本</td>
</tr>
</tbody>
</table></div>

对 agent 来说，最有用的往往不是 pass@1，而是 <strong>pass@1 和完成率的差值</strong>。因为 agent 有一种特有的失败：它「答了」，但没「做完」。后文会看到，NanoHermes 的 <code>run()</code> 在轮次耗尽时仍然返回 <code>Ok</code>，所以只看返回值，你分不出「做完了」和「跑到上限了」。

pass@k 也不是越高越好。如果一个任务需要 5 次才能成功一次，那它对用户来说仍然是不可用的，因为用户不会跑 5 次。pass@k 适合用来判断「模型有没有这个能力」，不适合用来判断「产品能不能上线」。
<h2>flaky 只能靠重复发现</h2>

不稳定（flaky）的定义是：<strong>同一份代码、同一个任务，多次运行结果不同</strong>。这个定义本身就说明，它不可能被单次运行发现。

发现它需要三个条件：同一 commit、重复运行、逐次记录。缺了任何一个，你看到的都只是「这次挂了」或者「这次过了」。

一个可操作的判定：
<div class="codehilite"><pre><span></span><code>对每个 case 跑 N=5 次
  5/5 通过        -&gt; stable pass
  0/5 通过        -&gt; stable fail（真 bug）
  1..4/5 通过     -&gt; flaky（最该修的一类）
</code></pre></div>


第三类是评测里最有价值的数据。它既不是「功能坏了」，也不是「功能好了」，而是「功能取决于运气」。运气在本地是随机的，在线上是随负载变化的，所以它会在最忙的时候集中爆发。
<h2>评测的最小闭环</h2>

一个能用的评测，最少有六个环节。少一个，它就会退化成「跑一次看看」。
<div class="table-scroll"><table>
<thead>
<tr>
<th>环节</th>
<th>输入</th>
<th>输出</th>
<th>常见缺失</th>
</tr>
</thead>
<tbody>
<tr>
<td>采样</td>
<td>真实任务或事故</td>
<td>一批 case</td>
<td>只用自己编的玩具任务</td>
</tr>
<tr>
<td>执行</td>
<td>case + 被测版本</td>
<td>每次运行的轨迹</td>
<td>只存最终答案</td>
</tr>
<tr>
<td>断言</td>
<td>轨迹 + 期望</td>
<td>通过 / 降级 / 失败</td>
<td>只断言字符串相等</td>
</tr>
<tr>
<td>记账</td>
<td>每次运行的指标</td>
<td>分子分母、成本</td>
<td>不记轮数与字节</td>
</tr>
<tr>
<td>归因</td>
<td>失败轨迹</td>

</tr>
<tr>
<td>回归</td>

</tr>
</tbody>
</table></div>

「执行」这一环最容易被做薄。多数人只存一个最终字符串，而 agent 的轨迹里有请求体、工具调用序列、每次的 usage、重试次数、耗时。这些不存，后面的归因就无从下手。
<h2>口径先行：什么叫成功</h2>

在写第一行评测代码之前，先把「成功」写成一句可以判定的规则。对 agent 来说，至少要回答四个问题。

第一，<strong>结果对不对</strong>。文件内容是否匹配、命令退出码是否为 0、答案是否包含关键结论。

第二，<strong>过程对不对</strong>。有没有调用不该调的工具、有没有跳过该做的确认、工具调用次数是否在预算内。

第三，<strong>有没有做完</strong>。是正常结束，还是撞上了轮次上限，还是被中断。

第四，<strong>代价是多少</strong>。轮数、请求字节、耗时是否在预算内。

四问里最容易被忽略的是第三问。因为大多数 API 的返回类型只有一个 <code>Result&lt;String, String&gt;</code>，而「没做完」既不产生 <code>Err</code>，也不产生特殊的字符串。它就静悄悄地混在成功里。
<h2>四层断言：字节、过程、结果、成本</h2>

把上面的四问落成四层断言，从下往上，越往下越稳定，越往上越接近用户。
<div class="table-scroll"><table>
<thead>
<tr>
<th>层</th>
<th>断言对象</th>
<th>例子</th>
<th>抓什么</th>
<th>稳定性</th>
</tr>
</thead>
<tbody>
<tr>
<td>L1 字节层</td>

</tr>

</tr>
<tr>

为什么要分四层而不是只写 L3？因为 L3 的失败很难归因。文件内容不对，可能是模型选错了工具，可能是工具本身有 bug，可能是上一步读错了文件，也可能是上下文被压缩掉了关键信息。而 L1 和 L2 能把范围直接缩到一层。

这也是「评测」和「测试」的分水岭：测试通常只写 L3，评测必须写 L1 到 L4，因为评测的目的是<strong>定位</strong>，不只是判定。

</tr>

模块分布很不均匀。工具有 23 个（<code>read_file</code>、<code>write_file</code>、<code>edit_file</code>、<code>apply_patch</code>、<code>list_dir</code>、<code>grep</code>、<code>glob</code>、<code>run_command</code>、<code>task_output</code>、<code>task_list</code>、<code>task_kill</code>、<code>web_fetch</code>、<code>web_search</code>、<code>todo_write</code>、<code>todo_read</code>、<code>git_status</code>、<code>git_diff</code>、<code>git_log</code>、<code>git_commit</code>、<code>skill</code>、<code>memory_save</code>、<code>memory_search</code>、<code>agent_list</code>），各自有 2 到 8 个单元测试；但<strong>负责把模型给的名字路由到实现的 <code>tools/mod.rs</code> 里，一个测试都没有</strong>。

同样没有测试的还有两个关键行为：上下文压缩 <code>compact_with</code> 没有用例；多会话守护进程的消息替换没有用例。它们都在 <code>run()</code> 的路径上，而 <code>run()</code> 本身只在 5 个 e2e 里出现。

这不是「测试少」。293 个用例不算少。问题是它们几乎全部集中在 L3 以下的函数层，而 agent 的失效大多发生在 L1 和 L2。
<h2>e2e mock 是怎么搭的</h2>

先把它做对的部分说清楚，因为后面要补的东西必须建立在这套骨架上，而不是重写一套。

五个用例分别是：工具调用往返、纯文本流式、非流式 JSON、瞬时 500 重试、硬错误传播。它们的共同结构是「给定一串固定响应，断言最终答案」。

这段代码的断言质量其实不低：它验证了 SSE 增量拼参数、工具真的写盘、两轮请求的 usage 被累加。比「断言返回非空」强得多。

问题在所有用例都止步于此。没有任何一行代码去看「第一轮请求里到底有没有 <code>write_file</code> 这个工具」。
<h2>它做对了四件事</h2>

先列出值得抄走的四件事，它们决定一套评测骨架能不能长期维护。
<div class="table-scroll"><table>
<thead>
<tr>
<th>做法</th>
<th>为什么重要</th>
<th>代价</th>
</tr>
</thead>
<tbody>
<tr>
<td>只依赖标准库</td>
<td>不引依赖就不会因为依赖升级而红</td>
<td>手写 HTTP 解析</td>
</tr>
<tr>
<td>绑定 <code>127.0.0.1:0</code></td>
<td>内核分配端口，并行测试不抢端口</td>
<td>无</td>
</tr>
<tr>
<td>临时目录带 pid + 纳秒 + 计数</td>
<td>并行测试不互相覆盖</td>
<td>无</td>
</tr>
<tr>
<td>把 Tauri / 终端输出注入成 sink</td>
<td>测试日志干净，断言不被横幅干扰</td>
<td>需要可注入的 UI 层</td>
</tr>
</tbody>
</table></div>

第四条尤其值得说。<code>silent(&amp;mut agent)</code> 把流式文本、工具横幅全部导到一个空 sink，测试输出里只剩断言失败信息。很多项目的测试难读，就是因为被测代码直接 <code>println!</code>，一跑几百行。

还有一个隐性的好设计：mock 只讲 HTTP，不讲 SDK。它验证的是协议层，换一个兼容服务端，测试仍然有效。
<h2>缺口一：请求读出来又丢掉</h2>

这是全文最重要的一处证据。
<div class="codehilite"><pre><span></span><code><span class="c1">// agent/tests/e2e_mock_llm.rs</span>
<span class="n">read_full_request</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">stream</span><span class="p">);</span><span class="w">   </span><span class="c1">// 返回值 Vec&lt;u8&gt; 被丢弃</span>
<span class="kd">let</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">stream</span><span class="p">.</span><span class="n">write_all</span><span class="p">(</span><span class="n">responses</span><span class="p">[</span><span class="n">served</span><span class="p">].</span><span class="n">as_bytes</span><span class="p">());</span>
</code></pre></div>


后果可以直接推导出来：五个用例里，没有任何一个能发现「请求体被改坏」。

做一个思想实验。把 <code>Agent::build_tools()</code> 改成永远返回空数组，也就是告诉模型「你没有任何工具」。会发生什么？
<ul>
<li>请求体里 <code>tools</code> 字段消失，模型在真实环境里将无法调用任何工具</li>
<li>但 mock 不看请求，它照着剧本返回「请调用 write_file」</li>
<li><code>execute()</code> 只按名字路由，不检查这个工具有没有被声明</li>
<li>于是文件照样被写出，<code>usage.requests</code> 照样是 2，五个用例照样全绿</li>
</ul>

同理，把 system prompt 改成空字符串、把 <code>max_tokens</code> 改成 1、把 <code>stream_options.include_usage</code> 删掉，这五个用例大概率仍然全绿，因为断言只落在「答案」和「usage」上，而 usage 来自 mock 的响应，不来自请求。

这就是「只跑一次的测试」最典型的形态：它不是没跑，而是<strong>跑了一条不需要被测代码正确也能通过的路径</strong>。
<h2>缺口二：测试配置关掉了生产路径</h2>

看 <code>cfg_for</code> 这个辅助函数：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">cfg_for</span><span class="p">(</span><span class="n">base_url</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">workspace</span><span class="p">:</span><span class="w"> </span><span class="nc">PathBuf</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Config</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">Config</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">api_key</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;test-key&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="w">        </span><span class="n">base_url</span><span class="p">,</span>
<span class="w">        </span><span class="n">model</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;mock-model&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="w">        </span><span class="n">stream</span><span class="p">:</span><span class="w"> </span><span class="nc">true</span><span class="p">,</span>
<span class="w">        </span><span class="n">workspace</span><span class="p">,</span>
<span class="w">        </span><span class="n">auto_approve</span><span class="p">:</span><span class="w"> </span><span class="nc">true</span><span class="p">,</span>
<span class="w">        </span><span class="n">max_retries</span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">,</span>
<span class="w">        </span><span class="n">retry_base_ms</span><span class="p">:</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span>
<span class="w">        </span><span class="n">timeout_secs</span><span class="p">:</span><span class="w"> </span><span class="mi">10</span><span class="p">,</span>
<span class="w">        </span><span class="n">project_docs</span><span class="p">:</span><span class="w"> </span><span class="nc">false</span><span class="p">,</span>
<span class="w">        </span><span class="n">memory</span><span class="p">:</span><span class="w"> </span><span class="nc">false</span><span class="p">,</span>
<span class="w">        </span><span class="o">..</span><span class="n">Config</span><span class="p">::</span><span class="n">default</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


每一行都有理由：<code>auto_approve</code> 避免测试卡在交互上，<code>memory: false</code> 避免碰真实用户目录，<code>project_docs: false</code> 避免读仓库里的 <code>AGENTS.md</code>。这些是为了「测试可控」而做的合理取舍。

但合起来的效果是：<strong>e2e 跑的不是生产配置</strong>。生产里 <code>project_docs</code> 默认开、记忆块每轮注入、审批会拦命令、沙箱会限制路径。这些路径在 e2e 里一条都没走到。

更具体地说，生产请求的 <code>messages[0]</code> 长这样：基础提示词 + 人设 + <code>AGENTS.md</code> 摘要 + 记忆块。而 e2e 里 <code>messages[0]</code> 只有基础提示词。于是「记忆块每轮重写导致前缀抖动」这个真实问题（上一篇用整节篇幅讲过），在 e2e 里根本不可能被观察到。

这不是「测试写错了」，而是「测试的配置和生产不是同一个」。评测要抓的恰恰是这种偏差：<strong>被测对象要和上线对象一致，否则测的是另一个系统</strong>。
<h2>缺口三：审批与沙箱被短路</h2>

<code>auto_approve: true</code> 会把审批路径整条跳过。沙箱默认也是关闭的，所以 e2e 里的 <code>run_command</code> 是在无约束环境下跑的。

审批策略本身有单元测试：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">approval_policy_decisions</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">needs_approval</span><span class="p">(</span><span class="kc">true</span><span class="p">,</span><span class="w"> </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">Untrusted</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;rm -rf /&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">needs_approval</span><span class="p">(</span><span class="kc">false</span><span class="p">,</span><span class="w"> </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">Never</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;rm -rf /&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="n">needs_approval</span><span class="p">(</span><span class="kc">false</span><span class="p">,</span><span class="w"> </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">Untrusted</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;ls&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">needs_approval</span><span class="p">(</span><span class="kc">false</span><span class="p">,</span><span class="w"> </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">OnRequest</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;ls -la&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="n">needs_approval</span><span class="p">(</span><span class="kc">false</span><span class="p">,</span><span class="w"> </span><span class="n">ApprovalPolicy</span><span class="p">::</span><span class="n">OnRequest</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;rm -rf /&quot;</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


这个测试证明了「决策函数是对的」，但没有证明「决策被接进了执行路径」。前者是 L3，后者是 L2。中间少的那一段，正是 agent 最容易出事的地方：策略写对了，但某条分支没调用它。

评测里要补的不是再写十个 <code>needs_approval</code> 的断言，而是一条过程断言：<strong>给定 <code>ApprovalPolicy::Untrusted</code>，模型请求 <code>run_command</code> 时，这一轮必须停下来等待确认，而不是直接执行</strong>。这条断言需要 mock 能观察到「请求了几次」「第二次请求里有没有工具结果」，也就是需要 L1 能力。
<h2>缺口四：<code>Ok</code> 不等于「完成」</h2>

<code>run()</code> 的签名是 <code>Result&lt;String, String&gt;</code>。看它在轮次耗尽时的行为：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
<span class="k">if</span><span class="w"> </span><span class="n">interrupted</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">warn</span><span class="p">(</span><span class="s">&quot;interrupted — the conversation was kept; ...&quot;</span><span class="p">);</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">completed</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">warn</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;reached the {} iteration limit without finishing&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">max_iterations</span>
<span class="w">    </span><span class="p">));</span>
<span class="p">}</span>
<span class="bp">self</span><span class="p">.</span><span class="n">persist</span><span class="p">();</span>
<span class="nb">Ok</span><span class="p">(</span><span class="n">final_text</span><span class="p">)</span>
</code></pre></div>


三条出口——正常完成、被中断、撞上轮次上限——返回的都是 <code>Ok</code>。区别只在于往 UI 打了一行警告。

于是 e2e 里这句：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">answer</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">run</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">(</span><span class="s">&quot;write a file&quot;</span><span class="p">)).</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;turn completes&quot;</span><span class="p">);</span>
</code></pre></div>


断言的是「没有返回 Err」，而不是「任务完成了」。如果模型在第 40 轮还在调用工具，测试会拿到最后一次的文本（可能是个半截答案），然后心满意足地变绿。

这是 API 设计层面的「口径缺失」：成功和未完成共用一个返回类型，调用方无法区分。评测要做的第一件事，就是把这个区分补回来（后文给改法）。
<h2>缺口五：条件跳过冒充通过</h2>

有两个测试在条件不满足时会直接 <code>return</code>，而在测试框架眼里，<code>return</code> 就是通过。
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">landlock_enforces_workspace_boundaries</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">is_supported</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;skipping: Landlock unavailable in this environment&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="k">return</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


<code>is_supported()</code> 在非 Linux 平台恒为 <code>false</code>。而 CI 是 <code>runs-on: windows-latest</code>。也就是说，<strong>这个测试在 CI 上永远跳过，永远不会红，也永远什么都没验证</strong>。

类似地：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">status_diff_commit_log_round_trip</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">git_available</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;skipping: git not installed&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="k">return</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


git 在 GitHub 的 Windows 镜像上通常存在，所以这条多数时候会真跑。但只要环境一变，它就会安静地变成「假通过」。

还有一类更隐蔽的：整个测试被 <code>#[cfg(unix)]</code> 编译排除。<code>hooks.rs</code> 里四个行为测试都带这个属性，而 CI 只跑 Windows。于是「钩子能拿到工具名」「钩子退出码能透传」「钩子先写后读不会死锁」这三类行为，在 CI 上从未被执行过——不是跳过，是压根没编进去。

正确的做法不是删掉这些测试，而是让「跳过」在报表里可见：用 <code>#[ignore]</code> 加原因、用测试框架的 skip 标记、或者在 CI 里加一个 Linux job 专门跑平台相关用例。<strong>跳过必须是红色的另一种形态，不能是绿色的另一种形态。</strong>
<h2>缺口六：名字里的断言没落地</h2>

有两个测试的名字承诺了某件事，但代码没有验证它。

第一个：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">surfaces_a_hard_api_error_without_hanging</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">run</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">(</span><span class="s">&quot;hi&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">e</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">result</span><span class="p">.</span><span class="n">expect_err</span><span class="p">(</span><span class="s">&quot;an API error should propagate&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;bad key&quot;</span><span class="p">),</span><span class="w"> </span><span class="s">&quot;unexpected error: {e}&quot;</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


名字里的 <code>without_hanging</code> 没有任何断言支撑。如果代码真的卡住了，测试就会一直卡着，CI job 超时——那是另一个信号，不是这条测试发出的。要兑现这个名字，至少需要 <code>Instant::now()</code> 和一句 <code>assert!(elapsed &lt; Duration::from_secs(15))</code>。

第二个：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">retries_a_transient_server_error_then_succeeds</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// mock 只有两个响应：500 和 200</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">answer</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">run</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">(</span><span class="s">&quot;hi&quot;</span><span class="p">)).</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;turn completes&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="fm">assert_eq!</span><span class="p">(</span><span class="n">answer</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;recovered&quot;</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


它没有断言「恰好请求了两次」。如果实现里多试了一次，第三次连接会因为 mock 已经退出而失败，测试确实会红——但那是「碰巧被抓住」，不是「显式断言」。如果 mock 恰好准备了三个响应（比如为了别的用例复用），这个 bug 就漏了。

命名是给未来的人看的。名字和断言不一致，比没有这个名字更糟，因为它会让人以为覆盖已经存在。
<h2>缺口七：压缩与并发批次没有用例</h2>

<code>compact_with</code> 是 <code>run()</code> 每轮结束都会调用的函数，负责在上下文超过 120,000 字节时把最老的消息换成摘要。它做的事情很危险：删消息、插消息、改消息顺序。删错了会留下「有 tool_calls 没有 tool 结果」的孤儿消息，下一轮请求会被服务端直接拒绝。

这个函数没有任何测试。

同样没有测试的是 <code>run()</code> 里的并发分批：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">batch</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">chunks</span><span class="p">(</span><span class="n">MAX_PARALLEL_TOOL_CALLS</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">handles</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">batch</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">call</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">spawn</span><span class="p">(</span><span class="k">move</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="n">this</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">)))</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="c1">// ...</span>
<span class="p">}</span>
</code></pre></div>


现有的并发测试是直接对 <code>execute()</code> 开线程，跑 30 个调用，验证线程安全。但 <code>chunks(8)</code> 这个分批逻辑（9 个调用会分成 8 + 1 两批，顺序要保持）没有被任何一个测试覆盖。而这正是「模型一次返回 12 个工具调用」时会走的路。

还有一个更细的：<code>accumulate_tool_calls</code> 把流式工具调用的下标上限设为 64，防止恶意端点让 <code>resize</code> 申请巨量内存。这个防御没有测试——没有用例发一个 <code>index: 100000</code> 的帧，验证它被安静地丢掉。
<h2>一条恒真断言是怎么写出来的</h2>

<code>tasks.rs</code> 里有一条这样的断言：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">mgr</span><span class="p">.</span><span class="n">output</span><span class="p">(</span><span class="o">&amp;</span><span class="n">id</span><span class="p">).</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;output&quot;</span><span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span>
<span class="w">    </span><span class="n">start</span><span class="p">.</span><span class="n">elapsed</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">Duration</span><span class="p">::</span><span class="n">from_secs</span><span class="p">(</span><span class="mi">2</span><span class="p">),</span>
<span class="w">    </span><span class="s">&quot;polling a running task must not block: {out}&quot;</span>
<span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span><span class="n">out</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;no output yet&quot;</span><span class="p">)</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="o">!</span><span class="n">out</span><span class="p">.</span><span class="n">is_empty</span><span class="p">());</span>
</code></pre></div>


第一句是有意义的：轮询一个正在跑的任务不应该阻塞超过 2 秒。这是真正的 L2 断言。

第二句两边恒真：<code>!out.is_empty()</code> 几乎总是成立（输出至少包含状态头），所以整个 <code>||</code> 永远为真。它想验证的可能是「任务刚启动时输出还没就绪」，但写成 <code>A || B</code> 之后，只要 B 成立就通过，A 的语义被吞掉了。

这类断言不是漏了 bug，而是<strong>虚增覆盖感</strong>：看代码的人觉得有两句断言，实际只有一句在工作。

写断言时可以用一个自查问题：<strong>把被测函数改成永远返回空字符串，这条断言会不会红？</strong> 不会红的断言，就是装饰。

<h2>补法一：把 mock 变成记录器</h2>

最小改动是给 <code>MockLlm</code> 加一个共享的请求记录。不需要改被测代码一行。
<div class="codehilite"><pre><span></span><code><span class="k">use</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">sync</span><span class="p">::{</span><span class="n">Arc</span><span class="p">,</span><span class="w"> </span><span class="n">Mutex</span><span class="p">};</span>

这段代码只多了一个 <code>Arc&lt;Mutex&lt;Vec&lt;Vec&lt;u8&gt;&gt;&gt;&gt;</code> 和一个 <code>bodies()</code>。之后所有断言都建立在真实请求体上，而不是建立在「我相信它发对了」上。

注意用的是 <code>split("\r\n\r\n").nth(1)</code> 而不是 <code>last()</code>：请求体里也可能出现这个串（比如字符串里带换行），头一定在第一段，后面的都算体。
<h2>补法二：三个黄金请求断言</h2>

有了 <code>bodies()</code>，先补三条性价比最高的断言。它们分别对应 L1 的三个不同侧面。

第一条，请求次数：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">a_two_step_task_uses_exactly_two_requests</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// ... 跑一个「读一次、写一次」的脚本 ...</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">bodies</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">mock</span><span class="p">.</span><span class="n">bodies</span><span class="p">();</span>
<span class="w">    </span><span class="fm">assert_eq!</span><span class="p">(</span><span class="n">bodies</span><span class="p">.</span><span class="n">len</span><span class="p">(),</span><span class="w"> </span><span class="mi">2</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;轮数膨胀，实际请求体：{bodies:#?}&quot;</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


第二条，工具序列：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">tool_sequence</span><span class="p">(</span><span class="n">bodies</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="n">Value</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">bodies</span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">flat_map</span><span class="p">(</span><span class="o">|</span><span class="n">b</span><span class="o">|</span><span class="w"> </span><span class="n">b</span><span class="p">[</span><span class="s">&quot;tools&quot;</span><span class="p">].</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter_map</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">[</span><span class="s">&quot;function&quot;</span><span class="p">][</span><span class="s">&quot;name&quot;</span><span class="p">].</span><span class="n">as_str</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="kt">str</span><span class="p">::</span><span class="n">to_string</span><span class="p">))</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="p">}</span>

<span class="cp">#[test]</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">bodies</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">mock</span><span class="p">.</span><span class="n">bodies</span><span class="p">();</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">sorted</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">first</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>

<span class="p">}</span>
</code></pre></div>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">bodies</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">mock</span><span class="p">.</span><span class="n">bodies</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">first</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">prefix_hash</span><span class="p">(</span><span class="o">&amp;</span><span class="n">bodies</span><span class="p">[</span><span class="mi">0</span><span class="p">]);</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="n">i</span><span class="p">,</span><span class="w"> </span><span class="n">b</span><span class="p">)</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">bodies</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">enumerate</span><span class="p">().</span><span class="n">skip</span><span class="p">(</span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="fm">assert_eq!</span><span class="p">(</span><span class="n">prefix_hash</span><span class="p">(</span><span class="n">b</span><span class="p">),</span><span class="w"> </span><span class="n">first</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;第 {i} 轮的前缀变了&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这三条加起来不到四十行，覆盖的却是「成本退化」和「能力消失」两类最贵的回归。而且它们都写在测试侧，不需要改生产代码。
<h2>补法三：把固定脚本换成状态机</h2>

固定队列的 mock 有一个结构性问题：<strong>它按顺序发牌，和请求内容无关</strong>。这会让测试变得「只能演一遍」，也让并行和重试变得不可能。

改法是让响应成为请求的函数：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">respond</span><span class="p">(</span><span class="n">req</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">messages</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">req</span><span class="p">[</span><span class="s">&quot;messages&quot;</span><span class="p">].</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">has_tool_result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">messages</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">m</span><span class="p">[</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">user_text</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">messages</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">rev</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">m</span><span class="p">[</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">m</span><span class="p">[</span><span class="s">&quot;content&quot;</span><span class="p">].</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">        </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>

<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">user_text</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;写&quot;</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">has_tool_result</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">sse_tool_call</span><span class="p">(</span><span class="s">&quot;write_file&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">r#&quot;{&quot;path&quot;:&quot;hello.txt&quot;,&quot;content&quot;:&quot;hi&quot;}&quot;#</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="n">user_text</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;写&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">sse_text</span><span class="p">(</span><span class="s">&quot;done&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">sse_text</span><span class="p">(</span><span class="s">&quot;ok&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这变成了一个显式的状态机：状态是「有没有工具结果」，转移由请求内容决定。好处有三个：
<ul>
<li>不需要预先准备好响应数量，跑 3 次和跑 30 次都能用</li>
<li>可以在任意一步注入故障，因为每一步都是独立判断的</li>
<li>断言可以针对「第几次请求长什么样」，而不是「第几个响应被消费了」</li>
</ul>

代价是 mock 变复杂了。但这个复杂度换来的是「可以被重复执行」，而重复正是评测的地基。
<h2>补法四：故障注入矩阵</h2>

故障覆盖是评测和冒烟测试最大的分水岭。一个只测 happy path 的套件，通过率会虚高到没有参考价值。

先列矩阵，再决定测哪些。下面这张表是按 NanoHermes 的实际代码判定的。
<div class="table-scroll"><table>
<thead>
<tr>
<th>故障</th>
<th>注入方式</th>
<th>期望行为</th>
<th>现状</th>
<th>有测试</th>
</tr>
</thead>
<tbody>
<tr>
<td>429</td>
<td>返回 429</td>
<td>退避重试</td>
<td>重试</td>
<td>间接</td>
</tr>
<tr>
<td>500 / 502 / 503 / 504</td>
<td>返回对应状态码</td>
<td>退避重试</td>
<td>重试</td>
<td>1 个用例（500）</td>
</tr>
<tr>
<td>超时</td>
<td>收到请求后不响应</td>
<td>超时后重试或明确报错</td>
<td>报错但不重试</td>
<td>无</td>
</tr>
<tr>
<td>连接重置</td>
<td>直接关连接</td>
<td>明确报错</td>
<td>报错但不重试</td>
<td>无</td>
</tr>
<tr>
<td>流中断（有帧无 <code>[DONE]</code>）</td>
<td>发两帧后关闭</td>
<td>明确报错</td>
<td>当成成功</td>
<td>无</td>
</tr>
<tr>
<td>空流（200 无帧）</td>
<td>只发头</td>
<td>明确报错</td>
<td>报错</td>
<td>无</td>
</tr>
<tr>
<td>坏 JSON 帧</td>
<td><code>data: {oops</code></td>
<td>跳过坏帧</td>
<td>跳过</td>
<td>无</td>
</tr>
<tr>
<td>工具参数非法</td>
<td><code>arguments: "{x"</code></td>
<td>回灌 ERROR</td>
<td>是</td>
<td>无</td>
</tr>
<tr>
<td>工具线程 panic</td>
<td>让工具 panic</td>
<td>回灌 ERROR 且不中断整轮</td>
<td>是</td>
<td>无</td>
</tr>
<tr>
<td>服务端返回 <code>error</code> 字段</td>
<td>200 + error</td>
<td>抛出</td>
<td>是</td>
<td>1 个用例</td>
</tr>
</tbody>
</table></div>

第三行和第五行值得展开，因为它们的现状是「代码里能读出来，测试里看不到」。

先看超时。<code>is_retryable_error</code> 只认五个 HTTP 状态码：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">is_retryable_error</span><span class="p">(</span><span class="n">e</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;HTTP 429&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;HTTP 500&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;HTTP 502&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;HTTP 503&quot;</span><span class="p">)</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">contains</span><span class="p">(</span><span class="s">&quot;HTTP 504&quot;</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


而超时在 <code>chat_with_model</code> 里被格式化成 <code>request failed: ...</code>。这个字符串一个状态码都不含，所以<strong>即使 <code>max_retries</code> 大于 0，超时也不会重试</strong>。更微妙的是，单元测试把这个行为固化了：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">retryable_errors_are_recognised</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="n">is_retryable_error</span><span class="p">(</span><span class="s">&quot;HTTP 429 from API: rate limited&quot;</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert!</span><span class="p">(</span><span class="o">!</span><span class="n">is_retryable_error</span><span class="p">(</span><span class="s">&quot;request failed: dns error&quot;</span><span class="p">));</span>
<span class="p">}</span>
</code></pre></div>


这句 <code>assert!(!...)</code> 在当时的语境里是对的（DNS 错误确实不该重试），但它同时也把「所有传输错误都不重试」写进了契约。绿灯在这里不是保障，是枷锁。

再看流中断。<code>read_stream</code> 的结束条件是读到 EOF 或者 <code>[DONE]</code>：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">saw_done</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">saw_frame</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="s">&quot;stream ended without any JSON events ...&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">());</span>
<span class="p">}</span>
<span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">)</span>
</code></pre></div>


只要收到过一帧，即使连接在半路被掐断、没有 <code>[DONE]</code>，也会返回 <code>Ok</code>。对聊天来说这是「答案短了一截」，对 agent 来说这是「工具参数只拼了一半」——<code>accumulate_tool_calls</code> 会拿半个 JSON 去 <code>serde_json::from_str</code>，然后回灌一个 <code>invalid JSON arguments</code> 错误给模型。整轮不会崩，但会多烧一轮。

故障注入的代码很短：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">stalled_response</span><span class="p">()</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 只发头，不发体，也不关闭；让客户端的 timeout 生效</span>
<span class="w">    </span><span class="s">&quot;HTTP/1.1 200 OK</span><span class="se">\r\n</span><span class="s">Content-Type: text/event-stream</span><span class="se">\r\n\r\n</span><span class="s">&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">()</span>
<span class="p">}</span>

<span class="k">fn</span><span class="w"> </span><span class="nf">truncated_stream</span><span class="p">()</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">frame</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;choices&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="s">&quot;delta&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;半&quot;</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="p">]</span><span class="w"> </span><span class="p">});</span>
<span class="w">    </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;HTTP/1.1 200 OK</span><span class="se">\r\n</span><span class="s">Content-Type: text/event-stream</span><span class="se">\r\n\r\n</span><span class="s">\</span>
<span class="s">         data: {frame}</span><span class="se">\r\n\r\n</span><span class="s">&quot;</span>
<span class="w">    </span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


注意 <code>stalled_response</code> 不能真的「不关闭」——测试进程会一直挂着。正确做法是发完头之后 sleep 到客户端的 timeout 到期，或者用 <code>timeout_secs: 1</code> 把等待压到一秒。这也是评测里常见的坑：<strong>你想测超时，但测试自己先超时了</strong>。
<h2>补法五：给「完成」一个类型</h2>

前面说过，<code>run()</code> 的三种出口共用一个 <code>Ok</code>。最小的修法是加一个枚举，不动错误路径：
<div class="codehilite"><pre><span></span><code><span class="cp">#[derive(Debug, PartialEq, Eq)]</span>
<span class="k">pub</span><span class="w"> </span><span class="k">enum</span><span class="w"> </span><span class="nc">TurnOutcome</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">Completed</span><span class="p">(</span><span class="nb">String</span><span class="p">),</span>
<span class="w">    </span><span class="n">Interrupted</span><span class="p">(</span><span class="nb">String</span><span class="p">),</span>
<span class="w">    </span><span class="n">IterationLimit</span><span class="p">(</span><span class="nb">String</span><span class="p">),</span>
<span class="p">}</span>

<span class="k">impl</span><span class="w"> </span><span class="n">Agent</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">run_with_outcome</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">content</span><span class="p">:</span><span class="w"> </span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="n">TurnOutcome</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="c1">// 与 run() 共用主体，只是把结尾的三个分支映射成枚举</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


保留 <code>run()</code> 作为薄包装，返回字符串，避免影响现有调用方：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">run</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">content</span><span class="p">:</span><span class="w"> </span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="bp">self</span><span class="p">.</span><span class="n">run_with_outcome</span><span class="p">(</span><span class="n">content</span><span class="p">)</span><span class="o">?</span>
<span class="w">        </span><span class="p">.</span><span class="n">into_text</span><span class="p">())</span>
<span class="p">}</span>
</code></pre></div>


有了这个类型，评测里就能写：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">outcome</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">run_with_outcome</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">(</span><span class="s">&quot;fix the bug&quot;</span><span class="p">)).</span><span class="n">expect</span><span class="p">(</span><span class="s">&quot;no hard error&quot;</span><span class="p">);</span>
<span class="fm">assert!</span><span class="p">(</span>
<span class="w">    </span><span class="fm">matches!</span><span class="p">(</span><span class="n">outcome</span><span class="p">,</span><span class="w"> </span><span class="n">TurnOutcome</span><span class="p">::</span><span class="n">Completed</span><span class="p">(</span><span class="n">_</span><span class="p">)),</span>
<span class="w">    </span><span class="s">&quot;任务没做完：{outcome:?}&quot;</span>
<span class="p">);</span>
</code></pre></div>


这一句断言的价值超过前面所有 L3 断言之和，因为它把「答了」和「做完了」分开了。而这两件事在 agent 场景里经常不一致。

<code>usage.requests</code> 只在 <code>complete()</code> 成功后才自增，失败的请求不进账本。要统计重试成本，得看 mock 记录的请求次数；两个数字的差值就是失败请求数。
<h2>补法六：评测集从事故倒推</h2>

评测集最容易犯的错，是编 50 个「典型任务」：需求一句话说清，环境全新，没有历史包袱。

真实的评测集应该从事故里长出来。每修一个线上问题，就问三个问题：
<ul>
<li>这个问题的最小复现是什么？（几条消息、几个文件、什么环境）</li>
<li>它属于哪一类？（模型、提示、工具、编排、环境）</li>
<li>如果下个版本再犯，哪条断言能抓住它？</li>
</ul>

第三个问题的答案，就是新 case 的断言部分。
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>例子</th>
<th>转成 case 的形态</th>
</tr>
</thead>
<tbody>
<tr>
<td>线上事故</td>
<td>用户说「改错了地方」</td>
<td>多文件仓库 + 指定文件 + 断言只改那一处</td>
</tr>
<tr>
<td>回归</td>
<td>上个版本能用，这个版本不行</td>
<td>同一脚本，两个版本对比</td>
</tr>
<tr>
<td>边界</td>
<td>空文件、超长文件、非 UTF-8</td>
<td>固定 fixture</td>
</tr>
<tr>
<td>成本事故</td>
<td>某任务烧了 40 轮</td>
<td>断言轮数不超过基线</td>
</tr>
<tr>
<td>安全事件</td>
<td>命令被自动执行</td>
<td>断言审批被触发</td>
</tr>
</tbody>
</table></div>

这样长出来的评测集有个天然优势：<strong>每个 case 都有一个真实的故事</strong>。当它在 CI 上红的时候，你不需要猜「这个 case 想测什么」，因为标题里就写着那次事故。
<h2>样本的五个字段</h2>

一个评测样本（case）最少要有五个字段。少一个，它就会在半年后变成一段没人敢删的代码。
<div class="table-scroll"><table>
<thead>
<tr>
<th>字段</th>
<th>作用</th>
<th>缺了会怎样</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>id</code></td>
<td>稳定标识，跨版本对比用</td>
<td>报表无法对齐</td>
</tr>
<tr>
<td><code>task</code></td>
<td>用户指令原文</td>
<td>不知道在测什么</td>
</tr>
<tr>
<td><code>fixture</code></td>
<td>初始文件与环境</td>
<td>结果不可复现</td>
</tr>
<tr>
<td><code>oracle</code></td>
<td>判定规则</td>
<td>只能人工看</td>
</tr>
<tr>
<td><code>severity</code></td>
<td>失败的影响等级</td>
<td>无法排优先级</td>
</tr>
</tbody>
</table></div>

写成 JSON 大概是这样：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;id&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;edit-wrong-file-001&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;task&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;把 src/handlers/user.rs 里的 unwrap 改成显式错误处理&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;fixture&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;fixtures/edit-wrong-file-001/&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;oracle&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nt">&quot;files_changed&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;src/handlers/user.rs&quot;</span><span class="p">],</span>
<span class="w">    </span><span class="nt">&quot;must_not_change&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;src/handlers/order.rs&quot;</span><span class="p">],</span>
<span class="w">    </span><span class="nt">&quot;max_turns&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">8</span><span class="p">,</span>
<span class="w">    </span><span class="nt">&quot;must_complete&quot;</span><span class="p">:</span><span class="w"> </span><span class="kc">true</span>
<span class="w">  </span><span class="p">},</span>
<span class="w">  </span><span class="nt">&quot;severity&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;high&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;source&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;incident-2026-09-14&quot;</span>
<span class="p">}</span>
</code></pre></div>


<code>oracle</code> 里最容易被漏掉的是 <code>must_not_change</code>。只断言「改对了」不够，还要断言「没改别的地方」——agent 最典型的破坏不是没改，是改多了。<code>max_turns</code> 和 <code>must_complete</code> 是上一篇和这一篇的交汇点：成本和完成度也是判定的一部分。

<code>severity</code> 决定这个 case 红了之后要不要阻塞发布。把它写进样本，而不是写在某个人的脑子里，是为了让门禁可以自动决策。
<h2>评分不是布尔</h2>

「通过 / 不通过」是最粗的评分，它会把三种完全不同的结果压成一类：做对了、做了一半、做错了。

三级评分更好用：
<div class="table-scroll"><table>
<thead>
<tr>
<th>等级</th>
<th>判定</th>
<th>例子</th>
<th>处置</th>
</tr>
</thead>
<tbody>
<tr>
<td>pass</td>
<td>结果与过程都符合</td>
<td>改对文件、轮数在预算内、正常完成</td>
<td>放行</td>
</tr>
<tr>
<td>degraded</td>
<td>结果对，但代价超标</td>
<td>改对了，但用了 18 轮 / 改了两个文件</td>
<td>记录，看趋势</td>
</tr>
<tr>
<td>fail</td>
<td>结果不对，或没做完</td>
<td>改错文件、撞轮次上限、报错</td>
<td>阻塞</td>
</tr>
</tbody>
</table></div>

<code>degraded</code> 这一级是整张表的关键。纯布尔评分会让「改对了但花了三倍成本」和「改对了」看起来一样，于是成本退化永远不会被发现。而 agent 的成本退化恰恰是渐进的：每次加一个功能涨 5%，没有人会在某一天突然发现。

评分函数要显式写出阈值，不要藏在代码里：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">grade</span><span class="p">(</span><span class="n">case</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Case</span><span class="p">,</span><span class="w"> </span><span class="n">run</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Run</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Grade</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">run</span><span class="p">.</span><span class="n">matches</span><span class="p">(</span><span class="o">&amp;</span><span class="n">case</span><span class="p">.</span><span class="n">oracle</span><span class="p">.</span><span class="n">files_changed</span><span class="p">)</span>
<span class="w">        </span><span class="o">||</span><span class="w"> </span><span class="n">run</span><span class="p">.</span><span class="n">touches</span><span class="p">(</span><span class="o">&amp;</span><span class="n">case</span><span class="p">.</span><span class="n">oracle</span><span class="p">.</span><span class="n">must_not_change</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">Grade</span><span class="p">::</span><span class="n">Fail</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">run</span><span class="p">.</span><span class="n">completed</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">Grade</span><span class="p">::</span><span class="n">Fail</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">run</span><span class="p">.</span><span class="n">turns</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">case</span><span class="p">.</span><span class="n">oracle</span><span class="p">.</span><span class="n">max_turns</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">Grade</span><span class="p">::</span><span class="n">Degraded</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">Grade</span><span class="p">::</span><span class="n">Pass</span>
<span class="p">}</span>
</code></pre></div>


这个函数只有十几行，但它把「什么叫成功」变成了可审查的代码。评审时争论的就不再是「感觉还行」，而是「<code>max_turns</code> 为什么是 8」。
<h2>重复怎么跑：次数、种子、并行</h2>

重复不是「多按几次运行键」，要有明确的次数和编排。
<div class="table-scroll"><table>
<thead>
<tr>
<th>场景</th>
<th>每个 case 次数</th>
<th>目的</th>
<th>触发</th>
</tr>
</thead>
<tbody>
<tr>
<td>本地冒烟</td>
<td>1</td>
<td>快速反馈</td>
<td>保存文件</td>
</tr>
<tr>
<td>PR 门禁</td>
<td>3</td>
<td>抓明显的不稳定</td>
<td>每次提交</td>
</tr>
<tr>
<td>夜间回归</td>
<td>10</td>
<td>估 flaky 率</td>
<td>每天</td>
</tr>
<tr>
<td>版本对比</td>
<td>30</td>
<td>比较两个版本</td>
<td>发版前</td>
</tr>
</tbody>
</table></div>

30 次看着多：20 个 case 就是 600 次运行。但 e2e 走本地 HTTP，不花模型的钱，成本只有执行时间。<strong>只有 mock 才让「重复 30 次」在经济上可行</strong>。

并行要注意两件事。第一，每个运行必须有独立的临时目录，NanoHermes 的 <code>scratch()</code> 已经做对了。第二，如果被测代码读环境变量（比如 <code>max_retries</code> 从 <code>NANOHERMES_MAX_RETRIES</code> 读），并行运行会互相污染。这类配置要在评测入口显式注入，而不是靠进程环境。
<div class="codehilite"><pre><span></span><code># 伪代码：评测主循环
for case in cases:
    for i in 0..N:
        run = isolated_run(case, seed = i)
        record(case.id, i, grade(case, run), run.metrics)

report = summarize(records)
# 输出：每 case 的通过率、区间、flaky 标记、成本分位数
</code></pre></div>


关键在最后一行。评测的产物不是「通过 / 失败」，是一张带分母的表。
<h2>去 flaky 的六个隔离手段</h2>

不稳定有六大来源，每一个都有对应的隔离手段。
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>表现</th>
<th>隔离手段</th>
</tr>
</thead>
<tbody>
<tr>
<td>端口冲突</td>
<td>偶发连接失败</td>
<td>绑定 0 让内核分配</td>
</tr>
<tr>
<td>临时目录冲突</td>
<td>文件互相覆盖</td>
<td>目录名带 pid + 随机数</td>
</tr>
<tr>
<td>时钟与时区</td>
<td>日期相关断言漂移</td>
<td>注入固定时钟</td>
</tr>
<tr>
<td>遍历顺序</td>
<td>文件列表顺序不同</td>
<td>显式排序后再断言</td>
</tr>
<tr>
<td>全局状态</td>
<td>上一个用例影响下一个</td>
<td>每个用例新建进程或新实例</td>
</tr>
<tr>
<td>网络与代理</td>
<td>走了公司代理</td>
<td>显式 <code>NO_PROXY</code>，只允许回环</td>
</tr>
</tbody>
</table></div>

NanoHermes 的 e2e 已经做对了前两项。第四项在 <code>tool_sequence</code> 这类断言里必须自己做：工具清单如果不排序，跨轮对比就会假红。第六项也值得注意，<code>llm::proxy_for</code> 会读取 <code>HTTPS_PROXY</code>，而它恰好对 <code>127.0.0.1</code> 做了 bypass——如果没有这个 bypass，所有本地 mock 测试都会试图走代理。

隔离做到位之后，还会剩下真正的不稳定：模型采样、并发时序、工具本身的非确定性。这些才是 flaky 率应该度量的部分。把环境噪声去掉，剩下的数字才有意义。
<h2>重试只能用来发现，不能用来掩盖</h2>

多数测试框架都支持「失败自动重试 3 次」。这个功能在评测里是有害的。

原因很直接：重试会把「1/5 失败」变成「0/5 失败」，于是 flaky 消失了，报表变绿了，问题还在。而 flaky 恰恰是评测里最值钱的信号——它标记出那些「取决于运气」的路径，而运气在线上会随负载变化。

正确用法是反过来的：<strong>让测试跑一次，让评测跑 N 次，把差异暴露出来</strong>。
<div class="codehilite"><pre><span></span><code># 不重试，直接统计
for i in 1..5; do
  cargo test --test e2e_mock_llm -- --exact &quot;$CASE&quot; || echo &quot;run $i failed&quot;
done | sort | uniq -c
</code></pre></div>


输出会长这样：
<div class="codehilite"><pre><span></span><code>      4 
      1 run 2 failed
</code></pre></div>


四行空、一行失败。这比「重试后通过」有用得多：它告诉你这个用例有 20% 的失败率，而这个用例覆盖的是工具调用往返。

工程上可以把重试留给「基础设施类失败」（拉镜像、装依赖），把不重试留给「被测行为」。两者的边界要写进 CI 配置，而不是靠人记。
<h2>成本也是评测指标</h2>

上一篇把成本拆成「前缀 × 历史 × 轮数」。这三个量都应该进评测报表。
<div class="table-scroll"><table>
<thead>
<tr>
<th>指标</th>
<th>定义</th>
<th>采集位置</th>
<th>阈值示例</th>
</tr>
</thead>
<tbody>
<tr>
<td>轮数</td>
<td>每任务的模型请求次数</td>
<td><code>usage.requests</code> 或 mock 记录</td>
<td>&lt;= 8</td>
</tr>
<tr>
<td>请求字节</td>
<td>每任务请求体总字节</td>
<td>mock 记录</td>
<td>&lt;= 180,000</td>
</tr>
<tr>
<td>工具调用数</td>
<td>每次运行的工具调用总数</td>
<td>消息里的 tool 角色</td>
<td>&lt;= 20</td>
</tr>
<tr>
<td>前缀稳定性</td>
<td>跨轮前缀哈希是否一致</td>
<td>请求体 <code>messages[0]</code></td>
<td>全等</td>
</tr>
<tr>
<td>墙钟时间</td>
<td>端到端耗时</td>
<td>测试外层计时</td>
<td>&lt;= 60s</td>
</tr>
</tbody>
</table></div>

这些数字和通过率放在同一张表里，才能回答「这个版本是不是又快又好」。只看通过率，会出现「通过率没降，但成本翻倍」的版本被放行；只看成本，会出现「省了钱但改错了文件」的版本被放行。

成本指标还有一个隐性作用：它能提前暴露退化。通过率是阶跃的（对就是对，错就是错），成本是连续的。连续量在退化 5% 的时候就能看见，阶跃量要等到跨过阈值才报警。
<h2>归因：五类失败与二分法</h2>

评测红了之后，最有价值的信息不是「红了」，是「为什么红」。把失败分成五类，每类对应不同的处置。
<div class="table-scroll"><table>
<thead>
<tr>
<th>类别</th>
<th>典型信号</th>
<th>处置</th>
</tr>
</thead>
<tbody>
<tr>
<td>模型</td>
<td>同一输入多次运行结果不同，且无环境差异</td>
<td>换模型 / 调提示 / 降温度</td>
</tr>
<tr>
<td>提示</td>
<td>工具选错、格式不符、忽略约束</td>
<td>改 prompt、加示例</td>
</tr>
<tr>
<td>工具</td>
<td>错误串来自工具、文件状态不对</td>
<td>修工具、补单元测试</td>
</tr>
<tr>
<td>编排</td>
<td>轮数暴涨、重复动作、压缩后丢信息</td>
<td>改循环、改压缩策略</td>
</tr>
<tr>
<td>环境</td>
<td>只在某台机器 / 某个平台失败</td>
<td>修隔离、补平台用例</td>
</tr>
</tbody>
</table></div>

归因可以用二分法加速。先固定模型：把这次运行的模型响应录下来，下次回放。如果回放后仍然失败，问题在模型之外（工具、编排、环境）；如果回放后成功，问题在模型采样。

再固定工具：把工具返回值换成固定 fixture。如果仍然失败，问题在编排；如果成功，问题在工具。

两次二分就能把五类缩到一类。这比盯着日志猜快得多，也是「记录请求与响应」除了断言之外的第二个用途。
<h2>离线评测与线上观测的分工</h2>

这两件事经常被混为一谈，但它们的样本、口径、时效完全不同。
<div class="table-scroll"><table>
<thead>
<tr>
<th>维度</th>
<th>离线评测</th>
<th>线上观测</th>
</tr>
</thead>
<tbody>
<tr>
<td>样本</td>
<td>精选的固定集</td>
<td>全部真实流量</td>
</tr>
<tr>
<td>口径</td>
<td>事先定义的 oracle</td>
<td>用户行为（采纳、重试、放弃）</td>
</tr>
<tr>
<td>时效</td>
<td>发布前</td>
<td>发布后持续</td>
</tr>
<tr>
<td>成本</td>
<td>可控（mock）</td>
<td>真实账单</td>
</tr>
<tr>
<td>能发现</td>
<td>已知的失效模式</td>
<td>未知的失效模式</td>
</tr>
<tr>
<td>不能发现</td>
<td>长尾输入</td>
<td>根因（只有现象）</td>
</tr>
</tbody>
</table></div>

离线评测擅长「防止退化」，线上观测擅长「发现新问题」。一个健康的循环是：线上发现新问题 → 抽成离线 case → 修 → 离线门禁防止再犯。

只有离线评测，你会一直在修已知的问题；只有线上观测，你会一直在救火，而且每次修完都不知道有没有修坏别的。
<h2>线上采样只存结构，不存内容</h2>

线上观测最大的顾虑是隐私。解法不是不采，是只采结构。
<div class="codehilite"><pre><span></span><code><span class="k">struct</span><span class="w"> </span><span class="nc">TurnTelemetry</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">turn_id</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="n">outcome</span><span class="p">:</span><span class="w"> </span><span class="nc">TurnOutcomeKind</span><span class="p">,</span><span class="w">   </span><span class="c1">// completed / interrupted / iteration_limit</span>
<span class="w">    </span><span class="n">requests</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">,</span>
<span class="w">    </span><span class="n">prompt_bytes</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="n">completion_bytes</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="n">tool_calls</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">ToolStat</span><span class="o">&gt;</span><span class="p">,</span><span class="w">  </span><span class="c1">// name + duration + ok，不含参数</span>
<span class="w">    </span><span class="n">elapsed_ms</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="n">error_class</span><span class="p">:</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="p">,</span><span class="c1">// 分类，不含原文</span>
<span class="p">}</span>
</code></pre></div>


这份结构里没有任何用户文本、文件内容、命令输出。它能回答「成功率、轮数分布、哪个工具最慢、哪类错误最多」，不能回答「用户说了什么」。

需要内容才能定位的问题，走另一条路：用户主动上报，或加一个显式的「调试模式」，让用户知情并授权。默认采集应该是结构，不是内容。
<h2>回归门禁：CI、夜间、人工</h2>

三类检查要分开，不然要么太慢，要么太松。
<div class="table-scroll"><table>
<thead>
<tr>
<th>层</th>
<th>跑什么</th>
<th>时长目标</th>
<th>门禁规则</th>
</tr>
</thead>
<tbody>
<tr>
<td>CI</td>
<td>单元测试 + 3 次 e2e + L1 断言</td>
<td>十分钟内</td>
<td>任何新失败都阻塞</td>
</tr>
<tr>
<td>夜间</td>
<td>10 次重复 + 故障矩阵 + 成本基线</td>
<td>一小时</td>
<td>flaky 率 &gt; 2% 或成本涨 10% 报警</td>
</tr>
<tr>
<td>人工</td>
<td>真实模型 + 真实仓库任务</td>
<td>按需</td>
<td>版本对比报告</td>
</tr>
</tbody>
</table></div>

CI 要快而确定，不跑真实模型：延迟和费用都不适合每次提交。夜间可以更重，因为它产出的是趋势而不是阻塞。

人工这层不该被自动化替代，也不该成为主要手段。它的作用是校验口径：人工觉得明显变差而分数没动，说明 oracle 写错了。
<h2>一个可照抄的目录与命令</h2>
<div class="codehilite"><pre><span></span><code>evals/
  cases/
    edit-wrong-file-001/
      case.json
      fixture/
    timeout-retry-001/
      case.json
      fixture/
  harness/
    mock_llm.rs        # 记录请求的状态机 mock
    runner.rs          # 重复执行、隔离、记账
    grade.rs           # pass / degraded / fail
  baselines/
    2026-11-01.json    # 通过率、轮数、字节数
  report.md            # 每次运行的汇总
</code></pre></div>


命令保持朴素，能进任何 CI：
<div class="codehilite"><pre><span></span><code>cargo test --workspace                     # 单元 + 快速 e2e
cargo run --bin eval -- --cases evals/cases --repeat 10 --json &gt; report.json
jq &#39;.cases[] | select(.flaky) | .id&#39; report.json
</code></pre></div>


第二行是核心：一个独立二进制，不是测试框架插件，既能进 CI，也能单跑某个 case，还能把结果喂给报表。

评测入口和测试入口分开，还有一层原因：评测失败不必阻塞编译，测试失败必须阻塞。两者语义不同，不该共用退出码。
<h2>三个一天能做完的实验</h2>

与其争论「要不要做评测」，不如先做三个小实验，用数据说话。
<div class="table-scroll"><table>
<thead>
<tr>
<th>实验</th>
<th>做法</th>
<th>预期</th>
<th>证明什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>重复 5 次</td>
<td>同一个 e2e 用例跑 5 遍</td>
<td>大概率全绿</td>
<td>这套用例是确定性的，重复成本低</td>
</tr>
<tr>
<td>空工具清单</td>
<td><code>build_tools()</code> 返回空数组</td>
<td>5 个 e2e 仍全绿</td>
<td>现有断言不看请求体</td>
</tr>
<tr>
<td>超时重试</td>
<td>mock 收到请求后不响应，<code>max_retries=2</code></td>
<td>只请求一次就报错</td>
<td>传输错误不在重试范围内</td>
</tr>
</tbody>
</table></div>

第一个实验决定「重复是否可行」：5 次里有失败，就先修隔离。

第二个实验是本文论点的可执行版本。它不改测试，只改一行生产代码，然后看绿灯还亮不亮。亮着，就说明 L1 是空的。

第三个实验揭示一个行为边界。你可以据此决定「超时也该重试」，也可以决定「保持现状但写进文档」——前提是你知道现状是什么。

三个实验不超过一天，产出三张能贴进评审会的表。
<h2>五个常见的评测陷阱</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>陷阱</th>
<th>表现</th>
<th>后果</th>
<th>解法</th>
</tr>
</thead>
<tbody>
<tr>
<td>mock 太理想</td>
<td>永远返回规范 JSON、永远秒回</td>
<td>真实世界的坏数据全漏</td>
<td>故障矩阵</td>
</tr>
<tr>
<td>断言过拟合</td>
<td>断言完整文案、完整 diff</td>
<td>改一个标点就红</td>
<td>断言关键片段与结构</td>
</tr>
<tr>
<td>只测单步</td>
<td>每个工具单测都过</td>
<td>组合起来不通</td>
<td>场景级 case</td>
</tr>
<tr>
<td>平均值掩盖长尾</td>
<td>平均 2 轮，P95 是 18 轮</td>
<td>少数任务烧穿预算</td>
<td>报分位数</td>
</tr>
<tr>
<td>分布脱节</td>
<td>评测任务都是自己编的</td>
<td>分数涨了用户没感觉</td>
<td>从事故倒推</td>
</tr>
</tbody>
</table></div>

第二个陷阱最隐蔽。断言完整文案看起来很严格，实际上把「实现细节」写进了契约，之后每次改提示词都要改测试，久而久之大家就学会了「红了我改断言」。

正确的做法是断言<strong>结构</strong>而不是<strong>措辞</strong>：文件改对了、工具序列对了、轮数在预算内、答案包含关键结论。这四类断言不会因为换了个说法而红，但会因为行为变了而红。
<h2>小结</h2>

把这篇压成四句话。

<strong>第一，一次通过只是抽样，不是结论。</strong> 二十步的任务，单步 0.95 的成功率只有 36% 的任务成功率；十次全过只能证明失败率低于 26%。

<strong>第二，评测要有分母、有口径、有过程断言。</strong> 没有分母的通过率不是通过率；没有口径的分数不可比较；没有过程断言的测试看不见 agent 最典型的失效方式。

<strong>第三，NanoHermes 的测试写得好，但停在 L3。</strong> 90 个单元测试加 5 个 e2e，mock 把请求读出来就丢掉。把工具清单改成空数组，五个 e2e 仍然全绿——这不是 bug，这是断言层次不够。

<strong>第四，补齐的成本很低。</strong> 记录请求体、三条黄金断言、一个状态机 mock、一张故障矩阵、一个完成状态枚举，加起来是几天的工程量。真正贵的不是写，是先想清楚「什么叫成功」。

上一篇讲怎么记账，这一篇讲怎么判断改动有没有让账变好。下一篇换个方向：当输入本身可能是攻击时，「评测通过」还意味着安全吗？——Agent 提示注入：谁说的话算指令。
