分级依据是「会不会造成不可恢复的后果」。死锁是不可恢复的（要靠杀进程）；其余都是可恢复的（重试、刷新、手动清理）。

有一条容易漏掉但没有列进来：<code>def.allowed_tools</code> 不参与执行检查。它不列在里面是因为它本身不产生错误行为——它只是让「用户以为的隔离」比「实际的隔离」更严。这类问题不会以故障形式出现，而是以「某天发现子代理改了不该改的文件」的形式出现。它属于安全审查项，不属于失效模式。
<h2>怎么把多体测出来</h2>

多体的测试难点是「并发 + 阻塞 + 时间」。四个可以直接写的测试：

<strong>测试一：门上限不被突破。</strong> 现成的 <code>gate_caps_concurrency</code> 就是模板：N 个线程抢 M 个槽位，记录峰值、断言 <code>peak &lt;= M</code>，最后断言计数归零。断言计数归零这一条比断言峰值更重要——它证明没有泄漏。

<strong>测试二：板子的状态迁移完整。</strong> 现成的 <code>board_records_jobs_in_order</code> 覆盖了 <code>Running → Done</code> 和 <code>Running → Failed</code>。值得补的是「同一 id 重复 finish」和「finish 一个不存在的 id」，前者应该幂等（当前实现是：第二次 finish 会用第二次的 result 覆盖第一次，状态也被覆盖），后者应该静默。

<strong>测试三：嵌套被拒绝。</strong> 当前没有这个测试，因为当前也没有这个功能——但这是最容易写的一条：
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">nested_subagents_are_refused</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// 在 depth = 1 的上下文里调 subagent，期望 Err</span>
<span class="p">}</span>
</code></pre></div>


写这个测试的价值不在覆盖率，而在把「防嵌套靠工具清单」这个隐式设计变成显式契约。测试写了，<code>depth</code> 字段就会被加上。

<strong>测试四：中断能打断等待。</strong> 用 <code>wait_timeout</code> 版本的门，一个线程持有许可不放，另一个线程设上中断标志后 <code>acquire</code>，断言它在 200ms 内返回 <code>None</code>。这条测试会失败在当前实现上，这正是它的价值。

还有一条不好写但值得讨论的：<strong>怎么验证「不会死锁」</strong>。经典做法是压力测试——用比槽位多的线程反复 acquire/release 几千次；如果实现里有锁顺序问题，它会在某个时刻卡住。但卡住的表现是「测试不结束」，需要外部超时。所以压力测试必须配一个 watchdog：
<div class="codehilite"><pre><span></span><code><span class="c1">// 主线程 join 带超时；超时则打印所有线程的状态并 abort</span>
<span class="c1">// Rust 标准库没有 join_timeout，常用做法是用 channel + recv_timeout</span>
</code></pre></div>


这条测试能覆盖锁顺序和计数泄漏两类问题，但对「嵌套死锁」覆盖不到——因为嵌套死锁需要模型配合。所以嵌套那条必须靠单元测试，不能靠压力测试。
<h2>七处可以加固的地方</h2>

按「投入产出比」排序：

<strong>一、给 <code>Ctx</code> 加 <code>depth</code>，在 <code>run_subagent</code> 入口断言。</strong> 三行代码，消除唯一一个致命失效模式。同时它让「以后支持两层嵌套」变成一个显式的数值改动（<code>if depth &gt;= max_depth</code>）而不是结构性重写。

<strong>二、<code>Gate::acquire</code> 改成可中断 + 带超时。</strong> <code>wait_timeout</code> 轮询 200ms，同时检查中断标志。它同时解决「Ctrl-C 卡住」和「死锁不可恢复」两个问题——即使嵌套死锁真的发生，中断也能把它打破。

<strong>三、<code>JobStatus</code> 加 <code>Queued</code>，并把 <code>duration</code> 拆成排队时长和执行时长。</strong> 改动涉及 <code>board.rs</code> 和 <code>render_agent_board</code> 两处，但观测口径会立刻变准。

<strong>四、<code>SubAgentDef</code> 加 <code>max_iterations</code>。</strong> 子代理继承父代理的 40 轮是个危险的默认值——一个「跑测试并报告」的子代理不该有 40 轮预算。加一个可选字段、默认取一个比父代理小的值（比如 10），能让多体的成本可控。

<strong>五、把 <code>MAX_PARALLEL_SUBAGENTS</code> 从常量变成配置。</strong> 移进 <code>Config</code>，加 CLI flag 和 JSON 字段。这条改动是「让 4 变成可调」，但它真正的价值是让「配额」这个概念在代码里有正确的位置。

<strong>六、给共享状态加归属。</strong> <code>Todo { owner }</code>、<code>Task { owner }</code>、<code>Memory { source }</code>，工具层按角色过滤。这是列表中改动面最大的一条，也是唯一能根治「子代理搞乱父代理状态」的一条。

<strong>七、给 <code>def.allowed_tools</code> 加执行期检查。</strong> 在 <code>run_subagent_inner</code> 里包一层：把子代理上下文的 <code>check_tool</code> 换成「父代理允许 × 子代理允许」的交集。做法是给 <code>execute</code> 传一个可选的额外过滤集，或者在子代理期间用一个 <code>sub_cfg</code> 构造一个临时检查函数。

前三条改动都很小、收益明确，是「今天就能做」的。后四条里第四条和第五条属于配置层，第六条和第七条属于权限层，都需要先想清楚语义——比如 <code>owner</code> 用什么标识（<code>agent-7</code>？还是父代理给的 <code>def.name</code>？）——再动手。
<h2>小结：多体先要分清谁的责任</h2>

把 07 讲的东西压成三句话。

<strong>第一，多体的抽象比它看起来弱。</strong> <code>SubAgentDef</code> 只有四个字段，子代理本质上是「换了提示词、换了工具清单、可能换了模型的同一个 Agent」。这意味着很多你以为隔离了的东西其实没隔离：待办清单、后台任务、记忆目录、钩子可见性，全部是共享的。

<strong>第二，共享本身不是缺陷，无归属的共享才是。</strong> 任务板、限流门、<code>Ctx</code> 都该共享——否则用户看到五份互不相干的计划，<code>task_kill</code> 变成盲盒。问题在于共享的对象上没有「这是谁的」这个字段，于是任何角色都能改任何状态。加 owner 是这类问题的通用解。

<strong>第三，三个切得不干净的地方有共同的形状：把「广告位过滤」当成了「执行期闸门」。</strong> 防嵌套靠工具清单、子代理的工具限制靠工具清单、可用子代理名字靠系统提示词——三处都是「让模型看不见」而不是「让调用不成立」。这个区别在单代理场景下无关紧要（模型看不见就不会调），在多体场景下会放大成死锁、越权和信息泄漏。

NanoHermes 在多体上的实现有一处特别值得肯定：<code>GateGuard</code> 的 <code>Drop</code> 归还、<code>while</code> 重检条件、<code>notify_one</code> 而非 <code>notify_all</code>，这三个细节说明作者对手写信号量的坑是清楚的，测试里那句「all permits released」的断言也证明他知道要验证泄漏。真正的问题不在门的实现，而在门的<strong>语义边界</strong>——它管的是「同时几个」，而多体真正需要的是「谁的预算、谁的配额、谁的可见范围」。

下一篇进入观测：给每个轮次记一本账。07 讲的是「一次委派发生了什么」，08 要讲的是「怎么把这些事记下来、算清楚、看清楚」——用量统计、日志、以及一个 turn 的成本应该怎么归集到发起它的人身上。</div></div></noscript>
