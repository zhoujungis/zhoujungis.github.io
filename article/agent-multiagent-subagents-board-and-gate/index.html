    <noscript><div class="ns-article"><h1>Agent 多体：子代理、任务板与限流</h1><div class="ns-meta">2026/10/22 · Stack Frame</div><div class="markdown-body"><blockquote>

适用读者：已经让单个 agent 跑起来、现在想让它「分头干活」的人；被「四个子代理同时改同一个文件」坑过的人；想知道任务板和限流门到底该由谁持有的人
结论先行：多体的难点从来不是并行，而是<strong>责任边界</strong>——任务板、限流门、工具上下文这三样东西是共享的，而提示词、消息历史、模型选择是个体的。NanoHermes 把这两组东西切得很清楚，但切完之后留了三个洞：防嵌套只挡了工具清单没挡执行、限流门不检查中断也不可重入、任务板跨会话不清空

</blockquote>

<h2>前言：多体不是把主循环复制四份</h2>

把 agent 拆成多个角色的直觉通常是：既然一个循环能干活，那就跑四个循环。这个直觉在代码上很容易实现——起四个线程，每个线程一份消息历史，各自调工具，最后汇总。

但它会立刻撞上三个问题：
<ul>
<li>四个子代理各自调 <code>edit_file</code> 改同一个文件，谁的改动算数</li>
<li>每个子代理都想在终端上打印进度，输出会交叉成乱码</li>
<li>如果每个子代理再派一个子代理，谁来保证不会指数爆炸</li>
</ul>

这三个问题的共同点是：<strong>它们不是并行问题，而是「什么东西该共享、什么东西该独立」的问题</strong>。改文件冲突是共享了文件系统；输出乱码是共享了 stdout；指数爆炸是共享了「派发能力」这件事却没有共享配额。

NanoHermes 的做法是把多体拆成三块：子代理定义（配置层的契约）、任务板（观测层的共享状态）、限流门（资源层的配额）。前两块加起来不到两百行，第三块只有三十行。本文按「个体 → 共享 → 配额」的顺序把它们走一遍，然后专门拆解三处「切得不够干净」留下的洞。

05 讲的是「几件事同时做」，06 讲的是「这些事能做什么」，07 要把两者合起来——当四个子代理同时跑、每个都能在你机器上执行命令时，责任边界画在哪里。
<h2>结论先行：三个共享对象与它们的责任边界</h2>

一次 <code>subagent</code> 调用的全貌：
<div class="table-scroll"><table>
<thead>
<tr>
<th>层次</th>
<th>对象</th>
<th>归属</th>
<th>子代理能用吗</th>
</tr>
</thead>
<tbody>
<tr>
<td>个体</td>
<td>系统提示词</td>
<td><code>def.prompt</code>，每个子代理独立</td>
<td>是自己的</td>
</tr>
<tr>
<td>个体</td>
<td>消息历史</td>
<td>局部 <code>messages</code>，从零开始</td>
<td>只装任务描述</td>
</tr>
<tr>
<td>个体</td>
<td>模型与采样参数</td>
<td><code>sub_cfg</code>，可被 <code>def.model</code> 覆盖</td>
<td>可以不同</td>
</tr>
<tr>
<td>共享</td>
<td>任务板 <code>board</code></td>
<td><code>Ctx</code>，父代理持有</td>
<td>读写，登记自己的任务</td>
</tr>
<tr>
<td>共享</td>
<td>限流门 <code>gate</code></td>
<td><code>Ctx</code>，父代理持有</td>
<td>必须拿许可</td>
</tr>
<tr>
<td>共享</td>
<td>工具上下文 <code>Ctx</code></td>
<td>根路径、审批、沙箱、待办、后台任务、记忆目录</td>
<td>全部共享</td>
</tr>
</tbody>
</table></div>

这张表最下面三行是本文的重点。共享本身是对的——如果每个子代理都有独立的待办清单，用户会看到五份互不相干的计划；如果每个子代理都有独立的后台任务表，<code>task_kill</code> 就变成了盲盒。但共享的代价是：<strong>子代理能做的破坏，不止是改文件，还包括改状态</strong>。

判断一个多体实现是否健康，有个简单的问法：子代理能不能把父代理的状态搞乱？如果答案是能，那么这些状态应该被拆成「只读共享」和「可写独立」两份，或者至少加一层归属标记。
<h2>一个子代理是什么：提示词、工具白名单、可选模型</h2>

<code>SubAgentDef</code> 只有四个字段：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">SubAgentDef</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">prompt</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// If non-empty, only these tools are available to the sub-agent.</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">allowed_tools</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// Optional model override for this sub-agent.</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">model</span><span class="p">:</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


这是一个很克制的设计。它没有给子代理独立的：
- 迭代上限（继承父代理的 <code>max_iterations</code>）
- 权限模式（继承）
- 审批策略（继承）
- 沙箱设置（继承）

克制的好处是配置简单，坏处是「子代理」这个抽象比它看起来弱得多。它本质上是一个<strong>换了提示词、换了工具清单、可能换了模型的同一套 Agent</strong>——而不是一个受独立约束的新角色。

<code>allowed_tools</code> 的语义要精确理解：注释写的是「只有这些工具对子代理可用」，但实现里它作用于<strong>给模型看的工具清单</strong>，不作用于执行期的权限检查。这个区别后面第 6、7 节展开。

<code>model</code> 的语义同样要精确：它只改 <code>sub_cfg.model</code>，也就是只改发给模型 API 的那个模型名。它不改 <code>max_tokens</code>、不改 <code>temperature</code>、不改 <code>timeout_secs</code>。所以「用一个便宜模型跑子代理省钱」是成立的，但「用一个小模型限制子代理的输出长度」不成立——那要靠 <code>max_tokens</code>，而它没有暴露。
<h2>配置即契约：subagents.json 的形状</h2>

子代理定义从一个独立 JSON 文件加载，路径由 <code>--subagents</code> 指定：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;subagents&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nt">&quot;reviewer&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="nt">&quot;prompt&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;You review Rust code for correctness and security. Read the diff, then list concrete defects with file:line.&quot;</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;allowed_tools&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;read_file&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;list_dir&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;grep&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;glob&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;git_diff&quot;</span><span class="p">],</span>
<span class="w">      </span><span class="nt">&quot;model&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;gpt-4o&quot;</span>
<span class="w">    </span><span class="p">},</span>
<span class="w">    </span><span class="nt">&quot;verifier&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">      </span><span class="nt">&quot;prompt&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;You run the test suite and report failures. Never modify source files.&quot;</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;allowed_tools&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="s2">&quot;run_command&quot;</span><span class="p">,</span><span class="w"> </span><span class="s2">&quot;read_file&quot;</span><span class="p">]</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">  </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个加载细节值得注意。

<strong>第一，<code>prompt</code> 是必填的，缺了就整体失败。</strong>
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">prompt</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">spec</span>
<span class="w">    </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;prompt&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">p</span><span class="o">|</span><span class="w"> </span><span class="n">p</span><span class="p">.</span><span class="n">as_str</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">ok_or_else</span><span class="p">(</span><span class="o">||</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;sub-agent `{name}` missing `prompt`&quot;</span><span class="p">))</span><span class="o">?</span>
<span class="w">    </span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
</code></pre></div>


<strong>第二，<code>allowed_tools</code> 是「没写就等于全给」。</strong>
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">allowed_tools</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">spec</span>
<span class="w">    </span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;allowed_tools&quot;</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="p">.</span><span class="n">as_array</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">arr</span><span class="o">|</span><span class="w"> </span><span class="n">arr</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">filter_map</span><span class="p">(</span><span class="o">|</span><span class="n">x</span><span class="o">|</span><span class="w"> </span><span class="n">x</span><span class="p">.</span><span class="n">as_str</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">to_string</span><span class="p">())).</span><span class="n">collect</span><span class="p">())</span>
<span class="w">    </span><span class="p">.</span><span class="n">unwrap_or_default</span><span class="p">();</span>
</code></pre></div>


空 <code>Vec</code> 在裁剪处被解释成「不限制」（见下节）。所以一份只写了 <code>prompt</code> 的子代理配置，拿到的是和主代理一样的全部能力。这和 06 里 <code>allowed_tools: []</code> 的语义陷阱是同一个方向——安全失败（fail closed）在这里表现为「你以为限制了，其实没有」。

<strong>第三，加载失败只警告不退出。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">match</span><span class="w"> </span><span class="n">config</span><span class="p">::</span><span class="n">SubAgentDef</span><span class="p">::</span><span class="n">load_all</span><span class="p">(</span><span class="n">path</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">defs</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* ... */</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">subagents</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">defs</span><span class="p">;</span><span class="w"> </span><span class="p">},</span>
<span class="w">    </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;warning: sub-agents config {}: {e}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">path</span><span class="p">.</span><span class="n">display</span><span class="p">()),</span>
<span class="p">}</span>
</code></pre></div>


JSON 写错一个逗号，结果是「没有子代理」而不是「启动失败」。随后 <code>build_tools</code> 又靠 <code>subagents.is_empty()</code> 决定要不要挂 <code>subagent</code> 工具，于是模型看不到这个工具，用户看到的是「它好像不会委派」——而真正的原因（配置文件解析失败）只在被淹没的 stderr 警告里出现过一次。
<h2>按名字查找：不存在的子代理会发生什么</h2>

<code>subagent</code> 工具的两个参数是 <code>name</code> 和 <code>task</code>，都必填。名字查找是线性扫描：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">def</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span>
<span class="w">    </span><span class="p">.</span><span class="n">cfg</span>
<span class="w">    </span><span class="p">.</span><span class="n">subagents</span>
<span class="w">    </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">find</span><span class="p">(</span><span class="o">|</span><span class="n">s</span><span class="o">|</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">name</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">name</span><span class="p">)</span>
<span class="w">    </span><span class="p">.</span><span class="n">ok_or_else</span><span class="p">(</span><span class="o">||</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;unknown sub-agent `{name}`&quot;</span><span class="p">))</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


失败路径是有价值的：错误会经 <code>finish_err</code> 记到任务板上，状态是 <code>failed</code>，预览里是那句 <code>unknown sub-agent</code>。也就是说模型可以自己发现「我记错了名字」。

但它也有一个盲点：<strong>没有可发现性输入</strong>。<code>subagent</code> 工具的 JSON schema 里，<code>name</code> 只是一个 <code>string</code>，描述是「要调用的子代理名字」，没有任何 enum 或默认值列出可用名字。模型能知道有哪些子代理，唯一的途径是系统提示词里写了——而 <code>prompt.rs</code> 里根本没有拼装子代理名单这回事（<code>system_prompt</code> 只处理模式提示、persona、<code>AGENTS.md</code>）。子代理名字对模型是隐形的。

实践中这意味着：要么用户在自己的 persona 里手写名单，要么模型只能靠猜。而猜错的成本是一次失败的 LLM 往返（它得先决定调用，拿到 <code>unknown sub-agent</code> 才知道错了，再猜一次）。
<h2>子代理的工具清单是怎么裁出来的</h2>

裁剪分三步，顺序不能换：
<div class="codehilite"><pre><span></span><code><span class="c1">// 1. 先拿父代理的完整清单（已经过权限模式和黑白名单过滤）</span>
<span class="kd">let</span><span class="w"> </span><span class="n">all_tools</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">build_tools</span><span class="p">();</span>
<span class="c1">// 2. 如果子代理声明了白名单，按名字过滤</span>
<span class="kd">let</span><span class="w"> </span><span class="n">tool_list</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">def</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">all_tools</span><span class="p">.</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">        </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="kd">let</span><span class="w"> </span><span class="n">tname</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="cm">/* ... name ... */</span><span class="p">;</span>
<span class="w">            </span><span class="n">def</span><span class="p">.</span><span class="n">allowed_tools</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">any</span><span class="p">(</span><span class="o">|</span><span class="n">a</span><span class="o">|</span><span class="w"> </span><span class="n">a</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="n">tname</span><span class="p">)</span>
<span class="w">        </span><span class="p">})</span>
<span class="w">        </span><span class="p">.</span><span class="n">collect</span><span class="p">()</span>
<span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">all_tools</span><span class="p">.</span><span class="n">as_array</span><span class="p">().</span><span class="n">cloned</span><span class="p">().</span><span class="n">unwrap_or_default</span><span class="p">()</span>
<span class="p">};</span>
<span class="c1">// 3. 排除 `subagent` 自己，防止无限嵌套</span>
<span class="kd">let</span><span class="w"> </span><span class="n">tool_list</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">tool_list</span><span class="p">.</span><span class="n">into_iter</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">filter</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="cm">/* name */</span><span class="w"> </span><span class="o">!=</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="s">&quot;subagent&quot;</span><span class="p">))</span>
<span class="w">    </span><span class="p">.</span><span class="n">collect</span><span class="p">();</span>
</code></pre></div>


第一步是关键的：<strong>子代理的工具清单是父代理清单的子集</strong>。这意味着 06 里的五道闸门对子代理仍然有效——<code>plan</code> 模式下的子代理也拿不到 <code>write_file</code>，<code>disallowed_tools</code> 里的工具也一样不在。这一点比「给子代理独立的权限配置」要安全得多，因为它保证了子代理不可能比父代理更能干。

第二步的匹配是精确字符串比较，没有通配。写 <code>"read_*"</code> 不会匹配 <code>read_file</code>——shim 一个也没有，就是字面量 <code>find</code>。这和 06 里钩子的 <code>matches()</code> 支持通配形成了对比：同一个配置体系里，两处匹配规则不同，是容易踩的。

第三步用名字排除 <code>subagent</code>。这个做法在「防止模型看到这个工具」这个目标上是有效的，但它的作用域仅限于此（下节展开）。

还有一个容易忽略的点：<code>agent_list</code> <strong>没有</strong>被排除。所以子代理可以看到任务板上所有任务，包括父代理自己的、以及兄弟们的结果预览。对「让子代理了解全局进度」这是优点；对「子代理被裁掉了大部分工具但仍能读到别人的产出」这是信息面被意外放宽——一个只允许 <code>read_file</code> 的审查子代理，可以通过 <code>agent_list</code> 看到另一个子代理的完整结果摘要（500 字符）。如果那个摘要里含敏感内容，<code>allowed_tools</code> 的限制就被绕过了。
<h2>防嵌套只挡住了广告位，没挡住执行</h2>

那行 <code>!= Some("subagent")</code> 的注释写得很明确：「防止无限嵌套」。它确实防住了最常见的一条路径：子代理看不到 <code>subagent</code> 工具，所以不会主动调用它。

但它防的不是全部。理由在 <code>execute</code> 的检查链上：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">reason</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">check_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {reason}&quot;</span><span class="p">);</span><span class="w"> </span><span class="p">}</span>
</code></pre></div>


<code>check_tool</code> 查三样东西：模式封禁、黑名单、非空白名单。<code>subagent</code> 不在任何模式的 <code>blocked_tools</code> 里，也不在默认的黑名单里，而默认白名单是空的——所以<strong>执行期没有任何一层会拒绝 <code>subagent</code></strong>。拒绝只发生在「模型看不见它」这一步。

于是只要模型输出里出现了一次 <code>"name": "subagent"</code> 的工具调用，链路就通了：<code>run_tool</code> 里的分支是纯字符串比较。
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">name</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;subagent&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">sname</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;name&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">n</span><span class="o">|</span><span class="w"> </span><span class="n">n</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">task</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">args</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;task&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_subagent</span><span class="p">(</span><span class="n">sname</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">)</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="cm">/* ... */</span><span class="w"> </span><span class="p">};</span>
<span class="p">}</span>
</code></pre></div>


这种调用从哪来？
<ul>
<li>模型幻觉出一个不存在的工具名（少见，但 <code>subagent</code> 是它在父代理上下文里见过的名字，属于记忆污染）</li>
<li>会话是从父代理继承的消息历史里恢复的，历史里有 <code>subagent</code> 的调用样例</li>
<li>用户通过 MCP 或 persona 明确要求「即使工具清单里没有也试着调用」</li>
</ul>

第三条不成立——模型不会执行「清单外」的指令。但第二条成立：<code>replace_messages</code> 会把一份含 <code>subagent</code> 调用记录的会话装进来，模型看得见它曾经用过这个工具。这时候工具清单里没有它，模型的合规概率很高，但推不出必然。

所以正确的说法是：<strong>防嵌套是一道「广告位过滤」，不是一道「执行期闸门」</strong>。要让它是闸门，应该在 <code>check_tool</code> 里加一条「子代理上下文禁止 <code>subagent</code>」，或者给 <code>Ctx</code> 加一个 <code>depth: usize</code> 并在 <code>run_subagent</code> 入口断言 <code>depth == 0</code>。后者更彻底：它同时防住了嵌套过深（比如允许两层、禁止三层）。
<h2>子代理内部为什么是串行的</h2>

子代理循环里，工具调用是一个 <code>for</code> 而不是 <code>thread::scope</code>：
<div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="n">sub_cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">llm</span><span class="p">::</span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="n">sub_cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">tools</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{})</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">    </span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">assistant_message</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">));</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w"> </span><span class="p">}</span>
<span class="w">    </span><span class="c1">// Execute sub-agent tool calls sequentially (sub-agents are bounded).</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">call</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="o">&amp;</span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">execute</span><span class="p">(</span><span class="n">call</span><span class="p">);</span>
<span class="w">        </span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;tool_call_id&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">call</span><span class="p">.</span><span class="n">id</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">out</span><span class="w"> </span><span class="p">}));</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


注释给的理由是「子代理是有界的」。这个理由站得住：父代理的并行是为了让四个不相关的工具调用重叠，而子代理的数量本来就被门限在 4，再往下并行会让实际并发数变成 4 × N，门的语义就失真了。

但这个选择和 05 里讲的另一件事冲突：父代理的并行工具调用走 <code>thread::scope</code>，子代理串行。也就是说<strong>「同一套 <code>execute</code> 在两个不同的编排策略下被调用」</strong>。后果是 05 里那个「同文件并发 <code>edit_file</code> 丢失更新」的缺陷，在子代理内部不存在（串行天然不冲突），但父代理的四个并行子代理之间仍然存在——它们各自串行，四者并行，最后一起写同一个文件。

换句话说，串行只消除了「一层内的冲突」，没有消除「跨层的冲突」。真正需要的是文件级锁或是「同一文件不允许两个子代理同时写」的调度约束。

还有一处更细的差别：子代理循环里<strong>没有调用 <code>compact()</code></strong>。父代理每轮结束都会：
<div class="codehilite"><pre><span></span><code><span class="bp">self</span><span class="p">.</span><span class="n">compact</span><span class="p">();</span>
</code></pre></div>


子代理则是跑满 <code>max_iterations</code> 也不压缩。40 轮 × 每轮最多 20,000 字符的工具结果（<code>max_output</code>），最坏情况接近 800k 字符留在局部 <code>messages</code> 里——而父代理的预算是 120,000。子代理没有自己的预算，也没有借用父代理的。
<h2>子代理继承了什么：sub_cfg 与父配置的差异面</h2>

<code>sub_cfg</code> 是父配置的克隆，改动只有两处：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">sub_cfg</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">m</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="n">def</span><span class="p">.</span><span class="n">model</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">sub_cfg</span><span class="p">.</span><span class="n">model</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span><span class="w"> </span><span class="p">}</span>
<span class="c1">// Sub-agents never stream (we want the full response to return).</span>
<span class="n">sub_cfg</span><span class="p">.</span><span class="n">stream</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
</code></pre></div>


完整差异表：
