<h2 id="_8">🔬 研究方向</h2>
<h3 id="_9">🛰️ 遥感图像智能分析</h3>
<blockquote>
<p>利用大模型与 AI 技术对遥感影像进行自动化分析和信息提取。</p>
</blockquote>
<p>主要工作包括：</p>
<ul>
<li><strong>图像分类</strong> — 使用视觉大模型、多模态大模型对遥感场景进行智能分类</li>
<li><strong>语义分割</strong> — 基于大模型的像素级地物识别与边界提取</li>
<li><strong>变化检测</strong> — 多时相遥感影像对比分析</li>
</ul>
<h3 id="webgis">🗺️ WebGIS 系统开发</h3>
<blockquote>
<p>将地理信息分析能力搬到浏览器端。</p>
</blockquote>
<p>技术栈：</p>
<ul>
<li><strong>前端地图库</strong> — Leaflet、Mapbox GL JS、OpenLayers</li>
<li><strong>后端服务</strong> — GeoServer、PostGIS</li>
<li><strong>数据格式</strong> — GeoJSON、GeoTIFF、WMS/WFS</li>
</ul>
<h3 id="_10">🤖 大模型应用</h3>
<blockquote>
<p>探索大模型与 AI Agent 在地理信息科学中的创新应用。</p>
</blockquote>

<span class="c1"># 定义遥感数据分析工具</span>
<span class="k">def</span><span class="w"> </span><span class="nf">analyze_rs_image</span><span class="p">(</span><span class="n">image_path</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
<span class="w">    </span><span class="sd">&quot;&quot;&quot;分析遥感影像并返回分类结果&quot;&quot;&quot;</span>

    <span class="k">return</span> <span class="s2">&quot;分类结果: 水体 30%, 植被 45%, 建筑 25%&quot;</span>

<span class="n">tools</span> <span class="o">=</span> <span class="p">[</span>
    <span class="n">Tool</span><span class="p">(</span><span class="n">name</span><span class="o">=</span><span class="s2">&quot;遥感图像分析&quot;</span><span class="p">,</span> <span class="n">func</span><span class="o">=</span><span class="n">analyze_rs_image</span><span class="p">,</span>
         <span class="n">description</span><span class="o">=</span><span class="s2">&quot;分析遥感影像，识别地物类型&quot;</span><span class="p">)</span>
<span class="p">]</span>

<span class="n">agent</span> <span class="o">=</span> <span class="n">AgentExecutor</span><span class="o">.</span><span class="n">from_agent_and_tools</span><span class="p">(</span>
    <span class="n">agent</span><span class="o">=</span><span class="n">YourAgent</span><span class="p">(</span><span class="n">llm</span><span class="o">=</span><span class="n">OpenAI</span><span class="p">(</span><span class="n">model</span><span class="o">=</span><span class="s2">&quot;gpt-4o&quot;</span><span class="p">)),</span>
    <span class="n">tools</span><span class="o">=</span><span class="n">tools</span>
<span class="p">)</span>
