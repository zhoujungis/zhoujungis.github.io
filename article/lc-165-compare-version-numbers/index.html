    <noscript><div class="ns-article"><h1>【LC 165】比较版本号：归一化后逐列比 —— 剥前导零 + 缺位补零</h1><div class="ns-meta">2026/9/29 · Zhou Jun</div><div class="markdown-body"><h2>题目</h2>

给你两个版本号字符串 <code>version1</code> 和 <code>version2</code>，比较它们。

版本号由以点（<code>.</code>）分隔的修订号组成，修订号从左到右依次比较：
<ul>
<li><strong>忽略前导零</strong>：每个修订号的数字比较时忽略前导零（<code>"01"</code> 等于 <code>"1"</code>）；</li>
<li><strong>缺失视为 0</strong>：如果版本号没有某处的修订号，视为 <code>0</code>（<code>"1.0"</code> 与 <code>"1.0.0"</code> 相等）。</li>
</ul>

返回规则：<code>version1 &gt; version2</code> 返回 1，<code>version1 &lt; version2</code> 返回 -1，相等返回 0。
<div class="codehilite"><pre><span></span><code>输入: version1 = &quot;1.01&quot;, version2 = &quot;1.001&quot;
输出: 0   （忽略前导零后都是 1.1）

输入: version1 = &quot;1.0&quot;, version2 = &quot;1.0.0&quot;
输出: 0   （缺失的修订号视为 0）

输入: version1 = &quot;1.2&quot;, version2 = &quot;1.10&quot;
输出: -1  （2 &lt; 10 —— 字符比较 &#39;2&#39; &gt; &#39;1&#39; 会错成 1）
</code></pre></div>


暑期面经高频题，考的就是"规则翻译得全不全"。
<ul>
<li><a href="#section-1">一、核心洞察：先归一化，再逐列比</a></li>
<li><a href="#section-2">二、拆解：归一化之后的漂亮事实</a></li>
<li><a href="#section-3">三、动画怎么看</a></li>
<li><a href="#section-4">四、完整推演表</a></li>
<li><a href="#section-5">五、变体：parseInt 精度陷阱与原地双指针</a></li>
<li><a href="#section-6">六、Java 版</a></li>
<li><a href="#section-7">七、边界情况</a></li>
<li><a href="#section-8">八、复杂度</a></li>
<li><a href="#section-9">九、常见坑</a></li>
<li><a href="#section-10">十、面试怎么答</a></li>
</ul>
<h2>一、核心洞察：先归一化，再逐列比</h2>

这题（LC 165）看起来规则一堆（前导零、缺失补零、逐列、返回三种值），但两条规则其实指向同一个动作：
<blockquote>

<strong>把每个修订号先"归一化"，再逐列比较</strong> —— 归一化 = 剥前导零（缺失修订号视为 <code>"0"</code>）。
剥完之后，剩下的就是最朴素的逐列比对：相等进下一列，不等就短路返回。
</blockquote>

上一题 LC 415（字符串相加）讲过：竖式的灵魂是"排除法" —— 排除捷径后剩下的唯一做法。这题一模一样：<strong>不能转数字比大小吗？能，但有陷阱（见第五节）；不转数字怎么比？归一化之后有个漂亮的事实（下一节）。</strong>

另一个洞察：这题和 LC 415 的负数变体共享同一个技巧 —— <strong>比较两个字符串形式的数字（先剥前导零 / 先取绝对值），第一步永远是"先比长度，等长再比字典序"</strong>。系列内部的知识迁移，面试里主动点出来是加分项。
<h2>二、拆解：归一化之后的漂亮事实</h2>
<h3>2.1 剥前导零</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">strip_zeros</span><span class="p">(</span><span class="n">s</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">str</span><span class="p">:</span>
    <span class="n">i</span> <span class="o">=</span> <span class="mi">0</span>
    <span class="k">while</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">s</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span> <span class="ow">and</span> <span class="n">s</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">==</span> <span class="s1">&#39;0&#39;</span><span class="p">:</span>   <span class="c1"># len(s) - 1 保证至少留一位</span>
        <span class="n">i</span> <span class="o">+=</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="n">s</span><span class="p">[</span><span class="n">i</span><span class="p">:]</span>
</code></pre></div>


两个边界：全零 <code>"000"</code> 剥成 <code>"0"</code>（不是空串）；<code>i &lt; len(s) - 1</code> 的守卫就是为它服务的 —— <strong>永远给结果留一位</strong>。缺失的修订号直接当 <code>"0"</code> 用。
<h3>2.2 漂亮的事实：比数值 = 先比长度，等长再比字典序</h3>

剥完前导零的数字串<strong>没有前导零</strong>，于是：
<ul>
<li><strong>长度不等</strong>：长的那个数一定更大（没有前导零的数，位数多就是大）；</li>
<li><strong>长度相等</strong>：字典序（逐字符比较）与数值序<strong>完全一致</strong>。</li>
</ul>

所以比较两个归一化后的修订号，全程<strong>不需要任何数字转换</strong>：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">cmp_norm</span><span class="p">(</span><span class="n">a</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">b</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>
    <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="n">a</span><span class="p">)</span> <span class="o">!=</span> <span class="nb">len</span><span class="p">(</span><span class="n">b</span><span class="p">):</span>
        <span class="k">return</span> <span class="o">-</span><span class="mi">1</span> <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="n">a</span><span class="p">)</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">b</span><span class="p">)</span> <span class="k">else</span> <span class="mi">1</span>
    <span class="k">if</span> <span class="n">a</span> <span class="o">==</span> <span class="n">b</span><span class="p">:</span>
        <span class="k">return</span> <span class="mi">0</span>
    <span class="k">return</span> <span class="o">-</span><span class="mi">1</span> <span class="k">if</span> <span class="n">a</span> <span class="o">&lt;</span> <span class="n">b</span> <span class="k">else</span> <span class="mi">1</span>
</code></pre></div>


这个"先长度后字典序"正是 LC 415 含负数变体里比绝对值用的同一招。它的附加价值在第五节：<strong>免疫超长修订号的精度陷阱</strong>。
<h3>2.3 主流程：逐列比较 + 短路</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">compareVersion</span><span class="p">(</span><span class="n">version1</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">version2</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>
    <span class="n">rev1</span> <span class="o">=</span> <span class="n">version1</span><span class="o">.</span><span class="n">split</span><span class="p">(</span><span class="s1">&#39;.&#39;</span><span class="p">)</span>
    <span class="n">rev2</span> <span class="o">=</span> <span class="n">version2</span><span class="o">.</span><span class="n">split</span><span class="p">(</span><span class="s1">&#39;.&#39;</span><span class="p">)</span>
    <span class="n">cols</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="nb">len</span><span class="p">(</span><span class="n">rev1</span><span class="p">),</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev2</span><span class="p">))</span>

    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">cols</span><span class="p">):</span>
        <span class="n">v1</span> <span class="o">=</span> <span class="n">strip_zeros</span><span class="p">(</span><span class="n">rev1</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="k">if</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev1</span><span class="p">)</span> <span class="k">else</span> <span class="s1">&#39;0&#39;</span>
        <span class="n">v2</span> <span class="o">=</span> <span class="n">strip_zeros</span><span class="p">(</span><span class="n">rev2</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="k">if</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev2</span><span class="p">)</span> <span class="k">else</span> <span class="s1">&#39;0&#39;</span>
        <span class="n">c</span> <span class="o">=</span> <span class="n">cmp_norm</span><span class="p">(</span><span class="n">v1</span><span class="p">,</span> <span class="n">v2</span><span class="p">)</span>
        <span class="k">if</span> <span class="n">c</span> <span class="o">!=</span> <span class="mi">0</span><span class="p">:</span>
            <span class="k">return</span> <span class="n">c</span>            <span class="c1"># 第一列分出胜负，短路返回</span>
    <span class="k">return</span> <span class="mi">0</span>
</code></pre></div>

<div class="algo-viz algo-viz--lc165"></div>

<h2>三、动画怎么看</h2>

动画就是两张修订号序列（原始串，<code>"02"</code> 原样显示）：上排 v1、下排 v2，从左到右逐列比较。
<ul>
<li><strong>compare 帧</strong>：当前列淡金底；相等列进下一列；分出胜负的列变橙边，横幅给出归一化后的比较（<code>"02" → 2 = "2"</code>、<code>"3" → 3 &lt; "10"</code>）—— 注意前导零是在<strong>这一帧当场剥掉</strong>的；</li>
<li><strong>补零侧</strong>：短版本用完的列画成灰虚格，显示灰色的 0；</li>
<li><strong>done 帧</strong>：裁决列变绿，横幅给出 <code>return 1 / -1 / 0</code>。</li>
</ul>

主例 <code>"1.02.3"</code> 对 <code>"1.2.10"</code> 三列讲完全部规则：第 1 列相等、第 2 列当场剥零、第 3 列 <code>"3" &lt; "10"</code>（数值序）分出胜负短路 —— 字符序里 <code>'3' &gt; '1'</code>，这就是为什么不能直接比字符串。

对照检查：第 2 列展示剥前导零（不剥的话 <code>"02" == "2"</code> 逐字符就不等了）；第 3 列展示"先比长度" —— <code>"3"</code> 与 <code>"10"</code> 等长才能逐字符比，不等长直接位数定大小。全等路径的例子 <code>"1.01"</code> vs <code>"1.001"</code>：三列 <code>1=1、1=1、0=0</code>（缺失侧补零）→ 返回 0。
<h2>五、变体：parseInt 精度陷阱与原地双指针</h2>
<h3>5.1 最短写法（parseInt 版）与它的陷阱</h3>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">compareVersion</span><span class="p">(</span><span class="n">version1</span><span class="p">:</span> <span class="nb">str</span><span class="p">,</span> <span class="n">version2</span><span class="p">:</span> <span class="nb">str</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">int</span><span class="p">:</span>
    <span class="n">rev1</span> <span class="o">=</span> <span class="n">version1</span><span class="o">.</span><span class="n">split</span><span class="p">(</span><span class="s1">&#39;.&#39;</span><span class="p">)</span>
    <span class="n">rev2</span> <span class="o">=</span> <span class="n">version2</span><span class="o">.</span><span class="n">split</span><span class="p">(</span><span class="s1">&#39;.&#39;</span><span class="p">)</span>
    <span class="n">n</span> <span class="o">=</span> <span class="nb">max</span><span class="p">(</span><span class="nb">len</span><span class="p">(</span><span class="n">rev1</span><span class="p">),</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev2</span><span class="p">))</span>
    <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">n</span><span class="p">):</span>
        <span class="n">a</span> <span class="o">=</span> <span class="nb">int</span><span class="p">(</span><span class="n">rev1</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="k">if</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev1</span><span class="p">)</span> <span class="k">else</span> <span class="mi">0</span>
        <span class="n">b</span> <span class="o">=</span> <span class="nb">int</span><span class="p">(</span><span class="n">rev2</span><span class="p">[</span><span class="n">i</span><span class="p">])</span> <span class="k">if</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="nb">len</span><span class="p">(</span><span class="n">rev2</span><span class="p">)</span> <span class="k">else</span> <span class="mi">0</span>
        <span class="k">if</span> <span class="n">a</span> <span class="o">!=</span> <span class="n">b</span><span class="p">:</span>
            <span class="k">return</span> <span class="o">-</span><span class="mi">1</span> <span class="k">if</span> <span class="n">a</span> <span class="o">&lt;</span> <span class="n">b</span> <span class="k">else</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="mi">0</span>
</code></pre></div>


Python 的 <code>int()</code> 是任意精度，直接写没问题。<strong>JS 的 <code>parseInt</code> / Java 的 <code>Long.parseLong</code> 就有陷阱</strong>：修订号可以任意长，超过安全整数（JS 的 2^53）或 Long 范围就失真。实测一组反例（只差<strong>末位</strong>的 21 位数）：
<div class="codehilite"><pre><span></span><code>version1 = &quot;1.100000000000000000001&quot;
version2 = &quot;1.100000000000000000002&quot;
JS parseInt：两个修订号都变成 1.0000000000000000e+21 → 判相等，返回 0 ❌
正确答案：-1（末位 1 &lt; 2）
</code></pre></div>


面试里把这组反例主动说出来（"我会用字符串法避免 parseInt 的精度问题"），比写出最短版更值钱 —— <strong>这就是第二节"先长度后字典序"的用武之地</strong>：纯字符串操作，任意长度都对。
<h3>5.2 原地双指针版（不 split）</h3>

不切分数组、两个指针直接在原串上扫：每列先把 <code>p1</code> 停在下一个 <code>.</code> 前，边扫边算 <code>val = val * 10 + digit</code>（或边扫边剥零），到 <code>.</code> 一列结束。省掉 split 的 O(m + n) 额外数组，但<strong>必须小心"一侧用完"的判定</strong>（<code>p1 &gt;= len</code> 时视为 0）。写法长、易错点多，面试口头提一句"可以原地扫"即可，<strong>动手时写 split 版</strong> —— 清晰度值这个空间。

<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">cols</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

<span class="w">        </span><span class="n">String</span><span class="w"> </span><span class="n">v2</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">rev2</span><span class="p">.</span><span class="na">length</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="n">stripZeros</span><span class="p">(</span><span class="n">rev2</span><span class="o">[</span><span class="n">i</span><span class="o">]</span><span class="p">)</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="s">&quot;0&quot;</span><span class="p">;</span>

<span class="w">    </span><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="p">(</span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="na">length</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="na">charAt</span><span class="p">(</span><span class="n">i</span><span class="p">)</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="sc">&#39;0&#39;</span><span class="p">)</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">;</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="na">substring</span><span class="p">(</span><span class="n">i</span><span class="p">);</span>
<span class="p">}</span>

<span class="w">    </span><span class="kt">int</span><span class="w"> </span><span class="n">c</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">a</span><span class="p">.</span><span class="na">compareTo</span><span class="p">(</span><span class="n">b</span><span class="p">);</span>
<span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">c</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="o">-</span><span class="mi">1</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="n">c</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">?</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">:</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>

三个 Java 细节：<code>split</code> 的参数是<strong>正则</strong>，<code>.</code> 要写成 <code>"\\."</code>；等长时 <code>compareTo</code> 就是字典序；Java 8+ 也可以用 <code>new BigDecimal(rev).compareTo(...)</code> 但那是杀鸡用牛刀，且面试官想看的是字符串功夫。

<h2>八、复杂度</h2>
<ul>
<li><strong>时间 O(m + n + C·L)</strong>：m、n 是两串长度（split 扫一遍），C 是列数、L 是修订号平均长度（逐列比较扫一遍）。总量级就是 <strong>O(m + n)</strong>。</li>
<li><strong>空间 O(m + n)</strong>：split 出的数组。原地双指针版可以做到 O(1)（不计输出），见 5.2。</li>
</ul>
<h2>九、常见坑</h2>
<h3>9.1 直接比字符串</h3>

<code>"1.2" vs "1.10"</code>：逐字符 <code>'2' &gt; '1'</code> 判 version1 大，<strong>数值上 2 &lt; 10</strong>。<code>"3"</code> vs <code>"10"</code> 同理。只要修订号能超过一位，字符比较就是错的 —— 必须先归一化再按"长度 + 字典序"比。
<h3>9.2 parseInt / Long 的精度陷阱</h3>

超长修订号（题面没限制长度）转数值会失真，两个不同的修订号可能被转成同一个数（见 5.1 的 21 位反例）。<strong>字符串法零转换，天然免疫</strong> —— 这也是本文第二节那个"漂亮事实"的实际价值。
<h3>9.3 剥前导零剥成空串</h3>

<code>while (s[i] == '0') i++</code> 不带边界，<code>"000"</code> 会剥成 <code>""</code>，之后 <code>""</code> 和 <code>"0"</code> 比较长度出错。守卫是 <code>i &lt; len(s) - 1</code> —— <strong>永远给结果留一位</strong>。
<h3>9.4 缺失修订号不补零</h3>

短版本用完就 <code>return len1 - len2</code>（拿列数当大小）是错的：<code>"1.0.1"</code> vs <code>"1"</code> 差的不是列数，是<strong>那一列的值</strong>。缺失侧必须按 0 参与：<code>"1.0"</code> vs <code>"1.0.0"</code> 相等，<code>"1.0.1"</code> vs <code>"1"</code> 返回 -1。
<h3>9.5 Java 的 split 正则</h3>

<code>version.split(".")</code> 返回<strong>空数组</strong>（<code>.</code> 是正则的"任意字符"，按分隔符切掉了所有内容）。必须 <code>"\\."</code>。Python 的 <code>split('.')</code> 是字面量分割，没这个问题。
<h3>9.6 忘了短路或短路错方向</h3>

逐列比较一旦分出胜负立即 return，不要比完整表再汇总（虽然结果通常一样，但 <code>return c != 0 ? c : 0</code> 的写法容易把 c 的正负号弄反）。每列的裁决就是最终裁决。
<h2>十、面试怎么答</h2>
<ol>
<li><strong>一句话定性</strong>："两条规则（前导零、缺失补零）都指向同一个动作 —— 先归一化，再逐列比较。"</li>
<li><strong>说出那个漂亮事实</strong>："剥完前导零后，比数值 = 先比长度、等长比字典序 —— 全程不用转数字。"</li>
<li><strong>主动提精度陷阱</strong>："JS/Java 里 parseInt/Long 会失真，字符串法免疫；Python 的 int 任意精度，直接转也行。"</li>
<li><strong>边界报菜名</strong>：<code>"1.2" vs "1.10"</code>（字符序反例）、<code>"1.0" vs "1.0.0"</code>（补零）、<code>"000"</code> 剥零留一位。</li>
<li><strong>复杂度</strong>：O(m + n) 时间；split 版 O(m + n) 空间，原地双指针 O(1)。</li>
<li><strong>如果面试官追问</strong>"那版本号带字母后缀呢"（如 <code>1.0.0-beta</code>）—— 先按 <code>-</code> 切开比数字部分，相同再比后缀（<code>alpha &lt; beta</code>），规则照旧逐层归一化。</li>
</ol>
<h2>结语</h2>

比较版本号表面是规则模拟，内核还是系列反复出现的两条线：<strong>归一化让比较变简单</strong>（剥前导零后"长度即大小"），<strong>字符串功夫兜住数值做不到的事</strong>（任意长度不失真）。上一题 LC 415 的"先比长度再比字典序"在这里原样复用 —— 系列里同一招反复出现，才说明它真的成了你的工具。</div></div></noscript>
