结论先行：观测不是往代码里撒日志，而是让每一笔消耗都能落到一行可审计的账上——<strong>谁发起的、做了什么、花了多少、什么时候</strong>。NanoHermes 有观测的零件（<code>UsageTotals</code>、<code>UiEvent::Usage</code>、任务板的 <code>duration</code>），但没有账本：用量只活在进程内存里、三处内部模型调用完全不进账、子代理的花费在数据结构上就没有位置

</blockquote>

<strong>目录</strong>
<ul>
<li>前言：能打日志，为什么还是答不出「花了多少」</li>
<li>结论先行：一本账要有四个字段，错账有三种</li>
<li>先把 NanoHermes 的观测面列全</li>
<li><code>UsageTotals</code>：三个字段与一个接口</li>
<li><code>Copy</code> 的代价：账本没有共享句柄</li>
<li>用量是从响应里抠出来的</li>
<li>只读两个字段：缓存与思维链在账上是免费的</li>
<li>流式下的用量靠一帧：<code>include_usage</code></li>
<li>流断在中途，那一轮的用量一起丢</li>
<li>记账点写在 <code>?</code> 之后：失败轮次不计入</li>
<li>重试与 fallback：一次成功掩盖 N 次请求</li>
<li>账本上没有「模型」这个维度</li>
<li>三处内部调用完全不进账</li>
<li>压缩的账：摘要是一次完整的模型请求</li>
<li>记忆提炼的账：每轮收尾的一次隐藏调用</li>

<h2>前言：能打日志，为什么还是答不出「花了多少」</h2>

一个能跑任务的 agent，通常很快就会有三种日志：工具调用的横幅、错误信息、以及「context compacted」这类状态提示。它们都能证明「发生过什么」，但都不能回答三个最基本的问题：
<ul>
<li>这次任务一共发了多少次模型请求，其中几次是重试</li>
<li>这次任务烧掉的 token 里，有多少是子代理烧的</li>
<li>昨天下午那次跑了四十分钟的任务，成本记在哪个会话上</li>
</ul>

这三个问题都指向同一件事：<strong>日志是事件流，账本是表</strong>。事件流的每一行都只描述「此刻发生了一件事」，它不负责累加、不负责归属、也不负责跨进程存活。要做账，你得先决定表长什么样。

NanoHermes 在这件事上的状态很典型：它有观测的零件，但没有账本。<code>UsageTotals</code> 只有三个字段，<code>UiEvent::Usage</code> 只有一种增量语义，任务板只记时间不记钱，而真正花掉大部分 token 的三处内部调用（压缩、记忆提炼、子代理）连一个字都不记。这不是作者疏忽——每个零件单看都够用，问题出在它们没有被同一个数据模型串起来。

本文先把这些零件一个个拆开，看清每个零件的口径；再指出五类错账分别在哪儿发生；最后给一个三层账本模型（turn / span / totals）和七处加固点。08 是这个系列的最后一篇，所以结尾会把八篇收在一起。
<h2>结论先行：一本账要有四个字段，错账有三种</h2>

判断一个 agent 有没有账本，不看它有没有日志，看它能不能对下面四个字段给出答案：
<div class="table-scroll"><table>
<thead>
<tr>
<th>字段</th>
<th>含义</th>
<th>NanoHermes 的现状</th>
</tr>
</thead>
<tbody>
<tr>
<td>who</td>
<td>谁发起的这次消耗</td>
<td>只有「主代理」一个身份，子代理记不上</td>
</tr>
<tr>
<td>what</td>
<td>做了什么（模型请求、工具、压缩、提炼）</td>
<td>只有模型请求被计数</td>
</tr>
<tr>
<td>how much</td>
<td>token 数、请求数、耗时</td>
<td>token 有，耗时只在子代理与后台任务上有</td>
</tr>
<tr>
<td>when</td>
<td>发生在哪个会话、哪一轮</td>
<td>没有时间戳，也没有 turn id</td>
</tr>
</tbody>
</table></div>

缺字段的后果不是「数据不好看」，而是三类具体的错账：

<strong>漏账</strong>：花了但没记。重试的请求、失败的请求、压缩用的那次摘要调用、记忆提炼的调用、子代理内部的全部调用，都属于这一类。

<strong>串账</strong>：记到了别人头上。daemon 用一个 Agent 服务多个会话，用量是进程级累加，靠 <code>before/after</code> 差分把某一段切给某个会话；一旦这段里有失败轮次，那部分 token 就既不在前一个请求的账上，也不在后一个请求的账上。

<strong>糊涂账</strong>：记了，但口径不清。<code>requests</code> 到底算「HTTP 请求」还是「成功的模型轮次」？<code>prompt_tokens</code> 含不含缓存命中？子代理的 token 算不算进主任务？这些没定死，同一个数字两个人能算出两个结论。

三类错账里，漏账最容易修，糊涂账最难修——因为它不是代码问题，是定义问题。下面从零件开始。
<h2>先把 NanoHermes 的观测面列全</h2>

在没有账本之前，可观测的东西其实不少，只是分散在五种载体里：
<div class="table-scroll"><table>
<thead>
<tr>
<th>观测面</th>
<th>载体</th>
<th>粒度</th>
<th>粒度内的单位</th>
<th>跨进程存活</th>
</tr>
</thead>
<tbody>
<tr>
<td>会话用量</td>
<td><code>Agent::usage</code></td>
<td>进程累计</td>
<td>token / 请求数</td>
<td>否</td>
</tr>
<tr>
<td>单次用量</td>
<td><code>UiEvent::Usage</code></td>
<td>一次模型请求</td>
<td>增量</td>
<td>即时投递</td>
</tr>
<tr>
<td>对话历史</td>
<td><code>messages</code> 数组</td>
<td>一条消息</td>
<td>role + content</td>
<td>是（session 文件）</td>
</tr>
<tr>
<td>子代理任务</td>
<td><code>Board::jobs</code></td>
<td>一次委派</td>
<td>状态 + 耗时 + 结果预览</td>
<td>否</td>
</tr>
<tr>
<td>后台命令</td>
<td><code>TaskManager</code></td>
<td>一个进程</td>
<td>状态 + 启动时刻 + 输出</td>
<td>否</td>
</tr>
<tr>
<td>错误与提示</td>
<td><code>eprintln!</code> / <code>Style::note</code></td>
<td>一行文本</td>
<td>无结构</td>
<td>否</td>
</tr>
</tbody>
</table></div>

这张表里最值得注意的是最后两列的对比：<strong>唯一跨进程存活的是对话历史，而它是一个纯文本结构</strong>。<code>save_session_file</code> 写出去的就是 <code>messages</code> 数组，<code>assistant_message</code> 只塞 <code>role</code>、<code>content</code>、<code>tool_calls</code> 三样东西，没有时间戳、没有用量、没有 turn id。

换句话说，NanoHermes 的「持久化」和「观测」是两条互不相交的路：能活下来的东西不含账，含账的东西活不下来。
<h2><code>UsageTotals</code>：三个字段与一个接口</h2>

整本账的起点是二十行代码：
