<span class="p">}</span>

<span class="k">impl</span><span class="w"> </span><span class="n">Ledger</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">record</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">rec</span><span class="p">:</span><span class="w"> </span><span class="nc">TurnRecord</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">inner</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">push</span><span class="p">(</span><span class="n">rec</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">snapshot</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">TurnRecord</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">inner</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">clone</span><span class="p">()</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="sd">/// 父账 = 自身 + 子账之和，这条不变量在测试里断言。</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">totals</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">all</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">inner</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">();</span>
<span class="w">        </span><span class="n">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="n">prompt_tokens</span><span class="p">:</span><span class="w"> </span><span class="nc">all</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">).</span><span class="n">sum</span><span class="p">(),</span>
<span class="w">            </span><span class="n">completion_tokens</span><span class="p">:</span><span class="w"> </span><span class="nc">all</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">).</span><span class="n">sum</span><span class="p">(),</span>
<span class="w">            </span><span class="n">cached_tokens</span><span class="p">:</span><span class="w"> </span><span class="nc">if</span><span class="w"> </span><span class="n">all</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">all</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">cached_tokens</span><span class="p">.</span><span class="n">is_some</span><span class="p">())</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="nb">Some</span><span class="p">(</span><span class="n">all</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">filter_map</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">cached_tokens</span><span class="p">).</span><span class="n">sum</span><span class="p">())</span>
<span class="w">            </span><span class="p">}</span><span class="w"> </span><span class="k">else</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="nb">None</span>
<span class="w">            </span><span class="p">},</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


关键在于三处：
<ul>
<li><code>Usage.cached_tokens</code> 是 <code>Option&lt;u64&gt;</code>，把「未知」和「0」分开</li>
<li><code>Who</code> 是个枚举，子代理的账有身份，不是匿名的</li>
<li><code>record</code> 只追加，没有「更新某一行」的接口——失败的行也要留在里面</li>
</ul>

把它接到 agent 上，改动点只有四个：<code>Run</code> 里给每次 <code>complete()</code> 记一行、<code>summarize</code> / <code>distill</code> 各记一行、<code>run_subagent_inner</code> 结束时记一行、<code>persist</code> 时把账本序列化进会话文件。四处加起来不到四十行。

真正的工作量不在代码，在把 <code>Ledger</code> 从 <code>&amp;self</code> 能拿到的地方传下去。<code>run_subagent</code> 拿的是 <code>&amp;self</code>，所以 <code>Ledger</code> 必须是 <code>Arc</code>，且内部用 <code>Mutex</code>——这与 <code>Board</code>、<code>Gate</code> 的模式一致，NanoHermes 已经有这个习惯了。
<h2>怎么测账本：三条不变量</h2>

账本的正确性没法靠「看着对」来验证，得靠不变量。三条就够：

<strong>一、求和一致。</strong> 所有 span 的用量之和等于 totals。这条能抓住「记了但没汇总」和「汇总时漏了一类」。
<div class="codehilite"><pre><span></span><code><span class="cp">#[test]</span>
<span class="k">fn</span><span class="w"> </span><span class="nf">totals_equal_the_sum_of_every_span</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">ledger</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">Ledger</span><span class="p">::</span><span class="n">default</span><span class="p">();</span>
<span class="w">    </span><span class="n">ledger</span><span class="p">.</span><span class="n">record</span><span class="p">(</span><span class="n">turn</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">Who</span><span class="p">::</span><span class="n">Main</span><span class="p">,</span><span class="w"> </span><span class="mi">100</span><span class="p">,</span><span class="w"> </span><span class="mi">20</span><span class="p">));</span>
<span class="w">    </span><span class="n">ledger</span><span class="p">.</span><span class="n">record</span><span class="p">(</span><span class="n">turn</span><span class="p">(</span><span class="mi">2</span><span class="p">,</span><span class="w"> </span><span class="n">Who</span><span class="p">::</span><span class="n">Compact</span><span class="p">,</span><span class="w"> </span><span class="mi">5000</span><span class="p">,</span><span class="w"> </span><span class="mi">100</span><span class="p">));</span>
<span class="w">    </span><span class="n">ledger</span><span class="p">.</span><span class="n">record</span><span class="p">(</span><span class="n">turn</span><span class="p">(</span><span class="mi">3</span><span class="p">,</span><span class="w"> </span><span class="n">Who</span><span class="p">::</span><span class="n">SubAgent</span><span class="p">(</span><span class="s">&quot;agent-7&quot;</span><span class="p">.</span><span class="n">into</span><span class="p">()),</span><span class="w"> </span><span class="mi">800</span><span class="p">,</span><span class="w"> </span><span class="mi">40</span><span class="p">));</span>
<span class="w">    </span><span class="fm">assert_eq!</span><span class="p">(</span><span class="n">ledger</span><span class="p">.</span><span class="n">totals</span><span class="p">().</span><span class="n">prompt_tokens</span><span class="p">,</span><span class="w"> </span><span class="mi">5900</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


<strong>二、父子可加。</strong> 父 turn 的用量等于「自身 + 所有子 span」。这条能抓住「子代理的钱记了但没挂到父上」。

<strong>三、失败也有行。</strong> 构造一个必定失败的请求（比如 mock 服务端返回 500），断言账本里有一行的 <code>outcome</code> 是错误、且 <code>requests</code> 大于零。这条能抓住本文最关心的那类漏账。

第三条最有价值，因为它反过来要求你把失败路径的用量带出来——也就是前文说的「改返回类型」。测试先行会逼着结构改对。

顺带说一句：这三条都不需要真实 API。用一个返回固定 JSON 的本地模拟端点就行，<code>agent/tests/e2e_mock_llm.rs</code> 已经有这个基础设施了，加几个账本断言是顺手的事。
<h2>七处可以加固的地方</h2>

按投入产出比排序。

<strong>一、把记账移到 <code>?</code> 之前。</strong> 最小改动：先记「发出了一次请求」，成功后再补 token。这样失败也有行，<code>requests</code> 变成「真实发出数」，<code>successful</code> 另计。三行代码，消除最基础的漏账。

<strong>二、让 <code>Usage</code> 带上 <code>cached_tokens: Option&lt;u64&gt;</code> 与 <code>reasoning_tokens: Option&lt;u64&gt;</code>。</strong> 两个 <code>Option</code> 字段，<code>usage_from_value</code> 多读两行。从此「缓存省钱」和「推理费钱」可查。

<strong>三、把 <code>summarize</code> / <code>distill</code> / <code>run_subagent_inner</code> 的 <code>turn.usage</code> 收起来。</strong> 三处各加一行记录，前提是先有 <code>Ledger</code>。这是「requests 只有一半」这个偏差的唯一解。

<strong>四、<code>run_subagent</code> 返回结构体而不是 <code>String</code>。</strong> <code>Delegation { text, usage, requests, elapsed }</code>，板上的 <code>Job</code> 同步加 <code>usage</code> 字段。<code>agent_list</code> 于是能显示「最贵的子代理」。

<strong>五、会话文件升级到带 meta 的对象。</strong> 加载时兼容裸数组（当 v1 处理），保存时写 v2。这一条让 <code>-c</code> 之后的 <code>/cost</code> 不再是零。

<strong>六、把重试与降级从 <code>eprintln!</code> 挪进事件通道。</strong> <code>llm::chat</code> 加一个回调（或者把 <code>Style</code> 传进来），重试时发一个 <code>UiEvent::Note</code>。终端与 GUI 从此看到同样的信息，日志也能进账本。

<strong>七、<code>done</code> 与 <code>error</code> 两种终结行都带 <code>total_usage</code>。</strong> 一行协议改动，让所有流式客户端不用自己求和，也不会在失败时丢掉部分用量。

前三条是「补漏」，第四、五条是「建结构」，第六、七条是「统一口径」。如果只能做一条，做第一条；如果能做三条，做一、五、七——它们分别覆盖漏账、串账、糊涂账各一类。
<h2>小结：观测的终点是能对账</h2>

把 08 压成三句话。

<strong>第一，日志和账本不是一回事。</strong> 日志是事件流，回答「发生了什么」；账本是表，回答「谁花了多少」。NanoHermes 有前者（三十多处 <code>eprintln!</code>、一套 <code>UiEvent</code>），但没有后者——<code>UsageTotals</code> 三个标量活在进程内存里，重启即清零。

<strong>第二，漏账不是因为忘了写，是因为结构上没有位置。</strong> 压缩、提炼、子代理三处内部调用都直接调 <code>llm::chat</code>，都没有 <code>&amp;mut Agent</code>，<code>UsageTotals</code> 又是 <code>Copy</code> 值。要让它们记账，得先把账本从「一个字段」升级成「一个共享对象」。这和 07 的结论是同一件事的两面：共享状态要有归属，归属要有地方写。

<strong>第三，观测的价值在于能对账，不在于能打印。</strong> 一个能回答「这次任务花了多少、花在哪、为什么失败」的系统，不需要很花哨的 UI，只需要每一笔消耗都有一行带 who / what / how much / when 的记录，且这行能活过进程重启。

写这个系列的过程中，我反复回到同一个判断标准：<strong>一个 agent 的工程质量，取决于它把哪些东西当成了一等公民</strong>。01 把循环当成一等公民，02 把上下文预算当成一等公民，03 把记忆的写入与检索当成一等公民，04 把输出上限当成一等公民，05 把线程与配额当成一等公民，06 把权限闸门当成一等公民，07 把责任边界当成一等公民。08 想说：<strong>账本也该是一等公民</strong>——不是事后加的日志，而是从第一天就参与数据流的结构。
<h2>系列收束：八篇讲了一个什么样的 Agent</h2>

八篇拆的是同一个项目 <code>NanoHermes</code>，但每篇都在回答一个更一般的问题：
<div class="table-scroll"><table>
<thead>
<tr>
<th>篇号</th>
<th>标题</th>
<th>拆的是什么</th>
<th>留下的判断标准</th>
</tr>
</thead>
<tbody>
<tr>
<td>01</td>
<td>Agent 的本质：一个两百行的循环</td>
<td>主循环、消息状态、并发、中断</td>
<td>循环之外没有第二套系统</td>
</tr>
<tr>
<td>02</td>
<td>Agent 上下文：留什么，丢什么</td>
<td>压缩、摘要、输出上限</td>
<td>上下文是工作集，不是仓库</td>
</tr>
<tr>
<td>03</td>
<td>Agent 记忆：不接向量库也能长期记忆</td>
<td>本地检索、注入、沉淀</td>
<td>记忆是索引，不是存储</td>
</tr>
<tr>
<td>04</td>
<td>Agent 工具设计：为什么输出都要有上限</td>
<td>Schema、错误语义、截断</td>
<td>工具的边界就是 Agent 的边界</td>
</tr>
<tr>
<td>05</td>
<td>Agent 并发：不用 async 运行时怎么并行</td>
<td>作用域线程、门控</td>
<td>并发是预算问题，不是语法问题</td>
</tr>
<tr>
<td>06</td>
<td>Agent 安全：让它跑命令而不失控</td>
<td>审批、沙箱、钩子</td>
<td>闸门要在执行层，不在清单层</td>
</tr>
<tr>
<td>07</td>
<td>Agent 多体：子代理、任务板与限流</td>
<td>委派、并发门、任务板</td>
<td>共享必须有归属</td>
</tr>
<tr>
<td>08</td>
<td>Agent 观测：给每个轮次记一本账</td>
<td>用量、日志、可观测性</td>
<td>观测的终点是能对账</td>
</tr>
</tbody>
</table></div>

如果把这八篇再压成一句：<strong>一个可靠的 agent，是在循环、上下文、记忆、工具、并发、安全、多体、观测这八个方向上，都做了显式取舍的系统。</strong> 每个方向都有一个「默认值会害你」的地方——默认不压缩上下文、默认信任工具输出、默认共享状态、默认用日志代替账本。NanoHermes 的价值不在于它每个方向都做对了，而在于它的取舍是<strong>可读的</strong>：两百行主循环、一个 <code>memory.json</code>、三十行限流门、三个标量的账本——每一处都能在半小时内读完，然后你就能指出它哪里会坏。

这也解释了为什么这个系列几乎每篇都以「七处可以加固的地方」结尾。不是为了让读者去改 NanoHermes，而是想说明一件事：<strong>看懂一个系统最有效的方式，是找出它在什么条件下会失效。</strong> 能列出失效模式，才算真的读懂了。
