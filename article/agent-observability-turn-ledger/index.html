<span class="p">}</span>

<span class="k">impl</span><span class="w"> </span><span class="n">UsageTotals</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">total_tokens</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">u64</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">completion_tokens</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


三个字段，一个派生方法，两种读取方式：
<ul>
<li><code>Agent::usage()</code> 返回一份 <code>UsageTotals</code> 拷贝，供 <code>/cost</code>、<code>--output-format json</code>、daemon 的差分使用</li>
<li><code>Style::usage(1, prompt, completion)</code> 每完成一次请求就投递一次增量，供 GUI 与流式 daemon 使用</li>
</ul>

<code>total_tokens</code> 是加法，看起来无害，但它藏了一个口径问题：当服务端把 <code>prompt_tokens</code> 里的一部分算作缓存命中时，<code>prompt_tokens + completion_tokens</code> 和账单上的 <code>total_tokens</code> 可能不是一回事。这一点后面单说。
<h2><code>Copy</code> 的代价：账本没有共享句柄</h2>

<code>UsageTotals</code> 派生了 <code>Copy</code>。这个选择在单线程记账时很舒服——传参不用引用，读总数不会挡写。但它同时决定了账本的形状：<strong>没有共享句柄，就没有第二个写入方</strong>。

<code>run()</code> 拿的是 <code>&amp;mut self</code>，所以能写 <code>self.usage</code>；而 <code>run_subagent</code> 的签名是：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">run_subagent</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span>
</code></pre></div>


<code>&amp;self</code> 写不了 <code>self.usage</code>。子代理在内部跑了一到四十轮模型请求，这些请求的 token 有去无回。想让子代理记账，<code>UsageTotals</code> 就不能是 <code>Copy</code> 的值，而得变成 <code>Arc&lt;Ledger&gt;</code> 这样一个共享句柄，让每个执行路径都能往里加一行。

这就是 08 和前面几篇的分水岭：01 到 07 的共享状态（待办、任务板、限流门）都是为了<strong>协作</strong>；账本的共享是为了<strong>归属</strong>。前者关心「谁能改」，后者关心「改的时候署谁的名」。
<h2>用量是从响应里抠出来的</h2>

用量不是 agent 自己算的，是从服务端响应里读的。<code>read_json</code> 在解析完 <code>choices</code> 之后补一行：
<div class="codehilite"><pre><span></span><code><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">usage_from_value</span><span class="p">(</span><span class="o">&amp;</span><span class="n">v</span><span class="p">);</span>
</code></pre></div>


而 <code>usage_from_value</code> 的实现只有一个动作——按 key 取值，取不到就当 0：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">usage_from_value</span><span class="p">(</span><span class="n">v</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Value</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nc">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">u</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;usage&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">get</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">|</span><span class="n">k</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="o">|</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">u</span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">u</span><span class="o">|</span><span class="w"> </span><span class="n">u</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="n">k</span><span class="p">))</span>
<span class="w">            </span><span class="p">.</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">x</span><span class="o">|</span><span class="w"> </span><span class="n">x</span><span class="p">.</span><span class="n">as_u64</span><span class="p">())</span>
<span class="w">            </span><span class="p">.</span><span class="n">unwrap_or</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="n">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">prompt_tokens</span><span class="p">:</span><span class="w"> </span><span class="nc">get</span><span class="p">(</span><span class="s">&quot;prompt_tokens&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="n">completion_tokens</span><span class="p">:</span><span class="w"> </span><span class="nc">get</span><span class="p">(</span><span class="s">&quot;completion_tokens&quot;</span><span class="p">),</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


「取不到就当 0」是这一整段里最重要的设计决定。它让字段缺失不会炸掉整轮对话——这对兼容各种 OpenAI 风格的端点来说是必要的。但它也意味着<strong>账本无法区分「真的用了 0 个 token」和「服务端没告诉我们」</strong>。测试里那句断言把这个语义写得很清楚：
<div class="codehilite"><pre><span></span><code><span class="c1">// Missing usage (e.g. a stream delta) counts as zero, not an error.</span>
<span class="fm">assert_eq!</span><span class="p">(</span>
<span class="w">    </span><span class="n">usage_from_value</span><span class="p">(</span><span class="o">&amp;</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;choices&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[]</span><span class="w"> </span><span class="p">})),</span>
<span class="w">    </span><span class="n">Usage</span><span class="p">::</span><span class="n">default</span><span class="p">()</span>
<span class="p">);</span>
</code></pre></div>


一个能对账的系统，这里应该是一个三态：<code>Some(0)</code>、<code>Some(n)</code>、<code>None</code>。<code>None</code> 要单独计数，让「本次任务的用量未知」成为一个可见的事实，而不是悄悄变成 0。
<h2>只读两个字段：缓存与思维链在账上是免费的</h2>

<code>Usage</code> 结构只有两个字段：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">prompt_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">completion_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


对比主流服务端的 <code>usage</code> 对象，至少有三类信息被丢掉了：
<div class="table-scroll"><table>
<thead>
<tr>
<th>响应字段</th>
<th>含义</th>
<th>丢掉的后果</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>total_tokens</code></td>
<td>服务端自己的合计</td>
<td>无法校验本地加法与服务端是否一致</td>
</tr>
<tr>
<td><code>prompt_tokens_details.cached_tokens</code></td>
<td>命中前缀缓存的 token</td>
<td>缓存省钱这件事在账上看不出来</td>
</tr>
<tr>
<td><code>completion_tokens_details.reasoning_tokens</code></td>
<td>思维链消耗</td>
<td>开 <code>--thinking</code> 之后成本涨幅无法解释</td>
</tr>
</tbody>
</table></div>

第三条尤其值得注意，因为 NanoHermes 是有 <code>--thinking</code> 的：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">thinking</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;reasoning_effort&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;high&quot;</span><span class="p">.</span><span class="n">into</span><span class="p">();</span>
<span class="p">}</span>
</code></pre></div>


打开思维链之后，<code>completion_tokens</code> 会明显上升，但账本里没有任何字段能说明「这里面有多少是推理」。用户看到的只是一个变大的数字，然后去猜是模型变笨了、上下文变长了，还是推理费变贵了。观测的价值恰恰在于把这种猜测变成可查证的事实。

这里也有个反面的公平话：<code>cached_tokens</code> 属于 <code>prompt_tokens_details</code>，不是所有兼容端点都返回它。读它要写成「有则记、无则标未知」，而不是 <code>unwrap_or(0)</code>——后者会把「不支持」伪装成「没命中缓存」，比不记更误导。
<h2>流式下的用量靠一帧：<code>include_usage</code></h2>

非流式请求的用量在响应体里。流式请求里没有响应体——只有一串 <code>data:</code> 行，正文是增量 delta，用量通常藏在最后单独一帧。所以 <code>chat</code> 会在流式时多要一个参数：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">stream</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="c1">// Ask for a trailing usage frame so token counts work while streaming.</span>
<span class="w">    </span><span class="n">body</span><span class="p">[</span><span class="s">&quot;stream_options&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;include_usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">true</span><span class="w"> </span><span class="p">});</span>
<span class="p">}</span>
</code></pre></div>


对应的解析在 <code>read_stream</code>：
<div class="codehilite"><pre><span></span><code><span class="k">if</span><span class="w"> </span><span class="n">v</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;usage&quot;</span><span class="p">).</span><span class="n">is_some</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">usage_from_value</span><span class="p">(</span><span class="o">&amp;</span><span class="n">v</span><span class="p">);</span>
<span class="p">}</span>
</code></pre></div>


注意这里是「覆盖」而不是「累加」。这是对的：用量帧只有一帧，覆盖即赋值。但它同时暴露了一个隐含假设——<strong>只可能有一帧</strong>。如果某个端点把用量拆成两帧发（比如增量式上报），后一帧会覆盖前一帧，账就少了一半。要稳妥，应该判断 <code>total_tokens</code> 是否单调，或者干脆把每帧用量都记进一个 span，让求和发生在账本层。
<h2>流断在中途，那一轮的用量一起丢</h2>

<code>read_stream</code> 是整个文件里唯一一处「读失败就整体报错」的地方：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">l</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">l</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">l</span><span class="p">,</span>
<span class="w">    </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;stream read error: {e}&quot;</span><span class="p">)),</span>
<span class="p">};</span>
</code></pre></div>


问题在于：<code>turn</code> 是函数内的局部变量，<code>Err</code> 返回时它被一起丢掉。如果流已经读到第 900 个 chunk、服务端已经算完了 3 万 prompt token，然后在最后一帧之前断开，这一轮的用量就凭空消失了——不仅没进账本，连「有个失败请求花了钱」这件事也不会出现在任何地方。

这是一个「错误路径不携带数据」的经典形状：函数的返回类型是 <code>Result&lt;AssistantTurn, String&gt;</code>，<code>Err</code> 只能带一句字符串。要保住这部分数据，返回类型得改成 <code>Result&lt;AssistantTurn, (AssistantTurn, String)&gt;</code> 之类，或者把 <code>turn</code> 通过 <code>&amp;mut</code> 传进来，让调用方在失败时仍能看见已经累积的部分。

顺带说一句同文件里的 <code>truncate</code>：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">truncate</span><span class="p">(</span><span class="n">s</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{}… ({} bytes truncated)&quot;</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">s</span><span class="p">[</span><span class="o">..</span><span class="n">end</span><span class="p">],</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">end</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


错误详情被截到 800 字节。这个上限对「别把一整页 HTML 塞进终端」是合理的，但对观测来说意味着：<strong>服务端返回的长错误在账上永远只剩开头</strong>。当你要排查一次诡异的 400 时，被截掉的那段往往才是关键。错误应当按「终端显示截断、账本全文留存」两个口径分别处理。
<h2>记账点写在错误返回之后：失败轮次不计入</h2>

主循环里的记账只有四行，位置很关键：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">complete</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">turn</span><span class="p">,</span>
<span class="w">    </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="bp">self</span><span class="p">.</span><span class="n">persist</span><span class="p">();</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">};</span>
<span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">requests</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">;</span>
<span class="bp">self</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">;</span>
</code></pre></div>


错误分支在记账之前。<code>complete()</code> 返回 <code>Err</code> 时，<code>persist()</code> 之后直接向上返回，记账那四行一行都不会执行。这意味着整个账本的口径其实是「<strong>成功的模型请求</strong>」，而不是「发生过的模型请求」。

在单人、网络稳定的场景下这个差别很小。但在真实使用里，失败并不罕见：超时、429、5xx、流中断、JSON 形状不对。这些失败大多数不产生计费（429 通常在服务端就被挡住），所以「不计入」在钱上未必错；但它在<strong>可靠性观测</strong>上是错的——你看不出「这次任务重试了 7 次才成功」，也看不出「这个端点的失败率是 30%」。

一个健康的账本应该把「失败的请求」和「失败的轮次」分开记：请求失败但轮次最终成功，是一次重试；轮次最终失败，是一次丢单。两者都要有行，只是 <code>outcome</code> 字段不同。
<h2>重试与 fallback：一次成功掩盖 N 次请求</h2>

重试逻辑不在 <code>agent.rs</code>，而在 <code>llm::chat</code> 里：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">attempt</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="k">loop</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">chat_with_model</span><span class="p">(</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="n">build_body</span><span class="p">(</span><span class="o">&amp;</span><span class="n">cfg</span><span class="p">.</span><span class="n">model</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">on_text</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="k">return</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">),</span>
<span class="w">        </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">is_retryable_error</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="n">attempt</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">max_retries</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="n">attempt</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">                </span><span class="kd">let</span><span class="w"> </span><span class="n">delay</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">backoff_ms</span><span class="p">(</span><span class="n">cfg</span><span class="p">.</span><span class="n">retry_base_ms</span><span class="p">,</span><span class="w"> </span><span class="n">attempt</span><span class="p">);</span>
<span class="w">                </span><span class="fm">eprintln!</span><span class="p">(</span>
<span class="w">                    </span><span class="s">&quot;note: request failed ({e}); retrying in {delay}ms (attempt {attempt}/{})&quot;</span><span class="p">,</span>
<span class="w">                    </span><span class="n">cfg</span><span class="p">.</span><span class="n">max_retries</span>
<span class="w">                </span><span class="p">);</span>
<span class="w">                </span><span class="n">std</span><span class="p">::</span><span class="n">thread</span><span class="p">::</span><span class="n">sleep</span><span class="p">(</span><span class="n">Duration</span><span class="p">::</span><span class="n">from_millis</span><span class="p">(</span><span class="n">delay</span><span class="p">));</span>
<span class="w">                </span><span class="k">continue</span><span class="p">;</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">fallback</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="n">cfg</span><span class="p">.</span><span class="n">fallback_model</span><span class="w"> </span><span class="p">{</span>
<span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="n">is_retryable_error</span><span class="p">(</span><span class="o">&amp;</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">                    </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;note: primary model failed ({e}); retrying with fallback model `{fallback}`&quot;</span><span class="p">);</span>
<span class="w">                    </span><span class="k">return</span><span class="w"> </span><span class="n">chat_with_model</span><span class="p">(</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="n">build_body</span><span class="p">(</span><span class="n">fallback</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="n">on_text</span><span class="p">);</span>
<span class="w">                </span><span class="p">}</span>
<span class="w">            </span><span class="p">}</span>
<span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">);</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>chat</code> 返回的是<strong>最后一次成功</strong>的 <code>AssistantTurn</code>，里面只有最后一次请求的用量。前面 <code>max_retries</code> 次失败请求的耗时、以及 fallback 模型这次请求，全都没有出现在返回值里。

于是主循环看到的永远是「1 次请求」，账本永远不知道中间发生过三次 503 和一次降级。重试次数唯一的痕迹是那行 <code>eprintln!</code>——在终端里滚过去就没了，在 daemon 里直接写进服务端日志，客户端一个字都收不到。

更麻烦的是 fallback：<strong>账本上没有模型维度</strong>。一次请求用的是 <code>gpt-4o</code> 还是降级后的 <code>gpt-4o-mini</code>，价格可能差十倍，但 <code>UsageTotals</code> 只有 token 数。要想算钱，账本的行里必须带 <code>model</code> 字段；否则再准的 token 也换不出成本。
<h2>账本上没有「模型」这个维度</h2>

把上一条摊开说。<code>Config</code> 里 <code>--model</code> 可以在 REPL 里用 <code>/model</code> 随时切：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">set_model</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">model</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">model</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">model</span><span class="p">.</span><span class="n">to_string</span><span class="p">();</span>
<span class="p">}</span>
</code></pre></div>


子代理还可以用自己的 <code>def.model</code> 覆盖：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">sub_cfg</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">m</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="n">def</span><span class="p">.</span><span class="n">model</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">sub_cfg</span><span class="p">.</span><span class="n">model</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="p">}</span>
</code></pre></div>


同一个 <code>UsageTotals</code> 里，可能混着两三个不同模型的 token，而账本上只有一个总数。这就像把人民币、美元、欧元加在一起报一个「总金额」——数字是对的，含义是错的。

修法不复杂：<code>UsageTotals</code> 不该是三个标量，而该是 <code>HashMap&lt;ModelId, Usage&gt;</code>，或者退一步，每次请求记一行带 <code>model</code> 的 span，汇总时再按模型分组。前者的查询快、后者的审计强，选哪个取决于你要的是仪表盘还是账本。对一个要回答「这个月花了多少」的系统，后者更合适——因为价格表会变，历史行必须带当时的模型名。
<h2>三处内部调用完全不进账</h2>

除了主循环，agent 里还有三处会调用模型，三处都不经过 <code>complete()</code>：
<div class="table-scroll"><table>
<thead>
<tr>
<th>调用点</th>
<th>入口函数</th>
<th>触发时机</th>
<th>账本</th>
</tr>
</thead>
<tbody>
<tr>
<td>上下文压缩</td>
<td><code>summarize_messages</code> → <code>llm::summarize</code></td>
<td>超过 12 万字符</td>
<td>无</td>
</tr>
<tr>
<td>记忆提炼</td>
<td><code>distill_memories</code> → <code>memory::distill</code></td>
<td>每轮收尾且通过门槛</td>
<td>无</td>
</tr>
<tr>
<td>子代理</td>
<td><code>run_subagent_inner</code> → <code>llm::chat</code></td>
<td>模型调用 <code>subagent</code> 工具</td>
<td>无</td>
</tr>
</tbody>
</table></div>

它们的共同点是都直接调 <code>crate::llm::chat</code>，拿到的 <code>AssistantTurn</code> 只取 <code>.content</code>，<code>usage</code> 被就地丢弃：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">summarize</span><span class="p">(</span><span class="n">cfg</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Config</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">summarizer_cfg</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">    </span><span class="n">summarizer_cfg</span><span class="p">.</span><span class="n">stream</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="n">summarizer_cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">Value</span><span class="p">::</span><span class="n">Array</span><span class="p">(</span><span class="fm">vec!</span><span class="p">[]),</span><span class="w"> </span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{})</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">to_string</span><span class="p">())</span>
<span class="p">}</span>
</code></pre></div>


这不是「忘了记账」，而是结构上没有地方记：这三个函数都不持有 <code>&amp;mut Agent</code>，<code>UsageTotals</code> 又是值类型。要让它们记账，只能把账本提升成一个独立对象，作为参数传进去，或者塞进 <code>Config</code>（不推荐，配置是只读契约，不该承担可变状态）。
<h2>压缩的账：摘要是一次完整的模型请求</h2>

<code>compact_with</code> 的流程值得单独算一笔账：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">dropped</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">drain</span><span class="p">(</span><span class="mi">1</span><span class="o">..</span><span class="n">start</span><span class="p">).</span><span class="n">collect</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">note</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">summarize_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dropped</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="n">summary</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[Earlier conversation summary]</span><span class="se">\n</span><span class="s">{summary}&quot;</span><span class="p">),</span>
<span class="w">    </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="s">&quot;[Earlier conversation was omitted to keep the context small]&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="p">};</span>
</code></pre></div>


把被丢弃的消息原样拼成一个摘录（这里没有逐条截断，只有整个摘要请求的输入），发给模型要一段不超过 300 词的总结。这次请求的 prompt 可能有好几万 token——因为它塞的就是半个上下文。

对一个 40 轮的长任务，压缩可能触发好几次。每次都是一次实打实的大请求，但账本上只多了一行 <code>context compacted: N older message(s) replaced by a summary</code> 的 note，没有一个 token。

更微妙的是一笔「看不见的收益」：压缩之后，后续每次请求的 <code>prompt_tokens</code> 都会下降。也就是压缩是「一次性花钱、长期省钱」的操作。没有账本，你无法判断这笔投资划不划算——比如压缩花了 3 万 token，省下的后续请求一共省了 2 万，那就是亏的。这个判断完全依赖账本，而现在的账本恰好缺这一块。
<h2>记忆提炼的账：每轮收尾的一次隐藏调用</h2>

<code>distill_memories</code> 的门槛是 <code>worth_distilling</code>：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">worth_distilling</span><span class="p">(</span><span class="n">user_text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">,</span><span class="w"> </span><span class="n">had_tools</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">bool</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">had_tools</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="kc">true</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="n">text</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;=</span><span class="w"> </span><span class="mi">24</span>
<span class="p">}</span>
</code></pre></div>


只要这一轮调用过工具，就一定会提炼。提炼的输入是 <code>excerpt_from(&amp;self.messages, 6000)</code>——最近 6000 字符的对话；输出是一个 JSON 数组。这次调用同样没有记账，而且它的触发条件是「有过工具调用」，也就是<strong>在大多数真实任务里都会发生</strong>。

所以一个典型的 coding 任务，每轮的模型请求数实际是：
<div class="table-scroll"><table>
<thead>
<tr>
<th>来源</th>
<th>每轮次数</th>
<th>是否计入 <code>requests</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>主循环（模型 + 工具往返）</td>
<td>1 到 40</td>
<td>是</td>
</tr>
<tr>
<td>记忆提炼</td>
<td>1（有工具调用时）</td>
<td>否</td>
</tr>
<tr>
<td>上下文压缩</td>
<td>0 到若干</td>
<td>否</td>
</tr>
<tr>
<td>子代理</td>
<td>0 到 4，每个 1 到 40</td>
<td>否</td>
</tr>
</tbody>
</table></div>

<code>/cost</code> 里显示的 <code>requests</code>，可能只有真实请求数的一半。这个偏差不是小数点级别的，是数量级级别的。
<h2>子代理的账为什么结构上记不上</h2>

这是 08 最难的一块，也是 07 结尾留下的引子。

一次委派在 <code>run_subagent_inner</code> 里是这样跑的：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="k">for</span><span class="w"> </span><span class="n">_</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="mi">0</span><span class="o">..</span><span class="n">sub_cfg</span><span class="p">.</span><span class="n">max_iterations</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">llm</span><span class="p">::</span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="n">sub_cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">tools</span><span class="p">,</span><span class="w"> </span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{})</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">    </span><span class="n">messages</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">assistant_message</span><span class="p">(</span><span class="o">&amp;</span><span class="n">turn</span><span class="p">));</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">tool_calls</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">break</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="p">}</span>
<span class="nb">Ok</span><span class="p">(</span><span class="n">result</span><span class="p">)</span>
</code></pre></div>


注意三件事：

<strong>第一，子代理最多跑 <code>sub_cfg.max_iterations</code> 轮</strong>，而 <code>sub_cfg</code> 是从父配置克隆的——默认 40。07 已经指出这是个危险的默认值；从账本角度看，它意味着一次 <code>subagent</code> 工具调用背后最多藏着 40 次模型请求，全部不可见。

<strong>第二，<code>turn.usage</code> 被就地丢弃</strong>，和压缩、提炼一模一样。

<strong>第三，也是结构性的：整条路径没有返回值能带回用量。</strong> <code>run_subagent</code> 的返回类型是 <code>Result&lt;String, String&gt;</code>，用量的唯一出口是 <code>Ok(text)</code> 里那段文本。想记账只能在文本里塞一行「used N tokens」——那是把账本降级成注释。

正确的形状应该让委派返回一个结构：
<div class="codehilite"><pre><span></span><code><span class="k">struct</span><span class="w"> </span><span class="nc">Delegation</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="n">usage</span><span class="p">:</span><span class="w"> </span><span class="nc">Usage</span><span class="p">,</span>
<span class="w">    </span><span class="n">requests</span><span class="p">:</span><span class="w"> </span><span class="kt">u32</span><span class="p">,</span>
<span class="w">    </span><span class="n">elapsed</span><span class="p">:</span><span class="w"> </span><span class="nc">Duration</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


然后由父代理在收口处把它记成一行 <code>who = agent-7</code> 的子账，再决定怎么汇总。这样 <code>agent_list</code> 才能回答「哪个子代理最贵」，而不只是「哪个子代理最慢」。
<h2>任务板只有时间没有钱</h2>

<code>Job</code> 的字段是：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">Job</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">id</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">name</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">task</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">status</span><span class="p">:</span><span class="w"> </span><span class="nc">JobStatus</span><span class="p">,</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">result</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// Wall-clock time the job took, once it has finished.</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">duration</span><span class="p">:</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;</span><span class="n">Duration</span><span class="o">&gt;</span><span class="p">,</span>
<span class="w">    </span><span class="n">started</span><span class="p">:</span><span class="w"> </span><span class="nc">Instant</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


七个字段里，只有 <code>duration</code> 是「量」，<code>result</code> 是截到 500 字符的预览，其余都是标识与状态。没有 <code>usage</code>，没有 <code>requests</code>，也没有 <code>model</code>。

<code>render_agent_board</code> 的输出也因此只能是：
<div class="codehilite"><pre><span></span><code>Sub-agent jobs:
- agent-1 [done] reviewer (12.3s) — review auth.rs
  result: looks fine
- agent-2 [running] explorer (…) — map the repo
</code></pre></div>


这份输出对「谁在干什么」够用，对「这次任务的钱花在哪」完全不够。07 说过任务板是「一个只追加的观测结构」；从账本的角度看，它更像一个<strong>只记了时长的事件表</strong>——事件表能还原顺序，但不能求和。
<h2><code>duration</code> 测的是排队加执行</h2>

<code>Board::start</code> 里设置了 <code>started</code>：
<div class="codehilite"><pre><span></span><code><span class="bp">self</span><span class="p">.</span><span class="n">jobs</span><span class="p">.</span><span class="n">lock</span><span class="p">().</span><span class="n">unwrap</span><span class="p">().</span><span class="n">push</span><span class="p">(</span><span class="n">Job</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">id</span><span class="p">:</span><span class="w"> </span><span class="nc">id</span><span class="p">.</span><span class="n">clone</span><span class="p">(),</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="n">duration</span><span class="p">:</span><span class="w"> </span><span class="nb">None</span><span class="p">,</span>
<span class="w">    </span><span class="n">started</span><span class="p">:</span><span class="w"> </span><span class="nc">Instant</span><span class="p">::</span><span class="n">now</span><span class="p">(),</span>
<span class="p">});</span>
</code></pre></div>


而 <code>run_subagent</code> 的调用顺序是：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">id</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">board</span><span class="p">.</span><span class="n">start</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">);</span>
<span class="kd">let</span><span class="w"> </span><span class="n">_permit</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">ctx</span><span class="p">.</span><span class="n">gate</span><span class="p">.</span><span class="n">acquire</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_subagent_inner</span><span class="p">(</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="n">task</span><span class="p">);</span>
</code></pre></div>


登记的时机在 <code>acquire</code> 之前。所以 <code>finish</code> 里算出来的 <code>duration</code> 是 <code>job.started.elapsed()</code>——<strong>包含排队时间</strong>。

这件事在 07 里是用「排队也显示 running」来讲的；在 08 里它变成一条账本口径问题：如果一次委派排队等了 20 秒、真正执行了 3 秒，账上写的是 23 秒。这个数字用来判断「子代理慢不慢」是错的，因为它把限流门的等待算进了子代理的工作时间。

修复的方式在 07 的加固清单里已经写过：<code>JobStatus</code> 加 <code>Queued</code>，<code>duration</code> 拆成 <code>queued</code> 与 <code>ran</code> 两段。对账本来说，这不仅是显示问题——<strong>排队时间是「被配额拖住」的证据</strong>。如果你发现某天平均排队 15 秒，那说明 4 个槽位不够，而不是模型变慢了。这两者要分开记，才能分别对症。
<h2>工具调用在账本上是空的</h2>

<code>execute</code> 从头到尾没有一个 <code>Instant</code>：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">execute</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">call</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">llm</span><span class="p">::</span><span class="n">ToolCall</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">reason</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">.</span><span class="n">check_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;ERROR: {reason}&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">run_tool</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">args</span><span class="p">);</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="n">result</span>
<span class="p">}</span>
</code></pre></div>


结果回到主循环之后，只做了一件事：
<div class="codehilite"><pre><span></span><code><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">tool_call</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">summarize</span><span class="p">(</span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">name</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">call</span><span class="p">.</span><span class="n">arguments</span><span class="p">),</span><span class="w"> </span><span class="o">&amp;</span><span class="n">result</span><span class="p">);</span>
</code></pre></div>


也就是说，一次工具调用在账本上留下的信息是「名字 + 参数摘要 + 结果文本」，没有开始时刻、没有耗时、没有输出字节数。而工具恰恰是 agent 里最不可控的一段：<code>run_command</code> 可能跑满 120 秒超时，<code>web_fetch</code> 可能卡在网络，<code>grep</code> 可能在几十万个文件里扫。

链路上其实有 <code>Instant</code>，但都只为超时服务：<code>shell::run_command</code> 的 <code>start</code> 用来判断是否超过 <code>timeout_secs</code>，<code>hooks::run</code> 的 <code>start</code> 用来判断是否超过 <code>HOOK_TIMEOUT_SECS</code>。超时判断是「到点就杀」，它不需要、也不保留「实际用了多久」。

一个能对账的工具记录应该长这样：
<div class="table-scroll"><table>
<thead>
<tr>
<th>字段</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td>name</td>
<td>哪个工具</td>
</tr>
<tr>
<td>start_ms / end_ms</td>
<td>什么时候、多久</td>
</tr>
<tr>
<td>args_bytes</td>
<td>参数多大</td>
</tr>
<tr>
<td>result_bytes / truncated</td>
<td>结果多大、有没有被 <code>clamp</code> 截断</td>
</tr>
<tr>
<td>exit_code</td>
<td>命令类工具的成功失败</td>
</tr>
<tr>
<td>tool_call_id</td>
<td>与消息历史里的调用配对</td>
</tr>
</tbody>
</table></div>

其中 <code>truncated</code> 特别值得记：<code>clamp</code> 把超长输出截到 20000 字符，这是 04 讲过的预算设计。但从账本看，「这次工具输出被截了多少」是判断「工具设计是否合理」的关键指标——如果一个工具的输出连续十次被截断，说明它的输出粒度太粗，该改工具而不是改预算。
<h2>终端与 GUI 两套消费者，一个语义漂移</h2>

<code>UiEvent::Usage</code> 的注释是这样写的：
<div class="codehilite"><pre><span></span><code><span class="sd">/// Cumulative token usage after a model request, so a GUI can show what the</span>
<span class="sd">/// task has cost so far. `requests` counts the model calls this update added</span>
<span class="sd">/// (normally 1), so a client showing a per-task total simply sums the values</span>
<span class="sd">/// it receives — which also works when the numbers come from a shared daemon.</span>
<span class="n">Usage</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">requests</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="n">prompt_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="w">    </span><span class="n">completion_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span>
<span class="p">},</span>
</code></pre></div>


第一行说「Cumulative（累计）」，最后一行说「客户端把这些值加起来」，也就是「增量」。同一段注释里出现了两个相反的口径。实际发送方是主循环：
<div class="codehilite"><pre><span></span><code><span class="bp">self</span><span class="p">.</span><span class="n">style</span><span class="p">.</span><span class="n">usage</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">,</span><span class="w"> </span><span class="n">turn</span><span class="p">.</span><span class="n">usage</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">);</span>
</code></pre></div>


第一个参数硬编码为 <code>1</code>，所以<strong>实现是增量</strong>，注释的头一行是错的。

这种漂移在只有一两个消费者时不会出事，但它是「糊涂账」的种子：下一个接这个事件的人如果按「累计」理解，就会把最后一次的值当成总数，得到一个偏小的结果，而且看不出错在哪。

顺带一提终端的行为：<code>Style::usage</code> 在终端模式下什么都不打印——
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">usage</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">requests</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span><span class="w"> </span><span class="n">prompt_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">,</span><span class="w"> </span><span class="n">completion_tokens</span><span class="p">:</span><span class="w"> </span><span class="kt">u64</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">emit</span><span class="p">(</span><span class="n">UiEvent</span><span class="p">::</span><span class="n">Usage</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="o">..</span><span class="p">.</span><span class="w"> </span><span class="p">});</span>
<span class="p">}</span>
</code></pre></div>


<code>emit</code> 在没有 sink 时返回 <code>false</code>，函数就结束了。注释里说「终端已经有 <code>/cost</code>」，这个理由成立，但它意味着<strong>终端的实时观测能力为零</strong>：你只能在轮次结束后敲一次 <code>/cost</code>，中间发生了什么完全看不见。一个跑 20 分钟的轮次，中途没有任何用量反馈。
<h2>daemon 的差分记账：<code>saturating_sub</code></h2>

daemon 用一个 Agent 服务多个会话。因为 <code>usage</code> 是进程级累加，单个请求的用量只能靠前后差分：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">before</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">usage</span><span class="p">();</span>
<span class="kd">let</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">run</span><span class="p">(</span><span class="n">user_content</span><span class="p">(</span><span class="o">&amp;</span><span class="n">prompt</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">images</span><span class="p">));</span>
<span class="kd">let</span><span class="w"> </span><span class="n">after</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">usage</span><span class="p">();</span>

<span class="kd">let</span><span class="w"> </span><span class="n">resp</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">result</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">response</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;response&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">response</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;session&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">session_id</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="s">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">after</span><span class="p">.</span><span class="n">requests</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">before</span><span class="p">.</span><span class="n">requests</span><span class="p">),</span>
<span class="w">            </span><span class="s">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">after</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">before</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">),</span>
<span class="w">            </span><span class="s">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">after</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">.</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">before</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">),</span>
<span class="w">            </span><span class="s">&quot;total_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">after</span><span class="p">.</span><span class="n">total_tokens</span><span class="p">().</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">before</span><span class="p">.</span><span class="n">total_tokens</span><span class="p">()),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}),</span>
<span class="w">    </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;error&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">e</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;session&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">session_id</span><span class="w"> </span><span class="p">}),</span>
<span class="p">}</span>
</code></pre></div>


<code>saturating_sub</code> 是个体贴的细节：万一计数回绕或被人为清零，订单不会变成天文数字。差分法本身在串行服务下也是对的——daemon 一次只处理一个请求，两个快照之间不会有别的写入。

但它有一个前提：<strong>这两个快照之间发生的所有增长都属于这一次请求</strong>。这个前提在 <code>compact</code>、<code>distill</code>、<code>subagent</code> 也记账之后会立刻失效（因为它们也在这段时间里，但那确实属于这个请求，所以还算对）；真正失效的场景是并发——只要哪天 daemon 改成多线程处理，差分就把别人的账算到你头上。

差分法真正的问题在下一节。
<h2>失败轮次的 token 去了哪里</h2>

看 <code>Err</code> 分支：只返回 <code>{"error", "session"}</code>，<strong>没有 <code>usage</code> 字段</strong>。

而失败之前，<code>agent.usage</code> 已经涨过了——凡是成功返回的模型请求都已经累加进去了（失败的那一次因为 <code>?</code> 没记）。于是这一段增长：
<ul>
<li>不在本请求的响应里（因为响应没带 usage）</li>
<li>也不在下一个请求的响应里（因为下一个请求的 <code>before</code> 是在这段增长之后取的）</li>
<li>只在进程总量里，而进程总量没有任何接口能按会话查</li>
</ul>

结果就是：<strong>失败轮次烧掉的 token 变成了一笔无主账</strong>。它存在于内存里的某个计数器上，但没有任何一条响应、任何一个文件、任何一次 <code>/cost</code> 能把它归到某个会话。

修法有两种，各有取舍：
<div class="table-scroll"><table>
<thead>
<tr>
<th>做法</th>
<th>优点</th>
<th>缺点</th>
</tr>
</thead>
<tbody>
<tr>
<td>失败响应也带 <code>usage</code></td>
<td>改动最小，账不丢</td>
<td>客户端要处理「有 usage 也有 error」的组合</td>
</tr>
<tr>
<td>账本按 turn 行记账</td>
<td>任何结果都有行，可审计</td>
<td>需要引入账本对象，改动面大</td>
</tr>
</tbody>
</table></div>

第一种是「补丁」，第二种是「重建」。如果你只想知道钱去哪了，第一种够用；如果你想回答「这个会话一共失败了几次、失败花了多少钱」，只有第二种能给你。
<h2>流式 daemon 只有增量，没有总计</h2>

<code>stream_turn</code> 走的是另一条路。它装上 sink，让 <code>UiEvent::Usage</code> 直接写成 NDJSON 行：
<div class="codehilite"><pre><span></span><code><span class="n">UiEvent</span><span class="p">::</span><span class="n">Usage</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="n">requests</span><span class="p">,</span><span class="w"> </span><span class="n">prompt_tokens</span><span class="p">,</span><span class="w"> </span><span class="n">completion_tokens</span><span class="w"> </span><span class="p">}</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">    </span><span class="s">&quot;type&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;usage&quot;</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">requests</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">prompt_tokens</span><span class="p">,</span>
<span class="w">    </span><span class="s">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">completion_tokens</span><span class="p">,</span>
<span class="p">}),</span>
</code></pre></div>


然后收尾时写一行 <code>done</code>：
<div class="codehilite"><pre><span></span><code><span class="nb">Ok</span><span class="p">(</span><span class="n">response</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">write_event</span><span class="p">(</span>
<span class="w">    </span><span class="o">&amp;</span><span class="n">out</span><span class="p">,</span>
<span class="w">    </span><span class="o">&amp;</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;type&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;done&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;response&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">response</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;session&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">session_id</span><span class="w"> </span><span class="p">}),</span>
<span class="p">),</span>
</code></pre></div>


<code>done</code> 行里<strong>没有累计用量</strong>。客户端要自己把前面收到的所有 <code>usage</code> 行加起来——这恰好是 <code>UiEvent</code> 注释里承诺的用法，所以不算错，但它把「求和」这件事推给了每一个客户端。三个客户端就得写三遍求和，其中两个可能写错。

更麻烦的是错误路径：
<div class="codehilite"><pre><span></span><code><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">write_event</span><span class="p">(</span><span class="o">&amp;</span><span class="n">out</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;type&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;error&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;error&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">e</span><span class="w"> </span><span class="p">})),</span>
</code></pre></div>


一个跑到第 5 轮才失败的流式任务，客户端拿到了 5 行 usage、1 行 error，没有总计。如果客户端是「收到 done 才记账」的实现，这 5 行的花费就丢了；如果它边收边记，那它记的是「部分用量」，而它无从知道这是部分。

一个更稳的协议是让 <code>done</code> 和 <code>error</code> 都带 <code>total_usage</code>——这样客户端只需要在两种终结行上读同一个字段，中间行纯属进度展示。<strong>终结行是对账的唯一锚点</strong>，这句话值得写进任何 agent 的协议设计里。
<h2>会话文件里没有账：重启即清零</h2>

<code>persist()</code> 的内容是：
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">persist</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">path</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">session</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Err</span><span class="p">(</span><span class="n">e</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">save_session_file</span><span class="p">(</span><span class="n">path</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="fm">eprintln!</span><span class="p">(</span><span class="s">&quot;warning: could not save session {}: {e}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">path</span><span class="p">.</span><span class="n">display</span><span class="p">());</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


<code>save_session_file</code> 写的就是 <code>messages</code> 的 pretty JSON。没有 header，没有 meta，没有用量。

而 <code>Agent::with_mcp</code> 构造时：
<div class="codehilite"><pre><span></span><code><span class="n">Agent</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="o">..</span><span class="p">.</span>
<span class="w">    </span><span class="n">usage</span><span class="p">:</span><span class="w"> </span><span class="nc">UsageTotals</span><span class="p">::</span><span class="n">default</span><span class="p">(),</span>
<span class="p">}</span>
</code></pre></div>


即使 <code>--session</code> 加载了昨天的对话，<code>usage</code> 也是从零开始。于是 <code>agent -c</code> 之后敲 <code>/cost</code>，看到的是「本次进程的用量」，而不是「这个会话的用量」。任务连续跑了三天、每天重启一次，账本每天清零三次。

这个坑在单人使用时不容易被发现，因为你会默认「今天这次任务」就是「这个进程」。但只要有 <code>-c</code>、有 daemon 的多会话、有 GUI 的「继续上次任务」，这个假设就破了。

修法很直接：会话文件从「messages 数组」升级成「带 meta 的对象」：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;version&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">2</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;messages&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="w"> </span><span class="err">...</span><span class="w"> </span><span class="p">],</span>
<span class="w">  </span><span class="nt">&quot;usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="nt">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">12</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">34000</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">5100</span><span class="w"> </span><span class="p">},</span>
<span class="w">  </span><span class="nt">&quot;turns&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span><span class="w"> </span><span class="err">...</span><span class="w"> </span><span class="p">]</span>
<span class="p">}</span>
</code></pre></div>


代价是向后兼容：旧文件是裸数组，新代码读到数组要当成「v1，无账」处理。<code>load_session_file</code> 现在只接受数组：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">arr</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">v</span>
<span class="w">    </span><span class="p">.</span><span class="n">as_array</span><span class="p">()</span>
<span class="w">    </span><span class="p">.</span><span class="n">ok_or_else</span><span class="p">(</span><span class="o">||</span><span class="w"> </span><span class="s">&quot;session file does not contain a JSON array&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">())</span><span class="o">?</span><span class="p">;</span>
</code></pre></div>


改的时候要同时接受对象形态，否则所有老会话都会加载失败——而加载失败会退回默认消息，用户会以为「历史丢了」。
<h2><code>/status</code> 与 <code>/cost</code>：进程级仪表盘</h2>

两个 REPL 命令，一个是身份卡，一个是计数器：
<div class="codehilite"><pre><span></span><code>&gt; /status
  messages: 42
  model:    claude-sonnet-4
  mode:     default
  format:   text
  tools:    24
  workspace: /home/me/project

&gt; /cost
  requests:          18
  prompt tokens:     214,033
  completion tokens: 12,880
  total tokens:      226,913
</code></pre></div>


<code>/status</code> 五行里没有一行是「量」——<code>messages</code> 是结构大小，不是消耗。<code>/cost</code> 四行是纯计数，没有时间、没有按模型拆分、没有按来源拆分（主循环 / 压缩 / 提炼 / 子代理）。

这两个命令合起来，能回答「现在是什么状态」和「这堆数字是多少」，但回答不了「钱花在哪」。仪表盘和账本的区别就在这里：仪表盘告诉你当前值，账本告诉你每一笔的来龙去脉。
<h2>唯一可导出的账：json 与 stream-json</h2>

真正能拿去做二次处理的，只有 <code>--output-format json</code> 的收尾块：
<div class="codehilite"><pre><span></span><code><span class="n">config</span><span class="p">::</span><span class="n">OutputFormat</span><span class="p">::</span><span class="n">Json</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">u</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">agent</span><span class="p">.</span><span class="n">usage</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span>
<span class="w">        </span><span class="s">&quot;response&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">response</span><span class="p">,</span>
<span class="w">        </span><span class="s">&quot;usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="s">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">u</span><span class="p">.</span><span class="n">requests</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">u</span><span class="p">.</span><span class="n">prompt_tokens</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">u</span><span class="p">.</span><span class="n">completion_tokens</span><span class="p">,</span>
<span class="w">            </span><span class="s">&quot;total_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">u</span><span class="p">.</span><span class="n">total_tokens</span><span class="p">(),</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">    </span><span class="p">});</span>
<span class="w">    </span><span class="fm">println!</span><span class="p">(</span><span class="s">&quot;{}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">serde_json</span><span class="p">::</span><span class="n">to_string_pretty</span><span class="p">(</span><span class="o">&amp;</span><span class="n">out</span><span class="p">).</span><span class="n">unwrap_or_default</span><span class="p">());</span>
<span class="p">}</span>
</code></pre></div>


这是整个项目里唯一一份「结构化、可管道、可入库」的账。它有三个局限：
<ul>
<li>只有一次 one-shot 的账，没有按轮拆分</li>
<li>只有三个原始计数，没有来源、模型、时间</li>
<li>只在 <code>Json</code> / <code>StreamJson</code> 两种格式下存在，默认的 <code>Text</code> 什么都没有</li>
</ul>

但它的方向是对的：<strong>把账做成数据，而不是做成打印</strong>。想再往前一步，不需要加字段，只需要把 <code>usage</code> 从三个标量改成一组行：
<div class="codehilite"><pre><span></span><code><span class="p">{</span>
<span class="w">  </span><span class="nt">&quot;response&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;...&quot;</span><span class="p">,</span>
<span class="w">  </span><span class="nt">&quot;turns&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">[</span>
<span class="w">    </span><span class="p">{</span><span class="w"> </span><span class="nt">&quot;turn&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;who&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;main&quot;</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;model&quot;</span><span class="p">:</span><span class="w"> </span><span class="s2">&quot;claude-sonnet-4&quot;</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">3</span><span class="p">,</span>
<span class="w">      </span><span class="nt">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">18200</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">940</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;ms&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">4210</span><span class="w"> </span><span class="p">}</span>
<span class="w">  </span><span class="p">],</span>
<span class="w">  </span><span class="nt">&quot;usage&quot;</span><span class="p">:</span><span class="w"> </span><span class="p">{</span><span class="w"> </span><span class="nt">&quot;requests&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">3</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;prompt_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">18200</span><span class="p">,</span><span class="w"> </span><span class="nt">&quot;completion_tokens&quot;</span><span class="p">:</span><span class="w"> </span><span class="mi">940</span><span class="w"> </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


外层 <code>usage</code> 保留，是为了不让现有消费者（脚本、<code>jq</code> 管道）断掉；<code>turns</code> 是新账，供需要审计的人用。这种「加字段不改语义」的演进方式，比推倒重来安全得多。
<h2>观测的现状是 <code>eprintln!</code></h2>

<code>agent/src</code> 里一共三十多处 <code>eprintln!</code>，光 <code>main.rs</code> 就有 28 处。它们大致分成四类：
<div class="table-scroll"><table>
<thead>
<tr>
<th>类别</th>
<th>例子</th>
<th>有没有结构</th>
</tr>
</thead>
<tbody>
<tr>
<td>启动配置</td>
<td><code>sub-agents: loaded 3 from ...</code>、<code>MCP: loaded 12 tool(s)</code></td>
<td>无</td>
</tr>
<tr>
<td>请求重试</td>
<td><code>note: request failed (...); retrying in 500ms (attempt 1/2)</code></td>
<td>半结构化（人可读）</td>
</tr>
<tr>
<td>会话读写</td>
<td><code>warning: could not save session ...</code></td>
<td>无</td>
</tr>
<tr>
<td>daemon 错误</td>
<td><code>daemon request error from 1.2.3.4: ...</code></td>
<td>无</td>
</tr>
</tbody>
</table></div>

它们都写 stderr，没有级别、没有时间戳、没有 trace id、没有 JSON 形态。这意味着：
<ul>
<li>想做「最近一小时的失败率」，只能全文 grep</li>
<li>想关联「这个错误属于哪个请求」，只能靠时间先后猜</li>
<li>想在 GUI 里展示「服务端刚重试了一次」，做不到——<code>eprintln!</code> 不会进 sink</li>
</ul>

最后一条最可惜：<code>Style</code> 已经有一套完整的 <code>UiEvent</code> 通道了，<code>warn</code> / <code>note</code> 都能投递到 GUI，但 <code>llm::chat</code> 不持有 <code>Style</code>，重试只能打印。于是「终端能看到重试、GUI 看不到」——同一次请求，两套客户端看到的信息量不同。
<h2>一次委派在日志里串不起来</h2>

假设你看到日志里有三行：
<div class="codehilite"><pre><span></span><code>sub-agents: loaded 2 from subagents.json
note: request failed (HTTP 503 from API: ...); retrying in 1000ms (attempt 1/2)
sub-agent `reviewer` finished in 41.2s
</code></pre></div>


你能确定这三行属于同一次委派吗？不能。第二行可能来自主代理，也可能来自另一个子代理；第一行是启动期，第三行甚至不存在——因为子代理完成时根本不打印。

能串起一条链路的东西应该是一个 id，从发起到结束一路传下去：
<div class="table-scroll"><table>
<thead>
<tr>
<th>层</th>
<th>现在有什么</th>
<th>缺什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>会话</td>
<td><code>session_id</code>（仅 daemon）</td>
<td>—</td>
</tr>
<tr>
<td>轮次</td>
<td>无</td>
<td><code>turn_id</code></td>
</tr>
<tr>
<td>委派</td>
<td><code>agent-7</code>（仅在任务板内）</td>
<td>进日志</td>
</tr>
<tr>
<td>请求</td>
<td>无</td>
<td><code>request_id</code></td>
</tr>
<tr>
<td>工具</td>
<td><code>tool_call_id</code>（仅消息历史）</td>
<td>进日志</td>
</tr>
</tbody>
</table></div>

有意思的是，<code>tool_call_id</code> 是有的——<code>assistant_message</code> 把它写进了消息，<code>execute</code> 拿到的 <code>ToolCall</code> 也带着它。但它从来没有出现在任何一行日志里。数据不缺，缺的是把它带出去的那一步。

对钩子来说这条链更值得补。钩子能拿到 <code>NANOHERMES_TOOL_NAME</code> 和 <code>NANOHERMES_HOOK_EVENT</code>：
<div class="codehilite"><pre><span></span><code><span class="p">.</span><span class="n">env</span><span class="p">(</span><span class="s">&quot;NANOHERMES_TOOL_NAME&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">tool</span><span class="p">)</span>
<span class="p">.</span><span class="n">env</span><span class="p">(</span><span class="s">&quot;NANOHERMES_HOOK_EVENT&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">event</span><span class="p">)</span>
</code></pre></div>


07 已经指出缺 <code>NANOHERMES_AGENT</code>，所以钩子分不出父子。同一个问题在观测上的版本是：钩子分不出「这是本轮第几次调用同一个工具」，于是它没法做「同一个文件被改第三次就告警」这类策略。
<h2>钩子是观测点，但钩子自己不被观测</h2>

钩子的返回值只有两个字段：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">struct</span><span class="w"> </span><span class="nc">HookOutcome</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="sd">/// Process exit code (`-1` if killed by a signal, `-2` if we timed it out).</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">code</span><span class="p">:</span><span class="w"> </span><span class="kt">i32</span><span class="p">,</span>
<span class="w">    </span><span class="sd">/// Combined stdout + stderr, trimmed.</span>
<span class="w">    </span><span class="k">pub</span><span class="w"> </span><span class="n">output</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span>
<span class="p">}</span>
</code></pre></div>


调用方拿它做两件事：<code>ok()</code> 判断是否放行，失败时把 output 拼进 tool result 字符串。然后——就没有然后了。

这意味着：
<ul>
<li>一个钩子每天跑 500 次、其中 200 次超时，账本上看不出来</li>
<li>一次 30 秒超时的钩子会让一整轮变慢 30 秒，但耗时不属于任何统计</li>
<li>钩子阻断了一整次工具调用（<code>PreToolUse</code> 返回非 0 时 <code>execute</code> 直接返回 ERROR），这次「被拦下」的调用不计入任何指标</li>
</ul>

<code>HOOK_TIMEOUT_SECS</code> 是 30 秒，这个值本身是个观测信号：它意味着单个钩子最长能把一轮拖慢 30 秒，而 <code>max_iterations</code> 是 40，最坏情况是 40 × 30 秒 = 20 分钟纯粹耗在钩子上。

一个把钩子当观测点的设计，应该把钩子本身也记成 span：<code>event</code>、<code>tool</code>、<code>exit_code</code>、<code>ms</code>、<code>timed_out</code>。这样「钩子是不是拖慢了我的 agent」才是一个能查的问题。

<ul>
<li>结构问题要引入账本对象，改的是数据流</li>
<li>口径问题要写文档和测试，改的是约定</li>

先分类再动手，比一上来就加日志有效得多——因为加日志解决不了后两类。

</tr>

</tr>
</tbody>
</table></div>

NanoHermes 现在的选择是第三条，这是它「低依赖」哲学的一部分。所以本文的重点不是「它应该上一个数据库」，而是「它的内存账本连内存里该有的行都没记全」。
<h2>五个口径必须先定死</h2>

账本做完之后，最容易吵起来的不是实现，是定义。下面五个口径，必须在写第一行代码之前定死，并且写进文档和测试。

<strong>一、<code>requests</code> 算 HTTP 请求还是成功的模型轮次？</strong>
建议：分开两个字段，<code>requests</code> 算所有发出的请求（含失败与重试），<code>successful</code> 算成功的。否则「重试」这个事实没有位置放。

<strong>二、<code>prompt_tokens</code> 含不含缓存命中的部分？</strong>
建议：结构上拆成 <code>prompt_tokens</code> 与 <code>cached_tokens</code> 两个字段，且 <code>cached_tokens</code> 允许为「未知」。含不含取决于服务端口径，本地不要替它猜。

<strong>三、子代理的 token 算不算进主任务的账？</strong>
建议：算，但要能分开看。turn 表里父 turn 的 <code>usage</code> 是自身 + 子 span 之和，同时每个子代理有自己的 span，可以单独出报表。这就是「可加性」：父 = 自身 + 子之和，永远成立。

<strong>四、重试的失败请求算不算 token？</strong>
建议：算，但单独标 <code>unbilled</code>。大多数 429 不计费，但客户端不应该假设这一点——服务端说了算。

<strong>五、时间算不算排队？</strong>
建议：不算。排队时间单独记 <code>queued_ms</code>。这是 07 那条加固建议在观测侧的对应物。

五个问题里，前四个都跟「token」有关，只有最后一个跟「时间」有关。这不是巧合：token 是计费单位，时间是体验单位，两者都要，但不能混在一个字段里。
