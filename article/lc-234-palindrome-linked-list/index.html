    <noscript><div class="ns-article"><h1>【LC 234】回文链表：把后半段翻过来，它应该跟前半段长得一模一样</h1><div class="ns-meta">2026/9/22 · Zhou Jun</div><div class="markdown-body"><blockquote>

<strong>适用读者</strong>：会写反转链表，但看到「O(1) 空间」四个字就忍不住想去开个数组的人
<strong>技术栈</strong>：Python 为主，附 Java 版
<strong>难度</strong>：简单（思路一句话就说完，但有三个细节一写就错）
<strong>收获</strong>：「找中点 + 反转后半段 + 逐对比较」这条套路，以及它为什么<strong>不用</strong>像重排链表那样断开
</blockquote>
<h2>题目</h2>

给你一个单链表的头节点 <code>head</code>，请判断该链表是否为回文链表。
<div class="codehilite"><pre><span></span><code>输入：head = [1,2,2,1]
输出：true

输入：head = [1,2]
输出：false
</code></pre></div>


<strong>进阶</strong>：你能否用 <code>O(n)</code> 时间复杂度和 <code>O(1)</code> 空间复杂度解决此题？
<blockquote>

出处备注：美团测开等面试中出现频率很高的链表热身题，通常要求当场写出进阶解法。
</blockquote>

链表节点的定义（后面所有代码都用它）：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">ListNode</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">val</span><span class="o">=</span><span class="mi">0</span><span class="p">,</span> <span class="nb">next</span><span class="o">=</span><span class="kc">None</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">val</span> <span class="o">=</span> <span class="n">val</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="nb">next</span>
</code></pre></div>

<hr>
<h2>一、先想清楚「回文」在链表上意味着什么</h2>
<h3>1.1 数组上的回文靠下标，链表没有下标</h3>

判断一个数组是不是回文，闭着眼都能写：
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">is_palindrome</span><span class="p">(</span><span class="n">arr</span><span class="p">):</span>
    <span class="n">i</span><span class="p">,</span> <span class="n">j</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nb">len</span><span class="p">(</span><span class="n">arr</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span>
    <span class="k">while</span> <span class="n">i</span> <span class="o">&lt;</span> <span class="n">j</span><span class="p">:</span>
        <span class="k">if</span> <span class="n">arr</span><span class="p">[</span><span class="n">i</span><span class="p">]</span> <span class="o">!=</span> <span class="n">arr</span><span class="p">[</span><span class="n">j</span><span class="p">]:</span>
            <span class="k">return</span> <span class="kc">False</span>
        <span class="n">i</span> <span class="o">+=</span> <span class="mi">1</span>
        <span class="n">j</span> <span class="o">-=</span> <span class="mi">1</span>
    <span class="k">return</span> <span class="kc">True</span>
</code></pre></div>


它成立的前提是 <code>arr[j]</code> 能在 <code>O(1)</code> 时间里拿到。链表没有下标，<code>j</code> 想从尾巴往回走，只能从头再走一遍 —— 那就 <code>O(n²)</code> 了。

所以链表上要玩回文，得先把"从后往前"这个动作，换成链表擅长的事。
<h3>1.2 核心洞察：后半段反转过来，应该跟前半段一模一样</h3>

把 <code>1 → 2 → 2 → 1</code> 从中间切开：
<div class="codehilite"><pre><span></span><code>前半段：  1 → 2
后半段：       2 → 1
</code></pre></div>


后半段<strong>倒过来</strong>读是 <code>1 → 2</code>。跟前半段一模一样 —— 这就是回文。
<div class="codehilite"><pre><span></span><code>前半段：      1 → 2
后半段反转后：1 → 2       ← 逐位相同
   配对：     ↑   ↑
             1=1 2=2
</code></pre></div>


再找个反例 <code>1 → 2 → 3</code>：
<div class="codehilite"><pre><span></span><code>前半段：      1
后半段反转后：3 → 2       ← 第一位就对不上
</code></pre></div>


<strong>所以判断回文 = 判断「前半段」和「后半段反转后」是否逐位相等。</strong> 一句话说完了，剩下的全是搬砖。
<h3>1.3 为什么这套能顺手把空间压到 O(1)</h3>

你可能会先想到：把值读进数组，再用双指针比。能过，但空间 <code>O(n)</code>，不是进阶答案。

而"反转后半段"这件事，<strong>原地改指针就够了</strong> —— 反转链表本来就是 <code>O(1)</code> 空间的。加上找中点用快慢指针也是 <code>O(1)</code>，全程只需要六根指针：<code>slow</code>、<code>fast</code>、<code>prev</code>、<code>curr</code>、<code>p1</code>、<code>p2</code>。

顺带一提：这题改的是链表结构（反转了后半段），题目没禁止。不像 LC 143 明着要求"必须实际改动节点"，234 只关心返回值，结构改了无所谓。
<hr>
<h2>二、拆成三步：每步都是做过的题</h2>
<table>
<thead>
<tr>
<th>步骤</th>
<th>干什么</th>
<th>对应题目</th>
<th>关键技巧</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 找中点</td>
<td>把链表切成前后两段</td>
<td>LC 876 链表的中间结点</td>
<td>快慢指针，<code>fast</code> 一次两格、<code>slow</code> 一次一格</td>
</tr>
<tr>
<td>② 反转后半段</td>
<td>把后半段倒过来</td>
<td><strong>LC 206 反转链表</strong></td>
<td><code>先记住 → 再掉头 → 后前移</code></td>
</tr>
<tr>
<td>③ 逐对比较</td>
<td>前半段 vs 反转后的后半段，逐位比值</td>
<td>数组双指针（的比对动作）</td>
<td>循环条件写 <code>while p2</code></td>
</tr>
</tbody>
</table>

<strong>这题的全部难度，就是看出它其实是三道做过的题拼起来的。</strong>
<h3>2.1 第 ① 步：<code>slow</code> 要停在后半段的开头</h3>
<div class="codehilite"><pre><span></span><code><span class="n">slow</span> <span class="o">=</span> <span class="n">fast</span> <span class="o">=</span> <span class="n">head</span>
<span class="k">while</span> <span class="n">fast</span> <span class="ow">and</span> <span class="n">fast</span><span class="o">.</span><span class="n">next</span><span class="p">:</span>
    <span class="n">slow</span> <span class="o">=</span> <span class="n">slow</span><span class="o">.</span><span class="n">next</span>
    <span class="n">fast</span> <span class="o">=</span> <span class="n">fast</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">next</span>
</code></pre></div>


注意这里 <strong>两个指针都从 <code>head</code> 出发</strong>，跟重排链表那篇不一样。这个细节决定了 <code>slow</code> 停在哪：
<ul>
<li>长度 4：<code>slow</code> 停在<strong>位置 2</strong>（第 3 个节点），前半段 <code>位置0 → 位置1</code>，后半段 <code>位置2 → 位置3</code>；</li>
<li>长度 5：<code>slow</code> 停在<strong>位置 2</strong>（正中间那个），前半段 <code>位置0 → 位置1</code>，后半段 <code>位置2 → 位置3 → 位置4</code>。</li>
</ul>

也就是说：<strong>中间节点归后半段</strong>。

对比一下 LC 143 的写法 <code>slow, fast = head, head.next</code> ——那里 <code>slow</code> 停在<strong>前半段的最后一个</strong>，中间节点归前半段。两道题的取法<strong>是反的</strong>，别串：
<table>
<thead>
<tr>
<th>题</th>
<th>起点</th>
<th><code>slow</code> 停在哪</th>
<th>中间节点归谁</th>
<th>为什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>LC 143 重排</td>
<td><code>slow=head, fast=head.next</code></td>
<td>前半段最后一个</td>
<td><strong>前半段</strong></td>
<td>中间节点要留在原位不动</td>
</tr>
<tr>
<td>LC 234 回文</td>
<td><code>slow=fast=head</code></td>
<td>后半段第一个</td>
<td><strong>后半段</strong></td>
<td>中间节点不参与判定，反转后落到末尾</td>
</tr>
</tbody>
</table>

为什么 234 里中间节点归后半段无所谓？因为它<strong>跟自己比必然相等</strong>，白比一次而已，不影响结论。反而放到后半段更省事：反转之后它自动落到后半段的末尾。
<h3>2.2 第 ② 步：反转后半段 —— 这里不需要断开</h3>
<div class="codehilite"><pre><span></span><code><span class="n">prev</span><span class="p">,</span> <span class="n">curr</span> <span class="o">=</span> <span class="kc">None</span><span class="p">,</span> <span class="n">slow</span>
<span class="k">while</span> <span class="n">curr</span><span class="p">:</span>
    <span class="n">nxt</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span>      <span class="c1"># 先记住</span>
    <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">prev</span>     <span class="c1"># 再掉头</span>
    <span class="n">prev</span> <span class="o">=</span> <span class="n">curr</span>          <span class="c1"># 后前移</span>
    <span class="n">curr</span> <span class="o">=</span> <span class="n">nxt</span>
</code></pre></div>


和 LC 206 逐字一样，只是起点从 <code>head</code> 换成了 <code>slow</code>。反转完，<code>prev</code> 站在新段头（原来的尾节点）上。

<strong>这里是这题最有意思的一处：不用写 <code>slow.next = None</code>。</strong>

在 LC 143 里那一刀是命门 —— 少了它，合并时会把两个指针绕成环。但 234 只是<strong>读值</strong>，不合并，所以：
<ul>
<li>前半段的尾巴（<code>位置1</code>）的 <code>next</code> 依然指着中点 <code>位置2</code>；</li>
<li>反转时，中点 <code>位置2</code> 的 <code>next</code> 被置成了 <code>None</code>（它是反转的第一个节点）；</li>
</ul>

于是前半段从 <code>head</code> 走下去，走到中点就<strong>自然停了</strong>。前半段这条通路恰好是我们要的长度 ——「尾巴还搭着」在这儿不是 bug，是正好借来用的。
<div class="codehilite"><pre><span></span><code>反转后（长度<span class="w"> </span><span class="mi">4</span>）：
前半段链：<span class="w">  </span>位置<span class="mi">0</span><span class="w"> </span>→<span class="w"> </span>位置<span class="mi">1</span><span class="w"> </span>→<span class="w"> </span>位置<span class="mi">2</span><span class="w"> </span>→<span class="w"> </span>∅
<span class="w">                          </span>↑<span class="w"> </span>中点的<span class="w"> </span><span class="k">next</span><span class="w"> </span>被反转置空，走到这就停
后半段链：<span class="w">  </span>位置<span class="mi">3</span><span class="w"> </span>→<span class="w"> </span>位置<span class="mi">2</span><span class="w"> </span>→<span class="w"> </span>∅
</code></pre></div>

<h3>2.3 第 ③ 步：逐对比较，循环条件写 <code>while p2</code></h3>
<div class="codehilite"><pre><span></span><code><span class="n">p1</span><span class="p">,</span> <span class="n">p2</span> <span class="o">=</span> <span class="n">head</span><span class="p">,</span> <span class="n">prev</span>
<span class="k">while</span> <span class="n">p2</span><span class="p">:</span>
    <span class="k">if</span> <span class="n">p1</span><span class="o">.</span><span class="n">val</span> <span class="o">!=</span> <span class="n">p2</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
        <span class="k">return</span> <span class="kc">False</span>
    <span class="n">p1</span><span class="p">,</span> <span class="n">p2</span> <span class="o">=</span> <span class="n">p1</span><span class="o">.</span><span class="n">next</span><span class="p">,</span> <span class="n">p2</span><span class="o">.</span><span class="n">next</span>
<span class="k">return</span> <span class="kc">True</span>
</code></pre></div>


<strong>循环条件必须是 <code>while p2</code>，不能是 <code>while p1</code>。</strong> 因为偶数长度时，前半段那条链比反转后的后半段<strong>多一个节点</strong>（前半段要走到中点才停，后半段到中点就停了）。
<ul>
<li>长度 4：前半段链有 3 个节点，后半段链只有 2 个。用 <code>while p1</code> 的话，<code>p2</code> 先走到 <code>None</code>，下一轮访问 <code>p2.val</code> 直接 <code>NoneType</code> 报错。</li>
</ul>

后半段永远是最短的那条，以它为准就对了。奇数长度时两边一样长，最后一对是中点跟自己比，必然相等。

几个要记牢的：
<ul>
<li><strong>空链表是回文</strong>。正着读反着读都是"什么都没有"。代码里 <code>head is None</code> 直接返回 <code>True</code>。</li>
<li><strong>单节点是回文</strong>。算法上也是对的（中点跟自己比）。</li>
<li><strong>奇数长度多比一次中点自己</strong>。写 <code>while p2</code> 就会遇到这个，结果是"必然相等"，不用特判。</li>
<li><strong>比较对数</strong> = <code>⌈L/2⌉</code>，但<strong>有效判定</strong>只需要 <code>⌊L/2⌋</code> 对（中点那对是白送的）。</li>
</ul>
<hr>
<h2>六、复杂度</h2>
<ul>
<li><strong>时间 <code>O(n)</code></strong>：找中点走 <code>⌊n/2⌋</code> 轮，反转走 <code>⌈n/2⌉</code> 个节点，比较走 <code>⌈n/2⌉</code> 对 —— 加起来不超过 <code>1.5n</code> 次指针访问。每个节点被访问的次数是常数，线性。</li>
<li><strong>空间 <code>O(1)</code></strong>：全程只用 <code>slow</code>、<code>fast</code>、<code>prev</code>、<code>curr</code>、<code>p1</code>、<code>p2</code> 六根指针，没有数组、没有栈、没有递归。</li>
</ul>

对照一下开数组的方案：时间也是 <code>O(n)</code>，但空间 <code>O(n)</code>。这题的<strong>考点恰恰就是把那 <code>O(n)</code> 压成 <code>O(1)</code></strong> —— 进阶要求写在题干里，不是随口一提。
<hr>
<h2>七、常见坑</h2>

<strong>1. 比较循环写成 <code>while p1</code> —— 直接 <code>NoneType</code> 报错。</strong>

偶数长度时前半段链比后半段链多一个节点，<code>p2</code> 先走到 <code>None</code>。必须 <code>while p2</code>（<code>while p1 and p2</code> 也对，但后半段最短，写 <code>p2</code> 最准，也最不容易改错）。

<strong>2. 中点取法跟 LC 143 串了。</strong>

两道题的 <code>slow</code> 落点是反的：143 停在前半段最后一个（中点归前半段），234 停在后半段第一个（中点归后半段）。<strong>同一份代码里别混用两种起点</strong>：<code>slow=fast=head</code> 配 <code>后半段 = slow</code>；<code>slow=head, fast=head.next</code> 配 <code>后半段 = slow.next</code>。混了就会要么漏比一个、要么多比一个。

<strong>3. 多写了一句 <code>slow.next = None</code>。</strong>

在 234 里不必要，但也不算错 —— 前半段走到中点前一个就停了，比较对数少一次（中点不参与）。写了不会崩，只是<strong>多余</strong>，而且会让"恢复链表"变麻烦（得先把断开的那条边接回去）。

<strong>4. 用递归比较。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">def</span><span class="w"> </span><span class="nf">check</span><span class="p">(</span><span class="n">node</span><span class="p">):</span>        <span class="c1"># 递归版：栈空间 O(n)</span>
    <span class="k">nonlocal</span> <span class="n">front</span>
    <span class="k">if</span> <span class="n">node</span> <span class="ow">is</span> <span class="kc">None</span><span class="p">:</span> <span class="k">return</span> <span class="kc">True</span>
    <span class="k">if</span> <span class="ow">not</span> <span class="n">check</span><span class="p">(</span><span class="n">node</span><span class="o">.</span><span class="n">next</span><span class="p">):</span> <span class="k">return</span> <span class="kc">False</span>
    <span class="n">ok</span> <span class="o">=</span> <span class="n">front</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">node</span><span class="o">.</span><span class="n">val</span>
    <span class="n">front</span> <span class="o">=</span> <span class="n">front</span><span class="o">.</span><span class="n">next</span>
    <span class="k">return</span> <span class="n">ok</span>
</code></pre></div>


很优雅，但递归栈是 <code>O(n)</code>，不满足进阶要求。写之前想清楚面试官问的是哪个。

<strong>5. 忘了空链表和单节点。</strong>

虽然这版算法本身能算对，但显式防御更稳 —— 尤其是那些在 <code>fast.next.next</code> 上做文章的写法，单节点时容易翻车。

<strong>6. 反转完不恢复，被追问时答不上来。</strong>

LC 234 不要求保持原结构，但面试官爱追一句"能恢复吗"。答案是<strong>能，而且只要一行</strong>：因为全程没断开过，前半段的尾巴一直指着中点，把后半段再反转一次就自动接回去了。
<div class="codehilite"><pre><span></span><code><span class="n">reverse</span><span class="p">(</span><span class="n">prev</span><span class="p">)</span>   <span class="c1"># 再反转一次，链表恢复原状</span>
</code></pre></div>


这个性质是 2.2 节"不用断开"顺手换来的，答出来很加分。
<hr>
<h2>八、面试怎么答</h2>

<strong>开口 30 秒给思路</strong>（别一上来就写代码）：
<blockquote>

回文就是"前半段"和"后半段倒过来"逐位相同。链表没法从后往前走，那就把后半段反转过来，再用两个指针从头比。分三步：快慢指针找中点、反转后半段、双指针逐位比。时间 O(n)，空间 O(1)。
</blockquote>

<strong>然后主动把三个易错点交代掉</strong> —— 这是区分"背过答案"和"真懂"的地方：
<ol>
<li>中点用 <code>slow=fast=head</code>，<code>slow</code> 落在后半段开头，中间节点归后半段；</li>
<li>不用断开 —— 反转时中点的 <code>next</code> 会被置空，前半段走到那儿自然终止；</li>
<li>比较循环写 <code>while p2</code>，因为偶数长度时前半段链更长。</li>
</ol>

<strong>追问应对</strong>：
<ul>
<li><em>"能不用额外空间吗？"</em> —— 已经是 O(1) 了，六根指针。</li>
<li><em>"能恢复原链表吗？"</em> —— 能，再反转一次后半段即可，因为全程没断开。</li>
<li><em>"奇数长度中间那个怎么办？"</em> —— 归后半段，反转后落到末尾，最后跟自己比一次，必然相等，不用特判。</li>
<li><em>"还有别的 O(1) 做法吗？"</em> —— 有，递归前后指针那套，但栈是 O(n)，严格说不算 O(1)。</li>
</ul>
<hr>

把这几篇串起来看，快慢指针这一家子的分工是这样的：

<th>和本题的关系</th>

</tr>
<tr>

</tr>
<tr>

<td>找中点 + 反转 + 交替合并</td>

</tr>
<tr>
<td><strong>LC 234</strong> 回文链表</td>
<td>找中点 + 反转 + 逐对比较</td>

</tr>
<tr>

<td>快慢指针固定间隔</td>

234 和 143 是同一副骨架（找中点 + 反转后半段），差别只在第三步：一个要<strong>改拓扑</strong>（所以必须断开防环），一个只<strong>读值</strong>（所以断不断都行，不断反而更省事）。

下次再遇到"从后往前"的链表题，先问自己一句：<strong>后半段反转过来，是不是就变成了从前往后？</strong> 如果是，这题就做完一半了。</div></div></noscript>
