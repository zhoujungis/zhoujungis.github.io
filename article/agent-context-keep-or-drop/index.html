    <noscript><div class="ns-article"><h1>Agent 上下文：留什么，丢什么</h1><div class="ns-meta">2026/10/22 · Stack Frame</div><div class="markdown-body"><blockquote>

适用读者：已经写出第一版 Agent 循环、开始被「历史越跑越长」折磨的人；想知道 <code>compact</code> 到底该保留什么的人；准备给 Agent 加记忆、加检索、加多代理，但先想把上下文预算算清楚的人
结论先行：上下文不是聊天记录，而是「下一步还需要的工作集」。留什么的标准只有一个——下一条消息里，模型会不会用到它。NanoHermes 用四层上限把这件事变成可计算的：单个文件 4 MB 就拒绝、单个工具结果 20,000 字节就截断、项目文档 20,000 字符封顶、会话总量 120,000 字符就压缩；压缩时保留最近 10 条消息，把更早的部分换成一段不超过 300 词的摘要。本文拆开这套预算、切点和摘要策略，并说明哪些信息必须留、哪些可以丢
阅读时间：约 30 分钟 | 难度：进阶 | 收获：一套可复用的上下文预算表 + 压缩算法的逐行解释 + 摘要该保留的四类信息 + 七个会让上下文悄悄坏掉的陷阱
</blockquote>

<hr>
<h2>前言：上下文不是聊天记录</h2>

第一篇讲循环时，我们把消息列表当成一个整体：模型回什么，就往后追加什么。只要历史合法，循环就能一直转。

但历史不会免费。模型没有记忆，每一轮请求都要把完整历史重新发一遍。所谓「上下文窗口」，是一个每轮都被重新填充的容器，不是一份持久保存的聊天记录。

Agent 上下文的难点从来不是「存不下」，而是「带什么」。

这带来一个和普通程序完全不同的约束：<strong>上下文的成本不是存储成本，而是每轮重复支付的输入成本。</strong> 你把一段 20,000 字符的工具结果留在历史里，不是占了一次磁盘，而是让接下来的每一次模型请求都多带 20,000 字符。跑十轮，就是二十万字符的重复输入。

所以「留什么，丢什么」不是整理癖，而是 Agent 的核心算法之一。留得太多，模型抓不住重点，延迟和账单一起上涨；丢得太多，模型忘了目标、忘了改过哪个文件、忘了刚才哪条路走不通，开始原地打转。

这一篇的答案可以压成一句话：
<blockquote>

<strong>留下来的是「下一步还需要的工作集」，不是「已经发生过的事」。</strong>
</blockquote>

判断标准也很简单：下一条消息里，模型会不会用到它？会，就留；不会，就丢；不确定，就压成一句摘要。
<hr>
<h2>一次请求里到底装了什么</h2>

一次模型请求的 <code>messages</code> 数组，通常由七种东西组成。
<div class="table-scroll"><table>
<thead>
<tr>
<th>内容</th>
<th>典型来源</th>
<th>体积特征</th>
<th>变化频率</th>
</tr>
</thead>
<tbody>
<tr>
<td>系统提示词</td>
<td><code>prompt::system_prompt</code></td>
<td>固定，约 30 行</td>
<td>启动 / 改配置时</td>
</tr>
<tr>
<td>项目约定</td>
<td><code>AGENTS.md</code> 逐层拼接</td>
<td>最多 20,000 字符</td>
<td>改文件时</td>
</tr>
<tr>
<td>项目上下文</td>
<td><code>NANOHERMES.md</code></td>
<td>无单独上限</td>
<td>改文件时</td>
</tr>
<tr>
<td>技能清单</td>
<td><code>skills::listing</code></td>
<td>每个技能一行</td>
<td>启动时</td>
</tr>
<tr>
<td>记忆块</td>
<td><code>memory::render_block</code></td>
<td>最多 2,400 字符</td>
<td>每轮重检索</td>
</tr>
<tr>
<td>对话消息</td>
<td>user / assistant / tool</td>
<td>随轮次增长</td>
<td>每轮</td>
</tr>
<tr>
<td>压缩摘要</td>
<td><code>summarize_messages</code></td>
<td>最多 300 词</td>
<td>超预算时</td>
</tr>
</tbody>
</table></div>

前三项和技能清单都属于系统消息，只在启动或配置变化时重建。记忆块虽然也在系统消息里，但每轮都会按标记替换。对话消息是增长的主体，压缩摘要则是为了截住这个增长。

大多数人的直觉是「对话消息最多」，实际不一定。一个 <code>read_file</code> 返回 2,000 行，经 <code>clamp</code> 截到 20,000 字节；五次这样的读取就是 100,000 字节，已经接近整个会话预算。真正吃掉窗口的往往不是模型说的话，而是工具的输出。
<div class="table-scroll"><table>
<thead>
<tr>
<th>内容</th>
<th>估算体积</th>
<th>占 120k 预算</th>
</tr>
</thead>
<tbody>
<tr>
<td>系统提示词 + 项目约定</td>
<td>2,000–22,000 字符</td>
<td>2%–18%</td>
</tr>
<tr>
<td>记忆块</td>
<td>≤2,400 字符</td>
<td>≤2%</td>
</tr>
<tr>
<td>一条普通工具结果</td>
<td>200–2,000 字符</td>
<td>0.2%–1.7%</td>
</tr>
<tr>
<td>一条被截断的工具结果</td>
<td>20,000 字节</td>
<td>≈17%</td>
</tr>
<tr>
<td>最近 10 条消息</td>
<td>5,000–40,000 字符</td>
<td>4%–33%</td>
</tr>
<tr>
<td>压缩摘要</td>
<td>约 1,500–2,500 字符</td>
<td>1%–2%</td>
</tr>
</tbody>
</table></div>

这张表解释了一个常见现象：<strong>上下文爆炸通常不是因为聊得多，而是因为某几次工具调用返回了太多东西。</strong> 一个没有上限的 <code>cat</code>、一次全仓库 <code>grep</code>、一个把整页 HTML 塞回来的 <code>web_fetch</code>，就能让预算瞬间见底。
<hr>
<h2>四层预算：从单文件到整个会话</h2>

NanoHermes 没有用一个统一的「上下文管理器」，而是在四个层次上分别设上限。每一层负责不同的失败模式。
<div class="table-scroll"><table>
<thead>
<tr>
<th>层次</th>
<th>上限</th>
<th>位置</th>
<th>超限行为</th>
</tr>
</thead>
<tbody>
<tr>
<td>单文件读取</td>
<td>4 MB</td>
<td><code>fs::MAX_FILE_BYTES</code></td>
<td>拒绝，提示用 <code>offset</code> / <code>limit</code> 分块</td>
</tr>
<tr>
<td>搜索扫描</td>
<td>单文件 1 MB、200 条命中、单行 240 字符</td>
<td><code>search.rs</code></td>
<td>跳过超大文件，命中数到顶就停</td>
</tr>
<tr>
<td>glob 枚举</td>
<td>500 个文件</td>
<td><code>search.rs</code></td>
<td>截断并注明 capped</td>
</tr>
<tr>
<td>单工具返回</td>
<td>20,000 字节</td>
<td><code>Ctx.max_output</code> + <code>clamp</code></td>
<td>截断并注明省略多少</td>
</tr>
<tr>
<td>命令捕获</td>
<td>stdout / stderr 各 256 KB</td>
<td><code>shell::CAPTURE_BYTES</code></td>
<td>继续读但丢弃多余部分</td>
</tr>
<tr>
<td>后台任务</td>
<td>512 KB</td>
<td><code>tasks::CAPTURE_BYTES</code></td>
<td>保留前 512 KB，注明省略</td>
</tr>
<tr>
<td>网页响应</td>
<td>2 MB</td>
<td><code>web::MAX_RESPONSE_BYTES</code></td>
<td>截断响应体，继续提取文本</td>
</tr>
<tr>
<td>网页正文</td>
<td>默认 20,000 字符</td>
<td><code>web_fetch.max_chars</code></td>
<td>截断并注明</td>
</tr>
<tr>
<td>项目文档</td>
<td>20,000 字符</td>
<td><code>prompt::MAX_PROJECT_DOCS</code></td>
<td>截断并注明</td>
</tr>
<tr>
<td>技能正文</td>
<td>20,000 字符</td>
<td><code>skills::MAX_BODY_CHARS</code></td>
<td>截断并注明</td>
</tr>
<tr>
<td>记忆注入</td>
<td>2,400 字符、最多 4 条</td>
<td><code>memory::INJECT_*</code></td>
<td>放不下的条目不注入</td>
</tr>
<tr>
<td>会话总量</td>
<td>120,000 字符</td>
<td><code>CONTEXT_CHAR_BUDGET</code></td>
<td>摘要旧消息</td>
</tr>
</tbody>
</table></div>

为什么要分四层，而不是只在会话层做一次压缩？

<strong>第一，压缩太晚。</strong> 如果只在 120,000 字符时才处理，模型已经为前面那些巨型结果付过很多轮输入费了。工具层的上限在结果产生时就生效，成本立刻被截住。

<strong>第二，压缩太贵。</strong> 压缩本身是一次模型请求。如果每次都要把 4 MB 的文件内容读进来再摘要，摘要请求本身就可能超窗。工具层先拒绝，压缩层才有机会处理「值得摘要」的内容。

<strong>第三，压缩会丢信息。</strong> 一个 20,000 字节的工具结果被截断，模型至少还能看到前 20,000 字节；如果整段被摘要掉，细节就没了。能在工具层解决的，不要留到压缩层。

这四层的关系可以概括成一句话：<strong>越靠近产生点，越应该硬截断；越靠近会话层，越应该做摘要。</strong> 硬截断便宜、无损于「存在性」，但会丢细节；摘要贵、保留语义，但会引入模型误差。两者不能互相替代。
<hr>
<h2>一条工具结果为什么能吃掉半个窗口</h2>

假设模型调用 <code>read_file</code> 读一个 2,000 行的文件，每行平均 80 字符。原始内容约 160,000 字符。

<code>fs::read_file</code> 不会把 160,000 字符直接交给模型。它先按 <code>limit</code> 取前 2,000 行，再交给 <code>dispatch</code>；<code>dispatch</code> 的最后一步是 <code>clamp(s, ctx.max_output)</code>，默认 20,000 字节。所以模型最终看到的是前 20,000 字节，加上一行 <code>… output truncated (N chars omitted)</code>。

这 20,000 字节进入历史后，还会被 JSON 序列化一次。换行变成 <code>\n</code>，引号变成 <code>\"</code>，再套上 <code>{"role":"tool","tool_call_id":"...","content":"..."}</code> 的外壳。体积会再涨几个百分点。假设涨 3%，就是 20,600 字符。

在 120,000 字符的预算里，这一条结果占 17%。五次这样的读取，就是 85%。如果再叠加系统提示词、项目文档和模型自己的解释，预算很快就满了。

注意最后一行：<code>web_fetch</code> 自己还有一层 <code>max_chars</code>，默认也是 20,000。也就是说，网页抓取和工具截断的上限恰好撞在一起。这不是巧合，而是同一个预算在两层各设了一次闸。

这也解释了一个设计选择：<strong>所有内置工具的结果都要经过 <code>dispatch</code> 的 <code>clamp</code>，而不是让每个工具自己决定要不要截断。</strong> 单个工具可能忘记，也可能低估自己的输出；统一在出口截断，才能保证「任何工具都不会一次性灌爆上下文」。
<hr>
<h2>稳定前缀：系统消息为什么应该只读</h2>

系统消息在 <code>messages[0]</code>，每一轮都排在最前面。它的内容直接影响两件事：模型的行为，和推理服务的缓存命中。

NanoHermes 的系统消息由 <code>system_content</code> 构建，包含内置提示词、<code>NANOHERMES.md</code> 项目上下文和技能清单。它在三种时机重建：
<div class="table-scroll"><table>
<thead>
<tr>
<th>时机</th>
<th>动作</th>
<th>原因</th>
</tr>
</thead>
<tbody>
<tr>
<td>新建会话</td>
<td><code>default_messages</code> 构建</td>
<td>从零开始</td>
</tr>
<tr>
<td>恢复会话</td>
<td><code>refresh_system</code> 替换</td>
<td>配置可能已经变了</td>
</tr>
<tr>
<td><code>reset</code></td>
<td>重新构建</td>
<td>开新话题，保留规则</td>
</tr>
</tbody>
</table></div>

注意「恢复会话」这一行：加载会话文件时，NanoHermes 不会原样使用文件里的系统消息，而是用当前配置重新生成并替换。系统消息是配置，不是对话。用户的权限模式、人设、AGENTS.md 都可能变；原样恢复会让会话带着过期规则跑。

但系统消息也不是完全只读的。记忆块每轮都会被 <code>set_memory_block</code> 替换，而记忆块挂在系统消息的末尾。这意味着系统消息的<strong>前半段稳定，后半段每轮变化</strong>。

对推理服务来说，前缀缓存通常按 token 前缀匹配。稳定的前半段可以命中缓存，记忆块之后的部分则每轮重新计算。这是一个可以接受的折中：把变化的东西放在系统消息末尾，至少保住了前面那一大段稳定前缀。

反过来，如果把记忆块插在系统提示词中间，或者每轮在系统消息开头加时间戳，前缀缓存就会整段失效。<strong>上下文设计不只是「放什么」，还包括「放在哪、多久变一次」。</strong>

这里有两个不对称，值得单独说。

<strong>第一，<code>AGENTS.md</code> 有 20,000 字符上限，<code>NANOHERMES.md</code> 没有。</strong> <code>prompt::project_docs</code> 会在拼接后截断，并追加 <code>… project guidance truncated</code>；<code>system_content</code> 读 <code>NANOHERMES.md</code> 时是整文件读入，没有单独的 cap。它最终会被 120,000 字符的会话预算兜住，但在那之前，它已经进入了每一次请求。这是一个真实的边界：项目上下文文件应该保持短，不要把它当成文档仓库。

<strong>第二，技能清单只放名字和描述，正文按需加载。</strong> <code>skills::listing</code> 为每个技能生成一行，真正的说明在模型调用 <code>skill</code> 工具时才读取，读取时还有 20,000 字符上限。这个设计把「知道有什么」和「读到全部」分开了。清单很便宜，正文很贵，只在需要时支付。

<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="kd">let</span><span class="w"> </span><span class="nb">Ok</span><span class="p">(</span><span class="n">text</span><span class="p">)</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">std</span><span class="p">::</span><span class="n">fs</span><span class="p">::</span><span class="n">read_to_string</span><span class="p">(</span><span class="o">&amp;</span><span class="n">project_ctx</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

<span class="w">    </span><span class="p">}</span>

<span class="w">        </span><span class="n">system</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="sc">&#39;\n&#39;</span><span class="p">);</span>
<span class="w">        </span><span class="n">system</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="k">crate</span><span class="p">::</span><span class="n">skills</span><span class="p">::</span><span class="n">listing</span><span class="p">(</span><span class="n">skills</span><span class="p">));</span>

系统提示词每轮都重发。一段 2,000 token 的提示词，跑 20 轮就是 40,000 token 的输入。提示词里的每一句都要为「每轮都值得」辩护：身份和工具规则值得，项目约定值得，三千字的公司介绍不值得。
<hr>
<h2>项目文档：拼接顺序与 20,000 字符截断</h2>

<code>AGENTS.md</code> 不是只读工作区根目录的那一个。NanoHermes 会从全局配置目录开始，沿着文件系统根到工作区，逐层收集。

</tbody>
</table></div>

「越具体越靠后」不是形式主义。模型读长文本时，靠后的内容通常更容易被当成当前指令。把工作区自己的规则放在最后，等于让它覆盖上层的通用规则。这不是硬编码的优先级，而是通过顺序表达的软优先级。

去重则处理另一种情况：同一个文件通过符号链接或多条路径到达时，只读一次。<code>canonicalize</code> 失败时退回原路径，宁可重复也不漏读。

20,000 字符的截断发生在拼接之后，所以它截掉的是「最后面」的内容——也就是最具体的项目规则。这是一个有意的取舍：全局偏好和上层约定先保住，工作区规则如果太长，只能牺牲尾部。更好的做法当然是把工作区的 <code>AGENTS.md</code> 写短，而不是依赖截断。
<hr>
<h2>记忆注入：2,400 字符的硬预算</h2>

记忆块是系统消息里唯一每轮变化的部分。它的预算很小，但很硬。

<thead>
<tr>
<th>参数</th>
<th>值</th>
<th>作用</th>
</tr>
</thead>
<tbody>

<td>4</td>
<td>最多注入 4 条记忆</td>
</tr>

</table></div>
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">render_block</span><span class="p">(</span><span class="n">entries</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="o">&amp;</span><span class="n">Entry</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">entries</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">out</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">from</span><span class="p">(</span><span class="n">BLOCK_START</span><span class="p">);</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="s">&quot;</span><span class="se">\n</span><span class="s">以下是从过往会话中检索到的相关记忆（由对话自动提炼，仅供参考；用户当前指令优先）：</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">);</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">used</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">0</span><span class="k">usize</span><span class="p">;</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">e</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">entries</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">line</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;</span><span class="se">\n</span><span class="s">- [{}] {}&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">kind</span><span class="p">.</span><span class="n">label</span><span class="p">(),</span><span class="w"> </span><span class="n">e</span><span class="p">.</span><span class="n">text</span><span class="p">);</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">used</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">line</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">()</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">INJECT_CHAR_BUDGET</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">break</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="n">used</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">line</span><span class="p">.</span><span class="n">chars</span><span class="p">().</span><span class="n">count</span><span class="p">();</span>
<span class="w">        </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="n">line</span><span class="p">);</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="sc">&#39;\n&#39;</span><span class="p">);</span>
<span class="w">    </span><span class="n">out</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="n">BLOCK_END</span><span class="p">);</span>
<span class="w">    </span><span class="n">out</span>
<span class="p">}</span>
</code></pre></div>


这段代码的关键是 <code>break</code>，不是 <code>continue</code>。预算不够时，它不会跳过这一条去尝试更短的后面几条，而是直接停止。原因很简单：检索结果已经按相关度排好序，越往后越不重要；为了塞进一条低相关记忆而跳过一条高相关记忆，是得不偿失的。

<code>set_block</code> 则负责替换。它先找到旧块的起止标记，删掉整段，再把新块追加到系统消息末尾；新块为空时只删除，不追加。这个「替换而不是追加」的设计，是第一篇里提过的那个坑：如果每轮追加，系统提示词会随轮次线性增长，几轮之后就吃掉整个预算。

记忆块的文案里有一句「仅供参考；用户当前指令优先」。这不是客套。检索是按相关度算的，相关不等于正确；一条过期的偏好可能比当前指令更「相关」。把优先级写进注入文本，是让模型在冲突时有明确的裁决规则。
<hr>
<h2>工具输出：每个工具都必须有上限</h2>

一个不能限制输出的工具，就是一个上下文炸弹。它可能来自一次 <code>cat</code> 大文件、一次全仓库搜索、一次网页抓取，或者一条输出日志的构建命令。

NanoHermes 在每个可能产生大输出的地方都设了闸。

<thead>
<tr>
<th>工具 / 层</th>
<th>上限</th>
<th>超限行为</th>
</tr>
</thead>
<tbody>
<tr>

<td>文件 4 MB；默认 2,000 行</td>
<td>超大文件直接拒绝，提示分块</td>
</tr>
<tr>
<td><code>grep</code></td>
<td>单文件 1 MB；200 条命中；单行 240 字符</td>
<td>跳过超大文件，命中到顶停止</td>
</tr>
<tr>
<td><code>glob</code></td>
<td>500 个文件</td>
<td>截断并注明 capped</td>
</tr>
<tr>
<td><code>run_command</code></td>
<td>stdout / stderr 各 256 KB</td>
<td>继续读但丢弃，结果注明截断</td>
</tr>
<tr>

</tr>
<tr>
<td><code>web_search</code></td>
<td>结果条数与摘要长度受限</td>
<td>返回前几条</td>
</tr>
<tr>
<td>所有内置工具</td>
<td>20,000 字节</td>
<td><code>dispatch</code> 统一 <code>clamp</code></td>
</tr>
</tbody>
</table></div>

这些数字不是拍脑袋来的，它们对应不同的失败模式。

<strong>4 MB 是「读不读」的边界。</strong> 超过这个大小，读进来也没有意义：模型不可能在 20,000 字节的截断里看到全貌，不如直接告诉它「文件太大，用 offset/limit 分块读」。这是一个拒绝，不是截断。

<strong>1 MB 是「搜不搜」的边界。</strong> <code>grep</code> 会遍历整个工作区。单文件超过 1 MB 时跳过，避免把压缩包、打包产物、日志文件当源码扫描。跳过是静默的，但结果里会体现「没搜到」，模型可以通过 <code>glob</code> 或 <code>read_file</code> 再确认。

<strong>200 条命中是「够不够」的边界。</strong> 搜索的目的通常是定位，不是穷举。200 条足够让模型找到目标文件；再多，模型也读不完。到顶后停止，并在结果末尾注明，避免模型误以为只有这些。

<strong>256 KB 是「命令能喊多大声」的边界。</strong> 一条构建命令可能输出几 MB 日志。<code>read_capped</code> 只保留前 256 KB，剩下的一边读一边丢——必须继续读，否则管道会阻塞，子进程会卡住。这是「丢弃但不能停止读取」的典型场景。

<strong>20,000 字节是「一条结果能占多少窗口」的边界。</strong> 它不关心工具是什么，所有内置工具的结果都从这里过。它是最外层的保险，防止某个工具忘记自己的上限。
<hr>
<h2>三种截断语义：拒绝、截断、摘要</h2>

「截断」不是一个动作，而是三种不同的语义。混用它们，模型就会收到自相矛盾的信号。
<div class="table-scroll"><table>
<thead>
<tr>
<th>语义</th>
<th>例子</th>
<th>模型看到什么</th>
<th>优点</th>
<th>缺点</th>
</tr>
</thead>
<tbody>
<tr>
<td>拒绝</td>
<td><code>read_file</code> 超过 4 MB</td>
<td><code>... is N bytes (&gt; 4194304); read it in chunks</code></td>
<td>明确，不浪费上下文</td>
<td>需要模型再发一次请求</td>
</tr>
<tr>
<td>硬截断 + 说明</td>
<td><code>dispatch</code> 的 <code>clamp</code></td>
<td>前 20,000 字节 + <code>N chars omitted</code></td>
<td>便宜，保留开头</td>
<td>尾部信息丢失</td>
</tr>
<tr>
<td>计数上限 + 说明</td>
<td><code>grep</code> 到 200 条</td>
<td>200 条 + <code>stopped after 200 matches</code></td>
<td>结果可预期</td>
<td>可能漏掉后面的命中</td>
</tr>
<tr>
<td>响应截断 + 说明</td>
<td><code>web_fetch</code> 超过 2 MB</td>

<td>仍能提取正文</td>
<td>页面可能不完整</td>
</tr>
<tr>
<td>摘要</td>
<td><code>compact</code></td>
<td>一段 300 词摘要</td>
<td>保留语义，体积小</td>
<td>多一次请求，有信息损失</td>
</tr>
</tbody>
</table></div>

三种语义的共同要求是：<strong>必须留下痕迹。</strong> 静默截断是最坏的选择。模型看不到「被截断」的提示，就会把不完整的结果当成完整结果，基于缺失的信息做决定。一个 <code>grep</code> 如果悄悄只返回前 200 条，模型可能以为仓库里只有这些匹配，然后改错文件。

NanoHermes 的每条截断路径都带说明：
<ul>
<li><code>clamp</code>：<code>… output truncated (N chars omitted)</code></li>
<li><code>grep</code>：<code>… stopped after 200 matches</code></li>
<li><code>glob</code>：<code>… capped at 500 files</code></li>
<li><code>read_file</code>：<code>… N more lines (total M)</code></li>
<li><code>shell</code>：<code>… stdout truncated (N bytes not shown)</code></li>
<li>后台任务：<code>… output truncated (N bytes not shown)</code></li>
<li><code>web_fetch</code>：<code>[response truncated at 2097152 bytes]</code></li>
</ul>

这些说明本身也占体积，但它们是上下文里性价比最高的几十个字符。没有它们，模型会基于错误的完整性假设行动。
<hr>
<h2><code>clamp</code> 的实现：字节、字符边界与省略说明</h2>

<code>clamp</code> 只有十几行，但它处理了三个容易出错的细节。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">clamp</span><span class="p">(</span><span class="n">s</span><span class="p">:</span><span class="w"> </span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="n">max</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">String</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">max</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="n">s</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">max</span><span class="p">;</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">end</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="mi">0</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="o">!</span><span class="n">s</span><span class="p">.</span><span class="n">is_char_boundary</span><span class="p">(</span><span class="n">end</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">end</span><span class="w"> </span><span class="o">-=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="fm">format!</span><span class="p">(</span>
<span class="w">        </span><span class="s">&quot;{}</span><span class="se">\n</span><span class="s">… output truncated ({} chars omitted)&quot;</span><span class="p">,</span>
<span class="w">        </span><span class="o">&amp;</span><span class="n">s</span><span class="p">[</span><span class="o">..</span><span class="n">end</span><span class="p">],</span>
<span class="w">        </span><span class="n">s</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">end</span>
<span class="w">    </span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


<strong>第一，上限按字节算。</strong> <code>s.len()</code> 返回字节数，不是字符数。对纯 ASCII 输出（日志、代码、命令结果）两者一致；对中文输出，一个汉字占 3 个字节，20,000 字节大约只能装 6,600 个汉字。

<strong>第二，切点必须落在 UTF-8 字符边界。</strong> 如果直接 <code>&amp;s[..max]</code>，而 <code>max</code> 恰好落在某个三字节汉字的中间，Rust 会 panic。<code>while !s.is_char_boundary(end)</code> 往前退，最多退两个字节，保证切片合法。

<strong>第三，省略说明按字节算，却写成 chars。</strong> 这是代码里的一个小不一致：<code>s.len() - end</code> 是字节数，文案却写 <code>chars omitted</code>。对 ASCII 没问题，对中文会高估省略的字符数。这个不一致不影响安全，但会让模型对「还剩多少」判断偏保守。知道这一点，比假装它不存在好。
<div class="table-scroll"><table>
<thead>
<tr>
<th>输入</th>
<th>上限</th>
<th>输出</th>
<th>实际保留</th>
</tr>
</thead>
<tbody>
<tr>
<td>纯 ASCII 30,000 字节</td>
<td>20,000</td>
<td>前 20,000 字节 + 说明</td>
<td>20,000 字符</td>
</tr>
<tr>
<td>中文 30,000 字节（10,000 字）</td>
<td>20,000</td>
<td>前 20,000 字节 + 说明</td>
<td>约 6,666 字</td>
</tr>
<tr>
<td>边界落在汉字中间</td>
<td>20,000</td>
<td>退到 19,998 字节</td>
<td>合法 UTF-8</td>
</tr>
</tbody>
</table></div>

这也是为什么 <code>max_output</code> 的单位在文档里应该写「字节」而不是「字符」。源码里 <code>Ctx.max_output</code> 是 <code>usize</code>，没有单位；<code>clamp</code> 用 <code>len()</code>，实际是字节。文章里说「20,000 字节」比说「20,000 字符」准确。
<hr>
<h2>压缩触发：120,000 字符是怎么算的</h2>

压缩的入口是 <code>compact</code>，它在每轮工具结果回填之后调用。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">compact_with</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">force</span><span class="p">:</span><span class="w"> </span><span class="kt">bool</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">size</span><span class="p">:</span><span class="w"> </span><span class="kt">usize</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">iter</span><span class="p">().</span><span class="n">map</span><span class="p">(</span><span class="o">|</span><span class="n">m</span><span class="o">|</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">to_string</span><span class="p">().</span><span class="n">len</span><span class="p">()).</span><span class="n">sum</span><span class="p">();</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">force</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="p">(</span><span class="n">size</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">CONTEXT_CHAR_BUDGET</span><span class="w"> </span><span class="o">||</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="n">KEEP_RECENT</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">().</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">KEEP_RECENT</span><span class="p">);</span>
<span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">[</span><span class="n">start</span><span class="p">][</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="n">start</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;=</span><span class="w"> </span><span class="mi">1</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="mi">0</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>

<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">dropped</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">drain</span><span class="p">(</span><span class="mi">1</span><span class="o">..</span><span class="n">start</span><span class="p">).</span><span class="n">collect</span><span class="p">();</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">note</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">summarize_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dropped</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Some</span><span class="p">(</span><span class="n">summary</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[Earlier conversation summary]</span><span class="se">\n</span><span class="s">{summary}&quot;</span><span class="p">),</span>
<span class="w">        </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="s">&quot;[Earlier conversation was omitted to keep the context small]&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="w">    </span><span class="p">};</span>
<span class="w">    </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">insert</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;system&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">note</span><span class="w"> </span><span class="p">}));</span>
<span class="w">    </span><span class="n">dropped</span><span class="p">.</span><span class="n">len</span><span class="p">()</span>
<span class="p">}</span>
</code></pre></div>


这里有四个判定。
<div class="table-scroll"><table>
<thead>
<tr>
<th>判定</th>
<th>条件</th>
<th>不满足时</th>
</tr>
</thead>
<tbody>
<tr>
<td>预算</td>
<td><code>size &gt; 120_000</code></td>
<td>不压缩</td>
</tr>
<tr>
<td>消息数</td>
<td><code>messages.len() &gt; 11</code></td>
<td>不压缩（没有足够旧消息可丢）</td>
</tr>
<tr>
<td>强制</td>
<td><code>force == true</code>（<code>/compact</code>）</td>
<td>忽略前两个判定</td>
</tr>
<tr>
<td>切点</td>
<td><code>start &gt; 1</code> 且不在 tool 消息上</td>
<td>不压缩</td>
</tr>
</tbody>
</table></div>

<code>size</code> 的计算方式是 <code>messages.iter().map(|m| m.to_string().len()).sum()</code>。它量的是<strong>序列化后的 JSON 长度</strong>，不是消息内容的长度。

<code>/compact</code> 命令走的是 <code>compact_now()</code>，它调用 <code>compact_with(true)</code> 强制压缩，跳过预算判定；交互式用户可以在预算还没爆之前主动整理一次。

这很重要。一条 <code>tool</code> 消息的 JSON 包含 <code>role</code>、<code>tool_call_id</code>、<code>content</code> 三个键，加上引号、冒号和转义。内容里的每个换行会变成两个字符 <code>\n</code>，每个双引号会变成 <code>\"</code>。所以 <code>size</code> 总是比「所有 content 长度之和」大一些。对代码和日志这种换行密集的内容，差距可能到 5%–10%。
<div class="table-scroll"><table>
<thead>
<tr>
<th>内容</th>
<th>原始字符</th>
<th>序列化后</th>
<th>膨胀</th>
</tr>
</thead>
<tbody>
<tr>
<td>一段 1,000 行日志</td>
<td>50,000</td>
<td>约 52,000</td>
<td>4%</td>
</tr>
<tr>
<td>一段 2,000 行代码</td>
<td>80,000</td>
<td>约 84,000</td>
<td>5%</td>
</tr>
<tr>
<td>大量引号的 JSON</td>
<td>20,000</td>
<td>约 24,000</td>
<td>20%</td>
</tr>
</tbody>
</table></div>

这也意味着 <code>CONTEXT_CHAR_BUDGET</code> 的 120,000 是「JSON 字符数」，不是「模型 token 数」，也不是「对话内容字符数」。把它当成一个保守的近似值，而不是精确的窗口大小。
<hr>
<h2>为什么按字符算，不按 token 算</h2>

精确的上下文管理应该按 token 算。每个模型有自己的 tokenizer，同样的文本在不同模型上 token 数不同。按 token 算，才能精确卡住窗口。

NanoHermes 选择按字符算，原因有三个。

<strong>第一，tokenizer 是重依赖。</strong> 一个模型对应一份词表，几十 MB 到几百 MB。引入 tokenizer 意味着要么绑定某个模型家族，要么为每个模型维护一份。NanoHermes 的依赖只有三个 crate，不想为了估算引入第四第五个。

<strong>第二，字符数足够做保守近似。</strong> 对英文和代码，大约 3–4 个字符一个 token；对中文，大约 1–2 个字符一个 token。120,000 字符大致落在 30,000–60,000 token 之间。只要预算取得比真实窗口小，误差方向就是安全的。

<strong>第三，字符数可解释。</strong> 用户看到「上下文 120,000 字符」，能直观理解；看到「上下文 37,842 token」，反而不知道还剩多少空间。对一个交互式 CLI 来说，可解释性比精确性更重要。
<div class="table-scroll"><table>
<thead>
<tr>
<th>文本类型</th>
<th>字符 / token（近似）</th>
<th>120k 字符约合</th>
</tr>
</thead>
<tbody>
<tr>
<td>英文散文</td>
<td>4</td>
<td>30,000 token</td>
</tr>
<tr>
<td>源代码</td>
<td>3–3.5</td>
<td>34,000–40,000 token</td>
</tr>
<tr>
<td>中文</td>
<td>1–1.5</td>
<td>80,000–120,000 token</td>
</tr>
<tr>
<td>中英混合 + 代码</td>
<td>2–3</td>
<td>40,000–60,000 token</td>
</tr>
</tbody>
</table></div>

注意中文那一行：如果上下文里全是中文，120,000 字符可能已经接近 120,000 token，超过很多模型的窗口。这是字符预算的盲区。NanoHermes 的主要场景是代码和英文技术文本，中文占比通常不高；如果你的场景以中文长文为主，应该把预算调低，或者换成 token 估算。
<hr>
<h2>保留最近 10 条，而不是最近 10 轮</h2>

压缩保留的是最近 10 <strong>条消息</strong>，不是最近 10 轮对话。

这两个单位差别很大。一轮对话的消息数取决于模型调用了多少工具：
<div class="table-scroll"><table>
<thead>
<tr>
<th>一轮里的动作</th>
<th>消息数</th>
</tr>
</thead>
<tbody>
<tr>
<td>用户提问 + 模型纯文本回答</td>
<td>2 条（user + assistant）</td>
</tr>
<tr>
<td>用户提问 + 模型调 1 个工具 + 总结</td>
<td>4 条（user + assistant + tool + assistant）</td>
</tr>
<tr>
<td>用户提问 + 模型调 5 个工具 + 总结</td>
<td>7 条（user + assistant + 5 tool + assistant）</td>
</tr>
<tr>
<td>用户提问 + 3 轮工具调用，每轮 2 个</td>
<td>1 + 3 × (1 + 2) + 1 = 11 条</td>
</tr>
</tbody>
</table></div>

如果按「最近 10 轮」保留，最后一种情况会保留 110 条，预算根本压不住。按「最近 10 条」，无论一轮调了多少工具，保留的消息数都有上限。
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">().</span><span class="n">saturating_sub</span><span class="p">(</span><span class="n">KEEP_RECENT</span><span class="p">);</span>
<span class="k">while</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">[</span><span class="n">start</span><span class="p">][</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">start</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


<code>saturating_sub</code> 处理「消息数少于 10」的情况，结果是 0；后面的 <code>start &lt;= 1</code> 会直接返回，不会误删系统消息。

保留 10 条的目的是保证「最近一次工具交互」还在。一次带 5 个工具调用的轮次会占 7 条；再加一条 user、一条 assistant，刚好 9 条。10 条足够覆盖一次完整的工具往返，让模型知道刚才发生了什么。
<hr>
<h2>切点：为什么不能落在 tool 消息中间</h2>

切点的第一版逻辑是「从倒数第 10 条开始，前面的都丢掉」。这会产生一个致命问题：如果倒数第 10 条正好是一条 <code>tool</code> 消息，丢掉它前面的 assistant 工具调用、却保留这条结果，历史里就会出现一条没有对应调用的工具结果。

下一轮请求，API 会直接拒绝：
<blockquote>

messages with role 'tool' must be a response to a preceding message with 'tool_calls'
</blockquote>

更隐蔽的情况是：某些兼容层不拒绝，但模型会看到一组对不上的结果，开始胡言乱语。

NanoHermes 的处理是把切点往后推，直到它不是 <code>tool</code> 消息：
<div class="codehilite"><pre><span></span><code><span class="k">while</span><span class="w"> </span><span class="n">start</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">.</span><span class="n">len</span><span class="p">()</span><span class="w"> </span><span class="o">&amp;&amp;</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">[</span><span class="n">start</span><span class="p">][</span><span class="s">&quot;role&quot;</span><span class="p">]</span><span class="w"> </span><span class="o">==</span><span class="w"> </span><span class="s">&quot;tool&quot;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">start</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mi">1</span><span class="p">;</span>
<span class="p">}</span>
</code></pre></div>


这个循环最多推过整轮的工具结果。推过之后，被丢掉的区域里包含完整的 assistant 调用和它的全部结果；保留的区域从一条非 tool 消息开始，历史仍然合法。
<div class="table-scroll"><table>
<thead>
<tr>
<th>切点位置</th>
<th>丢掉的内容</th>
<th>保留的历史</th>
<th>合法性</th>
</tr>
</thead>
<tbody>
<tr>
<td>落在 user 上</td>
<td>旧的 user 及之前</td>
<td>user + assistant + tool...</td>
<td>合法</td>
</tr>
<tr>
<td>落在 assistant 上</td>
<td>旧的 assistant 及之前</td>
<td>assistant + tool...</td>
<td>合法</td>
</tr>
<tr>
<td>落在 tool 上（未调整）</td>
<td>assistant 调用，但保留 tool</td>
<td>孤立的 tool</td>
<td>非法</td>
</tr>
<tr>
<td>落在 tool 上（调整后）</td>
<td>整轮调用与结果</td>
<td>下一条非 tool 消息</td>
<td>合法</td>
</tr>
</tbody>
</table></div>

还有一个边界：<code>start &lt;= 1</code> 时直接返回。<code>messages[0]</code> 是系统消息，<code>messages[1]</code> 是摘要或第一条对话。如果切点落在 1 或更前，说明没有足够的旧消息可丢，压缩应该放弃，而不是把系统消息也丢掉。

这个「切点不能落在 tool 上」的规则，是第一篇里「历史必须合法」不变量的直接延伸。压缩不是随便删一段，它必须维持消息序列的配对关系。
<hr>
<h2>摘要：一次额外的模型请求</h2>

压缩不是把旧消息删掉就完事。它要让模型用一段话概括被丢掉的内容，这段话再作为一条 <code>system</code> 消息插回历史。
<div class="codehilite"><pre><span></span><code><span class="k">fn</span><span class="w"> </span><span class="nf">summarize_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">messages</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="p">[</span><span class="n">Value</span><span class="p">])</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Option</span><span class="o">&lt;</span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">messages</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">None</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">excerpt</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">();</span>
<span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">m</span><span class="w"> </span><span class="k">in</span><span class="w"> </span><span class="n">messages</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">role</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;role&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">r</span><span class="o">|</span><span class="w"> </span><span class="n">r</span><span class="p">.</span><span class="n">as_str</span><span class="p">()).</span><span class="n">unwrap_or</span><span class="p">(</span><span class="s">&quot;?&quot;</span><span class="p">);</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">content</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="n">m</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;content&quot;</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="nb">Some</span><span class="p">(</span><span class="n">Value</span><span class="p">::</span><span class="nb">String</span><span class="p">(</span><span class="n">s</span><span class="p">))</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">s</span><span class="p">.</span><span class="n">clone</span><span class="p">(),</span>
<span class="w">            </span><span class="nb">Some</span><span class="p">(</span><span class="n">Value</span><span class="p">::</span><span class="n">Array</span><span class="p">(</span><span class="n">arr</span><span class="p">))</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="n">arr</span>
<span class="w">                </span><span class="p">.</span><span class="n">iter</span><span class="p">()</span>
<span class="w">                </span><span class="p">.</span><span class="n">filter_map</span><span class="p">(</span><span class="o">|</span><span class="n">p</span><span class="o">|</span><span class="w"> </span><span class="n">p</span><span class="p">.</span><span class="n">get</span><span class="p">(</span><span class="s">&quot;text&quot;</span><span class="p">).</span><span class="n">and_then</span><span class="p">(</span><span class="o">|</span><span class="n">t</span><span class="o">|</span><span class="w"> </span><span class="n">t</span><span class="p">.</span><span class="n">as_str</span><span class="p">()))</span>
<span class="w">                </span><span class="p">.</span><span class="n">collect</span><span class="p">::</span><span class="o">&lt;</span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">_</span><span class="o">&gt;&gt;</span><span class="p">()</span>
<span class="w">                </span><span class="p">.</span><span class="n">join</span><span class="p">(</span><span class="s">&quot; &quot;</span><span class="p">),</span>
<span class="w">            </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="nb">String</span><span class="p">::</span><span class="n">new</span><span class="p">(),</span>
<span class="w">        </span><span class="p">};</span>
<span class="w">        </span><span class="kd">let</span><span class="w"> </span><span class="n">content</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">content</span><span class="p">.</span><span class="n">trim</span><span class="p">();</span>
<span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">content</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">            </span><span class="k">continue</span><span class="p">;</span>
<span class="w">        </span><span class="p">}</span>
<span class="w">        </span><span class="n">excerpt</span><span class="p">.</span><span class="n">push_str</span><span class="p">(</span><span class="o">&amp;</span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;{role}: {}</span><span class="se">\n</span><span class="s">&quot;</span><span class="p">,</span><span class="w"> </span><span class="n">content</span><span class="p">));</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">if</span><span class="w"> </span><span class="n">excerpt</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="k">return</span><span class="w"> </span><span class="nb">None</span><span class="p">;</span>
<span class="w">    </span><span class="p">}</span>
<span class="w">    </span><span class="k">match</span><span class="w"> </span><span class="n">llm</span><span class="p">::</span><span class="n">summarize</span><span class="p">(</span><span class="o">&amp;</span><span class="bp">self</span><span class="p">.</span><span class="n">cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">excerpt</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">        </span><span class="nb">Ok</span><span class="p">(</span><span class="n">s</span><span class="p">)</span><span class="w"> </span><span class="k">if</span><span class="w"> </span><span class="o">!</span><span class="n">s</span><span class="p">.</span><span class="n">is_empty</span><span class="p">()</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="nb">Some</span><span class="p">(</span><span class="n">s</span><span class="p">),</span>
<span class="w">        </span><span class="n">_</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="nb">None</span><span class="p">,</span>
<span class="w">    </span><span class="p">}</span>
<span class="p">}</span>
</code></pre></div>


这段代码先做一件事：把消息压成 <code>role: content</code> 的纯文本。多模态消息只取 <code>text</code> 部分，图片 URL 不进入摘要；内容为空的消息直接跳过。

然后调用 <code>llm::summarize</code>：
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">summarize</span><span class="p">(</span><span class="n">cfg</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="nc">Config</span><span class="p">,</span><span class="w"> </span><span class="n">text</span><span class="p">:</span><span class="w"> </span><span class="kp">&amp;</span><span class="kt">str</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Result</span><span class="o">&lt;</span><span class="nb">String</span><span class="p">,</span><span class="w"> </span><span class="nb">String</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="k">mut</span><span class="w"> </span><span class="n">summarizer_cfg</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">cfg</span><span class="p">.</span><span class="n">clone</span><span class="p">();</span>
<span class="w">    </span><span class="n">summarizer_cfg</span><span class="p">.</span><span class="n">stream</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kc">false</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">system</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s">&quot;You are a conversation summarizer for a coding agent. Write a concise summary \</span>
<span class="s">                  of the excerpt below, preserving: the user&#39;s goal, key decisions, file paths \</span>
<span class="s">                  changed, and current task state. Use at most 300 words. Reply with the summary only.&quot;</span><span class="p">;</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">messages</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="fm">vec!</span><span class="p">[</span>
<span class="w">        </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;system&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">system</span><span class="w"> </span><span class="p">}),</span>
<span class="w">        </span><span class="n">json</span><span class="o">!</span><span class="p">({</span><span class="w"> </span><span class="s">&quot;role&quot;</span><span class="p">:</span><span class="w"> </span><span class="s">&quot;user&quot;</span><span class="p">,</span><span class="w"> </span><span class="s">&quot;content&quot;</span><span class="p">:</span><span class="w"> </span><span class="nc">text</span><span class="w"> </span><span class="p">}),</span>
<span class="w">    </span><span class="p">];</span>
<span class="w">    </span><span class="kd">let</span><span class="w"> </span><span class="n">turn</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">chat</span><span class="p">(</span><span class="o">&amp;</span><span class="n">summarizer_cfg</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="o">&amp;</span><span class="n">Value</span><span class="p">::</span><span class="n">Array</span><span class="p">(</span><span class="fm">vec!</span><span class="p">[]),</span><span class="w"> </span><span class="o">|</span><span class="n">_</span><span class="o">|</span><span class="w"> </span><span class="p">{})</span><span class="o">?</span><span class="p">;</span>
<span class="w">    </span><span class="nb">Ok</span><span class="p">(</span><span class="n">turn</span><span class="p">.</span><span class="n">content</span><span class="p">.</span><span class="n">trim</span><span class="p">().</span><span class="n">to_string</span><span class="p">())</span>
<span class="p">}</span>
</code></pre></div>


注意三个参数：<code>stream = false</code>（摘要不需要流式）、<code>tools = []</code>（不允许摘要器调用工具）、<code>temperature</code> 沿用主配置（默认 0）。摘要是一次普通的、非流式的、无工具的模型请求。
<hr>
<h2>摘要输入里有什么，没有什么</h2>

这是整篇文章最容易被忽略的一节。

<code>summarize_messages</code> 只读取每条消息的 <code>content</code>。它<strong>不读取</strong> <code>tool_calls</code> 里的 <code>function.name</code> 和 <code>function.arguments</code>。
<div class="table-scroll"><table>
<thead>
<tr>
<th>消息类型</th>
<th>进入摘要的内容</th>
<th>不进入摘要的内容</th>
</tr>
</thead>
<tbody>
<tr>
<td>user</td>
<td>文本（多模态只取 text）</td>
<td>图片数据</td>
</tr>
<tr>
<td>assistant（纯文本）</td>
<td><code>content</code></td>
<td>无</td>
</tr>
<tr>
<td>assistant（工具调用）</td>
<td>通常为空，整条跳过</td>
<td><code>tool_calls</code> 的 name、arguments、id</td>
</tr>
<tr>
<td>tool</td>
<td>工具结果全文</td>
<td><code>tool_call_id</code>、对应的调用名</td>
</tr>
</tbody>
</table></div>

这意味着摘要器看到的序列可能是这样的：
<div class="codehilite"><pre><span></span><code>user: 把 README 里的安装命令改成 pnpm
assistant: 我先看看 README。
tool: 1→# Project
2→
3→## Install
4→npm install
...
assistant: 已经改成 pnpm。
</code></pre></div>


它能看到「读了 README」「结果是这些行」，但看不到「调用的是 <code>read_file</code>，参数是 <code>path=README.md</code>」。如果工具结果本身没有包含文件名，摘要就会丢失「改的是哪个文件」这条关键信息。

这是一个真实的局限，也是摘要提示词要求「保留 file paths changed」的原因：既然结构化字段进不来，就只能靠工具结果里的路径和模型的文本描述来补。NanoHermes 的 <code>read_file</code> 输出不带文件名，所以摘要器只能从上下文推断；<code>edit_file</code> 的结果带路径，通常能补上。

如果你要改进这一点，有两个方向：
<ol>
<li><strong>在摘要输入里保留工具名和参数。</strong> 把 assistant 消息的 <code>tool_calls</code> 渲染成 <code>assistant: [read_file] {"path":"README.md"}</code>，而不是跳过。</li>
<li><strong>让工具结果自带身份。</strong> 每个工具返回时带上「我在哪个文件上做了什么」，例如 <code>read_file README.md</code>。</li>
</ol>

两种做法都会增加摘要输入的长度，但能显著减少「摘要后不知道改了哪个文件」的问题。
<hr>
<h2>摘要提示词要求保留的四类信息</h2>

摘要提示词很短，只列了四类必须保留的信息：
<blockquote>

the user's goal, key decisions, file paths changed, and current task state. Use at most 300 words.
</blockquote>
<div class="table-scroll"><table>
<thead>
<tr>
<th>保留项</th>
<th>回答的问题</th>
<th>丢失后的症状</th>
</tr>
</thead>
<tbody>
<tr>
<td>用户目标</td>
<td>我们到底在做什么？</td>
<td>模型开始做无关的事，或者重复问需求</td>
</tr>
<tr>
<td>关键决策</td>
<td>为什么选这个方案？</td>
<td>模型推翻已定方案，来回改</td>
</tr>
<tr>
<td>改过的文件路径</td>
<td>动过哪些地方？</td>
<td>模型重复修改，或者漏掉某个文件</td>
</tr>
<tr>
<td>当前任务状态</td>
<td>进行到哪一步？</td>
<td>模型重复已完成的工作，或者不知道下一步</td>
</tr>
</tbody>
</table></div>

这四类信息有一个共同点：<strong>它们都是「下一步」需要的，而不是「过去」的完整记录。</strong> 摘要不保留逐字对话，不保留每个工具的输出，也不保留模型的解释过程。它保留的是能让下一个模型接上手的「工作交接单」。

300 词的上限也不是随便定的。一段 300 词的摘要大约 1,500–2,500 字符，占 120,000 预算的 1%–2%。如果摘要写到 2,000 词，它就变成了另一种上下文膨胀：压缩一次，塞回去一大段。
<div class="table-scroll"><table>
<thead>
<tr>
<th>摘要长度</th>
<th>字符估算</th>
<th>占预算</th>
<th>适用</th>
</tr>
</thead>
<tbody>
<tr>
<td>100 词</td>
<td>500–800</td>
<td>&lt;1%</td>
<td>短任务</td>
</tr>
<tr>
<td>300 词</td>
<td>1,500–2,500</td>
<td>1%–2%</td>
<td>默认</td>
</tr>
<tr>
<td>1,000 词</td>
<td>5,000–8,000</td>
<td>4%–7%</td>
<td>长任务，但会挤占最近消息</td>
</tr>
</tbody>
</table></div>

摘要提示词里还有一句 <code>Reply with the summary only</code>。这是为了防止模型在摘要前后加「好的，以下是摘要」这类客套话。客套话也会进入上下文，而且没有任何信息量。
<hr>
<h2>摘要失败时的降级</h2>

摘要是一次网络请求，可能失败：API 超时、限流、返回空内容、摘要器把内容全滤掉。<code>summarize_messages</code> 的返回类型是 <code>Option&lt;String&gt;</code>，失败就返回 <code>None</code>。

<code>compact_with</code> 对 <code>None</code> 的处理是插入一行占位说明：
<div class="codehilite"><pre><span></span><code><span class="kd">let</span><span class="w"> </span><span class="n">note</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">match</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">summarize_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="n">dropped</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="nb">Some</span><span class="p">(</span><span class="n">summary</span><span class="p">)</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="fm">format!</span><span class="p">(</span><span class="s">&quot;[Earlier conversation summary]</span><span class="se">\n</span><span class="s">{summary}&quot;</span><span class="p">),</span>
<span class="w">    </span><span class="nb">None</span><span class="w"> </span><span class="o">=&gt;</span><span class="w"> </span><span class="s">&quot;[Earlier conversation was omitted to keep the context small]&quot;</span><span class="p">.</span><span class="n">to_string</span><span class="p">(),</span>
<span class="p">};</span>
</code></pre></div>

<div class="table-scroll"><table>
<thead>
<tr>
<th>失败原因</th>
<th><code>summarize_messages</code> 的行为</th>
<th>最终结果</th>
</tr>
</thead>
<tbody>
<tr>
<td>被丢弃的消息为空</td>
<td>返回 <code>None</code></td>
<td>插入占位说明</td>
</tr>
<tr>
<td>所有消息 content 都为空</td>
<td>返回 <code>None</code></td>
<td>插入占位说明</td>
</tr>
<tr>
<td>摘要请求失败</td>
<td>返回 <code>None</code></td>
<td>插入占位说明</td>
</tr>
<tr>
<td>摘要返回空字符串</td>
<td>返回 <code>None</code></td>
<td>插入占位说明</td>
</tr>
<tr>
<td>摘要成功</td>
<td>返回 <code>Some</code></td>
<td>插入摘要</td>
</tr>
</tbody>
</table></div>

为什么失败也要插入一行，而不是什么都不插？

因为模型需要知道「有一段历史被省略了」。如果压缩后历史直接从系统消息跳到最近的工具结果，模型会以为自己一直只有这么点上下文，可能重复已经做过的工作，或者对用户的指令感到困惑。一行 <code>[Earlier conversation was omitted ...]</code> 至少告诉它：前面还有东西，只是没带过来。

这也是「截断必须留痕」原则在压缩层的体现。失败不可怕，静默失败才可怕。

<td>3</td>
<td>assistant</td>
<td>工具调用 C</td>
</tr>
<tr>
<td>4</td>
<td>tool</td>
<td>C 的结果</td>
</tr>
<tr>
<td>5</td>
<td>assistant</td>
<td>总结</td>
</tr>
</tbody>
</table></div>

注意三点。

<strong>第一，系统提示词仍然是 0。</strong> 摘要插在 1，不替换系统提示词。这样配置、规则、记忆块都保留。

<strong>第二，摘要是 <code>system</code> 角色，不是 <code>assistant</code>。</strong> 它是「背景知识」，不是「模型说过的话」。用 system 角色能让模型把它当成指令性上下文，而不是对话历史。

<strong>第三，最近 10 条原样保留。</strong> 摘要负责旧历史，最近的消息负责「刚才发生了什么」。两者分工明确。

多次压缩时，旧摘要会被再次摘要。第二次压缩的 <code>dropped</code> 区域包含第一次插入的 system 摘要，<code>summarize_messages</code> 会把它的 content 也拼进 excerpt。这意味着摘要会「滚动合并」，不会越积越多，但也会有<strong>摘要的摘要</strong>带来的信息漂移：第一次摘要丢掉的细节，第二次无法恢复；第二次摘要还可能把第一次的错误结论继续放大。
<hr>
<h2>什么该留：五类信息</h2>

把「下一步会不会用到」这个标准展开，可以落成五类信息。
<div class="table-scroll"><table>
<thead>
<tr>
<th>类别</th>
<th>具体内容</th>
<th>为什么留</th>
<th>通常在哪</th>
</tr>
</thead>
<tbody>
<tr>
<td>目标与约束</td>
<td>用户要什么、不许做什么、验收标准</td>
<td>决定方向，丢了就白干</td>
<td>最近的 user 消息、摘要</td>
</tr>
<tr>
<td>关键决策</td>
<td>选了什么方案、为什么否决另一个</td>
<td>防止反复横跳</td>
<td>assistant 文本、摘要</td>
</tr>
<tr>
<td>改动路径</td>
<td>改过哪些文件、新增了哪些文件</td>
<td>防止重复修改、漏改</td>
<td>工具结果、摘要</td>
</tr>
<tr>
<td>失败尝试</td>
<td>哪条路走不通、报了什么错</td>
<td>防止重复踩坑</td>
<td>工具结果、assistant 文本</td>
</tr>
<tr>
<td>当前状态</td>
<td>做到哪一步、下一步做什么</td>
<td>接续任务</td>
<td>最近几条消息</td>
</tr>
</tbody>
</table></div>

这五类里，前四类可以进摘要，第五类必须留在最近消息里。原因是「当前状态」变化最快，摘要一次就可能过期；而目标、决策、路径、失败尝试相对稳定，适合压缩成一段话。

一个反例是「完整的文件内容」。很多人觉得「模型读过这个文件，应该留着」，于是把 2,000 行代码留在历史里。但模型下一步真正需要的是「这个文件里哪个函数要改」，而不是整份文件。完整内容应该留在磁盘上，需要时再读；上下文里留路径、行号和结论就够了。
<hr>
<h2>什么该丢：四类内容</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>内容</th>
<th>为什么可丢</th>
<th>例外</th>
</tr>
</thead>
<tbody>
<tr>
<td>重复的寒暄与确认</td>
<td>「好的」「收到」「继续」不含决策信息</td>
<td>用户在这些话里加了新约束</td>
</tr>
<tr>
<td>完整文件内容</td>
<td>磁盘上有，需要时可重读</td>
<td>文件已被删除或外部修改</td>
</tr>
<tr>
<td>成功命令的长输出</td>
<td>退出码为 0 时，输出通常只是过程</td>
<td>输出里有测试结果、警告、关键日志</td>
</tr>
<tr>
<td>已摘要的中间步骤</td>
<td>摘要已经保留了结论</td>
<td>需要逐字复现某个步骤</td>
</tr>
</tbody>
</table></div>

「成功命令的长输出」这一条最容易判断错。<code>cargo build</code> 成功时输出几百行编译日志，模型通常只需要知道「成功了」；但如果输出里有 warning，warning 可能是下一步的线索。NanoHermes 的 shell 工具不会自动区分，它把退出码和输出一起返回，由模型自己判断。压缩时，摘要器可能会把成功的日志概括成「构建通过」，warning 就丢了。

这就是为什么「什么该丢」不能完全交给摘要器。摘要器只看 content，不懂任务；它可能把一条关键的 warning 当成噪音。更稳妥的做法是：在工具层就把「成功但啰嗦」的输出压短，比如只保留退出码和最后几行；而不是留给压缩层去猜。
<hr>
<h2>上下文、记忆、会话：三个不同的东西</h2>

这三个概念经常被混为一谈，但它们的生命周期和用途完全不同。
<div class="table-scroll"><table>
<thead>
<tr>
<th>维度</th>
<th>上下文</th>
<th>记忆</th>
<th>会话</th>
</tr>
</thead>
<tbody>
<tr>
<td>存储</td>
<td>内存里的 <code>messages</code></td>
<td><code>~/.nanohermes/memory.json</code></td>
<td><code>--session</code> 指定的 JSON 文件</td>
</tr>
<tr>
<td>生命周期</td>
<td>一次请求 / 一个轮次</td>
<td>跨会话长期</td>
<td>一次会话</td>
</tr>
<tr>
<td>内容</td>
<td>完整消息序列</td>
<td>提炼后的短句</td>
<td>完整消息序列</td>
</tr>
<tr>
<td>体积</td>
<td>最多 120,000 字符</td>
<td>最多 500 条，每条 400 字符</td>
<td>不设上限</td>
</tr>
<tr>
<td>检索</td>
<td>无，全量发送</td>
<td>BM25 + 中英文分词</td>
<td>无，启动时整体加载</td>
</tr>
<tr>
<td>注入</td>
<td>直接作为 <code>messages</code></td>
<td>最多 4 条、2,400 字符</td>
<td>不注入，恢复为 <code>messages</code></td>
</tr>
</tbody>
</table></div>

<strong>上下文</strong>是「这一次请求要带什么」，<strong>记忆</strong>是「跨会话值得记住什么」，<strong>会话</strong>是「这次对话的完整存档」。

会话文件不设上限，因为它保存在磁盘上，不参与每次请求。加载会话时，它会被读回 <code>messages</code>，然后由上下文预算接管。记忆则是另一个方向：它从会话里提炼，但不保存全文；下次会话按当前指令检索，只注入最相关的几条。

<code>replace_messages</code> 是这三个概念在 daemon 模式下的交汇点：一个 Agent 实例可以服务多个隔离会话，通过替换 <code>messages</code> 切换上下文。记忆和会话文件仍然是各自独立的。
<div class="codehilite"><pre><span></span><code><span class="k">pub</span><span class="w"> </span><span class="k">fn</span><span class="w"> </span><span class="nf">replace_messages</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">,</span><span class="w"> </span><span class="n">msgs</span><span class="p">:</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="p">)</span><span class="w"> </span><span class="p">-&gt;</span><span class="w"> </span><span class="nb">Vec</span><span class="o">&lt;</span><span class="n">Value</span><span class="o">&gt;</span><span class="w"> </span><span class="p">{</span>
<span class="w">    </span><span class="n">std</span><span class="p">::</span><span class="n">mem</span><span class="p">::</span><span class="n">replace</span><span class="p">(</span><span class="o">&amp;</span><span class="k">mut</span><span class="w"> </span><span class="bp">self</span><span class="p">.</span><span class="n">messages</span><span class="p">,</span><span class="w"> </span><span class="n">msgs</span><span class="p">)</span>
<span class="p">}</span>
</code></pre></div>


这也解释了为什么 token 用量要上报增量而不是累计值：同一个 Agent 可能在不同会话之间切换，累计值会把这些互不相关的任务加在一起。上下文可以替换，账本必须按轮次分清。
<hr>
<h2>压缩的代价：延迟、损失与漂移</h2>

压缩不是免费的。它至少有三类代价。
<div class="table-scroll"><table>
<thead>
<tr>
<th>代价</th>
<th>表现</th>
<th>缓解</th>
</tr>
</thead>
<tbody>
<tr>
<td>延迟</td>
<td>压缩时多一次模型请求，用户多等一轮</td>
<td>只在超预算时触发；<code>/compact</code> 手动控制</td>
</tr>
<tr>
<td>信息损失</td>
<td>旧细节被 300 词摘要替代</td>
<td>保留最近 10 条；摘要要求保留路径与决策</td>
</tr>
<tr>
<td>摘要漂移</td>
<td>多次压缩后，摘要的摘要越来越抽象</td>
<td>尽量在任务边界压缩；不要频繁压缩</td>
</tr>
<tr>
<td>缓存失效</td>
<td>摘要插入 <code>messages[1]</code>，后续前缀变化</td>
<td>接受；压缩本来就不频繁</td>
</tr>
<tr>
<td>成本</td>
<td>摘要请求本身消耗 token</td>
<td>摘要输入是旧历史，通常小于重发成本</td>
</tr>
</tbody>
</table></div>

延迟是最容易被低估的。压缩发生在工具结果回填之后、下一轮请求之前，用户会感觉「这一轮特别慢」。如果压缩又触发了一次摘要请求，延迟就是「工具时间 + 摘要时间 + 下一轮模型时间」。在长任务里，这可能多出几秒到十几秒。

信息损失则是结构性的。摘要器只看到 <code>role: content</code>，看不到工具名和参数；它可能把「改了 <code>src/main.rs</code> 的第 42 行」概括成「修改了主文件」。下一次模型想继续改，就得重新读文件。这不是摘要器的错，是输入里就没有这些信息。

摘要漂移更隐蔽。第一次摘要保留了「用户要求用 pnpm」，第二次摘要可能把它合并成「包管理器相关改动」，第三次就只剩「依赖调整」。每一轮压缩都在做有损压缩，损失会累积。缓解办法是：<strong>在任务边界主动压缩，而不是等到预算爆掉；在摘要提示词里把「用户目标」放在第一位；关键约束不要只依赖摘要，放进 <code>AGENTS.md</code> 或记忆。</strong>

几个观察：
<ul>
<li><strong>压缩不是均匀发生的。</strong> 第 10 轮之前一直在增长，第 10 轮一次掉回 32,000，然后重新增长。</li>
<li><strong>压缩后不是「很小」，而是「大约最近 10 条 + 摘要」。</strong> 最近 10 条可能就有 20,000–30,000 字符，加上摘要 2,000，就是 30,000 左右。</li>
<li><strong>总输入成本远大于最后的消息数。</strong> 每一轮都要重发当时的历史。前 9 轮的平均历史约 60,000 字符，9 轮就是 540,000 字符的输入；压缩后又要重新累积。</li>
<li><strong>压缩只能降低单次请求大小，不能降低总成本。</strong> 总成本是各轮历史之和，压缩把曲线压下去一次，但曲线还会继续涨。</li>

<hr>
<h2>七个常见上下文陷阱</h2>
<div class="table-scroll"><table>
<thead>
<tr>
<th>陷阱</th>
<th>症状</th>
<th>正确做法</th>
</tr>
</thead>
<tbody>
<tr>
<td>只截断，不留痕</td>
<td>模型以为结果完整，基于缺失信息行动</td>
<td>每条截断都带 <code>omitted</code> / <code>truncated</code> 说明</td>
</tr>
<tr>
<td>在 UTF-8 中间截断</td>
<td>Rust panic，或者输出乱码</td>
<td>退到 <code>is_char_boundary</code></td>
</tr>
<tr>
<td>按「最近 N 轮」保留</td>
<td>一轮调 5 个工具，保留 10 轮就是 70 条</td>
<td>按消息条数保留</td>
</tr>
<tr>
<td>切点落在 tool 上</td>
<td>历史出现孤立工具结果，API 400</td>
<td>切点后移到非 tool 消息</td>
</tr>
<tr>
<td>摘要包含完整工具参数</td>
<td>摘要输入膨胀，甚至超过摘要器窗口</td>
<td>只取 content，或显式渲染关键字段</td>
</tr>
<tr>
<td>每轮追加记忆块</td>
<td>系统消息线性增长</td>
<td>按标记整体替换</td>
</tr>
<tr>
<td>纯聊天不触发压缩</td>
<td>长对话没有工具调用，历史只增不减</td>
<td>定期 <code>/compact</code>，或把压缩移到每次请求前</td>
</tr>
</tbody>
</table></div>

最后一条值得展开。<code>compact</code> 的调用点在工具结果回填之后；如果一轮对话没有工具调用，循环在 <code>turn.tool_calls.is_empty()</code> 处就 <code>break</code> 了，根本走不到 <code>compact</code>。所以纯聊天会话不会自动压缩，直到某一轮调用了工具，或者用户手动执行 <code>/compact</code>。

这是一个真实的边界。对 coding agent 来说，长任务几乎都伴随工具调用，所以影响不大；但如果你把 NanoHermes 当纯聊天用，就要知道这个限制。

还有一个更隐蔽的陷阱：<strong>把压缩当成「删除」</strong>。压缩不是删除，是替换成摘要；摘要本身也在上下文里占体积。如果摘要写得比原文还长，压缩就变成了负优化。300 词的上限就是防止这件事。
<hr>
<h2>如何验证压缩没有坏</h2>

压缩是少数「看起来跑通了，其实已经坏了」的机制。它不会立刻报错，模型会在几轮之后开始重复劳动或答非所问。

可以用下面这组检查。
<div class="table-scroll"><table>
<thead>
<tr>
<th>检查</th>
<th>方法</th>
<th>期望</th>
</tr>
</thead>
<tbody>
<tr>
<td>历史合法性</td>
<td>检查每条 tool 消息前是否有对应 <code>tool_call_id</code> 的 assistant 调用</td>
<td>一一配对</td>
</tr>
<tr>
<td>切点合法性</td>
<td>压缩后第一条非系统消息不是 tool</td>
<td>不是 tool</td>
</tr>
<tr>
<td>摘要存在</td>
<td>压缩后 <code>messages[1]</code> 是 system 摘要或占位说明</td>
<td>存在</td>
</tr>
<tr>
<td>预算生效</td>
<td>压缩后序列化总字符 &lt; 120,000</td>
<td>小于预算</td>
</tr>
<tr>
<td>最近消息完整</td>
<td>最近 10 条与原历史尾部一致</td>
<td>未被改写</td>
</tr>
<tr>
<td>模型知道目标</td>
<td>压缩后问「我们在做什么」</td>
<td>能答出目标与当前状态</td>
</tr>
<tr>
<td>模型知道路径</td>
<td>问「改过哪些文件」</td>
<td>能答出关键路径</td>
</tr>
</tbody>
</table></div>

其中「模型知道目标」和「知道路径」是最实用的两项。它们直接检验摘要提示词的四类信息有没有被保留。如果模型答不出，说明摘要丢了关键内容，应该调整摘要提示词，而不是继续压缩。

自动化测试也可以覆盖前五项。NanoHermes 的 <code>memory.rs</code> 里有 <code>block_round_trip_replaces_instead_of_accumulating</code> 这样的测试，验证记忆块替换而不是追加；<code>compact</code> 也可以写类似的测试：构造 20 条消息，强制压缩，断言系统消息还在、最近 10 条没变、中间多了一条摘要、没有孤立 tool。
<hr>
<h2>收尾：下一篇讲记忆</h2>

上下文解决的是「这一次请求带什么」，记忆解决的是「下一次会话还记得什么」。

两者共享同一个约束：<strong>体积有限，必须选择。</strong> 上下文的选择发生在每一轮，记忆的选择发生在会话结束和下一次会话开始。上下文用 120,000 字符的预算和 10 条最近消息；记忆用 4 条、2,400 字符的注入预算，以及 500 条、每条 400 字符的存储上限。

下一篇《Agent 记忆：不接向量库也能长期记忆》会拆开 <code>memory.rs</code>：BM25 怎么打分、中英文怎么分词、记忆怎么从对话里提炼、为什么用标记替换而不是追加、以及「不接向量库」到底损失了什么。
