    <div id="app"></div>
    <noscript><div class="ns-article"><h1>【LC 82】删除排序链表中的重复元素 II：为什么头节点这里必须有个 dummy</h1><div class="ns-meta">2026/9/23 · Zhou Jun</div><div class="markdown-body"><blockquote>

<strong>适用读者</strong>：做过 LC 83（保留一个），觉得"删重复"已经会了，然后被这题的一个都别留卡住的人
<strong>技术栈</strong>：Python 为主，附 Java 版
<strong>难度</strong>：中等（代码 15 行，但 <code>prev</code> 到底什么时候前进，是最容易写错的地方）
<strong>收获</strong>：dummy 哨兵「到底在解决什么问题」的准确答案，以及 prev / curr 这对指针的推进规则
</blockquote>
<h2>题目</h2>

给你一个已排序的链表的头 <code>head</code>，<strong>删除原始链表中所有重复数字的节点，只留下不同的数字</strong>。
<div class="codehilite"><pre><span></span><code>输入：head = [1,2,3,3,4,4,5]
输出：[1,2,5]
解释：3 和 4 都出现过重复，所以它们一个都不留

输入：head = [1,1,1,2,3]
输出：[2,3]
解释：1 出现了三次，全删；2、3 各只出现一次，保留
</code></pre></div>


注意加粗那句：<strong>出现过重复的值，一个都不留</strong>。这跟 LC 83 是两回事 —— 83 是"每个值留一个"，结果会是 <code>[1,2,3,3,4,4,5] → [1,2,3,4,5]</code>。82 要的是 <code>[1,2,5]</code>。
<blockquote>

出处备注：暑期实习面经里高频出现。这题被选中的原因往往是它和 LC 83 只差一行条件，用来快速分辨"真理解指针"还是"记得模板"。
</blockquote>

链表节点的定义，沿用前几篇：
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">ListNode</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">val</span><span class="o">=</span><span class="mi">0</span><span class="p">,</span> <span class="nb">next</span><span class="o">=</span><span class="kc">None</span><span class="p">):</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">val</span> <span class="o">=</span> <span class="n">val</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="nb">next</span>
</code></pre></div>

<hr>
<h2>一、先想清楚：为什么这题比 LC 83 难</h2>
<h3>1.1 排序这个条件给了什么</h3>

链表已经排好序，所以<strong>重复的元素一定挨在一起</strong>。不需要哈希表去统计每个值出现几次，只要顺着走，看到"当前节点和下一个节点值相同"就知道碰上重复了。

这是这题唯一一个"送分"的地方：<strong>判重不用回看，只看邻位</strong>，<code>O(1)</code> 空间是白送的。
<h3>1.2 真正的难点：删除需要前驱</h3>

删除一个节点 <code>x</code>，在单链表里只有一种做法：
<div class="codehilite"><pre><span></span><code><span class="n">x</span> <span class="n">的前驱</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">x</span><span class="o">.</span><span class="n">next</span>
</code></pre></div>


也就是说，<strong>要删一个节点，你必须先拿到它的前驱</strong>。

现在问题来了：LC 83 里，重复时保留第一个、删后面几个 —— 被删的节点总是有前驱的（前驱就是保留下来的那个）。所以 LC 83 里 <code>prev</code> 永远安全。

但 82 要"一个都不留"：重复段里的<strong>第一个节点也要删</strong>。而那一段的第一个节点，它的前驱可能是……<strong>原来的 head 自己</strong>。

最极端的例子：
<div class="codehilite"><pre><span></span><code>输入：1 → 1 → 2
输出：2
</code></pre></div>


这里 <code>head</code> 本身（第一个 <code>1</code>）就要被删掉。可 <code>head</code> 没有前驱 —— 你没法执行 <code>head 的前驱.next = head.next</code>，因为 <code>head 的前驱</code> 根本不存在。
<h3>1.3 dummy 哨兵：给头节点一个人造的"前驱"</h3>

解法是<strong>在头节点前面架一个假的节点</strong>：
<div class="codehilite"><pre><span></span><code>dummy → 1 → 1 → 2
</code></pre></div>


现在 <code>dummy</code> 就是头节点的前驱了，删第一个 <code>1</code> 变成一次普通的删除操作：<code>dummy.next = 1.next</code>。<strong>没有一个节点是特殊的</strong>。
<div class="codehilite"><pre><span></span><code><span class="n">dummy</span> <span class="o">=</span> <span class="n">ListNode</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span>
<span class="n">dummy</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">head</span>
<span class="o">...</span>
<span class="k">return</span> <span class="n">dummy</span><span class="o">.</span><span class="n">next</span>      <span class="c1"># 返回 dummy.next，而不是 head</span>
</code></pre></div>


两个必须记住的细节：
<ul>
<li><strong>返回 <code>dummy.next</code> 而不是 <code>head</code></strong>。因为 <code>head</code> 自己可能已经被摘掉了，那时 <code>head</code> 指向的是一个已经脱离链表的孤儿节点。<code>dummy.next</code> 才永远是正确的答案。</li>
<li><strong><code>dummy</code> 的值随便填</strong>。它不参与比较，<code>0</code> 只是习惯（有些题解用 <code>-1</code>；如果值域可能到 <code>-1</code>，用一个足够小的负数更稳）。</li>
</ul>
<blockquote>

顺便说一句：LC 19（删除倒数第 N 个）也用了 dummy，但那题的理由是"可能要删头节点"。<strong>同一个技巧，同一个动机</strong> —— 只要你意识到"操作可能落到头节点上"，就该条件反射地架一个 dummy。
</blockquote>
<hr>
<h2>二、双指针的推进规则（这一步最容易写错）</h2>

架好 dummy 之后，需要两个指针：
<ul>
<li><code>prev</code>：已经确认安全的节点的尾巴，也就是"最后一个<strong>确定要保留</strong>的节点"；</li>
<li><code>curr</code>：正在检查的位置。</li>
</ul>

主循环的骨架长这样：
<div class="codehilite"><pre><span></span><code><span class="n">prev</span><span class="p">,</span> <span class="n">curr</span> <span class="o">=</span> <span class="n">dummy</span><span class="p">,</span> <span class="n">head</span>
<span class="k">while</span> <span class="n">curr</span><span class="p">:</span>
    <span class="k">if</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
        <span class="c1"># 发现重复 —— 这里要整段跳掉</span>
        <span class="o">...</span>
    <span class="k">else</span><span class="p">:</span>
        <span class="n">prev</span> <span class="o">=</span> <span class="n">curr</span>
        <span class="n">curr</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span>
</code></pre></div>


<strong>关键在 <code>else</code> 那一支：只有确认 <code>curr</code> 不属于任何重复段时，<code>prev</code> 才跟着前进。</strong>

为什么？因为一旦发现重复，<code>curr</code> 会被推着往前跑（去跳过整段），而 <code>prev</code> 必须<strong>钉在原地</strong> —— 它是那一段的"接回点"。等 <code>curr</code> 跑出重复段了，用 <code>prev.next = curr</code> 一次把中间那整段摘掉。

如果 <code>prev</code> 跟着一起推，中间那几个被摘掉的节点就会出现在 <code>prev</code> 和 <code>curr</code> 之间，<code>prev.next = curr</code> 之后链表里还挂着半截垃圾。
<h3>2.1 发现重复之后做什么</h3>
<div class="codehilite"><pre><span></span><code><span class="k">if</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
    <span class="n">dup_val</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span>
    <span class="k">while</span> <span class="n">curr</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">dup_val</span><span class="p">:</span>
        <span class="n">curr</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span>        <span class="c1"># curr 一路冲到重复段之外</span>
    <span class="n">prev</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">curr</span>            <span class="c1"># 一次接上，中间整段被摘出</span>
</code></pre></div>


注意这里<strong>没有</strong> <code>prev = prev.next</code>。<code>prev</code> 就是不动。

内层 <code>while curr and curr.val == dup_val</code> 里那个 <code>curr and</code> 不能省：如果重复段一直延伸到链表末尾（比如 <code>1 → 2 → 2</code>），<code>curr</code> 会一路跑到 <code>None</code>，没有 <code>curr and</code> 就会在 <code>curr.val</code> 上抛 <code>AttributeError</code>。
<h3>2.2 为什么内层用「值」比较就够了</h3>

<code>curr.val == dup_val</code> 比的是<strong>值</strong>，不是节点 —— 这和 LC 160 相交链表里"必须比引用"正好相反，值得对照记一下：
<table>
<thead>
<tr>
<th>题</th>
<th>判据</th>
<th>为什么</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>LC 160</strong> 相交链表</td>
<td>必须比<strong>节点引用</strong></td>
<td>"共享同一批节点"是引用层面的关系，值相同不算</td>
</tr>
<tr>
<td><strong>LC 82</strong> 删除重复</td>
<td>比<strong>值</strong>就够了</td>
<td>题目要求删的就是"重复数字"，判据本身就是值</td>
</tr>
</tbody>
</table>

判据永远跟着<strong>题目在问什么</strong>走，别背成一条死规则。
<h3>2.3 完整代码</h3>
<div class="codehilite"><pre><span></span><code><span class="k">class</span><span class="w"> </span><span class="nc">Solution</span><span class="p">:</span>
    <span class="k">def</span><span class="w"> </span><span class="nf">deleteDuplicates</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">head</span><span class="p">:</span> <span class="n">Optional</span><span class="p">[</span><span class="n">ListNode</span><span class="p">])</span> <span class="o">-&gt;</span> <span class="n">Optional</span><span class="p">[</span><span class="n">ListNode</span><span class="p">]:</span>
        <span class="n">dummy</span> <span class="o">=</span> <span class="n">ListNode</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="n">head</span><span class="p">)</span>       <span class="c1"># 给头节点造一个前驱</span>
        <span class="n">prev</span><span class="p">,</span> <span class="n">curr</span> <span class="o">=</span> <span class="n">dummy</span><span class="p">,</span> <span class="n">head</span>

        <span class="k">while</span> <span class="n">curr</span><span class="p">:</span>
            <span class="c1"># 发现重复：curr 和下一个值相同</span>
            <span class="k">if</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
                <span class="n">dup_val</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span>
                <span class="k">while</span> <span class="n">curr</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">dup_val</span><span class="p">:</span>

                <span class="n">prev</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">curr</span>         <span class="c1"># 一次摘掉整段；prev 不动</span>
            <span class="k">else</span><span class="p">:</span>

<h2>三、动画：看着 prev 停在原地等</h2>

下面这个动画把 <code>1 → 2 → 3 → 3 → 4 → 4 → 5</code> 的全程拆成 15 帧。留意三件事：
<ul>
<li><strong>最左边那个虚线框是 dummy</strong>：它在内存里并不存在，是解法凭空造出来的前驱。整条链的实际起点是它右边的 <code>1</code>；</li>
<li><strong>橙色的框是"当前这段重复"</strong>：被框住的节点一会儿要被整段摘掉。框里节点上面那条橙线（<code>curr</code>）会往右跑，而下面那条绿线（<code>prev</code>）<strong>一动不动</strong> —— 这个错位就是本题的全部难点；</li>
<li><strong>摘链那一帧</strong>：<code>prev</code> 伸出一条橙色虚线弧，跨过整段重复节点落到 <code>curr</code> 上，那条弧就是 <code>prev.next = curr</code> 这个赋值。被摘的节点同时变灰、被打上删除线。</li>
</ul>

面经里的变体是：<strong>保留重复元素只留一个</strong>，<code>1→1→1→2→3→3→4</code> 变成 <code>1→2→3→4</code>。

注意它是"重复过的值留一个、没重复过的值照常留"，不是"每个值都留一个"（后者是 LC 83）。对 <code>1,1,1,2,3,3,4</code> 来说两者恰好结果不同：

改法只有一处：<strong>接回去的时候不要接到 <code>curr</code>，接到重复段的最后一个节点上</strong>。

        <span class="n">dummy</span> <span class="o">=</span> <span class="n">ListNode</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="n">head</span><span class="p">)</span>
        <span class="n">prev</span><span class="p">,</span> <span class="n">curr</span> <span class="o">=</span> <span class="n">dummy</span><span class="p">,</span> <span class="n">head</span>

        <span class="k">while</span> <span class="n">curr</span><span class="p">:</span>
            <span class="k">if</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
                <span class="n">dup_val</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span>
                <span class="n">last</span> <span class="o">=</span> <span class="n">curr</span>                  <span class="c1"># 记住这一段的最后一个</span>
                <span class="k">while</span> <span class="n">curr</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">dup_val</span><span class="p">:</span>
                    <span class="n">last</span> <span class="o">=</span> <span class="n">curr</span>              <span class="c1"># 一路更新，&quot;最后&quot;自然浮出来</span>
                    <span class="n">curr</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span>
                <span class="n">prev</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">last</span>             <span class="c1"># ★ 唯一的改动：接 last 而不是 curr</span>
                <span class="n">prev</span> <span class="o">=</span> <span class="n">last</span>                  <span class="c1"># prev 也落到这个保留节点上</span>

<td><code>[1,1,2]</code></td>
<td><code>[2]</code></td>
<td><strong>头节点被删</strong> —— dummy 在这里救命</td>
</tr>
<tr>
<td><code>[1,2,2]</code></td>
<td><code>[1]</code></td>
<td><strong>尾节点被删</strong> —— 内层 <code>curr and</code> 在这里救命</td>
</tr>
<tr>
<td><code>[1,2,3]</code></td>
<td><code>[1,2,3]</code></td>
<td>完全无重复，原样返回</td>
</tr>
<tr>
<td><code>[1,1,2,2]</code></td>
<td><code>[]</code></td>
<td>两段重复，全删</td>
</tr>
<tr>
<td><code>[1,2,2,3,3,4]</code></td>
<td><code>[1,4]</code></td>
<td>中间两段重复</td>
</tr>
</tbody>
</table>

两个"救命"的点值得单独记：
<ul>
<li><strong><code>[1,1,2]</code></strong> 验证 <strong>dummy 必要性</strong>：删除动作落在头节点上，<code>prev</code> 是 dummy。把 dummy 去掉、直接 <code>prev = head</code> 起手，这个用例就会崩。</li>
<li><strong><code>[1,2,2]</code></strong> 验证 <strong>内层 <code>while curr and ...</code> 的 <code>curr and</code></strong>：重复段延伸到链表末尾，<code>curr</code> 会走到 <code>None</code>。漏掉这个判断，<code>curr.val</code> 直接 <code>AttributeError</code>（Java 里是 <code>NullPointerException</code>）。</li>
</ul>
<hr>
<h2>八、复杂度</h2>
<ul>
<li><strong>时间 <code>O(n)</code></strong>：外层 <code>while curr</code> 让 <code>curr</code> 从左到右走一遍；内层的 <code>while curr and curr.val == dup_val</code> 也在推同一个 <code>curr</code>，<strong>不是嵌套的独立循环</strong> —— 每个节点在整个过程中最多被 <code>curr</code> 访问一次。加起来仍是 <code>O(n)</code>。</li>
<li><strong>空间 <code>O(1)</code></strong>：只多了 <code>dummy</code>、<code>prev</code>、<code>curr</code> 三个变量（Java 里还有内层的 <code>dupVal</code>）。没有哈希表、没有递归栈。</li>
</ul>
<blockquote>

那个"内层循环为什么不算嵌套"是很好的加分点。判断方法：看内层循环有没有用到<strong>外层之外的独立游标</strong>。这里内层推的就是外层的 <code>curr</code>，所以是"同一个指针多走几步"，摊还下来仍是线性。
</blockquote>
<hr>
<h2>九、常见坑</h2>

<strong>1. 忘了 dummy，或者返回了 <code>head</code>。</strong>
<div class="codehilite"><pre><span></span><code><span class="n">prev</span><span class="p">,</span> <span class="n">curr</span> <span class="o">=</span> <span class="n">head</span><span class="p">,</span> <span class="n">head</span>      <span class="c1"># 错的！head 自己要被删时无从下手</span>
<span class="o">...</span>
<span class="k">return</span> <span class="n">head</span>                  <span class="c1"># 错的！head 可能已经是孤儿节点</span>
</code></pre></div>


这是这题第一大坑。判断标准很简单：<strong>只要删除动作可能落在头节点上，就必须架 dummy，且返回 <code>dummy.next</code></strong>。

<strong>2. <code>prev</code> 在重复时跟着 <code>curr</code> 一起前进了。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">if</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
    <span class="k">while</span> <span class="n">curr</span> <span class="ow">and</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span><span class="p">:</span>
        <span class="n">prev</span> <span class="o">=</span> <span class="n">curr</span>          <span class="c1"># 错的！prev 不该动</span>
        <span class="n">curr</span> <span class="o">=</span> <span class="n">curr</span><span class="o">.</span><span class="n">next</span>
    <span class="n">prev</span><span class="o">.</span><span class="n">next</span> <span class="o">=</span> <span class="n">curr</span>
</code></pre></div>


<code>prev</code> 是"接回点"，必须留在重复段的<strong>前一个</strong>位置。跟着推进的话，中间几个被摘节点会卡在 <code>prev</code> 和 <code>curr</code> 之间。

<strong>3. 内层循环漏掉 <code>curr and</code>。</strong>
<div class="codehilite"><pre><span></span><code><span class="k">while</span> <span class="n">curr</span><span class="o">.</span><span class="n">val</span> <span class="o">==</span> <span class="n">dup_val</span><span class="p">:</span>    <span class="c1"># 错的！重复段到末尾时 curr 变 None，直接崩</span>
</code></pre></div>


必须写成 <code>while curr and curr.val == dup_val</code>。

<strong>4. 把重复段的判据写成"值在整条链里出现过"。</strong>
<div class="codehilite"><pre><span></span><code><span class="n">seen</span> <span class="o">=</span> <span class="nb">set</span><span class="p">()</span>                 <span class="c1"># 错的！这不是 82 的语义</span>
<span class="k">for</span> <span class="n">node</span> <span class="ow">in</span> <span class="o">...</span><span class="p">:</span>
    <span class="k">if</span> <span class="n">node</span><span class="o">.</span><span class="n">val</span> <span class="ow">in</span> <span class="n">seen</span><span class="p">:</span> <span class="o">...</span>
</code></pre></div>


排序链表上判重<strong>只看邻位就够</strong>，不需要统计全局。写成全局统计既慢（要开 <code>O(n)</code> 空间）又容易把 82（全删）和 83（留一个）搞混。

<strong>5. 和 LC 83 的条件搞混。</strong>
<table>
<thead>
<tr>
<th>题</th>
<th>发现重复时</th>
<th>结果</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>LC 83</strong></td>
<td><code>prev.next = curr.next</code>（删当前）</td>
<td>每个值留一个</td>
</tr>
<tr>
<td><strong>LC 82</strong></td>
<td>整段跳到段外，再 <code>prev.next = curr</code></td>
<td>重复值一个不留</td>
</tr>
</tbody>
</table>

记法：<strong>83 是"踩掉重复的那一个"，82 是"整段铲走"</strong>。82 多了一层"先找到段尾"的循环，代码长一点，语义干净得多。

<strong>6. 忘了这题不用递归。</strong>

递归写链表题很省事，但这题递归要处理的"当前节点是否属于重复段"需要向前看、还要正确回接，写出来比迭代绕得多。而且递归栈是 <code>O(n)</code>，虽然题目没要求 <code>O(1)</code>，但迭代版本来就更短更清晰。
<hr>
<h2>十、面试怎么答</h2>

<strong>开口 30 秒给思路</strong>（别一上来就写代码）：
<blockquote>

链表已经排序，所以重复的一定挨在一起，判重只看邻位就行。难点是"重复的节点一个都不留"，意味着重复段的第一个节点也要删 —— 而它可能是头节点，头节点没有前驱。所以先在头上架一个 dummy 当它的人造前驱。然后双指针：<code>prev</code> 是"最后一个确定保留的节点"，<code>curr</code> 往前探。发现 <code>curr.val == curr.next.val</code> 就记住这个值，让 <code>curr</code> 一路跳到重复段之外，再 <code>prev.next = curr</code> 一次把整段摘掉 —— 这一步 <code>prev</code> 不能动。没重复的时候才 <code>prev = curr</code> 一起前进。最后返回 <code>dummy.next</code>。时间 O(n)，空间 O(1)。
</blockquote>

<strong>然后主动交代三个易错点</strong> —— 这是区分"背过答案"和"真懂"的地方：
<ol>
<li><strong>dummy 是为了让"删头节点"变成一次普通删除</strong>，返回必须用 <code>dummy.next</code>；</li>
<li><strong><code>prev</code> 只在确认 <code>curr</code> 不属于重复段时才前进</strong>，摘链时它必须停在重复段前面；</li>
<li><strong>内层循环要写 <code>while curr and curr.val == dup_val</code></strong>，重复段拖到末尾时 <code>curr</code> 会变 <code>None</code>。</li>
</ol>

<strong>追问应对</strong>：
<ul>
<li><em>"内层那个 while 不会让复杂度变成 O(n²) 吗？"</em> —— 不会。内外两层推的是<strong>同一个 <code>curr</code></strong>，每个节点只被访问一次，摊还是 <code>O(n)</code>。</li>
<li><em>"能不用 dummy 吗？"</em> —— 能，但要单独处理"头节点开始的重复段"：先用一个 while 把头部的重复整段删掉，再进入主循环。多一段特判代码，不如 dummy 干净。</li>
<li><em>"如果要求重复的留一个呢？"</em> —— 接回的时候接 <code>last</code>（重复段最后一个节点）而不是 <code>curr</code>，其余不变。这就是那个阿里变体。</li>
<li><em>"复杂度为什么不是 O(n) 空间？"</em> —— 排序保证重复相邻，所以不需要哈希表统计；全程只有三个指针变量。</li>
<li><em>"这题和 LC 83 的区别？"</em> —— 83 每个值留一个（<code>prev.next = curr.next</code>），82 重复的一个不留（整段跳到段外）。82 多了找段尾的内层循环。</li>
</ul>

这题最值得带走的东西，不是那 15 行代码，而是这个反射：
<blockquote>

<strong>看到"可能要删头节点"，先架 dummy。</strong>
</blockquote>

同样的反射在 LC 19 上是"可能要删头节点"，在 LC 143、234 上是"可能要断开/反转后半段"。链表题的很多麻烦，都是在处理"边界节点没有前驱/没有后继"这类结构缺陷 —— 而<strong>造一个假节点</strong>，往往是成本最低的通用解法。
<div class="codehilite"><pre><span></span><code>dummy → 1 → 1 → 2
        ↑
   head 没有前驱，删不动；
   给它一个 dummy，就删得动了。
</code></pre></div>
