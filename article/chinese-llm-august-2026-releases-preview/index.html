    <noscript><div class="ns-article"><h1>八月攻势：2026 年 8 月国产大模型发布前瞻</h1><div class="ns-meta">2026/8/3 · Zhou Jun</div><div class="markdown-body"><h1>八月攻势：2026 年 8 月国产大模型发布前瞻</h1>

<img alt="国产大模型八月攻势" src="https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=1600&amp;q=80&amp;auto=format&amp;fit=crop">
<blockquote>

7 月底国产大模型"集体交作业"，8 月的日程表又已经排满：DeepSeek V4-Pro 正式版被多方信号指向 8 月 3 日，智谱 GLM-5.3、MiniMax M3Pro 被券商列为重要催化。当参数竞赛重回 2 万亿时代、OpenRouter 调用量前五全是国产模型时，这个 8 月的每一场发布会都值得看。
</blockquote>
<hr>
<h2>引言：没有休赛期的 AI 战场</h2>

2026 年的日历对国产大模型厂商来说没有淡季。7 月 31 日刚上演"三连发"——MiniMax H3、字节 Seedance 2.5、DeepSeek V4-Flash 正式版同一天亮相；一周前的 7 月 27 日，月之暗面开源了全球参数最大的 Kimi K3。而根据多家券商研报与行业信号，<strong>8 月的发布清单同样密集：DeepSeek V4-Pro 正式版、智谱 GLM-5.3、MiniMax M3Pro</strong> 均已进入倒计时。

本文结合 7 月底的最新动态与市场信号，盘点 8 月最值得期待的国产大模型发布，以及它们背后的行业趋势。
<hr>
<h2>一、焦点之役：DeepSeek V4-Pro 正式版</h2>

如果说 8 月有一场"必看发布会"，那一定是 DeepSeek。

<strong>时间信号指向 8 月 3 日。</strong> 官方在 7 月 31 日上线 V4-Flash 正式版 API 公测时，明确预告 V4-Pro 将于<strong>8 月初</strong>正式发布。多个外部信号进一步佐证了这一节奏：
<ul>
<li><strong>硅基流动在 8 月 3 日大幅上调 V4 Pro 缓存命中价格</strong>：从每百万 Token 0.1 元涨至 1.0 元，十倍涨幅被业界普遍解读为正式版上线前的"定价准备"；</li>
<li>开发者社区发现部分 DeepSeek API 已能正确回答此前答不上的题目——灰度测试正在分批放量；</li>
<li>此前 V4 正式版原定 7 月中旬发布、一度跳票，如今"这次不等太久"。</li>
</ul>

<strong>性能预期</strong>：外界普遍认为 V4 正式版的能力将落在 GLM-5.2 与 Claude Opus 4.8 之间。作为参照，7 月 31 日公测的 V4-Flash（284B 总参 / 13B 激活）已在 Agent 与代码能力上大幅升级：Terminal Bench 2.1 得分 82.7，原生支持 Responses API 并适配 Codex，定价为国产前沿模型最低。

<strong>彩蛋</strong>：DeepSeek 官方 AI 编程工具 <strong>Harness</strong> 已开启内测，据报将大概率与 V4-Pro 正式版一同亮相。配合刚完成的约 510 亿元 A 轮融资（估值近 4000 亿元），V4-Pro 的发布节奏与商业化组合拳值得重点关注。
<hr>
<h2>二、券商研报里的下一棒：GLM-5.3 与 MiniMax M3Pro</h2>

市场将 8 月的另外两个高权重变量押在了智谱和 MiniMax 身上。
<ul>
<li><strong>智谱 GLM-5.3</strong>：浙商证券在周报中明确指出，大模型版本迭代（智谱 GLM-5.3、MiniMax M3Pro）是后续重要的板块催化。智谱 6 月刚上线 GLM-5.2（支持 1M 无损上下文），其编程模型在多个榜单中被评为 SOTA，GLM-5.3 的升级方向大概率继续押注长上下文与编程/Agent 能力。</li>
<li><strong>MiniMax M3Pro</strong>：MiniMax 于 7 月 31 日发布了首款开源全模态生成模型 H3，而下一代旗舰 M3Pro 据报参数量将<strong>超过 2 万亿</strong>。此外，MiniMax 预计 8 月满足条件并正式<strong>纳入港股通</strong>——资本市场的催化与产品发布同频，意图明显。</li>
</ul>

开源证券同样在研报中提及"V4-Pro 正式版将会尽快发布"，把 DeepSeek 的节奏与上述两家并列为核心观察点。
<hr>
<h2>三、背景板：7 月 31 日的"集体交作业"</h2>

8 月的期待建立在 7 月底的高密度发布之上。回顾这波"集体交作业"：
<table>
<thead>
<tr>
<th>模型</th>
<th>厂商</th>
<th>亮点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>MiniMax H3</strong></td>
<td>MiniMax</td>
<td>首款开源全模态生成模型，统一文本/图像/音频/视频，直出 2K、最长 15 秒音画视频，视频编辑榜单全球第一，价格为同类旗舰约 1/3，近期开放权重</td>
</tr>
<tr>
<td><strong>Seedance 2.5</strong></td>
<td>字节跳动</td>
<td>单次生成从 15 秒翻倍到 30 秒，支持多轮延长，一次最多输入 30 张图 / 10 段视频 / 10 段音频做多模态参考，主打长叙事与时间戳精准编辑</td>
</tr>
<tr>
<td><strong>V4-Flash 正式版</strong></td>
<td>DeepSeek</td>
<td>Agent/代码能力大幅升级，Terminal Bench 2.1 得分 82.7，原生 Responses API、适配 Codex，国产前沿最低价</td>
</tr>

</table>

再往前一周：<strong>Kimi K3</strong>（2.78 万亿参数，全球最大开源模型，发布一小时内登顶 Hugging Face 总趋势榜）、<strong>Qwen3.8 Max</strong>（约 2.4 万亿参数）、<strong>腾讯混元 Hy3</strong>（MoE 295B 总参/激活 21B，256K 上下文，上线一周调用量暴涨 68 倍）相继落地。
<hr>
<h2>四、更大的图景：参数竞赛重启，2 万亿成标配</h2>

把这些名字放在一起，一个信号非常清晰——<strong>参数竞赛正式回归</strong>。

据《经济观察报》报道，中国头部大模型厂商集体冲击 2 万亿以上参数：Kimi K3（2.78 万亿）、Qwen3.8 Max（2.4 万亿）、文心 5.0（2.4 万亿）、MiniMax 下一代（2 万亿+）——<strong>2 万亿已是入场券，3 万亿被看作下一站</strong>。

与参数同步转向的还有技术重心：长程任务、Coding、Agentic 与多模态成为四大方向。V4-Flash 对 Agent 的强化、GLM 的编程 SOTA、H3 的全模态统一，都是这一转向的具体注脚。
<hr>
<h2>五、全球领跑：OpenRouter 前五全是国产模型</h2>

"国产模型能打吗"这个问题，在 2026 年 8 月的答案已经变成数据事实：
<ul>
<li><strong>OpenRouter 调用量榜单前五全部由中国企业包揽</strong>：小米 MiMo-V2.5 以单周 10.5 万亿 Tokens 登顶（周榜、月榜双第一，两个月增长六倍多），DeepSeek 两款模型分列第二、第五，腾讯混元 Hy3 位列第三、单周环比增幅超 999%；</li>
<li><strong>Hugging Face 下载量</strong>：中国开源模型累计下载量居全球第一，阿里千问系列以超 10 亿次下载排名榜首；</li>
<li>一个常被引用的数据：<strong>80% 的美国 AI 初创公司在融资路演中使用中国开源模型</strong>，平均每天有超 200 个基于中国大模型的衍生模型出现。</li>
</ul>

8 月的每一场发布，都会直接改写这张榜单。
<hr>
<h2>六、降价与开源：让 AI 从"可用"到"易用"</h2>

与参数竞赛并行的另一条主线是<strong>降价 + 开源</strong>：
<ul>
<li>V4-Flash 以国产前沿模型的最低定价入场，硅基流动对 V4 Pro 缓存命中价的大幅上调，反而说明低价是"补贴换市场"的战略动作；</li>
<li>Kimi K3 完整权重于 7 月 27 日开放；MiniMax H3 成为首个开源的主流多模态生成模型并计划开放权重供企业本地部署；</li>
<li>机构观点认为，降价与开源正在推动 AI 从"可用"走向"易用"，企业级 AI 部署有望显著加速——大模型的竞争从"谁更强"蔓延到"谁更便宜、更好用"。</li>
</ul>
<hr>
<h2>七、算力底座：国产芯片的量产接力</h2>

模型发布密集的背后，是算力供给的国产化接力。招商证券国际研报指出，<strong>下半年国产芯片量产（如华为昇腾 950 系列）将是大模型效率的显著催化</strong>，推理成本有望继续下探。

基础设施也在同步补位：8 月 2 日，<strong>国家超算互联网正式上线 DeepSeek-V4-Flash-0731 的 API 调用服务与模型文件</strong>，该平台已成为全国首个十万卡级超智融合算力资源池，AI 社区累计汇集超 1700 款国内外开源大模型。算力、模型、平台的三重加速，为 8 月的密集发布提供了底气。
<hr>
<h2>结语：8 月注定热闹</h2>

回到开头的日程表：<strong>8 月 3 日</strong>可能是 DeepSeek V4-Pro 正式版的日子；其后 GLM-5.3、MiniMax M3Pro 蓄势待发；再加上国产芯片量产的催化、榜单数据的持续刷新——8 月的国产大模型战场，会有发布、有涨价、有开源、有融资，唯独没有休赛期。

发什么、发多大、多便宜，是这个月每场发布会都要回答的三个问题。
