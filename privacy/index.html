    <noscript><div class="ns-list"><h1>隐私政策</h1><p class="ns-lead">尘世栈帧的隐私政策 — 信息收集范围、Cookie 与第三方服务（Google AdSense、Google Analytics）的使用方式。</p>
<h2>适用范围</h2>
<p>本政策适用于 尘世栈帧（https://blog.zhoujun.dev）及其各栏目页面，说明本站如何收集、使用与保护访问者的信息。继续使用本站即表示你知悉本政策的内容。</p>
<h2>本站收集的信息</h2>
<p>阅读文章本身不需要注册或登录，本站不会为此收集任何个人身份信息。只有在你主动使用互动功能时，才会有信息被提交：</p>
<ul>
<li>发表评论：提交的昵称、邮箱、评论内容与提交时间。昵称会随评论公开显示，邮箱仅用于识别与回复，不会公开展示。</li>
<li>邮件订阅：你填写的邮箱地址，仅用于发送新文章通知，可随时通过邮件中的退订方式取消。</li>
<li>服务器日志：托管服务商（GitHub Pages、PythonAnywhere）会按惯例记录访问日志，其中可能包含 IP 地址、浏览器标识、请求时间等基础技术信息，用于故障排查与防范滥用。</li>
</ul>
<h2>Cookie 与本地存储</h2>
<p>本站自身不设置用于追踪的 Cookie。为提升打开速度，浏览器本地存储（localStorage）会缓存文章列表与界面偏好（例如明暗主题），这些数据只留在你的设备上，不会上传到本站服务器，也不用于广告画像。</p>
<p>本站使用 Service Worker 缓存静态资源以便离线或弱网访问，它同样不涉及个人信息。</p>
<h2>第三方服务与广告 Cookie</h2>
<p>本站可能使用以下第三方服务，它们各自会在你的浏览器中设置 Cookie 或读取设备信息：</p>
<ul>
<li><a href="https://www.google.com/settings/ads">Google AdSense：用于展示广告。Google 及其合作伙伴会使用 Cookie（包括 DoubleClick DART Cookie）根据你访问本站和其它网站的记录投放广告；你可以通过 Google 广告设置管理个性化广告，或通过 aboutads.info 了解并退出第三方广告 Cookie。</a></li>
<li>Google Analytics：用于统计页面访问量（如浏览量、来源渠道、设备类型）。该服务会设置分析类 Cookie，统计结果为聚合数据，本站不会将其与任何个人身份关联。</li>
<li>内容分发与图片服务：页面会从 jsdelivr 加载公式渲染脚本、从 Unsplash 加载配图，这些请求会把你的 IP 地址与浏览器标识暴露给对应服务商。</li>
</ul>
<h2>信息的使用目的</h2>
<p>收集到的信息只用于：展示与回复评论、发送你主动订阅的更新、防范垃圾评论与滥用、统计站点访问情况、展示广告以覆盖运营成本。本站不会出售、出租你的个人信息，也不会将其用于与上述目的无关的用途。</p>
<h2>共享与披露</h2>
<p>除上述第三方服务商按其自身隐私政策处理数据外，只有在法律要求、司法或行政机关依法定程序要求时，本站才会披露相应信息。</p>
<h2>数据保留与安全</h2>
<p>评论与订阅邮箱会保留至你要求删除或相关功能停止运营为止。本站通过 HTTPS 传输、最小化字段收集与访问控制来保护数据，但请理解：没有任何互联网传输与存储方式能保证绝对安全。</p>
<h2>你的权利</h2>
<p>你可以随时要求查询、更正或删除你提交的评论与订阅信息，也可以要求停止处理相关数据。通过上面的联系方式提出即可，本站会在合理期限内响应。若你位于欧洲经济区、英国或加利福尼亚州，你依当地法律（如 GDPR、CCPA）享有的访问、删除、反对处理等权利同样适用。</p>
<h2>儿童隐私</h2>
<p>本站面向具备独立判断能力的读者，不针对儿童设计，也不会主动收集儿童的个人信息。若监护人发现儿童向本站提交了信息，请联系我们删除。</p>
<h2>政策更新</h2>
<p>本政策可能随功能变化（例如正式启用广告或数据分析）而更新，更新后的版本会发布在本页面并修改顶部的更新日期。</p>

<p>如对本政策有任何疑问，请发送邮件至 no-reply@gmail.com。</p>
