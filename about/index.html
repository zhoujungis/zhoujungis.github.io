    <noscript><div class="ns-list"><h1>关于本站</h1><p class="ns-lead">尘世栈帧是一个个人技术博客 — 站点定位、技术实现与联系方式。</p>
<h2>这是什么</h2>
<p>尘世栈帧是 Stack Frame 的个人博客。内容主要围绕编程与工程实践：算法与数据结构、后端与前端工程、性能优化、AI 应用，以及偶尔出现的阅读与生活记录。这里没有转载聚合，也不追求更新频率，文章基本都来自实际做过的项目、踩过的坑和读过的源码。</p>
<p>站点刻意保持轻量：没有登录系统，不追踪读者，文章正文可以在关闭 JavaScript 的情况下以静态快照的形式被读到。</p>
<h2>技术实现</h2>
<p>前端是一个 Vue 3 单页应用，构建产物托管在 GitHub Pages；文章数据、评论与邮件订阅由部署在 PythonAnywhere 上的 Django 后端提供。构建阶段会为每篇文章和主要栏目生成静态 HTML，让搜索引擎与不执行 JavaScript 的抓取器也能读到正文。</p>
<p>文章中的算法可视化动效按需加载：只有当前文章真正包含某个动效时，对应的那几 KB 代码才会被请求，不会拖慢其它文章的打开速度。</p>
<h2>内容与版权</h2>
<p>站内文章除特别注明外均为原创，版权归作者所有。欢迎注明出处并附上原文链接的转载，禁止未经授权的商业使用。详情见免责声明页。</p>
