<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f5f6f7;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
          <!-- Header -->
          <tr>
            <td style="padding:28px 36px 0;">
              <p style="margin:0;font-size:13px;letter-spacing:1px;color:#9ca3af;text-transform:uppercase;">Stack Frame</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:16px 36px 28px;">
              <h1 style="margin:0 0 20px;font-size:22px;font-weight:600;color:#111827;line-height:1.4;">登录验证码</h1>
              <p style="margin:0 0 18px;font-size:15px;color:#4b5563;line-height:1.7;">你好，请在登录页面输入下面的验证码：</p>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#f3f4f6;border:1px solid #e5e7eb;border-radius:8px;padding:20px 16px;">
                    <span style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:30px;font-weight:600;letter-spacing:8px;color:#111827;">{{ code }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;font-size:14px;color:#6b7280;line-height:1.7;">
                验证码 <strong style="color:#111827;font-weight:600;">{{ ttl_minutes }} 分钟内</strong>有效，且只能使用一次。请勿转发给他人。
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:0 36px 28px;">
              <div style="border-top:1px solid #e5e7eb;padding-top:18px;">
                <p style="margin:0;font-size:12px;color:#9ca3af;line-height:1.8;">
                  如果不是你本人操作，直接忽略这封邮件即可，你的账号不会有任何变化。<br>
                  <a href="{{ site_url }}" style="color:#6b7280;text-decoration:none;">{{ site_url }}</a>
                </p>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
