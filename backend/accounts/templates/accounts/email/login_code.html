<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f7f7f2;font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f2;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #dce2da;border-radius:8px;">
          <!-- Header -->
          <tr>
            <td style="padding:28px 36px 0;">
              <p style="margin:0;font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#657168;">Stack Frame</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:16px 36px 28px;">
              <h1 style="margin:0 0 20px;font-size:22px;font-weight:600;color:#1f2a24;line-height:1.4;">登录验证码</h1>
              <p style="margin:0 0 18px;font-size:15px;color:#657168;line-height:1.8;">你好，请在登录页面输入下面的验证码：</p>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#ecefe8;border:1px solid #dce2da;border-radius:6px;padding:20px 16px;">
                    <span style="font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:8px;color:#1f2a24;">{{ code }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;font-size:14px;color:#657168;line-height:1.8;">
                验证码 <strong style="color:#1f2a24;font-weight:600;">{{ ttl_minutes }} 分钟内</strong>有效，且只能使用一次。请勿转发给他人。
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:0 36px 28px;">
              <div style="border-top:1px solid #dce2da;padding-top:18px;">
                <p style="margin:0;font-size:12px;color:#9aa39b;line-height:1.9;">
                  如果不是你本人操作，直接忽略这封邮件即可，你的账号不会有任何变化。<br>
                  <a href="{{ site_url }}" style="color:#3f6b57;text-decoration:none;">{{ site_url }}</a>
                </p>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
