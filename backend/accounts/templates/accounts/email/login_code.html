<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录验证码</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f2;font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif;">
  <!-- 预览文本：收件箱列表里先露出验证码用途，不把数字塞进标题 -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    你的登录验证码，{{ ttl_minutes }} 分钟内有效。
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f2;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #dce2da;border-top:4px solid #3f6b57;border-radius:8px;">
          <!-- Header -->
          <tr>
            <td style="padding:26px 36px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:10px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3f6b57;"></span>
                  </td>
                  <td>
                    <strong style="font-size:16px;font-weight:600;color:#1f2a24;letter-spacing:0.02em;">尘世栈帧</strong>
                    <span style="margin-left:8px;font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#3f6b57;">Stack Frame</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:22px 36px 30px;">
              <h1 style="margin:0 0 6px;font-size:24px;font-weight:600;color:#1f2a24;line-height:1.35;">登录验证码</h1>
              <div style="width:36px;height:3px;background:#3f6b57;border-radius:2px;margin:0 0 20px;"></div>
              <p style="margin:0 0 18px;font-size:15px;color:#657168;line-height:1.8;">你好，请在登录页面输入下面的验证码：</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#3f6b57;border-radius:8px;padding:24px 16px;">
                    <span style="font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:32px;font-weight:600;letter-spacing:8px;color:#ffffff;">{{ code }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;font-size:14px;color:#657168;line-height:1.8;">
                验证码 <strong style="color:#2f5544;font-weight:600;">{{ ttl_minutes }} 分钟内</strong>有效，且只能使用一次。请勿转发给他人。
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:0 36px 28px;">
              <div style="border-top:1px solid #dce2da;padding-top:18px;">
                <p style="margin:0;font-size:12px;color:#9aa39b;line-height:1.9;">
                  如果不是你本人操作，直接忽略这封邮件即可，你的账号不会有任何变化。<br>
                  <a href="{{ site_url }}" style="color:#3f6b57;text-decoration:none;">{{ site_url }}</a>
                </p>
              </div>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:11px;color:#9aa39b;line-height:1.7;">
          此邮件由系统自动发送，请勿直接回复。
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
