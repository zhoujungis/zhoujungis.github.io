<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#fff5f7;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#fff5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(255,133,162,0.12);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#ff85a2,#c9b1ff);padding:32px 40px;text-align:center;">
              <h1 style="margin:0;font-size:24px;color:#fff;font-weight:700;letter-spacing:2px;">ZhouJun's Blog</h1>
              <p style="margin:8px 0 0;font-size:14px;color:rgba(255,255,255,0.85);">新文章发布通知</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 40px;">
              <h2 style="margin:0 0 12px;font-size:20px;color:#4a3040;line-height:1.4;">
                📝 {{ title }}
              </h2>
              {% if excerpt %}
              <p style="margin:0 0 24px;font-size:15px;color:#9e7a8a;line-height:1.7;">
                {{ excerpt }}
              </p>
              {% endif %}
              <!-- CTA Button -->
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#81d4c4;border-radius:8px;">
                    <a href="{{ url }}" target="_blank" rel="noopener" style="display:inline-block;padding:12px 32px;font-size:15px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:1px;">
                      阅读全文 →
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px;background:#fafafa;text-align:center;">
              <p style="margin:0;font-size:12px;color:#bbb;line-height:1.6;">
                你收到这封邮件是因为你在 <a href="{{ site_url }}" style="color:#ff85a2;text-decoration:none;">ZhouJun's Blog</a> 订阅了新文章通知。
                <br>如果不想再收到通知，可以忽略此邮件（取消订阅功能即将上线）。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
