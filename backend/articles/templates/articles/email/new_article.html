<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f7f7f2;font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f2;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #dce2da;border-radius:8px;">
          <!-- Header -->
          <tr>
            <td style="padding:28px 36px 0;">
              <p style="margin:0;font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#657168;">Stack Frame · 新文章</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:16px 36px 30px;">
              <h1 style="margin:0 0 14px;font-size:21px;font-weight:600;color:#1f2a24;line-height:1.45;">{{ title }}</h1>
              {% if excerpt %}
              <p style="margin:0 0 24px;font-size:14px;color:#657168;line-height:1.9;">{{ excerpt }}</p>
              {% endif %}
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:#3f6b57;border-radius:6px;">
                    <a href="{{ url }}" target="_blank" rel="noopener" style="display:inline-block;padding:11px 26px;font-family:'SFMono-Regular','Cascadia Code',Consolas,monospace;font-size:13px;font-weight:600;letter-spacing:0.04em;color:#ffffff;text-decoration:none;">阅读全文 →</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:0 36px 28px;">
              <div style="border-top:1px solid #dce2da;padding-top:18px;">
                <p style="margin:0;font-size:12px;color:#9aa39b;line-height:1.9;">
                  你收到这封邮件，是因为你在 <a href="{{ site_url }}" style="color:#3f6b57;text-decoration:none;">Stack Frame</a> 订阅了新文章通知。<br>
                  不想再收到？<a href="{{ unsubscribe_url }}" style="color:#a45f45;text-decoration:none;">点此退订</a>
                </p>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
