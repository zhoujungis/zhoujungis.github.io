<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ZhouJun's Blog</title>
  <style>
    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #fff5f7;
      color: #4a3040;
    }
    .card { text-align: center; padding: 40px; }
    .card h1 { font-size: 5rem; margin: 0; color: #ff85a2; }
    .card p { font-size: 1rem; color: #9e7a8a; margin: 12px 0 24px; }
    .card a {
      display: inline-block; padding: 10px 28px;
      font-size: 0.85rem; color: #81d4c4;
      background: rgba(129,212,196,0.08); border: 1px solid rgba(129,212,196,0.3);
      border-radius: 8px; text-decoration: none; transition: background 0.2s;
    }
    .card a:hover { background: rgba(129,212,196,0.15); border-color: #81d4c4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>页面不存在</p>
    <a href="/">返回首页</a>
  </div>
  <script>
    // SPA fallback: store the original URL so the SPA can redirect back
    var path = window.location.pathname + window.location.search + window.location.hash;
    if (path !== '/' && path !== '/404.html') {
      try { sessionStorage.setItem('redirect', path); } catch(e) {}
      window.location.replace('/');
    }
  </script>
</body>
</html>
