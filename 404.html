<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-7173042291490259">
  <!-- GitHub Pages serves this file with a 404 status. It used to bounce every
       unknown path to "/" through sessionStorage, which made every dead URL look
       like a redirect (or a soft 404) to crawlers: Search Console reported the
       whole family as "page with redirect" and could never retire them.
       Now it answers honestly: a 404, noindex, with a few real exits. -->
  <meta name="robots" content="noindex">
  <title>404 — 尘世栈帧</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #fff5f7;
      color: #4a3040;
    }
    .card { text-align: center; padding: 40px; max-width: 38rem; }
    .card h1 { font-size: 5rem; margin: 0; color: #ff85a2; }
    .card p { font-size: 1rem; color: #9e7a8a; margin: 12px 0 8px; }
    .card .en { font-size: 0.85rem; color: #b0939f; margin: 0 0 24px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .links a {
      display: inline-block; padding: 10px 22px;
      font-size: 0.85rem; color: #81d4c4;
      background: rgba(129,212,196,0.08); border: 1px solid rgba(129,212,196,0.3);
      border-radius: 8px; text-decoration: none; transition: background 0.2s;
    }
    .links a:hover { background: rgba(129,212,196,0.15); border-color: #81d4c4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>这个页面不存在，或者已经被移动了。</p>
    <p class="en">This page does not exist, or it has moved.</p>
    <nav class="links">
      <a href="/">首页</a>
      <a href="/articles/">全部文章</a>
      <a href="/topics/">专题</a>
      <a href="/archives/">归档</a>
      <a href="/en/">English</a>
    </nav>
  </div>
  <script>
    // Slugs that were renamed or mistyped and are still referenced somewhere
    // (one article body links the short form of the resilience post). Sending
    // them to the real page beats returning a 404 for a URL that has an owner.
    var ALIASES = {
      '/article/resilience-timeout-retry-circuit-breaker/':
        '/article/resilience-timeout-retry-circuit-breaker-deep-dive/'
    };
    var here = window.location.pathname;
    if (!here.endsWith('/')) here += '/';
    if (ALIASES[here]) {
      window.location.replace(ALIASES[here]);
    } else if (/^\/tags\/[^/]+\/$/.test(here)) {
      // A tag that was renamed or merged: its old slug is still in Google's
      // index. The tag overview is the honest landing spot, and it beats a
      // dead end for a URL that used to have content.
      window.location.replace('/tags/');
    } else if (/^\/categories\/[^/]+\/$/.test(here)) {
      window.location.replace('/categories/');
    } else if (window.location.pathname.indexOf('/admin') === 0) {
      // Admin lives only inside the SPA and has no prerendered files, so a hard
      // load of /admin or /admin/dashboard lands here. Bounce just those paths
      // through the shell; every other unknown URL stays an honest 404.
      var path = window.location.pathname + window.location.search + window.location.hash;
      try { sessionStorage.setItem('redirect', path); } catch (e) {}
      window.location.replace('/');
    }
  </script>
</body>
</html>
