<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="cabBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050818"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3047"/>
      <stop offset="100%" stop-color="#16192e"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#cabBg)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">国产化超节点互联全栈方案 · 机柜示意</text>
  <text x="600" y="74" text-anchor="middle" fill="#a8d8ff" font-size="14">Scale-Up 域内 + Scale-Out 域间 · 开放以太网生态</text>
  <line x1="450" y1="92" x2="750" y2="92" stroke="#00e5ff" stroke-width="2"/>

  <!-- Three side-by-side racks -->
  <g>
    <!-- Rack 1 -->
    <g transform="translate(120,130)">
      <rect width="280" height="500" fill="url(#rack)" stroke="#3a4068" stroke-width="2" rx="6"/>
      <text x="140" y="30" text-anchor="middle" fill="#a8d8ff" font-size="13" font-weight="700">超节点 A · 8 卡 GPU 域</text>

      <!-- GPU slots -->
      <g>
        <rect x="20" y="60" width="240" height="42" fill="url(#gpu)" rx="3"/>
        <text x="40" y="86" fill="#fff" font-size="12" font-weight="700">GPU ×8</text>
        <text x="180" y="86" fill="#fff" font-size="11">国产壁仞 / 沐曦</text>

        <rect x="20" y="115" width="240" height="42" fill="#1a237e" rx="3"/>
        <text x="40" y="141" fill="#fff" font-size="12" font-weight="700">NVSwitch 等价</text>
        <text x="180" y="141" fill="#a8d8ff" font-size="11">国产 OISA 协议</text>

        <rect x="20" y="170" width="240" height="42" fill="url(#switch)" rx="3"/>
        <text x="40" y="196" fill="#fff" font-size="12" font-weight="700">ToR 交换</text>
        <text x="180" y="196" fill="#fff" font-size="11">51.2T 国产白盒</text>

        <rect x="20" y="225" width="240" height="42" fill="#37474f" rx="3"/>
        <text x="40" y="251" fill="#fff" font-size="12">存储节点</text>
        <text x="180" y="251" fill="#a8d8ff" font-size="11">NVMe-oF</text>

        <!-- Status LEDs -->
        <g>
          <circle cx="40" cy="310" r="4" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
          <circle cx="60" cy="310" r="4" fill="#00e676"/>
          <circle cx="80" cy="310" r="4" fill="#ff9100"/>
          <circle cx="100" cy="310" r="4" fill="#00e676"/>
          <circle cx="120" cy="310" r="4" fill="#00e676"/>
          <text x="40" y="335" fill="#a8d8ff" font-size="11">电源 · 风扇 · 温度 · 链路</text>

          <!-- airflow arrows -->
          <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.6">
            <path d="M150 305 L260 305 L260 350" marker-end="url(#arrow)"/>
          </g>
        </g>

        <!-- Bottom ports -->
        <g fill="#00e5ff">
          <rect x="30" y="380" width="20" height="14" rx="2"/>
          <rect x="60" y="380" width="20" height="14" rx="2"/>
          <rect x="90" y="380" width="20" height="14" rx="2"/>
          <rect x="120" y="380" width="20" height="14" rx="2"/>
          <rect x="150" y="380" width="20" height="14" rx="2"/>
          <rect x="180" y="380" width="20" height="14" rx="2"/>
          <rect x="210" y="380" width="20" height="14" rx="2"/>
          <rect x="240" y="380" width="20" height="14" rx="2"/>
        </g>
        <text x="140" y="430" text-anchor="middle" fill="#a8d8ff" font-size="11">8×400G 上行</text>

        <!-- Vendor tag -->
        <rect x="20" y="455" width="240" height="30" fill="#000" opacity="0.4" rx="3"/>
        <text x="140" y="475" text-anchor="middle" fill="#00e5ff" font-size="12" font-weight="700">奇异摩尔 · 全栈互联</text>
      </g>
    </g>

    <!-- Rack 2 (middle, highlighted) -->
    <g transform="translate(460,130)">
      <rect width="280" height="500" fill="url(#rack)" stroke="#00e5ff" stroke-width="3" rx="6"/>
      <text x="140" y="30" text-anchor="middle" fill="#00e5ff" font-size="13" font-weight="700">★ 超节点 B · 主干 ★</text>

      <rect x="20" y="60" width="240" height="42" fill="url(#gpu)" rx="3"/>
      <text x="40" y="86" fill="#fff" font-size="12" font-weight="700">GPU ×8</text>
      <text x="180" y="86" fill="#fff" font-size="11">MoE 训练主力</text>

      <rect x="20" y="115" width="240" height="42" fill="#311b92" rx="3"/>
      <text x="40" y="141" fill="#fff" font-size="12" font-weight="700">Scale-Up 域</text>
      <text x="180" y="141" fill="#a8d8ff" font-size="11">OSU IO 芯粒</text>

      <rect x="20" y="170" width="240" height="42" fill="url(#switch)" rx="3"/>
      <text x="40" y="196" fill="#fff" font-size="12" font-weight="700">Spine-Leaf</text>
      <text x="180" y="196" fill="#fff" font-size="11">Kiwi SNIC 800G</text>

      <rect x="20" y="225" width="240" height="42" fill="#37474f" rx="3"/>
      <text x="40" y="251" fill="#fff" font-size="12">RDMA 网卡</text>
      <text x="180" y="251" fill="#a8d8ff" font-size="11">IBGDA 直通</text>

      <g>
        <circle cx="40" cy="310" r="4" fill="#00e676"/>
        <circle cx="60" cy="310" r="4" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="80" cy="310" r="4" fill="#00e676"/>
        <circle cx="100" cy="310" r="4" fill="#00e676"/>
        <circle cx="120" cy="310" r="4" fill="#00e676"/>
      </g>

      <g fill="#ffd700">
        <rect x="30" y="380" width="20" height="14" rx="2"/>
        <rect x="60" y="380" width="20" height="14" rx="2"/>
        <rect x="90" y="380" width="20" height="14" rx="2"/>
        <rect x="120" y="380" width="20" height="14" rx="2"/>
        <rect x="150" y="380" width="20" height="14" rx="2"/>
        <rect x="180" y="380" width="20" height="14" rx="2"/>
        <rect x="210" y="380" width="20" height="14" rx="2"/>
        <rect x="240" y="380" width="20" height="14" rx="2"/>
      </g>
      <text x="140" y="430" text-anchor="middle" fill="#ffd700" font-size="11">8×800G IBGDA 直通</text>

      <rect x="20" y="455" width="240" height="30" fill="#000" opacity="0.4" rx="3"/>
      <text x="140" y="475" text-anchor="middle" fill="#00e5ff" font-size="12" font-weight="700">IBGDA Demo 平台</text>
    </g>

    <!-- Rack 3 -->
    <g transform="translate(800,130)">
      <rect width="280" height="500" fill="url(#rack)" stroke="#3a4068" stroke-width="2" rx="6"/>
      <text x="140" y="30" text-anchor="middle" fill="#a8d8ff" font-size="13" font-weight="700">超节点 C · Scale-Out</text>

      <rect x="20" y="60" width="240" height="42" fill="url(#gpu)" rx="3"/>
      <text x="40" y="86" fill="#fff" font-size="12" font-weight="700">GPU ×8</text>
      <text x="180" y="86" fill="#fff" font-size="11">推理 + 微调</text>

      <rect x="20" y="115" width="240" height="42" fill="#1a237e" rx="3"/>
      <text x="40" y="141" fill="#fff" font-size="12" font-weight="700">训练任务</text>
      <text x="180" y="141" fill="#a8d8ff" font-size="11">All-to-All</text>

      <rect x="20" y="170" width="240" height="42" fill="url(#switch)" rx="3"/>
      <text x="40" y="196" fill="#fff" font-size="12" font-weight="700">Spine 交换</text>
      <text x="180" y="196" fill="#fff" font-size="11">CPO 光互联</text>

      <rect x="20" y="225" width="240" height="42" fill="#37474f" rx="3"/>
      <text x="40" y="251" fill="#fff" font-size="12">存储节点</text>
      <text x="180" y="251" fill="#a8d8ff" font-size="11">CXL 内存池</text>

      <g>
        <circle cx="40" cy="310" r="4" fill="#00e676"/>
        <circle cx="60" cy="310" r="4" fill="#00e676"/>
        <circle cx="80" cy="310" r="4" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle cx="100" cy="310" r="4" fill="#ff9100"/>
        <circle cx="120" cy="310" r="4" fill="#00e676"/>
      </g>

      <g fill="#00e5ff">
        <rect x="30" y="380" width="20" height="14" rx="2"/>
        <rect x="60" y="380" width="20" height="14" rx="2"/>
        <rect x="90" y="380" width="20" height="14" rx="2"/>
        <rect x="120" y="380" width="20" height="14" rx="2"/>
        <rect x="150" y="380" width="20" height="14" rx="2"/>
        <rect x="180" y="380" width="20" height="14" rx="2"/>
        <rect x="210" y="380" width="20" height="14" rx="2"/>
        <rect x="240" y="380" width="20" height="14" rx="2"/>
      </g>
      <text x="140" y="430" text-anchor="middle" fill="#a8d8ff" font-size="11">8×400G 上行</text>

      <rect x="20" y="455" width="240" height="30" fill="#000" opacity="0.4" rx="3"/>
      <text x="140" y="475" text-anchor="middle" fill="#00e5ff" font-size="12" font-weight="700">奇异摩尔 · 全栈互联</text>
    </g>
  </g>

  <!-- Inter-rack links -->
  <g stroke="#00e5ff" stroke-width="2" fill="none">
    <path d="M400 290 L460 290"/>
    <path d="M740 290 L800 290"/>
    <path d="M400 320 L460 320" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M740 320 L800 320" stroke-dasharray="6 4" opacity="0.7"/>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(0,650)">
    <rect x="0" y="0" width="1200" height="50" fill="#000" opacity="0.4"/>
    <g font-size="12" fill="#a8d8ff">
      <rect x="40" y="18" width="16" height="14" fill="url(#gpu)" rx="2"/>
      <text x="64" y="30">GPU 节点</text>

      <rect x="160" y="18" width="16" height="14" fill="url(#switch)" rx="2"/>
      <text x="184" y="30">交换 / 网卡</text>

      <rect x="300" y="18" width="16" height="14" fill="#311b92" rx="2"/>
      <text x="324" y="30">OSU IO 芯粒</text>

      <circle cx="440" cy="25" r="6" fill="#00e676"/>
      <text x="454" y="30">运行正常</text>

      <circle cx="540" cy="25" r="6" fill="#ff9100"/>
      <text x="554" y="30">告警</text>
    </g>
  </g>
</svg>