<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="time" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg6)"/>

  <text x="600" y="44" text-anchor="middle" fill="#0d47a1" font-size="22" font-weight="700">光互联技术演进路径</text>
  <text x="600" y="70" text-anchor="middle" fill="#37474f" font-size="13">距离越近 → 延迟越低 · 功耗越低 · 系统设计更简化 · 成本下降</text>
  <line x1="430" y1="86" x2="770" y2="86" stroke="#0d47a1" stroke-width="2"/>

  <!-- Timeline -->
  <g transform="translate(80,200)">
    <line x1="0" y1="120" x2="1040" y2="120" stroke="url(#time)" stroke-width="6"/>

    <!-- Stage 1: Pluggable optics -->
    <g transform="translate(40,0)">
      <circle cx="80" cy="120" r="14" fill="#1565c0" stroke="#fff" stroke-width="3"/>
      <text x="80" y="100" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="700">阶段 1</text>
      <rect x="20" y="150" width="120" height="80" fill="#fff" stroke="#1565c0" stroke-width="2" rx="8"/>
      <text x="80" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">可插拔光模块</text>
      <text x="80" y="195" text-anchor="middle" font-size="11" fill="#37474f">QSFP-DD / OSFP</text>
      <text x="80" y="212" text-anchor="middle" font-size="11" fill="#37474f">前面板可维护</text>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#37474f" font-weight="700">当前主流</text>
    </g>

    <!-- Stage 2: NPO -->
    <g transform="translate(240,0)">
      <circle cx="80" cy="120" r="14" fill="#1976d2" stroke="#fff" stroke-width="3"/>
      <text x="80" y="100" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="700">阶段 2</text>
      <rect x="20" y="150" width="120" height="80" fill="#fff" stroke="#1976d2" stroke-width="2" rx="8"/>
      <text x="80" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1976d2">NPO</text>
      <text x="80" y="193" text-anchor="middle" font-size="11" fill="#37474f">近封装光学</text>
      <text x="80" y="208" text-anchor="middle" font-size="11" fill="#37474f">光引擎靠近 ASIC</text>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#37474f" font-weight="700">过渡阶段</text>
    </g>

    <!-- Stage 3: CPO (highlighted) -->
    <g transform="translate(440,0)">
      <circle cx="80" cy="120" r="18" fill="#ff6f00" stroke="#fff" stroke-width="3"/>
      <text x="80" y="100" text-anchor="middle" fill="#e65100" font-size="13" font-weight="700">★ 阶段 3 ★</text>
      <rect x="10" y="150" width="140" height="80" fill="#fff3e0" stroke="#ff6f00" stroke-width="3" rx="8"/>
      <text x="80" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">CPO</text>
      <text x="80" y="196" text-anchor="middle" font-size="11" fill="#37474f">共封装光学</text>
      <text x="80" y="211" text-anchor="middle" font-size="11" fill="#37474f">光引擎封装进 ASIC</text>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#e65100" font-weight="700">奇异摩尔重点布局</text>
    </g>

    <!-- Stage 4: OIO -->
    <g transform="translate(640,0)">
      <circle cx="80" cy="120" r="14" fill="#7b1fa2" stroke="#fff" stroke-width="3"/>
      <text x="80" y="100" text-anchor="middle" fill="#4a148c" font-size="13" font-weight="700">阶段 4</text>
      <rect x="20" y="150" width="120" height="80" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="8"/>
      <text x="80" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#7b1fa2">OIO</text>
      <text x="80" y="193" text-anchor="middle" font-size="11" fill="#37474f">光学 I/O</text>
      <text x="80" y="208" text-anchor="middle" font-size="11" fill="#37474f">裸片级光学接口</text>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#37474f" font-weight="700">下一代</text>
    </g>

    <!-- Stage 5: Optical-native -->
    <g transform="translate(840,0)">
      <circle cx="80" cy="120" r="14" fill="#4a148c" stroke="#fff" stroke-width="3"/>
      <text x="80" y="100" text-anchor="middle" fill="#4a148c" font-size="13" font-weight="700">阶段 5</text>
      <rect x="20" y="150" width="120" height="80" fill="#fff" stroke="#4a148c" stroke-width="2" rx="8"/>
      <text x="80" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">光内生</text>
      <text x="80" y="193" text-anchor="middle" font-size="11" fill="#37474f">集成于计算芯片</text>
      <text x="80" y="208" text-anchor="middle" font-size="11" fill="#37474f">光电融合终极形态</text>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#37474f" font-weight="700">远期</text>
    </g>

    <!-- Arrows -->
    <g stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)">
      <path d="M180 120 L220 120"/>
      <path d="M380 120 L420 120"/>
      <path d="M580 120 L620 120"/>
      <path d="M780 120 L820 120"/>
    </g>
  </g>

  <!-- Bottom: benefits diagram -->
  <g transform="translate(80,460)">
    <rect width="1040" height="110" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="8"/>
    <text x="520" y="30" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">演进收益：越靠近计算单元 → 综合优势越大</text>

    <g font-size="12" fill="#37474f">
      <g transform="translate(50,55)">
        <text font-weight="700" fill="#0d47a1">延迟 ↓</text>
        <text y="20">省去长走线与 DSP</text>
      </g>
      <g transform="translate(280,55)">
        <text font-weight="700" fill="#0d47a1">功耗 ↓</text>
        <text y="20">SerDes 数量减少</text>
      </g>
      <g transform="translate(510,55)">
        <text font-weight="700" fill="#0d47a1">带宽密度 ↑</text>
        <text y="20">单位面积更多端口</text>
      </g>
      <g transform="translate(740,55)">
        <text font-weight="700" fill="#0d47a1">成本 ↓</text>
        <text y="20">封装 + 测试环节简化</text>
      </g>
      <g transform="translate(900,55)">
        <text font-weight="700" fill="#0d47a1">设计 ↑</text>
        <text y="20">系统简化</text>
      </g>
    </g>
  </g>
</svg>