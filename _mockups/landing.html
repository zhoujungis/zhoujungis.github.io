<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>新首页预览 · Landing · ZhouJun's Blog</title>
<!-- 头像用项目内真实资源 -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="prefetch" as="image" href="../PIC.svg" />
<style>
:root {
  /* Sakura Cute — Light */
  --bg-primary: #fff5f7;
  --bg-secondary: #ffeef2;
  --bg-card: rgba(255, 255, 255, 0.85);
  --text-primary: #4a3040;
  --text-secondary: #9e7a8a;
  --accent-pink: #ff85a2;
  --accent-mint: #81d4c4;
  --accent-purple: #c9b1ff;
  --accent-yellow: #ffe0a0;
  --glass-bg: rgba(255, 255, 255, 0.75);
  --glass-border: rgba(255, 133, 162, 0.15);
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 4px 20px rgba(255, 133, 162, 0.12);
  --shadow-md: 0 8px 30px rgba(255, 133, 162, 0.20);
  --t-fast: 0.2s ease;
  --t-base: 0.3s ease;
  --font-main: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'Fira Code', 'Consolas', monospace;
}
[data-theme="dark"] {
  --bg-primary: #14121a;
  --bg-secondary: #1f1a26;
  --bg-card: rgba(36, 30, 44, 0.85);
  --text-primary: #f0e8ee;
  --text-secondary: #c5b0c0;
  --accent-pink: #ff9bb5;
  --accent-mint: #9ee0d3;
  --accent-purple: #d6c3ff;
  --accent-yellow: #ffe8b0;
  --glass-bg: rgba(36, 30, 44, 0.75);
  --glass-border: rgba(255, 155, 181, 0.18);
  --shadow-sm: 0 4px 20px rgba(255, 155, 181, 0.10);
  --shadow-md: 0 8px 30px rgba(255, 155, 181, 0.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(255, 133, 162, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(201, 177, 255, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(129, 212, 196, 0.04) 0%, transparent 50%);
  background-attachment: fixed;
  min-height: 100vh;
  transition: background-color var(--t-base), color var(--t-base);
}
[data-theme="dark"] body {
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(255, 155, 181, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(214, 195, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(158, 224, 211, 0.06) 0%, transparent 50%);
}

/* ---------- Floating particles (pure CSS) ---------- */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particles span {
  position: absolute; border-radius: 50%; filter: blur(1px);
  animation: float 18s linear infinite; opacity: .35;
}
.particles span:nth-child(1)  { left: 10%; top: 20%; width: 8px;  height: 8px;  background: var(--accent-pink); animation-delay: 0s;   animation-duration: 22s; }
.particles span:nth-child(2)  { left: 25%; top: 70%; width: 6px;  height: 6px;  background: var(--accent-purple); animation-delay: 4s;  animation-duration: 26s; }
.particles span:nth-child(3)  { left: 45%; top: 30%; width: 10px; height: 10px; background: var(--accent-mint); animation-delay: 8s;  animation-duration: 20s; }
.particles span:nth-child(4)  { left: 65%; top: 80%; width: 7px;  height: 7px;  background: var(--accent-pink); animation-delay: 2s;  animation-duration: 24s; }
.particles span:nth-child(5)  { left: 80%; top: 25%; width: 9px;  height: 9px;  background: var(--accent-yellow); animation-delay: 6s; animation-duration: 28s; }
.particles span:nth-child(6)  { left: 90%; top: 60%; width: 6px;  height: 6px;  background: var(--accent-purple); animation-delay: 10s; animation-duration: 30s; }
.particles span:nth-child(7)  { left: 35%; top: 90%; width: 8px;  height: 8px;  background: var(--accent-mint); animation-delay: 12s; animation-duration: 22s; }
.particles span:nth-child(8)  { left: 55%; top: 10%; width: 7px;  height: 7px;  background: var(--accent-pink); animation-delay: 14s; animation-duration: 26s; }
@keyframes float {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  10%  { opacity: .35; }
  90%  { opacity: .35; }
  100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .particles span, .avatar-status, .name span { animation: none !important; }
}

/* ---------- Theme toggle ---------- */
.theme-toggle {
  position: fixed; top: 14px; right: 16px; z-index: 100;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  cursor: pointer; font: 500 .8rem var(--font-main); color: var(--text-secondary);
}
.theme-toggle:hover { color: var(--accent-pink); }
.theme-toggle .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent-pink);
  box-shadow: 0 0 8px var(--accent-pink);
}

/* ---------- App Header (slim clone) ---------- */
.app-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: 60px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 2px 16px rgba(255, 133, 162, 0.08);
}
[data-theme="dark"] .app-header { box-shadow: 0 2px 16px rgba(255, 155, 181, 0.10); }
.header-inner {
  max-width: 1100px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem;
}
.logo {
  font-size: 1.35rem; font-weight: 700; color: var(--accent-pink);
  text-decoration: none; letter-spacing: 0.5px;
}
.nav-desktop { display: flex; gap: .25rem; }
.nav-link {
  text-decoration: none; color: var(--text-secondary);
  font-size: .875rem; padding: .35rem .75rem; border-radius: 8px;
  transition: color var(--t-fast), background var(--t-fast);
}
.nav-link:hover { color: var(--text-primary); background: rgba(255,133,162,.06); }
.nav-link.active { color: var(--accent-pink); font-weight: 600; background: rgba(255,133,162,.08); }
@media (max-width: 767px) { .nav-desktop { display: none; } }

/* ---------- Landing ---------- */
.page-landing {
  position: relative; z-index: 1;
  min-height: calc(100vh - 60px);
  display: flex; align-items: center;
  padding: 32px 24px; max-width: 1100px; margin: 0 auto;
}
.landing {
  display: grid; grid-template-columns: 5fr 7fr; gap: 64px;
  align-items: center; width: 100%;
}

/* Avatar column */
.avatar-zone { display: flex; flex-direction: column; align-items: center; }
.avatar-frame {
  width: 240px; height: 240px; position: relative;
  padding: 4px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  box-shadow: 0 8px 32px rgba(255, 133, 162, 0.30), 0 0 0 1px rgba(255,255,255,.4);
  transition: transform var(--t-base);
}
.avatar-frame:hover { transform: translateY(-4px) rotate(-2deg); }
.avatar-frame .inner {
  width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: var(--bg-card);
}
.avatar-frame img {
  width: 100%; height: 100%; display: block;
  border-radius: 50%; object-fit: cover;
}
.avatar-fallback {
  display: none; width: 100%; height: 100%;
  align-items: center; justify-content: center;
  font-size: 6rem; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.avatar-status {
  position: absolute; right: 18px; bottom: 18px; width: 16px; height: 16px;
  background: var(--accent-mint); border-radius: 50%;
  box-shadow: 0 0 0 4px var(--bg-card), 0 0 12px rgba(129, 212, 196, 0.6);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px var(--bg-card), 0 0 12px rgba(129,212,196,.6); }
  50%      { box-shadow: 0 0 0 6px var(--bg-card), 0 0 18px rgba(129,212,196,.9); }
}
.avatar-handle {
  margin-top: 18px; font-size: .9rem; color: var(--text-secondary);
  letter-spacing: .04em;
}

/* Intro column */
.intro-zone { animation: slideIn 0.6s ease 0.1s both; }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.landing__name {
  font-size: clamp(2.4rem, 4vw, 3.4rem);
  font-weight: 700; line-height: 1.1;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.landing__tagline {
  font-family: var(--font-mono);
  letter-spacing: .15em;
  color: var(--accent-pink);
  font-size: .92rem;
  text-transform: uppercase;
  margin-top: 12px;
}
.landing__bio {
  font-size: 1.05rem; line-height: 1.85;
  color: var(--text-secondary);
  max-width: 540px;
  margin: 24px 0 36px;
}
.landing__cta {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.cta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 26px; border-radius: 10px;
  text-decoration: none; font-weight: 600; font-size: 1rem;
  transition: transform var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
  cursor: pointer; border: 0;
}
.cta--primary {
  background: var(--accent-pink); color: #fff;
  box-shadow: 0 4px 16px rgba(255, 133, 162, 0.30);
}
.cta--primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 133, 162, 0.45);
}
.cta--secondary {
  background: transparent;
  border: 1.5px solid var(--accent-pink);
  color: var(--accent-pink);
}
.cta--secondary:hover { background: rgba(255, 133, 162, 0.06); }

.landing__social {
  display: flex; gap: 24px;
  margin-top: 36px; list-style: none; padding: 0;
}
.landing__social a {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--text-secondary); text-decoration: none;
  font-size: .92rem;
  transition: color var(--t-fast), transform var(--t-fast);
}
.landing__social a:hover {
  color: var(--accent-pink); transform: translateY(-2px);
}

/* ---------- Responsive ---------- */
@media (max-width: 1023px) {
  .landing { grid-template-columns: 1fr; gap: 32px; text-align: center; }
  .avatar-frame { width: 180px; height: 180px; }
  .landing__bio { max-width: none; margin-left: auto; margin-right: auto; }
  .landing__cta { justify-content: center; }
  .landing__social { justify-content: center; }
}
@media (max-width: 767px) {
  .page-landing { padding: 24px 16px; }
  .avatar-frame { width: 120px; height: 120px; }
  .avatar-fallback { font-size: 3rem; }
  .landing__name { font-size: 2rem; }
  .landing__tagline { font-size: .8rem; }
}

/* ---------- Mock-only badge ---------- */
.mock-badge {
  position: fixed; bottom: 16px; left: 16px; z-index: 100;
  padding: 8px 14px; background: var(--glass-bg); border: 1px dashed var(--accent-pink);
  border-radius: 8px; font-size: .75rem; color: var(--accent-pink);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
</style>
</head>
<body>

<!-- Background particles -->
<div class="particles" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<!-- App header (clone) -->
<header class="app-header">
  <div class="header-inner">
    <a href="#" class="logo">个人博客</a>
    <nav class="nav-desktop">
      <a href="#" class="nav-link active">首页</a>
      <a href="#" class="nav-link">文章</a>
      <a href="#" class="nav-link">归档</a>
      <a href="#" class="nav-link">分类</a>
      <a href="#" class="nav-link">标签</a>
      <a href="#" class="nav-link">照片墙</a>
      <a href="#" class="nav-link">友链</a>
      <a href="#" class="nav-link">足迹</a>
      <a href="#" class="nav-link">关于</a>
      <a href="#" class="nav-link">搜索</a>
    </nav>
  </div>
</header>

<!-- Theme toggle -->
<button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
  <span class="dot"></span><span id="theme-label">深色模式</span>
</button>

<!-- Mockup badge -->
<div class="mock-badge">预览 · 设计稿 · 不是最终代码</div>

<!-- Landing -->
<main class="page-landing">
  <article class="landing">
    <!-- Avatar column -->
    <section class="avatar-zone">
      <div class="avatar-frame">
        <div class="inner">
          <img id="avatar-img" src="../PIC.svg" alt="Zhou Jun"
               onerror="this.style.display='none'; document.getElementById('avatar-fb').style.display='flex';" />
          <div class="avatar-fallback" id="avatar-fb">Z</div>
        </div>
        <span class="avatar-status" title="在线"></span>
      </div>
      <p class="avatar-handle">@zhoujun · 📍 上海</p>
    </section>

    <!-- Intro column -->
    <section class="intro-zone">
      <h1 class="landing__name">Zhou Jun</h1>
      <p class="landing__tagline">探索代码 · 写作 · 光影</p>
      <p class="landing__bio">
        工程师 · 写作者。用代码构建工具,用文字记录思考,
        用脚步丈量世界。👋 欢迎来到我的角落。
      </p>
      <div class="landing__cta">
        <a href="#articles" class="cta cta--primary">📖 读文章 →</a>
        <a href="#about" class="cta cta--secondary">关于我</a>
      </div>
      <ul class="landing__social">
        <li><a href="#" target="_blank" rel="noopener">🐙 GitHub</a></li>
        <li><a href="#">📮 Email</a></li>
        <li><a href="#">📡 RSS</a></li>
      </ul>
    </section>
  </article>
</main>

<script>
  // Theme toggle
  const btn = document.getElementById('theme-toggle');
  const lbl = document.getElementById('theme-label');
  let dark = false;
  btn.addEventListener('click', () => {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    lbl.textContent = dark ? '浅色模式' : '深色模式';
  });
</script>
</body>
</html>
