<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="55%" stop-color="#141a3f"/>
      <stop offset="100%" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.5">
    <path d="M0 720 H1600" stroke="url(#grid)" stroke-width="1"/>
    <path d="M0 540 H1600" stroke="url(#grid)" stroke-width="1"/>
    <path d="M0 360 H1600" stroke="url(#grid)" stroke-width="1"/>
    <path d="M0 180 H1600" stroke="url(#grid)" stroke-width="1"/>
    <path d="M200 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M400 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M600 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M800 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M1000 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M1200 0 V900" stroke="url(#grid)" stroke-width="1"/>
    <path d="M1400 0 V900" stroke="url(#grid)" stroke-width="1"/>
  </g>

  <!-- 左侧：vLLM 代表色（青蓝）-->
  <g transform="translate(180 250)">
    <rect x="0" y="0" width="220" height="400" rx="14" fill="#0e1530" stroke="url(#accentA)" stroke-width="2"/>
    <text x="110" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="700" fill="#22d3ee">vLLM</text>
    <line x1="20" y1="64" x2="200" y2="64" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1"/>

    <text x="20" y="98" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1">PagedAttention</text>
    <text x="20" y="122" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1">Continuous Batching</text>
    <text x="20" y="146" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1">Prefix Cache</text>
    <text x="20" y="170" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1">通用生态最厚</text>

    <g transform="translate(20 210)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0a1124"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">throughput</text>
      <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#accentA)" opacity="0.45"/>
    </g>
    <g transform="translate(20 262)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0a1124"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">latency</text>
      <rect x="0" y="0" width="115" height="40" rx="6" fill="url(#accentA)" opacity="0.35"/>
    </g>
    <g transform="translate(20 314)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0a1124"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">memory</text>
      <rect x="0" y="0" width="170" height="40" rx="6" fill="url(#accentA)" opacity="0.4"/>
    </g>
  </g>

  <!-- 中间：SGLang 代表色（紫粉）-->
  <g transform="translate(690 180)">
    <rect x="0" y="0" width="220" height="470" rx="14" fill="#16092a" stroke="url(#accentB)" stroke-width="2.5"/>
    <text x="110" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="24" font-weight="800" fill="#f472b6">SGLang</text>
    <line x1="20" y1="66" x2="200" y2="66" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>

    <text x="20" y="100" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fbcfe8">RadixAttention</text>
    <text x="20" y="124" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fbcfe8">压缩 FSM</text>
    <text x="20" y="148" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fbcfe8">零开销调度</text>
    <text x="20" y="172" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fbcfe8">结构化生成专线</text>

    <g transform="translate(20 214)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#190824"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fbcfe8">throughput</text>
      <rect x="0" y="0" width="178" height="40" rx="6" fill="url(#accentB)" opacity="0.5"/>
    </g>
    <g transform="translate(20 266)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#190824"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fbcfe8">latency</text>
      <rect x="0" y="0" width="168" height="40" rx="6" fill="url(#accentB)" opacity="0.45"/>
    </g>
    <g transform="translate(20 318)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#190824"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fbcfe8">memory</text>
      <rect x="0" y="0" width="155" height="40" rx="6" fill="url(#accentB)" opacity="0.4"/>
    </g>
    <g transform="translate(20 370)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#190824"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fbcfe8">prefix-share</text>
      <rect x="0" y="0" width="180" height="40" rx="6" fill="url(#accentB)" opacity="0.6"/>
    </g>
  </g>

  <!-- 右侧：TensorRT-LLM 代表色（金黄）-->
  <g transform="translate(1200 250)">
    <rect x="0" y="0" width="220" height="400" rx="14" fill="#1a1206" stroke="url(#accentC)" stroke-width="2"/>
    <text x="110" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#facc15">TensorRT-LLM</text>
    <line x1="20" y1="62" x2="200" y2="62" stroke="#facc15" stroke-opacity="0.4" stroke-width="1"/>

    <text x="20" y="96" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fde68a">算子融合</text>
    <text x="20" y="120" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fde68a">In-flight Batching</text>
    <text x="20" y="144" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fde68a">FP8 / INT8</text>
    <text x="20" y="168" font-family="ui-sans-serif, system-ui" font-size="13" fill="#fde68a">NV 全栈延迟下限</text>

    <g transform="translate(20 208)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#1a1206"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fde68a">throughput</text>
      <rect x="0" y="0" width="172" height="40" rx="6" fill="url(#accentC)" opacity="0.45"/>
    </g>
    <g transform="translate(20 260)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#1a1206"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fde68a">latency</text>
      <rect x="0" y="0" width="180" height="40" rx="6" fill="url(#accentC)" opacity="0.7"/>
    </g>
    <g transform="translate(20 312)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#1a1206"/>
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="13" fill="#fde68a">memory</text>
      <rect x="0" y="0" width="140" height="40" rx="6" fill="url(#accentC)" opacity="0.35"/>
    </g>
  </g>

  <!-- 顶部标题 -->
  <g transform="translate(800 80)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="2">从 vLLM 到 SGLang</text>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="4">LLM 推理框架的终极内卷</text>
  </g>

  <!-- 底部数据流 -->
  <g transform="translate(120 770)" opacity="0.85">
    <text font-family="ui-monospace, monospace" font-size="13" fill="#64748b">
      throughput · latency · KV cache · prefix share · speculative decode · FP8 · disaggregated prefill/decode</text>
  </g>

  <!-- 中间连线：以箭头表示"演进/竞争" -->
  <g transform="translate(400 440)">
    <path d="M0 0 L290 0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <polygon points="290,-5 300,0 290,5" fill="#64748b"/>
    <text x="100" y="-10" font-family="ui-sans-serif, system-ui" font-size="12" fill="#64748b">通用 → 结构化 → 极致延迟</text>
  </g>
  <g transform="translate(910 460)">
    <path d="M0 0 L290 0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <polygon points="290,-5 300,0 290,5" fill="#64748b"/>
    <text x="60" y="-10" font-family="ui-sans-serif, system-ui" font-size="12" fill="#64748b">生态 → 系统级软硬协同</text>
  </g>
</svg>