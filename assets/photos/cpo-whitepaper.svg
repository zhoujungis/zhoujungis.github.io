<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fff3e0"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <radialGradient id="glow7" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg7)"/>

  <!-- Glow -->
  <ellipse cx="600" cy="380" rx="500" ry="200" fill="url(#glow7)"/>

  <!-- Title -->
  <text x="600" y="56" text-anchor="middle" fill="#0d47a1" font-size="22" font-weight="700">《共封装光学（CPO）技术白皮书》正式发布</text>
  <text x="600" y="82" text-anchor="middle" fill="#37474f" font-size="13">发起方：香港科技大学（广州）· 参与：奇异摩尔、曦望、壁仞、图灵量子、奇点光子</text>
  <line x1="380" y1="98" x2="820" y2="98" stroke="#0d47a1" stroke-width="2"/>

  <!-- Centerpiece: The white paper book/report -->
  <g transform="translate(440,170)">
    <!-- Shadow -->
    <ellipse cx="160" cy="430" rx="180" ry="14" fill="#000" opacity="0.15"/>

    <!-- Book base -->
    <rect x="0" y="0" width="320" height="420" fill="url(#book)" rx="6"/>
    <!-- Spine band -->
    <rect x="0" y="0" width="320" height="40" fill="#0d47a1"/>
    <text x="160" y="26" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" letter-spacing="4">TECHNICAL WHITE PAPER</text>

    <!-- Page -->
    <rect x="20" y="60" width="280" height="340" fill="url(#page)" rx="3" stroke="#cfd8dc" stroke-width="1"/>

    <!-- Page content -->
    <g transform="translate(40,90)">
      <text x="0" y="0" font-size="20" font-weight="800" fill="#0d47a1">共封装光学</text>
      <text x="0" y="24" font-size="20" font-weight="800" fill="#0d47a1">CPO 技术白皮书</text>

      <line x1="0" y1="38" x2="120" y2="38" stroke="#ff6f00" stroke-width="2"/>

      <text x="0" y="60" font-size="11" fill="#37474f">Co-Packaged Optics</text>
      <text x="0" y="78" font-size="11" fill="#37474f">Technical White Paper</text>

      <!-- Tech highlights -->
      <g transform="translate(0,108)" font-size="10" fill="#546e7a">
        <rect x="0" y="0" width="240" height="2" fill="#cfd8dc"/>
        <text x="0" y="20" font-weight="700" fill="#0d47a1">主要内容</text>
        <text x="0" y="38">· CPO 技术原理与封装路线</text>
        <text x="0" y="54">· 国产光引擎演进路径</text>
        <text x="0" y="70">· 与 NPO / OIO 的对比分析</text>
        <text x="0" y="86">· 国产算力场景下的实践</text>

        <text x="0" y="116" font-weight="700" fill="#0d47a1">应用场景</text>
        <text x="0" y="134">· 智算集群 Scale-Up 互联</text>
        <text x="0" y="150">· 800G / 1.6T 高速网络</text>
        <text x="0" y="166">· 国产替代与生态共建</text>
      </g>

      <!-- Bottom logo -->
      <g transform="translate(0,290)">
        <text x="0" y="0" font-size="9" fill="#90a4ae">发起：香港科技大学（广州）</text>
        <text x="0" y="14" font-size="9" fill="#90a4ae">参与：奇异摩尔 · 曦望 · 壁仞 · 图灵量子 · 奇点光子</text>
      </g>
    </g>

    <!-- Ribbon -->
    <g transform="translate(140,150)">
      <rect x="-10" y="0" width="50" height="20" fill="#c62828" transform="rotate(-15)"/>
      <text x="15" y="14" text-anchor="middle" fill="#fff" font-size="10" font-weight="700" transform="rotate(-15)">正式发布</text>
    </g>
  </g>

  <!-- Side participating orgs -->
  <g transform="translate(80,180)" font-size="12">
    <rect width="320" height="100" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="6"/>
    <text x="160" y="28" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="700">发起单位</text>
    <line x1="40" y1="38" x2="280" y2="38" stroke="#0d47a1" stroke-width="1"/>
    <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="700">香港科技大学（广州）</text>
    <text x="160" y="82" text-anchor="middle" fill="#37474f" font-size="11">The Hong Kong University of Science and Technology (Guangzhou)</text>
  </g>

  <g transform="translate(80,300)" font-size="12">
    <rect width="320" height="220" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="6"/>
    <text x="160" y="28" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="700">参与编写单位</text>
    <line x1="40" y1="38" x2="280" y2="38" stroke="#0d47a1" stroke-width="1"/>
    <g transform="translate(40,55)" fill="#37474f">
      <text>· 奇异摩尔</text>
      <text y="22">· 曦望 Sunrise</text>
      <text y="44">· 壁仞科技</text>
      <text y="66">· 图灵量子</text>
      <text y="88">· 奇点光子</text>
    </g>
    <text x="160" y="180" text-anchor="middle" fill="#0d47a1" font-size="11" font-style="italic">汇聚产学研力量，定义国产 CPO 路线</text>
  </g>

  <!-- Right side: timeline -->
  <g transform="translate(800,180)" font-size="12">
    <rect width="320" height="340" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="6"/>
    <text x="160" y="28" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="700">发布意义</text>
    <line x1="40" y1="38" x2="280" y2="38" stroke="#0d47a1" stroke-width="1"/>

    <g transform="translate(40,65)" fill="#37474f">
      <g>
        <circle cx="0" cy="0" r="6" fill="#ff6f00"/>
        <text x="14" y="4" font-weight="700" fill="#0d47a1">统一行业话语</text>
        <text x="14" y="22">为国产 CPO 演进提供共同语言</text>
      </g>
      <g transform="translate(0,55)">
        <circle cx="0" cy="0" r="6" fill="#ff6f00"/>
        <text x="14" y="4" font-weight="700" fill="#0d47a1">明确技术路径</text>
        <text x="14" y="22">从可插拔 → NPO → CPO → OIO</text>
      </g>
      <g transform="translate(0,110)">
        <circle cx="0" cy="0" r="6" fill="#ff6f00"/>
        <text x="14" y="4" font-weight="700" fill="#0d47a1">支撑生态共建</text>
        <text x="14" y="22">光引擎 / 封装 / 芯片协同推进</text>
      </g>
      <g transform="translate(0,165)">
        <circle cx="0" cy="0" r="6" fill="#ff6f00"/>
        <text x="14" y="4" font-weight="700" fill="#0d47a1">加速国产替代</text>
        <text x="14" y="22">降低对国外光器件供应链依赖</text>
      </g>
      <g transform="translate(0,220)">
        <circle cx="0" cy="0" r="6" fill="#ff6f00"/>
        <text x="14" y="4" font-weight="700" fill="#0d47a1">引领下一代光互联</text>
        <text x="14" y="22">算力底座升级的关键抓手</text>
      </g>
    </g>
  </g>

  <!-- Bottom signature -->
  <g transform="translate(0,610)">
    <rect width="1200" height="60" fill="#0d47a1" opacity="0.85"/>
    <text x="600" y="38" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">WAIC 2026 · 智联为擎 · 合一共进 · 国产光互联迈向新阶段</text>
  </g>
</svg>