<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="xpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e57c2"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
    <linearGradient id="osu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="cpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg8)"/>

  <text x="600" y="44" text-anchor="middle" fill="#0d47a1" font-size="22" font-weight="700">OSU（Optical Scale-Up）IO 芯粒 · 与 CPO 融合路径</text>
  <text x="600" y="70" text-anchor="middle" fill="#37474f" font-size="13">奇异摩尔前瞻布局：把"光"送进计算芯粒内部</text>
  <line x1="350" y1="86" x2="850" y2="86" stroke="#0d47a1" stroke-width="2"/>

  <!-- Left: Traditional (before) -->
  <g transform="translate(80,140)">
    <rect width="320" height="380" fill="#fff" stroke="#90a4ae" stroke-width="2" rx="8"/>
    <rect x="0" y="0" width="320" height="36" fill="#90a4ae" rx="8"/>
    <text x="160" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">传统方案：可插拔光模块</text>

    <g transform="translate(40,70)">
      <rect width="240" height="100" fill="#cfd8dc" rx="4"/>
      <text x="120" y="50" text-anchor="middle" fill="#37474f" font-size="13" font-weight="700">xPU 计算芯片</text>
      <text x="120" y="70" text-anchor="middle" fill="#546e7a" font-size="10">（国产 GPU / NPU）</text>

      <text x="120" y="120" text-anchor="middle" fill="#37474f" font-size="11">↓ 长距离 SerDes 走线 + DSP</text>

      <rect y="135" width="240" height="80" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5" rx="4"/>
      <text x="120" y="165" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">前面板可插拔模块</text>
      <text x="120" y="183" text-anchor="middle" fill="#37474f" font-size="10">QSFP-DD / OSFP 800G</text>

      <text x="120" y="240" text-anchor="middle" fill="#37474f" font-size="11">↓ 光纤</text>
      <text x="120" y="270" text-anchor="middle" fill="#37474f" font-size="11">远端交换 / 集群</text>
    </g>

    <g transform="translate(40,335)" font-size="11" fill="#c62828">
      <text x="0" y="0" font-weight="700">问题：</text>
      <text x="0" y="20">· 高延迟 · 高功耗 · 带宽密度受限</text>
    </g>
  </g>

  <!-- Arrow between -->
  <g transform="translate(420,310)" stroke="#0d47a1" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M0 0 L80 0"/>
    <text x="40" y="-10" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="700" stroke="none">融合演进</text>
  </g>

  <!-- Right: OSU IO Chiplet + CPO -->
  <g transform="translate(540,140)">
    <rect width="580" height="380" fill="#fff" stroke="#0d47a1" stroke-width="3" rx="8"/>
    <rect x="0" y="0" width="580" height="36" fill="url(#xpu)" rx="8"/>
    <text x="290" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">奇异摩尔：OSU IO 芯粒 + CPO 融合方案</text>

    <!-- Interposer / substrate -->
    <g transform="translate(30,70)">
      <rect width="520" height="280" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5" rx="6"/>
      <text x="260" y="22" text-anchor="middle" fill="#4527a0" font-size="13" font-weight="700">先进封装基板（Interposer）</text>

      <!-- XPU die -->
      <g transform="translate(40,50)">
        <rect width="160" height="100" fill="url(#xpu)" stroke="#311b92" stroke-width="2" rx="6"/>
        <text x="80" y="48" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">xPU Die</text>
        <text x="80" y="68" text-anchor="middle" fill="#d1c4e9" font-size="11">国产 GPU / NPU</text>
        <text x="80" y="86" text-anchor="middle" fill="#d1c4e9" font-size="10">计算芯粒</text>
      </g>

      <!-- OSU IO Chiplet (the new piece) -->
      <g transform="translate(220,30)">
        <rect width="160" height="100" fill="url(#osu)" stroke="#bf360c" stroke-width="2" rx="6"/>
        <text x="80" y="36" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">OSU IO 芯粒</text>
        <text x="80" y="56" text-anchor="middle" fill="#ffe0b2" font-size="11">Optical Scale-Up</text>
        <text x="80" y="74" text-anchor="middle" fill="#ffe0b2" font-size="10">电信号 → 光信号</text>
        <text x="80" y="92" text-anchor="middle" fill="#ffe0b2" font-size="10">高速 SerDes + 调制</text>
      </g>

      <!-- CPO block on the right -->
      <g transform="translate(400,50)">
        <rect width="100" height="100" fill="url(#cpo)" stroke="#006064" stroke-width="2" rx="6"/>
        <text x="50" y="40" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">CPO</text>
        <text x="50" y="58" text-anchor="middle" fill="#b2ebf2" font-size="10">共封装光学</text>
        <text x="50" y="74" text-anchor="middle" fill="#b2ebf2" font-size="9">激光器 / 调制器</text>
        <text x="50" y="88" text-anchor="middle" fill="#b2ebf2" font-size="9">光波导 / 探测器</text>
      </g>

      <!-- Internal connections -->
      <g stroke="#0d47a1" stroke-width="2" fill="none">
        <path d="M120 100 L260 80" marker-end="url(#arr)"/>
        <path d="M260 110 L440 100" marker-end="url(#arr)"/>
      </g>

      <!-- Optical fibers coming out -->
      <g stroke="#e65100" stroke-width="2" fill="none">
        <path d="M500 70 L540 40" stroke-dasharray="3 3"/>
        <path d="M500 100 L540 70" stroke-dasharray="3 3"/>
        <path d="M500 130 L540 100" stroke-dasharray="3 3"/>
      </g>
      <text x="560" y="55" font-size="11" fill="#e65100" font-weight="700">光纤输出</text>

      <!-- Legend -->
      <g transform="translate(0,180)" font-size="11" fill="#37474f">
        <rect x="0" y="0" width="12" height="12" fill="url(#xpu)" stroke="#311b92" rx="2"/>
        <text x="18" y="10">xPU 芯粒</text>
        <rect x="100" y="0" width="12" height="12" fill="url(#osu)" stroke="#bf360c" rx="2"/>
        <text x="118" y="10">OSU IO 芯粒</text>
        <rect x="220" y="0" width="12" height="12" fill="url(#cpo)" stroke="#006064" rx="2"/>
        <text x="238" y="10">CPO 共封装光学</text>
        <rect x="360" y="0" width="12" height="12" fill="#ede7f6" stroke="#7e57c2" rx="2"/>
        <text x="378" y="10">先进封装基板</text>
      </g>
    </g>
  </g>

  <!-- Bottom: ecosystem partnerships -->
  <g transform="translate(80,540)">
    <rect width="1040" height="130" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="8"/>
    <text x="520" y="30" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">奇异摩尔生态合作成果</text>

    <g transform="translate(40,55)" font-size="12" fill="#37474f">
      <g>
        <rect x="0" y="0" width="440" height="60" fill="#fff3e0" stroke="#ff6f00" stroke-width="1" rx="6"/>
        <text x="20" y="25" fill="#e65100" font-weight="700">× 图灵量子</text>
        <text x="20" y="45">共研下一代基于 xPU-CPO 的关键技术</text>
      </g>
      <g transform="translate(520,0)">
        <rect x="0" y="0" width="440" height="60" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" rx="6"/>
        <text x="20" y="25" fill="#01579b" font-weight="700">× 奇点光子</text>
        <text x="20" y="45">共同探索基于芯粒间高速数据接口的 NPO / CPO 技术</text>
      </g>
    </g>
  </g>
</svg>