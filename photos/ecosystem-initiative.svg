<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050818"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg9)"/>

  <!-- Decorative grid -->
  <g stroke="#1f2a5a" stroke-width="1" opacity="0.4">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200"/>
    <path d="M200 0 V700 M400 0 V700 M600 0 V700 M800 0 V700 M1000 0 V700"/>
  </g>

  <text x="600" y="48" text-anchor="middle" fill="#00e5ff" font-size="22" font-weight="700">国产超节点生态共建倡议行动</text>
  <text x="600" y="74" text-anchor="middle" fill="#a8d8ff" font-size="13">驱动国产算力的三条指数曲线：训练 Scaling Law · 推理 Test-time Scaling · Agent 调用量爆发</text>
  <line x1="380" y1="92" x2="820" y2="92" stroke="#00e5ff" stroke-width="2"/>

  <!-- Center node -->
  <g transform="translate(600,380)">
    <circle r="120" fill="url(#ringGlow)"/>
    <circle r="80" fill="#0d47a1" stroke="#00e5ff" stroke-width="3"/>
    <circle r="65" fill="#1565c0"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">国产超节点</text>
    <text y="14" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">生态共建</text>
    <text y="34" text-anchor="middle" fill="#b3e5fc" font-size="11">国产算力 · 自主协同</text>
  </g>

  <!-- Surrounding orgs -->
  <g font-size="13" fill="#fff">
    <!-- Top: 发起单位 -->
    <g transform="translate(600,180)">
      <rect x="-180" y="-30" width="360" height="60" fill="#1a237e" stroke="#00e5ff" stroke-width="2" rx="8"/>
      <text y="-5" text-anchor="middle" font-weight="700" fill="#00e5ff">发起单位</text>
      <text y="18" text-anchor="middle" fill="#fff">上海市算力网络协会 · 上海AI实验室 · 中国信通院华东分院</text>
    </g>

    <!-- Witness -->
    <g transform="translate(140,250)">
      <rect x="-100" y="-25" width="200" height="50" fill="#37474f" stroke="#90a4ae" stroke-width="1" rx="6"/>
      <text y="-5" text-anchor="middle" font-size="11" fill="#b0bec5">见证</text>
      <text y="15" text-anchor="middle" font-weight="700">上海市经信委</text>
    </g>

    <g transform="translate(1060,250)">
      <rect x="-100" y="-25" width="200" height="50" fill="#37474f" stroke="#90a4ae" stroke-width="1" rx="6"/>
      <text y="-5" text-anchor="middle" font-size="11" fill="#b0bec5">见证</text>
      <text y="15" text-anchor="middle" font-weight="700">无线电管理处</text>
    </g>

    <!-- Left column -->
    <g transform="translate(140,360)">
      <rect x="-110" y="-25" width="220" height="50" fill="#311b92" stroke="#7e57c2" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">中兴通讯</text>
      <text y="18" text-anchor="middle" fill="#d1c4e9" font-size="11">通信设备</text>
    </g>

    <g transform="translate(140,440)">
      <rect x="-110" y="-25" width="220" height="50" fill="#1b5e20" stroke="#66bb6a" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">曙光信息</text>
      <text y="18" text-anchor="middle" fill="#c8e6c9" font-size="11">高性能计算</text>
    </g>

    <g transform="translate(140,520)">
      <rect x="-110" y="-25" width="220" height="50" fill="#bf360c" stroke="#ff7043" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">壁仞科技</text>
      <text y="18" text-anchor="middle" fill="#ffccbc" font-size="11">国产 GPU</text>
    </g>

    <g transform="translate(140,600)">
      <rect x="-110" y="-25" width="220" height="50" fill="#0d47a1" stroke="#42a5f5" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">沐曦 MetaX</text>
      <text y="18" text-anchor="middle" fill="#bbdefb" font-size="11">国产 GPU</text>
    </g>

    <!-- Right column -->
    <g transform="translate(1060,360)">
      <rect x="-110" y="-25" width="220" height="50" fill="#4a148c" stroke="#ba68c8" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">天数智芯</text>
      <text y="18" text-anchor="middle" fill="#e1bee7" font-size="11">国产 GPU</text>
    </g>

    <g transform="translate(1060,440)">
      <rect x="-110" y="-25" width="220" height="50" fill="#e65100" stroke="#ffb74d" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">燧原科技</text>
      <text y="18" text-anchor="middle" fill="#ffe0b2" font-size="11">国产 AI 芯片</text>
    </g>

    <g transform="translate(1060,520)">
      <rect x="-110" y="-25" width="220" height="50" fill="#006064" stroke="#4dd0e1" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">商汤科技</text>
      <text y="18" text-anchor="middle" fill="#b2ebf2" font-size="11">AI 应用</text>
    </g>

    <g transform="translate(1060,600)">
      <rect x="-110" y="-25" width="220" height="50" fill="#00695c" stroke="#4db6ac" stroke-width="1.5" rx="6"/>
      <text y="0" text-anchor="middle" font-weight="700">奇异摩尔</text>
      <text y="18" text-anchor="middle" fill="#b2dfdb" font-size="11">全栈互联</text>
    </g>
  </g>

  <!-- Connecting lines from orgs to center -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4 4">
    <line x1="600" y1="210" x2="600" y2="300"/>
    <line x1="240" y1="250" x2="500" y2="350"/>
    <line x1="960" y1="250" x2="700" y2="350"/>
    <line x1="250" y1="360" x2="490" y2="370"/>
    <line x1="250" y1="440" x2="490" y2="400"/>
    <line x1="250" y1="520" x2="490" y2="430"/>
    <line x1="250" y1="600" x2="490" y2="460"/>
    <line x1="950" y1="360" x2="710" y2="370"/>
    <line x1="950" y1="440" x2="710" y2="400"/>
    <line x1="950" y1="520" x2="710" y2="430"/>
    <line x1="950" y1="600" x2="710" y2="460"/>
  </g>

  <!-- Floating data points -->
  <g fill="#ffd700" opacity="0.9">
    <circle cx="350" cy="290" r="3"/>
    <circle cx="850" cy="290" r="3"/>
    <circle cx="400" cy="490" r="3"/>
    <circle cx="800" cy="490" r="3"/>
  </g>
</svg>