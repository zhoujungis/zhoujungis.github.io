<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#000018"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#3f51b5"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7c2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#1c2730"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#stage)"/>

  <!-- Backdrop screen with conference branding -->
  <rect x="60" y="40" width="1080" height="420" fill="url(#screen)" rx="8"/>
  <rect x="60" y="40" width="1080" height="420" fill="#000" opacity="0.35" rx="8"/>

  <!-- Brand on backdrop -->
  <g>
    <text x="600" y="130" text-anchor="middle" fill="#00e5ff" font-size="34" font-weight="800" letter-spacing="6">WAIC 2026</text>
    <text x="600" y="180" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600" letter-spacing="3">AI 网络前沿生态论坛</text>
    <text x="600" y="220" text-anchor="middle" fill="#a8d8ff" font-size="18" letter-spacing="2">智联为擎 · 合一共进</text>
    <line x1="500" y1="245" x2="700" y2="245" stroke="#00e5ff" stroke-width="2"/>

    <!-- Network illustration on backdrop -->
    <g transform="translate(600,330)" stroke="#ffffff" stroke-width="2" fill="#00e5ff">
      <circle cx="-80" cy="0" r="10"/>
      <circle cx="80" cy="0" r="10"/>
      <circle cx="0" cy="-40" r="10"/>
      <circle cx="0" cy="40" r="10"/>
      <circle cx="0" cy="0" r="14" fill="#ffd700"/>
      <line x1="-70" y1="0" x2="-10" y2="-40"/>
      <line x1="70" y1="0" x2="10" y2="-40"/>
      <line x1="-70" y1="0" x2="-10" y2="40"/>
      <line x1="70" y1="0" x2="10" y2="40"/>
    </g>
  </g>

  <!-- Spotlight effect -->
  <ellipse cx="600" cy="500" rx="350" ry="120" fill="url(#spot)"/>

  <!-- Podium -->
  <rect x="510" y="540" width="180" height="160" fill="url(#podium)" rx="4"/>
  <rect x="510" y="540" width="180" height="14" fill="#455a64"/>
  <text x="600" y="615" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="700" letter-spacing="2">奇异摩尔</text>
  <text x="600" y="638" text-anchor="middle" fill="#b0bec5" font-size="11">Strange Mole</text>
  <!-- Microphone -->
  <line x1="600" y1="540" x2="600" y2="500" stroke="#90a4ae" stroke-width="3"/>
  <circle cx="600" cy="495" r="8" fill="#37474f" stroke="#b0bec5" stroke-width="2"/>

  <!-- Speaker (stylized silhouette) -->
  <g transform="translate(600,460)">
    <!-- Head -->
    <ellipse cx="0" cy="-15" rx="22" ry="26" fill="#3e2723"/>
    <!-- Body / suit -->
    <path d="M-45 30 Q-45 -10 0 -10 Q45 -10 45 30 L50 80 L-50 80 Z" fill="#1a237e"/>
    <!-- Collar -->
    <path d="M-10 -10 L0 8 L10 -10 Z" fill="#ffffff"/>
    <!-- Tie -->
    <path d="M-3 8 L3 8 L5 35 L0 45 L-5 35 Z" fill="#c62828"/>
    <!-- Arm gesturing -->
    <path d="M30 0 Q60 -10 80 5 Q70 25 50 20 Z" fill="#1a237e"/>
    <!-- Hand -->
    <ellipse cx="82" cy="12" rx="8" ry="6" fill="#3e2723"/>
  </g>

  <!-- Floor / stage -->
  <rect x="0" y="700" width="1200" height="0" fill="#000"/>
  <rect x="0" y="500" width="1200" height="200" fill="#0a0e27"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#1f2a5a" stroke-width="2"/>

  <!-- Speaker name plate / caption -->
  <g>
    <rect x="380" y="660" width="440" height="32" fill="#000" opacity="0.55" rx="4"/>
    <text x="600" y="682" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">田陌晨 · 奇异摩尔创始人兼董事长 · 论坛致辞</text>
  </g>
</svg>