<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="oldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <linearGradient id="newBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg5)"/>

  <text x="600" y="44" text-anchor="middle" fill="#0d47a1" font-size="22" font-weight="700">IBGDA vs 传统 IBRC · All-to-All 通信性能对比</text>
  <text x="600" y="70" text-anchor="middle" fill="#37474f" font-size="13">国产 GPU + 国产 RDMA 网卡实测 · 接近英伟达 IBGDA 水平</text>
  <line x1="400" y1="86" x2="800" y2="86" stroke="#0d47a1" stroke-width="2"/>

  <!-- Throughput comparison chart -->
  <g transform="translate(60,120)">
    <text x="260" y="0" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">吞吐量对比 (单位: GB/s, 越高越好)</text>
    <!-- axis -->
    <line x1="60" y1="20" x2="60" y2="280" stroke="#37474f" stroke-width="1.5"/>
    <line x1="60" y1="280" x2="500" y2="280" stroke="#37474f" stroke-width="1.5"/>
    <!-- gridlines -->
    <g stroke="#cfd8dc" stroke-dasharray="3 3">
      <line x1="60" y1="220" x2="500" y2="220"/>
      <line x1="60" y1="160" x2="500" y2="160"/>
      <line x1="60" y1="100" x2="500" y2="100"/>
      <line x1="60" y1="40" x2="500" y2="40"/>
    </g>
    <!-- y-axis labels -->
    <g font-size="11" fill="#37474f" text-anchor="end">
      <text x="55" y="284">0</text>
      <text x="55" y="224">20</text>
      <text x="55" y="164">40</text>
      <text x="55" y="104">60</text>
      <text x="55" y="44">80</text>
    </g>

    <!-- Bars -->
    <g>
      <!-- Group 1: 单次小消息带宽 -->
      <text x="120" y="298" text-anchor="middle" font-size="11" fill="#37474f">单次小消息带宽</text>
      <rect x="85" y="220" width="30" height="60" fill="url(#oldBar)" rx="2"/>
      <text x="100" y="215" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">15</text>
      <rect x="125" y="80" width="30" height="200" fill="url(#newBar)" rx="2"/>
      <text x="140" y="75" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="700">52</text>

      <!-- Group 2: 原始小包吞吐 -->
      <text x="240" y="298" text-anchor="middle" font-size="11" fill="#37474f">原始小包吞吐</text>
      <rect x="205" y="200" width="30" height="80" fill="url(#oldBar)" rx="2"/>
      <text x="220" y="195" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">22</text>
      <rect x="245" y="50" width="30" height="230" fill="url(#newBar)" rx="2"/>
      <text x="260" y="45" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="700">75</text>

      <!-- Group 3: 合并发送吞吐 -->
      <text x="360" y="298" text-anchor="middle" font-size="11" fill="#37474f">合并发送吞吐</text>
      <rect x="325" y="180" width="30" height="100" fill="url(#oldBar)" rx="2"/>
      <text x="340" y="175" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">28</text>
      <rect x="365" y="30" width="30" height="250" fill="url(#newBar)" rx="2"/>
      <text x="380" y="25" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="700">82</text>

      <!-- Group 4: All-to-All 带宽 -->
      <text x="480" y="298" text-anchor="middle" font-size="11" fill="#37474f">All-to-All 带宽</text>
      <rect x="445" y="160" width="30" height="120" fill="url(#oldBar)" rx="2"/>
      <text x="460" y="155" text-anchor="middle" font-size="11" fill="#37474f" font-weight="700">32</text>
      <rect x="485" y="20" width="30" height="260" fill="url(#newBar)" rx="2"/>
      <text x="500" y="15" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="700">88</text>
    </g>

    <!-- Legend -->
    <g transform="translate(160,330)" font-size="11" fill="#37474f">
      <rect x="0" y="0" width="14" height="14" fill="url(#oldBar)" rx="2"/>
      <text x="20" y="12">传统 IBRC 方案</text>
      <rect x="120" y="0" width="14" height="14" fill="url(#newBar)" rx="2"/>
      <text x="140" y="12">IBGDA 直通方案 (国产)</text>
    </g>
  </g>

  <!-- Latency comparison -->
  <g transform="translate(60,500)">
    <text x="260" y="0" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">All-to-All 通信延迟 (单位: μs, 越低越好)</text>

    <!-- Two horizontal bars -->
    <text x="0" y="35" font-size="12" fill="#37474f">传统 IBRC</text>
    <rect x="100" y="22" width="280" height="22" fill="url(#oldBar)" rx="2"/>
    <text x="395" y="38" font-size="12" fill="#37474f" font-weight="700">~ 18 μs</text>

    <text x="0" y="80" font-size="12" fill="#37474f">IBGDA 直通</text>
    <rect x="100" y="67" width="160" height="22" fill="url(#newBar)" rx="2"/>
    <text x="275" y="83" font-size="12" fill="#0d47a1" font-weight="700">~ 10 μs</text>

    <!-- improvement arrow -->
    <g transform="translate(120,105)" font-size="11" fill="#00838f">
      <text x="0" y="0">↓ 延迟缩短约 44%，接近翻倍提升</text>
    </g>

    <text x="0" y="140" font-size="12" fill="#0d47a1" font-weight="700">额外收益：</text>
    <text x="0" y="160" font-size="11" fill="#37474f">✓ 小包惩罚被彻底消除   ✓ MoE 训练 / 推理效率显著提升   ✓ CPU 算力释放回前台任务</text>
  </g>

  <!-- Right side: improvement summary -->
  <g transform="translate(700,120)">
    <rect width="440" height="380" fill="#fff" stroke="#0d47a1" stroke-width="2" rx="10"/>
    <text x="220" y="35" text-anchor="middle" fill="#0d47a1" font-size="16" font-weight="700">核心提升效果</text>
    <line x1="80" y1="50" x2="360" y2="50" stroke="#0d47a1" stroke-width="1"/>

    <g font-size="13" fill="#37474f">
      <g transform="translate(30,80)">
        <circle cx="0" cy="0" r="18" fill="#00e676"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">↑</text>
        <text x="30" y="-3" font-weight="700" fill="#0d47a1">单次小消息带宽</text>
        <text x="30" y="14">从 15 → 52 GB/s，提升 247%</text>
      </g>

      <g transform="translate(30,135)">
        <circle cx="0" cy="0" r="18" fill="#00e676"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">↑</text>
        <text x="30" y="-3" font-weight="700" fill="#0d47a1">原始小包吞吐</text>
        <text x="30" y="14">从 22 → 75 GB/s，提升 240%</text>
      </g>

      <g transform="translate(30,190)">
        <circle cx="0" cy="0" r="18" fill="#00e676"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">↑</text>
        <text x="30" y="-3" font-weight="700" fill="#0d47a1">合并发送吞吐</text>
        <text x="30" y="14">从 28 → 82 GB/s，提升 193%</text>
      </g>

      <g transform="translate(30,245)">
        <circle cx="0" cy="0" r="18" fill="#ff5252"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">↓</text>
        <text x="30" y="-3" font-weight="700" fill="#0d47a1">All-to-All 延迟</text>
        <text x="30" y="14">从 18 → 10 μs，压降 44%</text>
      </g>

      <g transform="translate(30,300)">
        <circle cx="0" cy="0" r="18" fill="#42a5f5"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">✓</text>
        <text x="30" y="-3" font-weight="700" fill="#0d47a1">小包惩罚</text>
        <text x="30" y="14">被彻底消除</text>
      </g>
    </g>
  </g>
</svg>