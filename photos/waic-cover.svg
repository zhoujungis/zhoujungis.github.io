<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1f4e"/>
      <stop offset="100%" stop-color="#0d0a2e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#1f2a5a" stroke-width="1" opacity="0.4">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200"/>
    <path d="M200 0 V480 M400 0 V480 M600 0 V480 M800 0 V480 M1000 0 V480"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M180 360 L420 200 L720 280 L1020 160" filter="url(#blur1)"/>
    <path d="M180 360 L420 200" stroke-width="2"/>
    <path d="M420 200 L720 280" stroke-width="2"/>
    <path d="M720 280 L1020 160" stroke-width="2"/>
    <path d="M180 360 L720 280" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4"/>
    <path d="M420 200 L1020 160" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Glowing nodes (super-node clusters) -->
  <g>
    <circle cx="180" cy="360" r="55" fill="url(#glow)" opacity="0.6"/>
    <circle cx="180" cy="360" r="28" fill="url(#nodeGrad)" stroke="#fff" stroke-width="2"/>
    <text x="180" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">节点1</text>

    <circle cx="420" cy="200" r="65" fill="url(#glow)" opacity="0.6"/>
    <circle cx="420" cy="200" r="32" fill="url(#nodeGrad)" stroke="#fff" stroke-width="2"/>
    <text x="420" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">超节点</text>

    <circle cx="720" cy="280" r="60" fill="url(#glow)" opacity="0.6"/>
    <circle cx="720" cy="280" r="30" fill="url(#nodeGrad)" stroke="#fff" stroke-width="2"/>
    <text x="720" y="285" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">智算集群</text>

    <circle cx="1020" cy="160" r="55" fill="url(#glow)" opacity="0.6"/>
    <circle cx="1020" cy="160" r="28" fill="url(#nodeGrad)" stroke="#fff" stroke-width="2"/>
    <text x="1020" y="165" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">节点N</text>
  </g>

  <!-- Floating data packets -->
  <g fill="#ffd700">
    <rect x="290" y="270" width="10" height="10" rx="2" opacity="0.9"/>
    <rect x="560" y="230" width="8" height="8" rx="2" opacity="0.8"/>
    <rect x="860" y="210" width="10" height="10" rx="2" opacity="0.9"/>
  </g>

  <!-- Title block -->
  <g>
    <text x="60" y="80" fill="#00e5ff" font-size="20" letter-spacing="4" font-weight="600">WAIC 2026 · 上海</text>
    <text x="60" y="135" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="2">国产AI算力互联</text>
    <text x="60" y="180" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="2">全栈方案首次亮相</text>
    <text x="60" y="225" fill="#a8b4ff" font-size="18" letter-spacing="1">智联为擎 · 合一共进 · AI 网络前沿生态论坛</text>
    <line x1="60" y1="245" x2="240" y2="245" stroke="#00e5ff" stroke-width="3"/>
  </g>

  <!-- Bottom meta -->
  <g fill="#7e8bc4" font-size="14">
    <text x="60" y="445">奇异摩尔首次亮相 WAIC 2026</text>
    <text x="60" y="465" fill="#a8b4ff">国产超节点生态共建倡议正式启动 · CPO 技术白皮书发布 · IBGDA Demo</text>
  </g>

  <!-- Right side decoration: chip illustration -->
  <g transform="translate(1080,360)">
    <rect x="-40" y="-40" width="80" height="80" rx="6" fill="#1a1f4e" stroke="#00e5ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#00e5ff" font-size="13" font-weight="bold">RDMA</text>
    <text x="0" y="22" text-anchor="middle" fill="#00e5ff" font-size="10">800G</text>
    <g stroke="#00e5ff" stroke-width="1.5">
      <path d="M-50 -20 H-40 M-50 0 H-40 M-50 20 H-40"/>
      <path d="M40 -20 H50 M40 0 H50 M40 20 H50"/>
      <path d="M-20 -50 V-40 M0 -50 V-40 M20 -50 V-40"/>
      <path d="M-20 40 V50 M0 40 V50 M20 40 V50"/>
    </g>
  </g>
</svg>